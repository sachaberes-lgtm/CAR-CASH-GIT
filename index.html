<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CASH CAR</title>
<meta name="description" content="CASH CAR — runner arcade 3D : fonce, saute, vrille, surfe les nuages et amasse une fortune. Une seule vie.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--pix:'Press Start 2P',monospace}
  html,body{margin:0;padding:0;overflow:hidden;background:#ffffff;font-family:var(--pix);user-select:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 54%,rgba(60,26,70,.34) 100%)}
  /* étalonnage cinéma du rendu 3D : couleurs plus riches, contraste doux */
  body>canvas{filter:saturate(1.14) contrast(1.05) brightness(1.02)}
  #scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 2px,transparent 2px 4px);opacity:.22}
  #speedFx{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(45,20,55,.55) 100%);opacity:0}
  /* immersion nuage : voile blanc laiteux quand on traverse un banc */
  #cloudFx{position:absolute;inset:0;opacity:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%,rgba(255,245,236,.99) 0%,rgba(255,236,222,.94) 46%,rgba(255,222,200,.88) 100%)}
  /* speed lines anime plein écran (dessinées en canvas) */
  #slCv{position:absolute;inset:0;width:100%;height:100%}
  .panel{background:rgba(12,8,34,.75);border:2px solid #00eaff;
    box-shadow:0 0 14px rgba(0,234,255,.35),inset 0 0 18px rgba(0,234,255,.08);padding:14px 16px}
  #carInfo{position:absolute;top:16px;left:16px;max-width:300px}
  #carName{font-size:13px;line-height:1.5;color:#ffb000;text-shadow:0 0 10px rgba(255,176,0,.6)}
  #carLevel{font-size:8px;line-height:1.6;color:#9ae6ff;margin-top:6px}
  /* compteur d'argent — OR MASSIF 3D */
  #money{position:absolute;top:14px;left:50%;transform:translateX(-50%) perspective(420px) rotateX(8deg);
    padding:12px 24px 14px;
    background:rgba(24,12,30,.62);border:1px solid rgba(255,196,80,.4);border-radius:14px;
    box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 26px rgba(255,170,50,.25),inset 0 0 22px rgba(255,180,60,.08)}
  #moneyTxt{display:block;font-size:31px;letter-spacing:2px;
    background:linear-gradient(180deg,#fff8d8 0%,#ffd75e 38%,#ff9d2e 68%,#a85e08 88%,#ffd75e 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 0 #6b3c00) drop-shadow(0 4px 1px #402300) drop-shadow(0 8px 16px rgba(0,0,0,.55))}
  #moneyTxt .dz{-webkit-text-fill-color:#57431a;color:#57431a}
  #record{position:absolute;top:150px;left:50%;transform:translateX(-50%);font-size:9px;color:#8f84c8}
  #resetBtn{position:absolute;top:16px;right:16px;pointer-events:auto;cursor:pointer;
    font-family:var(--pix);font-size:12px;
    background:rgba(90,10,30,.85);color:#ffd9d0;
    border:2px solid #ff3924;box-shadow:0 0 14px rgba(255,57,36,.4);
    padding:14px 18px;text-shadow:0 0 8px rgba(255,57,36,.8)}
  #resetBtn:hover{background:rgba(140,15,40,.9)}
  .sndBtn{position:absolute;top:16px;pointer-events:auto;cursor:pointer;
    font-family:var(--pix);font-size:12px;
    background:rgba(10,40,70,.85);color:#c8ecff;
    border:2px solid #00eaff;box-shadow:0 0 14px rgba(0,234,255,.35);
    padding:14px 14px;text-shadow:0 0 8px rgba(0,234,255,.7)}
  .sndBtn:hover{background:rgba(15,60,100,.9)}
  .sndBtn.off{color:#5a6a78;border-color:#3a4a58;box-shadow:none;text-shadow:none;background:rgba(20,26,34,.85)}
  #sndBtn{right:150px}
  #voxBtn{right:280px}
  #speedo{position:absolute;bottom:210px;right:20px;text-align:right;min-width:150px}
  #minimap{position:absolute;bottom:20px;right:20px;width:176px;height:176px;border:2px solid #9aa0aa;border-radius:4px;background:rgba(18,18,24,.5);box-shadow:0 0 12px rgba(0,0,0,.25)}
  #speedVal{font-size:30px;line-height:1.2;color:#ff3ec8;text-shadow:0 0 16px rgba(255,62,200,.7);display:inline-block;transition:color .25s;transform-origin:100% 50%}
  #runStats{font-family:var(--pix);font-size:8px;letter-spacing:2px;color:#8fa4c4;margin:2px 0 6px;display:none}
  #speedUnit{font-size:9px;color:#9ae6ff;margin-top:4px}
  #cpInfo{position:absolute;bottom:20px;left:20px;font-size:9px;line-height:1.7;color:#9ae6ff}
  #cpBar{width:240px;height:14px;background:#0c0d18;border:2px solid #00eaff;margin-top:8px;overflow:hidden}
  #cpFill{height:100%;width:0%;background:linear-gradient(90deg,#ff3924,#ffb000,#62e062)}
  #nitroWrap{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:320px}
  #styleBar{height:8px;background:#0c0d18;border:2px solid #ff3ec8;margin-bottom:6px;overflow:hidden;box-shadow:0 0 10px rgba(255,62,200,.35)}
  #styleFill{height:100%;width:0%;background:repeating-linear-gradient(90deg,#ff3ec8 0 10px,#b3208c 10px 14px)}
  #styleFill.fever{background:repeating-linear-gradient(90deg,#ffd75e 0 10px,#ffb000 10px 14px)}
  #feverGlow{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(255,62,200,.55);display:none}
  #flash{position:absolute;inset:0;background:#ff2020;opacity:0;transition:opacity .5s}
  #nitroLbl{font-size:9px;color:#9ae6ff;text-align:center;margin-bottom:6px;text-shadow:0 0 8px rgba(0,234,255,.6)}
  #pwrChip{font-size:9px;text-align:center;margin-bottom:6px;letter-spacing:1px;display:none;text-shadow:0 0 10px rgba(255,255,255,.35)}
  #pwrChip span{margin:0 6px}
  #nitroBar{height:18px;background:#0c0d18;border:2px solid #00eaff;overflow:hidden;display:flex;box-shadow:inset 0 0 10px rgba(0,0,0,.8),0 0 12px rgba(0,234,255,.3)}
  #nitroR{height:100%;background:repeating-linear-gradient(90deg,#ff8c1a 0 12px,#c96500 12px 16px);width:50%}
  #nitroX{height:100%;background:repeating-linear-gradient(90deg,#1c35e0 0 12px,#101f8f 12px 16px);width:0%}
  #msg{position:absolute;top:13%;left:50%;transform:translateX(-50%);font-size:22px;line-height:1.5;color:#ffb000;text-shadow:0 0 18px rgba(255,176,0,.7);opacity:0;transition:opacity .3s;text-align:center;white-space:nowrap}
  /* verdicts de figures — OR 3D ÉPIQUE */
  #trickBox{position:absolute;top:22%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;perspective:640px}
  .trick{font-family:var(--pix);font-size:16px;line-height:1.5;letter-spacing:1px;margin:6px 0;
    background:linear-gradient(180deg,#fffbe8,#ffd75e 42%,#ff9d2e 78%,#8a4d00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 #5c3600) drop-shadow(0 5px 10px rgba(0,0,0,.5));
    animation:trickPop .95s cubic-bezier(.17,1.3,.32,1) forwards}
  .trick.big{font-size:24px}
  .trick.m1{font-size:24px}
  .trick.m2{font-size:34px;filter:drop-shadow(0 3px 0 #5c3600) drop-shadow(0 0 18px rgba(255,170,60,.6)) drop-shadow(0 7px 14px rgba(0,0,0,.5));animation-duration:1.2s}
  .trick.m3{font-size:46px;background:linear-gradient(180deg,#ffffff,#ffe9a0 30%,#ff9d2e 58%,#ff3ec8 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #4a2500) drop-shadow(0 0 30px rgba(255,180,70,.95)) drop-shadow(0 12px 22px rgba(0,0,0,.55));animation-duration:1.5s}
  @keyframes trickPop{0%{transform:scale(.2) rotateX(50deg);opacity:0}16%{transform:scale(1.28) rotateX(-6deg);opacity:1}30%{transform:scale(1) rotateX(0)}75%{opacity:1}100%{opacity:0;transform:scale(1) translateY(-30px)}}
  #turnHint{position:absolute;top:33%;left:50%;transform:translateX(-50%);font-size:44px;color:#ff3924;opacity:0;text-shadow:0 0 16px rgba(255,57,36,.8);transition:opacity .15s}
  #airPie{position:absolute;top:40%;right:7%;width:110px;height:110px;display:none;filter:drop-shadow(0 0 8px rgba(0,234,255,.5))}
  #overlay{position:fixed;inset:0;background:rgba(6,4,16,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;z-index:5}
  #overlay h1{font-family:var(--pix);margin:0;line-height:1.4;text-align:center}
  /* ------- LOGO 3D OR (partagé accueil + intro) ------- */
  .lg{position:relative;display:inline-block;line-height:1.2}
  .lg::before{content:attr(data-t);position:absolute;left:0;top:0;width:100%;z-index:-1;color:#4a2a00;
    transform:translateY(.09em);
    text-shadow:0 .015em 0 #6e3f00,0 .03em 0 #5c3300,0 .05em 0 #472700,0 .07em 0 #331c00,0 .16em .3em rgba(0,0,0,.7)}
  .lg.gold{background:linear-gradient(180deg,#fffdf2 0%,#ffe9a0 28%,#ffc400 52%,#b06c05 74%,#ffe9a0 96%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 .35em rgba(255,200,80,.5))}
  .lg.grad{background:linear-gradient(180deg,#fff3c0,#ffd75e 40%,#ff8a3d 72%,#ff3ec8);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 .35em rgba(255,110,190,.45))}
  .lg::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;
    background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.95) 50%,transparent 68%) 180% 0/240% 100% no-repeat;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:lgShine 3.4s ease-in-out infinite}
  @keyframes lgShine{0%,18%{background-position:180% 0}58%,100%{background-position:-90% 0}}
  #overlay h2{font-family:var(--pix);font-size:11px;margin:14px 0 0;color:#00eaff;text-shadow:0 0 12px rgba(0,234,255,.7)}
  #overlay p{max-width:640px;text-align:center;line-height:1.9;opacity:.92;font-size:15px;font-family:'Segoe UI',Arial,sans-serif}
  #overlay .go{margin-top:22px;font-family:var(--pix);font-size:14px;color:#ffb000;animation:pulse 1.2s infinite;text-shadow:0 0 12px rgba(255,176,0,.7)}
  #finalScore{font-family:var(--pix);font-size:28px;margin:16px 0;display:none;
    background:linear-gradient(180deg,#fff6cf,#ffd75e 40%,#ff9d2e 78%,#a85e08);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 #5c3600) drop-shadow(0 6px 12px rgba(0,0,0,.5))}
  kbd{background:#1a1433;border:1px solid #00eaff;border-radius:3px;padding:2px 8px;font-size:12px;font-family:'Segoe UI',Arial,sans-serif}
  @keyframes pulse{50%{opacity:.4}}
  /* --- classement top 10 --- */
  #lbBox{margin:16px 0;width:360px;max-width:88vw}
  .lbTitle{font-family:var(--pix);font-size:13px;color:#ffd75e;text-align:center;margin-bottom:10px;text-shadow:0 0 12px rgba(255,215,94,.6)}
  .lbRow{display:flex;align-items:center;font-family:var(--pix);font-size:10px;line-height:2;color:#9ae6ff;padding:3px 10px;border-bottom:1px solid rgba(0,234,255,.12)}
  .lbRow.hl{color:#ffb000;background:rgba(255,176,0,.14);text-shadow:0 0 8px rgba(255,176,0,.6);box-shadow:inset 0 0 12px rgba(255,176,0,.15)}
  .lbRank{width:30px;color:#8f84c8;text-align:right;padding-right:12px}
  .lbName{flex:1;text-align:left;letter-spacing:2px}
  .lbScore{color:#62e062}
  .lbRow.hl .lbScore{color:#ffd75e}
  .lbEmpty{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;color:#8f84c8;text-align:center;padding:6px}
  #nameEntry{display:none;flex-direction:column;align-items:center;gap:12px;margin:8px 0 4px}
  #nameEntry span{font-family:var(--pix);font-size:11px;color:#ff3ec8;text-shadow:0 0 12px rgba(255,62,200,.6)}
  #nameInput{font-family:var(--pix);font-size:18px;text-transform:uppercase;text-align:center;width:190px;padding:12px;background:#0c0d18;border:2px solid #00eaff;color:#ffd75e;letter-spacing:4px;outline:none;box-shadow:0 0 14px rgba(0,234,255,.4)}
  #nameSave{font-family:var(--pix);font-size:12px;cursor:pointer;background:rgba(20,60,30,.85);color:#7dff9b;border:2px solid #62e062;padding:12px 22px;box-shadow:0 0 14px rgba(98,224,98,.4)}
  #nameSave:hover{background:rgba(30,90,45,.9)}

  /* ------- ÉCRANS MODERNES (accueil / game over) ------- */
  #overlay{background:radial-gradient(1200px 700px at 50% 30%,rgba(74,34,58,.55),rgba(10,6,16,.93));backdrop-filter:blur(10px);gap:6px}
  #overlay h1{font-size:54px;letter-spacing:8px;display:flex;gap:26px;
    transform:perspective(720px) rotateX(11deg);transform-origin:50% 60%;
    filter:drop-shadow(0 22px 30px rgba(0,0,0,.45))}
  #tagline{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;letter-spacing:5px;text-transform:uppercase;color:#d4b39a;opacity:.85;margin:2px 0 14px}
  #ovSub{font-size:13px;color:#ff5e7a;text-shadow:0 0 16px rgba(255,60,90,.6);margin:6px 0 0;letter-spacing:6px}
  #finalScore{font-size:32px;margin:10px 0 2px;letter-spacing:1px}
  #bestChip{font-family:var(--pix);font-size:9px;letter-spacing:2px;color:#ffd75e;border:1px solid rgba(255,215,94,.4);border-radius:999px;padding:8px 16px;margin:8px 0 4px;background:rgba(255,215,94,.07)}
  #lbBox{width:400px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .lbTitle{font-size:11px;letter-spacing:3px;color:#ffd75e;text-shadow:none;margin-bottom:8px}
  .lbRow{border-bottom:1px solid rgba(255,255,255,.06);color:#c8dcf2;font-size:9px}
  .lbRow.hl{background:rgba(255,176,0,.12);box-shadow:none;border-radius:6px}
  #ctrlRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:18px 0 4px}
  .kc{font-family:var(--pix);font-size:9px;letter-spacing:1px;color:#dfeeff;text-align:center;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:9px 13px 7px;line-height:1.1}
  .kc i{display:block;font-style:normal;font-family:'Segoe UI',Arial,sans-serif;font-size:10px;color:#8fa4c4;letter-spacing:.5px;margin-top:5px;text-transform:lowercase}
  #overlay .go{margin-top:20px;font-size:13px;letter-spacing:4px;color:#0c0d16;background:linear-gradient(180deg,#ffe9a0,#ffc400);
    border:none;border-radius:999px;padding:16px 46px;animation:none;cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,215,94,.5),0 8px 30px rgba(255,176,0,.35);transition:transform .12s,box-shadow .12s;text-shadow:none}
  #overlay .go:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 0 1px rgba(255,215,94,.8),0 12px 40px rgba(255,176,0,.55)}
  #nameEntry span{font-size:9px;letter-spacing:2px}
  #nameInput{border-radius:10px;border:1px solid rgba(0,234,255,.5);box-shadow:none}
  #nameSave{border-radius:999px;border:1px solid #62e062;box-shadow:none}
  /* ------- INTRO STUDIO 1.61 : accumulation → FISSION ------- */
  #splash{position:fixed;inset:0;background:radial-gradient(900px 600px at 50% 46%,#191024,#000 75%);z-index:40;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .7s;overflow:hidden}
  #fxCv{position:absolute;inset:0;width:100%;height:100%}
  #spStage{position:relative;text-align:center;z-index:2}
  #spNum{font-family:var(--pix);font-size:clamp(64px,14vw,120px);letter-spacing:8px;opacity:0;transform:scale(.5);
    transition:opacity .8s ease,transform .6s cubic-bezier(.18,.9,.28,1.35);
    background:linear-gradient(180deg,#fffdf0,#ffe9a0 32%,#ffb000 58%,#7c4a00 80%,#ffe9a0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 34px rgba(255,190,60,.8)) drop-shadow(0 5px 0 #4a2a00)}
  #spNum.on{opacity:1;transform:scale(1)}
  #spNum.boom{opacity:0;transform:scale(3.6);filter:blur(10px) drop-shadow(0 0 70px #ffd75e);
    transition:opacity .45s ease-in,transform .45s ease-in,filter .45s ease-in}
  #spNum.tease{opacity:.2;transform:scale(.78);animation:teaseBreath 2.8s ease-in-out infinite}
  @keyframes teaseBreath{50%{opacity:.32}}
  #spHint{position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);
    font-family:var(--pix);font-size:9px;letter-spacing:6px;color:#8f84a8;
    opacity:0;transition:opacity 1.2s;animation:pulse 1.6s infinite}
  #spHint.on{opacity:.7}
  #spPres{font-family:var(--pix);font-size:11px;letter-spacing:13px;color:#b9a8d8;margin-top:28px;opacity:0;transition:opacity .6s}
  #spPres.on{opacity:1}
  #spTitle{position:absolute;left:50%;top:50%;display:flex;gap:22px;white-space:nowrap;
    font-family:var(--pix);font-size:clamp(34px,7.6vw,64px);letter-spacing:8px;
    transform:translate(-50%,-50%) scale(7);opacity:0;
    transition:transform .4s cubic-bezier(.14,1.2,.3,1),opacity .3s}
  #spTitle.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  #spFlash{position:absolute;inset:0;background:#fff6e2;opacity:0;transition:opacity .35s;pointer-events:none;z-index:3}
</style>
</head>
<body>
<div id="splash">
  <canvas id="fxCv"></canvas>
  <div id="spStage">
    <div id="spNum" class="tease">1.61</div>
    <div id="spPres">PRÉSENTE</div>
    <div id="spTitle"><span class="lg gold" data-t="CASH">CASH</span><span class="lg grad" data-t="CAR">CAR</span></div>
    <div id="spHint">CLIQUE</div>
  </div>
  <div id="spFlash"></div>
</div>
<div id="hud">
  <canvas id="slCv"></canvas>
  <div id="cloudFx"></div>
  <div id="vig"></div>
  <div id="scan"></div>
  <div id="speedFx"></div>
  <div id="carInfo" class="panel"><div id="carName">Épave rouillée</div><div id="carLevel">NIVEAU 1 / 14</div></div>
  <div id="money"><span id="moneyTxt">$00000000</span></div>
  <div id="record"></div>
  <button id="resetBtn">⟲ RESET</button>
  <button id="sndBtn" class="sndBtn">🔊 SON</button>
  <button id="voxBtn" class="sndBtn">🎙 VOIX</button>
  <div id="speedo" class="panel"><div id="speedVal">0</div><div id="speedUnit">km/h</div></div>
  <div id="cpInfo" class="panel">Prochaine voiture à <span id="cpDist"></span><div id="cpBar"><div id="cpFill"></div></div></div>
  <div id="feverGlow"></div>
  <div id="flash"></div>
  <div id="nitroWrap"><div id="pwrChip"></div><div id="styleBar"><div id="styleFill"></div></div><div id="nitroLbl">NITRO (ESPACE)</div><div id="nitroBar"><div id="nitroR"></div><div id="nitroX"></div></div></div>
  <div id="msg"></div>
  <div id="trickBox"></div>
  <div id="turnHint"></div>
  <canvas id="airPie" width="74" height="74"></canvas>
  <canvas id="minimap" width="176" height="176"></canvas>
</div>
<div id="overlay">
  <h1><span class="lg gold" data-t="CASH">CASH</span><span class="lg grad" data-t="CAR">CAR</span></h1>
  <div id="tagline">cours après le cash · ne tombe jamais</div>
  <h2 id="ovSub" style="display:none">GAME OVER</h2>
  <div id="finalScore"></div>
  <div id="bestChip"></div>
  <div id="runStats"></div>
  <div id="nameEntry"><span>★ NOUVEAU RECORD — TON NOM</span><input id="nameInput" maxlength="8" autocomplete="off" spellcheck="false"><button id="nameSave">VALIDER</button></div>
  <div id="lbBox"></div>
  <div id="ctrlRow">
    <span class="kc">Z Q S D<i>conduire</i></span>
    <span class="kc">← ↑ ↓ →<i>conduire</i></span>
    <span class="kc">ESPACE<i>nitro</i></span>
    <span class="kc">R<i>replacer</i></span>
    <span class="kc">ENTRÉE<i>rejouer</i></span>
    <span class="kc">P<i>pause</i></span>
  </div>
  <div class="go" id="goTxt">JOUER</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ==" crossorigin="anonymous"></script>
<script>
(function(){

const cloudTexs=(function(){ // cumulus haute définition : socle d'ombre PLAT, chou-fleur saumon, dômes crème, crêtes étincelantes
  const arr=[];let sd=97;const r=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
  for(let v=0;v<6;v++){
    const cv=document.createElement('canvas');cv.width=512;cv.height=256;
    const c=cv.getContext('2d');
    const puff=(x,y,rad,a,col,sq)=>{ // bouffée teintée, éventuellement APLATIE (sq<1 : base de cumulus)
      const g=c.createRadialGradient(x,y-rad*.32,rad*.08,x,y,rad);
      g.addColorStop(0,'rgba('+col+','+a+')');
      g.addColorStop(.55,'rgba('+col+','+(a*.55)+')');
      g.addColorStop(1,'rgba('+col+',0)');
      c.save();c.translate(x,y);c.scale(1,sq||1);c.translate(-x,-y);
      c.fillStyle=g;c.beginPath();c.arc(x,y,rad,0,7);c.fill();c.restore();
    };
    const flat=v%2===0; // une variante sur deux a la BASE PLATE du vrai cumulus (photo Flight Simulator)
    // couche 1 : socle d'ombre mauve — large, écrasé, aligné sur une base commune
    const baseY=flat?188:168;
    let x=90+r()*50;
    const n1=11+Math.floor(r()*5);
    for(let i=0;i<n1;i++){
      puff(x,baseY+(flat?(r()-.2)*8:(r()-.5)*26),40+r()*34,.5+r()*.22,'132,120,158',flat?.55:.85);
      x+=26+r()*36;
      if(x>430)x=86+r()*50;
    }

    x=110+r()*50;let y=126+r()*20;
    const n2=15+Math.floor(r()*7);
    for(let i=0;i<n2;i++){
      puff(x,y,20+r()*22,.6+r()*.26,'255,158,122');

})();

let QUAL_LOW=false; // garde-fou perf : passé vrai, 1 bouffée sur 3 disparaît (voir loop)
function mkCloud(center,r,o,rr){
  const g=new THREE.Group();g.position.copy(center);
  const ry=r*(o.giant?.55+rr()*.18:o.veil?.16:o.sea?.15:.36+rr()*.16);
  const nP=o.giant?16:o.dense?12:o.veil?3:o.sea?6:o.deco?7:8;
  const puffs=[];
  for(let i=0;i<nP;i++){
    const a=rr()*Math.PI*2;let rad=Math.sqrt(rr())*r*.72;
    const yb=o.giant?Math.pow(rr(),.8)*1.5-.35:(rr()*2-1)*.72; // géants : base PLATE, bourgeons empilés vers le ciel
    if(o.giant)rad*=1-Math.max(0,yb)*.42;                      // …la tour s'affine au sommet
    const base=new THREE.Vector3(Math.cos(a)*rad,yb*ry,Math.sin(a)*rad);
    // éclairage féerique : sommets crème frappés par le soleil, ventres mauves à l'ombre
    const hN=base.y/(ry||1);
    const tint=o.veil?CLOUD_TINTS_FAR[Math.floor(rr()*CLOUD_TINTS_FAR.length)]
      :hN>.4?0xfff3da:hN<-.3?0xd4a8c6:CLOUD_TINTS[Math.floor(rr()*CLOUD_TINTS.length)];
    const m=new THREE.SpriteMaterial({map:cloudTexs[Math.floor(rr()*cloudTexs.length)],
      color:tint,transparent:true,fog:!o.noFog, // noFog : les montagnes de ouate percent la brume jusqu'à l'horizon
      opacity:o.veil?.12+rr()*.08:o.sea?.26+rr()*.14:(o.dense?.62:o.giant?.55:.42)+rr()*.25,
      depthWrite:false,rotation:rr()*6.28});
    const sp=new THREE.Sprite(m);
    const sc=r*(.5+rr()*.8);
    if(o.veil)sp.scale.set(sc*2.4,sc*.26,1);            // voiles d'altitude : nappes étirées, quasi immobiles
    else if(o.sea)sp.scale.set(sc*1.9,sc*.3,1);         // mer de nuages : galettes larges à perte de vue
    else if(o.giant&&hN<-.1)sp.scale.set(sc*1.25,sc*(.3+rr()*.15),1); // ventre de tour : large et écrasé
    else sp.scale.set(sc,sc*(.38+rr()*.28),1);
    sp.position.copy(base);
    if(QUAL_LOW&&i%3===2)sp.visible=false;
    g.add(sp);
    puffs.push({sp:sp,base:base,ph:rr()*6.28,rv:(rr()-.5)*.09,dis:new THREE.Vector3(),dv:new THREE.Vector3()});
  }

}
function buildClouds(rr){
  disposeClouds();
  // RNG local : retoucher les nuages ne rebrasse plus la génération en aval (piège rnd séquentiel)
  const cr=mulberry32((rr()*1e9)|0);
  // bancs SUR la route — et parfois un MUR de ouate : la voiture disparaît entièrement dedans
  for(let sp=650+cr()*450;sp<L-300;sp+=480+cr()*560){
    if(cr()<.2)continue;
    frameAt(sp,F);
    const mega=cr()<.3;
    mkCloud(cldV1.copy(F.p).addScaledVector(F.n,mega?6+cr()*4:2.5+cr()*2),
      mega?34+cr()*24:16+cr()*13,{onRoad:true,dense:true},cr);
  }
  // nuages de VOL : au-dessus / en-dessous de la dalle, sur les lignes de saut
  for(let k=0;k<24;k++){

    mkCloud(cldV1.copy(pts[i]).addScaledVector(B[i],(cr()*2-1)*70)
      .addScaledVector(Nn[i],above?14+cr()*48:-(26+cr()*64)),13+cr()*18,{},cr);

  // PLANTÉE sur la piste : on la perce à l'aveugle, la voiture disparaît dans le blanc
  for(let k=0;k<14;k++){
    const i=Math.floor(cr()*NP);
    const r9=120+cr()*140;
    const cross=cr()<.32;
    const off=cross?(cr()*2-1)*40:(r9*.55+60+cr()*420)*(cr()<.5?-1:1);
    mkCloud(cldV1.copy(pts[i]).addScaledVector(B[i],off)
      .addScaledVector(Nn[i],cross?-r9*.25+cr()*30:-140+cr()*330),r9,{giant:true,onRoad:cross,noFog:!cross},cr);
  }
  // MER DE NUAGES sous la piste : le tapis à perte de vue du vol au-dessus des nuages
  for(let k=0;k<14;k++){
    const i=Math.floor(cr()*NP);
    mkCloud(cldV1.copy(pts[i]).addScaledVector(B[i],(cr()*2-1)*900)
      .addScaledVector(Nn[i],-(170+cr()*220)),90+cr()*80,{sea:true,noFog:true},cr);
  }
  // mer de ouate à mi-distance : les nuages rêveurs qu'on longe
  for(let k=0;k<12;k++){
    const i=Math.floor(cr()*NP);
    mkCloud(cldV1.copy(pts[i]).addScaledVector(B[i],(95+cr()*260)*(cr()<.5?-1:1))
      .addScaledVector(Nn[i],-60+cr()*180),30+cr()*38,{deco:true},cr);

      .addScaledVector(Nn[i],230+cr()*220),95+cr()*70,{veil:true,noFog:true},cr);
  }
}
function updateClouds(dt,t){
  cloudIn=0;
  const cp=carGroup.position;
  const carV=mode==='fall'?fallVel.length():Math.abs(vA);
  for(const c of CLOUDS){
    c.g.position.x=c.c.x+Math.sin(t*.07+c.ph)*4;   // le banc respire et dérive
    c.g.position.z=c.c.z+Math.cos(t*.05+c.ph)*4;
    cldV1.subVectors(cp,c.g.position);
    const dh2=cldV1.x*cldV1.x+cldV1.z*cldV1.z,dv=cldV1.y;
    const d2=dh2/(c.r*c.r)+(dv*dv)/(c.ry*c.ry);

      p.dv.addScaledVector(p.dis,-2.3*dt);
      p.dv.multiplyScalar(Math.max(0,1-1.7*dt));
      p.dis.addScaledVector(p.dv,dt);
      p.sp.position.set(p.base.x+p.dis.x,
        p.base.y+p.dis.y+Math.sin(t*.4+p.ph)*c.ry*.06,
        p.base.z+p.dis.z);

    }
    if(d2<1){ // ---- DEDANS ----
      const k=1-Math.sqrt(d2);
      if(k>cloudIn)cloudIn=k;

        cldV2.copy(p.sp.position).add(c.g.position).sub(cp);
        if(cldV2.lengthSq()<p.sp.scale.x*p.sp.scale.x*.36){
          cldV2.normalize();
          p.dv.addScaledVector(cldV2,(carV*.12+3)*8*dt);
          p.dv.y+=6*dt;
        }
      }
      if(!c.wasIn){
        c.wasIn=true;
        noiseBurst(.5,.10,520); // on plonge dans la ouate
        if(mode==='fall'&&c.fid!==flightId){c.fid=flightId;c.refT=1.2;} // budget d'airtime de CE banc
      }
      if(mode==='fall'){ // SURF DE NUAGE : coussin d'air + regain d'airtime
        fallVel.y+=7*k*dt;
        fallVel.x+=(Math.random()-.5)*6*k*dt;

function genCtrl(rnd,startPos,startPhi){
  const ctrl=[];
  let P=startPos.clone(),phi=startPhi,approx=0,lastLoop=-500;
  const dir=()=>new THREE.Vector3(Math.sin(phi),0,Math.cos(phi));

  const arc=(aDeg,R,n,dy=0)=>{const a=aDeg*Math.PI/180,st=a/n,ch=2*R*Math.sin(Math.abs(st)/2);
    for(let k=0;k<n;k++){phi+=st/2;P.addScaledVector(dir(),ch);P.y+=dy/n;phi+=st/2;push();}
    approx+=Math.abs(a)*R;};
  const loop=(R,shift)=>{const base=P.clone(),d=dir(),sx=Math.cos(phi),sz=-Math.sin(phi);
    for(let k=1;k<=8;k++){const th=k*Math.PI/4;
      P.set(base.x+d.x*R*Math.sin(th)+sx*shift*th/(2*Math.PI),
            base.y+R*(1-Math.cos(th)),
            base.z+d.z*R*Math.sin(th)+sz*shift*th/(2*Math.PI));
      push();}
    approx+=2*Math.PI*R;};
  straight(170,-105,2); // DÉPART : toujours une grande ligne droite
  while(approx<7200){
    const r=rnd();
    if(r<.20&&approx-lastLoop>220){ // looping (superposition verticale)
      straight(40+rnd()*60,-45);loop(30+rnd()*34,30+rnd()*22);straight(35+rnd()*50,-42);lastLoop=approx;
      if(rnd()<.35){straight(50+rnd()*40,-48);loop(26+rnd()*22,28+rnd()*14);}
    }else if(r<.42){ // hélice : la route s'empile sur elle-même (plus fréquent)
      const sg=rnd()<.5?-1:1,Rh=60+rnd()*95,ah=260+rnd()*340;
      arc(sg*ah,Rh,8+Math.floor(rnd()*5),-(ah*Math.PI/180*Rh*(.5+rnd()*.35)));
    }else if(r<.48){ // épingle OUVERTE (fini l'ultra-serré)
      const sg=rnd()<.5?-1:1;
      straight(25+rnd()*40,-25);
      arc(sg*180,55+rnd()*50,5,-(24+rnd()*26));
      straight(25+rnd()*40,-25);
    }else if(r<.58){ // esses amples
      const nS=1+Math.floor(rnd()*3),a=25+rnd()*45,R=80+rnd()*100;
      for(let q=0;q<nS;q++){
        const dl=a*Math.PI/180*R*(.6+rnd()*.5);
        arc(a,R,2,-dl);arc(-a,R,2,-dl);
      }
    }else if(r<.68){ // vague verticale : bosse + creux (crête à sauter !)
      straight(40+rnd()*40,-(10+rnd()*20));
      straight(50+rnd()*40,20+rnd()*25);  // remontée surprise
      straight(60+rnd()*50,-(90+rnd()*70)); // et ça replonge
    }else if(r<.80){ // grand virage large
      const sg=rnd()<.5?-1:1,a2=30+rnd()*70,R2=95+rnd()*150;
      arc(sg*a2,R2,3,-(a2*Math.PI/180*R2*(.6+rnd()*.5)));
    }else if(r<.90){ // plongeon, parfois presque vertical
      straight(60+rnd()*80,-(90+rnd()*130),2);
      const sg=rnd()<.5?-1:1,a3=25+rnd()*50,R3=90+rnd()*80;
      arc(sg*a3,R3,2,-(a3*Math.PI/180*R3*.8));

      straight(l,-l*(.75+rnd()*.3),2);
    }

}

const TRL=38,trailQ=[];

function trailPush(lx,ly,lz,rx,ry,rz,r,g,b){
  trailQ.unshift([lx,ly,lz,rx,ry,rz,r,g,b]);
  if(trailQ.length>TRL)trailQ.pop();
  const P=trailGeo.attributes.position.array,C=trailGeo.attributes.color.array;
  for(let i=0;i<TRL;i++){
    const e=trailQ[i]||trailQ[trailQ.length-1]||[0,-99999,0,0,-99999,0,0,0,0];
    const f=1-i/TRL;
    P[i*6]=e[0];P[i*6+1]=e[1];P[i*6+2]=e[2];P[i*6+3]=e[3];P[i*6+4]=e[4];P[i*6+5]=e[5];
    C[i*6]=e[6]*f;C[i*6+1]=e[7]*f;C[i*6+2]=e[8]*f;
    C[i*6+3]=e[6]*f;C[i*6+4]=e[7]*f;C[i*6+5]=e[8]*f;
  }
  trailGeo.attributes.position.needsUpdate=true;
  trailGeo.attributes.color.needsUpdate=true;
}
function spawnP(pool,x,y,z,vx,vy,vz,life){
  const i=pool.head;pool.head=(i+1)%pool.n;
  pool.pos[i*3]=x;pool.pos[i*3+1]=y;pool.pos[i*3+2]=z;
  pool.vel[i*3]=vx;pool.vel[i*3+1]=vy;pool.vel[i*3+2]=vz;
  pool.life[i]=life;
}
function updatePool(pool,dt,grav){
  for(let i=0;i<pool.n;i++){
    if(pool.life[i]>0){
      pool.life[i]-=dt;
      pool.pos[i*3]+=pool.vel[i*3]*dt;
      pool.pos[i*3+1]+=(pool.vel[i*3+1]+grav)*dt;
      pool.pos[i*3+2]+=pool.vel[i*3+2]*dt;
      if(pool.life[i]<=0)pool.pos[i*3+1]=-99999;
    }
  }
  pool.mesh.geometry.attributes.position.needsUpdate=true;
}

function annPlayLayers(e,prio){

function drawSpeedLines(kmh,nitro){ // speed lines façon anime : traits radiaux fuyant le centre
  const W=slCv.width,H=slCv.height;
  slCtx.clearRect(0,0,W,H);
  let k=Math.max(0,(kmh-230)/300)+(nitro?.42:0); // les speed lines s'invitent plus tôt et mordent plus fort
  if(k<=.03)return;
  k=Math.min(1.35,k);
  const cx=W/2,cy=H*.45,n=Math.floor(k*24);
  slCtx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,
          r0=Math.min(W,H)*(.24+Math.random()*.55),
          r1=r0+(50+Math.random()*240)*k;
    slCtx.strokeStyle='rgba(255,246,232,'+((.05+Math.random()*.14)*Math.min(1,k)).toFixed(3)+')';
    slCtx.lineWidth=1+Math.random()*2.4*k;
    slCtx.beginPath();
    slCtx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0*.8);
    slCtx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*.8);
    slCtx.stroke();
  }
  slCtx.globalCompositeOperation='source-over';
}

const mmCanvas=$('minimap'),mmCtx=mmCanvas.getContext('2d');
let mmMinX=0,mmMaxX=1,mmMinZ=0,mmMaxZ=1;
const mmFwd=new THREE.Vector3();
function computeMinimap(){
  if(!pts||!pts.length)return;
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(let i=0;i<NP;i++){const p=pts[i];if(p.x<minX)minX=p.x;if(p.x>maxX)maxX=p.x;if(p.z<minZ)minZ=p.z;if(p.z>maxZ)maxZ=p.z;}
  mmMinX=minX;mmMaxX=maxX;mmMinZ=minZ;mmMaxZ=maxZ;
}
function drawMinimap(){
  const cv=mmCanvas,c=mmCtx,W=cv.width,H=cv.height,m=12;
  c.clearRect(0,0,W,H);
  const bw=(mmMaxX-mmMinX)||1,bh=(mmMaxZ-mmMinZ)||1;
  const sc=Math.min((W-2*m)/bw,(H-2*m)/bh);
  const ox=(W-bw*sc)/2-mmMinX*sc, oy=(H-bh*sc)/2-mmMinZ*sc;
  const X=x=>ox+x*sc, Y=z=>oy+z*sc;
  // tracé de la piste
  c.strokeStyle='rgba(160,160,170,.9)';c.lineWidth=2;c.lineJoin='round';c.beginPath();
  const step=Math.max(1,Math.floor(NP/240));
  for(let i=0;i<NP;i+=step){const p=pts[i];const cx=X(p.x),cy=Y(p.z);if(i===0)c.moveTo(cx,cy);else c.lineTo(cx,cy);}
  c.stroke();
  // portail (fin de zone)
  const pe=pts[NP-1];c.fillStyle='#ff4fd8';c.beginPath();c.arc(X(pe.x),Y(pe.z),3.6,0,7);c.fill();
  // voiture (triangle orienté)
  const cp=carGroup.position;
  mmFwd.set(0,0,1).applyQuaternion(carGroup.quaternion);
  const a=Math.atan2(mmFwd.z,mmFwd.x);
  c.save();c.translate(X(cp.x),Y(cp.z));c.rotate(a);
  c.fillStyle='#ffd75e';c.strokeStyle='#3a2e00';c.lineWidth=1;
  c.beginPath();c.moveTo(8,0);c.lineTo(-5,5);c.lineTo(-5,-5);c.closePath();c.fill();c.stroke();
  c.restore();
}

const dTmp=new THREE.Vector3();
function tryLand(){
  let bestI=-1,bd=1e9;
  for(let i=0;i<NP;i+=2){
    const dx=fallPos.x-pts[i].x,dy=fallPos.y-pts[i].y,dz=fallPos.z-pts[i].z;
    const dd=dx*dx+dy*dy+dz*dz;
    if(dd<bd){bd=dd;bestI=i;}
  }
  if(bestI<0||bd>1600)return false;
  dTmp.subVectors(fallPos,pts[bestI]);
  const hOff=dTmp.dot(Nn[bestI]),latOff=dTmp.dot(B[bestI]);
  // SNAKE LOOP : le TOUR COMPLET de la dalle, dans l'ordre — côté A → dessous → côté B
  {
    const nearSlab=hOff>-THICK-9&&hOff<9;
    if(fallWrap===0&&nearSlab&&Math.abs(latOff)>ROAD_HALF+.5){fallWrapSign=Math.sign(latOff);fallWrap=1;}
    else if(fallWrap===1&&hOff<-THICK-1&&Math.abs(latOff)<ROAD_HALF)fallWrap=2;
    else if(fallWrap===2&&nearSlab&&Math.abs(latOff)>ROAD_HALF+.5&&Math.sign(latOff)===-fallWrapSign)fallWrap=3;
  }
  const vN=fallVel.dot(Nn[bestI]);
  // FLANC de la dalle : la caisse COGNE la tranche et REBONDIT — c'est le BUMP, une vraie
  // figure : demi-jauge d'airtime rendue, du STYLE, et le verdict d'atterrissage gonfle.
  // Zéro dollar direct : le bump ne paye QUE si on pose la caisse ensuite (risque → récompense).
  const vB=fallVel.dot(B[bestI]);
  if(sideCd<=0&&Math.abs(latOff)>=ROAD_HALF&&Math.abs(latOff)<ROAD_HALF+2.6&&
     hOff>-THICK-.8&&hOff<.8&&vB*Math.sign(latOff)<-3){
    const sg=Math.sign(latOff),impB=Math.abs(vB);
    fallVel.addScaledVector(B[bestI],-vB*1.65); // réflexion amortie sur la paroi
    fallVel.multiplyScalar(.78);
    fallVel.y+=2.4; // la tranche RENVOIE la caisse vers le ciel
    fallPos.copy(pts[bestI]).addScaledVector(B[bestI],sg*(ROAD_HALF+1.8)).addScaledVector(Nn[bestI],hOff);
    sideCd=.35;
    // ---- BUMP / DOUBLE BUMP / TRIPLE BUMP ----
    bounceN++;runStats.bumps++;
    fallT=Math.max(0,fallT-AIR_MAX*.5);airFlash=.6; // DEMI-JAUGE d'airtime rendue
    const bTxt=bounceN===1?'BUMP':bounceN===2?'DOUBLE BUMP':bounceN===3?'TRIPLE BUMP':'MEGA BUMP x'+bounceN;
    trickMsg(bTxt,Math.min(3,bounceN));
    addStyle(12+bounceN*6); // le bump nourrit le STYLE et le multiplicateur d'atterrissage, pas le compte en banque
    bumpSfx(bounceN);
    thud(impB);noiseBurst(.14,.09,1100); // choc + froissement de tôle
    shake=Math.min(1.3,.3+impB*.03);
    dropChip(2+Math.floor(Math.min(4,impB*.12))); // ça casse ENCORE PLUS de bouts
    sparkBurst(sparkGold,carGroup.position,12,10);
    squashT=Math.max(squashT,.22);
    return false; // toujours en vol — enchaîne les bumps !
  }
  let sideL=0;
  if(hOff>-1.2&&hOff<3&&vN<4.5)sideL=1;                       // face du dessus (fenêtre élargie)
  else if(hOff>-THICK-3&&hOff<-THICK+1.2&&vN>-4.5)sideL=-1;   // face du dessous
  if(!sideL||Math.abs(latOff)>=ROAD_HALF)return false;
  s=THREE.MathUtils.clamp(bestI/(NP-1)*L+THREE.MathUtils.clamp(dTmp.dot(T[bestI]),-2,2),0,L-1);
  side=sideL;lat=latOff*sideL;psi=0;
  vA=fallVel.dot(T[bestI]);vL=fallVel.dot(B[bestI])*.4*sideL;
  // ATTERRISSAGE : l'impact ralentit la caisse — d'autant plus que le saut etait gros
  const impact=Math.abs(vN);
  const bigness=Math.max(0,fallT-.8);
  const landLoss=Math.min(.52,bigness*.15+impact*.008); // un peu plus doux qu'avant
  vA*=(1-landLoss);vL*=(1-landLoss);
  if(landLoss>.2)dropChip(2);
  if(landLoss>.28&&fallT>1.6)slowT=Math.max(slowT,.25);
  prevTvalid=false;mode='drive';
  sparkBurst(sparkGold,carGroup.position,10,9);
  thud(Math.abs(vN));shake=Math.min(1.4,.35+Math.abs(vN)*.05+landLoss*.6);
  // ---- FIGURES : le vol paye — un seul verdict : MONSTRE ----
  if(fallT>.7||bounceN>0){
    const spins=Math.abs(yawAcc)/(Math.PI*2);
    let mult=1;
    if(Math.abs(vN)<6)mult+=.5;                                       // réception parfaite
    if(spins>=.55)mult+=Math.max(1,Math.round(spins))*.8;             // vrilles
    if(fallT>2.2)mult+=.6;                                            // big air
    if(bounceN>0)mult+=bounceN*.75;                                   // les BUMPS gonflent le verdict (leur seule paye : il faut POSER)
    if(sideL<0)mult*=2;                                               // face cachée
    streak++;
    if(streak>=2)mult*=1+Math.min(1,streak*.1);                       // enchaînement
    const gain=Math.round(denom()*8*Math.max(.7,fallT)*mult*(fever>0?2:1));
    money+=gain;levelCash+=gain;checkUpgrade();
    runStats.tricks++;
    // ---- ANNOUNCER : la réplique la plus RARE l'emporte (chacune tombe 1 fois sur 3) ----
    let vKey=mult>=3.2?'m3':(mult>=2?'m2':'m1');
    let vTier=mult>=3.2?3:(mult>=2?2:1),vPrio=vTier;
    if(nitroOn&&nitroAirT>1){vKey='meteor';vTier=Math.max(vTier,2);vPrio=4;}    // impact en pleine poussée
    if(fallWrap===3&&sideL===fallStartSide){vKey='snakeLoop';vTier=3;vPrio=5;}  // TOUR COMPLET, même face
    if(nitroOn&&nitroAirT>5){vKey='megaMeteor';vTier=3;vPrio=6;}                // 5 s de réacteur : l'ultime
    const vTxt=annSpeak(vKey,vPrio)||'MONSTRE';
    trickMsg(vTxt+'  +'+fmt(gain),vTier);
    rewardSfx(vKey,vTier); // signature sonore courte assortie à la récompense
    boost=Math.max(boost,1.2);
    addStyle(18+spins*12);
    if(fallT>2)slowT=.35; // slow-mo savoureux sur les gros airs
  }
  return true;
}

const fwdW=new THREE.Vector3(),tmp=new THREE.Vector3(),tmp2=new THREE.Vector3(),tmp3=new THREE.Vector3(),mat4=new THREE.Matrix4();
const camUp=new THREE.Vector3(0,1,0),qTmp=new THREE.Quaternion(),qTmp2=new THREE.Quaternion();
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min((now-last)/1000,.05);last=now;
  // qualité auto : si le GPU peine (<45 fps soutenus après l'échauffement), on allège la ouate une fois pour toutes
  loop._ms=(loop._ms||16)*.96+Math.min(100,now-(loop._pn||now))*.04;loop._pn=now;
  if(!QUAL_LOW&&loop._ms>22&&now>15000){
    QUAL_LOW=true;
    for(const c9 of CLOUDS){let j9=0;for(const p9 of c9.puffs)if(++j9%3===0)p9.sp.visible=false;}
  }
  if(slowT>0){slowT-=dt;dt*=.45;} // slow-mo d'atterrissage
  const t=now/1000;
  let speedKmh=0;
  try{ if(running&&!paused&&!gameOver){
    const spec=CARS[level],maxSp=spec.maxKmh/3.6;
    const up=keys.KeyW||keys.KeyZ||keys.ArrowUp,dn=keys.KeyS||keys.ArrowDown;
    const lf=keys.KeyA||keys.KeyQ||keys.ArrowLeft,rt=keys.KeyD||keys.ArrowRight;
    // POUVOIRS : les minuteurs s'égrènent, l'airtime infini rend une jauge neuve en expirant
    pwrNitroT=Math.max(0,pwrNitroT-dt);
    pwrSpdT=Math.max(0,pwrSpdT-dt);
    if(pwrAirT>0){pwrAirT-=dt;if(pwrAirT<=0){pwrAirT=0;if(mode==='fall'){fallT=0;airFlash=.6;}}}
    // nitro : 2s regen (10s de recharge) + 2s réserve (bidons bleus)
    nitroR=Math.min(2,nitroR+.2*dt);
    if(pwrNitroT>0)nitroR=2; // NITRO INFINIE : la jauge reste pleine, rien ne se consomme
    const wantN=keys.ShiftLeft||keys.ShiftRight||keys.Space;
    nitroOn=wantN&&(nitroOn?(nitroR+nitroX)>.005:(nitroR+nitroX)>.3); // hystérésis anti-clignotement
    if(nitroOn&&pwrNitroT<=0){
      let take=dt;
      if(nitroR>=take)nitroR-=take;
      else{take-=nitroR;nitroR=0;nitroX=Math.max(0,nitroX-take);}
    }
    nitroBlue=nitroOn&&nitroR<=.01; // réserve bleue = plus puissante
    // TURBO v2 : spool à l'enclenchement (au sol), blow-off + flutter à la relâche (partout)
    if(nitroOn&&!loop._nOn&&mode==='drive')nitroSpool();

    const t0=A.currentTime+.05,PHI=1.6180339;
    const phi=k=>110*Math.pow(PHI,k); // l'échelle d'or : 110·φ^k
    const comp=A.createDynamicsCompressor();
    comp.threshold.value=-14;comp.ratio.value=5;comp.connect(A.destination);
    master=A.createGain();master.gain.value=1;master.connect(comp);
    const nzBuf=(function(){const n=A.sampleRate*2,b=A.createBuffer(1,n,A.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;return b;})();
    const pan=x=>{const p=A.createStereoPanner?A.createStereoPanner():A.createGain();if(p.pan)p.pan.value=x;return p;};
    function tone(f0,f1,t,dur,vol,type,px){ // ton glissant enveloppé
      const o=A.createOscillator(),g=A.createGain(),p=pan(px||0);
      o.type=type||'sine';
      o.frequency.setValueAtTime(Math.max(1,f0),t0+t);
      if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+t+dur);
      const atk=Math.min(.012,dur*.4);
      g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(vol,t0+t+atk);
      g.gain.exponentialRampToValueAtTime(.0008,t0+t+dur);
      o.connect(g);g.connect(p);p.connect(master);
      o.start(t0+t);o.stop(t0+t+dur+.06);
    }
    function puffN(t,dur,vol,type,f,f1,q,px){ // souffle filtré
      const s=A.createBufferSource();s.buffer=nzBuf;s.loop=true;
      const fl=A.createBiquadFilter();fl.type=type;fl.Q.value=q||1;
      fl.frequency.setValueAtTime(f,t0+t);
      if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t0+t+dur);
      const g=A.createGain(),p=pan(px||0);
      const atk=Math.min(.02,dur*.5);
      g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(vol,t0+t+atk);
      g.gain.exponentialRampToValueAtTime(.0008,t0+t+dur);
      s.connect(fl);fl.connect(g);g.connect(p);p.connect(master);
      s.start(t0+t);s.stop(t0+t+dur+.06);
    }
    // 0) ALLUMAGE : le CLIC sonne immédiatement — pièce d'or + whoosh + thump
    tone(phi(5),phi(5),.02,.55,.20,'triangle',.2);
    tone(phi(6),phi(6)*.99,.06,.6,.12,'sine',-.2);
    tone(phi(3),phi(3),.02,.7,.14,'sine');
    puffN(.02,.5,.18,'bandpass',900,2600,1.5);
    tone(150,46,.02,.45,.34);
    // 1) LA COMPTEUSE À BILLETS : frottements de papier qui s'accélèrent (le riser)
    let tt=.15,iv=.15;
    while(tt<2.42){
      puffN(tt,.028,.03+tt*.045,'highpass',2200+tt*1200,0,1,(Math.random()-.5)*.9);
      iv=Math.max(.021,iv*.952);tt+=iv;
    }
    // 2) POUSSIÈRE D'OR : grains aigus qui se rangent peu à peu sur l'échelle d'or (chaos → ordre)
    for(let i=0;i<46;i++){
      const t=.2+Math.random()*2.1,ord=t/2.3;
      const f=phi(4+Math.floor(Math.random()*4))*(1+(Math.random()-.5)*.5*(1-ord));
      tone(f,f,t,.09+Math.random()*.13,.022+ord*.04,'sine',(Math.random()-.5)*1.4);
    }
    // 3) DOUBLE SUB : 38 + 38,618 Hz → battement de 0,618 Hz. Harmoniques ×2 pour
    //    rester audible sur petites enceintes (les portables ne sortent pas le 38 Hz)
    for(const fh of [[38,.16],[38.618,.16],[76,.07],[77.236,.07]]){
      const o=A.createOscillator(),g=A.createGain();
      o.type='sine';o.frequency.value=fh[0];
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(fh[1],t0+2.1);
      g.gain.setValueAtTime(fh[1],t0+2.5);g.gain.linearRampToValueAtTime(0,t0+2.62); // aspiré
      o.connect(g);g.connect(master);o.start(t0);o.stop(t0+2.66);
    }
    // 4) SPIRALES : deux souffles résonants qui grimpent en proportions d'or
    for(const k of [0,1]){
      const s=A.createBufferSource();s.buffer=nzBuf;s.loop=true;
      const fl=A.createBiquadFilter();fl.type='bandpass';fl.Q.value=9;
      const f0=240*Math.pow(PHI,k);
      fl.frequency.setValueAtTime(f0,t0+.3);
      fl.frequency.exponentialRampToValueAtTime(f0*10,t0+2.6);
      const g=A.createGain(),p=pan(k?-.5:.5);
      g.gain.setValueAtTime(0,t0+.3);g.gain.linearRampToValueAtTime(.09,t0+2.3);
      g.gain.setValueAtTime(.09,t0+2.55);g.gain.linearRampToValueAtTime(0,t0+2.63);
      s.connect(fl);fl.connect(g);g.connect(p);p.connect(master);
      s.start(t0+.3);s.stop(t0+2.7);
    }
    // 5) BATTEMENTS DE CŒUR (sync pulsations du logo) : kick + thump médium + accord d'or
    [[1.05,1],[1.65,1.35],[2.15,1.8]].forEach(function(bk){
      const t=bk[0],k=bk[1];
      tone(96,27,t,.24,.30*k);
      tone(230,70,t,.14,.14*k);
      tone(phi(1),phi(1)*.994,t,.17,.09*k,'triangle');
      tone(phi(2),phi(2)*.994,t,.16,.08*k,'triangle');
      tone(phi(3),phi(3)*.994,t,.14,.07*k,'triangle');
      puffN(t,.03,.10*k,'highpass',5200,0,1);
    });
    // 6) ASPIRATION (2.35→2.63) : tout se fait avaler… puis 70 ms de VIDE total
    puffN(2.35,.28,.30,'bandpass',800,3400,2);
    tone(340,64,2.35,.28,.09);
    // 7) FISSION (2.65) : canon de sub + souffle + chœur métallique d'or qui retombe
    tone(64,21,2.65,1.5,.55);
    tone(128,42,2.65,.8,.22);
    puffN(2.65,.9,.38,'lowpass',3800,140,1);
    for(let k=0;k<5;k++)tone(phi(k)*2,phi(k)*1.94,2.65,2.1-k*.22,.07,k%2?'triangle':'sine',(k-2)*.3);
    // 8) JACKPOT : pluie de pièces qui descend l'échelle d'or (dense → clairsemée)
    for(let i=0;i<26;i++){
      const t=2.72+Math.pow(i/26,1.35)*1.5;
      const f=phi(6-Math.floor(i/5))*(1+(Math.random()-.5)*.06);
      tone(f,f*.99,t,.22+Math.random()*.1,.07-.035*(i/26),'triangle',(Math.random()-.5)*1.2);
      puffN(t,.02,.03,'highpass',6000,0,1);
    }
    // 9) LE TITRE CLAQUE (2.95, sync visuel) : impact + accord brillant
    tone(120,30,2.95,.32,.50);
    for(let k=0;k<4;k++)tone(phi(k)*4,phi(k)*4,2.95,.5,.07,'triangle',(k-1.5)*.35);
    puffN(2.95,.18,.22,'highpass',1800,0,1);
    // 10) TRAÎNE : nappe d'or qui s'éteint doucement vers le menu
    tone(phi(2),phi(2),3.05,2.8,.04,'sine',-.4);
    tone(phi(3),phi(3),3.1,2.7,.035,'sine',.4);
  }
  let last9=performance.now();
  function draw9(now){
    if(done)return;
    requestAnimationFrame(draw9);
    const dt9=Math.min((now-last9)/1000,.05);last9=now;
    ctx9.clearRect(0,0,cv9.width,cv9.height);
    if(ph9===0){
      ctx9.fillStyle='#ffd75e';
      if(!launched){ // TEASER : poussière d'or en dérive lente, en attente du clic
        for(const p of P9){
          p.x+=p.dx*dt9;p.y+=p.dy*dt9;
          if(p.x<0)p.x+=cv9.width;if(p.x>cv9.width)p.x-=cv9.width;
          if(p.y<0)p.y+=cv9.height;if(p.y>cv9.height)p.y-=cv9.height;
          ctx9.globalAlpha=p.o*.16;
          ctx9.beginPath();ctx9.arc(p.x,p.y,p.s,0,7);ctx9.fill();
        }
        ctx9.globalAlpha=1;
      }else{ // phase accumulation : spirale d'étincelles dorées
        for(const p of P9){
          p.x+=(CX()-p.x)*p.k*(dt9*60);p.y+=(CY()-p.y)*p.k*(dt9*60);
          const dd=Math.hypot(p.x-CX(),p.y-CY());
          if(dd<24){const a=Math.random()*Math.PI*2,r=Math.max(cv9.width,cv9.height)*(.5+Math.random()*.7);p.x=CX()+Math.cos(a)*r;p.y=CY()+Math.sin(a)*r;}
          ctx9.globalAlpha=p.o*(.35+.65*Math.min(1,240/Math.max(dd,1)));
          ctx9.beginPath();ctx9.arc(p.x,p.y,p.s,0,7);ctx9.fill();
        }
        ctx9.globalAlpha=1;
      }
    }else{ // phase fission : symboles éjectés qui tournoient
      ctx9.textAlign='center';ctx9.textBaseline='middle';
      for(let i=P9.length-1;i>=0;i--){
        const p=P9[i];
        p.life-=dt9;p.vy+=260*dt9;
        p.x+=p.vx*dt9;p.y+=p.vy*dt9;p.rot+=p.vr*dt9;
        if(p.life<=0){P9.splice(i,1);continue;}
        ctx9.save();ctx9.translate(p.x,p.y);ctx9.rotate(p.rot);
        ctx9.globalAlpha=Math.min(1,p.life);
        ctx9.font='700 '+p.s+'px "Press Start 2P",monospace';
        ctx9.shadowColor=p.col;ctx9.shadowBlur=14;
        ctx9.fillStyle=p.col;ctx9.fillText(p.sym,0,0);
        ctx9.restore();
      }
    }
    for(let i=RG.length-1;i>=0;i--){ // ondes de choc
      const g9=RG[i];g9.r+=g9.v*dt9;g9.a-=dt9*1.1;
      if(g9.a<=0){RG.splice(i,1);continue;}
      ctx9.strokeStyle='rgba('+g9.col+','+g9.a+')';ctx9.lineWidth=g9.w;
      ctx9.beginPath();ctx9.arc(CX(),CY(),g9.r,0,7);ctx9.stroke();
    }
  }
  requestAnimationFrame(draw9);
  function hide(){
    if(done)return;done=true;
    for(const t9 of timers)clearTimeout(t9);
    removeEventListener('keydown',kd9);
    if(iAC){ // fondu audio rapide puis fermeture du contexte de l'intro
      try{master.gain.setTargetAtTime(0,iAC.currentTime,.06);}catch(e){}
      setTimeout(function(){try{iAC.close();}catch(e){}},400);
    }
    sp9.style.opacity=0;setTimeout(function(){sp9.remove();},750);
  }
  sp9.addEventListener('click',function(){if(!launched)launch();else hide();}); // 1er clic = lancer, 2e = passer
})();
requestAnimationFrame(loop);
})();
</script>
