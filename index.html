<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASH CAR — Legal</title>
<style>
  :root{--bg:#0a0610;--bg2:#12081f;--ink:#f5ecff;--dim:#b9a9d6;--pink:#ff3ec8;--cyan:#00eaff;--line:#2a1a44}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#1a0f2e 0%,var(--bg) 60%),linear-gradient(180deg,var(--bg2),var(--bg));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:440px;width:100%;text-align:center}
  .brand{font-weight:800;font-size:30px;letter-spacing:.04em}
  .brand .c{color:var(--pink)} .brand .d{color:var(--cyan)}
  a{display:block;margin:14px 0;padding:16px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;background:rgba(23,16,41,.6);transition:.15s}
  a:hover{border-color:var(--cyan);color:var(--cyan)}
  a span{display:block;font-size:13px;color:var(--dim);font-weight:400;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="c">CASH</span> <span class="d">CAR</span></div>
  <p style="color:var(--dim)">Runner arcade 3D — iOS</p>
  <a href="privacy.html">Politique de confidentialité<span>Privacy Policy</span></a>
  <a href="support.html">Support<span>Aide &amp; contact</span></a>
</div>
</body>
</html>
