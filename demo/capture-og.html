<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}iframe{border:0;width:100vw;height:100vh;display:block}  /* le cadre suit la FENÊTRE : c'est elle qui fixe le format de capture */</style>
<iframe id="f" src="index.html"></iframe>
<script>
/* Harnais de capture (jamais déployé) : franchit l'intro « 1.61 » et laisse l'écran
   d'accueil se poser — c'est LUI l'image d'aperçu : titre, sceau, caisse, boutons. */
const f=document.getElementById('f');
f.addEventListener('load',function(){
  const d=f.contentDocument;
  setTimeout(function(){
    const el=d.getElementById('splash')||d.body;
    for(const t of ['pointerdown','mousedown','mouseup','click'])
      el.dispatchEvent(new MouseEvent(t,{bubbles:true,cancelable:true,clientX:600,clientY:315}));
  },1500);
  /* Le plateau de l'atelier tourne SANS FIN : le budget de temps virtuel de Chrome
     ne s'épuise donc jamais et la capture ne part pas. On gèle la boucle de rendu
     une fois la scène posée — le dernier cadre reste à l'écran, et c'est lui qu'on veut. */
  setTimeout(function(){ f.contentWindow.requestAnimationFrame=function(){}; },9000);
});
</script>
