<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maps</title>
<!-- LA PAGE DES MAPS DU SIMULATEUR (2026-10-12, Léo : « une interface avec les maps, leurs noms, une photo représentative et une
     option jouer sur la map ; chaque map n'a pas de musique pour l'instant, après il faudra associer un fichier à chaque » — puis
     « il faut que ce soit les bonnes maps et la bonne physique »). Les VRAIES maps du jeu et leurs niveaux (simulateur/maps.js), avec les
     photos prises dans le jeu pour la page des Niveaux (maps-ciel/img). JOUER = simulateur/course.html : le jeu lui-même, lancé sur le
     niveau. Chaque NIVEAU a sa pastille de musique (la bibliothèque = simulateur/musiques/) ; celle de la map les règle tous d'un coup.
     Le choix s'écrit sur le DISQUE (simulateur/choix-musiques.json, par le serveur) — c'est la table que le jeu lira. Un fichier de
     musique (.html à jauge, .js module) GLISSÉ sur la page, ou « + Musique », rejoint la bibliothèque.
     L'ORGANISATEUR DU PLAY (12/10, Léo : « tu es mon organisateur de map aléatoire pour le bouton PLAY ; laisse renommer si jamais je
     veux ») : chaque niveau a son interrupteur PLAY (dans le tirage ou pas — hors du tirage, la carte pâlit), un NOM se renomme d'un clic
     (niveau ou map ; vide = le nom d'origine), le bouton PLAY en haut lance le tirage au hasard (course.html?play=1). Tout va dans
     simulateur/play.json, sur le disque.
     LE JEU AU SURVOL (12/10, Léo : « l'important, c'est qu'on puisse jouer dans la map ; je dois pouvoir jouer dès que je mets mon
     curseur sur l'image, avec mes flèches, la musique automatiquement ; si je clique, c'est juste la course ») : UNE course
     (simulateur/course.html?nu=1 — le vrai jeu, sans écran titre, la musique du niveau) chargée dès l'ouverture de la page, posée sur
     l'image survolée : le niveau part (SIMU.lance), les flèches / Espace / Maj passent au jeu, la musique part à la 1re touche (le
     navigateur exige un geste) ; la souris s'en va = pause (le panneau ⏸ du jeu, 3-2-1 au retour). Un clic (image ou Jouer) = la même
     course en plein écran, rien autour ; ✕ ou Échap = retour aux maps. Le bouton PLAY (le tirage) garde sa page à lui.
     Page blanche, le moins de texte possible. -->
<style>
  :root{--encre:#111113;--gris:#86868b;--gris2:#b9b9be;--trait:#efeff1;--doux:#f4f4f6;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{color:var(--encre);font-family:var(--sys);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}
  .page{max-width:1040px;margin:0 auto;padding:52px max(16px,env(safe-area-inset-left)) 120px}
  h1{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1}
  .map{margin-top:52px}
  .mapTete{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--trait)}
  .mapTete h2{font-size:22px;font-weight:650;letter-spacing:-.01em}
  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 18px;margin-top:20px}
  .carte{display:flex;flex-direction:column;gap:10px;min-width:0}
  .photo{display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#e5e5ea,#f5f5f7)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s cubic-bezier(.32,.72,0,1)}
  .photo:hover img{transform:scale(1.035)}
  .photo:focus-visible,.jouer:focus-visible,.mus:focus-visible{outline:3px solid #0a63d6;outline-offset:3px}
  .ligne{display:flex;align-items:center;gap:10px;min-width:0}
  .num{font-size:13px;color:var(--gris2);font-variant-numeric:tabular-nums;flex:none}
  .nom{font-size:14.5px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .jouer{margin-left:auto;height:32px;padding:0 16px;border-radius:999px;background:var(--encre);color:#fff;font-size:13px;font-weight:600;flex:none}
  .jouer:active{transform:scale(.97)}
  .musBox{position:relative}
  .mus{height:30px;padding:0 13px 0 11px;border-radius:999px;background:var(--doux);font-size:12.5px;font-weight:550;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .mus.vide{background:transparent;box-shadow:inset 0 0 0 1px #dedee2;color:var(--gris)}
  .mus:hover{box-shadow:inset 0 0 0 1px var(--encre);color:var(--encre)}
  .mus svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .menu{position:absolute;left:0;top:36px;z-index:5;min-width:200px;background:#fff;border-radius:12px;padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.06)}
  .menu button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;text-align:left}
  .menu button:hover{background:var(--doux)}
  .menu button.choisi::after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--encre)}
  .menu button.aucune{color:var(--gris)}
  .tete{display:flex;align-items:center;gap:14px}
  .ajout{margin-left:auto;height:32px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1px #dedee2;font-size:13px;font-weight:550;color:var(--gris)}
  .ajout:hover{box-shadow:inset 0 0 0 1px var(--encre);color:var(--encre)}
  .carte .musBox{align-self:flex-start;max-width:100%}
  .carte .mus{height:26px;font-size:12px;max-width:100%}
  .carte .mus span{overflow:hidden;text-overflow:ellipsis}
  #depot{position:fixed;inset:12px;border-radius:20px;border:2px dashed var(--encre);background:rgba(255,255,255,.88);display:grid;
    place-items:center;font-size:22px;font-weight:650;z-index:20;pointer-events:none}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--encre);color:#fff;font-size:13.5px;font-weight:550;
    padding:10px 16px;border-radius:999px;z-index:30;transition:opacity .25s}
  .lance{height:34px;padding:0 16px 0 13px;border-radius:999px;background:var(--encre);color:#fff;font-size:14px;font-weight:650;
    display:inline-flex;align-items:center;gap:7px}
  .lance svg{width:13px;height:13px;fill:currentColor}
  .lance small{font-size:12px;font-weight:550;opacity:.6}
  .lance:active{transform:scale(.97)}
  .ajout{margin-left:0}
  .tete .lance{margin-left:auto}
  .renomme{cursor:text;border-radius:5px;outline:none}
  .renomme:hover{box-shadow:0 0 0 4px var(--doux);background:var(--doux)}
  .renomme[contenteditable="true"],.renomme[contenteditable="plaintext-only"]{box-shadow:0 0 0 4px #e8f0fe;background:#e8f0fe;-webkit-line-clamp:unset;display:block}
  .bas{display:flex;align-items:center;gap:8px;min-width:0}
  .pp{margin-left:auto;height:26px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.04em;flex:none;
    display:inline-flex;align-items:center;gap:5px;background:#e7f8ec;color:#1a7f37}
  .pp::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pp.non{background:transparent;color:var(--gris2);box-shadow:inset 0 0 0 1px #dedee2}
  .pp.non::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
  .carte.horsPlay .photo{opacity:.38;filter:grayscale(.6)}
  .carte.horsPlay .nom{color:var(--gris)}
  .photo{position:relative}
  .photo.charge::after{content:"";position:absolute;right:10px;bottom:10px;width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:tourne .8s linear infinite;z-index:1}
  @keyframes tourne{to{transform:rotate(360deg)}}
  #apercu{position:absolute;left:0;top:0;width:320px;height:180px;border:0;border-radius:12px;background:#000;z-index:4;opacity:0;
    pointer-events:none;transition:opacity .18s}
  #apercu.vu{opacity:1}
  #apercu.plein{position:fixed;left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0;opacity:1;
    pointer-events:auto;z-index:40;transition:none}
  #fermer{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:41;width:34px;height:34px;
    border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #fermer:hover{background:rgba(0,0,0,.65)}
  #fermer svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}
  body.enPlein{overflow:hidden}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="page">
  <div class="tete"><h1>Maps</h1><button class="lance" id="lance" title="Le tirage au hasard du bouton PLAY"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg>PLAY <small id="nbPlay"></small></button><button class="ajout" id="ajout">+ Musique</button><input type="file" id="fic" accept=".html,.js" multiple hidden></div>
  <div id="maps"></div>
</main>
<div id="depot" hidden>Lâche pour ajouter la musique</div>
<div id="toast" hidden></div>
<script src="simulateur/maps.js"></script>
<script>
(async function () {
  const ICO_NOTE = '<svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>';
  const lien = id => 'simulateur/course.html?niv=' + encodeURIComponent(id);
  let ouvert = null;
  const ferme = () => { if (ouvert) { ouvert.remove(); ouvert = null; } };
  document.addEventListener('click', ev => { if (ouvert && !ev.target.closest('.musBox')) ferme(); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') ferme(); });
  const toast = (t) => { const e = document.getElementById('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { e.hidden = true; }, 2200); };
  const peintures = [];   // chaque pastille sait se repeindre
  const repeins = () => peintures.forEach(f => f());

  // une pastille de musique : pour UN niveau, ou pour toute une map (ids = ses niveaux)
  function pastille(box, ids) {
    const mus = box.querySelector('.mus');
    const peins = () => {
      const f = ids.map(id => musiqueDe(niveauDe(id).niv)), memes = f.every(x => x === f[0]);
      const nom = memes ? nomMusique(f[0]) : 'Plusieurs';
      mus.classList.toggle('vide', !nom);
      mus.innerHTML = ICO_NOTE + '<span></span>';
      mus.querySelector('span').textContent = nom || 'Pas de musique';
    };
    peintures.push(peins); peins();
    mus.onclick = ev => {
      ev.stopPropagation(); ev.preventDefault();
      const deja = ouvert && ouvert.parentNode === box; ferme(); if (deja) return;
      const menu = document.createElement('div'); menu.className = 'menu';
      const f = ids.map(id => musiqueDe(niveauDe(id).niv)), choix = f.every(x => x === f[0]) ? f[0] : null;
      for (const m of [{ fichier: '', nom: 'Pas de musique' }, ...MUSIQUES]) {
        const b = document.createElement('button'); b.textContent = m.nom;
        if (!m.fichier) b.classList.add('aucune');
        if (m.fichier === choix) b.classList.add('choisi');
        b.onclick = async () => { ferme(); const ok = await musiqueChoisir(ids, m.fichier); repeins(); if (!ok) toast('Pas enregistré (serveur ?)'); };
        menu.appendChild(b);
      }
      box.appendChild(menu); ouvert = menu;
    };
  }

  // renommer d'un clic : Entrée garde, Échap annule, vide = le nom d'origine — écrit sur le disque (play.json)
  function renommable(el, cle, origine, peins) {
    el.classList.add('renomme'); el.title = 'Renommer';
    el.addEventListener('click', ev => {
      ev.preventDefault(); ev.stopPropagation();
      if (el.isContentEditable) return;
      el.contentEditable = 'plaintext-only';
      if (!el.isContentEditable) el.contentEditable = 'true';
      el.focus();
      const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    });
    el.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); }
      if (ev.key === 'Escape') { ev.stopPropagation(); el.dataset.annule = '1'; el.blur(); }
    });
    el.addEventListener('blur', async () => {
      el.contentEditable = 'false';
      const annule = el.dataset.annule; delete el.dataset.annule;
      if (!annule) {
        const v = el.textContent.replace(/\s+/g, ' ').trim().toUpperCase().slice(0, 60);
        if (!v || v === origine) delete PLAY.noms[cle]; else PLAY.noms[cle] = v;
        if (!await playEnregistre()) toast('Pas enregistré (serveur ?)');
      }
      peins();
    });
  }
  const majPlay = () => { document.getElementById('nbPlay').textContent = poolPlay().length; };

  await musiquesCharge();
  const racine = document.getElementById('maps');
  for (const map of MAPS) {
    const sec = document.createElement('section'); sec.className = 'map';
    sec.innerHTML = '<div class="mapTete"><h2></h2><div class="musBox"><button class="mus"></button></div></div><div class="grille"></div>';
    const h2 = sec.querySelector('h2'), peinsMap = () => { h2.textContent = nomMap(map); };
    peinsMap(); renommable(h2, 'map:' + map.id, map.nom, peinsMap);
    if (map.niveaux.length > 1) pastille(sec.querySelector('.musBox'), map.niveaux.map(n => n.id));
    else sec.querySelector('.musBox').remove();
    // ses niveaux
    const grille = sec.querySelector('.grille');
    map.niveaux.forEach((niv, k) => {
      const c = document.createElement('article'); c.className = 'carte';
      c.innerHTML = '<a class="photo"><img alt=""></a><div class="ligne"><span class="num"></span><span class="nom"></span><button class="jouer">Jouer</button></div><div class="bas"><div class="musBox"><button class="mus"></button></div><button class="pp">PLAY</button></div>';
      c.querySelector('.photo').href = lien(niv.id);
      c.querySelector('.photo').setAttribute('aria-label', 'Jouer sur ' + map.nom + ' · ' + niv.nom);
      const img = c.querySelector('img'); img.src = 'simulateur/' + niv.photo; img.onerror = () => img.remove();
      c.querySelector('.num').textContent = map.niveaux.length > 1 ? k + 1 : '';
      const nomEl = c.querySelector('.nom'), peinsNom = () => { nomEl.textContent = nomNiv(niv); };
      peinsNom(); renommable(nomEl, niv.id, niv.nom, peinsNom);
      // dans le tirage du PLAY, ou pas
      const pp = c.querySelector('.pp');
      const peinsPP = () => { const on = dansPlay(niv); pp.classList.toggle('non', !on); c.classList.toggle('horsPlay', !on); pp.title = on ? 'Dans le tirage du PLAY' : 'Hors du tirage du PLAY'; majPlay(); };
      peinsPP();
      pp.onclick = async () => { PLAY.pool[niv.id] = !dansPlay(niv); peinsPP(); if (!await playEnregistre()) toast('Pas enregistré (serveur ?)'); };
      const ph = c.querySelector('.photo');
      ph.addEventListener('mouseenter', () => survole(niv, ph));
      ph.addEventListener('mouseleave', quitte);
      ph.addEventListener('click', ev => { ev.preventDefault(); plein(niv, ph); });
      c.querySelector('.jouer').onclick = () => plein(niv, ph);
      pastille(c.querySelector('.musBox'), [niv.id]);
      grille.appendChild(c);
    });
    racine.appendChild(sec);
  }

  // ——— LE JEU AU SURVOL : une seule course, chargée tout de suite, posée sur l'image survolée ———
  const AP = { id: null, photo: null, plein: false, veut: null, sortT: 0 };
  const cadre = document.createElement('iframe');
  cadre.id = 'apercu'; cadre.title = 'Course'; cadre.tabIndex = -1; cadre.setAttribute('allow', 'autoplay; fullscreen');
  cadre.src = 'simulateur/course.html?nu=1&niv=' + encodeURIComponent(MAPS[0].niveaux[0].id);
  document.body.appendChild(cadre);
  const fermer = document.createElement('button');
  fermer.id = 'fermer'; fermer.hidden = true; fermer.setAttribute('aria-label', 'Revenir aux maps');
  fermer.innerHTML = '<svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12"/></svg>';
  document.body.appendChild(fermer);
  const S = () => { try { return cadre.contentWindow.SIMU || null; } catch (e) { return null; } };
  function pose(ph) {
    const r = ph.getBoundingClientRect();
    Object.assign(cadre.style, { left: (r.left + scrollX) + 'px', top: (r.top + scrollY) + 'px', width: r.width + 'px', height: r.height + 'px' });
  }
  { const p0 = document.querySelector('.photo'); if (p0) pose(p0); }   // la course se charge à sa taille d'aperçu
  function survole(niv, ph) {
    if (AP.plein) return;
    clearTimeout(AP.sortT);
    if (AP.photo && AP.photo !== ph) AP.photo.classList.remove('charge');
    if (AP.id !== niv.id) cadre.classList.remove('vu');
    AP.photo = ph; AP.id = niv.id; pose(ph); ph.classList.add('charge');
    const s = S(); if (s) s.lance(niv.id); else AP.veut = niv.id;
  }
  function quitte() {
    if (AP.plein) return;
    clearTimeout(AP.sortT);
    AP.sortT = setTimeout(() => {
      cadre.classList.remove('vu'); if (AP.photo) AP.photo.classList.remove('charge'); AP.photo = null;
      const s = S(); if (s) s.pause(true);
    }, 150);
  }
  function plein(niv, ph) {
    ferme();
    survole(niv, ph);
    AP.plein = true; cadre.classList.add('plein'); fermer.hidden = false; document.body.classList.add('enPlein');
    const s = S(); if (s) s.geste();
  }
  function sortPlein() {
    if (!AP.plein) return;
    AP.plein = false; cadre.classList.remove('plein'); fermer.hidden = true; document.body.classList.remove('enPlein');
    if (AP.photo) pose(AP.photo);
    cadre.classList.remove('vu'); if (AP.photo) AP.photo.classList.remove('charge'); AP.photo = null;
    const s = S(); if (s) s.pause(true);
  }
  fermer.onclick = sortPlein;
  addEventListener('simu:echap', sortPlein);   // Échap frappé dans le jeu (le focus y est après un clic dans la course)
  addEventListener('resize', () => { if (AP.photo && !AP.plein) pose(AP.photo); });
  // les touches de la page partent dans la course (sauf pendant qu'on renomme) ; Échap sort du plein écran
  for (const t of ['keydown', 'keyup']) document.addEventListener(t, ev => {
    if (!(AP.photo || AP.plein) || ev.target.isContentEditable) return;
    if (t === 'keydown' && ev.key === 'Escape') { if (AP.plein) { ev.preventDefault(); sortPlein(); } return; }
    const s = S(); if (!s) return;
    s.relaie(t, ev);
    if (/^(Space|Arrow|Shift)/.test(ev.code)) ev.preventDefault();
  });
  (function suit() { // la course n'apparaît sur l'image que quand ce niveau roule vraiment
    requestAnimationFrame(suit);
    const s = S(); if (!s) return;
    if (AP.veut) { s.lance(AP.veut); AP.veut = null; }
    if (!AP.photo || AP.plein) return;
    let ok = false; try { ok = s.roule() && s.etat().niveau === AP.id; } catch (e) {}
    if (ok && !cadre.classList.contains('vu')) { cadre.classList.add('vu'); AP.photo.classList.remove('charge'); }
  })();

  // ajouter une musique : « + Musique » ou un fichier glissé sur la page → simulateur/musiques/
  async function ajoute(files) {
    const noms = [];
    for (const f of files) {
      if (!/\.(html|js)$/i.test(f.name)) { toast(f.name + ' : il faut un .html ou un .js'); continue; }
      try {
        const r = await fetch(SIMU_DIR + 'musiques/' + encodeURIComponent(f.name), { method: 'POST', body: await f.arrayBuffer() });
        const d = await r.json(); if (d.ok) noms.push(d.nom);
      } catch (e) {}
    }
    if (noms.length) { await musiquesCharge(); repeins(); toast('Ajoutée : ' + noms.join(', ')); }
    else if (files.length) toast('Pas ajoutée (serveur ?)');
  }
  document.getElementById('lance').onclick = () => {
    if (!poolPlay().length) { toast('Aucun niveau dans le PLAY'); return; }
    location.href = 'simulateur/course.html?play=1';
  };
  const fic = document.getElementById('fic'), depot = document.getElementById('depot');
  document.getElementById('ajout').onclick = () => fic.click();
  fic.onchange = () => { ajoute([...fic.files]); fic.value = ''; };
  let prof = 0;
  addEventListener('dragenter', ev => { if (ev.dataTransfer.types.includes('Files')) { prof++; depot.hidden = false; } });
  addEventListener('dragleave', () => { if (--prof <= 0) { prof = 0; depot.hidden = true; } });
  addEventListener('dragover', ev => ev.preventDefault());
  addEventListener('drop', ev => { ev.preventDefault(); prof = 0; depot.hidden = true; ajoute([...ev.dataTransfer.files]); });
})();
</script>
</body>
</html>
