<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maps</title>
<!-- LA PAGE DES MAPS DU SIMULATEUR LÉGER (2026-10-12, Léo : « une interface avec les maps, leurs noms, une photo représentative et une
     option jouer sur la map ; chaque map n'a pas de musique pour l'instant, après il faudra associer un fichier à chaque »).
     Page blanche, le moins de texte possible. La liste vit dans simulateur/maps.js ; la pastille de musique d'une map ouvre la liste
     des musiques (simulateur/musiques/) — le choix est gardé dans ce navigateur et la course le lit. JOUER = simulateur/course.html. -->
<style>
  :root{--encre:#111113;--gris:#86868b;--gris2:#b9b9be;--trait:#efeff1;--doux:#f4f4f6;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{color:var(--encre);font-family:var(--sys);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}
  .page{max-width:980px;margin:0 auto;padding:52px max(16px,env(safe-area-inset-left)) 120px}
  h1{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1}
  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:34px 22px;margin-top:38px}
  .carte{display:flex;flex-direction:column;gap:12px;min-width:0}
  .photo{display:block;aspect-ratio:16/9;border-radius:14px;overflow:hidden;position:relative;
    background:linear-gradient(135deg,var(--g1,#e5e5ea),var(--g2,#f5f5f7))}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s cubic-bezier(.32,.72,0,1)}
  .photo:hover img{transform:scale(1.035)}
  .photo:focus-visible,.jouer:focus-visible,.mus:focus-visible{outline:3px solid #0a63d6;outline-offset:3px}
  .ligne{display:flex;align-items:center;gap:10px;min-width:0}
  .nom{font-size:18px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .jouer{margin-left:auto;height:36px;padding:0 20px;border-radius:999px;background:var(--encre);color:#fff;font-size:14px;font-weight:600;flex:none}
  .jouer:active{transform:scale(.97)}
  .musBox{position:relative;align-self:flex-start;max-width:100%}
  .mus{height:30px;padding:0 13px 0 11px;border-radius:999px;background:var(--doux);font-size:12.5px;font-weight:550;
    display:inline-flex;align-items:center;gap:7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mus.vide{background:transparent;box-shadow:inset 0 0 0 1px #dedee2;color:var(--gris)}
  .mus:hover{box-shadow:inset 0 0 0 1px var(--encre);color:var(--encre)}
  .mus svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .menu{position:absolute;left:0;top:36px;z-index:5;min-width:200px;background:#fff;border-radius:12px;padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.06)}
  .menu button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;text-align:left}
  .menu button:hover{background:var(--doux)}
  .menu button.choisi::after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--encre)}
  .menu button.aucune{color:var(--gris)}
</style>
</head>
<body>
<main class="page">
  <h1>Maps</h1>
  <div class="grille" id="grille"></div>
</main>
<script src="simulateur/maps.js"></script>
<script>
(function () {
  const ICO_NOTE = '<svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>';
  const DEGRADES = { ville: ['#2b1140', '#ff3ec8'], nuages: ['#9ec5ff', '#ffd9e8'], orbite: ['#000', '#2b4fa8'] };
  const grille = document.getElementById('grille');
  const jouer = id => { location.href = 'simulateur/course.html?map=' + encodeURIComponent(id); };
  const nomMusique = f => (MUSIQUES.find(m => m.fichier === f) || {}).nom;
  let ouvert = null;
  function ferme() { if (ouvert) { ouvert.remove(); ouvert = null; } }
  document.addEventListener('click', ev => { if (ouvert && !ev.target.closest('.musBox')) ferme(); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') ferme(); });

  for (const map of MAPS) {
    const carte = document.createElement('article'); carte.className = 'carte';
    const g = DEGRADES[map.id] || [];
    carte.innerHTML = `
      <a class="photo" href="simulateur/course.html?map=${map.id}" style="--g1:${g[0] || '#e5e5ea'};--g2:${g[1] || '#f5f5f7'}" aria-label="Jouer sur ${map.nom}"><img alt="" src="simulateur/${map.photo}"></a>
      <div class="ligne"><span class="nom"></span><button class="jouer">Jouer</button></div>
      <div class="musBox"><button class="mus"></button></div>`;
    carte.querySelector('.nom').textContent = map.nom;
    const img = carte.querySelector('img'); img.onerror = () => img.remove();
    carte.querySelector('.jouer').onclick = () => jouer(map.id);
    const mus = carte.querySelector('.mus'), box = carte.querySelector('.musBox');
    const peins = () => {
      const f = musiqueDe(map), nom = nomMusique(f);
      mus.classList.toggle('vide', !nom);
      mus.innerHTML = ICO_NOTE + '<span></span>';
      mus.querySelector('span').textContent = nom || 'Pas de musique';
    };
    peins();
    mus.onclick = ev => {
      ev.stopPropagation();
      const deja = ouvert && ouvert.parentNode === box; ferme(); if (deja) return;
      const menu = document.createElement('div'); menu.className = 'menu';
      const choix = musiqueDe(map);
      for (const m of [{ fichier: '', nom: 'Pas de musique' }, ...MUSIQUES]) {
        const b = document.createElement('button'); b.textContent = m.nom;
        if (!m.fichier) b.classList.add('aucune');
        if (m.fichier === choix) b.classList.add('choisi');
        b.onclick = () => { musiqueChoisir(map, m.fichier); peins(); ferme(); };
        menu.appendChild(b);
      }
      box.appendChild(menu); ouvert = menu;
    };
    grille.appendChild(carte);
  }
})();
</script>
</body>
</html>
