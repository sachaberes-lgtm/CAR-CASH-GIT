<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maps</title>
<!-- LES MAPS DU JEU (2026-10-15, refaite le 16/10 — Léo : « je veux juste une liste des maps qu'on a actuellement sur le jeu, qui sont
     disponibles, pour que je puisse appuyer dessus, aller voir dedans et te donner des changements à faire »).
     Une ligne par map (photo + nom, la liste vit dans maps.js) ; un toucher = voir.html : le vrai jeu, parti tout seul sur cette map.
     Outil LOCAL : retiré du site par vercel-build.sh (il changerait l'empreinte du jeu publié). Servir par
     `python3 repertoire-maps/serveur.py 9244` (depuis VERSION PRINCIPALE : sans cache, sans le service worker du jeu). -->
<style>
  :root{--encre:#111113;--gris:#86868b;--gris2:#b9b9be;--trait:#efeff1;--doux:#f4f4f6;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{color:var(--encre);font-family:var(--sys);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .page{max-width:760px;margin:0 auto;padding:52px max(16px,env(safe-area-inset-right)) 100px max(16px,env(safe-area-inset-left))}
  h1{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1}
  ol{list-style:none;margin-top:28px;border-top:1px solid var(--trait)}
  li a{display:grid;grid-template-columns:22px 200px minmax(0,1fr) 20px;align-items:center;column-gap:18px;padding:12px 6px;
    border-bottom:1px solid var(--trait);color:inherit;text-decoration:none;border-radius:12px;transition:background .15s}
  li a:hover{background:#fafafb}
  li a:active{background:var(--doux)}
  .num{font-size:13px;color:var(--gris2);text-align:right;font-variant-numeric:tabular-nums}
  .ph{display:block;width:200px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--doux)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  li a:hover .ph img{transform:scale(1.04)}
  .mil{display:flex;align-items:center;gap:10px;min-width:0}
  .nom{font-size:19px;font-weight:650;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nb{flex:none;height:22px;padding:0 9px;border-radius:999px;background:#ff3b30;color:#fff;font-size:12px;font-weight:650;
    display:inline-flex;align-items:center;font-variant-numeric:tabular-nums}
  .nb:empty{display:none}
  .fl{color:var(--gris2)}
  li a:hover .fl{color:var(--encre)}
  svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
  @media (max-width:560px){
    li a{grid-template-columns:120px minmax(0,1fr) 16px;column-gap:14px;padding:10px 2px}
    .num{display:none}
    .ph{width:120px;border-radius:8px}
    .nom{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){.ph img{transition:none}}
</style>
</head>
<body>
<div class="page">
  <h1>Maps</h1>
  <p style="margin:-6px 0 14px;font-size:14px"><a href="revue.html" style="color:inherit">→ La revue des maps : images seulement, garder / virer</a></p>
  <ol id="liste"></ol>
</div>
<script>
// (16/10) le service worker du JEU, s'il s'est installé sur cette adresse (voir.html charge le jeu), fait échouer maps.js et les photos dans le
// navigateur du chat (la liste restait VIDE) : on le retire et on recharge une fois. serveur.py refuse sw.js, il ne revient pas.
if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(rs => {
  if (!rs.length) return;
  Promise.all(rs.map(r => r.unregister())).then(() => { try { if (!sessionStorage.getItem('ccSwRetire')) { sessionStorage.setItem('ccSwRetire', '1'); location.reload(); } } catch (e) {} });
}).catch(() => {});
</script>
<script src="maps.js"></script>
<script>
(function(){
  const L = window.REPERTOIRE || [];
  if (!L.length) { document.getElementById('liste').innerHTML = '<li style="padding:24px 6px;color:#86868b">La liste ne s\'est pas chargée : recharge la page.</li>'; return; }
  document.getElementById('liste').innerHTML = L.map((m, i) =>
    '<li><a href="voir.html?carte=' + m.id + '&meteo=' + m.couverture + '">' +
      '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="ph"><img alt="" src="img/' + m.id + '-' + m.couverture + '.jpg"></span>' +
      '<span class="mil"><span class="nom">' + m.nom + '</span><span class="nb" data-c="' + m.id + '"></span></span>' +
      '<span class="fl"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>' +
    '</a></li>').join('');
  // (2026-10-17) LES NOTES : à côté du nom, combien il en reste À FAIRE dans cette map (on les écrit DANS la map : voir.html › Notes)
  const compte = () => fetch('notes', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    for (const el of document.querySelectorAll('.nb[data-c]')) {
      const k = d.notes.filter(n => n.carte === el.dataset.c && !n.fait).length;
      el.textContent = k ? k + (k > 1 ? ' notes' : ' note') : '';
    }
  }).catch(() => {});
  compte(); addEventListener('pageshow', compte); addEventListener('focus', compte);
})();
</script>
</body>
</html>
