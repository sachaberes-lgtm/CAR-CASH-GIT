<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Répertoire des maps</title>
<!-- LE RÉPERTOIRE DES MAPS (2026-10-15, Léo) — une page blanche : les maps que JOUER tire au hasard, chacune son titre et sa photo.
     La liste vit dans maps.js (lu par <script> : la page marche aussi en double-clic, file://). Une vignette de météo survolée ou
     touchée prend la place de la photo ; la photo touchée s'ouvre en grand (← → les météos de la map, Échap ferme). Outil LOCAL :
     retiré du site par vercel-build.sh (il changerait l'empreinte du jeu publié). -->
<style>
  :root{--encre:#111113;--gris:#86868b;--gris2:#b9b9be;--trait:#efeff1;--doux:#f4f4f6;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{color:var(--encre);font-family:var(--sys);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer}
  .page{max-width:1180px;margin:0 auto;padding:52px max(16px,env(safe-area-inset-left)) 120px max(16px,env(safe-area-inset-right))}
  h1{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1}
  #compte{font-size:13px;color:var(--gris);margin-top:8px}

  .grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 28px;margin-top:40px}
  @media (max-width:760px){.grille{grid-template-columns:minmax(0,1fr);gap:36px}}

  .map{min-width:0}
  .photo{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--doux);cursor:zoom-in}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .18s}
  .photo .mt{position:absolute;left:12px;bottom:10px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.6);opacity:0;transition:opacity .18s}
  .photo.autre .mt{opacity:1}
  .tete{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding:0 3px}
  .num{font-size:13px;color:var(--gris2);font-variant-numeric:tabular-nums}
  .nom{font-size:21px;font-weight:650;letter-spacing:-.01em}

  .meteos{display:flex;gap:8px;margin-top:9px;padding:3px}
  .met{flex:1 1 0;min-width:0;max-width:76px;text-align:left}
  .met img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:var(--doux);
    outline:2px solid transparent;outline-offset:1px;transition:outline-color .15s}
  .met span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--gris);margin-top:5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .met.on img{outline-color:var(--encre)}
  .met.on span{color:var(--encre)}

  /* ---------- EN GRAND ---------- */
  #grand{position:fixed;inset:0;background:rgba(10,10,12,.94);display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:10}
  #grand.on{display:flex}
  #grand img{max-width:min(1280px,100%);max-height:calc(100% - 70px);border-radius:12px;display:block}
  #legende{color:#fff;margin-top:16px;text-align:center}
  #legende b{font-size:17px;font-weight:650;letter-spacing:-.01em}
  #legende span{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;color:#a1a1a6;margin-top:4px}
  .fl{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;background:rgba(255,255,255,.12);
    color:#fff;display:grid;place-items:center}
  .fl:hover{background:rgba(255,255,255,.22)}
  #prec{left:16px}#suiv{right:16px}
  #ferme{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
  svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion:reduce){.photo img{transition:none}}
</style>
</head>
<body>
<div class="page">
  <h1>Maps</h1>
  <p id="compte"></p>
  <div class="grille" id="grille"></div>
</div>
<div id="grand" role="dialog" aria-modal="true" aria-label="Photo en grand">
  <button id="ferme" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="fl" id="prec" aria-label="Météo précédente"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="fl" id="suiv" aria-label="Météo suivante"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <img id="grandImg" alt="">
  <div id="legende"><b id="grandNom"></b><span id="grandMt"></span></div>
</div>
<script src="maps.js"></script>
<script>
(function(){
  const L = window.REPERTOIRE || [], $ = id => document.getElementById(id);
  const src = (m, k) => 'img/' + m.id + '-' + k + '.jpg';
  let nAmb = 0; L.forEach(m => nAmb += m.meteos.length);
  $('compte').textContent = L.length + ' maps · ' + nAmb + ' ambiances';

  const grille = $('grille');
  L.forEach((m, i) => {
    const el = document.createElement('section'); el.className = 'map';
    const cov = m.meteos.find(x => x[0] === m.couverture) || m.meteos[0];
    el.innerHTML =
      '<button class="photo" aria-label="Voir ' + m.nom + ' en grand"><img alt="' + m.nom + '" src="' + src(m, cov[0]) + '"><span class="mt"></span></button>' +
      '<div class="tete"><span class="num">' + String(i + 1).padStart(2, '0') + '</span><h2 class="nom">' + m.nom + '</h2></div>' +
      '<div class="meteos">' + m.meteos.map(x =>
        '<button class="met' + (x[0] === cov[0] ? ' on' : '') + '" data-k="' + x[0] + '"><img loading="lazy" alt="" src="' + src(m, x[0]) + '"><span>' + x[1] + '</span></button>').join('') +
      '</div>';
    const ph = el.querySelector('.photo'), img = ph.querySelector('img'), mt = ph.querySelector('.mt');
    let cur = cov[0];
    const montre = k => {
      if (k === cur) return; cur = k;
      const x = m.meteos.find(y => y[0] === k);
      img.src = src(m, k); mt.textContent = x[1];
      ph.classList.toggle('autre', k !== cov[0]);
      el.querySelectorAll('.met').forEach(b => b.classList.toggle('on', b.dataset.k === k));
    };
    el.querySelectorAll('.met').forEach(b => {
      b.addEventListener('mouseenter', () => montre(b.dataset.k));
      b.addEventListener('click', () => montre(b.dataset.k));
    });
    ph.addEventListener('click', () => ouvre(m, cur));
    grille.appendChild(el);
  });

  // ---------- EN GRAND ----------
  let G = null;
  function ouvre(m, k){ G = { m: m, i: Math.max(0, m.meteos.findIndex(x => x[0] === k)) }; peins(); $('grand').classList.add('on'); }
  function ferme(){ $('grand').classList.remove('on'); G = null; }
  function peins(){ const x = G.m.meteos[G.i]; $('grandImg').src = src(G.m, x[0]); $('grandNom').textContent = G.m.nom; $('grandMt').textContent = x[1]; }
  function pas(d){ if (!G) return; const n = G.m.meteos.length; G.i = (G.i + d + n) % n; peins(); }
  $('ferme').onclick = ferme; $('prec').onclick = () => pas(-1); $('suiv').onclick = () => pas(1);
  $('grand').addEventListener('click', e => { if (e.target === $('grand')) ferme(); });
  document.addEventListener('keydown', e => {
    if (!G) return;
    if (e.key === 'Escape') ferme(); else if (e.key === 'ArrowLeft') pas(-1); else if (e.key === 'ArrowRight') pas(1);
  });
  let x0 = null; // glisser du doigt = météo suivante / précédente
  $('grand').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  $('grand').addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) pas(dx < 0 ? 1 : -1); });
})();
</script>
</body>
</html>
