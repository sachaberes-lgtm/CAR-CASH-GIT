<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musiques</title>
<!-- L'ÉCOUTE DES MAPS (2026-10-13, Léo : « fais-moi la même page blanche avec toutes les maps ayant un système de génération aléatoire
     qui suit la vitesse ; sans la jauge musique manuelle : juste le nom de la musique et un bouton play qui fait défiler automatiquement de
     la plus petite à la plus grande vitesse ; une photo représentative »).
     · Les cartes = UNE PAR MUSIQUE de la bibliothèque (musiques/ : page .html à jauge #speed, ou module .js setSpeed), toutes — 13/10 :
       « les musiques, on les entend pas toutes » (la 1re version faisait une carte par map : French Touch deux fois, Glisse absente).
       Sous le nom : les maps où elle joue d'après LE CHOIX (choix-musiques.json, sinon la musique de la map), ou « Pas encore sur une map ».
       Photo = le 1er niveau qui la joue (aucune : le fond gris).
     · ▶ = la musique seule (pas le jeu), et la VITESSE qui monte toute seule de 0 à 100 % en `MONTEE` s (linéaire), puis reste au
       maximum jusqu'à l'arrêt. Le fil sous la photo montre où on en est. Un seul son à la fois ; ▶ sur la carte qui joue = arrêt.
     · Hors du site (vercel-build.sh retire tout le dossier simulateur/). Servie par simulateur/serveur.py :
       http://127.0.0.1:9101/simulateur/ecoute.html — ?muet=1 : tout se joue, rien ne sort (bancs). Console : ECOUTE.etat(). -->
<style>
  :root{--encre:#111113;--gris:#86868b;--gris2:#b9b9be;--trait:#efeff1;--doux:#f4f4f6;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{color:var(--encre);font-family:var(--sys);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}
  .page{max-width:1040px;margin:0 auto;padding:52px max(16px,env(safe-area-inset-left)) 120px}
  h1{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1}
  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:34px 20px;margin-top:40px}
  .carte{display:flex;flex-direction:column;gap:12px;min-width:0}
  .photo{position:relative;display:block;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#e5e5ea,#f5f5f7);cursor:pointer}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s cubic-bezier(.32,.72,0,1)}
  .photo:hover img{transform:scale(1.035)}
  .fil{position:absolute;left:0;bottom:0;height:5px;width:100%;background:rgba(255,255,255,.35);opacity:0;transition:opacity .25s}
  .fil i{display:block;height:100%;width:0;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8)}
  .carte.joue .fil{opacity:1}
  .ligne{display:flex;align-items:center;gap:12px;min-width:0}
  .play{width:40px;height:40px;border-radius:50%;background:var(--encre);color:#fff;display:grid;place-items:center;flex:none}
  .play:active{transform:scale(.95)}
  .play svg{width:13px;height:13px;fill:currentColor}
  .play .iS{display:none}
  .carte.joue .play .iS{display:block}.carte.joue .play .iP{display:none}
  .play:focus-visible{outline:3px solid #0a63d6;outline-offset:3px}
  .txt{min-width:0}
  .nom{font-size:16px;font-weight:650;letter-spacing:-.005em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nom small{font-size:13px;font-weight:550;color:var(--gris);margin-left:6px}
  .mus{font-size:13.5px;color:var(--gris);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vide{margin-top:40px;color:var(--gris);font-size:15px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="page">
  <h1>Musiques</h1>
  <div class="grille" id="grille"></div>
  <p class="vide" id="vide" hidden>Aucune musique dans la bibliothèque.</p>
</main>
<script src="maps.js"></script>
<script>
(async function () {
'use strict';
const MONTEE = 40;   // secondes : de 0 à 100 % de vitesse — puis elle reste au maximum jusqu'à ce qu'on l'arrête (13/10 : elle se coupait 6 s après)
const MUET = new URLSearchParams(location.search).get('muet') === '1';
// ?muet=1 : la sortie de chaque contexte audio passe par un gain à zéro (tout se calcule, rien ne s'entend)
function muetPose(win) {
  try {
    const B = win.BaseAudioContext || win.AudioContext, d = Object.getOwnPropertyDescriptor(B.prototype, 'destination');
    if (!d || B.prototype.__muet) return;
    Object.defineProperty(B.prototype, 'destination', { configurable: true, get() {
      if (!this.__m) { this.__m = this.createGain(); this.__m.gain.value = 0; this.__m.connect(d.get.call(this)); } return this.__m; } });
    B.prototype.__muet = true;
  } catch (e) {}
}
if (MUET) muetPose(window);

await musiquesCharge();

// les cartes : UNE PAR MUSIQUE de la bibliothèque — toutes, même celles qui n'ont pas encore de map (13/10, Léo : « les musiques, on les
// entend pas toutes » : une carte par map montrait deux fois French Touch et cachait Glisse). Dessous, les maps où elle joue.
const CARTES = MUSIQUES.map(m => {
  const ou = [];   // [{ map, nivs }] : les maps (et leurs niveaux) qui ont cette musique
  for (const map of MAPS) {
    const nivs = map.niveaux.filter(n => musiqueDe(n) === m.fichier);
    if (nivs.length) ou.push({ map, nivs });
  }
  const maps = ou.map(({ map, nivs }) => nomMap(map) + (nivs.length === map.niveaux.length ? '' : ' ' + nivs.map(n => map.niveaux.indexOf(n) + 1).join(' · '))).join(' · ');
  return { fichier: m.fichier, nom: m.nom, maps: maps || 'Pas encore sur une map', photo: ou.length ? ou[0].nivs[0].photo : '', sur: ou.length > 0 };
});
CARTES.sort((x, y) => (y.sur - x.sur));   // celles qui ont une map d'abord
const grille = document.getElementById('grille');
document.getElementById('vide').hidden = CARTES.length > 0;
for (const C of CARTES) {
  const el = document.createElement('article'); el.className = 'carte';
  el.innerHTML = '<div class="photo"><img alt=""><div class="fil"><i></i></div></div>' +
    '<div class="ligne"><button class="play" aria-label="Écouter"><svg class="iP" viewBox="0 0 10 12"><path d="M1 0l9 6-9 6z"/></svg>' +
    '<svg class="iS" viewBox="0 0 10 10"><path d="M0 0h10v10H0z"/></svg></button><div class="txt"><div class="nom"></div><div class="mus"></div></div></div>';
  const img = el.querySelector('img'); if (C.photo) { img.src = C.photo; img.onerror = () => img.remove(); } else img.remove();
  el.querySelector('.nom').textContent = C.nom;
  el.querySelector('.mus').textContent = C.maps;
  C.el = el; C.fil = el.querySelector('.fil i');
  el.querySelector('.play').onclick = () => joue(C);
  el.querySelector('.photo').onclick = () => joue(C);
  grille.appendChild(el);
}

// ——— LE LECTEUR : une musique à la fois, la vitesse qui monte toute seule ———
const L = { C: null, type: '', inst: null, cadre: null, bouton: null, jauge: null, t: 0, jeton: 0, mods: {} };
const joueDeja = () => L.type === 'js' ? !!(L.inst && L.inst.playing) : L.type === 'html' ? !!(L.bouton && /stop/i.test(L.bouton.textContent)) : false;
function arrete() {
  L.jeton++;
  try { if (L.type === 'js' && L.inst && L.inst.playing) L.inst.stop(); if (L.type === 'html' && joueDeja()) L.bouton.click(); } catch (e) {}
  if (L.cadre) L.cadre.remove();
  if (L.C) { L.C.el.classList.remove('joue'); L.C.fil.style.width = '0'; }
  Object.assign(L, { C: null, type: '', inst: null, cadre: null, bouton: null, jauge: null, t: 0 });
}
function vitesse(x) {
  try {
    if (L.type === 'js' && L.inst) { if (L.inst.setSpeed) L.inst.setSpeed(x); else L.inst.setTier(1 + Math.round(x * 4), 5); }
    if (L.type === 'html' && L.jauge) { L.jauge.value = (x * 100).toFixed(1); L.jauge.dispatchEvent(new L.cadre.contentWindow.Event('input')); }
  } catch (e) {}
}
async function joue(C) {
  if (L.C === C) { arrete(); return; }
  arrete();
  const jeton = L.jeton, f = C.fichier;
  L.C = C; L.t = 0; C.el.classList.add('joue');
  if (/\.js$/i.test(f)) {
    L.type = 'js';
    try {
      let inst = L.mods[f];
      if (!inst) {
        const mod = await import(new URL(f, SIMU_DIR).href);
        const fab = Object.values(mod).find(v => typeof v === 'function' && /^create/i.test(v.name)) || Object.values(mod).find(v => typeof v === 'function');
        inst = L.mods[f] = fab({});
      }
      if (jeton !== L.jeton) return;
      L.inst = inst; vitesse(0); inst.start(); vitesse(0);
    } catch (e) { arrete(); }
    return;
  }
  L.type = 'html';
  const fr = document.createElement('iframe');
  fr.src = SIMU_DIR + f; fr.tabIndex = -1; fr.setAttribute('aria-hidden', 'true'); fr.setAttribute('allow', 'autoplay');
  // visible pour le navigateur (sinon sa boucle d'images s'arrête), invisible pour nous
  fr.style.cssText = 'position:fixed;left:0;bottom:0;width:8px;height:8px;opacity:0;pointer-events:none;border:0;z-index:-1';
  fr.onload = () => {
    if (jeton !== L.jeton) return;
    try {
      if (MUET) muetPose(fr.contentWindow);
      const d = fr.contentDocument;
      L.bouton = d.getElementById('play'); L.jauge = d.getElementById('speed');
      if (L.jauge) L.jauge.step = 'any';
      vitesse(0);
      if (L.bouton && !joueDeja()) L.bouton.click();
    } catch (e) { arrete(); }
  };
  document.body.appendChild(fr); L.cadre = fr;
}
// la montée : 0 → 100 % en MONTEE s, puis tenue au maximum jusqu'à l'arrêt — sur l'HORLOGE (une minuterie, pas les images : un onglet caché
// n'a plus d'images, et la musique, elle, continue) ; le temps ne court qu'une fois le son parti
let der = performance.now();
setInterval(() => {
  const now = performance.now(), dt = Math.min(1, (now - der) / 1000); der = now;
  if (!L.C || !joueDeja()) return;
  L.t += dt;
  const x = Math.min(1, L.t / MONTEE);
  vitesse(x);
  const w = (x * 100).toFixed(1) + '%';
  if (L.C.fil.style.width !== w) L.C.fil.style.width = w;
}, 50);
addEventListener('keydown', ev => { if (ev.key === 'Escape') arrete(); });

window.ECOUTE = {
  etat: () => ({ cartes: CARTES.map(C => C.nom + ' → ' + C.maps), joue: L.C && L.C.nom,
    type: L.type, son: joueDeja(), vitesse: +Math.min(1, L.t / MONTEE).toFixed(3),
    bpm: L.type === 'js' && L.inst ? Math.round(L.inst.bpm) : null, muet: MUET }),
  arrete,
};
})();
</script>
</body>
</html>
