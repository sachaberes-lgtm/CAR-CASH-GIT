<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Simulateur</title>
<!-- LA COURSE DU SIMULATEUR (2026-10-12, Léo : « il faut que ce soit les bonnes maps et la bonne physique »).
     Rien n'est refait : c'est LE JEU (../index.html, tel que sur le main, sans une ligne changée) dans un cadre, à la taille d'un
     téléphone couché (844 × 390, comme le jeu sur l'ordi), lancé directement sur le niveau choisi. Autour :
     · la sauvegarde du jeu SUR CETTE ADRESSE : sa musique coupée (on n'entend que celle du niveau), l'auto-école déjà faite ;
     · le DÉPART : au premier toucher (l'écran titre du jeu le demande), le niveau part tout seul — la carrière par dbgCampagne(n, monde),
       la partie sans fin par le JOUER de l'accueil ; une partie finie (mort, fin de monde) repart d'elle-même sur le même niveau ;
     · LA MUSIQUE DU NIVEAU (Léo, 12/10 soir : « tester mes sons dans les maps pour choisir où ils vont, et l'intensité proportionnelle au
       palier moteur ») — deux formats, un seul pilote (MUS) :
         - une PAGE .html à jauge (le French Touch), jouée telle quelle dans un cadre invisible : son #play, sa jauge #speed (0-100), son #bpm ;
         - un MODULE .js (musique-glisse.js) : importé, sa fonction exportée rend { start, stop, setTier, setSpeed, bpm }.
       L'INTENSITÉ (0-1) suit au choix :
         - le MOTEUR (par défaut) = 5 PALIERS DE MUSIQUE sur les 30 moteurs (moteurs 1-5 · 6-10 · 11-15 · 16-20 · 21-30, le découpage du
           CAHIER-MUSIQUE validé le 12/10) → intensité (P − 1) ÷ 4 ; au module, son API : setTier(P, 5). ⚠ Pas setTier(moteur, 30) : un
           moteur de plus ne bouge la cible que de 0,034, et Glisse v2 ne joue sa transition (roulement qui monte / plongée qui descend)
           qu'au-delà de 0,06 — à 30 crans on ne l'entendait jamais. Il repart de zéro à chaque partie, comme dans le jeu ;
         - la VITESSE = FLOW.vit (lue par dbgFren) — MESURÉ au banc : ~0,35 au départ, 1,2-1,3 en croisière, 1,5-1,9 en nitro → 13 % ·
           ~70 % · 90-100 % ; zéro hors course et à l'explosion.
       Le curseur de la barre MONTRE l'intensité ; le tirer la FORCE (AUTO rend la main). « + » monte le VRAI moteur jusqu'au palier de
       musique suivant (dbgMoteur en rafale : carte, son, poussée — une seule carte, engBigFile ne garde que la dernière).
       ⚠ Les const du jeu (ENGINE_TIERS…) ne sont PAS lisibles d'ici (w.eval → ReferenceError) : seuls dbgState / dbg* le sont.
       La pastille ♪ change la musique du niveau en direct, et l'écrit sur le disque (choix-musiques.json).
     · LE PLAY (?play=1, le bouton PLAY de la page des maps — Léo, 12/10 : « tu es mon organisateur de map aléatoire pour le bouton PLAY ») :
       les niveaux DANS LE PLAY (play.json) tirés au hasard, chacun avec sa musique, sans redite tant que le tour n'est pas fini (le
       nouveau tour ne recommence pas par le dernier joué) ; une partie finie → le niveau suivant du tirage. ⏭ = passer au suivant (la caisse
       explose : dbgBoom). La partie sans fin après un autre niveau recharge le jeu (son JOUER rejouerait la carrière ou la jade) : un toucher.
     · LA COURSE SEULE (Léo, 12/10 : « l'important, c'est qu'on puisse jouer dans la map : enlève l'écran d'accueil ; je dois pouvoir jouer
       dès que je mets mon curseur sur l'image, avec mes flèches, la musique automatiquement ; si je clique, c'est juste la course ») :
       le jeu est chargé avec `?simu=1` (pas d'écran titre : le niveau part sans toucher) ; `?nu=1` = sans la barre (la page des maps
       pose cette page sur l'image survolée, puis en plein écran au clic) ; SIMU.lance(id) change de niveau SANS recharger (la course en
       cours finit par dbgQuitte, la suivante part 0,25 s après) ; SIMU.pause(vrai|faux) = le panneau ⏸ du jeu (__panBascule, 3-2-1 au
       retour) ; SIMU.relaie(type, touche) = une touche venue de la page des maps ; SIMU.geste() = le geste qui réveille la musique.
       (12/10, Léo : « quand j'appuie sur la musique, un truc qui loop et ne s'arrête pas, et ça met aussi la musique du gameplay ») —
       MESURÉ : la page des maps et cette course partageaient le même fil (même site) : le jeu la bloquait jusqu'à 0,8 s au garage, 1,8 s
       à un changement de niveau, 15 s au chargement → l'écoute crachait des paquets de notes. La page des maps charge donc cette course
       depuis l'AUTRE nom du même serveur (localhost ⇄ 127.0.0.1 = un autre site = un autre processus) et lui parle par MESSAGES
       (postMessage : lance · pause · dort · touche · geste ; elle répond etat / echap). DORT (`E.dort`, vrai au départ en aperçu) = la
       souris n'est sur aucune image : musique coupée, course en pause, pas de relance après une fin — plus rien ne joue en cachette.
     ?muet=1 : tout se joue, rien ne sort (bancs). Console : SIMU.etat(). -->
<style>
  :root{--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:var(--sys);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}
  #barre{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-left));
    font-size:13px;white-space:nowrap;z-index:2}
  #retour{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12);flex:none}
  #retour:hover{background:rgba(255,255,255,.22)}
  #retour svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  #titre{font-weight:650;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
  #outils{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
  .pil{height:28px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12.5px;font-weight:550;display:inline-flex;align-items:center;gap:6px}
  .pil:hover{background:rgba(255,255,255,.22)}
  .pil svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .pil.vide{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);color:rgba(255,255,255,.6)}
  .musBox{position:relative}
  .menu{position:absolute;right:0;top:34px;z-index:5;min-width:190px;background:#1c1c1e;border-radius:12px;padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
  .menu button{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border-radius:8px;font-size:13px;text-align:left}
  .menu button:hover{background:rgba(255,255,255,.1)}
  .menu button.choisi::after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:#fff}
  .menu button.aucune{color:rgba(255,255,255,.55)}
  #mot{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;opacity:.9}
  #mot b{font-weight:650}
  #plus{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);font-size:16px;line-height:1;display:grid;place-items:center}
  #plus:hover{background:rgba(255,255,255,.24)}
  #intens{width:120px;accent-color:#fff;cursor:pointer}
  #intens.force{accent-color:#ffd60a}
  #pct{width:38px;text-align:right;font-variant-numeric:tabular-nums;opacity:.85}
  #auto{height:24px;padding:0 9px;border-radius:999px;background:#ffd60a;color:#000;font-size:11.5px;font-weight:700}
  #source{opacity:.75}
  #bpm{opacity:.55;font-variant-numeric:tabular-nums;width:56px}
  #suivant{padding:0 10px}
  #suivant svg{width:14px;height:14px;fill:currentColor;stroke:none}
  #zone{position:fixed;left:0;right:0;top:44px;bottom:0;display:grid;place-items:center}
  #jeu{border:0;display:block;background:#000}
  #err{position:fixed;left:12px;right:12px;bottom:12px;background:#d70015;color:#fff;font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px 12px;border-radius:10px;white-space:pre-wrap;z-index:3}
  @media (max-width:900px){#titre,#bpm{display:none}}
  html.nu #barre{display:none}
  html.nu #zone{top:0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="barre">
  <a id="retour" href="../simulateur.html" aria-label="Retour aux maps"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
  <b id="titre"></b>
  <div id="outils">
    <div class="musBox"><button class="pil" id="musBtn"></button></div>
    <span id="mot"><b id="motN">–</b><button id="plus" title="Monter le moteur au palier de musique suivant">+</button></span>
    <input type="range" id="intens" min="0" max="100" step="0.1" value="0" title="L'intensité de la musique — tire pour la forcer">
    <span id="pct">0 %</span>
    <button id="auto" hidden>AUTO</button>
    <button class="pil" id="source" title="Ce que l'intensité suit"></button>
    <span id="bpm"></span>
    <button class="pil" id="suivant" title="Niveau suivant du PLAY" hidden><svg viewBox="0 0 16 12"><path d="M0 0l7 6-7 6zM7 0l7 6-7 6zM14 0h2v12h-2z"/></svg></button>
  </div>
</div>
<div id="zone"><iframe id="jeu" title="CASH CAR" allow="autoplay; fullscreen"></iframe></div>
<div id="err" hidden></div>
<script src="maps.js"></script>
<script>
(async function () {
'use strict';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const MUET = Q.get('muet') === '1';
const NU = Q.get('nu') === '1';   // la course seule, sans la barre (la page des maps l'affiche sur l'image survolée)
if (NU) document.documentElement.classList.add('nu');
// le niveau en cours (en mode PLAY il change à chaque partie) et ses noms (ceux que Léo a donnés)
const SEQ = { on: Q.get('play') === '1', ordre: [], i: -1, n: 0, saute: false, dernier: '' };
let MAP, NIV, L;
function peinsTitre() {
  const num = MAP.niveaux.length > 1 ? ' ' + (MAP.niveaux.indexOf(NIV) + 1) : '';
  $('titre').textContent = (SEQ.on ? 'PLAY ' + SEQ.n + ' · ' : '') + nomMap(MAP) + num + ' · ' + nomNiv(NIV);
  document.title = (SEQ.on ? 'PLAY · ' : '') + nomMap(MAP) + num + ' · simulateur';
}
function niveauPose(id) { const T = niveauDe(id) || niveauDe('v1'); MAP = T.map; NIV = T.niv; L = NIV.lance; peinsTitre(); }
niveauPose(Q.get('niv'));
const erreur = m => { const e = $('err'); e.textContent = String(m).slice(0, 400); e.hidden = false; };

// ——— 1) la sauvegarde du jeu, sur CETTE adresse seulement : sa musique coupée, l'auto-école faite ———
try {
  const d = JSON.parse(localStorage.getItem('cashcarSave') || '{}') || {};
  d.v = d.v || 2; d.mus = false; d.tuto = 1; d.permis = 1;
  localStorage.setItem('cashcarSave', JSON.stringify(d));
} catch (e) {}

// ——— 2) le jeu, à la taille d'un téléphone couché (debout si la fenêtre est plus haute que large) ———
const jeu = $('jeu');
function taille() {
  const W = innerWidth, H = innerHeight - (NU ? 0 : 44), debout = H > W * 1.1;
  const w = debout ? 390 : 844, h = debout ? 844 : 390;
  jeu.style.width = w + 'px'; jeu.style.height = h + 'px'; jeu.style.zoom = Math.min(W / w, H / h);
}
addEventListener('resize', taille); taille();
jeu.src = '../index.html?simu=1&play=sansfin'; // (2026-10-12) le JOUER du jeu lance désormais le SOLEIL DE JADE : la partie SANS FIN le demande sans lui · simu=1 : pas d'écran titre
const focusJeu = () => { try { jeu.focus(); jeu.contentWindow.focus(); } catch (e) {} };
jeu.addEventListener('load', () => {
  focusJeu();
  try {
    const w = jeu.contentWindow;
    for (const t of ['pointerdown', 'keydown']) w.addEventListener(t, geste, true);
    if (NU) w.addEventListener('keydown', ev => { if (ev.key === 'Escape') try { parent.postMessage({ simu: 'echap' }, '*'); } catch (e) {} }, true);
  } catch (e) { erreur('Le jeu ne se laisse pas lire : ' + e.message); }
});
// le doigt sur la barre (curseur, menus) reste dans la barre ; ailleurs, le focus revient au jeu
document.addEventListener('pointerdown', ev => { if (!ev.target.closest('#barre')) setTimeout(focusJeu, 0); });
// une touche frappée pendant que cette page a le focus part dans le jeu (comme le cadre du jeu sur l'ordi)
for (const t of ['keydown', 'keyup']) addEventListener(t, ev => {
  if (ev.target === jeu || ev.target.closest && ev.target.closest('#barre')) return;
  geste();
  try { const w = jeu.contentWindow; w.document.dispatchEvent(new w.KeyboardEvent(t, { code: ev.code, key: ev.key, keyCode: ev.keyCode, repeat: ev.repeat, bubbles: true, cancelable: true })); } catch (e) {}
  if (/^(Space|Arrow)/.test(ev.code)) ev.preventDefault();
});

// ——— 3) la musique du niveau : un pilote, deux formats ———
// ?muet=1 : la sortie de chaque contexte audio passe par un gain à zéro (tout se calcule, rien ne s'entend)
function muetPose(win) {
  try {
    const B = win.BaseAudioContext || win.AudioContext, d = Object.getOwnPropertyDescriptor(B.prototype, 'destination');
    if (!d || B.prototype.__muet) return;
    Object.defineProperty(B.prototype, 'destination', { configurable: true, get() {
      if (!this.__m) { this.__m = this.createGain(); this.__m.gain.value = 0; this.__m.connect(d.get.call(this)); } return this.__m; } });
    B.prototype.__muet = true;
  } catch (e) {}
}
if (MUET) muetPose(window);
const MODS = {};   // les modules déjà créés, gardés par fichier : y revenir reprend le même (un contexte audio chacun, pas un de plus)
const MUS = { fichier: '', nom: '', type: '', pret: false, cadre: null, inst: null, jaugeEl: null, bouton: null, bpmEl: null, jauge: '', jeton: 0 };
const musJoueDeja = () => MUS.type === 'html' ? !!(MUS.bouton && /stop/i.test(MUS.bouton.textContent))
  : MUS.type === 'js' ? !!(MUS.inst && MUS.inst.playing) : false;
function musJoue(on) {
  if (!MUS.pret || on === musJoueDeja()) return;
  if (MUS.type === 'html') MUS.bouton.click();
  else try { on ? MUS.inst.start() : MUS.inst.stop(); } catch (e) { erreur('Musique : ' + e.message); }
}
function musRange() { // la musique d'avant se tait et s'en va
  musJoue(false);
  if (MUS.cadre) MUS.cadre.remove();
  Object.assign(MUS, { fichier: '', nom: '', type: '', pret: false, cadre: null, inst: null, jaugeEl: null, bouton: null, bpmEl: null, jauge: '' });
}
async function musCharge(fichier) {
  const jeton = ++MUS.jeton;
  musRange();
  MUS.fichier = fichier; MUS.nom = nomMusique(fichier);
  peinsMus();
  if (!fichier) return;
  if (/\.js$/i.test(fichier)) {
    MUS.type = 'js';
    try {
      let inst = MODS[fichier];
      if (!inst) {
        const mod = await import(new URL(fichier, location.href).href);
        const fab = Object.values(mod).find(v => typeof v === 'function' && /^create/i.test(v.name)) || Object.values(mod).find(v => typeof v === 'function');
        if (!fab) throw new Error('aucune fonction exportée');
        inst = fab({});
        if (!inst || typeof inst.start !== 'function' || typeof inst.stop !== 'function' || !(inst.setTier || inst.setSpeed)) throw new Error('il faut start, stop et setTier / setSpeed');
        MODS[fichier] = inst;
      }
      if (jeton !== MUS.jeton) return;
      MUS.inst = inst; MUS.pret = true;
      if (touche) musJoue(true);
    } catch (e) { erreur('La musique ' + fichier + ' ne se charge pas : ' + e.message); }
    return;
  }
  MUS.type = 'html';
  const f = document.createElement('iframe');
  f.src = fichier; f.title = 'musique'; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.setAttribute('allow', 'autoplay');
  // visible pour le navigateur (sinon sa boucle d'images s'arrête et sa jauge ne bouge plus), invisible pour nous
  f.style.cssText = 'position:fixed;left:0;bottom:0;width:8px;height:8px;opacity:0;pointer-events:none;border:0;z-index:-1';
  f.onload = () => {
    if (jeton !== MUS.jeton) return;
    try {
      if (MUET) muetPose(f.contentWindow);
      const d = f.contentDocument;
      MUS.jaugeEl = d.getElementById('speed'); MUS.bouton = d.getElementById('play'); MUS.bpmEl = d.getElementById('bpm');
      if (MUS.jaugeEl) MUS.jaugeEl.step = 'any';
      MUS.pret = !!(MUS.jaugeEl && MUS.bouton);
      if (!MUS.pret) erreur('La musique ' + fichier + ' n\'a pas les repères #play / #speed.');
      else if (touche) musJoue(true);
    } catch (e) { erreur('Musique illisible : ' + e.message); }
  };
  document.body.appendChild(f); MUS.cadre = f;
}
// l'intensité (0-1) ; au module, son API : setTier(palier, nbPaliers) quand on suit le moteur, setSpeed sinon
function musIntensite(x, tier) {
  if (!MUS.pret) return;
  if (MUS.type === 'js') {
    try { if (tier != null && MUS.inst.setTier) MUS.inst.setTier(tier, NB_PAL); else MUS.inst.setSpeed(x); } catch (e) {}
    return;
  }
  const v = (x * 100).toFixed(1);
  if (v === MUS.jauge) return;
  MUS.jauge = v; MUS.jaugeEl.value = v;
  MUS.jaugeEl.dispatchEvent(new MUS.cadre.contentWindow.Event('input'));
}
function musBpm() {
  try { const b = MUS.type === 'js' ? MUS.inst.bpm : MUS.bpmEl && parseFloat(MUS.bpmEl.textContent); return b > 0 ? Math.round(b) + ' BPM' : ''; } catch (e) { return ''; }
}
let touche = false;
function geste() { // le 1er toucher (l'écran titre du jeu le demande) : il réveille aussi la musique
  if (touche) return; touche = true; musJoue(true);
}

// la pastille ♪ : changer la musique du niveau, en direct, et l'écrire sur le disque
const ICO_NOTE = '<svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>';
function peinsMus() {
  const b = $('musBtn'); b.classList.toggle('vide', !MUS.nom);
  b.innerHTML = ICO_NOTE + '<span></span>'; b.querySelector('span').textContent = MUS.nom || 'Pas de musique';
}
let menu = null;
const fermeMenu = () => { if (menu) { menu.remove(); menu = null; } };
document.addEventListener('click', ev => { if (menu && !ev.target.closest('.musBox')) fermeMenu(); });
$('musBtn').onclick = ev => {
  ev.stopPropagation();
  if (menu) { fermeMenu(); return; }
  menu = document.createElement('div'); menu.className = 'menu';
  for (const m of [{ fichier: '', nom: 'Pas de musique' }, ...MUSIQUES]) {
    const b = document.createElement('button'); b.textContent = m.nom;
    if (!m.fichier) b.classList.add('aucune');
    if (m.fichier === MUS.fichier) b.classList.add('choisi');
    b.onclick = async () => {
      fermeMenu(); setTimeout(focusJeu, 0);
      if (m.fichier === MUS.fichier) return;
      musCharge(m.fichier);
      if (!await musiqueChoisir([NIV.id], m.fichier)) erreur('Choix pas enregistré sur le disque (le serveur du simulateur tourne ?)');
    };
    menu.appendChild(b);
  }
  $('musBtn').parentNode.appendChild(menu);
};

// l'intensité : ce qu'elle suit (moteur / vitesse), le curseur qui la montre et la force, « + » qui monte le vrai moteur
const E = { phase: 'titre', essai: 0, finT: 0, x: 0, vit: 0, st: null, nbMot: 30, tier: 0, motVu: -1,
  force: null, tire: false, source: 'moteur' };
try { if (localStorage.getItem('simu.source') === 'vitesse') E.source = 'vitesse'; } catch (e) {}
const peinsSource = () => { $('source').textContent = E.source === 'moteur' ? 'suit le moteur' : 'suit la vitesse'; };
peinsSource();
$('source').onclick = () => { E.source = E.source === 'moteur' ? 'vitesse' : 'moteur'; peinsSource(); try { localStorage.setItem('simu.source', E.source); } catch (e) {} };
const curseur = $('intens');
curseur.addEventListener('pointerdown', () => { E.tire = true; });
addEventListener('pointerup', () => { E.tire = false; });
curseur.addEventListener('change', () => setTimeout(focusJeu, 0));
curseur.addEventListener('input', () => { E.force = curseur.value / 100; $('auto').hidden = false; curseur.classList.add('force'); });
$('auto').onclick = () => { E.force = null; $('auto').hidden = true; curseur.classList.remove('force'); };
// les 5 paliers de musique sur les 30 moteurs (engTier part de 0) : 0-4 → 1 · 5-9 → 2 · 10-14 → 3 · 15-19 → 4 · 20-29 → 5
const NB_PAL = 5, PAL_DEBUT = [0, 5, 10, 15, 20];
const palDe = t => t >= 20 ? 5 : Math.floor(t / 5) + 1;
$('plus').onclick = () => { // le vrai moteur saute au 1er moteur du palier suivant (au dernier palier : un moteur de plus)
  try {
    const w = jeu.contentWindow; if (!(E.st && E.st.started && !E.st.gameOver)) return;
    const p = palDe(E.tier);
    if (p >= NB_PAL) { w.dbgMoteur(); return; }
    for (let k = 0; k < 12 && (w.dbgState().engTier | 0) < PAL_DEBUT[p]; k++) if (w.dbgMoteur() === 'palier max') break;
  } catch (e) {}
};

// ——— 4) le départ, la relance, l'intensité ———
function lancer() {
  const w = jeu.contentWindow;
  E.vite = false;
  E.lanceDe = L;
  if (L.sansFin) {
    if (w.dbgState().gameOver) { w.dbgEco('rejouer'); return; }
    const b = w.document.querySelector('[data-m="play"]');
    if (b) b.click();
  } else if (L.jade) w.dbgNiveauJade(); // le SOLEIL DE JADE (la map des PICS DE JADE en vrai niveau)
  else w.dbgCampagne(L.n, L.monde);
}
let der = performance.now();
function boucle(now) {
  requestAnimationFrame(boucle);
  const dt = Math.min(.1, (now - der) / 1000); der = now;
  let w, st;
  try { w = jeu.contentWindow; st = w && w.dbgState ? w.dbgState() : null; } catch (e) { st = null; }
  E.st = st;
  if (!st) return;
  const enCourse = st.started && !st.gameOver;
  pauseTick(now, st, w);
  try {
    // l'écran titre passé (le jeu l'a retiré au 1er toucher) : on part sur le niveau — on réessaie tant que la course ne tourne pas
    if (E.phase === 'titre' && !w.document.getElementById('splash')) { E.phase = NU && !E.demande ? 'pret' : 'depart'; E.essai = 0; E.t = .9; } // en aperçu : prêt, on attend le survol
    if (E.phase === 'depart') {
      if (enCourse && E.lanceDe && E.lanceDe !== L) { E.vite = true; E.phase = 'course'; try { w.dbgQuitte(); } catch (e) {} } // on a changé de niveau pendant qu'il partait
      else if (enCourse) E.phase = 'course';
      else if ((E.t -= dt) <= 0) { E.t = 1.6; if (E.essai++ < 8) lancer(); }
    }
    // une partie finie (mort, fin de monde) : 2,4 s d'écran de fin, puis le même niveau repart
    if (E.phase === 'course') {
      if (st.started && st.gameOver && E.dort) E.finT = 0;   // endormie : la partie finie attend le prochain survol
      else if (st.started && st.gameOver) { if ((E.finT += dt) > (SEQ.saute || E.vite ? .25 : 2.4)) { E.finT = 0; E.phase = 'depart'; E.essai = 0; E.t = 0; if (SEQ.on && !E.vite) seqSuivant(); E.vite = false; } }
      else E.finT = 0;
    }
  } catch (e) { erreur(e.message); }
  // le palier moteur (et son nom, lu quand il change)
  E.tier = st.engTier | 0;
  if (E.tier !== E.motVu) {
    E.motVu = E.tier;
    $('motN').textContent = 'P' + palDe(E.tier) + '/' + NB_PAL;
    $('mot').title = 'Palier de musique · moteur ' + (E.tier + 1) + '/' + E.nbMot;
  }
  // l'intensité
  let x = 0, tier = null;
  if (E.force != null) x = E.force;
  else if (E.source === 'moteur') { tier = palDe(E.tier); x = (tier - 1) / (NB_PAL - 1); }
  else if (enCourse && !st.paused && st.mode !== 'boom') { try { E.vit = w.dbgFren().vit; x = Math.max(0, Math.min(1, (E.vit - .15) / 1.55)); } catch (e) {} }
  E.x += (x - E.x) * Math.min(1, dt * 8);
  musIntensite(E.x, tier);
  if (touche) musJoue(!st.paused && !E.dort);
  if (!E.tire && E.force == null) { const v = (E.x * 100).toFixed(1); if (curseur.value !== v) curseur.value = v; }
  const pct = Math.round((E.force != null ? E.force : E.x) * 100) + ' %';
  if ($('pct').textContent !== pct) $('pct').textContent = pct;
  const bpm = musBpm();
  if ($('bpm').textContent !== bpm) $('bpm').textContent = bpm;
}

// LE PLAY : le niveau suivant du tirage (un tour = tous les niveaux du PLAY, au hasard, sans redite), et sa musique
function seqSuivant() {
  SEQ.saute = false;
  const pool = poolPlay();
  if (!pool.length) { erreur('Aucun niveau dans le PLAY (page des maps : les pastilles PLAY).'); return; }
  if (SEQ.i + 1 >= SEQ.ordre.length) {
    const o = pool.map(n => n.id);
    for (let k = o.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [o[k], o[j]] = [o[j], o[k]]; }
    if (o.length > 1 && o[0] === SEQ.dernier) [o[0], o[1]] = [o[1], o[0]];
    SEQ.ordre = o; SEQ.i = -1;
  }
  SEQ.i++; SEQ.n++;
  niveauPose(SEQ.ordre[SEQ.i]); SEQ.dernier = NIV.id;
  const f = musiqueDe(NIV);
  if (f !== MUS.fichier) musCharge(f);
  // la partie sans fin après un autre niveau : son JOUER rejouerait la carrière ou la jade → le jeu repart de zéro (un toucher)
  if (L.sansFin && E.lanceDe && !E.lanceDe.sansFin) { E.lanceDe = null; E.phase = 'titre'; try { jeu.contentWindow.location.reload(); } catch (e) {} }
}
$('suivant').onclick = () => {
  setTimeout(focusJeu, 0);
  const st = E.st;
  if (st && st.started && !st.gameOver) { SEQ.saute = true; try { jeu.contentWindow.dbgBoom(); } catch (e) {} }
  else if (st && st.started && st.gameOver) SEQ.saute = true;
  else { seqSuivant(); E.t = 0; }
};

// la bibliothèque, le choix et l'organisation (sur le disque), puis le niveau et sa musique
await musiquesCharge();
peinsMus();
if (SEQ.on) { $('suivant').hidden = false; $('retour').href = '../simulateur.html'; seqSuivant(); }
else { peinsTitre(); musCharge(musiqueDe(NIV)); }
if (NU) E.dort = true;   // en aperçu : endormie tant que la page des maps ne la réveille pas
requestAnimationFrame(boucle);

// ——— LA PAGE DES MAPS PILOTE CETTE COURSE (survol, plein écran) ———
function lanceNiveau(id) { // un autre niveau, sans recharger le jeu
  if (!niveauDe(id)) return;
  E.demande = true;
  if (E.phase === 'pret') { niveauPose(id); const f0 = musiqueDe(NIV); if (f0 !== MUS.fichier) musCharge(f0); E.phase = 'depart'; E.essai = 0; E.t = 0; return; }
  if (NIV && NIV.id === id && E.phase !== 'titre') { pause(false); return; }
  E.pauseVoulue = null;
  niveauPose(id);
  const f = musiqueDe(NIV);
  if (f !== MUS.fichier) musCharge(f);
  // la partie sans fin après un autre niveau : son JOUER rejouerait la carrière ou la jade → le jeu repart de zéro
  if (L.sansFin && E.lanceDe && !E.lanceDe.sansFin) { E.lanceDe = null; E.phase = 'titre'; try { jeu.contentWindow.location.reload(); } catch (e) {} return; }
  const st = E.st;
  if (st && st.started && !st.gameOver) { E.vite = true; E.phase = 'course'; try { const w = jeu.contentWindow; if (st.paused && w.__panBascule) w.__panBascule(); w.dbgQuitte(); } catch (e) {} }
  else if (st && st.started && st.gameOver) { E.vite = true; E.phase = 'course'; E.finT = 1; }
  else if (E.phase === 'depart') E.t = 0;
}
function pause(on) { E.pauseVoulue = !!on; } // le panneau ⏸ du jeu (au retour : son 3-2-1) — appliqué par la boucle, voir pauseTick
function dort(on) { E.dort = !!on; if (E.dort) { pause(true); musJoue(false); } } // endormie : rien ne joue en cachette (voir l'en-tête)
function pauseTick(now, st, w) { // un basculement à la fois (0,7 s d'écart) : deux demandes de suite ne se contredisent plus
  /* on lit le PANNEAU ⏸ (#tPanel.open), pas `paused` : pendant le 3-2-1 de la reprise le jeu est encore gelé (paused vrai) alors que le
     panneau est déjà fermé — basculer là le rouvrait (MESURÉ au banc : un clic pour le plein écran remettait la pause). */
  if (E.pauseVoulue == null) return;
  if (!st.started || st.gameOver) { if (!E.pauseVoulue) E.pauseVoulue = null; return; }
  let ouvert = false;
  try { const p = w.document.getElementById('tPanel'); ouvert = !!(p && p.classList.contains('open') && !p.classList.contains('sortant')); } catch (e) {}
  if (ouvert === E.pauseVoulue) { E.pauseVoulue = null; return; }
  if (now - (E.pauseT || 0) < 700 || !w.__panBascule) return;
  E.pauseT = now; try { w.__panBascule(); } catch (e) {}
}
function relaie(type, t) { // une touche frappée sur la page des maps
  if (type === 'keydown') geste();
  try { const w = jeu.contentWindow; w.document.dispatchEvent(new w.KeyboardEvent(type, { code: t.code, key: t.key, keyCode: t.keyCode, repeat: !!t.repeat, bubbles: true, cancelable: true })); } catch (e) {}
}

window.SIMU = {
  lance: lanceNiveau, pause, dort, relaie, geste, focus: focusJeu,
  // (12/10, Léo : « je clique sur une map, ça apparaît sur l'autre ») : la course qui roule doit être CELLE qu'on a demandée — pendant un
  // changement de niveau, l'ancienne roule encore quelques images (son lancement était parti) : la page des maps la montrait sur la nouvelle carte
  roule: () => !!(E.st && E.st.started && !E.st.gameOver && E.phase === 'course' && !E.vite && E.lanceDe === L),
  etat: () => ({ niveau: NIV.id, play: SEQ.on ? { n: SEQ.n, ordre: SEQ.ordre.slice(), i: SEQ.i } : null,
    phase: E.phase, essai: E.essai, touche, source: E.source, force: E.force, intensite: +E.x.toFixed(3), vit: E.vit,
    moteur: E.tier + 1, moteurs: E.nbMot, palier: palDe(E.tier),
    jeu: E.st && { started: E.st.started, gameOver: E.st.gameOver, paused: E.st.paused, mode: E.st.mode },
    musique: { fichier: MUS.fichier, type: MUS.type, pret: MUS.pret, joue: musJoueDeja(), bpm: musBpm(), muet: MUET } }),
  musique: () => MUS,   // le pilote (débogage : MUS.inst = le module en cours)
};
if (NU && parent !== window) {
  addEventListener('message', ev => {
    const d = ev.data;
    if (ev.source !== parent || !d || typeof d !== 'object' || typeof d.simu !== 'string') return;
    if (d.simu === 'lance') lanceNiveau(String(d.id));
    else if (d.simu === 'pause') pause(d.on);
    else if (d.simu === 'dort') dort(d.on);
    else if (d.simu === 'touche' && (d.type === 'keydown' || d.type === 'keyup')) relaie(d.type, d);
    else if (d.simu === 'geste') geste();
  });
  let dit = '';
  (function dire() {
    requestAnimationFrame(dire);
    const r = window.SIMU.roule(), mj = musJoueDeja(), pz = !!(E.st && E.st.paused), m = NIV.id + '|' + r + '|' + E.phase + '|' + mj + '|' + pz;
    if (m === dit) return; dit = m;
    parent.postMessage({ simu: 'etat', niveau: NIV.id, roule: r, phase: E.phase, musique: mj, pause: pz }, '*');
  })();
}
})();
</script>
</body>
