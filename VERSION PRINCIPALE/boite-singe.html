<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boîte à singe — CASH CAR</title>
<style>
  :root{--encre:#1d1d1f;--gris:#6e6e73;--gris2:#a1a1a6;--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{color:var(--encre);font-family:var(--sys);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    background:radial-gradient(ellipse 90% 75% at 50% 42%,#ffffff 0%,#f4f4f2 58%,#e8e8e5 100%)}
  button{font:inherit;color:inherit}
  body.reve{background:radial-gradient(ellipse 60% 45% at 50% 38%,#ffffff 0%,rgba(255,255,255,0) 70%),
    linear-gradient(115deg,#ffb8e2 0%,#d9b8ff 24%,#a9d4ff 48%,#b9f3e6 70%,#fff2b3 86%,#ffc9e6 100%)}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;filter:saturate(1.4)} /* l'étalonnage du jeu (POST_SAT 1,4) */
  #cv.tient{cursor:grabbing}
  #marque{position:fixed;left:28px;top:24px;pointer-events:none}
  #marque b{display:block;font-size:11px;letter-spacing:.24em;font-weight:600}
  #marque span{display:block;font-size:11px;letter-spacing:.12em;color:var(--gris2);margin-top:4px}
  #outils{position:fixed;right:20px;top:20px;display:flex;gap:8px}
  .rond{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.78);cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.07);display:grid;place-items:center;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background .2s}
  .rond:hover{background:#fff}
  .rond svg{width:16px;height:16px;stroke:var(--encre);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .rond.on{background:var(--encre)}.rond.on svg{stroke:#fff}
  #bas{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 32px)}
  .opts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
  .pil{border:0;border-radius:999px;padding:7px 13px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.7);color:var(--gris);
    box-shadow:0 0 0 .5px rgba(0,0,0,.09);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background .2s,color .2s;white-space:nowrap}
  .pil:hover{color:var(--encre)}
  .pil.on{background:var(--encre);color:#fff;box-shadow:none}
  #carte{position:fixed;left:24px;bottom:64px;width:236px;padding:12px 14px 10px;border-radius:16px;background:rgba(255,255,255,.72);
    box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.06);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font-size:12px}
  #carte .tete{display:flex;align-items:center;justify-content:space-between;font-weight:600;letter-spacing:.02em;margin-bottom:4px}
  #carte .tg{display:flex;gap:4px}#carte .tg .pil{padding:5px 10px;font-size:11px}
  #carte h4{font-size:9.5px;font-weight:600;letter-spacing:.16em;color:var(--gris2);margin:9px 0 0}
  #carte .cur{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px;margin-top:6px;color:var(--gris)}
  #carte .cur.eteint{opacity:.35;pointer-events:none}
  #carte .cur b{font-weight:500;color:var(--encre);text-align:right;font-variant-numeric:tabular-nums}
  #carte input[type=range]{width:100%;accent-color:var(--encre)}
  #carte .lien{border:0;background:none;color:var(--gris2);font-size:11px;cursor:pointer;margin-top:8px;padding:0}
  #carte .lien:hover{color:var(--encre)}
  #etat{position:fixed;left:28px;bottom:28px;font-size:11px;color:var(--gris2);letter-spacing:.03em;pointer-events:none;line-height:1.6}
  #etat b{font-weight:500;color:var(--gris)}
  #neuf{position:fixed;left:50%;top:22px;transform:translate(-50%,-8px);background:var(--encre);color:#fff;font-size:12px;letter-spacing:.04em;
    padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
  #neuf.on{opacity:1;transform:translate(-50%,0)}#neuf.err{background:#c4302b}
  #aide{position:fixed;right:28px;bottom:30px;font-size:11px;color:var(--gris2);letter-spacing:.03em;pointer-events:none;transition:opacity .8s}
  #aide.cache{opacity:0}
  #charge{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-size:12px;color:var(--gris);letter-spacing:.08em}
  #charge.fini{display:none}#charge.erreur{pointer-events:auto;color:#c4302b;text-align:center;line-height:1.7;padding:24px}
  @media (max-width:760px){#marque{left:18px;top:16px}#outils{right:14px;top:14px}#aide{display:none}#bas{bottom:18px}
    #etat{left:50%;transform:translateX(-50%);bottom:auto;top:62px;text-align:center;white-space:nowrap}
    #carte{left:12px;bottom:auto;top:96px;width:200px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="marque"><b>BOÎTE À SINGE</b><span>CASH CAR · LE SINGE PENDU</span></div>
<div id="outils">
  <button class="rond on" id="bTourne" title="Tourner tout seul"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.6 2.2v2.6H11"/></svg></button>
  <button class="rond" id="bCadre" title="Recadrer (R)"><svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
</div>
<div id="bas"><div class="opts">
  <button class="pil" id="oPasse" title="Une caisse passe sous la route : il la regarde, tend la main, se balance">La caisse passe</button>
  <button class="pil" id="oNoir" title="La frénésie DARK TRIAD">Dark triad</button>
  <button class="pil" id="oLent" title="Tout au quart de la vitesse">Ralenti</button>
  <button class="pil" id="oFige" title="Fige tout (Espace)">Figé</button>
  <button class="pil" id="oLisse" title="La peau seule, sans écailles ni cœur">Lisse</button>
  <button class="pil" id="oReve" title="Le fond pastel">Ciel rêve</button>
</div></div>
<div id="carte">
  <div class="tete"><span>Vitrail</span><span class="tg"><button class="pil" id="oPeau">Peau</button><button class="pil" id="oCoeur">Cœur</button></span></div>
  <div id="curs"></div>
  <button class="lien" id="cZero">Revenir aux réglages du jeu</button>
</div>
<div id="etat"></div>
<div id="neuf"></div>
<div id="aide">glisse pour tourner · molette pour zoomer · R recadre</div>
<div id="charge">Ouverture de la boîte…</div>

<script src="vendor/three.min.js"></script>
<script>
'use strict';
/* =====================================================================================================================
   LA BOÎTE À SINGE (2026-10-10, Léo : « le 2 » — le SINGE PENDU, sous la route, accroché par la queue, fait en VITRAIL).
   Comme la boîte à dauphins : RIEN n'est recopié — la page lit index.html et exécute les vrais blocs du jeu (<<<VITRAIL>>> puis
   <<<SINGE>>> : la forme, la recette en trois couches, l'animation `singeAnime`), et les RELIT seule (~1 fois/s) : une retouche du singe
   dans index.html apparaît ici sans recharger. La boîte ne fait que la scène : le dessous de la route, la caisse qui passe, la caméra.
   ===================================================================================================================== */
const $=id=>document.getElementById(id);
const JOURNAL=[];{const ce=console.error.bind(console);console.error=(...a)=>{JOURNAL.push(a.map(String).join(' ').slice(0,900));ce(...a);};
  addEventListener('error',e=>JOURNAL.push(String(e.message)+' @'+e.lineno));}
const PREF=(()=>{try{return JSON.parse(localStorage.getItem('boiteSinge')||'{}')||{};}catch(e){return {};}})();
const ST=Object.assign({tourne:false,passe:true,noir:false,lent:false,fige:false,lisse:false,reve:false,peau:true,coeur:true,cq:null},PREF);
{const q=new URLSearchParams(location.search);for(const k of ['tourne','passe','noir','lent','fige','lisse','reve','peau','coeur'])if(q.has(k))ST[k]=q.get(k)!=='0';}
const garde=()=>{try{localStorage.setItem('boiteSinge',JSON.stringify(ST));}catch(e){}};

/* 1. LIRE LE JEU */
let JEU=null,BLOC='',LU='',ERR='',VER=0;
async function lireBloc(){
  const r=await fetch('index.html?singe='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('index.html : '+r.status);
  const L=(await r.text()).split('\n'),pr=(a,b)=>{let i0=-1,i1=-1;for(let i=0;i<L.length;i++){if(i0<0&&L[i].startsWith(a))i0=i;else if(i0>=0&&L[i].startsWith(b)){i1=i;break;}}
    if(i0<0||i1<0)throw new Error('bloc introuvable dans index.html : '+a);return L.slice(i0,i1+1).join('\n');};
  return pr('/* <<<VITRAIL>>>','/* <<<FIN VITRAIL>>>')+'\n'+pr('/* <<<SINGE>>>','/* <<<FIN SINGE>>>');
}
const executer=bloc=>new Function('THREE',bloc+'\nreturn {singeNouveau,singeAnime,singeTape,SINGE_F};')(THREE);

/* 2. LA SALLE : le dessous de la route (le singe y est accroché), la caisse qui passe */
const cv=$('cv'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setClearColor(0xffffff,0);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.05,300);
scene.add(new THREE.HemisphereLight(0xffffff,0xd9d4e6,.7));
const cle=new THREE.DirectionalLight(0xffffff,.8);cle.position.set(4,9,5);scene.add(cle);
const contre=new THREE.DirectionalLight(0xf0ecff,.35);contre.position.set(-6,2,-7);scene.add(contre);
const ACC=new THREE.Vector3(2.55,0,0); // le point d'accroche du singe : sous la dalle, près du bord
const route=new THREE.Group();scene.add(route);
{const dal=new THREE.Mesh(new THREE.BoxGeometry(6,.5,46),new THREE.MeshPhongMaterial({color:0x2b2937,shininess:20}));dal.position.y=.25;route.add(dal);
  const neon=new THREE.MeshBasicMaterial({color:0xf24aa0,toneMapped:false});
  for(const sx of [-1,1]){const b=new THREE.Mesh(new THREE.BoxGeometry(.09,.09,46),neon);b.position.set(sx*3,.02,0);route.add(b);
    const b2=b.clone();b2.position.y=.48;route.add(b2);}}
const caisse=new THREE.Group();scene.add(caisse);
{const o=new THREE.MeshPhongMaterial({color:0xff7a24,shininess:60}),v=new THREE.MeshPhongMaterial({color:0x10141c,shininess:90}),
    f=new THREE.MeshBasicMaterial({color:0xff2a3d,toneMapped:false}),p=new THREE.MeshBasicMaterial({color:0xfff2c0,toneMapped:false});
  const B=(w,h,d,m,x,y,z)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);caisse.add(b);};
  B(1.15,.36,2.3,o,0,0,0);B(.95,.3,1.1,v,0,.3,-.1);for(const sx of [-1,1]){B(.22,.08,.04,f,sx*.38,.02,-1.16);B(.22,.08,.04,p,sx*.38,.02,1.16);}}
let JUS=-1; // la caisse : -1 = attend, sinon sa progression le long de son passage

/* 3. LE SINGE */
let S=null;
function monter(bloc){
  const J=executer(bloc),S2=J.singeNouveau('singe-boite'+(++VER));
  if(S){scene.remove(S.grp);for(const m of Object.values(S.grp.userData))m.material.dispose();}
  if(JEU&&JEU.SINGE_F._geo&&JEU.SINGE_F!==J.SINGE_F){JEU.SINGE_F._geo.lisse.dispose();JEU.SINGE_F._geo.ecailles.dispose();}
  S2.grp.position.copy(ACC);scene.add(S2.grp);S=S2;JEU=J;BLOC=bloc;carteLit();
}
// LA CARTE VITRAIL : les réglages du singe (uniforms du jeu), gardés dans ce navigateur — [clé, uniform, min, max, pas, ×cube, étiquette, groupe, couche]
const CQ=[['a0','uCoqA0',0,1,.01,0,'De face','LA PEAU DE VERRE','peau'],['a1','uCoqA1',0,1,.01,0,'Bords','','peau'],['g','uCoqG',0,2.5,.05,1,'Gonflée','','peau'],
  ['ec','uEcart',.5,1,.01,0,'Taille','LES ÉCAILLES',''],['va','uVague',0,2,.05,1,'Vague','',''],
  ['lu','uLueur',0,3,.05,0,'Lumière','LE CŒUR ET L’ONDE','coeur'],['sc','uScan',0,2,.05,0,'Onde','','']];
let CQ0=null;
{const el=$('curs');el.innerHTML=CQ.map(([k,,a,b,st,,lb,gr])=>(gr?'<h4>'+gr+'</h4>':'')+'<label class="cur" data-k="'+k+'"><span>'+lb+'</span><input type="range" min="'+a+'" max="'+b+'" step="'+st+'"><b></b></label>').join('');
  for(const c of CQ){const lab=el.querySelector('[data-k="'+c[0]+'"]'),inp=lab.querySelector('input');
    inp.addEventListener('input',()=>{if(!ST.cq)return;ST.cq[c[0]]=+inp.value;lab.querySelector('b').textContent=(+inp.value).toFixed(2);garde();});}}
function carteLit(){const U=S.U,h=JEU.SINGE_F.h;CQ0={};for(const [k,u,,,,vk] of CQ)CQ0[k]=U[u].value/(vk?h:1);
  if(!ST.cq||Object.keys(CQ0).some(k=>ST.cq[k]==null))ST.cq=Object.assign({},CQ0,ST.cq||{});peindre();}
function carteApplique(){if(!S||!ST.cq)return;const U=S.U,h=JEU.SINGE_F.h,ud=S.grp.userData;
  for(const [k,u,,,,vk] of CQ)if(ST.cq[k]!=null)U[u].value=ST.cq[k]*(vk?h:1);
  U.uNoir.value=ST.noir?1:0;
  ud.ecailles.visible=!ST.lisse;ud.coeur.visible=!ST.lisse&&ST.coeur;ud.peau.visible=ST.lisse||ST.peau;
  if(ST.lisse){U.uCoqA0.value=1;U.uCoqA1.value=1;}}
function peindre(){
  for(const [id,k] of [['oPasse','passe'],['oNoir','noir'],['oLent','lent'],['oFige','fige'],['oLisse','lisse'],['oReve','reve'],['oPeau','peau'],['oCoeur','coeur']])$(id).classList.toggle('on',!!ST[k]);
  $('bTourne').classList.toggle('on',!!ST.tourne);document.body.classList.toggle('reve',!!ST.reve);
  if(ST.cq)for(const c of CQ){const lab=$('curs').querySelector('[data-k="'+c[0]+'"]');lab.querySelector('input').value=ST.cq[c[0]];
    lab.querySelector('b').textContent=(+ST.cq[c[0]]).toFixed(2);lab.classList.toggle('eteint',!!c[8]&&!ST[c[8]]);}
}
for(const [id,k] of [['oPasse','passe'],['oNoir','noir'],['oLent','lent'],['oFige','fige'],['oLisse','lisse'],['oReve','reve'],['oPeau','peau'],['oCoeur','coeur']])
  $(id).onclick=()=>{ST[k]=!ST[k];garde();peindre();};
$('cZero').onclick=()=>{if(CQ0){ST.cq=Object.assign({},CQ0);garde();peindre();}};

/* 4. LA CAMÉRA — une orbite à inertie (vue d'en dessous de la route, de trois-quarts) */
const CAD={cx:2.45,cy:-1.15,cz:0,yaw:.55,pitch:-.08,dist:4.3};
const CAM={cx:0,cy:0,cz:0,yaw:0,pitch:0,dist:8,vy:0,vp:0,lache:9,vise:null};
{const q=new URLSearchParams(location.search);for(const k of ['yaw','pitch','dist','cx','cy','cz'])if(q.has(k))CAD[k]=+q.get(k);}
function recadre(d){const a={...CAM},dy=((CAD.yaw-CAM.yaw)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI,b=Object.assign({},CAD,{yaw:CAM.yaw+dy});
  if(!d){Object.assign(CAM,b);CAM.vise=null;}else CAM.vise={a,b,t:0,d};CAM.vy=CAM.vp=0;}
function camTick(dt){
  if(CAM.vise){const v=CAM.vise;v.t=Math.min(1,v.t+dt/v.d);const e=v.t<.5?4*v.t**3:1-Math.pow(-2*v.t+2,3)/2;
    for(const k of ['cx','cy','cz','yaw','pitch','dist'])CAM[k]=v.a[k]+(v.b[k]-v.a[k])*e;if(v.t>=1)CAM.vise=null;}
  else{CAM.lache+=dt;if(!tient){CAM.yaw+=CAM.vy*dt;CAM.pitch+=CAM.vp*dt;const f=Math.exp(-dt*3.2);CAM.vy*=f;CAM.vp*=f;
      if(ST.tourne&&CAM.lache>1.6)CAM.yaw+=dt*.22*Math.min(1,(CAM.lache-1.6)/1.2);}
    CAM.pitch=Math.max(-1.2,Math.min(1.2,CAM.pitch));}
  const cp=Math.cos(CAM.pitch);camera.position.set(CAM.cx+CAM.dist*Math.sin(CAM.yaw)*cp,CAM.cy+CAM.dist*Math.sin(CAM.pitch),CAM.cz+CAM.dist*Math.cos(CAM.yaw)*cp);
  camera.lookAt(CAM.cx,CAM.cy,CAM.cz);}
let tient=false,px0=0,py0=0,pid=null,pinc=null;const doigts=new Map();
cv.addEventListener('pointerdown',e=>{doigts.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);
  if(doigts.size===1){tient=true;pid=e.pointerId;px0=e.clientX;py0=e.clientY;CAM.vy=CAM.vp=0;CAM.vise=null;cv.classList.add('tient');$('aide').classList.add('cache');}
  else if(doigts.size===2){const [a,b]=[...doigts.values()];pinc={d:Math.hypot(a.x-b.x,a.y-b.y),dist:CAM.dist};}});
cv.addEventListener('pointermove',e=>{if(!doigts.has(e.pointerId))return;doigts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinc&&doigts.size>=2){const [a,b]=[...doigts.values()];CAM.dist=Math.max(1.5,Math.min(30,pinc.dist*pinc.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));return;}
  if(!tient||e.pointerId!==pid)return;const dx=e.clientX-px0,dy=e.clientY-py0;px0=e.clientX;py0=e.clientY;const k=3.4/Math.max(320,cv.clientHeight);
  CAM.yaw-=dx*k;CAM.pitch+=dy*k;CAM.vy=-dx*k*60;CAM.vp=dy*k*60;CAM.lache=0;});
const lache=e=>{doigts.delete(e.pointerId);if(doigts.size<2)pinc=null;if(e.pointerId===pid){tient=false;pid=null;CAM.lache=0;cv.classList.remove('tient');}};
cv.addEventListener('pointerup',lache);cv.addEventListener('pointercancel',lache);
cv.addEventListener('wheel',e=>{e.preventDefault();CAM.vise=null;CAM.dist=Math.max(1.5,Math.min(30,CAM.dist*Math.exp(e.deltaY*.0012)));},{passive:false});
$('bTourne').onclick=()=>{ST.tourne=!ST.tourne;garde();peindre();};$('bCadre').onclick=()=>recadre(.8);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')recadre(.8);else if(e.key===' '){e.preventDefault();ST.fige=!ST.fige;garde();peindre();}});

/* 5. L'ÉTAT, LA RELECTURE, LA BOUCLE */
const heure=()=>new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function etat(){let n=0;if(S)for(const m of Object.values(S.grp.userData))if(m.geometry.index)n+=m.geometry.index.count/3;
  $('etat').innerHTML='<b>Le singe du jeu</b> · '+Math.round(n)+' facettes · lu à '+LU+(ERR?'<br><span style="color:#c4302b">'+ERR+'</span>':'')+
    (JOURNAL.length?'<br><span style="color:#c4302b">'+JOURNAL[0].replace(/</g,'&lt;').slice(0,300)+'</span>':'');}
let neufT=0;function annonce(t,err){const el=$('neuf');el.textContent=t;el.classList.toggle('err',!!err);el.classList.add('on');clearTimeout(neufT);neufT=setTimeout(()=>el.classList.remove('on'),err?5000:2600);}
let signe='',signeBoite=null;
async function veille(){
  try{const rb=await fetch('boite-singe.html?v='+Date.now(),{method:'HEAD',cache:'no-store'}),sb=(rb.headers.get('last-modified')||'')+'|'+(rb.headers.get('content-length')||'');
    if(signeBoite===null)signeBoite=sb;else if(sb!==signeBoite){location.reload();return;}}catch(e){}
  try{const r=await fetch('index.html?singe-v='+Date.now(),{method:'HEAD',cache:'no-store'}),s=(r.headers.get('last-modified')||'')+'|'+(r.headers.get('content-length')||'');
    if(s!==signe){signe=s;const bloc=await lireBloc();if(bloc!==BLOC){try{monter(bloc);ERR='';LU=heure();annonce('Nouveau singe · '+LU);}catch(e){ERR='erreur : '+e.message+' — on garde le précédent';annonce('Erreur dans le singe',true);}etat();}}}catch(e){}
  setTimeout(veille,900);}
function taille(){const w=innerWidth,h=innerHeight,pr=Math.min(devicePixelRatio||1,2);renderer.setPixelRatio(pr);renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=w<h?50:36;camera.updateProjectionMatrix();}
addEventListener('resize',taille);
const CIB=new THREE.Vector3(),VD=new THREE.Vector3(),MAINS=new THREE.Vector3(0,-2.0,.1);let t0=performance.now(),PAUSE=0;
function boucle(now){
  const dtR=Math.min(.05,(now-t0)/1000);t0=now;const dt=ST.fige?0:dtR*(ST.lent?.25:1);
  if(S){carteApplique();
    // LA CAISSE : elle passe sous la route le long de z, juste sous les mains du singe, puis revient 2,5 s plus tard
    let cib=null,pro=0;
    if(ST.passe){if(JUS<0){PAUSE-=dt;if(PAUSE<=0){JUS=0;caisse.visible=true;}}
      if(JUS>=0){const zO=JUS*28-14,zA=zO;JUS+=dt*12/28;caisse.position.set(ACC.x-.55,-2.55,zA);
        const zp=zO,zn=JUS*28-14;if(zp<0&&zn>=0)JEU.singeTape(S,.9,(Math.random()-.5)*.3); // elle passe : le souffle le fait balancer
        if(JUS>1){JUS=-1;PAUSE=2.5;caisse.visible=false;}
        CIB.copy(caisse.position).sub(ACC);cib=CIB;pro=Math.max(0,Math.min(1,(4.5-CIB.distanceTo(MAINS))/3.3));}}
    else{caisse.visible=false;JUS=-1;}
    JEU.singeAnime(S,dt,cib,pro);
    camera.getWorldDirection(VD);S.U.uLum.value.set(0,1,0).addScaledVector(VD,-.4).normalize();}
  camTick(dtR);renderer.render(scene,camera);
  if(JOURNAL.length!==boucle.nj){boucle.nj=JOURNAL.length;etat();}
  requestAnimationFrame(boucle);}
