<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     (2026-11-03, pôle SON ; Léo : « une version premium des musiques du jeu, nouvelle DA, mais les anciens sons ne perdent pas leur identité » ; avant elle : la page à paliers « french touch de nuit, vaporwave », 110 BPM, fa mineur).
     L'IDENTITÉ GARDÉE : la nuit « pas trop grave ni trop aigu, harmonieux », la grille Réb maj9 · Do7(b9) · Fa m9 · Mib m9 | Lab7(b9) · Sib m11, et le thème (le motif qui descend, la réponse qui monte) — descendus d'un ton, en mi♭ mineur.
     CE QUI CHANGE : le groove. Plus de french touch carrée : un SLOW JAM (quiet storm) à 92 BPM, balais et rimshot swingués, contrebasse synthé douce et COURTE, accord haché en 3-3-4-3-3 à la guitare soyeuse, cordes de velours qui gonflent,
     puis un saxo-synthé de velours qui prend le chant (dès 14), un violoncelle qui répond, un chœur qui glisse du « ou » au « a », les cloches de vapeur — et à 30 le saxo monte d'une octave sur tout l'orchestre.
     Le moteur 1 est le LOBBY : la nappe, la guitare qui égrène l'accord, le souffle des balais, un cœur de grosse caisse, la pluie au loin — calme, jamais pauvre. Chaque reprise de phrase change (grâces, octave, cadence, ligne du violoncelle).
     (2026-11-03, Léo : « la percussion à grain est assourdissante ») les balais ne sifflent plus (coussin de souffle 320–1900 Hz, centroïde du lobby 1 465 → 366 Hz), la pluie, le rimshot, le clap, le shaker, les charleys et la ride sont passés au 12 dB/octave.
     Frappes de bruit PRÉCALCULÉES (tampons) dans preparer : aucun filtre en direct par coup de charley (charge du moteur 30). Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 92, SD = 60 / BPM / 4, MES = 16 * SD;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // LA GRILLE DE NUIT (mi♭ mineur), une mesure par accord, deux accords à la mesure 4 et à la mesure 8 : voicings SERRÉS dans le médium (ni grave qui bave, ni aigu qui pique)
  const AC = {
    A: { b: 35, v: [51, 54, 58, 61] },   // Do♭ maj9  : mi · sol♭ · si♭ · ré♭
    B: { b: 34, v: [50, 53, 56, 59] },   // Si♭ 7(b9) : ré · fa · la♭ · do♭
    C: { b: 39, v: [49, 54, 58, 65] },   // Mi♭ m9    : ré♭ · sol♭ · si♭ · fa
    D: { b: 37, v: [52, 56, 59, 63] },   // Ré♭ m9    : mi · la♭ · do♭ · mi♭
    E: { b: 42, v: [52, 55, 58, 61] },   // Sol♭ 7(b9): mi · sol · si♭ · ré♭
    F: { b: 32, v: [49, 54, 59, 63] } }; // La♭ m11   : ré♭ · sol♭ · do♭ · mi♭
  const GRILLE = [['A'], ['B'], ['C'], ['D', 'E'], ['A'], ['B'], ['C'], ['F', 'B']];
  // LE THÈME (le motif qui descend, la réponse qui monte) — [double croche, note, durée] ; huit mesures
  const MELODIE = [
    [[0, 70, 3], [3, 66, 3], [6, 63, 4], [12, 61, 2], [14, 63, 2]],
    [[0, 62, 6], [6, 65, 2], [8, 68, 4], [12, 66, 2], [14, 65, 2]],
    [[0, 65, 6], [8, 66, 2], [10, 65, 2], [12, 63, 4]],
    [[0, 64, 4], [4, 63, 2], [6, 59, 2], [8, 61, 6]],
    [[0, 70, 3], [3, 66, 3], [6, 63, 2], [8, 66, 2], [10, 70, 2], [12, 73, 4]],
    [[0, 71, 4], [4, 70, 2], [6, 68, 2], [8, 65, 4], [12, 62, 4]],
    [[0, 63, 4], [4, 65, 2], [6, 66, 6], [12, 70, 2], [14, 66, 2]],
    [[0, 68, 4], [4, 66, 2], [6, 63, 2], [8, 62, 2], [10, 65, 2], [12, 68, 2], [14, 71, 2]]];
  const RELANCE = [[8, 62, 2], [10, 65, 2], [12, 68, 2], [14, 71, 2]];   // la dernière mesure d'une phrase sur quatre : la même montée, seule, plus haute
  const CADENCE = [[0, 68, 6], [6, 66, 2], [8, 63, 8]];                   // et une autre fin : elle se pose sur le mi♭
  // LA CONTREBASSE (sur les contretemps) — [pas, intervalle, durée en pas, force] : quatre variantes, une par phrase
  const BASSES = [
    [[2, 0, 2, 1], [10, 0, 2, 1], [14, 12, 2, .8]],
    [[2, 0, 2, 1], [6, 0, 1, .8], [7, 12, 1, .65], [10, 0, 2, 1], [13, 7, 1, .7], [14, 12, 2, .8]],
    [[0, 0, 2, 1], [5, 7, 1, .7], [10, 0, 2, .95], [12, 12, 2, .8]],
    [[2, 0, 2, 1], [8, 12, 1, .7], [10, 0, 2, 1], [11, 7, 1, .65], [14, 0, 2, .85]]];
  const KICKS = [[0], [0, 10], [0, 7, 10], [0, 6, 10, 14]];   // du plus calme au plus syncopé (voir niv des kicks)
  // L'ACCORD HACHÉ (la signature de la première version) : 3 · 3 · 4 · 3 · 3 — deux grilles qui alternent
  const STAB_A = [[0, 2.5, 1], [3, 2.5, .8], [6, 3, .9], [10, 2.5, .8], [13, 2.5, .75]], STAB_B = [[0, 2, 1], [3, 2, .75], [7, 3, .9], [10, 2, .8], [14, 2, .7]];
  const ARP = [0, 3, 6, 8, 11, 14];   // la guitare qui égrène l'accord

  const QUAND = { pad: 1, arp: 1, balais: 1, kick: 1, pluie: 2, basse: 3, rim: 4, hats: 5, motif: 6, kick2: 7, stab: 8, cordes: 9, melo: 10, clap: 11, shaker: 12, funky: 13, sax: 14, decolle: 15, bells: 16, cello: 17, choeur: 18,
    toms: 19, ride: 20, hats16: 20, ouvert: 21, sax2: 22, souffle: 23, roule: 24, run: 25, tutti: 26, climax: 27, final: 28, octave: 30 };
  const ENTRE = { 1: 'La nuit tombe : la nappe, la guitare qui égrène l’accord, le souffle des balais, un cœur de grosse caisse. Rien de grave.', 2: '+ la pluie au loin', 3: '+ la contrebasse douce, courte', 4: '+ le rimshot, au 2 et au 4',
    5: '+ le charley fermé, swingué', 6: 'LE THÈME entre à la guitare (le motif et sa reprise)', 7: '+ la grosse caisse qui syncope', 8: '+ l’accord haché en 3-3-4-3-3 (la signature)', 9: '+ les cordes de velours', 10: '+ le thème en entier',
    11: '+ le clap fantôme', 12: '+ le shaker', 13: '+ la contrebasse qui danse', 14: 'LE SAXO DE VELOURS prend le chant', 15: 'ÇA DÉCOLLE : la grosse caisse se double, la montée de fin de phrase, la guitare plus haut',
    16: '+ les cloches de vapeur', 17: '+ le violoncelle qui répond', 18: '+ le chœur qui glisse du « ou » au « a »', 19: '+ les toms de fin de phrase', 20: '+ la ride et les charleys en doubles croches', 21: '+ le charley ouvert',
    22: '+ la guitare double le saxo à l’octave', 23: '+ le souffle du saxo', 24: '+ le roulement de caisse', 25: '+ l’envolée de guitare', 26: '+ tout l’orchestre de cordes, à l’octave', 27: 'LE CLIMAX : la cymbale toutes les 4 mesures, tous les accords frappés',
    28: 'Le final : la grosse caisse s’emballe', 30: 'Le saxo monte d’une octave sur tout l’orchestre.' };
  const PALIERS30 = Array.from({ length: 30 }, (_, k) => ENTRE[k + 1] || (k < 14 ? 'Tout s’ouvre d’un cran.' : 'Tout pousse d’un cran : plus fort, plus serré.'));
  const BASE = { pad: .5, guit: .62, balais: .34, kick: .5, pluie: .18, basse: .5, rim: .34, hats: .22, stab: .5, cordes: .4, clap: .3, shaker: .26, sax: .6, bells: .3, cello: .5, choeur: .4, toms: .4, ride: .2, ouvert: .22, caisse: .3, run: .5, riser: .3, crash: .4, souffle: .08 };
  const niv = (id, p) => { const e = { guit: 1, stab: QUAND.stab, souffle: QUAND.souffle, caisse: QUAND.roule }[id] || QUAND[id] || 1; if (p < e) return 0; const r = Math.min(1, (p - e) / 6), g = .7 + .3 * (p - 1) / 29; return (BASE[id] || .3) * (.82 + .18 * r) * g; };
  const FILTRE_PAD = p => Math.min(4200, 700 * Math.pow(1.075, p - 1));
  const POMPE = p => p < QUAND.decolle ? .86 : Math.max(.55, .8 - .018 * (p - QUAND.decolle));

  function preparer(ctx, sortie, alea) {
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
    const courbe = k => { const c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; };
    const impulsion = (len, dec, lp) => { const n = Math.floor(ctx.sampleRate * len), b = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let y = 0; const a = Math.exp(-2 * Math.PI * lp / ctx.sampleRate);
        for (let i = 0; i < n; i++) { y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.pow(1 - i / n, dec); } } return b; };
    // une frappe de bruit PRÉCALCULÉE : passe-haut à un pôle, passe-bas à DEUX pôles (12 dB/octave : plus de sifflement), attaque, chute
    const frappe = (dur, hp, lp, dec, att) => { const sr = ctx.sampleRate, n = Math.floor(sr * dur), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0), aL = 1 - Math.exp(-2 * Math.PI * lp / sr), aH = 1 - Math.exp(-2 * Math.PI * hp / sr), na = Math.max(1, Math.floor(sr * att));
      let l = 0, l2 = 0, h = 0; for (let i = 0; i < n; i++) { const x = alea() * 2 - 1; l += aL * (x - l); l2 += aL * (l - l2); h += aH * (l2 - h); d[i] = (l2 - h) * Math.min(1, i / na) * Math.pow(1 - i / n, dec); } return b; };
    const master = G(.5), chaud = ctx.createWaveShaper(); chaud.curve = courbe(1.06); chaud.oversample = '2x';
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 2; comp.attack.value = .015; comp.release.value = .22;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -3; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1; lim.knee.value = 0;
    // le grave est tenu : passe-haut à 38 Hz, un creux dans la boue 240 Hz, un coin d'aigus arrondi
    const boue = F('peaking', 240, .9); boue.gain.value = -2.5; const doux = F('highshelf', 7000, .7); doux.gain.value = -2.5;
    chaine(master, F('highpass', 38, .7), boue, doux, chaud, comp, lim, sortie);
    const salle = ctx.createConvolver(); salle.buffer = impulsion(3.4, 2.2, 3000); const envoiSalle = G(1); chaine(envoiSalle, salle, F('highpass', 280, .7), G(.32), master);
    const dG = ctx.createDelay(2), dD = ctx.createDelay(2); dG.delayTime.value = SD * 3; dD.delayTime.value = SD * 3;
    const fb = G(.36), echoIn = G(1), echoSort = G(0), pG = ctx.createStereoPanner(), pD = ctx.createStereoPanner(); pG.pan.value = -.7; pD.pan.value = .7;
    chaine(echoIn, F('lowpass', 3800, .7), F('highpass', 300, .7), dG); dG.connect(dD); dD.connect(fb); fb.connect(dG); dG.connect(pG); dD.connect(pD); pG.connect(echoSort); pD.connect(echoSort); echoSort.connect(master); echoSort.connect(envoiSalle);
    const pompe = G(1); pompe.connect(master);
    const ids = ['pad', 'guit', 'stab', 'balais', 'kick', 'pluie', 'basse', 'rim', 'hats', 'kick2', 'cordes', 'clap', 'shaker', 'sax', 'souffle', 'bells', 'cello', 'choeur', 'toms', 'ride', 'ouvert', 'caisse', 'run', 'riser', 'crash'], bus = {};
    ids.forEach(id => bus[id] = G(0));
    const PUMPES = ['pad', 'cordes', 'choeur', 'cello'];
    PUMPES.forEach(id => bus[id].connect(pompe)); ids.filter(id => !PUMPES.includes(id)).forEach(id => bus[id].connect(master));
    const envoi = (id, v, cible) => { const g = G(v); bus[id].connect(g); g.connect(cible || envoiSalle); };
    [['pad', .45], ['guit', .3], ['stab', .3], ['cordes', .4], ['sax', .38], ['souffle', .3], ['cello', .3], ['choeur', .5], ['bells', .45], ['rim', .35], ['clap', .45], ['balais', .2], ['run', .35], ['toms', .3], ['caisse', .3]].forEach(([id, v]) => envoi(id, v));
    [['guit', .3], ['sax', .34], ['bells', .5], ['run', .3], ['stab', .15]].forEach(([id, v]) => envoi(id, v, echoIn));
    const filtrePad = F('lowpass', 700, .7); filtrePad.connect(bus.pad);
    /* (2026-11-03, Léo : « la percussion à grain est assourdissante ») les frappes de bruit sont ADOUCIES : le balai n'est plus un sifflement (2,2–9 kHz, centroïde 7,3 kHz, 68 % de l'énergie au-dessus de 2 kHz)
       mais un COUSSIN de souffle (320–1900 Hz, attaque lente, qui se gonfle et retombe) ; la pluie (le tapis de bruit qui entre au moteur 2) passe de 1,4–9,5 kHz à 420–2600 Hz ; le rimshot, le clap, le shaker, les charleys, la ride perdent leurs aigus durs */
    const buf = { hat: frappe(.05, 6200, 11500, 3, .0015), ouvert: frappe(.3, 5200, 10500, 2, .003), shaker: frappe(.07, 3300, 7800, 1.5, .008), balai: frappe(.46, 320, 1900, 1.2, .1), rim: frappe(.04, 700, 3000, 3, .0015),
      clap: frappe(.2, 700, 3600, 2.6, .004), ride: frappe(.7, 4000, 10500, 2, .002), crash: frappe(1.8, 3000, 9500, 1.6, .004), pluie: frappe(2.4, 420, 2600, .15, .5), souffle: frappe(.4, 800, 4300, 1.4, .06), caisse: frappe(.14, 900, 5200, 2, .002) };
    return { bus, pompe, filtrePad, echoSort, buf, master };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    p = Math.max(1, Math.min(30, p | 0));
    const b = kit.bus, A = id => p >= QUAND[id];
    for (const id in b) b[id].gain.setValueAtTime(niv(id, p), t0);
    kit.master.gain.setTargetAtTime(.78 + .42 * Math.pow((p - 1) / 29, 1.15), t0, .5);
    kit.filtrePad.frequency.setTargetAtTime(FILTRE_PAD(p), t0, .4); kit.echoSort.gain.setValueAtTime(p >= 5 ? .5 : .25, t0);
    const osc = (type, f, dt) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; if (dt) o.detune.value = dt; return o; };
    const filt = (type, f, q) => { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };
    const env = (g, t, pic, a, dur) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, pic), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); };
    const coup = (t, buf, dest, v, rate) => { const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = buf; if (rate) s.playbackRate.value = rate; g.gain.value = v; s.connect(g); g.connect(dest); s.start(t); };

    // ---- les instruments ----
    // la guitare soyeuse : un triangle et une scie voilée, filtre qui se referme, la note retombe en douceur (jamais de coupure)
    const guit = (t, midi, v, dur, dest) => { const f = mtof(midi), o = osc('triangle', f), o2 = osc('sawtooth', f, 4), g2 = ctx.createGain(), g = ctx.createGain(), x = filt('lowpass', 3000, .8);
      x.frequency.setValueAtTime(3200, t); x.frequency.exponentialRampToValueAtTime(900, t + dur * .8); g2.gain.value = .22; env(g, t, v, .005, dur);
      o.connect(x); o2.connect(g2); g2.connect(x); x.connect(g); g.connect(dest || b.guit); o.start(t); o2.start(t); o.stop(t + dur + .05); o2.stop(t + dur + .05); };
    const stab = (t, accord, v, dur, inv) => { for (let k = 0; k < 3; k++) guit(t + k * .008, accord[(k + inv) % 4] + (k + inv >= 4 ? 12 : 0) + (A('decolle') ? 12 : 0), v * (k === 0 ? .8 : 1) * .55, dur, b.stab); };
    const nappe = (t, accord, dur) => { const g = ctx.createGain(), v = .05; g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + 1); g.gain.setValueAtTime(v, t + dur - .3); g.gain.linearRampToValueAtTime(.0001, t + dur + .8);
      accord.forEach(m => [-9, 0, 9].forEach((dt, j) => { const o = osc(j === 1 ? 'sine' : 'triangle', mtof(m + 12), dt), pn = ctx.createStereoPanner(); pn.pan.value = (j - 1) * .7; o.connect(pn); pn.connect(g); o.start(t); o.stop(t + dur + .9); }));
      g.connect(kit.filtrePad); };
    // les cordes de velours : des scies voilées, attaque lente, qui gonflent puis retombent
    const cordes = (t, accord, dur, haut) => { const g = ctx.createGain(), x = filt('lowpass', 2000, .7); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.055, t + dur * .55); g.gain.linearRampToValueAtTime(.0001, t + dur + .6);
      accord.forEach(m => [-8, 8].forEach(dt => { const o = osc('sawtooth', mtof(m + 12 + (haut || 0)), dt); o.connect(x); o.start(t); o.stop(t + dur + .7); })); x.connect(g); g.connect(b.cordes); };
    const basse = (t, midi, v, dur) => { const f = mtof(midi), o = osc('sine', f), o2 = osc('triangle', f * 2), g = ctx.createGain(), g2 = ctx.createGain(), x = filt('lowpass', 900, .8);
      o.frequency.setValueAtTime(f * 1.04, t); o.frequency.exponentialRampToValueAtTime(f, t + .03); env(g, t, v, .006, Math.min(.34, dur)); g2.gain.value = .3; o.connect(x); o2.connect(g2); g2.connect(x); x.connect(g); g.connect(b.basse); o.start(t); o2.start(t); o.stop(t + .36); o2.stop(t + .36); };
    const kick = t => { const o = osc('sine', 100), g = ctx.createGain(); o.frequency.setValueAtTime(100, t); o.frequency.exponentialRampToValueAtTime(43, t + .08); env(g, t, .75, .004, .26); o.connect(g); g.connect(b.kick); o.start(t); o.stop(t + .28);
      kit.pompe.gain.setValueAtTime(POMPE(p), t); kit.pompe.gain.linearRampToValueAtTime(1, t + SD * 3.4); };
    const tom = (t, f0) => { const o = osc('sine', f0), g = ctx.createGain(); o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * .55, t + .22); env(g, t, .6, .004, .28); o.connect(g); g.connect(b.toms); o.start(t); o.stop(t + .3); };
    // le saxo de velours : deux scies à peine désaccordées, un sinus dessous, un filtre qui s'ouvre sur l'attaque, le vibrato qui arrive tard, la note qui se referme en douceur
    const sax = (t, midi, len, v, dest) => { const dur = SD * len, f = mtof(midi), x = filt('lowpass', 2600, .9), fm = filt('peaking', 1250, 1.4), g = ctx.createGain(), lfo = osc('sine', 5.2), lg = ctx.createGain();
      fm.gain.value = 5; x.frequency.setValueAtTime(900, t); x.frequency.exponentialRampToValueAtTime(2600, t + .12);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .05); g.gain.setValueAtTime(v, t + Math.max(.06, dur - .1)); g.gain.setTargetAtTime(.0001, t + Math.max(.07, dur - .05), .08);
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(11, t + Math.max(.35, dur * .7)); lfo.connect(lg);
      [['sawtooth', -5, 1], ['sawtooth', 5, .7], ['sine', 0, .6]].forEach(([ty, dt, gv]) => { const o = osc(ty, ty === 'sine' ? f / 2 : f, dt), gg = ctx.createGain(); gg.gain.value = gv; lg.connect(o.detune); o.connect(gg); gg.connect(x); o.start(t); o.stop(t + dur + .7); });

    const choeur = (t, accord, dur) => { const g = ctx.createGain(), f1 = filt('bandpass', 350, 4), f2 = filt('bandpass', 800, 5), s = ctx.createGain();

      const acc0 = AC[gr[0]], acc1 = AC[gr[gr.length - 1]];
      const accAt = i => (moitie && i >= 8) ? acc1 : acc0;

      if (A('run') && bar === 7) for (let i = 10; i < 16; i++) guit(tm + i * SD, acc1.v[(i - 10) % 4] + 12 + 12 * ((i - 10) >= 4), .26, .3, b.run);

        if (A('clap') && ((i === 11 && bar % 2) || (A('funky') && i === 7 && bar % 4 === 3))) coup(tt, kit.buf.clap, b.clap, i === 11 ? .8 : .45);
        if (A('hats') && i % 2 === 0 && !A('hats16')) coup(tt, kit.buf.hat, b.hats, i % 4 === 2 ? .85 : .55);

  return {

<script>
(function () {
  let ctx = null, kit = null, p = 1, m = 0, tNext = 0, iv = 0;
