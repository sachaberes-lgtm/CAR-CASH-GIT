<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura — 30 paliers</title>
<style>
:root{--fond:#fff;--tx:#17141c;--tx2:#8a8494;--fil:#e4e1ea;--acc:#b0122e}
@media (prefers-color-scheme:dark){:root{--fond:#0b090d;--tx:#f2f0f7;--tx2:#9a94a8;--fil:#2a2633;--acc:#e0314f}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:16px}
.boite{width:100%;max-width:560px;border:1px solid var(--fil);border-radius:20px;padding:24px;display:grid;gap:18px}
h1{margin:0;font-size:22px}.sous{color:var(--tx2);font-size:13px;margin-top:4px}
.rang{display:flex;gap:16px;align-items:center}
#play{width:72px;height:72px;border-radius:50%;border:0;background:var(--tx);color:var(--fond);font-weight:700;cursor:pointer;flex:none}
.pals{display:grid;gap:6px;flex:1}#speed{width:100%}#mot{font-weight:700;font-size:18px}
.pals button{border:1px solid var(--fil);background:none;color:var(--tx);border-radius:12px;padding:12px 0;font:inherit;font-weight:700;cursor:pointer}
.pals button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ce{color:var(--tx2);font-size:13px;min-height:36px}
</style></head><body>
<div class="boite">
  <div><h1>AURA · 30 PALIERS</h1><div class="sous">le même AURA (le Moteur French Touch de Léo, version aura / dark triad · 122 BPM · mi mineur), en 30 moteurs comme les musiques du générateur : chaque moteur ajoute un élément ou pousse un cran</div></div>
  <div class="rang"><button id="play">PLAY</button><div class="pals"><div id="mot">Moteur 1 / 30</div><input type="range" id="speed" min="0" max="100" step="any" value="0" aria-label="Moteur"></div></div>
  <div id="ce"></div>
</div>

<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers », avec INTRO) =======================
     Léo (2026-10-13) : « pars du premier son French touch [son Moteur French Touch, french-touch.html] et fais un truc un peu
     music aura, dark triad ». On garde SES instruments et SA mécanique : la boucle (basse disco, accords hachés, guitare funk, voix
     robot) passe dans UN filtre résonant puis dans la pompe de la grosse caisse ; le thérémine, les bips de l'ordinateur de bord, les
     lasers, la voix qui parle en charabia, le petit décalage (shuffle) des doubles croches, le filtre qui plonge en fin de phrase et
     se rouvre d'un coup. Ce qui change : RÉ MAJEUR DISCO → MI MINEUR (Em9 · Cmaj9 · Am9 · B7(b9)), le thérémine et les bips plus bas
     et plus inquiétants, et l'énergie AURA / DARK TRIAD qui monte : la CLOCHE phonk, la 808 qui glisse et sature, un chœur sombre.
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 122, SD = 60 / BPM / 4, MES = 16 * SD, PHR = 8 * MES, SHUF = 0.06;
  // ⚠ toute ondulation lente fait un nombre ENTIER de tours par phrase de 8 mesures (k / PHR) : sinon la boucle claque au bouclage
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // LA GRILLE (mi mineur) : Em9 · Cmaj9 · Am9 · B7(b9), deux fois par phrase. Voicings serrés dans le médium (fa#3 → fa#4).
  const ROOTS = [40, 36, 45, 47];
  const CHORDS = [[55, 59, 62, 66], [55, 59, 62, 64], [55, 59, 60, 64], [54, 57, 60, 63]];
  const PCS = [[4, 7, 11, 2, 6], [0, 4, 7, 11, 2], [9, 0, 4, 7, 11], [11, 3, 6, 9, 0]];   // les notes de chaque accord (classes)
  const BASS_PAT = [0, -1, 12, -1, -1, 0, 12, -1, 0, -1, 12, 0, -1, 7, 12, -1];             // la basse disco du Moteur French Touch
  const CHORD_HITS = [2, 6, 10, 13], CHORD_FANT = [8, 15];
  const GUIT = [1, 2, 0, 2, 1, 0, 2, 2, 1, 2, 0, 2, 1, 0, 2, 1];                             // 1 note (wah), 2 étouffé
  // la voix robot sur 2 mesures, en mi mineur : [note, durée en pas, voyelle de départ, voyelle d'arrivée]
  const VOICE = { 0: [66, 3, 'o', 'a'], 4: [67, 2, 'a', 'e'], 6: [66, 2, 'e', 'o'], 10: [64, 4, 'o', 'a'],
                  16: [64, 3, 'a', 'o'], 20: [67, 2, 'o', 'e'], 22: [71, 2, 'e', 'a'], 26: [69, 5, 'a', 'o'] };
  const TALK = { 0: [71, 2], 3: [69, 1], 4: [67, 2], 7: [69, 2], 10: [74, 3], 14: [71, 2] };   // la réponse robot (P6+)
  const VOWELS = { o: [450, 800, 2830], a: [750, 1150, 2800], e: [420, 1700, 2600], u: [320, 800, 2400] };
  // LA CLOCHE AURA (phonk, P5+) : [pas sur 2 mesures, rang dans l'accord] — le rang devient la note de l'accord en cours (mi4 → mi5)
  const COW = [[0, 2], [3, 2], [6, 3], [8, 2], [10, 1], [12, 0], [14, 1], [16, 0], [19, 0], [22, 1], [24, 2], [26, 3], [28, 2], [30, 1]];
  const T_VOW = { a: [750, 1150, 2800], e: [400, 2000, 2600], i: [280, 2250, 2900], o: [450, 800, 2830], u: [320, 800, 2400] };
  const T_CONS = ['p', 't', 'k', 'b', 'd', 'm', 'n', 's', 'ch', 'r', 'l', '', ''];
  const CUTS = [[0, 8], [0, 6, 10], [0, 3, 6, 10, 13]];

  // HUIT PALIERS, UN TOUS LES 4 MOTEURS — QUAND : le palier où chaque élément entre (comme la jauge du Moteur French Touch)
  const MOTEURS = [4, 4, 4, 4, 4, 4, 4, 2];
  const QUAND = { clap: 2, talker: 2, hat16: 2, guitare: 3, bleeps: 3, plonge: 3, drop: 4, voix: 4, laser: 4, aura: 5, fantome: 5,
                  triade: 6, talk: 6, flanger: 7, laser2: 7, voixTout: 7, final: 8 };
  const NIV = {   // [intro, P1 … P8]
    kick:     [.85, .9, .95, 1, 1.1, 1.12, 1.15, 1.18, 1.2],
    bass:     [1, .95, 1, 1.05, 1.1, 1.05, 1.05, 1.08, 1.1],
    chords:   [1, 1, 1, 1.05, 1.1, 1.1, 1.12, 1.12, 1.15],
    hats:     [.5, .6, .9, 1, 1, 1.05, 1.05, 1.08, 1.1],
    clap:     [0, 0, 1, 1, 1.05, 1.05, 1.1, 1.1, 1.12],
    guitar:   [0, 0, 0, 1, 1, 1.05, 1.05, 1.1, 1.1],
    hatsOpen: [0, 0, 0, 0, 1, 1, 1.05, 1.05, 1.1],
    voice:    [.8, 0, 0, 0, 1, 1, 1.05, 1.1, 1.12],
    talk:     [0, 0, 0, 0, 0, 0, 1, 1, 1.05],
    talker:   [.7, 0, .9, 1, 1, 1, 1, 1.05, 1.1],
    theremin: [1, 1, 1, 1, .9, .85, .8, .8, .8],
    bleeps:   [0, 0, 0, 1, 1, 1, 1, 1.05, 1.05],
    laser:    [0, 0, 0, 0, 1, 1, 1, 1.05, 1.1],
    cow:      [0, 0, 0, 0, 0, 1, 1.05, 1.1, 1.15],
    b808:     [0, 0, 0, 0, 0, .9, 1, 1, 1.05],
    choir:    [0, 0, 0, 0, 0, 0, 1, 1.05, 1.1],
    strings:  [0, 0, 0, 0, 0, 0, 0, 0, 1],
    tamb:     [0, 0, 0, 0, 0, 0, 0, .8, 1],
    crash:    [0, 0, 0, 0, 1, 1, 1, 1, 1],
  };
  const LOOP_F = [0, 700, 1200, 2200, 9000, 16000, 18000, 18000, 18000];   // LE FILTRE DE LA BOUCLE (sa jauge « Filtré → Grand ouvert »)
  const LOOP_Q = [3, 3, 2.6, 2.2, 1.2, .8, .8, .8, .8];
  const POMPE = [.45, .42, .4, .38, .35, .32, .3, .28, .26];             // la pompe : la boucle s'écrase sur la grosse caisse
  const FLANGE = [0, 0, 0, 0, 0, 0, 0, .3, .45];
  const BLEEP_P = [0, 0, 0, .2, .25, .28, .3, .33, .36];                  // la chance d'un bip par double croche
  const PENTA = [64, 67, 69, 71, 74, 76, 79];                             // les bips : mi mineur pentatonique, plus bas que l'original

  // (2026-10-15, pôle SON ; Léo, dans sa note : « incroyable, juste transformer en 30 paliers comme les autres ») LES 30 PALIERS — le MÊME
  // morceau, le même son, rien de recomposé : `p` devient le MOTEUR (1 à 30). Les 8 marches d'origine restent aux moteurs 1, 5, 9 … 29 ;
  // entre elles, chaque élément entre à SON moteur (QUAND) et les niveaux, le filtre de la boucle, la pompe, le flanger glissent d'un cran
  // à chaque moteur (tableaux étirés : le palier d'origine au moteur m = 1 + (m − 1) / 4 ; le filtre en géométrique).
  const PAL = mm => Math.min(8, 1 + (mm - 1) / 4);
  const etire = (a, geo) => { const r = [a[0]]; for (let mm = 1; mm <= 30; mm++) { const x = PAL(mm), i = Math.floor(x), f = x - i, u = a[i], v = a[Math.min(8, i + 1)];
    r.push(i >= 8 ? a[8] : geo && u > 0 && v > 0 ? u * Math.pow(v / u, f) : u + (v - u) * f); } return r; };
  for (const id in NIV) NIV[id] = etire(NIV[id]);
  [[LOOP_F, 1], [LOOP_Q], [POMPE], [FLANGE], [BLEEP_P]].forEach(([a, geo]) => { const r = etire(a, geo); a.splice(0, a.length, ...r); });
  Object.assign(QUAND, { clap: 5, talker: 6, hat16: 7, guitare: 9, bleeps: 10, plonge: 11, drop: 13, voix: 14, laser: 15, aura: 17, fantome: 18,
                         triade: 21, talk: 22, flanger: 25, laser2: 26, voixTout: 27, final: 29 });
  MOTEURS.splice(0, MOTEURS.length, ...Array(30).fill(1));
  const ENTRE = { 1: 'Filtré : la boucle derrière le filtre — basse disco, accords hachés, grosse caisse, le thérémine qui glisse.', 5: '+ les claps', 6: '+ la voix qui parle en charabia',
    7: '+ les charleys en doubles croches', 9: '+ la guitare funk', 10: '+ les bips de l’ordinateur de bord', 11: '+ le filtre qui plonge en fin de phrase',
    13: 'LE DROP : grand ouvert, charleys ouverts, cymbale', 14: '+ la voix robot', 15: '+ un laser à chaque phrase', 17: 'AURA : la cloche phonk, la 808 qui glisse et sature',
    18: '+ la grosse caisse qui rebondit', 21: 'DARK TRIAD : le chœur sombre, les claps qui relancent', 22: '+ la réponse robot', 25: '+ le flanger sur la boucle',
    26: '+ les lasers qui se répondent', 27: '+ la voix robot partout', 29: 'Le final : les cordes, le tambourin, la voix qui parle deux fois plus vite', 30: 'Tout dehors.' };
  const PALIERS30 = Array.from({ length: 30 }, (_, k) => ENTRE[k + 1] || (k < 12 ? 'Le filtre s’ouvre un cran.' : 'Tout pousse un cran : plus fort, plus serré.'));

  function preparer(ctx, sortie, alea) {
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
    const courbeSat = k => { const c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; };
    const impulse = (len, power, lp) => { const n = Math.floor(ctx.sampleRate * len), buf = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); let y = 0; const a = Math.exp(-2 * Math.PI * lp / ctx.sampleRate);
        for (let i = 0; i < n; i++) { y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.pow(1 - i / n, power); } }
      return buf; };

    // LA SORTIE (celle du Moteur French Touch) : chaleur, aigus adoucis, compresseur doux — + un limiteur
    const master = G(0.6), warm = ctx.createWaveShaper(); warm.curve = courbeSat(1.2); warm.oversample = '2x';
    const soft = F('highshelf', 6000); soft.gain.value = -3;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -8; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.08; lim.knee.value = 0;   // serré : les pics de grosse caisse ne bloquent plus la montée de volume des premiers paliers
    chaine(master, F('highpass', 30, 0.7), warm, soft, comp, lim, sortie);

    // LA BOUCLE : basse, accords, guitare, voix passent dans UN filtre résonant, puis dans la POMPE
    const loopIn = G(1), loopFilter = F('lowpass', 700, 3), pump = G(1);
    chaine(loopIn, loopFilter, pump, master);
    // le FLANGER (le haut de sa jauge) : une ligne courte qui ondule (2 tours par phrase), réinjectée
    const fl = ctx.createDelay(0.02); fl.delayTime.value = 0.004;
    { const lfo = ctx.createOscillator(); lfo.frequency.value = 2 / PHR; const amt = G(0.0025); lfo.connect(amt); amt.connect(fl.delayTime); lfo.start(0); }
    const flFb = G(0.35), flWet = G(0);
    pump.connect(fl); fl.connect(flFb); flFb.connect(fl); fl.connect(flWet); flWet.connect(master);

    // LES PIÈCES : sa petite pièce (clap, voix), et une SALLE SOMBRE pour l'aura (thérémine, chœur, cloche)
    const room = ctx.createConvolver(); room.buffer = impulse(1.1, 3, 6000);
    const roomSend = G(0.3); chaine(roomSend, room, G(0.22), master);
    const salle = ctx.createConvolver(); salle.buffer = impulse(2.6, 2.4, 2600);
    const salleSend = G(1); chaine(salleSend, salle, F('highpass', 250, 0.7), G(0.32), master);

    // L'ÉCHO de la voix, calé sur la croche, qui revient DANS la boucle (son idée)
    const vDelay = ctx.createDelay(2); vDelay.delayTime.value = 60 / BPM / 2;
    const vfb = G(0.25); chaine(vDelay, vfb, vDelay); chaine(vDelay, G(0.18), loopIn);

    // LA SATURATION (phonk) : un façonneur par bus — la cloche et la 808 s'y écrasent
    const fuzz = (dest, k, lp) => { const inp = G(1), ws = ctx.createWaveShaper(); ws.curve = courbeSat(k); ws.oversample = '2x';
      chaine(inp, ws, F('lowpass', lp, 0.7), G(1 / Math.sqrt(k)), dest); return inp; };

    const IN_LOOP = ['bass', 'chords', 'guitar', 'voice', 'talk', 'strings'];
    const bus = {};
    for (const id in NIV) { const g = G(0); bus[id] = g; }
    IN_LOOP.forEach(id => bus[id].connect(loopIn));
    ['kick', 'hats', 'clap', 'hatsOpen', 'talker', 'theremin', 'bleeps', 'laser', 'tamb', 'crash'].forEach(id => bus[id].connect(master));
    const cowF = fuzz(master, 3, 5000); bus.cow.connect(cowF); bus.cow.connect(salleSend);
    bus.b808.connect(fuzz(pump, 2.5, 900));
    bus.choir.connect(pump); bus.choir.connect(salleSend);
    bus.clap.connect(roomSend);
    bus.voice.connect(roomSend); bus.voice.connect(vDelay);
    bus.talk.connect(vDelay);
    bus.talker.connect(roomSend); { const t = G(0.5); bus.talker.connect(t); t.connect(vDelay); }
    bus.theremin.connect(roomSend); bus.theremin.connect(vDelay); { const t = G(0.4); bus.theremin.connect(t); t.connect(salleSend); }
    bus.bleeps.connect(vDelay);
    bus.laser.connect(vDelay); bus.laser.connect(roomSend);

    // LE THÉRÉMINE : UNE voix qui glisse d'une note à l'autre (son idée), plus basse et plus inquiétante — vibrato calé sur la phrase
    const there = ctx.createOscillator(); there.type = 'sine'; there.frequency.value = mtof(66);
    { const vib = ctx.createOscillator(); vib.frequency.value = 87 / PHR; const va = G(24); vib.connect(va); va.connect(there.detune); vib.start(0); }
    const thereGain = G(0); there.connect(thereGain); thereGain.connect(bus.theremin); there.start(0);

    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = alea() * 2 - 1; }
    return { bus, loopFilter, pump, flWet, there, thereGain, noiseBuf, last808: null, phrase: [], talkK: 0, talkIdx: 3 };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    p = Math.max(0, Math.min(30, p | 0));   // (30 paliers : p est le moteur)
    const b = kit.bus, intro = p === 0, lf = kit.loopFilter;
    for (const id in NIV) b[id].gain.setValueAtTime(NIV[id][p], t0);
    kit.flWet.gain.setValueAtTime(FLANGE[p], t0);

    const kr = (...ps) => ps.forEach(x => { try { x.automationRate = 'k-rate'; } catch (e) {} });
    const filt = (type, f, q) => { const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; kr(fl.frequency, fl.Q); return fl; };
    const osc = (type, f, dt) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; if (dt) o.detune.value = dt; return o; };
    const env = (g, t, peak, a, dur) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); };
    const noise = (t, dest, type, freq, q, peak, dur, off) => { const s = ctx.createBufferSource(), f = filt(type, freq, q), g = ctx.createGain();
      s.buffer = kit.noiseBuf; env(g, t, peak, 0.002, dur); s.connect(f); f.connect(g); g.connect(dest); s.start(t, off != null ? off : alea() * 0.5); s.stop(t + dur + 0.02); };

    // ---- SES instruments (le Moteur French Touch), assombris ----
    const kick = t => { const o = osc('sine', 150), g = ctx.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.08);
      env(g, t, 0.95, 0.002, 0.34); o.connect(g); g.connect(b.kick); o.start(t); o.stop(t + 0.36);
      noise(t, b.kick, 'bandpass', 3500, 1, 0.08, 0.01);
      kit.pump.gain.setValueAtTime(POMPE[p], t); kit.pump.gain.linearRampToValueAtTime(1, t + SD * 4 * 0.85); };   // la pompe
    const bass = (t, midi, dur) => { const o = osc('sawtooth', mtof(midi)), sub = osc('sine', mtof(midi)), f = filt('lowpass', 300, 3), g = ctx.createGain();
      f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(300, t + dur);
      env(g, t, 0.32, 0.004, dur); o.connect(f); sub.connect(f); f.connect(g); g.connect(b.bass);
      o.start(t); sub.start(t); o.stop(t + dur + 0.02); sub.stop(t + dur + 0.02); };
    const chordHit = (t, chord, dur, v) => { const f = filt('lowpass', 1200, 1), g = ctx.createGain();
      f.frequency.setValueAtTime(3600, t); f.frequency.exponentialRampToValueAtTime(1000, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05 * v, t + 0.006); g.gain.setValueAtTime(0.05 * v, t + dur * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      chord.forEach(m => [-6, 6].forEach(dt => { const o = osc('sawtooth', mtof(m), dt); o.connect(f); o.start(t); o.stop(t + dur + 0.02); }));
      f.connect(g); g.connect(b.chords); };
    const guitar = (t, midi, muted) => { if (muted) { noise(t, b.guitar, 'bandpass', 2200, 2, 0.35, 0.03); return; }
      const o = osc('square', mtof(midi)), f = filt('bandpass', 600, 4), g = ctx.createGain();
      f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(2400, t + 0.06);
      env(g, t, 0.55, 0.003, 0.1); o.connect(f); f.connect(g); g.connect(b.guitar); o.start(t); o.stop(t + 0.12); };
    // la voix robot : la voyelle glisse pendant la note (une scie + un carré à l'octave grave, dans trois formants)
    const robot = (t, midi, dur, v1, v2, dest, peak) => { const o = osc('sawtooth', mtof(midi)), o2 = osc('square', mtof(midi - 12)), g = ctx.createGain(), mix2 = ctx.createGain();
      mix2.gain.value = 0.4; o2.connect(mix2);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.02); g.gain.setValueAtTime(peak, t + dur * 0.75); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      VOWELS[v1].forEach((fr, k) => { const bp = filt('bandpass', fr, 5), fg = ctx.createGain();
        bp.frequency.setValueAtTime(fr, t); bp.frequency.linearRampToValueAtTime(VOWELS[v2][k], t + dur * 0.8);
        fg.gain.value = [1, 0.5, 0.12][k]; o.connect(bp); mix2.connect(bp); bp.connect(fg); fg.connect(g); });
      g.connect(dest); o.start(t); o2.start(t); o.stop(t + dur + 0.02); o2.stop(t + dur + 0.02); };
    const strings = (t, chord, dur) => { const f = filt('lowpass', 3000, 0.7), g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.03, t + 0.4); g.gain.setValueAtTime(0.03, t + dur - 0.15); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.3);
      chord.forEach(m => [-1, 1].forEach(side => { const o = osc('sawtooth', mtof(m + 12), side * 9), pn = ctx.createStereoPanner(); pn.pan.value = side * 0.8;
        o.connect(pn); pn.connect(f); o.start(t); o.stop(t + dur + 0.35); }));
      f.connect(g); g.connect(b.strings); };
    // l'ordinateur de bord : bips métalliques (modulation en anneau), plus bas que l'original
    const bleep = (t, midi) => { const o = osc('sine', mtof(midi)), m = osc('sine', mtof(midi) * 1.5), ring = ctx.createGain(), g = ctx.createGain(), pn = ctx.createStereoPanner();
      ring.gain.value = 0; m.connect(ring.gain); o.connect(ring); env(g, t, 0.25, 0.002, 0.06); pn.pan.value = alea() * 1.6 - 0.8;
      ring.connect(g); g.connect(pn); pn.connect(b.bleeps); o.start(t); m.start(t); o.stop(t + 0.08); m.stop(t + 0.08); };
    const laser = t => { const o = osc('square', 2400), f = filt('lowpass', 3000, 0.7), g = ctx.createGain();
      o.frequency.setValueAtTime(2400, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.3);
      env(g, t, 0.06, 0.003, 0.32); o.connect(f); f.connect(g); g.connect(b.laser); o.start(t); o.stop(t + 0.35); };

    // ---- L'AURA / DARK TRIAD ----
    // LA CLOCHE (phonk) : deux carrés à 1 : 1,48 (la cloche de la 808), un passe-bande, puis le façonneur du bus
    const cloche = (t, midi, v) => { const f = mtof(midi), o1 = osc('square', f), o2 = osc('square', f * 1.4815), bp = filt('bandpass', f * 2.5, 1.2), g = ctx.createGain();
      env(g, t, 0.32 * v, 0.001, 0.3); o1.connect(bp); o2.connect(bp); bp.connect(g); g.connect(b.cow); [o1, o2].forEach(o => { o.start(t); o.stop(t + 0.32); }); };
    const noteCloche = (bar, rang) => { const pool = []; for (let m = 64; m <= 76; m++) if (PCS[bar].indexOf(m % 12) >= 0) pool.push(m); return pool[Math.min(pool.length - 1, rang)]; };
    // LA 808 qui glisse d'une fondamentale à l'autre, écrasée par son façonneur
    const huit = (t, midi, len) => { const o = osc('sine', mtof(midi)), g = ctx.createGain(), from = kit.last808;
      if (from != null && from !== midi) { o.frequency.setValueAtTime(mtof(from), t); o.frequency.exponentialRampToValueAtTime(mtof(midi), t + 0.07); }
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.005); g.gain.setValueAtTime(0.35, t + len - 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g); g.connect(b.b808); o.start(t); o.stop(t + len + 0.02); kit.last808 = midi; };
    // LE CHŒUR SOMBRE (dark triad) : des scies dans les formants d'un « ouh »
    const choeur = (t, chord, dur) => { const somme = ctx.createGain(), g = ctx.createGain();
      [[380, 1, 6], [820, 0.45, 7], [2500, 0.06, 6]].forEach(([fr, lv, q]) => { const bp = filt('bandpass', fr, q), fg = ctx.createGain(); fg.gain.value = lv; somme.connect(bp); bp.connect(fg); fg.connect(g); });
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.11, t + 0.5); g.gain.setValueAtTime(0.11, t + dur - 0.1); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.45);
      chord.forEach(m => [-7, 7].forEach(dt => { const o = osc('sawtooth', mtof(m), dt); o.connect(somme); o.start(t); o.stop(t + dur + 0.5); }));
      g.connect(b.choir); };

    // ---- la voix qui parle en charabia (la sienne), plus basse : un murmure de la ville ----
    const makePhrase = () => { const ph = [], vk = Object.keys(T_VOW);
      while (ph.length < 80) { const len = 2 + Math.floor(alea() * 3);
        for (let j = 0; j < len; j++) ph.push({ c: T_CONS[Math.floor(alea() * T_CONS.length)], v: vk[Math.floor(alea() * vk.length)], acc: j === 0 });
        if (alea() < 0.35) ph.push(null); }
      kit.phrase = ph; kit.talkK = 0; };
    const talkNote = chord => { const pool = []; chord.forEach(m => [m, m + 12].forEach(nn => { if (nn >= 55 && nn <= 69) pool.push(nn); })); pool.sort((x, y) => x - y);
      kit.talkIdx = Math.max(0, Math.min(pool.length - 1, kit.talkIdx + Math.round((alea() - 0.55) * 3))); return pool[kit.talkIdx]; };
    const consonant = (t, c, midi, peak) => { const P = { p: 1200, t: 3500, k: 2200, b: 700, d: 2600, r: 1600 };
      if (P[c]) noise(t, b.talker, 'bandpass', P[c], 1.5, peak * 0.5, 0.018);
      else if (c === 's') noise(t, b.talker, 'highpass', 5500, 0.7, peak * 0.25, 0.05);
      else if (c === 'ch') noise(t, b.talker, 'bandpass', 2800, 1, peak * 0.3, 0.05);
      else if (c === 'm' || c === 'n') { const o = osc('sine', mtof(midi)), g = ctx.createGain(); env(g, t, peak * 0.4, 0.005, 0.045); o.connect(g); g.connect(b.talker); o.start(t); o.stop(t + 0.05); } };
    const syllable = (t, syl, midi, dur, peak) => { const lead = (syl.c === 's' || syl.c === 'ch') ? 0.04 : (syl.c === 'm' || syl.c === 'n') ? 0.03 : 0.012;
      consonant(t, syl.c, midi, peak);
      const tv = t + lead, vd = Math.max(0.05, dur - lead), o = osc('sawtooth', mtof(midi)), g = ctx.createGain();
      o.frequency.setValueAtTime(mtof(midi - 0.6), tv); o.frequency.exponentialRampToValueAtTime(mtof(midi), tv + 0.04);
      g.gain.setValueAtTime(0.0001, tv); g.gain.exponentialRampToValueAtTime(peak, tv + 0.012); g.gain.setValueAtTime(peak, tv + vd * 0.75); g.gain.exponentialRampToValueAtTime(0.0001, tv + vd);
      T_VOW[syl.v].forEach((fr, k) => { const bp = filt('bandpass', fr, 6), fg = ctx.createGain(); fg.gain.value = [1, 0.55, 0.15][k]; o.connect(bp); bp.connect(fg); fg.connect(g); });
      g.connect(b.talker); o.start(tv); o.stop(tv + vd + 0.02); };
    const talkRate = p >= QUAND.final ? 2 : p >= QUAND.drop ? 1 : 0.5;
    const talkerStep = (pc, t, chord) => {   // pc = double croche dans la phrase de 8 mesures (0 … 127)
      if (pc === 0 || !kit.phrase.length) makePhrase();
      const rate = talkRate;
      if (pc < 32) {   // mesures 1-2 : la longue phrase, qui s'arrête sur une syllabe tenue
        if (pc === 28) { const syl = kit.phrase.slice(kit.talkK).find(Boolean) || kit.phrase[0]; syllable(t, syl, talkNote(chord), SD * 4, 0.3); return; }
        if (pc > 28 || (rate < 1 && pc % 2)) return;
        const nn = Math.max(1, rate), stepLen = rate < 1 ? SD * 2 : SD / rate;
        for (let j = 0; j < nn; j++) { const syl = kit.phrase[kit.talkK++]; if (syl) syllable(t + j * stepLen, syl, talkNote(chord), stepLen * 0.95, syl.acc ? 0.32 : 0.24); }
        return; }
      if (pc < 64) return;   // mesures 3-4 : silence ; 5-8 : petites phrases coupées et répétées
      const i = pc % 16, barN = Math.floor(pc / 16), slots = CUTS[rate < 1 ? 0 : rate < 2 ? 1 : 2], k = slots.indexOf(i);
      if (k < 0) return;
      const words = kit.phrase.filter(Boolean), start = (k * 5 + (barN === 7 ? 3 : 0)) % (words.length - 4), len = 2 + (k % 2);
      const stepLen = rate < 1 ? SD * 2 : rate < 2 ? SD : SD / 2, note = talkNote(chord);
      for (let j = 0; j < len; j++) syllable(t + j * stepLen, words[start + j], j === len - 1 ? talkNote(chord) : note, stepLen * 0.9, 0.26);
      if (rate >= 2 && barN === 7 && k === slots.length - 1) for (let j = 0; j < 4; j++) syllable(t + (len + j) * stepLen, words[start], note, stepLen * 0.8, 0.22); };

    // ---- les mesures ----
    for (let m = m0; m < m0 + n; m++) {
      const tm = t0 + (m - m0) * MES, bar = m % 4, bar8 = intro ? 4 + Math.min(3, m) : m % 8, chord = CHORDS[bar], root = ROOTS[bar];
      // LE FILTRE DE LA BOUCLE : fixé par le palier ; en fin de phrase (P3+) il PLONGE, puis se rouvre d'un coup sur la mesure 1.
      // L'intro : tout derrière le filtre qui s'ouvre (300 → 650 Hz), la grosse caisse entre à la 2e mesure, plongée à la fin.
      if (intro) { const F0 = [300, 420, 520, 620][Math.min(3, m)]; lf.frequency.setValueAtTime(F0, tm); lf.frequency.linearRampToValueAtTime(F0 + 110, tm + MES); lf.Q.setValueAtTime(3.4, tm); }
      else { lf.frequency.setValueAtTime(LOOP_F[p], tm); lf.Q.setValueAtTime(LOOP_Q[p], tm); }
      const plonge = (intro && m === 3) || (!intro && p >= QUAND.plonge && bar8 === 7);
      if (plonge) { lf.frequency.setTargetAtTime(380, tm + 8 * SD, 0.25); lf.Q.setTargetAtTime(5, tm + 8 * SD, 0.1); }
      if (!intro && p >= QUAND.drop && bar8 === 0) noise(tm, b.crash, 'highpass', 6000, 0.5, 0.12, 1.2, 0);
      if (p >= QUAND.final && bar === 0) strings(tm, chord, MES);
      if (p >= QUAND.triade) choeur(tm, chord, MES);
      // le thérémine : une note de l'accord toutes les demi-mesures, il se tait sur la 4e mesure
      if (bar !== 3) [0, 8].forEach((s, h) => { const pool = chord.map(x => x + 12).filter(x => x >= 62 && x <= 76), note = pool[(bar * 2 + h + Math.floor(m / 4)) % pool.length] || 66;
        kit.there.frequency.setTargetAtTime(mtof(note), tm + s * SD, 0.12); kit.thereGain.gain.setTargetAtTime(0.045, tm + s * SD, 0.25); });
      else kit.thereGain.gain.setTargetAtTime(0, tm, 0.3);
      const batt = !intro || m >= 1, haut = !intro || m >= 2;

      for (let i = 0; i < 16; i++) {
        const s = i + 16 * bar8, t = tm + i * SD + (i % 2 ? SD * SHUF : 0);   // le léger shuffle de l'original
        if (p >= QUAND.talker || (intro && m >= 2)) talkerStep(s, t, chord);
        if (batt && i % 4 === 0 && !(p >= QUAND.plonge && bar8 === 7 && i === 12)) kick(t);
        if (p >= QUAND.fantome && i === 14 && bar8 % 2 === 1 && bar8 !== 7) kick(t);   // la grosse caisse qui rebondit
        if (BASS_PAT[i] >= 0) bass(t, root + BASS_PAT[i], SD * 1.6);
        if (CHORD_HITS.indexOf(i) >= 0) chordHit(t, chord, SD * (i === 13 ? 3 : 1.6), 1);
        if (p >= QUAND.aura && CHORD_FANT.indexOf(i) >= 0) chordHit(t, chord, SD, 0.45);
        if (haut && (p >= QUAND.hat16 || i % 2 === 0)) noise(t, b.hats, 'highpass', 9000, 0.7, (i % 2 ? 0.2 : 0.4) * (0.8 + alea() * 0.4), 0.03);
        if (p >= QUAND.drop && i % 4 === 2) noise(t, b.hatsOpen, 'highpass', 7500, 0.7, 0.38, 0.15);
        if (p >= QUAND.clap && (i === 4 || i === 12)) { for (let k = 0; k < 3; k++) noise(t + k * 0.01, b.clap, 'bandpass', 1300, 0.8, 1.6, 0.04); noise(t + 0.03, b.clap, 'bandpass', 1100, 0.8, 1.3, 0.14); }
        if (p >= QUAND.triade && (bar8 === 3 || bar8 === 7) && i >= 13) noise(t, b.clap, 'bandpass', 1500, 0.8, 0.8 + 0.25 * (i - 13), 0.05);   // la relance
        if (p >= QUAND.final) noise(t, b.tamb, 'bandpass', 6500, 1.2, i % 4 === 2 ? 0.06 : 0.03, 0.05);
        if (p >= QUAND.bleeps && alea() < BLEEP_P[p]) bleep(t, PENTA[Math.floor(alea() * PENTA.length)]);
        if (p >= QUAND.laser && ((bar8 === 0 && i === 0) || (p >= QUAND.laser2 && i === 15 && bar % 2 === 1))) laser(t);
        if (p >= QUAND.guitare && GUIT[i]) guitar(t, chord[chord.length - 1], GUIT[i] === 2);
        // la 808 (aura) : la fondamentale tenue sur les temps 1 et 3, qui glisse vers la suivante
        if (p >= QUAND.aura && (i === 0 || i === 8)) huit(t, root, SD * 6);
        // la cloche phonk (aura), calée sur les notes de l'accord en cours
        if (p >= QUAND.aura) COW.forEach(([st, rang]) => { if (st === (bar8 % 2) * 16 + i) cloche(t, noteCloche(bar, rang), i % 4 === 0 ? 1 : 0.8); });
        const tk = TALK[i]; if (p >= QUAND.talk && tk && bar % 2 === 1) robot(t, tk[0], SD * tk[1], 'o', 'a', b.talk, 0.2);
        const v = VOICE[s % 32];
        if (v && ((p >= QUAND.voix && s >= 32 && s < 64) || p >= QUAND.voixTout || (intro && m === 3 && i >= 8))) robot(t, v[0], SD * v[1], v[2], v[3], b.voice, 0.38);
      }
    }
  }

  return {
    titre: 'AURA · 30 PALIERS', bpm: BPM, mesures: 8, intro: 4, pas: 0.6, moteurs: MOTEURS, ton: 'mi mineur', auteur: 'Claude Code, d’après le Moteur French Touch de Léo',
    style: 'french touch sombre, aura / dark triad (phonk)',
    introTxt: 'Tout derrière le filtre : le thérémine, le murmure de la voix qui parle, la grosse caisse qui arrive, puis le filtre plonge et la voix robot appelle.',
    paliers: PALIERS30,
    preparer, jouer };
})();
</script>

<!-- ======================= L'ÉCOUTE (libre : ce que voit celui qui ouvre le fichier) ======================= -->
<script>
(function () {
  let ctx = null, kit = null, p = 1, m = 0, mi = 0, tNext = 0, iv = 0;
  let graine = 12345; const alea = () => { graine = (graine * 1664525 + 1013904223) >>> 0; return graine / 4294967296; };
  const mes = 240 / MORCEAU.bpm, NI = MORCEAU.intro || 0;
  const ce = document.getElementById('ce'), play = document.getElementById('play'), jg = document.getElementById('speed'), mot = document.getElementById('mot');
  const maj = () => { mot.textContent = 'Moteur ' + p + ' / 30'; ce.textContent = iv && mi < NI ? 'Intro · ' + MORCEAU.introTxt + ' (puis moteur ' + p + ')' : 'Moteur ' + p + ' · ' + MORCEAU.paliers[p - 1]; };
  jg.addEventListener('input', () => { p = Math.max(1, Math.min(30, 1 + Math.round(+jg.value / 100 * 29))); maj(); });
  play.onclick = () => {
    if (iv) { clearInterval(iv); iv = 0; ctx.close(); ctx = null; play.textContent = 'PLAY'; maj(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)(); kit = MORCEAU.preparer(ctx, ctx.destination, alea);
    m = 0; mi = 0; tNext = ctx.currentTime + 0.1; play.textContent = 'STOP';
    iv = setInterval(() => { while (tNext < ctx.currentTime + 0.4) {
      if (mi < NI) MORCEAU.jouer(ctx, kit, 0, tNext, mi++, 1, alea); else MORCEAU.jouer(ctx, kit, p, tNext, m++, 1, alea);
      tNext += mes; } maj(); }, 60);
  };
  maj();
})();
</script>
