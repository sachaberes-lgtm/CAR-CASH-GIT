<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flamme de tonnerre — 30 paliers</title>
<style>

@media (prefers-color-scheme:dark){:root{--fond:#0b090d;--tx:#f2f0f7;--tx2:#9a94a8;--fil:#2a2633;--acc:#21c48a}}

</style></head><body>
<div class="boite">
  <div><h1>FLAMME DE TONNERRE · 30 PALIERS</h1><div class="sous">écrit à la main, sans le générateur · 134 BPM · ré hirajoshi · taiko électro : le tonnerre de tambours, le luth pincé, la flûte de bambou — en 30 moteurs</div></div>
  <div class="rang"><button id="play">PLAY</button><div class="pals"><div id="mot">Moteur 1 / 30</div><input type="range" id="speed" min="0" max="100" step="any" value="0" aria-label="Moteur"></div></div>
  <div id="ce"></div>
</div>

<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     (2026-11-02, pôle SON ; Léo : « refonte totale de FLAMME DE TONNERRE » — l'ancienne était du synthwave, un genre déjà pris plusieurs fois).
     TAIKO ÉLECTRO : un tonnerre de tambours (le grand tambour odaiko, le petit shime, le bois claqué, les cloches de feu) sur une basse COURTE et propre ; un LUTH pincé (shamisen / koto) fait le moteur de rythme
     (clairsemé au moteur 1, en doubles croches dès 7, un contre-chant en trois contre quatre dès 13) dans la gamme HIRAJOSHI (ré mi fa la si♭) ; la FLÛTE DE BAMBOU chante le thème dès 9 ; des chœurs graves tiennent l'harmonie.
     Le moteur 1 (le lobby du jeu : filtre fermé, grande salle) est déjà un lieu : les chœurs, un luth qui compte, un tambour qui bat comme un cœur, une cloche très haut toutes les 4 mesures.
     La batterie part en demi-temps et ÉCLATE au 15 (grand tambour à chaque temps, bois au 2 et au 4, luth à l'octave). De 20 à 30 : le gong, un grondement d'orage et des braises qui crépitent (l'atmosphère), l'ERHU qui chante
     par-dessus (22), les chœurs « ah » (23), les cors de guerre (26), le climax (27), le tambour qui s'emballe (28), les étoiles de cloche (29), la flûte à l'octave (30).
     Basses : un sous qui claque et retombe en 0,3 s, jamais de 808 qui traîne ; un creux à 280 Hz et un autre à 3,2 kHz sur la sortie. Rien du générateur ici.
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 134, SD = 60 / BPM / 4, MES = 16 * SD;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // LA GRILLE (ré, gamme HIRAJOSHI : ré mi fa la si♭ — la gamme des cordes de koto, sans note d'« eurobeat »), une phrase de 8 mesures :
  // Dm9 · Dm9 · Si♭maj7 · Si♭maj7 · Dm/fa · Dm/fa · Lasus4 · Lasus4 — l'accord de la dominante ne se résout pas : il rebondit sur le ré, comme un coup de tambour
  const ROOTS = [38, 38, 46, 46, 41, 41, 45, 45];
  const CHORDS = [[50, 57, 62, 65, 69], [50, 57, 62, 65, 69], [58, 62, 65, 69, 74], [58, 62, 65, 69, 74], [53, 57, 62, 65, 69], [53, 57, 62, 65, 69], [57, 62, 64, 69, 76], [57, 62, 64, 69, 76]];
  // LE LUTH (shamisen / koto) : le MOTEUR DE RYTHME. 16 doubles croches, des rangs dans l'accord (0-4) ; dès 13, un second motif de TROIS contre quatre
  const SEQ = [0, 2, 3, 2, 1, 3, 4, 3, 2, 3, 4, 3, 1, 2, 3, 2], SEQB = [4, 3, 2, 1, 4, 3, 2, 3, 4, 2, 3, 1, 0, 1, 2, 3], SEQ3 = [4, 2, 3], SEQ3B = [3, 1, 4];
  // LE THÈME (la flûte de bambou, shakuhachi) : [pas sur 128, note, durée] — de longues notes qui respirent, une question et sa réponse
  const THEME = [[0, 74, 8], [8, 77, 4], [12, 76, 4], [16, 74, 6], [22, 69, 2], [24, 69, 8],
    [32, 77, 8], [40, 74, 4], [44, 70, 4], [48, 69, 8], [56, 70, 4], [60, 74, 4],
    [64, 77, 6], [70, 76, 2], [72, 74, 8], [80, 69, 4], [84, 74, 4], [88, 77, 8],
    [96, 81, 8], [104, 76, 4], [108, 74, 4], [112, 76, 6], [118, 74, 2], [120, 69, 8]];
  // LE LEAD (l'erhu, vièle chinoise), dès 22 : des notes longues une octave au-dessus, toutes dans l'accord ; il glisse vers chaque note — il chante par-dessus la flûte sans la gêner
  const LEAD3 = [[0, 81, 12], [12, 77, 4], [16, 81, 8], [24, 86, 8], [32, 82, 12], [44, 81, 4], [48, 77, 8], [56, 81, 8], [64, 81, 12], [76, 77, 4], [80, 86, 8], [88, 81, 8],
    [96, 88, 8], [104, 86, 8], [112, 88, 6], [118, 86, 2], [120, 81, 8]];
  const PERC = ['..H...L...H..L..', '...H..L..H...L.H', '..H.L...H..H..L.', '.H..L..H..L.H...'];

  const QUAND = { luth: 1, nappe: 1, kick: 1, bois: 2, hats: 2, shime: 4, shaker: 5, sub: 6, pleine: 7, rolls: 8, lead: 9, voix: 10, perc: 11, large: 12, contre: 13, toms: 14, drive: 15, riser: 16,
    lead2: 17, basseMid: 18, cloche: 19, crash: 20, orage: 20, ouverts: 21, hats16: 22, lead3: 22, echos: 23, roule: 24, braise: 24, lead3b: 25, cor: 26, climax: 27, final: 28, etoiles: 29, octave: 30 };
  const ENTRE = { 1: 'Le tonnerre au loin : les chœurs graves, le luth pincé qui compte, un grand tambour qui bat comme un cœur. Une basse courte, jamais de grondement.', 2: '+ le charley, le bois frappé en fin de mesure, le second coup de tambour, le luth à cinq coups', 3: '+ le luth en croches',
    4: '+ le petit tambour (shime) qui syncope', 5: '+ le shaker', 6: '+ la sous-basse courte', 7: '+ le luth en doubles croches', 8: '+ les roulements du petit tambour', 9: 'LA FLÛTE DE BAMBOU : le thème entre',
    10: '+ le chœur « ah » qui s’élève', 11: '+ les tambours à main en 3-3-2', 12: 'Les chœurs graves s’élargissent', 13: '+ le contre-chant du luth, trois contre quatre', 14: '+ les grands tambours en fin de phrase',
    15: 'LE TONNERRE ÉCLATE : le grand tambour à chaque temps, le bois claque au 2 et au 4, le luth à l’octave', 16: '+ la montée de fin de phrase', 17: '+ la seconde flûte (une quarte en dessous)', 18: '+ la basse mordante, courte',
    19: '+ les cloches de feu frappées', 20: '+ le gong à chaque phrase, un grondement d’orage qui monte', 21: '+ les charleys ouverts', 22: 'LE LEAD : l’erhu chante par-dessus (notes longues, qui glissent), + les charleys en doubles croches',
    23: '+ les échos, les chœurs « ah » à pleine voix', 24: '+ les roulements de caisse, les braises qui crépitent', 25: '+ l’erhu à deux voix', 26: '+ les cors de guerre', 27: 'LE CLIMAX : tout frappé, le gong toutes les 4 mesures',
    28: 'Le final : le grand tambour s’emballe', 29: '+ les étoiles de cloche dans la salle', 30: 'La flûte monte d’une octave.' };
  const PALIERS30 = Array.from({ length: 30 }, (_, k) => ENTRE[k + 1] || (k < 14 ? 'Le luth s’ouvre d’un cran.' : 'Tout pousse d’un cran : plus fort, plus serré.'));
  const BASE = { luth: .6, nappe: .5, kick: .78, hats: .24, bois: .46, shaker: .24, shime: .38, sub: .28, basseMid: .28, lead: .46, lead2: .3, voix: .3, ouverts: .22, perc: .4, toms: .5, riser: .32, cloche: .38, crash: .38, ride: .18, caisse: .42, cor: .36,
    contre: .3, lead3: .46, lead3b: .28, orage: .2, braise: .2, etoiles: .2 };
  const niv = (id, p) => { const e = id === 'caisse' ? QUAND.roule : id === 'ride' ? QUAND.hats16 : id === 'lead2' ? QUAND.lead2 : (QUAND[id] || 1); if (p < e) return 0; const r = Math.min(1, (p - e) / 6), g = .72 + .28 * (p - 1) / 29; const bascule = p >= QUAND.drive ? (id === 'kick' ? 1.1 : (id === 'bois' || id === 'shime' || id === 'toms' || id === 'caisse') ? 1.4 : 1) : 1;   // LA BASCULE DU 15 : le bois et les petits tambours passent d'un cran (le grand tambour à peine : le grave est tenu)
    return (BASE[id] || .3) * (.82 + .18 * r) * g * bascule; };
  const FILTRE_LUTH = p => Math.min(5000, 850 * Math.pow(1.075, p - 1));      // la brillance du luth monte avec le moteur
  const FILTRE_PAD = p => Math.min(3800, 600 * Math.pow(1.08, p - 1));
  const POMPE = p => p < QUAND.drive ? .82 : Math.max(.46, .76 - .02 * (p - QUAND.drive));

  function preparer(ctx, sortie, alea) {
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
    const courbe = k => { const c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; };
    const impulsion = (len, dec, lp) => { const n = Math.floor(ctx.sampleRate * len), b = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let y = 0; const a = Math.exp(-2 * Math.PI * lp / ctx.sampleRate);
        for (let i = 0; i < n; i++) { y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.pow(1 - i / n, dec); } } return b; };
    const master = G(.5), chaud = ctx.createWaveShaper(); chaud.curve = courbe(1.1); chaud.oversample = '2x';
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 2; comp.attack.value = .015; comp.release.value = .2;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -3; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1; lim.knee.value = 0;
    // le grave est tenu : passe-haut à 38 Hz, un creux dans la boue 280 Hz (les basses d'avant fatiguaient), un léger creux dans l'arête 3 kHz
    const boue = F('peaking', 280, .9); boue.gain.value = -3; const arete = F('peaking', 3200, .9); arete.gain.value = -1.5;
    chaine(master, F('highpass', 38, .7), boue, arete, chaud, comp, lim, sortie);
    const salle = ctx.createConvolver(); salle.buffer = impulsion(3, 2.3, 2800); const envoiSalle = G(1); chaine(envoiSalle, salle, F('highpass', 260, .7), G(.3), master);
    const dG = ctx.createDelay(2), dD = ctx.createDelay(2); dG.delayTime.value = SD * 3; dD.delayTime.value = SD * 3;
    const fb = G(.36), echoIn = G(1), echoSort = G(0), pG = ctx.createStereoPanner(), pD = ctx.createStereoPanner(); pG.pan.value = -.7; pD.pan.value = .7;
    chaine(echoIn, F('lowpass', 4000, .7), F('highpass', 320, .7), dG); dG.connect(dD); dD.connect(fb); fb.connect(dG); dG.connect(pG); dD.connect(pD); pG.connect(echoSort); pD.connect(echoSort); echoSort.connect(master); echoSort.connect(envoiSalle);
    const pompe = G(1); pompe.connect(master);
    const ids = ['luth', 'contre', 'nappe', 'kick', 'hats', 'shaker', 'bois', 'shime', 'sub', 'basseMid', 'lead', 'lead2', 'voix', 'ouverts', 'perc', 'toms', 'riser', 'cloche', 'crash', 'ride', 'caisse', 'cor', 'lead3', 'lead3b', 'orage', 'braise', 'etoiles'], bus = {};
    ids.forEach(id => bus[id] = G(0));
    ['nappe', 'voix', 'cloche', 'cor'].forEach(id => bus[id].connect(pompe));
    ids.filter(id => !['nappe', 'voix', 'cloche', 'cor'].includes(id)).forEach(id => bus[id].connect(master));
    const envoi = (id, v) => { const g = G(v); bus[id].connect(g); g.connect(envoiSalle); };
    envoi('nappe', .45); envoi('luth', .16); envoi('contre', .2); envoi('lead', .4); envoi('lead2', .4); envoi('voix', .6); envoi('bois', .45); envoi('caisse', .4); envoi('perc', .3); envoi('shime', .22); envoi('toms', .3);
    envoi('cloche', .75); envoi('cor', .3); envoi('lead3', .5); envoi('lead3b', .5); envoi('etoiles', .9); envoi('orage', .4); envoi('braise', .2);
    { const g = G(.45); bus.luth.connect(g); g.connect(echoIn); const g2 = G(.5); bus.lead.connect(g2); g2.connect(echoIn); const g3 = G(.4); bus.contre.connect(g3); g3.connect(echoIn); const g4 = G(.32); bus.lead3.connect(g4); g4.connect(echoIn); }
    const filtrePad = F('lowpass', 600, .7); filtrePad.connect(bus.nappe);
    const kickSat = ctx.createWaveShaper(); kickSat.curve = courbe(1.4); kickSat.connect(bus.kick);
    const bruit = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); { const d = bruit.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = alea() * 2 - 1; }
    return { bus, pompe, filtrePad, kickSat, echoSort, bruit, master };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    p = Math.max(1, Math.min(30, p | 0));
    const b = kit.bus, A = id => p >= QUAND[id];
    for (const id in b) b[id].gain.setValueAtTime(niv(id, p), t0);
    kit.master.gain.setTargetAtTime(.56 + .5 * Math.pow((p - 1) / 29, 1.2), t0, .5);
    kit.filtrePad.frequency.setTargetAtTime(FILTRE_PAD(p), t0, .4); kit.echoSort.gain.setValueAtTime(A('echos') ? .5 : 0, t0);
    const osc = (type, f, dt) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; if (dt) o.detune.value = dt; return o; };
    const filt = (type, f, q) => { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };
    const gain = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const env = (g, t, pic, a, dur) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, pic), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); };
    /* (2026-11-03, audit du palier 30) UN filtre par (sortie, type, fréquence, Q), partagé par tous les coups de bruit : le coup passe dans son gain PUIS dans le filtre (même son, des centaines de filtres de moins par phrase) */
    const filtreBruit = (dest, type, f, q) => { const W = kit.fb || (kit.fb = new WeakMap()); let M = W.get(dest); if (!M) W.set(dest, M = {}); const k = type + f + '/' + q; if (!M[k]) { M[k] = filt(type, f, q); M[k].connect(dest); } return M[k]; };
    const bruit = (t, dest, type, f, q, pic, dur) => { const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = kit.bruit; env(g, t, pic, .002, dur);
      s.connect(g); g.connect(filtreBruit(dest, type, f, q)); s.start(t, alea() * 1.2); s.stop(t + dur + .02); };

    // ---- les instruments ----
    // le LUTH pincé (shamisen / koto) : deux triangles désaccordés + une pointe de scie (le « sawari », le bourdonnement de la corde) dans un filtre qui claque ouvert puis retombe ; la corde est « tirée » : elle part 2 % trop haut et tombe sur sa note
    const luth = (t, midi, v, dest) => { const f = mtof(midi), x = filt('lowpass', 1000, 2.2), g = ctx.createGain(), top = Math.min(6500, FILTRE_LUTH(p) * 2.2);
      x.frequency.setValueAtTime(top, t); x.frequency.exponentialRampToValueAtTime(Math.max(420, top * .18), t + .16); env(g, t, v, .002, .34);
      [['triangle', -5, 1], ['triangle', 5, .9], ['sawtooth', 0, .22], ['sine', 1200, .3]].forEach(([ty, dt, gv], k) => { const o = osc(ty, k === 3 ? f * 2 : f, k === 3 ? 0 : dt), gg = ctx.createGain(); gg.gain.value = gv; o.frequency.setValueAtTime((k === 3 ? f * 2 : f) * 1.02, t); o.frequency.exponentialRampToValueAtTime(k === 3 ? f * 2 : f, t + .025); o.connect(gg); gg.connect(x); o.start(t); o.stop(t + .38); });
      x.connect(g); g.connect(dest); };
    /* (2026-11-03, audit du palier 30) les deux chœurs : 2 scies désaccordées par note au lieu de 3 (derrière deux filtres étroits la différence ne s'entend pas ; niveau recalé × √(3/2)) : 35 oscillateurs de moins par mesure */
    // les chœurs graves (« oo ») : deux scies désaccordées par note dans deux formants (300 et 700 Hz), attaque lente
    const nappe = (t, accord, dur) => { const g = ctx.createGain(), v = A('large') ? .092 : .073, f1 = filt('bandpass', 300, 3), f2 = filt('bandpass', 700, 3), mix = gain(2.2); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + 1); g.gain.setValueAtTime(v, t + dur - .2); g.gain.linearRampToValueAtTime(.0001, t + dur + .7);
      const voix = A('large') ? accord.concat(accord[0] + 12) : accord;
      voix.forEach((m, k) => [-8, 8].forEach((dt, j) => { const o = osc('sawtooth', mtof(m), dt), pn = ctx.createStereoPanner(); pn.pan.value = (j * 2 - 1) * (A('large') ? .8 : .5); o.connect(pn); pn.connect(f1); pn.connect(f2); o.start(t); o.stop(t + dur + .8); }));
      f1.connect(mix); f2.connect(mix); mix.connect(g); g.connect(kit.filtrePad); };
    // la FLÛTE DE BAMBOU (shakuhachi) : un sinus + une octave faible, un souffle, une attaque qui glisse (« ou-ï »), un vibrato lent qui arrive tard
    const flute = (t, midi, len, v, dest) => { const dur = SD * len, f = mtof(midi), g = ctx.createGain(), o1 = osc('sine', f), o2 = osc('triangle', f * 2), g2 = gain(.18), lfo = osc('sine', 4.6), lg = gain(0), sx = filt('bandpass', f * 2.2, 1.4), sg = gain(0);
      o1.frequency.setValueAtTime(f * .975, t); o1.frequency.exponentialRampToValueAtTime(f, t + .12);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .09); g.gain.setValueAtTime(v, t + Math.max(.1, dur - .1)); g.gain.linearRampToValueAtTime(.0001, t + dur + .12);
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(10, t + .5); lfo.connect(lg); lg.connect(o1.detune); lg.connect(o2.detune);
      const s = ctx.createBufferSource(); s.buffer = kit.bruit; s.connect(sx); sx.connect(sg); sg.gain.setValueAtTime(.0001, t); sg.gain.linearRampToValueAtTime(v * .22, t + .06); sg.gain.linearRampToValueAtTime(v * .08, t + .3); sg.gain.linearRampToValueAtTime(.0001, t + dur + .1); sg.connect(g); s.start(t, alea() * 1.2); s.stop(t + dur + .15);
      o1.connect(g); o2.connect(g2); g2.connect(g); o1.start(t); o2.start(t); lfo.start(t); o1.stop(t + dur + .15); o2.stop(t + dur + .15); lfo.stop(t + dur + .15); g.connect(dest); };
    // l'ERHU (le lead d'atmosphère) : deux scies dans deux formants (1 100 et 2 400 Hz) + un souffle d'archet, une glissade vers chaque note, un vibrato large après 0,4 s
    const erhu = (t, midi, len, v, dest) => { const dur = SD * len, f = mtof(midi), g = gain(0), lp = filt('lowpass', 3600, .7), a1 = gain(2), a2 = gain(1.3), f1 = filt('bandpass', 1100, 2.5), f2 = filt('bandpass', 2400, 3), lfo = osc('sine', 5.6), lg = gain(0);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .14); g.gain.setValueAtTime(v, t + Math.max(.16, dur - .14)); g.gain.linearRampToValueAtTime(.0001, t + dur + .18);
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(18, t + .45); lfo.connect(lg);
      [-5, 5].forEach(dt => { const o = osc('sawtooth', f, dt); o.frequency.setValueAtTime(f * .94, t); o.frequency.exponentialRampToValueAtTime(f, t + .14); lg.connect(o.detune); o.connect(f1); o.connect(f2); o.start(t); o.stop(t + dur + .22); });
      f1.connect(a1); f2.connect(a2); a1.connect(lp); a2.connect(lp); lp.connect(g); g.connect(dest); lfo.start(t); lfo.stop(t + dur + .22);
      bruit(t, dest, 'bandpass', 3200, 1.2, v * .25, Math.min(dur, .5)); };
    const dessous = (m, accord) => { const pcs = accord.map(x => x % 12); for (const d of [5, 4, 3, 7]) if (pcs.indexOf(((m - d) % 12 + 12) % 12) >= 0) return m - d; return m - 5; };
    // le chœur « ah » : plus haut, plus ouvert (formants 700 et 1 200 Hz), très large
    const voix = (t, accord, dur) => { const g = gain(0), v = A('lead3b') ? .071 : .056, f1 = filt('bandpass', 700, 3.5), f2 = filt('bandpass', 1200, 3.5), mix = gain(2.2);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + 1.2); g.gain.setValueAtTime(v, t + dur - .3); g.gain.linearRampToValueAtTime(.0001, t + dur + .8);
      accord.slice(1, A('echos') ? 5 : 4).forEach((m, k) => [-8, 8].forEach((dt, j) => { const o = osc('sawtooth', mtof(m + 12), dt), pn = ctx.createStereoPanner(); pn.pan.value = ((k + j) % 3 - 1) * .85; o.connect(pn); pn.connect(f1); pn.connect(f2); o.start(t); o.stop(t + dur + .9); }));
      f1.connect(mix); f2.connect(mix); mix.connect(g); g.connect(b.voix); };
    // la basse : COURTE. Un sous qui claque et retombe en 0,3 s ; la « mordante » est une scie filtrée, courte aussi
    const sub = (t, midi, v) => { const o = osc('sine', mtof(midi)), g = ctx.createGain(); env(g, t, v, .006, .3); o.connect(g); g.connect(b.sub); o.start(t); o.stop(t + .32); };
    const mord = (t, midi, v) => { const o = osc('sawtooth', mtof(midi + 12)), x = filt('lowpass', 850, 2), g = ctx.createGain(); x.frequency.setValueAtTime(850, t); x.frequency.exponentialRampToValueAtTime(260, t + .14);
      env(g, t, v, .004, .16); o.connect(x); x.connect(g); g.connect(b.basseMid); o.start(t); o.stop(t + .18); };
    // le GRAND TAMBOUR (odaiko) : un corps de sinus qui tombe de 130 à 46 Hz, la peau en bruit filtré, la sortie légèrement saturée ; il pompe les chœurs
    const kick = (t, v) => { const o = osc('sine', 130), g = ctx.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(48, t + .08);
      env(g, t, .9 * (v || 1), .002, .3); o.connect(g); g.connect(kit.kickSat); o.start(t); o.stop(t + .32); bruit(t, b.kick, 'bandpass', 900, 1, .12 * (v || 1), .05);
      if (p >= 6) { kit.pompe.gain.setValueAtTime(POMPE(p), t); kit.pompe.gain.linearRampToValueAtTime(1, t + SD * 3.4); } };
    // le PETIT TAMBOUR (shime) : sec, haut, une peau tendue
    const shime = (t, v) => { const o = osc('sine', 310), g = ctx.createGain(); o.frequency.setValueAtTime(310, t); o.frequency.exponentialRampToValueAtTime(215, t + .05); env(g, t, .5 * v, .002, .13); o.connect(g); g.connect(b.shime); o.start(t); o.stop(t + .15); bruit(t, b.shime, 'bandpass', 2600, 1.5, .18 * v, .03); };
    // le BOIS (la claquette) : deux claquements de bois (2 100 et 1 500 Hz) + une pointe de triangle
    const bois = (t, v) => { bruit(t, b.bois, 'bandpass', 2100, 2.5, 1.1 * v, .03); bruit(t + .013, b.bois, 'bandpass', 1500, 2, .8 * v, .06); const o = osc('triangle', 700), g = ctx.createGain(); o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(480, t + .05); env(g, t, .3 * v, .002, .07); o.connect(g); g.connect(b.bois); o.start(t); o.stop(t + .09); };
    const caisse = (t, v) => { bruit(t, b.caisse, 'bandpass', 2000, 1, v, .13); const o = osc('triangle', 200), g = ctx.createGain(); env(g, t, v * .5, .002, .1); o.connect(g); g.connect(b.caisse); o.start(t); o.stop(t + .12); };
    const tom = (t, f0) => { const o = osc('sine', f0), g = ctx.createGain(); o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * .55, t + .2); env(g, t, .7, .003, .27); o.connect(g); g.connect(b.toms); o.start(t); o.stop(t + .29); bruit(t, b.toms, 'bandpass', 900, 1, .1, .04); };
    const perc = (t, haut) => { const o = osc('sine', haut ? 340 : 240), g = ctx.createGain(); o.frequency.setValueAtTime(haut ? 340 : 240, t); o.frequency.exponentialRampToValueAtTime(haut ? 295 : 195, t + .1); env(g, t, .55, .002, .15); o.connect(g); g.connect(b.perc); o.start(t); o.stop(t + .17); bruit(t, b.perc, 'bandpass', haut ? 2400 : 1500, 2, .14, .02); };
    const souffle = (t, dur) => { const s = ctx.createBufferSource(), x = filt('bandpass', 500, .9), g = ctx.createGain(); s.buffer = kit.bruit;
      x.frequency.setValueAtTime(400, t); x.frequency.exponentialRampToValueAtTime(7000, t + dur); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + dur); g.gain.setValueAtTime(.0001, t + dur + .01);
      s.connect(x); x.connect(g); g.connect(b.riser); s.start(t, alea()); s.stop(t + dur + .02); };
    // la CLOCHE DE FEU : un son de cloche (sinus + partiel inharmonique 2,76) qui dure ; frappée en accord (19+), ou seule très haut (les étoiles)
    const cloche = (t, midi, v, dest, long) => { const f = mtof(midi), o = osc('sine', f), o2 = osc('sine', f * 2.76), g = ctx.createGain(), g2 = ctx.createGain(); env(g, t, v, .003, long || 1.4); env(g2, t, v * .35, .002, .5); o.connect(g); o2.connect(g2); g.connect(dest); g2.connect(dest); o.start(t); o2.start(t); o.stop(t + (long || 1.4) + .05); o2.stop(t + .55); };
    const cor = (t, accord, dur) => { const g = ctx.createGain(), x = filt('lowpass', 700, 1.1); x.frequency.setValueAtTime(700, t); x.frequency.linearRampToValueAtTime(2600, t + .14); x.frequency.linearRampToValueAtTime(1500, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.07, t + .04); g.gain.setValueAtTime(.07, t + Math.max(.06, dur - .08)); g.gain.linearRampToValueAtTime(.0001, t + dur + .06);
      accord.slice(1, 4).forEach(m => [-6, 6].forEach(dt => { const o = osc('sawtooth', mtof(m + 12), dt); o.connect(x); o.start(t); o.stop(t + dur + .1); })); x.connect(g); g.connect(b.cor); };
    // le grondement d'orage : du bruit filtré dans le MÉDIUM-GRAVE (150-420 Hz, pas plus bas : le grave est tenu) qui monte sur une mesure et retombe
    const orage = (t, dur) => { const s = ctx.createBufferSource(), x = filt('bandpass', 180, .8), g = gain(0); s.buffer = kit.bruit; x.frequency.setValueAtTime(180, t); x.frequency.exponentialRampToValueAtTime(420, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.5, t + dur * .85); g.gain.exponentialRampToValueAtTime(.0001, t + dur + .9); s.connect(x); x.connect(g); g.connect(b.orage); s.start(t, alea()); s.stop(t + dur + .95); };
    // les braises : de minuscules claquements aigus qui crépitent
    const braise = (t, v) => bruit(t, b.braise, 'highpass', 5500, .7, v, .01);

    // ---- les mesures ----
    for (let m = m0; m < m0 + n; m++) {
      const tm = t0 + (m - m0) * MES, bar = m % 8, ph = Math.floor(m / 8) % 4, accord = CHORDS[bar], root = ROOTS[bar], seq = (ph % 2 ? SEQB : SEQ);
      nappe(tm, accord, MES);
      if (A('crash') && bar === 0) { bruit(tm, b.crash, 'bandpass', 3800, .6, .35, 1.9); cloche(tm, 62, .1, b.crash, 2.2); }
      if (A('climax') && bar === 4) bruit(tm, b.crash, 'bandpass', 3800, .6, .3, 1.6);
      if (A('riser') && bar === 7) souffle(tm + MES - SD * 8, SD * 8);
      if (A('orage') && (bar === 3 || bar === 7)) orage(tm, MES);
      if (A('voix') && bar % 2 === 0) voix(tm, accord, MES * 2);
      if (!A('lead') && bar % 4 === 0) cloche(tm, 86 + (bar ? 3 : 0), .05, b.etoiles, 2.4);   // le tonnerre au loin : une cloche de feu, très haut, toutes les quatre mesures
      if (A('lead')) THEME.forEach(([st, nt, ln]) => { if (Math.floor(st / 16) !== bar) return; const haut = A('octave') ? 12 : 0, plus = (ph % 2 && nt >= 76) ? 2 : 0, t = tm + (st % 16) * SD;
        flute(t, nt + plus + haut, ln, .085, b.lead);
        if (A('lead2')) flute(t, dessous(nt + plus + haut, accord), ln, .055, b.lead2); });
      if (A('lead3')) LEAD3.forEach(([st, nt, ln]) => { if (Math.floor(st / 16) !== bar) return; const t = tm + (st % 16) * SD;
        erhu(t, nt, ln, .08, b.lead3); if (A('lead3b')) erhu(t, dessous(nt, accord), ln, .055, b.lead3b); });
      for (let i = 0; i < 16; i++) {
        const t = tm + i * SD, tt = t + (i % 2 ? SD * .04 : 0), k = seq[i];
        // — le luth : la pulsation (clairsemée au départ, pleine dès 7) ; le contre-chant en trois contre quatre ; à l'octave dès 15
        const dense = A('pleine') ? true : p >= 3 ? i % 2 === 0 : p === 2 ? (i % 4 === 0 || i === 6 || i === 10) : (i === 0 || i === 6 || i === 10);
        if (dense) { const v = (i % 4 === 0 ? 1 : i % 2 === 0 ? .72 : .5) * (p < 3 ? .9 : 1); luth(tt, accord[k] + 12, v, b.luth); if (A('drive') && i % 4 === 0) luth(tt, accord[k] + 24, v * .5, b.luth); }
        if (A('contre') && i % 3 === 0) luth(t, accord[(m * 16 + i) % 3 === 0 ? 4 : SEQ3[(m * 16 + i) % 3]] + 24, .4, b.contre);
        // — la basse : courte
        if (A('sub') && (i === 0 || (i === 10 && bar % 2 === 1))) sub(t, root, i === 0 ? .55 : .4);
        if (A('basseMid') && (i === 0 || i === 7 || (i === 14 && bar % 2 === 1))) mord(t, root, i === 0 ? .6 : .45);
        // — le grand tambour : le cœur (0, 10) au départ ; à chaque temps dès 15
        if (A('drive') ? i % 4 === 0 : (i === 0 || (p >= 2 && i === 10) || (p >= 8 && i === 7 && bar % 2 === 0))) kick(t, i === 0 ? 1 : .8);
        if (p >= 23 && i === 14 && bar % 2 === 1) kick(t, .8);
        // — les frappes : le bois (en fin de mesure d'abord, au 3 ensuite, au 2 et au 4 dès 15), le petit tambour qui syncope
        if (A('bois')) { if (A('drive')) { if (i === 4 || i === 12) bois(t, 1); } else if (p >= 4 ? i === 8 : i === 12) bois(t, p >= 4 ? 1 : .6); }
        if (A('shime')) { const c = ['..........x..x..', '...x......x.....', '.......x..x..x..', '...x...x........'][ph % 4][i]; if (c === 'x') shime(tt, .9); }
        if (A('hats') && i % 2 === 0 && !A('hats16')) bruit(tt, b.hats, 'highpass', 9500, .7, i % 4 === 2 ? .42 : .24, .025);
        if (A('hats16')) bruit(tt, b.hats, 'highpass', 9500, .7, i % 4 === 2 ? .5 : i % 2 ? .2 : .3, .025);
        if (A('rolls') && bar % 2 === 1 && i >= 12) shime(t + (i % 2) * SD * .5, .45 + .08 * (i - 12));
        if (A('shaker') && i % 2 === 1) bruit(tt, b.shaker, 'bandpass', 6800, 1.4, .28, .05);
        if (A('ouverts') && i % 8 === 6) bruit(tt, b.ouverts, 'highpass', 7200, .7, .48, .2);
        if (A('perc')) { const c = PERC[ph % 4][i]; if (c === 'H' || c === 'L') perc(tt, c === 'H'); }
        if (A('cloche') && (i === 3 || i === 6 || i === 11 || (A('climax') && (i === 14 || i === 2)))) { cloche(tt, accord[1] + 24, .07, b.cloche, .9); cloche(tt, accord[3] + 24, .055, b.cloche, .9); }
        if (A('cor') && (i === 0 || (A('climax') && i === 8))) cor(t, accord, SD * (i === 0 ? 3 : 2));
        if (A('ride') && A('hats16') && i % 4 === 0) bruit(t, b.ride, 'bandpass', 8000, 2, .45, .35);
        if (A('toms') && (bar === 3 || bar === 7) && i >= 12) tom(t, [190, 155, 125, 100][i - 12]);
        if (A('roule') && bar === 7 && i >= 8) caisse(t, .15 + .05 * (i - 8));
        if (A('final') && bar === 7 && i >= 8 && i % 2 === 0 && i % 4 !== 0) kick(t, .85);
        if (A('braise')) { const hz = Math.sin((m * 16 + i + 1) * 78.233) * 43758.5453, h = hz - Math.floor(hz); if (h < .35) braise(t + h * SD, .25 + h * .5); }
        if (A('etoiles') && (i === 2 || i === 6 || i === 11 || i === 14)) { const hz = Math.sin((m * 16 + i + 1) * 12.9898) * 43758.5453, h = hz - Math.floor(hz); if (h < .42) cloche(t, accord[Math.floor(h * 100) % 5] + 36 + (h < .2 ? 12 : 0), .1, b.etoiles, 1.2); }
      }
    }
  }

  return {
    titre: 'FLAMME DE TONNERRE', bpm: BPM, mesures: 8, intro: 0, pas: 0.6, moteurs: Array(30).fill(1), ton: 'ré hirajoshi', auteur: 'Claude Code (pôle SON), écrit à la main pour Léo',
    style: 'taiko électro : tonnerre de tambours, luth pincé, flûte de bambou', introTxt: '', paliers: PALIERS30, preparer, jouer };
})();
</script>

<!-- ======================= L'ÉCOUTE (libre : ce que voit celui qui ouvre le fichier) ======================= -->
<script>
(function () {
  let ctx = null, kit = null, p = 1, m = 0, tNext = 0, iv = 0;
  let graine = 48300; const alea = () => { graine = (graine * 1664525 + 1013904223) >>> 0; return graine / 4294967296; };
  const mes = 240 / MORCEAU.bpm;
  const ce = document.getElementById('ce'), play = document.getElementById('play'), jg = document.getElementById('speed'), mot = document.getElementById('mot');
  const maj = () => { mot.textContent = 'Moteur ' + p + ' / 30'; ce.textContent = 'Moteur ' + p + ' · ' + MORCEAU.paliers[p - 1]; };
  jg.addEventListener('input', () => { p = Math.max(1, Math.min(30, 1 + Math.round(+jg.value / 100 * 29))); maj(); });
  play.onclick = () => {
    if (iv) { clearInterval(iv); iv = 0; ctx.close(); ctx = null; play.textContent = 'PLAY'; maj(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)(); kit = MORCEAU.preparer(ctx, ctx.destination, alea);
    m = 0; tNext = ctx.currentTime + 0.1; play.textContent = 'STOP';
    iv = setInterval(() => { while (tNext < ctx.currentTime + 0.4) { MORCEAU.jouer(ctx, kit, p, tNext, m++, 1, alea); tNext += mes; } maj(); }, 60);
  };
  maj();
})();
</script>
