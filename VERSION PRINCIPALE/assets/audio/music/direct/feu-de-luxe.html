<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     (2026-11-03, pôle SON ; Léo : « une version premium de toutes les musiques du jeu, nouvelle DA, sans perdre l'identité » ; avant lui : le disco funk du générateur « BOULE À FACETTES »).
     LE DISCO FUNK DE LUXE : le tempo à 116, une grille de HUIT accords qui voyagent (Amaj9 · Dmaj9 · C#m7 · F#m9 · Bm9 · E9 · Amaj7 · E7sus) puis une seconde qui revient par le sol9 (F#m9 · Bm9 · E9 · Amaj9 · Dmaj9 · G9 · C#m7 · E9) :
     seize mesures avant que la boucle se referme, et deux mélodies de cuivres qui ne se ressemblent pas. Le CLAVINET gratte les accords en doubles croches, la BASSE SLAP est courte (elle claque, elle s'éteint en 0,15 s),
     les CORDES DISCO filent en gammes (un seul oscillateur dont la hauteur saute de marche en marche, pas dix notes), les CUIVRES LASER (deux scies qui montent vers la note, un filtre qui s'ouvre en « ouah », une chute en fin de note) chantent le thème,
     et la BOULE À FACETTES jette des étincelles de cristal tout au long du morceau.
     Le moteur 1 est le LOBBY : cordes chaudes, clavinet doux qui laisse tomber deux accords, un cœur de grosse caisse, shaker, étincelles — calme, jamais pauvre. Dès 5 le quatre-sur-le-temps, dès 10 le charley ouvert sur les contretemps,
     dès 13 les cuivres frappent, au 15 ÇA DÉCOLLE (basse funky, caisse claire fantôme, ligne de violon, la coupure de la dernière mesure), dès 16 le thème, au 20-30 l'intensité (cymbale, cloche à vache, sifflet, harmonie de cuivres, toms, roulement, final).
     Rien du générateur ici. Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 116, SD = 60 / BPM / 4, MES = 16 * SD;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // LES DEUX GRILLES (la majeur) : seize mesures, un accord par mesure. Basses (graves) et accords (médium, sans fondamentale : la basse la joue).
  const ROOTS = [45, 50, 49, 42, 47, 52, 45, 52, 42, 47, 52, 45, 50, 43, 49, 52];
  const MIN = [0, 0, 1, 1, 1, 0, 0, 0, 1, 1, 0, 0, 0, 0, 1, 0];   // 1 : accord mineur (la septième est mineure)
  const CHORDS = [[57, 61, 64, 68, 71], [57, 61, 64, 66, 69], [56, 59, 61, 64, 68], [57, 61, 64, 66, 68], [57, 61, 62, 66, 71], [56, 59, 62, 66, 68], [57, 61, 64, 68, 73], [57, 59, 62, 64, 69],
    [57, 61, 64, 66, 68], [57, 61, 62, 66, 71], [56, 59, 62, 66, 68], [57, 61, 64, 68, 71], [57, 61, 64, 66, 69], [59, 62, 65, 67, 69], [56, 59, 61, 64, 68], [56, 59, 62, 66, 68]];
  // LES DEUX THÈMES DES CUIVRES : [pas sur 256, note, durée en doubles croches] — le premier sourit (grille 1), le second descend et chante (grille 2, le sol9 y met sa couleur)
  const THEME = [[0, 76, 2], [3, 81, 1], [4, 80, 2], [7, 76, 1], [8, 73, 4],
    [16, 78, 2], [19, 81, 1], [20, 78, 2], [24, 74, 2], [26, 78, 2], [28, 76, 4],

    [80, 80, 2], [83, 83, 1], [84, 86, 3], [88, 83, 2], [90, 80, 2], [92, 78, 2], [94, 76, 2],

    [128, 85, 3], [132, 83, 1], [133, 81, 3], [136, 78, 2], [138, 76, 2], [140, 78, 4],
    [144, 83, 2], [147, 81, 1], [148, 78, 2], [152, 74, 2], [154, 78, 2], [156, 81, 2], [158, 83, 2],
    [160, 80, 2], [162, 83, 2], [164, 86, 4], [170, 83, 2], [172, 80, 4],
    [176, 85, 2], [179, 81, 1], [180, 83, 2], [184, 81, 2], [186, 80, 2], [188, 76, 4],
    [192, 86, 2], [194, 85, 2], [196, 81, 2], [200, 78, 4], [204, 81, 2], [206, 78, 2],
    [208, 79, 2], [211, 83, 1], [212, 86, 2], [216, 81, 2], [218, 77, 2], [220, 79, 4],
    [224, 80, 2], [226, 83, 2], [228, 85, 4], [234, 80, 2], [236, 76, 4],
    [240, 80, 2], [243, 83, 1], [244, 86, 2], [248, 83, 6]];
  // LES MOTIFS DU CLAVINET (16 pas : X plein, x léger, g grattement muet) et de la GUITARE (g grattement, x coup court) — quatre et deux variantes qui tournent
  const CLAV = ['X..xg.x.x.gxg.x.', 'x.gx..X.x..xg.xg', 'X.x.g.xg..X.g.x.', 'x..gx.X.gx.x..Xg'];
  const CLAVS = ['X.......x.......', 'X.......x..x....', 'X.....x.x.......', 'X.......x.....x.'];   // le lobby : peu de coups
  const GUIT = ['..xg..xg..xg..xg', '.g.x.g.xg.x.g.x'];
  const FANT = ['...g.......g...g', '.g.....g...g....', '..g...g.....g..g'];   // caisse claire fantôme
  const CONGA = [[2, 'lo'], [4, 'sl'], [6, 'lo'], [7, 'mu'], [10, 'lo'], [12, 'sl'], [14, 'hi'], [15, 'hi']];
  // LES BASSES : [pas, intervalle, durée en pas, force] ; trois familles (simple, rebond d'octave, funky)
  const BASSES = [
    [[[0, 0, 2, 1], [7, 0, 1, .7], [10, 12, 1, .8]], [[0, 0, 2, 1], [6, 0, 1, .6], [10, 0, 1, .8], [12, 12, 1, .7]]],
    [[[0, 0, 1, 1], [2, 12, 1, .7], [3, 0, 1, .8], [6, 12, 1, .7], [8, 0, 1, 1], [10, 12, 1, .7], [11, 0, 1, .8], [14, 7, 1, .7]], [[0, 0, 1, 1], [2, 12, 1, .7], [4, 0, 1, .8], [7, 12, 1, .7], [8, 0, 1, 1], [10, 7, 1, .7], [12, 0, 1, .8], [14, 12, 1, .7]]],
    [[[0, 0, 1, 1], [3, 0, 1, .6], [4, 12, 1, .8], [6, 0, 1, .7], [8, 0, 1, 1], [10, 12, 1, .8], [11, 7, 1, .6], [13, 0, 1, .7], [14, 10, 1, .7], [15, 12, 1, .7]],
      [[0, 0, 1, 1], [2, 0, 1, .6], [4, 12, 1, .8], [7, 7, 1, .6], [8, 0, 1, 1], [9, 12, 1, .6], [11, 0, 1, .7], [12, 12, 1, .8], [14, 7, 1, .7]],
      [[0, 0, 1, 1], [3, 12, 1, .7], [5, 0, 1, .6], [6, 7, 1, .7], [8, 0, 1, 1], [10, 0, 1, .7], [12, 12, 1, .8], [13, 10, 1, .6], [15, 7, 1, .7]]]];
  const GLINT = [93, 97, 100, 102, 104, 105, 109];   // la boule à facettes (la majeur, très aigu)

  const QUAND = { pad: 1, clavL: 1, coeur: 1, shaker: 1, glint: 1, sub: 1, ouvre: 2, hat: 3, basse: 4, quatre: 5, clap: 6, guitare: 7, basseB: 8, clav: 9, ouvert: 10, tamb: 11, filent: 12, stab: 13, conga: 14,
    decolle: 15, theme: 16, echo: 17, double: 18, glint2: 19, crash: 20, vache: 20, hat16: 21, filent2: 22, sifflet: 23, harmo: 24, toms: 25, fantomes: 26, climax: 27, roule: 28, tutti: 29, octave: 30 };
  const ENTRE = { 1: 'Le lobby : les cordes chaudes, le clavinet qui laisse tomber deux accords, un cœur de grosse caisse, le shaker, les étincelles de la boule à facettes.', 2: '+ les cordes qui s’ouvrent', 3: '+ le charley',
    4: '+ la basse slap, courte', 5: '+ la grosse caisse sur chaque temps', 6: '+ les claps, au 2 et au 4', 7: '+ la guitare qui gratte', 8: '+ la basse rebondit d’octave en octave', 9: '+ le clavinet en doubles croches',
    10: '+ le charley ouvert sur les contretemps', 11: '+ le tambourin', 12: '+ les cordes disco : la gamme qui file en fin de phrase', 13: '+ les cuivres laser : les premiers coups d’accord', 14: '+ les congas',
    15: 'ÇA DÉCOLLE : la basse funky, la caisse claire fantôme, la ligne de violon, et la coupure de la dernière mesure avant que tout revienne', 16: 'LE THÈME : les cuivres laser chantent', 17: '+ l’écho sur les cuivres',
    18: '+ le double clap', 19: '+ la boule à facettes brille plus fort', 20: '+ la cymbale à chaque phrase, la cloche à vache', 21: '+ les charleys en doubles croches', 22: '+ la gamme des cordes à l’octave',
    23: '+ le sifflet disco', 24: '+ les cuivres à deux voix', 25: '+ les toms en fin de phrase', 26: '+ les grosses caisses fantômes', 27: 'LE CLIMAX : les coups d’accord redoublent, les cordes montent',
    28: 'Le final : la caisse claire roule avant la reprise', 29: 'Le tutti : tout le monde joue', 30: 'Les cuivres montent d’une octave.' };
  const PALIERS30 = Array.from({ length: 30 }, (_, k) => ENTRE[k + 1] || 'Tout pousse d’un cran.');
  const BASE = { pad: .85, clavL: .85, clav: .9, coeur: .5, kick: .5, shaker: .3, glint: .5, sub: .4, hat: .26, ouvert: .26, tamb: .24, clap: .4, snare: .36, guitare: .36, basse: .72, filent: .5, ligne: .45, stab: .66, brass: .7,
    harmo: .46, conga: .4, vache: .22, crash: .36, toms: .5, sifflet: .2, caisse: .4, riser: .3, ghost: .22 };
  const niv = (id, p) => { const e = QUAND[id] || 1; if (p < e) return 0; const r = Math.min(1, (p - e) / 6), g = .72 + .28 * (p - 1) / 29; return (BASE[id] || .3) * (.84 + .16 * r) * g; };
  const FILTRE_PAD = p => Math.min(4200, 750 * Math.pow(1.065, p - 1));
  const FILTRE_CLAV = p => Math.min(4800, 1400 * Math.pow(1.04, p - 1));
  const POMPE = p => p < QUAND.decolle ? .86 : Math.max(.52, .8 - .018 * (p - QUAND.decolle));

  function preparer(ctx, sortie, alea) {
    const sr = ctx.sampleRate;
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
    const courbe = k => { const c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; };
    const impulsion = (len, dec, lp) => { const n = Math.floor(sr * len), b = ctx.createBuffer(2, n, sr);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let y = 0; const a = Math.exp(-2 * Math.PI * lp / sr);
        for (let i = 0; i < n; i++) { y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.pow(1 - i / n, dec); } } return b; };
    // un filtre biquad écrit à la main (RBJ) : les frappes de batterie sont calculées UNE fois, ici, pas filtrées en direct à chaque coup
    const bq = (type, f, q) => { const w = 2 * Math.PI * f / sr, c = Math.cos(w), s = Math.sin(w), al = s / (2 * q); let b0, b1, b2, a0 = 1 + al, a1 = -2 * c, a2 = 1 - al;
      if (type === 'hp') { b0 = (1 + c) / 2; b1 = -(1 + c); b2 = b0; } else if (type === 'bp') { b0 = al; b1 = 0; b2 = -al; } else { b0 = (1 - c) / 2; b1 = 1 - c; b2 = b0; }
      let x1 = 0, x2 = 0, y1 = 0, y2 = 0; return x => { const y = (b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0; x2 = x1; x1 = x; y2 = y1; y1 = y; return y; }; };
    const fab = (len, fn) => { const n = Math.floor(sr * len), b = ctx.createBuffer(1, n, sr); fn(b.getChannelData(0), n); return b; };
    const bruit1 = () => alea() * 2 - 1;
    const buf = {};
    buf.hat = fab(.06, (d, n) => { const f = bq('hp', 8200, .7); for (let i = 0; i < n; i++) d[i] = f(bruit1()) * Math.exp(-i / (sr * .011)); });
    buf.ouvert = fab(.4, (d, n) => { const f = bq('hp', 6800, .7); for (let i = 0; i < n; i++) d[i] = f(bruit1()) * Math.exp(-i / (sr * .075)) * Math.min(1, i / (sr * .002)); });
    buf.tamb = fab(.14, (d, n) => { const f = bq('bp', 8800, 1.2); for (let i = 0; i < n; i++) d[i] = (f(bruit1()) * 2.4 + .1 * Math.sin(i / sr * 6283 * 6900) * (i / sr < .02 ? 1 : 0)) * Math.exp(-i / (sr * .028)) * Math.min(1, i / (sr * .003)); });
    buf.shaker = fab(.08, (d, n) => { const f = bq('bp', 6500, 1); for (let i = 0; i < n; i++) d[i] = f(bruit1()) * 2 * Math.sin(Math.PI * Math.min(1, i / n)) * Math.exp(-i / (sr * .03)); });
    buf.clap = fab(.28, (d, n) => { const f = bq('bp', 1250, .9); for (let i = 0; i < n; i++) { const t = i / sr; let e = 0; for (let k = 0; k < 3; k++) { const dt = t - k * .009; if (dt >= 0) e = Math.max(e, Math.exp(-dt / .006)); }
      const q = t - .027; if (q >= 0) e = Math.max(e, .7 * Math.exp(-q / .055)); d[i] = f(bruit1()) * 2.2 * e; } });
    buf.snare = fab(.24, (d, n) => { const f = bq('bp', 2100, .7), h = bq('hp', 900, .7); for (let i = 0; i < n; i++) { const t = i / sr; d[i] = h(f(bruit1())) * 2 * Math.exp(-t / .06) + .6 * Math.sin(6283 * (190 + 60 * Math.exp(-t / .02)) * t) * Math.exp(-t / .045); } });
    buf.chank = fab(.1, (d, n) => { const f = bq('bp', 2500, 1.6); for (let i = 0; i < n; i++) d[i] = f(bruit1()) * 2.4 * Math.exp(-i / (sr * .014)) * Math.min(1, i / (sr * .001)); });
    buf.crash = fab(1.9, (d, n) => { const f = bq('hp', 5200, .6); for (let i = 0; i < n; i++) d[i] = f(bruit1()) * Math.exp(-i / (sr * .5)) * Math.min(1, i / (sr * .004)); });
    buf.vache = fab(.3, (d, n) => { const f = bq('bp', 760, 1.8); for (let i = 0; i < n; i++) { const t = i / sr; d[i] = f(Math.sin(6283 * 587 * t) + .45 * Math.sin(6283 * 845 * t) + .3 * Math.sin(6283 * 1174 * t)) * 1.6 * Math.exp(-t / .085) * Math.min(1, t / .001); } });
    buf.bruit = fab(2, (d, n) => { for (let i = 0; i < n; i++) d[i] = bruit1(); });

    const master = G(.5), chaud = ctx.createWaveShaper(); chaud.curve = courbe(1.08); chaud.oversample = '2x';
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -17; comp.ratio.value = 2.6; comp.attack.value = .015; comp.release.value = .2;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -3; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1; lim.knee.value = 0;
    const boue = F('peaking', 260, .9); boue.gain.value = -2; const doux = F('highshelf', 7800, .7); doux.gain.value = -1.5;
    chaine(master, F('highpass', 38, .7), boue, doux, chaud, comp, lim, sortie);
    const salle = ctx.createConvolver(); salle.buffer = impulsion(2.6, 2.2, 3600); const envoiSalle = G(1); chaine(envoiSalle, salle, F('highpass', 280, .7), G(.3), master);
    const dG = ctx.createDelay(2), dD = ctx.createDelay(2); dG.delayTime.value = SD * 2; dD.delayTime.value = SD * 3;
    const fb = G(.27), echoIn = G(1), echoSort = G(0), pG = ctx.createStereoPanner(), pD = ctx.createStereoPanner(); pG.pan.value = -.6; pD.pan.value = .6;
    chaine(echoIn, F('lowpass', 4800, .7), F('highpass', 350, .7), dG); dG.connect(dD); dD.connect(fb); fb.connect(dG); dG.connect(pG); dD.connect(pD); pG.connect(echoSort); pD.connect(echoSort); echoSort.connect(master); echoSort.connect(envoiSalle);
    const pompe = G(1); pompe.connect(master);
    const ids = ['pad', 'clavL', 'clav', 'coeur', 'kick', 'shaker', 'glint', 'sub', 'hat', 'ouvert', 'tamb', 'clap', 'snare', 'guitare', 'basse', 'filent', 'ligne', 'stab', 'brass', 'harmo', 'conga', 'vache', 'crash', 'toms', 'sifflet', 'caisse', 'riser', 'ghost'], bus = {};
    ids.forEach(id => bus[id] = G(0));
    const pompes = ['pad', 'filent', 'ligne', 'stab', 'brass', 'harmo', 'sifflet'];
    pompes.forEach(id => bus[id].connect(pompe));
    ids.filter(id => !pompes.includes(id)).forEach(id => bus[id].connect(master));
    const envoi = (id, v) => { const g = G(v); bus[id].connect(g); g.connect(envoiSalle); };
    envoi('pad', .4); envoi('filent', .35); envoi('ligne', .4); envoi('stab', .22); envoi('brass', .32); envoi('harmo', .32); envoi('glint', .9); envoi('clap', .4); envoi('snare', .25); envoi('conga', .22); envoi('sifflet', .6); envoi('toms', .3); envoi('vache', .2); envoi('clavL', .3); envoi('clav', .18);
    { const g = G(.4); bus.brass.connect(g); g.connect(echoIn); const g2 = G(.3); bus.clav.connect(g2); g2.connect(echoIn); const g3 = G(.55); bus.glint.connect(g3); g3.connect(echoIn); const g4 = G(.35); bus.stab.connect(g4); g4.connect(echoIn); const g5 = G(.3); bus.harmo.connect(g5); g5.connect(echoIn); }
    const filtrePad = F('lowpass', 750, .7); filtrePad.connect(bus.pad);
    const filtreClav = F('lowpass', 1400, .7); filtreClav.connect(bus.clav);
    const filtreClavL = F('lowpass', 1500, .7); filtreClavL.connect(bus.clavL);
    return { bus, buf, pompe, filtrePad, filtreClav, filtreClavL, echoSort, master };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    p = Math.max(1, Math.min(30, p | 0));
    const b = kit.bus, A = id => p >= QUAND[id];
    for (const id in b) b[id].gain.setValueAtTime(niv(id, p), t0);
    kit.master.gain.setTargetAtTime(.82 + .5 * Math.pow((p - 1) / 29, 1.2), t0, .5);
    kit.filtrePad.frequency.setTargetAtTime(FILTRE_PAD(p), t0, .4); kit.filtreClav.frequency.setTargetAtTime(FILTRE_CLAV(p), t0, .4); kit.filtreClavL.frequency.setTargetAtTime(FILTRE_CLAV(p) * .9, t0, .4);
    kit.echoSort.gain.setValueAtTime(A('echo') ? .5 : .12, t0);
    const osc = (type, f, dt) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; if (dt) o.detune.value = dt; return o; };
    const filt = (type, f, q) => { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };
    const env = (g, t, pic, a, dur) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, pic), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); };
    const frappe = (buffer, t, v, dest, rate) => { const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = buffer; if (rate) s.playbackRate.value = rate; g.gain.value = v; s.connect(g); g.connect(dest); s.start(t); };

    // ---- les instruments ----
    // le clavinet : une à trois scies dans UN filtre qui se referme vite (le « ouah » de la corde pincée), 0,15 s, jamais de queue ; peak : l'ouverture du filtre

<!-- ======================= L'ÉCOUTE (libre : ce que voit celui qui ouvre le fichier) ======================= -->
<script>
(function () {
  let ctx = null, kit = null, p = 1, m = 0, tNext = 0, iv = 0;
  let graine = 12750; const alea = () => { graine = (graine * 1664525 + 1013904223) >>> 0; return graine / 4294967296; };

  const maj = () => { mot.textContent = 'Moteur ' + p + ' / 30'; ce.textContent = 'Moteur ' + p + ' · ' + MORCEAU.paliers[p - 1]; };
  jg.addEventListener('input', () => { p = Math.max(1, Math.min(30, 1 + Math.round(+jg.value / 100 * 29))); maj(); });
  play.onclick = () => {
    if (iv) { clearInterval(iv); iv = 0; ctx.close(); ctx = null; play.textContent = 'PLAY'; maj(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)(); kit = MORCEAU.preparer(ctx, ctx.destination, alea);
    m = 0; tNext = ctx.currentTime + 0.1; play.textContent = 'STOP';
    iv = setInterval(() => { while (tNext < ctx.currentTime + 0.4) { MORCEAU.jouer(ctx, kit, p, tNext, m++, 1, alea); tNext += mes; } maj(); }, 60);
  };

</script>
