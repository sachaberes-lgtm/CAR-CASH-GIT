<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

<div class="boite">
  <div><h1>FIRE PRIME · 30 PALIERS</h1><div class="sous">écrit à la main, sans le générateur · 72 BPM · mi♭ mineur · boom-bap qui prend feu : le vinyle devient braise, la braise devient brasier</div></div>
  <div class="rang"><button id="play">PLAY</button><div class="pals"><div id="mot">Moteur 1 / 30</div><input type="range" id="speed" min="0" max="100" step="any" value="0" aria-label="Moteur"></div></div>
  <div id="ce"></div>
</div>

<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     (2026-11-03, pôle SON ; Léo : « une version premium de toutes les musiques du jeu, la nouvelle DA, 20 bangers différents, sans que les anciens sons perdent leur identité » — fiche 8, FIRE PRIME)
     L'IDENTITÉ GARDÉE : Fire Prime était le morceau lo-fi poussiéreux (mineur, la basse 808, le petit orgue, la trompette sourde, le vinyle qui s'installe, ride et toms vers la fin). Ici elle devient une idée entière :
     LE FEU QUI PREND. Le disque craque (poussière) comme un vieux 33 tours ; vers le moteur 12 les craquements s'épaississent en BRAISE ; dès le 25 c'est le BRASIER, un vrai feu de bois qui rugit sous le morceau.
     72 BPM, mi♭ mineur, boom-bap très swingué (la caisse claire tombe un peu en retard, façon sampler 12 bits). Ebm9 · Cbmaj7 · Abm9 · Fm7b5 → Bb7b9, deux mesures par accord.
     LES VOIX : la GUITARE NYLON (corde pincée calculée, passée dans un « wow » de cassette), la KALIMBA qui lui répond, le SUB court (808 de sampler), LE CUIVRE BRAISE — le remplaçant de la trompette sourde : un cuivre
     mono qui glisse de note en note, la bouche qui s'ouvre (le filtre de voyelle balaie) en fondu, sans coupure, une octave grave collée dessous, très peu de vibrato — puis les cordes de velours, les scratches de DJ en fin de phrase,
     la cymbale, les toms, la cloche, le climax. Rien ici ne vient du générateur ni des autres pages refaites (ni marimba, ni log drum, ni oud, ni taiko).
     Le moteur 1 est le LOBBY : poussière de disque, guitare nylon en arpège, nappe de cassette, le cœur de la grosse caisse, un charley qui respire, le sub sur le un. Calme, jamais pauvre.
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 72, SD = 60 / BPM / 4, MES = 16 * SD, SW = .3;   /* SW : le swing (la double croche impaire arrive en retard de 30 % d'un pas) */
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // LA GRILLE (mi♭ mineur), deux mesures par accord : Ebm9 · Cbmaj7 · Abm9 · Fm7b5 → Bb7b9
  const ROOTS = [39, 39, 47, 47, 44, 44, 41, 46];
  const CHORDS = [[51, 54, 58, 61, 65], [51, 54, 58, 61, 65], [47, 51, 54, 58, 63], [47, 51, 54, 58, 63], [56, 59, 63, 66, 70], [56, 59, 63, 66, 70], [53, 56, 59, 63, 65], [58, 62, 65, 68, 71]];
  // LE THÈME du cuivre : [pas sur 128, note, durée en doubles croches]
  const THEME = [[2, 70, 3], [5, 73, 2], [8, 75, 6], [18, 73, 2], [20, 70, 3], [24, 66, 6],
    [32, 71, 3], [35, 70, 2], [38, 66, 3], [42, 63, 4], [50, 66, 3], [54, 70, 2], [56, 71, 6],
    [66, 68, 3], [69, 71, 2], [72, 75, 6], [82, 73, 2], [84, 71, 2], [86, 70, 3], [90, 68, 4],
    [96, 65, 3], [99, 68, 2], [102, 71, 3], [106, 68, 4], [112, 70, 2], [114, 68, 2], [116, 71, 2], [118, 70, 4], [124, 73, 3]];
  // LE CONTRE-CHANT de kalimba : trois dessins sur seize pas (un chiffre = le degré de l'accord, '.' = silence), qui tournent d'une mesure à l'autre
  const KALIM = ['.2..4..1.3..4.2.', '3..1.4..2..3.1..', '.4.2..3.1..4..2.'];
  // LA GUITARE EN COUPS (dès le 11) : [pas, durée]
  const COMPING = [[[0, 5], [6, 3], [10, 4]], [[0, 4], [3, 3], [8, 3], [12, 3]], [[0, 6], [7, 2], [11, 4]]];
  // LA GROSSE CAISSE (trois dessins, un par phrase, le quatrième = le deuxième) et le sub qui la suit
  const KICK = [[0, 7, 10], [0, 6, 10, 13], [0, 3, 10], [0, 6, 10, 13]];
  const FANT = [2, 9, 14];   /* caisse claire fantôme */

  const QUAND = { vinyle: 1, pad: 1, guit: 1, hats: 1, kick: 1, sub: 1, fant: 2, kal: 3, hats8: 4, cuivre: 5, subfull: 6, snare: 7, orgue: 8, cuivre2: 9, slides: 10, comping: 11, ouverts: 12, braise: 12,
    kal2: 13, stabs: 14, decolle: 15, tierce: 16, shaker: 17, scratch: 18, cloche: 19, crash: 20, ride: 21, cordes: 22, echos: 23, toms: 24, brasier: 25, octave: 26, climax: 27, roule: 28, arp: 29, final: 30,
    trap: 16, hats16: 20, b808: 21, rupture: 23, montee: 25 };   /* (2026-11-09, Léo : « Fire Prime change et évolue pas assez du 15 au 30, même si la mélodie évolutive est belle ») la mélodie ne bouge pas ; c'est le DÉCOR qui change : roulements de charley trap (16), charleys en doubles croches (20), basse 808 (21), la rupture (23), la montée de flamme (25), le pompage qui se creuse */
  const ENTRE = { 1: 'Le lobby : la poussière d’un vieux disque, la guitare nylon qui égrène l’accord, la nappe de cassette, le cœur de la grosse caisse, un charley qui respire, le sub sur le un.', 2: '+ la caisse claire fantôme',
    3: '+ la kalimba qui répond à la guitare', 4: '+ le charley en croches swinguées', 5: 'LE CUIVRE BRAISE entre : une note qui glisse vers la suivante, la bouche qui s’ouvre', 6: '+ le sub joue toute la grille, court',
    7: '+ la vraie caisse claire, un peu en retard', 8: '+ le petit orgue sur les contretemps', 9: '+ le cuivre chante tout le thème, avec sa voix grave collée dessous', 10: '+ les glissés du sub',
    11: '+ la guitare passe en coups d’accord', 12: 'LA BRAISE : le disque ne craque plus, il rougeoie ; + les charleys ouverts', 13: '+ la kalimba en deux voix', 14: '+ les accords hachés (guitare étouffée)',
    15: 'ÇA DÉCOLLE : la grosse caisse se double, la claque s’épaissit, la guitare monte d’une octave', 16: '+ le cuivre à la tierce ; le TRAP : des roulements de charley en fin de phrase', 17: '+ le shaker', 18: '+ les SCRATCHES du DJ en fin de phrase',
    19: '+ la cloche de verre', 20: '+ la cymbale à chaque phrase ; les charleys passent en DOUBLES CROCHES : le groove se resserre', 21: '+ la ride ; LA 808 : le sub court laisse la place à un grave long qui tombe en glissant', 22: '+ les cordes de velours', 23: '+ les échos ; LA RUPTURE : une phrase sur deux, toute la batterie s’arrête une demi-mesure — la guitare et le cuivre respirent seuls, puis la cymbale retombe', 24: '+ les toms de fin de phrase',
    25: 'LE BRASIER : le feu rugit sous le morceau ; une montée de flamme avant chaque phrase', 26: '+ le cuivre monte d’une octave sur la deuxième moitié', 27: 'LE CLIMAX : les accords frappés, la cymbale toutes les quatre mesures', 28: 'La claque roule, la grosse caisse s’emballe en fin de phrase',
    29: '+ l’arpège de guitare à l’octave', 30: 'Le final : tout est là, le cuivre double à l’octave, le groove à plein.' };
  const PALIERS30 = Array.from({ length: 30 }, (_, k) => ENTRE[k + 1] || 'Tout pousse d’un cran.');
  const BASE = { pad: .46, guit: .9, kal: .5, cuivre: .5, sub: .8, kick: .85, snare: .8, fant: .4, hats: .3, ouverts: .3, shaker: .22, orgue: .24, stabs: .5, scratch: .5, cordes: .4, cloche: .3, crash: .45, ride: .26,
    toms: .55, clap: .5, poussiere: .5, braise: .5, brasier: .7, flamme: .3, caisse: .4, b808: .62 };
  const niv = (id, p) => { const e = id === 'caisse' ? QUAND.roule : id === 'clap' ? QUAND.decolle : id === 'poussiere' ? 1 : id === 'braise' ? QUAND.braise : id === 'brasier' ? QUAND.brasier : id === 'flamme' ? QUAND.montee : (QUAND[id] || 1);
    if (p < e) return 0; const r = Math.min(1, (p - e) / 6), g = .7 + .3 * (p - 1) / 29;
    let v = (BASE[id] || .3) * (.8 + .2 * r) * g;
    if (id === 'sub' && p >= QUAND.b808) v *= .0;   /* la 808 prend le grave : le sub court se tait */
    if (id === 'poussiere') v *= Math.max(.25, 1 - (p - 1) / 14);   /* la poussière s'efface quand la braise prend */
    if (id === 'braise') v *= p >= QUAND.brasier ? .45 : 1;
    return v; };
  const FILTRE_PAD = p => Math.min(4200, 700 * Math.pow(1.07, p - 1));
  const FILTRE_GUIT = p => Math.min(6000, 2200 * Math.pow(1.035, p - 1));
  const POMPE = p => p < QUAND.decolle ? .9 : Math.max(.52, .8 - .018 * (p - QUAND.decolle));   /* le pompage se creuse à mesure qu'on monte */

  function preparer(ctx, sortie, alea) {
    const sr = ctx.sampleRate;
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
    const courbe = k => { const c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; };
    const impulsion = (len, dec, lp) => { const n = Math.floor(sr * len), b = ctx.createBuffer(2, n, sr);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let y = 0; const a = Math.exp(-2 * Math.PI * lp / sr);
        for (let i = 0; i < n; i++) { y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.pow(1 - i / n, dec); } } return b; };
    const tampon = (dur, fn) => { const n = Math.floor(sr * dur), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0); fn(d, n); return b; };
    /* le grain « sampler 12 bits » : on garde un échantillon sur deux et on arrondit à 11 bits */
    const crunch = d => { let h = 0; for (let i = 0; i < d.length; i++) { if (i % 2 === 0) h = Math.round(d[i] * 1024) / 1024; d[i] = h; } };

    const master = G(.5), chaud = ctx.createWaveShaper(); chaud.curve = courbe(1.1); chaud.oversample = '2x';
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 2.2; comp.attack.value = .012; comp.release.value = .18;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -3; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1; lim.knee.value = 0;
    const boue = F('peaking', 260, .9); boue.gain.value = -2; const doux = F('highshelf', 7000, .7); doux.gain.value = -2.5;
    chaine(master, F('highpass', 38, .7), boue, doux, chaud, comp, lim, sortie);
    const salle = ctx.createConvolver(); salle.buffer = impulsion(2.2, 2.4, 3000); const envoiSalle = G(1); chaine(envoiSalle, salle, F('highpass', 280, .7), G(.3), master); /* (9/11) la salle raccourcie : la queue au-delà de 2,4 s est à −30 dB, inaudible, et c'était ~10 % de calcul en moins */
    const dG = ctx.createDelay(2), dD = ctx.createDelay(2); dG.delayTime.value = SD * 3; dD.delayTime.value = SD * 3;
    const fb = G(.36), echoIn = G(1), echoSort = G(0), pG = ctx.createStereoPanner(), pD = ctx.createStereoPanner(); pG.pan.value = -.7; pD.pan.value = .7;
    chaine(echoIn, F('lowpass', 3600, .7), F('highpass', 300, .7), dG); dG.connect(dD); dD.connect(fb); fb.connect(dG); dG.connect(pG); dD.connect(pD); pG.connect(echoSort); pD.connect(echoSort); echoSort.connect(master); echoSort.connect(envoiSalle);
    const pompe = G(1); pompe.connect(master);
    /* LE « WOW » DE CASSETTE : un retard de 12 ms dont un sinus fait vaciller la durée (≈ 8 centièmes de ton) ; il passe dans la guitare, la kalimba, l'orgue et le cuivre */
    const wow = ctx.createDelay(.1); wow.delayTime.value = .014; const wowIn = G(1); wowIn.connect(wow); wow.connect(pompe);
    const ids = ['pad', 'guit', 'kal', 'cuivre', 'sub', 'kick', 'snare', 'fant', 'hats', 'ouverts', 'shaker', 'orgue', 'stabs', 'scratch', 'cordes', 'cloche', 'crash', 'ride', 'toms', 'clap', 'caisse', 'poussiere', 'braise', 'brasier', 'flamme', 'b808'], bus = {};
    ids.forEach(id => bus[id] = G(0));
    ['guit', 'kal', 'cuivre', 'orgue', 'stabs'].forEach(id => bus[id].connect(wowIn));
    ['pad', 'cordes'].forEach(id => bus[id].connect(pompe));
    ids.filter(id => !['guit', 'kal', 'cuivre', 'orgue', 'stabs', 'pad', 'cordes'].includes(id)).forEach(id => bus[id].connect(master));
    const envoi = (id, v) => { const g = G(v); bus[id].connect(g); g.connect(envoiSalle); };
    envoi('pad', .5); envoi('guit', .28); envoi('kal', .4); envoi('cuivre', .38); envoi('orgue', .3); envoi('cordes', .4); envoi('cloche', .5); envoi('snare', .22); envoi('clap', .35); envoi('stabs', .3); envoi('toms', .3); envoi('scratch', .2);
    { const e = (id, v) => { const g = G(v); bus[id].connect(g); g.connect(echoIn); }; e('cuivre', .38); e('kal', .35); e('cloche', .45); e('scratch', .3); e('stabs', .3); }
    const filtrePad = F('lowpass', 700, .7); filtrePad.connect(bus.pad);
    const filtreGuit = F('lowpass', 2200, .7); filtreGuit.connect(bus.guit);

    /* ---- les frappes, calculées UNE FOIS (pas de filtre en direct par coup) ---- */
    const bruitBuf = tampon(2, d => { for (let i = 0; i < d.length; i++) d[i] = alea() * 2 - 1; });
    const kickB = tampon(.4, (d, n) => { let ph = 0; for (let i = 0; i < n; i++) { const t = i / sr, f = 44 + 70 * Math.exp(-t * 28); ph += 2 * Math.PI * f / sr; d[i] = (Math.sin(ph) * Math.exp(-t * 9) * .95 + (t < .004 ? (alea() * 2 - 1) * .3 : 0)); } crunch(d); });
    const snareB = tampon(.32, (d, n) => { let y = 0, ph = 0; for (let i = 0; i < n; i++) { const t = i / sr, w = alea() * 2 - 1; y = .55 * y + .45 * w; ph += 2 * Math.PI * (190 - 40 * Math.min(1, t * 8)) / sr; d[i] = (w - y * .5) * Math.exp(-t * 17) * .8 + Math.sin(ph) * Math.exp(-t * 28) * .55; } crunch(d); });
    const clapB = tampon(.3, (d, n) => { let y = 0; for (let i = 0; i < n; i++) { const t = i / sr, w = alea() * 2 - 1; y = .6 * y + .4 * w; const e = Math.exp(-((t % .011)) * 280) * (t < .033 ? 1 : 0) + Math.exp(-(t - .033) * 24) * (t >= .033 ? .8 : 0); d[i] = (w - y * .6) * e * .6; } });
    const hatB = tampon(.1, (d, n) => { let y = 0; for (let i = 0; i < n; i++) { const t = i / sr, w = alea() * 2 - 1; y = .35 * y + .65 * w; d[i] = (w - y * .85) * Math.exp(-t * 70) * .9; } crunch(d); });
    const ouvB = tampon(.5, (d, n) => { let y = 0; for (let i = 0; i < n; i++) { const t = i / sr, w = alea() * 2 - 1; y = .35 * y + .65 * w; d[i] = (w - y * .85) * Math.exp(-t * 9) * .8; } });
    const shakB = tampon(.14, (d, n) => { let y = 0, z = 0; for (let i = 0; i < n; i++) { const t = i / sr, w = alea() * 2 - 1; y = .5 * y + .5 * w; z = .9 * z + .1 * y; d[i] = (y - z) * Math.sin(Math.PI * Math.min(1, t / .14)) * 1.4; } });
    const crashB = tampon(2.4, (d, n) => { let y = 0; for (let i = 0; i < n; i++) { const t = i / sr, w = alea() * 2 - 1; y = .3 * y + .7 * w; d[i] = (w - y * .9) * (Math.exp(-t * 2.3) * .8 + Math.exp(-t * 20) * .5); } });
    const rideB = tampon(.9, (d, n) => { let y = 0, a = 0, b = 0, c = 0; for (let i = 0; i < n; i++) { const t = i / sr, w = alea() * 2 - 1; y = .4 * y + .6 * w; a += 2 * Math.PI * 3140 / sr; b += 2 * Math.PI * 4720 / sr; c += 2 * Math.PI * 6310 / sr;
      d[i] = ((w - y * .9) * .5 + (Math.sin(a) + Math.sin(b) * .7 + Math.sin(c) * .5) * .12) * (Math.exp(-t * 6) * .8 + Math.exp(-t * 45) * .6); } });
    /* les trois couches du feu : la poussière (quelques pops secs + du souffle), la braise (les pops s'épaississent, plus clairs), le brasier (le rugissement, grave, et les éclats) */
    const croque = (dur, pops, vol, souffle, rugit) => tampon(dur, (d, n) => {
      let y = 0, z = 0; for (let i = 0; i < n; i++) { const w = alea() * 2 - 1; y = .96 * y + .04 * w; z = .9985 * z + .0015 * w; d[i] = y * souffle * 6 + z * rugit * 60; }
      const k = Math.floor(dur * pops); for (let j = 0; j < k; j++) { const at = Math.floor(alea() * (n - 400)), a = (alea() * alea()) * vol, len = 12 + Math.floor(alea() * 90);
        for (let i = 0; i < len; i++) d[at + i] += (alea() * 2 - 1) * a * Math.exp(-i / (len * .3)); } });
    const poussB = croque(12, 7, .5, .004, 0), brasB = croque(12, 22, .45, .003, .004), briB = croque(12, 46, .6, .004, .012);

    /* la guitare nylon : une corde pincée calculée (Karplus-Strong), mise en cache par note */
    const cacheG = {};
    const cordePincee = midi => { if (cacheG[midi]) return cacheG[midi]; const f = mtof(midi), N = Math.max(3, Math.round(sr / f)), ring = new Float32Array(N);
      let y = 0; for (let i = 0; i < N; i++) { const w = alea() * 2 - 1; y = .6 * y + .4 * w; ring[i] = y * 1.8; }
      const dec = midi < 50 ? .9985 : .9972;
      const b = tampon(1.5, (d, n) => { let k = 0; for (let i = 0; i < n; i++) { const s = ring[k], s2 = ring[(k + 1) % N]; d[i] = s; ring[k] = dec * .5 * (s + s2); k = (k + 1) % N; const rest = n - i; if (rest < 2000) d[i] *= rest / 2000; } });
      return cacheG[midi] = b; };
    return { bus, pompe, filtrePad, filtreGuit, echoSort, master, wow, bruitBuf, B: { kick: kickB, snare: snareB, clap: clapB, hat: hatB, ouv: ouvB, shak: shakB, crash: crashB, ride: rideB, pouss: poussB, bras: brasB, bri: briB }, cordePincee };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    p = Math.max(1, Math.min(30, p | 0));
    const b = kit.bus, A = id => p >= QUAND[id];
    for (const id in b) b[id].gain.setValueAtTime(niv(id, p), t0);
    kit.master.gain.setTargetAtTime(.34 + .56 * Math.pow((p - 1) / 29, 1.05), t0, .5);   /* (9/11) 1,10 → 0,90 au sommet : le limiteur n'écrase plus les couches qui arrivent (on les entend enfin entrer) */
    kit.filtrePad.frequency.setTargetAtTime(FILTRE_PAD(p), t0, .4); kit.filtreGuit.frequency.setTargetAtTime(FILTRE_GUIT(p), t0, .4); kit.echoSort.gain.setValueAtTime(A('echos') ? .5 : 0, t0);
    const osc = (type, f, dt) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; if (dt) o.detune.value = dt; return o; };
    const filt = (type, f, q) => { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };
    const env = (g, t, pic, a, dur) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, pic), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); };
    const jeton = (buf, t, v, dest, rate, off) => { const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = buf; if (rate) s.playbackRate.value = rate; g.gain.value = v; s.connect(g); g.connect(dest); s.start(t, off || 0); s.stop(t + buf.duration); };

    // ---- les instruments ----
    const guit = (t, midi, v, dur) => { const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = kit.cordePincee(midi); g.gain.setValueAtTime(v, t); if (dur) { g.gain.setValueAtTime(v, t + dur); g.gain.exponentialRampToValueAtTime(.0005, t + dur + .12); }
