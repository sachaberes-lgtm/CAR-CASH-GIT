<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     (2026-11-03, pôle SON ; Léo : « sur Sauver Maman, la mélodie un peu basique, et surtout l'instrument peut avoir plus d'effet, sinon ça fait un peu génératif. Faut que l'instrument soit poétique, moins électronique. »)
     L'ÂME : un sauvetage — la tendresse, la peur, la course contre le temps, la victoire. LE CONCEPT : « LA BERCEUSE ET L'HORLOGE » (inchangé : une berceuse de boîte à musique, une horloge qui égrène, un cœur qui bat ; la peur, le souffle retenu, la victoire en do majeur au 27).
     CE QUI EST NEUF (2026-11-03, troisième main) :
     · LE THÈME est écrit pour de bon : une phrase de seize mesures en quatre vers — A (la berceuse : sol-do-mi♭-ré-do, la tierce qui monte), A' (la peur : l'arpège grimpe jusqu'au do aigu, retombe sur le si, la sensible), B (la réponse, plus haute, qui atteint le mi♭ aigu — le sommet — puis redescend), la cadence (le ré♭ napolitain, le retard sol sus4, la résolution en si-la♭-sol).
       Il se transforme à chaque reprise (v0 : nu ; v1 : appogiatures ; v2 : diminutions ; v3 : le vers B à l'octave) — jamais deux fois pareil de suite. Le contre-chant (l'alto) est calculé note à note sur les accords (le plus proche, sans frotter la mélodie).
       L'harmonie : renversements (mi♭maj9/sol, ut mineur/mi♭, fa mineur/la♭), le ré♭ napolitain, le retard sus4, une basse conductrice (elle marche par petits pas, jamais par bonds).
     · LES INSTRUMENTS sont POÉTIQUES : plus un seul sinus qui joue la mélodie.
         – le PIANO DE FEUTRE : des partiels inharmoniques qui s'éteignent chacun à son rythme, deux cordes qui battent, le marteau de feutre qui bat sourd, un haut qui s'éteint tôt (tampons calculés une fois) ;
         – la BOÎTE À MUSIQUE : le peigne d'acier (le mode fondamental, le mode 6,27 qui tinte, le clic de la dent), chaque dent un peu fausse, la mécanique qui s'essouffle ;
         – l'ARCHET (l'alto, le violoncelle, le violon) : une onde de corde frottée, le crin qui mord à l'attaque (le bruit d'archet), le filtre qui s'ouvre sous l'archet, le portamento qui glisse de note en note, le VIBRATO qui s'installe après 0,2 s et grandit ;
         – la contrebasse pincée (Karplus-Strong : la corde vraie, courte), le cœur (deux tampons : lub, dub), la voix du chœur (un souffle de voyelle) ;
         – les timbales, la grosse caisse d'orchestre, la cymbale : inchangées (courtes).
     · L'HUMAIN : rien ne tombe pile. Chaque note de la mélodie arrive un rien après le temps (0 à 14 ms, plus tendu quand la peur monte), la fin de chaque vers respire (la mélodie traîne un peu), les nuances ondulent (la nuance respire d'une mesure à l'autre), des notes fantômes (le piano effleure la note d'avant),
       des dents de la boîte un peu fausses, des archets qui ne mordent pas pareil. Le TEMPO du jeu ne bouge pas : seules les notes se placent.
     Signature : le piano de feutre qui chante, l'alto qui glisse, la boîte à musique qui s'essouffle. PAS de taiko, marimba, log drum, oud, talkbox, clavinet, acid, ni cuivre. 80 pulsations, do mineur puis do majeur.
     Rien du générateur ici. Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 80, MES = 240 / BPM, SD = MES / 16;   /* seize doubles croches par mesure (4/4) : une phrase = 16 mesures = 48 s */
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* LES ACCORDS : r = la basse, v = la voix de l'accord, du grave à l'aigu (cinq notes) */
  const CH = {
    Cm9: { r: 36, v: [48, 51, 55, 58, 62] }, Abmaj9: { r: 32, v: [56, 60, 63, 67, 70] }, Ebmaj9: { r: 39, v: [51, 55, 58, 62, 65] }, Bb69: { r: 34, v: [50, 58, 60, 65, 67] },
    Fm9: { r: 41, v: [53, 56, 60, 63, 67] }, Dm7b5: { r: 38, v: [50, 53, 56, 60, 62] }, G7b9: { r: 31, v: [55, 59, 62, 65, 68] }, CmEb: { r: 39, v: [51, 55, 60, 63, 67] },
    Dbmaj7: { r: 37, v: [49, 53, 56, 60, 65] }, Gsus4: { r: 31, v: [55, 60, 62, 65, 67] },
    C: { r: 36, v: [48, 52, 55, 59, 62] }, Ab: { r: 32, v: [56, 60, 63, 68, 72] }, Bb: { r: 34, v: [58, 62, 65, 70, 74] }, F: { r: 41, v: [53, 57, 60, 64, 67] },
    Dm7: { r: 38, v: [50, 53, 57, 60, 64] }, G9: { r: 31, v: [55, 59, 62, 65, 69] } };
  /* seize mesures en do mineur (la berceuse, la peur, la réponse, la cadence) puis la même phrase en DO MAJEUR (la victoire, dès le 27) */
  const SEQ = ['Cm9', 'Abmaj9', 'Ebmaj9', 'Bb69', 'Fm9', 'Dm7b5', 'CmEb', 'G7b9', 'Abmaj9', 'Fm9', 'CmEb', 'Bb69', 'Fm9', 'Dbmaj7', 'Gsus4', 'G7b9'];
  const MSEQ = ['C', 'Ab', 'Bb', 'C', 'F', 'Dm7', 'G9', 'G9', 'Ab', 'Bb', 'C', 'C', 'F', 'Dm7', 'Gsus4', 'G9'];
  /* LA BASSE CONDUCTRICE : la note la plus proche de la précédente (elle marche, elle ne saute pas) ; Eb/G, C/Eb, F/Ab sont des renversements */
  const PCS_MIN = [0, 8, 7, 10, 5, 2, 3, 7, 8, 8, 3, 10, 5, 1, 7, 7], PCS_MAJ = [0, 8, 10, 0, 5, 2, 7, 7, 8, 10, 0, 0, 5, 2, 7, 7];
  const suiteBasse = pcs => { const o = []; let q = 36; pcs.forEach(pc => { let best = null; for (let n = pc + 24; n <= pc + 48; n += 12) { if (n < 29 || n > 45) continue; if (best === null || Math.abs(n - q) < Math.abs(best - q)) best = n; } q = best === null ? q : best; o.push(q); }); return o; };
  const BASSE_MIN = suiteBasse(PCS_MIN), BASSE_MAJ = suiteBasse(PCS_MAJ);
  /* LE THÈME, par mesure : [pas sur 16, note, durée en doubles croches].
     A  (0-3)  la berceuse : la quarte qui monte (sol→do), la tierce (do→mi♭), le soupir qui retombe ; trois fois le même élan, plus haut, puis la respiration sur le si♭ (demi-cadence)
     A' (4-7)  la peur : l'arpège grimpe de plus en plus vite jusqu'au do aigu (mes. 6), puis retombe, en brisé, sur la sensible (si) — la tension
     B  (8-11) la réponse : le sommet (mi♭ aigu, mes. 10) tenu, puis qui redescend en s'appuyant sur le do (retard) et le si♭
     C  (12-15) la cadence : le fa qui descend, le ré♭ napolitain, le retard sol sus4 (ré, do) qui se résout (si, la♭, sol) — le sol tient la place du départ */
  const THEME = [
    [[0, 67, 4], [4, 72, 2], [6, 75, 6], [12, 74, 2], [14, 72, 2]], [[0, 72, 4], [4, 75, 2], [6, 80, 6], [12, 79, 2], [14, 75, 2]], [[0, 79, 4], [4, 77, 2], [6, 75, 6], [12, 74, 4]], [[0, 74, 8], [8, 72, 4], [12, 70, 2]],
    [[0, 68, 4], [4, 72, 2], [6, 75, 2], [8, 77, 6], [14, 75, 2]], [[0, 74, 4], [4, 77, 2], [6, 80, 2], [8, 79, 4], [12, 77, 2], [14, 74, 2]], [[0, 75, 2], [2, 79, 2], [4, 82, 2], [6, 84, 10]], [[0, 83, 4], [4, 80, 2], [6, 79, 2], [8, 77, 4], [12, 74, 2], [14, 71, 2]],
    [[0, 72, 6], [6, 75, 2], [8, 80, 8]], [[0, 84, 6], [6, 82, 2], [8, 80, 4], [12, 79, 4]], [[0, 87, 8], [8, 86, 4], [12, 84, 4]], [[0, 84, 6], [6, 82, 2], [8, 79, 4], [12, 77, 2], [14, 75, 2]],
    [[0, 77, 6], [6, 75, 2], [8, 72, 4], [12, 68, 4]], [[0, 73, 6], [6, 72, 2], [8, 68, 4], [12, 65, 4]], [[0, 74, 8], [8, 72, 8]], [[0, 71, 4], [4, 68, 2], [6, 67, 6]]];
  /* LE THÈME EN MAJEUR (la victoire) : les quatre premières mesures CITENT la berceuse (sol-do-mi-ré-do : le mi naturel, la lumière), puis l'hymne : mêmes élans, des notes d'accord, le sommet sur le mi♭ (le la♭ majeur emprunté) */
  const THEMEM = [
    [[0, 67, 4], [4, 72, 2], [6, 76, 6], [12, 74, 2], [14, 72, 2]], [[0, 72, 4], [4, 75, 2], [6, 80, 6], [12, 79, 2], [14, 75, 2]], [[0, 77, 4], [4, 79, 2], [6, 82, 6], [12, 81, 4]], [[0, 84, 8], [8, 79, 4], [12, 76, 4]],
    [[0, 77, 4], [4, 81, 4], [8, 84, 4], [12, 81, 4]], [[0, 74, 4], [4, 77, 4], [8, 81, 4], [12, 84, 4]], [[0, 83, 6], [6, 81, 2], [8, 79, 4], [12, 74, 4]], [[0, 79, 4], [4, 83, 4], [8, 86, 8]],
    [[0, 80, 6], [6, 84, 2], [8, 87, 8]], [[0, 86, 6], [6, 82, 2], [8, 77, 4], [12, 82, 4]], [[0, 84, 8], [8, 79, 4], [12, 76, 4]], [[0, 72, 4], [4, 76, 4], [8, 79, 4], [12, 84, 4]],
    [[0, 81, 8], [8, 77, 4], [12, 81, 4]], [[0, 77, 4], [4, 81, 4], [8, 84, 8]], [[0, 79, 8], [8, 86, 8]], [[0, 83, 6], [6, 79, 4]]];
  /* LE CONTRE-CHANT (l'alto) : à chaque demi-mesure, la note d'accord la plus proche de la précédente, à trois demi-tons au moins de la mélodie qui sonne (jamais de frottement) */
  const contre = (seq, th) => { const out = []; let prev = 62;
    for (let bar = 0; bar < 16; bar++) { const v = CH[seq[bar]].v, row = [];
      [0, 8].forEach(st => { const mel = th[bar].filter(x => x[0] < st + 8 && x[0] + x[2] > st).map(x => x[1]); let best = null, bc = 99;
        for (let oc = -12; oc <= 12; oc += 12) v.forEach(m => { const n = m + oc; if (n < 55 || n > 69) return;
          if (mel.some(x => { const d = Math.abs(x - n) % 12; return d <= 2 || d >= 10; })) return;
          const c = Math.abs(n - prev) + (n === prev ? 1.6 : 0); if (c < bc) { bc = c; best = n; } });
        if (best === null) best = prev; row.push([st, best, 8]); prev = best; });
      out.push(row); }
    return out; };
  const CONTRE_MIN = contre(SEQ, THEME), CONTRE_MAJ = contre(MSEQ, THEMEM);
  const GAMME = { min: [0, 2, 3, 5, 7, 8, 10], maj: [0, 2, 4, 5, 7, 9, 11] };
  const haut = (n, major) => { const S = major ? GAMME.maj : GAMME.min; for (let q = n + 1; q < n + 4; q++) if (S.includes(((q % 12) + 12) % 12)) return q; return n + 2; };
  /* LES QUATRE VERSIONS DU THÈME : 0 nu ; 1 le thème s'orne (les appogiatures, ajoutées au jeu) ; 2 le thème se diminue (les notes longues se partagent en trois) ; 3 le vers B passe à l'octave */
  const variante = (arr, bar, vz, major) => { let o = arr.map(x => x.slice());
    if (vz === 2 && ((bar >= 4 && bar <= 7) || bar === 12 || bar === 13)) { const r = []; o.forEach(([st, n, ln]) => { if (ln >= 6) r.push([st, n, ln - 3], [st + ln - 3, haut(n, major), 1], [st + ln - 2, n, 2]); else r.push([st, n, ln]); }); o = r; }
    if (vz === 3 && bar >= 8 && bar <= 11) o = o.map(([st, n, ln]) => [st, n <= 76 ? n + 12 : n, ln]);
    return o; };
  const ARP = [[0, 2, 4, 2, 3, 1, 4, 2], [1, 3, 4, 3, 2, 0, 3, 4], [0, 1, 3, 4, 3, 2, 1, 2], [2, 4, 3, 1, 4, 3, 2, 0]];
  const PLAINTE = [[4, 3], [3, 2], [2, 1], [3, 4]];   /* le violon : deux notes tenues par mesure (indices de l'accord) */
  const BASSE_PAIRES = [[0, 7], [0, 12], [0, 7], [12, 7]];
  const DEUX = [0, 2, 8, 10], SIX = [0, 2, 4, 8, 10, 12], HUIT = [0, 2, 4, 6, 8, 10, 12, 14];

  const QUAND = { pad: 1, coeur: 1, boite: 1, tic: 1, pianoM: 1, piano: 2, basse: 4, rim: 5, kick: 6, cello: 7, choeur: 8, hats: 10, clap: 10, spicc: 11, contre: 12, riser: 12, caisse: 13, trem: 16, impact: 18, crash: 20, violon: 21, grand: 23, cathedrale: 24, aigu: 29,
    arpPlein: 14, decolle: 15, ah: 17, vide: 18, echos: 19, souffle: 25, build: 26, victoire: 27, emballe: 28, final: 30 };
  const ENTRE = { 1: 'La berceuse : la boîte à musique et le piano de feutre chantent le thème, la nappe, l’horloge, le cœur qui bat doucement. Calme, jamais vide.', 2: '+ le piano de feutre égrène l’accord', 3: '+ l’horloge à la croche', 4: '+ la contrebasse pincée, au rythme du cœur',
    5: '+ le claquement de bois, sur les contretemps', 6: '+ la grosse caisse (le cœur devient battement)', 7: '+ le violoncelle, une note longue sous la berceuse', 8: '+ le chœur « ou »', 9: 'LE VIOLONCELLE CHANTE LE THÈME, en glissant d’une note à l’autre',
    10: '+ l’horloge à la double croche, le claquement de mains', 11: '+ les cordes en staccato', 12: '+ l’alto : le contre-chant · la montée de bruit avant chaque fin de phrase', 13: '+ les toms au bout de la phrase', 14: '+ le piano à la croche',
    15: 'ÇA DÉCOLLE : la grosse caisse à chaque temps, la contrebasse plus nerveuse', 16: '+ les cordes en trémolo', 17: 'Le chœur passe de « ou » à « a »', 18: 'LE SOUFFLE RETENU : à la fin de chaque phrase tout se retire, puis l’IMPACT',
    19: '+ les échos de la boîte à musique', 20: '+ la cymbale, la double croche partout', 21: '+ le violon, deux notes tenues qui pleurent', 22: 'Tout pousse d’un cran', 23: '+ la grosse caisse d’orchestre',
    24: 'LA CATHÉDRALE : la nappe monte d’une octave, le chœur s’élargit', 25: 'Le souffle est retenu plus longtemps : quatre mesures de suspens', 26: 'La montée : le roulement de caisse claire, le bruit qui grimpe',
    27: 'LA VICTOIRE : do majeur, la berceuse devient un hymne', 28: 'LE CŒUR S’EMBALLE : le cœur et l’horloge à toute vitesse', 29: 'Le violon s’envole, la boîte à musique à l’octave', 30: 'LE FINAL : la berceuse dans la lumière, tout est là.' };
  const PALIERS30 = Array.from({ length: 30 }, (_, k) => ENTRE[k + 1] || 'Tout s’ouvre d’un cran.');
  const BASE = { pad: .75, coeur: .24, boite: .72, tic: .26, pianoM: .85, piano: .62, hats: .26, rim: .3, kick: .42, basse: .4, cello: .42, contre: .42, choeur: .3, clap: .3, spicc: .65, trem: .36, violon: .46, caisse: .3, crash: .45, grand: .6, cathedrale: .55, aigu: .28, riser: .38, impact: .62 };
  const niv = (id, p) => { const e = QUAND[id] || 1; if (p < e) return 0; if (id === 'coeur' && p >= QUAND.decolle && p < QUAND.emballe) return 0;
    const r = Math.min(1, (p - e) / 6), g = .72 + .28 * (p - 1) / 29, tot = ['pad', 'piano', 'pianoM', 'coeur', 'tic'].includes(id) ? 1.45 - .65 * Math.min(1, (p - 1) / 14) : 1;   /* le lobby se tient seul : ses voix reculent à mesure que les autres arrivent */
    return (BASE[id] || .3) * (.82 + .18 * r) * g * tot * (id === 'coeur' && p >= QUAND.kick && p < QUAND.decolle ? .6 : 1); };
  const FILTRE_PIANO = p => Math.min(5200, 1500 * Math.pow(1.045, p - 1));
  const FILTRE_PAD = p => Math.min(4800, 800 * Math.pow(1.07, p - 1));
  const POMPE = p => p < QUAND.decolle ? .88 : Math.max(.5, .78 - .016 * (p - QUAND.decolle));
  /* la mise en suspens : une partie de la phrase où tout se retire (les moteurs 18 à 24 : les deux dernières mesures ; 25 : les quatre dernières ; 26 et 28-29 : seulement la dernière ; au 27 la dernière) */
  const VIDE = (p, bar) => p < QUAND.vide ? false : p === 25 ? bar >= 12 : p >= 29 ? false : (p === 26 || p >= 27) ? bar === 15 : bar >= 14;

  function preparer(ctx, sortie, alea) {
    const SR = ctx.sampleRate;
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q, gn) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; if (gn != null) b.gain.value = gn; return b; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
    const courbe = k => { const c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; };
    const impulsion = (len, dec, lp) => { const n = Math.floor(SR * len), b = ctx.createBuffer(2, n, SR);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let y = 0; const a = Math.exp(-2 * Math.PI * lp / SR);
        for (let i = 0; i < n; i++) { y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.pow(1 - i / n, dec); } } return b; };
    /* les frappes sont des tampons calculés UNE fois ici : en direct, un seul lecteur par coup, jamais de filtre (leçon de CAVALE ULTRA : le moteur 30 saturait le processeur) */
    const mk = (len, fn) => { const n = Math.floor(SR * len), b = ctx.createBuffer(1, n, SR); fn(b.getChannelData(0), n); return b; };
    const bande = (hp, lp) => { let a = 0, l = 0; const ah = Math.exp(-2 * Math.PI * hp / SR), al = Math.exp(-2 * Math.PI * lp / SR); return () => { const x = alea() * 2 - 1; a = (1 - ah) * x + ah * a; l = (1 - al) * x + al * l; return l - a; }; };
    const normalise = (d, pic) => { let m = 1e-9; for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > m) m = a; } const g = pic / m; for (let i = 0; i < d.length; i++) d[i] *= g; };
    const tampons = {
      tick: mk(.04, (d, n) => { const f = bande(2400, 8000); for (let i = 0; i < n; i++) { const t = i / SR; d[i] = (f() * 6 * Math.exp(-i / (SR * .0035)) + Math.sin(2 * Math.PI * 3300 * t) * Math.exp(-t / .006) * .5) * .8; } }),
      toc: mk(.05, (d, n) => { const f = bande(900, 4200); for (let i = 0; i < n; i++) { const t = i / SR; d[i] = (f() * 6 * Math.exp(-i / (SR * .005)) + Math.sin(2 * Math.PI * 2100 * t) * Math.exp(-t / .008) * .6) * .8; } }),
      hat: mk(.05, (d, n) => { const f = bande(7500, 16000); for (let i = 0; i < n; i++) d[i] = f() * Math.exp(-i / (SR * .009)) * 5; }),
      rim: mk(.06, (d, n) => { const f = bande(1200, 5500); for (let i = 0; i < n; i++) { const t = i / SR; d[i] = (f() * 4 * Math.exp(-i / (SR * .004)) + Math.sin(2 * Math.PI * 1150 * t) * Math.exp(-t / .012) * .9) * .8; } }),
      clap: mk(.3, (d, n) => { const f = bande(700, 5500); for (let i = 0; i < n; i++) { const t = i / SR; let e = 0; for (let k = 0; k < 3; k++) { const u = t - k * .011; if (u >= 0) e += Math.exp(-u / .006); } e += t >= .03 ? Math.exp(-(t - .03) / .07) * .8 : 0; d[i] = f() * 5 * e * .55; } }),
      crash: mk(2.8, (d, n) => { const f = bande(5000, 15000); for (let i = 0; i < n; i++) d[i] = f() * Math.exp(-i / (SR * .65)) * 5; }),
      impact: mk(2.6, (d, n) => { const f = bande(40, 1800); let ph = 0; for (let i = 0; i < n; i++) { const t = i / SR; ph += 2 * Math.PI * (30 + 70 * Math.exp(-t * 7)) / SR; d[i] = Math.sin(ph) * Math.exp(-t / .75) * .9 + f() * Math.exp(-t / .22) * 3.2; } }),

      env(g, t, v, .004, 1.1); env(g2, t, v * .3, .004, .4); o.connect(g); o2.connect(g2); g.connect(b.grand); g2.connect(b.grand); o.start(t); o2.start(t); o.stop(t + 1.15); o2.stop(t + .45); };
    const accordPiano = (t, v, vol, dur) => v.forEach((m, k) => touche(t + k * .012 + alea() * .006, m + 12, vol * (k === 0 ? .8 : 1) * .5, dur));

    // ---- les mesures ----

      const tm = t0 + (m - m0) * MES, bar = m % 16, ph = Math.floor(m / 16), vz = ph % 4, k = bar % 4, seq = major ? MSEQ : SEQ, C = CH[seq[bar]], v = C.v, vide = VIDE(p, bar);

      kit.master.gain.setTargetAtTime(gMaitre2 * (vide ? .8 : 1), tm, vide ? .12 : .3);   /* le souffle retenu : tout recule d'un cran, l'impact qui suit revient en pleine force */

      const prec = bar > 0 ? variante((major ? THEMEM : THEME)[bar - 1], bar - 1, vz, major) : (major ? THEMEM : THEME)[15];

        TH.forEach(([st, nt, ln], q) => { const av = q > 0 ? TH[q - 1][1] : prec[prec.length - 1][1], t = tm + st * SD + h(.012);
          archet(t, nt - hors, Math.max(2, ln) * SD, .46 * br(st), av - hors, kit.etageCello, { vib: 13 + 4 * tens, att: .1 }); if (A('final') && ln >= 4) archet(t, nt - hors - 12, ln * SD, .26, 0, kit.etageCello, { vib: 9, crin: .3 }); }); }
      // l'alto : le contre-chant — une note d'accord par demi-mesure, qui glisse doucement vers la suivante
      if (A('contre') && !vide) { const row = (major ? CONTRE_MAJ : CONTRE_MIN)[bar], pr = (major ? CONTRE_MAJ : CONTRE_MIN)[bar > 0 ? bar - 1 : 15];
        row.forEach(([st, nt, ln], q) => { const av = q ? row[0][1] : pr[1][1]; archet(tm + st * SD + h(.02), nt, ln * SD, .34 * br(st), av, kit.etageContre, { vib: 11, att: .16, rel: .5, clair: .85 }); }); }
      // le violon : deux notes tenues qui pleurent (21) ; au 29 il chante le thème, une octave plus haut que la boîte

        else PLAINTE[(bar + ph * 2) % 4].forEach((ix, q) => archet(tm + q * 8 * SD + h(.03), v[ix] + (ix < 2 ? 24 : 12), 8 * SD, .18, q ? v[PLAINTE[(bar + ph * 2) % 4][0]] + (PLAINTE[(bar + ph * 2) % 4][0] < 2 ? 24 : 12) : 0, kit.etageViolon, { vib: 16, att: .18, rel: .5 })); }

      if (A('tic')) { const pas = p >= QUAND.emballe ? 1 : p >= 3 ? 2 : 4; for (let i = 0; i < 16; i += pas) coup((i / pas) % 2 ? T.toc : T.tick, tm + i * SD + h(.0025), b.tic, (i % 4 === 0 ? .8 : .5) * (pas === 1 ? .8 : 1)); }

      if (A('coeur') && !vide && !(p >= QUAND.decolle && p < QUAND.emballe)) { if (A('emballe')) { for (let i = 0; i < 16; i += 2) { battement(tm + i * SD, false, 1); battement(tm + (i + 1) * SD, true, 1); } } else { battement(tm, false, 1); battement(tm + 3 * SD, true, 1); battement(tm + 8 * SD, false, 1); battement(tm + 11 * SD, true, 1); } }
      if (A('kick') && !vide) { (A('decolle') ? (A('emballe') ? [0, 4, 8, 12, 14] : [0, 4, 8, 12]) : [0, 8]).forEach(st => kick(tm + st * SD, st === 0 ? 1 : .8)); if (A('crash') && A('decolle')) [6, 14].forEach(st => kick(tm + st * SD, .32)); else if (k % 2 === 1 && !A('decolle')) kick(tm + 11 * SD, .3); }

      if (A('basse') && !vide) { const pas = A('emballe') ? HUIT : A('decolle') ? SIX : DEUX, pr = BASSE_PAIRES[(bar + ph) % 4];

      if (p >= QUAND.build && (bar === 14 || bar === 15)) { const de = bar === 14 ? 8 : 4, pas = bar === 14 ? 2 : 1; for (let i = de; i < 16; i += pas) coup(T.clap, tm + i * SD, b.caisse, .22 + .16 * ((i - de) / (16 - de)), 1.3); }

  return {
    titre: 'SAUVER MAMAN', bpm: BPM, mesures: 16, intro: 0, pas: 0.6, moteurs: Array(30).fill(1), ton: 'do mineur', auteur: 'Claude Code (pôle SON), écrit à la main pour Léo',

<script>
