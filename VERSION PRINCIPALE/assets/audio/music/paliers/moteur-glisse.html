<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moteur Glisse — morceau à paliers</title>
<style>
:root{--fond:#fff;--tx:#191416;--tx2:#8c8387;--fil:#e5e1e4;--acc:#8e1f3d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:16px}
.boite{width:100%;max-width:560px;border:1px solid var(--fil);border-radius:20px;padding:24px;display:grid;gap:18px}
h1{margin:0;font-size:22px}.sous{color:var(--tx2);font-size:13px;margin-top:4px}
.rang{display:flex;gap:16px;align-items:center}
#play{width:72px;height:72px;border-radius:50%;border:0;background:var(--tx);color:#fff;font-weight:700;cursor:pointer;flex:none}
.pals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1}
.pals button{border:1px solid var(--fil);background:none;border-radius:12px;padding:12px 0;font:inherit;font-weight:700;cursor:pointer}
.pals button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ce{color:var(--tx2);font-size:13px;min-height:36px}
</style></head><body>
<div class="boite">
  <div><h1>MOTEUR GLISSE</h1><div class="sous">morceau à paliers · 104 BPM · ré mineur · le palier change à la mesure suivante</div></div>
  <div class="rang"><button id="play">PLAY</button><div class="pals" id="pals"></div></div>
  <div id="ce"></div>
</div>

<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers » v1) =======================
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime.
     Le jeu l'extrait tel quel et le rend hors temps réel, palier par palier. -->
<script id="morceau">
const MORCEAU = (function () {
  // (Léo, « Moteur Glisse ») accords en suspens : Dm11, Bbmaj7#11, Gm9, Asus4 — une mélodie de Rhodes sur 8 mesures, une 808 qui glisse
  const CHORDS = [[50, 53, 55, 60], [46, 50, 52, 57], [43, 46, 50, 57], [45, 50, 52, 57]];
  const MELODY = [
    [[0, 74, 3], [4, 72, 2], [6, 69, 6], [14, 76, 2]], [[0, 76, 4], [4, 74, 2], [6, 81, 6], [12, 76, 4]],
    [[0, 74, 2], [2, 77, 2], [4, 76, 4], [10, 74, 2], [12, 70, 4]], [[0, 69, 8], [10, 74, 2], [12, 76, 4]],
    [[0, 81, 6], [8, 79, 2], [10, 77, 2], [12, 76, 4]], [[0, 74, 8], [12, 72, 2], [14, 76, 2]],
    [[2, 77, 2], [4, 79, 2], [6, 81, 4], [12, 82, 4]], [[0, 81, 10], [12, 76, 4]]];
  const BASS = [26, null, null, null, null, null, 28, 29, 22, null, null, null, 22, null, 24, 26,
                31, null, null, 29, null, null, 26, null, 33, null, null, null, 31, null, 28, 26];
  const KICKS = [new Set([0, 7, 10]), new Set([0, 3, 10, 13])];
  const POLY = [81, 76, 74];
  // les paliers = la « vitesse » de la page d'origine, figée. P1 a déjà toute la batterie.
  const VIT = [0.30, 0.45, 0.62, 0.78, 1.0];
  const clamp = v => Math.min(1, Math.max(0, v)), ramp = (s, a, b) => clamp((s - a) / (b - a));
  const LAYERS = {
    keys: s => 1, pad: s => 1, vinyl: s => 1,
    b808: s => ramp(s, 0.05, 0.12), kick: s => ramp(s, 0.1, 0.18), snare: s => ramp(s, 0.15, 0.22),
    hats: s => ramp(s, 0.2, 0.28), bell: s => ramp(s, 0.35, 0.45), rolls: s => ramp(s, 0.45, 0.55),
    perc: s => ramp(s, 0.55, 0.62), choir: s => ramp(s, 0.65, 0.75), swell: s => ramp(s, 0.8, 0.9)};
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const BPM = 104;

  function preparer(ctx, sortie, alea) {
    const shaper = k => { const ws = ctx.createWaveShaper(), c = new Float32Array(2048);
      for (let i = 0; i < 2048; i++) { const x = i / 1024 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } ws.curve = c; ws.oversample = '2x'; return ws; };
    const impulse = (len, power) => { const n = Math.floor(ctx.sampleRate * len), b = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (alea() * 2 - 1) * Math.pow(1 - i / n, power); } return b; };
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    const warm = shaper(1.3), dark = ctx.createBiquadFilter(); dark.type = 'lowpass'; dark.frequency.value = 11000; dark.Q.value = 0.5;
    const master = ctx.createGain(); master.gain.value = 0.62;
    master.connect(warm); warm.connect(dark); dark.connect(comp); comp.connect(sortie);
    const verb = ctx.createConvolver(); verb.buffer = impulse(2.8, 2.5);
    const vOut = ctx.createGain(); vOut.gain.value = 0.32; const vDark = ctx.createBiquadFilter(); vDark.type = 'lowpass'; vDark.frequency.value = 5000;
    verb.connect(vDark); vDark.connect(vOut); vOut.connect(master);
    const verbSend = ctx.createGain(); verbSend.connect(verb);
    const delay = ctx.createDelay(2); delay.delayTime.value = 60 / BPM / 2;
    const fb = ctx.createGain(); fb.gain.value = 0.3; const dLp = ctx.createBiquadFilter(); dLp.type = 'lowpass'; dLp.frequency.value = 3500;
    const dOut = ctx.createGain(); dOut.gain.value = 0.22;
    delay.connect(dLp); dLp.connect(fb); fb.connect(delay); dLp.connect(dOut); dOut.connect(master);
    const bus = {};
    for (const id in LAYERS) { const g = ctx.createGain(); g.gain.value = 0; g.connect(master); bus[id] = g; }
    ['keys', 'pad', 'bell', 'choir', 'swell'].forEach(id => bus[id].connect(verbSend));
    ['keys', 'bell'].forEach(id => bus[id].connect(delay));
    const sv = ctx.createGain(); sv.gain.value = 0.2; bus.snare.connect(sv); sv.connect(verbSend);
    const wobble = ctx.createGain(); wobble.gain.value = 7;
    const wl = ctx.createOscillator(); wl.frequency.value = 0.35; wl.connect(wobble); wl.start(0);
    const in808 = ctx.createGain(), pre808 = ctx.createGain(); pre808.gain.value = 1.2;
    const s808 = shaper(2.2), lp808 = ctx.createBiquadFilter(), g808 = ctx.createGain();
    lp808.type = 'lowpass'; lp808.frequency.value = 1400; g808.gain.value = 0.85;
    in808.connect(pre808); pre808.connect(s808); s808.connect(lp808); lp808.connect(g808); g808.connect(bus.b808);
    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = alea() * 2 - 1; }
    return { bus, verbSend, delay, wobble, in808, pre808, noiseBuf, last808: null };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    const speed = VIT[Math.max(1, Math.min(5, p)) - 1], sd = 60 / BPM / 4, bus = kit.bus;
    for (const id in LAYERS) bus[id].gain.setValueAtTime(LAYERS[id](speed), t0);
    kit.pre808.gain.setValueAtTime(1.2 + speed * 2, t0);
    const env = (g, t, peak, a, dur) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); };
    const noise = (t, dest, type, freq, q, peak, dur) => { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = kit.noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q; env(g, t, peak, 0.002, dur);
      s.connect(f); f.connect(g); g.connect(dest); s.start(t, alea() * 1.2); s.stop(t + dur + 0.02); };
    const ep = (t, midi, dur, dest, peak, sigh) => { const f = mtof(midi);
      const car = ctx.createOscillator(), mod = ctx.createOscillator(), tine = ctx.createOscillator();
      const mg = ctx.createGain(), tg = ctx.createGain(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      car.frequency.value = f; mod.frequency.value = f; tine.frequency.value = f * 14;
      mg.gain.setValueAtTime(f * 2.2, t); mg.gain.exponentialRampToValueAtTime(f * 0.3, t + 0.6);
      tg.gain.setValueAtTime(f * 0.5, t); tg.gain.exponentialRampToValueAtTime(1, t + 0.06);
      mod.connect(mg); mg.connect(car.frequency); tine.connect(tg); tg.connect(car.frequency); kit.wobble.connect(car.detune);
      lp.type = 'lowpass'; lp.frequency.value = 4200; const rel = Math.max(dur, 0.25) + 0.9;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.004);
      g.gain.exponentialRampToValueAtTime(peak * 0.35, t + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + rel);
      if (sigh) { car.frequency.setValueAtTime(f, t + dur * 0.6); car.frequency.exponentialRampToValueAtTime(f * 0.944, t + dur); }
      car.connect(lp); lp.connect(g); g.connect(dest); [car, mod, tine].forEach(o => { o.start(t); o.stop(t + rel + 0.05); }); };
    const pad = (t, chord, dur) => { const f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'lowpass'; f.frequency.value = 1600;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.03, t + 0.6); g.gain.setValueAtTime(0.03, t + dur - 0.2); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.4);
      chord.forEach(m => [-1, 1].forEach(side => { const o = ctx.createOscillator(), pn = ctx.createStereoPanner();
        o.type = 'triangle'; o.frequency.value = mtof(m + 12); o.detune.value = side * 8; pn.pan.value = side * 0.6;
        o.connect(pn); pn.connect(f); o.start(t); o.stop(t + dur + 0.45); })); f.connect(g); g.connect(bus.pad); };
    const choir = (t, chord, dur) => { const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 0.8); g.gain.setValueAtTime(0.05, t + dur - 0.3); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.5);
      const sum = ctx.createGain();
      [[750, 1, 5], [1150, 0.45, 6], [2800, 0.08, 6]].forEach(([fr, lv, q]) => { const bp = ctx.createBiquadFilter(), fg = ctx.createGain();
        bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = q; fg.gain.value = lv; sum.connect(bp); bp.connect(fg); fg.connect(g); });
      chord.forEach(m => [-6, 6].forEach(dt => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m + 12); o.detune.value = dt;
        o.connect(sum); o.start(t); o.stop(t + dur + 0.55); })); g.connect(bus.choir); };
    const b808 = (t, midi, dur, from) => { const o = ctx.createOscillator(), g = ctx.createGain();
      if (from !== null) { o.frequency.setValueAtTime(mtof(from), t); o.frequency.exponentialRampToValueAtTime(mtof(midi), t + 0.08); }
      else o.frequency.setValueAtTime(mtof(midi), t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.7, t + 0.006); g.gain.setValueAtTime(0.7, t + dur - 0.03); g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(kit.in808); o.start(t); o.stop(t + dur + 0.02); };
    const kick = t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.05);
      env(g, t, 0.7, 0.002, 0.13); o.connect(g); g.connect(bus.kick); o.start(t); o.stop(t + 0.15); };
    const snare = t => { noise(t, bus.snare, 'bandpass', 1800, 0.7, 0.35, 0.16);
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(170, t + 0.06);
      env(g, t, 0.3, 0.002, 0.08); o.connect(g); g.connect(bus.snare); o.start(t); o.stop(t + 0.1); };
    const reverse = (t, midi, dur) => { const f = mtof(midi), car = ctx.createOscillator(), mod = ctx.createOscillator();
      const mg = ctx.createGain(), g = ctx.createGain(), lp = ctx.createBiquadFilter(); car.frequency.value = f; mod.frequency.value = f;
      mg.gain.setValueAtTime(f * 0.3, t); mg.gain.exponentialRampToValueAtTime(f * 2, t + dur); mod.connect(mg); mg.connect(car.frequency);
      lp.type = 'lowpass'; lp.frequency.value = 3500;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + dur); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.01);
      car.connect(lp); lp.connect(g); g.connect(bus.keys); [car, mod].forEach(o => { o.start(t); o.stop(t + dur + 0.02); }); };
    const swell = (t, chord, dur) => { const f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'lowpass'; f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2500, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.04, t + dur); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.02);
      chord.forEach(m => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m + 12); o.connect(f); o.start(t); o.stop(t + dur + 0.05); });
      f.connect(g); g.connect(bus.swell); };

    for (let m = m0; m < m0 + n; m++) for (let i = 0; i < 16; i++) {
      const s = m * 16 + i, t = t0 + ((m - m0) * 16 + i) * sd;
      const bar = m % 4, bar8 = m % 8, chord = CHORDS[bar];
      const brk = bar8 === 7 && i >= 8 && speed > 0.2;   // fin de cycle : batterie et 808 se taisent 2 temps
      if (i === 0) { pad(t, chord, sd * 16); choir(t, chord, sd * 16); }
      MELODY[bar8].forEach(([st, mm, len]) => { if (st === i) ep(t, mm, sd * len, bus.keys, 0.12, len >= 6); });
      if (i === 0) ep(t, chord[0] + 12, sd * 8, bus.keys, 0.05);
      if (s % 3 === 0) ep(t, POLY[(s / 3) % 3], sd * 2, bus.bell, 0.035);
      if (bar === 3 && i === 8) { reverse(t, bar8 === 7 ? 81 : 74, sd * 8); swell(t, CHORDS[0], sd * 8); }
      if (alea() < 0.25) noise(t, bus.vinyl, 'highpass', 2500, 0.5, 0.012, 0.004);
      if (!brk) {
        if (i % 2 === 0) {
          const idx = (bar * 8 + i / 2) % 32; let note = BASS[idx];
          if (note !== null && bar8 >= 4 && idx % 8 === 7) note += 12;
          if (note !== null) { let len = 1; while (BASS[(idx + len) % 32] === null && len < 8) len++;
            b808(t, note, sd * 2 * len, kit.last808); kit.last808 = note; }
        }
        if (KICKS[bar % 2].has(i) || (i === 14 && speed > 0.6)) kick(t);
        if (i === 4 || i === 12) snare(t);
        if ((i === 7 || i === 15) && speed > 0.3) noise(t, bus.snare, 'bandpass', 1800, 0.7, 0.06, 0.06);
        if (i % 2 === 0 || speed > 0.35) noise(t, bus.hats, 'highpass', 7000, 0.7, (i % 2 ? 0.025 : 0.045) * (0.8 + alea() * 0.4), 0.025);
        if (bar % 2 === 1 && i >= 12) for (let k = 1; k < 3; k++) noise(t + k * sd / 3, bus.rolls, 'highpass', 8000, 0.7, 0.025 + (i - 12) * 0.005, 0.02);
        if (i === 3 || i === 11) noise(t, bus.perc, 'bandpass', 3200, 2, 0.12, 0.03);
        if (i === 6 || i === 14) noise(t, bus.perc, 'bandpass', 5000, 1, 0.05, 0.06);
      } else kit.last808 = null;
    }
  }

  return {
    titre: 'MOTEUR GLISSE', bpm: BPM, mesures: 8, ton: 'ré mineur', auteur: 'Léo (Claude chat)',
    paliers: [
      'Le groove complet : Rhodes, nappe, 808 qui glisse, grosse caisse, caisse claire, charleys.',
      '+ la boîte à musique en 3 contre 4, charleys en doubles croches, caisse claire fantôme.',
      '+ roulements de charleys, percussions, une grosse caisse de plus, 808 plus saturée.',
      '+ le chœur « aah ».',
      'Tout dehors : + la montée de cordes à chaque fin de phrase, 808 au maximum.'],
    preparer, jouer };
})();
</script>

<!-- ======================= L'ÉCOUTE (libre : ce que voit celui qui ouvre le fichier) ======================= -->
<script>
(function () {
  let ctx = null, kit = null, p = 1, m = 0, tNext = 0, iv = 0;
  let graine = 12345; const alea = () => { graine = (graine * 1664525 + 1013904223) >>> 0; return graine / 4294967296; };
  const mes = 240 / MORCEAU.bpm;
  const pals = document.getElementById('pals'), ce = document.getElementById('ce'), play = document.getElementById('play');
  const maj = () => { [...pals.children].forEach((b, i) => b.classList.toggle('on', i + 1 === p)); ce.textContent = 'Palier ' + p + ' · ' + MORCEAU.paliers[p - 1]; };
  for (let i = 1; i <= 5; i++) { const b = document.createElement('button'); b.textContent = i; b.onclick = () => { p = i; maj(); }; pals.appendChild(b); }
  play.onclick = () => {
    if (iv) { clearInterval(iv); iv = 0; ctx.close(); ctx = null; play.textContent = 'PLAY'; return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)(); kit = MORCEAU.preparer(ctx, ctx.destination, alea);
    m = 0; tNext = ctx.currentTime + 0.1; play.textContent = 'STOP';
    iv = setInterval(() => { while (tNext < ctx.currentTime + 0.4) { MORCEAU.jouer(ctx, kit, p, tNext, m, 1, alea); tNext += mes; m++; } }, 60);
  };
  maj();
})();
</script>
</body></html>
