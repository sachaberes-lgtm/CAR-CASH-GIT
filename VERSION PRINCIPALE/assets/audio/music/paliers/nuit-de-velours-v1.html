<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuit de velours v1 — morceau à paliers</title>
<style>
:root{--fond:#fff;--tx:#17141c;--tx2:#8a8494;--fil:#e4e1ea;--acc:#5b3fd6}
@media (prefers-color-scheme:dark){:root{--fond:#0d0b12;--tx:#f2f0f7;--tx2:#9a94a8;--fil:#2a2633;--acc:#8f7bff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:16px}
.boite{width:100%;max-width:560px;border:1px solid var(--fil);border-radius:20px;padding:24px;display:grid;gap:18px}
h1{margin:0;font-size:22px}.sous{color:var(--tx2);font-size:13px;margin-top:4px}
.rang{display:flex;gap:16px;align-items:center}
#play{width:72px;height:72px;border-radius:50%;border:0;background:var(--tx);color:var(--fond);font-weight:700;cursor:pointer;flex:none}
.pals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1}
.pals button{border:1px solid var(--fil);background:none;color:var(--tx);border-radius:12px;padding:12px 0;font:inherit;font-weight:700;cursor:pointer}
.pals button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ce{color:var(--tx2);font-size:13px;min-height:36px}
</style></head><body>
<div class="boite">
  <div><h1>NUIT DE VELOURS</h1><div class="sous">morceau à paliers · french touch de nuit, vaporwave · 110 BPM · fa mineur · intro de 4 mesures, puis le palier choisi</div></div>
  <div class="rang"><button id="play">PLAY</button><div class="pals" id="pals"></div></div>
  <div id="ce"></div>
</div>

<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers », avec INTRO) =======================
     Léo (2026-10-12) : « la musique french touch, mais version nuit, plus night, dark mais pas trop grave ni trop aigu, harmonieux,
     plus vaporwave » · « ça commence intro, puis palier 1… ».
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime.
     Le jeu l'extrait tel quel et le rend hors temps réel : l'intro (p = 0) une fois, puis les paliers 1 à 5 en boucle. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 110, SD = 60 / BPM / 4, MES = 16 * SD, PHR = 8 * MES;
  // ⚠ toute ondulation lente fait un nombre ENTIER de tours par phrase de 8 mesures (k / PHR) : sinon la boucle ne retombe
  // pas sur elle-même et une nappe tenue claque au bouclage (mesuré : saut de 0,21 au palier 4 avec 0,31 Hz).
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // LA GRILLE DE NUIT (fa mineur) — Réb maj9 · Do7(b9) · Fa m9 · Mib m9 | Lab13, puis la réponse qui finit sur Sib m11 | Do7(b9).
  // Voicings SERRÉS dans le médium (mib3 → sol4) : ni grave qui bave, ni aigu qui pique ; chaque voix bouge d'un ton au plus.
  const AC = {
    Db:  { b: 37, v: [53, 56, 60, 63] },  // Réb maj9  : fa · lab · do · mib
    C7:  { b: 36, v: [52, 55, 58, 61] },  // Do7(b9)   : mi · sol · sib · réb
    Fm:  { b: 41, v: [51, 56, 60, 67] },  // Fa m9     : mib · lab · do · sol
    Ebm: { b: 39, v: [54, 58, 61, 65] },  // Mib m9    : solb · sib · réb · fa
    Ab:  { b: 44, v: [54, 58, 60, 65] },  // Lab13     : solb · sib · do · fa
    Bbm: { b: 34, v: [51, 56, 61, 65] },  // Sib m11   : mib · lab · réb · fa
  };
  const GRILLE = [['Db', 'Db'], ['C7', 'C7'], ['Fm', 'Fm'], ['Ebm', 'Ab'], ['Db', 'Db'], ['C7', 'C7'], ['Fm', 'Fm'], ['Bbm', 'C7']];
  const INTRO = [4, 5, 6, 7];   // l'intro joue les accords de la RÉPONSE : sa dernière mesure (Sib m11 | Do7) mène pile à la mesure 1

  // LE MOTIF (mesures 1-2) et sa réponse (5-8) — [double croche, note, durée] ; tout entre réb4 et mib5
  const MELODIE = [
    [[0, 72, 3], [3, 68, 3], [6, 65, 4], [12, 63, 2], [14, 65, 2]],
    [[0, 64, 6], [6, 67, 2], [8, 70, 4], [12, 68, 2], [14, 67, 2]],
    [[0, 67, 6], [8, 68, 2], [10, 67, 2], [12, 65, 4]],
    [[0, 66, 4], [4, 65, 2], [6, 61, 2], [8, 63, 6]],
    [[0, 72, 3], [3, 68, 3], [6, 65, 2], [8, 68, 2], [10, 72, 2], [12, 75, 4]],
    [[0, 73, 4], [4, 72, 2], [6, 70, 2], [8, 67, 4], [12, 64, 4]],
    [[0, 65, 4], [4, 67, 2], [6, 68, 6], [12, 72, 2], [14, 68, 2]],
    [[0, 70, 4], [4, 68, 2], [6, 65, 2], [8, 64, 2], [10, 67, 2], [12, 70, 2], [14, 73, 2]]];   // Do7 en montée → réb5 qui tombe sur do5
  const RELANCE = [[8, 64, 2], [10, 67, 2], [12, 70, 2], [14, 73, 2]];   // la fin de l'intro : la même montée, seule dans le vide

  // LA BASSE FUNKY (sur les contretemps, elle laisse les temps à la grosse caisse) — [pas, degré, durée, force]
  const BASSE1 = [[2, 0, 2, 1], [6, 0, 1, .85], [7, 12, 1, .7], [10, 0, 2, 1], [13, 7, 1, .75], [14, 12, 2, .85]];
  const BASSE2 = [[0, 0, 1, .5], [5, 12, 1, .5], [11, 12, 1, .55]];           // P2 : les notes fantômes
  // L'ACCORD HACHÉ (la signature french touch) : 3 · 3 · 4 · 3 · 3 — [pas, durée, force]
  const STAB1 = [[0, 2.5, 1], [3, 2.5, .85], [6, 3, .95], [10, 2.5, .85], [13, 2.5, .8]];
  const STAB2 = [[8, 1, .45], [15, 1, .45]];
  const ARP = [0, 1, 2, 3, 1, 2, 3, 2];

  // CE QUE CHAQUE PALIER POUSSE — [intro, P1, P2, P3, P4, P5]
  const NIV = {
    kick:   [1, 1, 1, 1.05, 1.15, 1.2],
    clap:   [.85, .85, .9, .95, 1.05, 1.1],
    caisse: [0, 0, 0, 0, 1, 1.1],
    hatO:   [.8, .8, .85, .9, .95, 1],
    hat:    [0, 0, 1, 1, 1.05, 1.1],
    shaker: [0, 0, 0, 1, 1, 1.05],
    crash:  [0, 0, 0, 0, 1, 1],
    vinyle: [1, 1, 1, 1, .9, .8],
    basse:  [1, 1, 1.05, 1.1, 1.15, 1.2],
    rond:   [0, 0, 0, 0, 0, 1],
    nappe:  [1.1, 1, 1, 1, .95, .9],
    stab:   [1, 1, 1.05, 1.1, 1.1, 1.15],
    choeur: [0, 0, 0, 0, 0, 1],
    arp:    [0, 0, 0, 1, 1, 1.1],
    lead:   [.75, .5, .55, .62, 1, 1.05],
    leadBas:[0, 0, 0, 0, 0, 1],
    envers: [1, 0, 0, 0, 1, 1],
  };
  const STAB_F = [1300, 1300, 1700, 2150, 2650, 3300];   // le filtre des accords hachés s'ouvre avec le moteur
  const NAPPE_F = [800, 800, 900, 1050, 1200, 1400];
  const BRIL_B = [1, 1, 1.15, 1.25, 1.35, 1.45];        // la basse claque un peu plus
  const PROF = [.5, .5, .45, .42, .38, .35];            // la profondeur du pompage (plus bas = plus profond)

  function preparer(ctx, sortie, alea) {
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };

    // LE BOUT DE LA CHAÎNE : chaleur de bande, aigus adoucis (vaporwave), le filtre de l'intro, la colle, le limiteur
    const sat = ctx.createWaveShaper(); { const c = new Float32Array(2048);
      for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(1.2 * x) / Math.tanh(1.2); } sat.curve = c; sat.oversample = '2x'; }
    const master = G(0.5), doux = F('highshelf', 6000); doux.gain.value = -4;
    const filtre = F('lowpass', 20000, 0.7);
    const colle = ctx.createDynamicsCompressor(); colle.threshold.value = -18; colle.ratio.value = 2.5; colle.attack.value = 0.012; colle.release.value = 0.22; colle.knee.value = 8;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -2; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.1; lim.knee.value = 0;
    chaine(master, F('highpass', 30, 0.7), doux, F('lowpass', 10500, 0.5), sat, filtre, colle, lim, sortie);

    // LA SALLE : une grande réverbe dont la queue s'assombrit (une nuit humide), 3,2 s
    const ir = (sec, pre) => { const sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr), p0 = Math.floor(sr * pre);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let y = 0;
        for (let i = p0; i < n; i++) { const t = (i - p0) / sr, fc = 1400 + 5600 * Math.exp(-t / 0.5), a = Math.exp(-2 * Math.PI * fc / sr);
          y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.exp(-6.9 * t / sec); } }
      return b; };
    const rev = ctx.createConvolver(); rev.buffer = ir(3.2, 0.02);
    const revIn = G(1);
    chaine(revIn, rev, F('highpass', 220, 0.7), F('lowpass', 5200, 0.6), G(0.42), master);

    // L'ÉCHO EN PING-PONG (croche pointée)
    const dIn = G(1), dl = ctx.createDelay(1), dr = ctx.createDelay(1); dl.delayTime.value = dr.delayTime.value = 3 * SD;
    const dHp = F('highpass', 280, 0.6), dLp = F('lowpass', 2600, 0.6), fb = G(0.38), dOut = G(0.3);
    const pl = ctx.createStereoPanner(), pr = ctx.createStereoPanner(); pl.pan.value = -0.7; pr.pan.value = 0.7;
    chaine(dIn, dHp, dl, dLp, pl, dOut); dLp.connect(dr); dr.connect(pr); pr.connect(dOut); dr.connect(fb); fb.connect(dl);
    dOut.connect(master); const dRev = G(0.25); dOut.connect(dRev); dRev.connect(revIn);

    // LE CHORUS (deux lignes à retard qui ondulent, à gauche et à droite) : la largeur des nappes vaporwave
    const chorus = dest => { const inp = G(1), sec = G(0.75); inp.connect(sec); sec.connect(dest);
      [[-0.85, 6 / PHR, 0.011], [0.85, 9 / PHR, 0.017]].forEach(([pan, vit, base]) => {
        const d = ctx.createDelay(0.05); d.delayTime.value = base;
        const l = ctx.createOscillator(); l.frequency.value = vit; const lg = G(0.0028); l.connect(lg); lg.connect(d.delayTime); l.start(0);
        const p = ctx.createStereoPanner(); p.pan.value = pan; const g = G(0.6);
        chaine(inp, d, g, p, dest); });
      return inp; };

    // LA BANDE QUI PLEURE : une ligne à retard qui ondule (±7 cents, lente, + un petit tremblement) — tout ce qui chante y passe,
    // la basse et la batterie non (le bas reste droit). Une seule ligne au lieu d'un fil vers chaque oscillateur : 10× moins de calcul.
    const bande = ctx.createDelay(0.05); bande.delayTime.value = 0.006; bande.connect(master);
    [[5 / PHR, 0.0024], [82 / PHR, 0.00004]].forEach(([f, a]) => { const o = ctx.createOscillator(); o.frequency.value = f; const g = G(a); o.connect(g); g.connect(bande.delayTime); o.start(0); });

    // LE POMPAGE (la grosse caisse creuse les accords et la basse) : deux gains que `jouer` fait respirer à chaque temps
    const pompe = G(1), pompeB = G(1); pompe.connect(bande); pompeB.connect(master);
    const chP = chorus(pompe);
    const bus = {};
    const mk = (id, dest, rv, dly, pan) => { const g = G(0); let o = g;
      if (pan) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); o = p; }
      o.connect(dest);
      if (rv) { const s = G(rv); o.connect(s); s.connect(revIn); }
      if (dly) { const s = G(dly); o.connect(s); s.connect(dIn); }
      bus[id] = g; };
    mk('kick', master); mk('clap', master, .22); mk('caisse', master, .15); mk('hatO', master, .06, 0, .18); mk('hat', master, 0, 0, -.22);
    mk('shaker', master, .05, 0, .35); mk('crash', master, .25, 0, -.1); mk('vinyle', master);
    mk('basse', pompeB); mk('rond', pompeB);
    mk('nappe', chP, .4); mk('stab', chP, .16, .1); mk('choeur', chP, .55);
    mk('arp', pompe, .25, .38); mk('lead', bande, .28, .26); mk('leadBas', bande, .2, .08); mk('envers', bande, .3);

    const bruit = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    { const d = bruit.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = alea() * 2 - 1; }
    return { bus, pompe, pompeB, filtre, bruit, last: { m: null, fin: -1 }, courbes: {} };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    p = Math.max(0, Math.min(5, p | 0));
    const b = kit.bus, intro = p === 0;
    for (const id in NIV) b[id].gain.setValueAtTime(NIV[id][p], t0);
    const fq = kit.filtre.frequency, fQ = kit.filtre.Q;
    if (!intro) { fq.setValueAtTime(20000, t0); fQ.setValueAtTime(0.7, t0); }

    // ---- les instruments ----
    const env = (g, t, v, a, fin) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + fin); };
    const bruit = (t, dest, type, f, q, v, dur, att) => { const s = ctx.createBufferSource(), fl = filt(type, f, q), g = ctx.createGain();
      s.buffer = kit.bruit; env(g, t, v, att || 0.001, dur);
      s.connect(fl); fl.connect(g); g.connect(dest); s.start(t, alea() * 1.5); s.stop(t + dur + 0.02); };
    const kr = (...ps) => ps.forEach(x => { try { x.automationRate = 'k-rate'; } catch (e) {} });
    const filt = (type, f, q) => { const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; kr(fl.frequency, fl.Q); return fl; };
    const osc = (type, f, dt) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; if (dt) o.detune.value = dt; return o; };
    const courbe = d => { const k = d.toFixed(3); if (kit.courbes[k]) return kit.courbes[k];
      const N = 48, c = new Float32Array(N);
      for (let i = 0; i < N; i++) { const x = i / (N - 1); c[i] = x < .03 ? 1 - (1 - d) * (x / .03) : 1 - (1 - d) * Math.exp(-(x - .03) / .2); }
      return (kit.courbes[k] = c); };
    const pompe = t => { kit.pompe.gain.setValueCurveAtTime(courbe(PROF[p]), t, 4 * SD * 0.97);
      kit.pompeB.gain.setValueCurveAtTime(courbe(1 - (1 - PROF[p]) * 0.55), t, 4 * SD * 0.97); };

    const kick = (t, v) => { const o = osc('sine', 130), g = ctx.createGain();
      o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(52, t + 0.07);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.95 * v, t + 0.002); g.gain.setValueAtTime(0.95 * v, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34); o.connect(g); g.connect(b.kick); o.start(t); o.stop(t + 0.36);
      bruit(t, b.kick, 'highpass', 2500, 0.7, 0.09 * v, 0.006); };
    const clap = (t, v) => { [0, 0.011, 0.023].forEach(d => bruit(t + d, b.clap, 'bandpass', 1300, 0.55, 2.4 * v, 0.022));
      bruit(t + 0.03, b.clap, 'bandpass', 1200, 0.5, 2.0 * v, 0.34); };
    const caisse = t => { const o = osc('triangle', 210), g = ctx.createGain();
      o.frequency.setValueAtTime(210, t); o.frequency.exponentialRampToValueAtTime(160, t + 0.05);
      env(g, t, 0.5, 0.002, 0.13); o.connect(g); g.connect(b.caisse); o.start(t); o.stop(t + 0.15);
      bruit(t, b.caisse, 'highpass', 1800, 0.7, 0.6, 0.2); };
    const hatO = (t, v) => bruit(t, b.hatO, 'highpass', 7000, 0.8, 0.6 * v, 0.24);
    const hat = (t, v) => bruit(t, b.hat, 'highpass', 8000, 0.8, 0.55 * v, 0.045);
    const shaker = (t, v) => bruit(t, b.shaker, 'bandpass', 5600, 1.2, 0.55 * v, 0.09, 0.012);
    const crash = t => bruit(t, b.crash, 'highpass', 3800, 0.6, 0.35, 2.2, 0.003);
    const craque = t => { if (alea() < 0.32) bruit(t + alea() * SD, b.vinyle, 'bandpass', 2400 + alea() * 2400, 0.8, 0.016 + alea() * 0.04, 0.005); };

    const basse = (t, midi, len, v) => { const f = mtof(midi), d = Math.max(len * SD - 0.02, 0.06);
      const o1 = osc('sawtooth', f), o2 = osc('square', f, 6), o3 = osc('sine', f), mix = ctx.createGain(), rnd = ctx.createGain();
      const fl = filt('lowpass', 320, 6), g = ctx.createGain(); mix.gain.value = 0.5; rnd.gain.value = 0.55;
      fl.frequency.setValueAtTime(240 + 1700 * v * BRIL_B[p], t); fl.frequency.exponentialRampToValueAtTime(320, t + 0.16);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3 * v, t + 0.004); g.gain.setValueAtTime(0.3 * v, t + d);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.06);
      o1.connect(mix); o2.connect(mix); mix.connect(fl); fl.connect(g); o3.connect(rnd); rnd.connect(g); g.connect(b.basse);
      [o1, o2, o3].forEach(o => { o.start(t); o.stop(t + d + 0.08); }); };
    const rond = (t, midi, len) => { const o = osc('sine', mtof(midi)), g = ctx.createGain(), d = len * SD;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28, t + 0.01); g.gain.setValueAtTime(0.28, t + d - 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(b.rond); o.start(t); o.stop(t + d + 0.02); };

    const nappe = (t, voix, dur) => { const fl = filt('lowpass', NAPPE_F[p], 0.8), g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 0.25); g.gain.setValueAtTime(0.05, t + dur - 0.05); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.35);
      voix.forEach(m => [-9, 9].forEach(dt => { const o = osc('sawtooth', mtof(m), dt); o.connect(fl); o.start(t); o.stop(t + dur + 0.4); }));
      fl.connect(g); g.connect(b.nappe); };
    const stab = (t, voix, len, v) => { const fc = STAB_F[p], fl = filt('lowpass', fc, 2.5), g = ctx.createGain(), d = len * SD;
      fl.frequency.setValueAtTime(fc * 2.2, t); fl.frequency.exponentialRampToValueAtTime(fc, t + 0.14);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.13 * v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.07 * v, t + d * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.09);
      voix.forEach(m => [-10, 10].forEach(dt => { const o = osc('sawtooth', mtof(m), dt); o.connect(fl); o.start(t); o.stop(t + d + 0.12); }));
      fl.connect(g); g.connect(b.stab); };
    const arp = (t, midi, v) => { const f = mtof(midi), o1 = osc('sawtooth', f), o2 = osc('triangle', f, 4), fl = filt('lowpass', 700, 5), g = ctx.createGain();
      fl.frequency.setValueAtTime(3200, t); fl.frequency.exponentialRampToValueAtTime(700, t + 0.12);
      env(g, t, 0.14 * v, 0.003, 0.22); o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(b.arp);
      [o1, o2].forEach(o => { o.start(t); o.stop(t + 0.24); }); };
    const choeur = (t, voix, dur) => { const somme = ctx.createGain(), g = ctx.createGain();
      [[420, 1, 6], [820, 0.5, 7], [2700, 0.07, 6]].forEach(([fr, lv, q]) => { const bp = filt('bandpass', fr, q), fg = ctx.createGain(); fg.gain.value = lv; somme.connect(bp); bp.connect(fg); fg.connect(g); });
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.14, t + 0.5); g.gain.setValueAtTime(0.14, t + dur - 0.1); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.45);
      voix.forEach(m => [-7, 7].forEach(dt => { const o = osc('sawtooth', mtof(m), dt); o.connect(somme); o.start(t); o.stop(t + dur + 0.5); }));
      g.connect(b.choeur); };
    const envers = (t, voix, dur) => { const fl = filt('lowpass', 350, 1.5), g = ctx.createGain();
      fl.frequency.setValueAtTime(350, t); fl.frequency.exponentialRampToValueAtTime(2600, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + dur - 0.01); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.012);
      voix.forEach(m => [-8, 8].forEach(dt => { const o = osc('sawtooth', mtof(m), dt); o.connect(fl); o.start(t); o.stop(t + dur + 0.03); }));
      fl.connect(g); g.connect(b.envers); };
    // LA VOIX DE VELOURS : un triangle chaud (la mélodie de VAPEUR), un soupçon de scie filtrée, vibrato qui vient tard, glissé entre notes liées
    const lead = (t, midi, len, v) => { const f = mtof(midi), d = len * SD, last = kit.last;
      const lie = last.m != null && Math.abs(last.fin - t) < 0.012, f0 = lie ? mtof(last.m) : f;
      const o1 = osc('triangle', f), o2 = osc('sawtooth', f, -5), o3 = osc('sine', f * 2), fl = filt('lowpass', 1700, 0.9), g = ctx.createGain();
      const m1 = ctx.createGain(), m2 = ctx.createGain(), m3 = ctx.createGain(); m1.gain.value = 1; m2.gain.value = 0.22; m3.gain.value = 0.18;
      [o1, o2, o3].forEach((o, k) => { const fr = f * (k === 2 ? 2 : 1), f0k = f0 * (k === 2 ? 2 : 1);
        kr(o.frequency, o.detune); o.frequency.setValueAtTime(f0k, t); if (lie) o.frequency.exponentialRampToValueAtTime(fr, t + 0.05); });
      if (d > 0.3) { const vb = osc('sine', 5.2), vg = ctx.createGain(); vg.gain.setValueAtTime(0, t); vg.gain.setValueAtTime(0, t + 0.2);
        vg.gain.linearRampToValueAtTime(12, t + 0.55); vb.connect(vg); [o1, o2, o3].forEach(o => vg.connect(o.detune)); vb.start(t); vb.stop(t + d + 0.2); }
      fl.frequency.setValueAtTime(2600, t); fl.frequency.exponentialRampToValueAtTime(1700, t + 0.25);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.36 * v, t + (lie ? 0.02 : 0.03)); g.gain.exponentialRampToValueAtTime(0.27 * v, t + 0.3);
      g.gain.setValueAtTime(0.27 * v, t + Math.max(d, 0.31)); g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(d, 0.31) + 0.16);
      o1.connect(m1); o2.connect(m2); o3.connect(m3); [m1, m2, m3].forEach(x => x.connect(fl)); fl.connect(g); g.connect(b.lead);
      [o1, o2, o3].forEach(o => { o.start(t); o.stop(t + Math.max(d, 0.31) + 0.2); });
      kit.last = { m: midi, fin: t + d }; };
    const leadBas = (t, midi, len) => { const f = mtof(midi), d = len * SD, o1 = osc('triangle', f), o2 = osc('sawtooth', f, 6), fl = filt('lowpass', 1100, 0.7), g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.03); g.gain.setValueAtTime(0.09, t + Math.max(d, 0.2));
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(d, 0.2) + 0.15);
      o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(b.leadBas); [o1, o2].forEach(o => { o.start(t); o.stop(t + Math.max(d, 0.2) + 0.18); }); };

    // ---- les mesures ----
    for (let m = m0; m < m0 + n; m++) {
      const tm = t0 + (m - m0) * MES, im = Math.max(0, Math.min(INTRO.length - 1, m));
      const bar = intro ? INTRO[im] : m % 8, acc = GRILLE[bar], A1 = AC[acc[0]], A2 = AC[acc[1]], split = acc[0] !== acc[1];
      const A = i => i < 8 ? A1 : A2;
      // l'intro : la boucle « derrière la porte » — le filtre s'ouvre mesure après mesure ; la grosse caisse entre à la 2e,
      // claps et charleys à la 3e ; la 2e moitié de la 4e se vide (la nappe, l'accord à l'envers, la montée de la mélodie) et ça part
      const batt = !intro || im >= 1, haut = !intro || im >= 2, vide = intro && im === 3;
      if (intro) {
        const F0 = [320, 560, 1050, 2300], F1 = [560, 1050, 2300, 6000];
        fq.setValueAtTime(F0[im], tm); fQ.setValueAtTime(2.6, tm);
        if (im < 3) fq.exponentialRampToValueAtTime(F1[im], tm + MES);
        else { fq.exponentialRampToValueAtTime(F1[3], tm + 6 * SD); fq.exponentialRampToValueAtTime(20000, tm + 8 * SD); fQ.linearRampToValueAtTime(0.7, tm + 8 * SD); }
      }

      if (p === 5) { choeur(tm, A1.v, split ? 8 * SD : MES); if (split) choeur(tm + 8 * SD, A2.v, 8 * SD); }
      if ((p >= 4 && bar === 7) || vide) envers(tm + 8 * SD, AC.Db.v, 8 * SD);   // l'accord de la reprise, à l'envers
      if (p >= 4 && bar === 0) crash(tm);

      for (let i = 0; i < 16; i++) {
        const t = tm + i * SD, a = A(i), coupe = vide && i >= 8;

        if (coupe) continue;
        if (batt) {
          if (i % 4 === 0 && !(bar === 7 && i === 12 && !intro)) { kick(t, intro && im === 1 ? 0.8 : 1); pompe(t); }   // la dernière grosse caisse de la phrase se tait : on respire
          if (haut) {
            if (i % 4 === 2) hatO(t, 1);
            if (i === 4 || i === 12) { clap(t, 1); if (p >= 4) caisse(t); }
          }

          if (p >= 3) shaker(t, (i % 2 ? 0.7 : 1) * (0.85 + alea() * 0.3));

        BASSE1.forEach(([s, dg, len, v]) => { if (s === i) { basse(t, a.b + dg, len, v); if (p === 5 && len >= 2) rond(t, a.b + dg, len); } });
        if (p >= 2) BASSE2.forEach(([s, dg, len, v]) => { if (s === i) basse(t, a.b + dg, len, v); });
        STAB1.forEach(([s, len, v]) => { if (s === i) stab(t, p === 5 ? a.v.concat([a.v[3] + 12]) : a.v, len, v); });
        if (p >= 2) STAB2.forEach(([s, len, v]) => { if (s === i) stab(t, a.v, len, v); });
        if (p >= 3) arp(t, a.v[ARP[i % 8]], i % 4 === 0 ? 1 : 0.7);
      }
      // la mélodie : en intro, seulement la montée de la fin ; aux paliers, tout le motif (discret aux P1-P3, devant au P4)
      (intro ? (vide ? RELANCE : []) : MELODIE[bar]).forEach(([s, mm, len]) => {
        lead(tm + s * SD, mm, len, s === 0 ? 1 : 0.9); if (p === 5) leadBas(tm + s * SD, mm - 12, len); });
    }
  }

  return {
    titre: 'NUIT DE VELOURS · V1', bpm: BPM, mesures: 8, intro: INTRO.length, ton: 'fa mineur', auteur: 'Claude Code pour Léo',
    style: 'french touch de nuit, vaporwave',
    introTxt: 'La boucle derrière la porte : le filtre s’ouvre mesure après mesure, la grosse caisse arrive, puis tout se tait deux temps et ça part.',
    paliers: [
      'Le groove complet : quatre temps, claps, charleys ouverts, basse funky, accords hachés filtrés qui pompent, la mélodie en retrait.',
      '+ charleys en doubles croches, basse plus bavarde, le filtre des accords s’ouvre.',
      '+ l’arpège qui rebondit en écho, le shaker, le filtre encore plus ouvert.',
      '+ la mélodie passe devant, caisse claire sous les claps, cymbale à chaque phrase, accord à l’envers avant la reprise.',
      'Tout dehors : + chœur « ooh », basse ronde, mélodie doublée à l’octave grave, accords grands ouverts.'],
    preparer, jouer };
})();

<script>
(function () {
  let ctx = null, kit = null, p = 1, m = 0, mi = 0, tNext = 0, iv = 0;
  let graine = 12345; const alea = () => { graine = (graine * 1664525 + 1013904223) >>> 0; return graine / 4294967296; };

  const maj = () => { [...pals.children].forEach((b, i) => b.classList.toggle('on', i + 1 === p));
    ce.textContent = iv && mi < NI ? 'Intro · ' + MORCEAU.introTxt + ' (puis palier ' + p + ')' : 'Palier ' + p + ' · ' + MORCEAU.paliers[p - 1]; };
  for (let i = 1; i <= 5; i++) { const b = document.createElement('button'); b.textContent = i; b.onclick = () => { p = i; maj(); }; pals.appendChild(b); }
  play.onclick = () => {
    if (iv) { clearInterval(iv); iv = 0; ctx.close(); ctx = null; play.textContent = 'PLAY'; maj(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)(); kit = MORCEAU.preparer(ctx, ctx.destination, alea);
    m = 0; mi = 0; tNext = ctx.currentTime + 0.1; play.textContent = 'STOP';
    iv = setInterval(() => { while (tNext < ctx.currentTime + 0.4) {
      if (mi < NI) MORCEAU.jouer(ctx, kit, 0, tNext, mi++, 1, alea); else MORCEAU.jouer(ctx, kit, p, tNext, m++, 1, alea);
      tNext += mes; } maj(); }, 60);
  };

})();
