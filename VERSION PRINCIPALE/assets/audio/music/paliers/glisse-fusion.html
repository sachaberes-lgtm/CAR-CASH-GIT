<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glisse fusion — morceau à paliers</title>
<style>
:root{--fond:#fff;--tx:#191416;--tx2:#8c8387;--fil:#e5e1e4;--acc:#8e1f3d}
@media (prefers-color-scheme:dark){:root{--fond:#0d0b0c;--tx:#f2eef0;--tx2:#9a9095;--fil:#2a2427;--acc:#c23a5c}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:16px}
.boite{width:100%;max-width:560px;border:1px solid var(--fil);border-radius:20px;padding:24px;display:grid;gap:18px}
h1{margin:0;font-size:22px}.sous{color:var(--tx2);font-size:13px;margin-top:4px}
.rang{display:flex;gap:16px;align-items:center}
#play{width:72px;height:72px;border-radius:50%;border:0;background:var(--tx);color:var(--fond);font-weight:700;cursor:pointer;flex:none}
.pals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.pals button{border:1px solid var(--fil);background:none;color:var(--tx);border-radius:12px;padding:12px 0;font:inherit;font-weight:700;cursor:pointer}
.pals button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ce{color:var(--tx2);font-size:13px;min-height:36px}
</style></head><body>
<div class="boite">
  <div><h1>GLISSE FUSION</h1><div class="sous">morceau à paliers · GLISSE (paliers 1-4) qui devient GLISSE v2 (paliers 5-8) · 104 BPM · ré mineur · 8 paliers, un tous les 4 moteurs</div></div>
  <div class="rang"><button id="play">PLAY</button><div class="pals" id="pals"></div></div>
  <div id="ce"></div>
</div>

<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     Léo (2026-10-13) : « fabrique-moi une fusion exacte de Glisse (la musique originale) et qui se finit en Glisse v2 à partir du milieu
     des paliers ; 8 paliers moteur ». Les deux moteurs sont ceux de musique-glisse.js et musique-glisse-v2.js, recopiés TELS QUELS
     (mêmes instruments, mêmes réglages, même grille Dm11 · Bbmaj7#11 · Gm9 · Asus4, même 808, mêmes rythmes) ; ce qui change pour entrer
     dans le système des paliers : (1) le TEMPO est fixe, 104 BPM (dans les originaux il glissait de 98 à 110 / 112 avec la vitesse — les
     paliers doivent tous avoir la même longueur pour changer pile sur la mesure) ; (2) chaque palier = une VITESSE figée de l'un des deux
     moteurs : P1-P4 = GLISSE à 0,22 · 0,32 · 0,45 · 0,56, P5-P8 = GLISSE v2 à 0,64 · 0,76 · 0,88 · 1 (choisies pour que ça monte toujours :
     la v2 à 0,5 aurait moins de couches que l'original à 0,8) ; (3) le hasard passe par alea (même rendu à chaque fois) ; (4) les
     ondulations lentes font un nombre entier de tours par phrase ; (5) les transitions de palier de la v2 (roulement / plongée) ne sont pas
     reprises : ici on passe d'une boucle figée à l'autre.
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 104, SD = 60 / BPM / 4, MES = 16 * SD, PHR = 8 * MES;
  const VIT_A = [0.22, 0.32, 0.45, 0.56], VIT_B = [0.64, 0.76, 0.88, 1.0];
  const clamp = v => Math.min(1, Math.max(0, v)), ramp = (s, a, b) => clamp((s - a) / (b - a));
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // ---- ce que les deux ont en commun ----
  const CHORDS = [[50, 53, 55, 60], [46, 50, 52, 57], [43, 46, 50, 57], [45, 50, 52, 57]];   // Dm11, Bbmaj7#11, Gm9, Asus4
  const BASS = [26, null, null, null, null, null, 28, 29, 22, null, null, null, 22, null, 24, 26,
                31, null, null, 29, null, null, 26, null, 33, null, null, null, 31, null, 28, 26];
  const KICKS = [new Set([0, 7, 10]), new Set([0, 3, 10, 13])];
  const POLY = [81, 76, 74];

  // ---- GLISSE (musique-glisse.js) ----
  const LAYERS_A = {
    keys: s => 1, pad: s => 1, vinyl: s => 1,
    b808: s => ramp(s, 0.05, 0.12), kick: s => ramp(s, 0.1, 0.18), snare: s => ramp(s, 0.15, 0.22), hats: s => ramp(s, 0.2, 0.28),
    bell: s => ramp(s, 0.35, 0.45), rolls: s => ramp(s, 0.45, 0.55), perc: s => ramp(s, 0.55, 0.62), choir: s => ramp(s, 0.65, 0.75), swell: s => ramp(s, 0.8, 0.9) };
  const MELODY_A = [
    [[0, 74, 3], [4, 72, 2], [6, 69, 6], [14, 76, 2]], [[0, 76, 4], [4, 74, 2], [6, 81, 6], [12, 76, 4]],
    [[0, 74, 2], [2, 77, 2], [4, 76, 4], [10, 74, 2], [12, 70, 4]], [[0, 69, 8], [10, 74, 2], [12, 76, 4]],
    [[0, 81, 6], [8, 79, 2], [10, 77, 2], [12, 76, 4]], [[0, 74, 8], [12, 72, 2], [14, 76, 2]],
    [[2, 77, 2], [4, 79, 2], [6, 81, 4], [12, 82, 4]], [[0, 81, 10], [12, 76, 4]]];

  // ---- GLISSE v2 (musique-glisse-v2.js) ----
  const LAYERS_B = {
    air: s => 1 - ramp(s, 0.45, 0.8), pad: s => 1, keys: s => 1, vinyl: s => 1 - 0.7 * ramp(s, 0.4, 0.8), shaker: s => 1,
    rim: s => 1 - 0.6 * ramp(s, 0.2, 0.3), b808: s => 0.5 + 0.5 * ramp(s, 0.1, 0.3), kick: s => ramp(s, 0.12, 0.2), snare: s => ramp(s, 0.2, 0.28),
    hats: s => ramp(s, 0.25, 0.32), bell: s => ramp(s, 0.35, 0.45), rolls: s => ramp(s, 0.45, 0.55), perc: s => ramp(s, 0.55, 0.62),
    choir: s => ramp(s, 0.6, 0.7), counter: s => ramp(s, 0.7, 0.78), arp: s => ramp(s, 0.78, 0.86), swell: s => ramp(s, 0.8, 0.9),
    sparkle: s => ramp(s, 0.9, 0.97), fills: s => 1 };
  const PUMPED_B = ['pad', 'choir', 'swell', 'arp'];
  const SCALE = new Set([2, 4, 5, 7, 9, 10, 0]);
  const inScale = m => SCALE.has(((m % 12) + 12) % 12);
  const stepScale = (m, d) => { let x = m + d; while (!inScale(x)) x += d; return x; };
  const MELODY_B = [
    [[0, 74, 2], [2, 72, 1], [3, 74, 2], [6, 77, 2], [8, 76, 3], [11, 74, 1], [12, 72, 2], [14, 69, 2]],
    [[0, 70, 2], [2, 74, 1], [3, 76, 3], [6, 77, 2], [8, 76, 2], [10, 74, 2], [12, 72, 4]],
    [[0, 74, 2], [2, 77, 2], [4, 79, 1], [5, 77, 1], [6, 76, 2], [8, 74, 3], [11, 72, 1], [12, 70, 2], [14, 72, 2]],
    [[0, 69, 3], [3, 72, 1], [4, 74, 4], [10, 76, 1], [11, 77, 1], [12, 76, 4]],
    [[0, 81, 3], [3, 79, 1], [4, 77, 2], [6, 79, 2], [8, 81, 2], [10, 84, 2], [12, 81, 4]],
    [[0, 82, 2], [2, 81, 2], [4, 79, 4], [10, 77, 1], [11, 79, 1], [12, 81, 4]],
    [[0, 79, 2], [2, 77, 1], [3, 79, 1], [4, 82, 2], [6, 81, 2], [8, 79, 3], [11, 77, 1], [12, 74, 4]],
    [[0, 76, 6], [8, 77, 2], [10, 76, 2], [12, 74, 2], [14, 72, 2]]];
  function elaborate(bar8, level) {   // la mélodie se complexifie par niveaux, sans jamais sortir de la gamme
    let notes = MELODY_B[bar8].map(n => n.slice());
    const nextFirst = MELODY_B[(bar8 + 1) % 8][0][1];
    if (level >= 1) { const out = []; notes.forEach((n, k) => { const nx = k + 1 < notes.length ? notes[k + 1][1] : nextFirst;
        if (n[2] >= 3) { out.push([n[0], n[1], 2]); out.push([n[0] + 2, stepScale(n[1], Math.sign(nx - n[1]) || 1), n[2] - 2]); } else out.push(n); }); notes = out; }
    if (level >= 2) { const out = []; notes.forEach((n, k) => { if (n[2] === 2 && k % 2 === 0) { out.push([n[0], n[1], 1]); out.push([n[0] + 1, stepScale(n[1], 1), 1]); } else out.push(n); }); notes = out; }
    if (level >= 3) { notes = notes.filter(n => n[0] < 12).map(n => [n[0], n[1], Math.min(n[2], 12 - n[0])]);
      let m = nextFirst; const run = []; for (let k = 0; k < 4; k++) { m = stepScale(m, -1); run.unshift(m); } run.forEach((x, k) => notes.push([12 + k, x, 1])); }
    return notes;
  }
  const SHAKER = [0.05, 0.02, 0.035, 0.02];

  // UN MOTEUR (v2 = false : GLISSE, v2 = true : GLISSE v2) : sa chaîne de son, ses instruments, son pas de double croche
  function moteur(ctx, sortie, alea, v2) {
    const LAYERS = v2 ? LAYERS_B : LAYERS_A;
    let R = alea;   // le hasard (remplace Math.random) — repris à chaque appel de jouer
    const shaper = k => { const ws = ctx.createWaveShaper(), c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1024 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } ws.curve = c; ws.oversample = '2x'; return ws; };
    const impulse = (len, power) => { const n = Math.floor(ctx.sampleRate * len), buf = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (alea() * 2 - 1) * Math.pow(1 - i / n, power); } return buf; };
    // la sortie (identique aux originaux) : chaleur, filtre sombre (fixe pour GLISSE, qui s'ouvre avec la vitesse pour la v2), compresseur
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    const warm = shaper(1.3), dark = ctx.createBiquadFilter(); dark.type = 'lowpass'; dark.frequency.value = 11000; dark.Q.value = 0.5;
    const master = ctx.createGain(); master.gain.value = 0.62;
    master.connect(warm); warm.connect(dark); dark.connect(comp); comp.connect(sortie);
    const verb = ctx.createConvolver(); verb.buffer = v2 ? impulse(3.2, 2.3) : impulse(2.8, 2.5);
    const vOut = ctx.createGain(); vOut.gain.value = 0.32; const vDark = ctx.createBiquadFilter(); vDark.type = 'lowpass'; vDark.frequency.value = 5000;
    verb.connect(vDark); vDark.connect(vOut); vOut.connect(master);
    const verbSend = ctx.createGain(); verbSend.connect(verb);
    const delay = ctx.createDelay(2); delay.delayTime.value = 60 / BPM / 2;   // écho calé sur la croche (tempo fixe)
    const fb = ctx.createGain(); fb.gain.value = 0.3; const dLp = ctx.createBiquadFilter(); dLp.type = 'lowpass'; dLp.frequency.value = 3500;
    const dOut = ctx.createGain(); dOut.gain.value = 0.22;
    delay.connect(dLp); dLp.connect(fb); fb.connect(delay); dLp.connect(dOut); dOut.connect(master);
    const pump = ctx.createGain(); pump.connect(master);
    const bus = {};
    for (const id in LAYERS) { const g = ctx.createGain(); g.gain.value = 0; g.connect(v2 && PUMPED_B.includes(id) ? pump : master); bus[id] = g; }
    (v2 ? ['keys', 'pad', 'bell', 'choir', 'swell', 'counter', 'sparkle', 'air', 'rim'] : ['keys', 'pad', 'bell', 'choir', 'swell']).forEach(id => bus[id].connect(verbSend));
    (v2 ? ['keys', 'bell', 'counter', 'arp'] : ['keys', 'bell']).forEach(id => bus[id].connect(delay));
    const sv = ctx.createGain(); sv.gain.value = 0.2; bus.snare.connect(sv); sv.connect(verbSend);
    // flottement de bande : 6 tours par phrase (≈ 0,33 Hz, l'original était à 0,35)
    const wobble = ctx.createGain(); wobble.gain.value = 7;
    { const wl = ctx.createOscillator(); wl.frequency.value = 6 / PHR; wl.connect(wobble); wl.start(0); }
    const in808 = ctx.createGain(), pre808 = ctx.createGain(); pre808.gain.value = 1.2;
    { const s808 = shaper(2.2), lp808 = ctx.createBiquadFilter(), g808 = ctx.createGain(); lp808.type = 'lowpass'; lp808.frequency.value = 1400; g808.gain.value = 0.85;
      in808.connect(pre808); pre808.connect(s808); s808.connect(lp808); lp808.connect(g808); g808.connect(bus.b808); }
    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = alea() * 2 - 1; }
    if (v2) {   // souffle d'air ambiant (v2) : bruit filtré qui ondule lentement — un tour par phrase (l'original : 0,06 Hz)
      const air = ctx.createBufferSource(); air.buffer = noiseBuf; air.loop = true;
      const ab = ctx.createBiquadFilter(); ab.type = 'bandpass'; ab.Q.value = 3; ab.frequency.value = 1800;
      const al = ctx.createOscillator(), aa = ctx.createGain(); al.frequency.value = 1 / PHR; aa.gain.value = 900; al.connect(aa); aa.connect(ab.frequency);
      const ag = ctx.createGain(); ag.gain.value = 0.018; air.connect(ab); ab.connect(ag); ag.connect(bus.air); air.start(0); al.start(0);
    }
    let speed = 0, last808 = null, curNotes = [];

    // ---- les instruments (recopiés) ----
    const env = (g, t, peak, a, dur) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); };
    const noise = (t, dest, type, freq, q, peak, dur) => { const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      n.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q; env(g, t, peak, 0.002, dur); n.connect(f); f.connect(g); g.connect(dest);
      n.start(t, R() * 1.2); n.stop(t + dur + 0.02); };
    const ep = (t, midi, dur, dest, peak, sigh, pan) => { const f = mtof(midi);
      const car = ctx.createOscillator(), mod = ctx.createOscillator(), tine = ctx.createOscillator();
      const mg = ctx.createGain(), tg = ctx.createGain(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      car.frequency.value = f; mod.frequency.value = f; tine.frequency.value = f * 14;
      mg.gain.setValueAtTime(f * 2.2, t); mg.gain.exponentialRampToValueAtTime(f * 0.3, t + 0.6);
      tg.gain.setValueAtTime(f * 0.5, t); tg.gain.exponentialRampToValueAtTime(1, t + 0.06);
      mod.connect(mg); mg.connect(car.frequency); tine.connect(tg); tg.connect(car.frequency); wobble.connect(car.detune);
      lp.type = 'lowpass'; lp.frequency.value = 4200; const rel = Math.max(dur, 0.25) + 0.9;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.004); g.gain.exponentialRampToValueAtTime(peak * 0.35, t + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + rel);
      if (sigh) { car.frequency.setValueAtTime(f, t + dur * 0.6); car.frequency.exponentialRampToValueAtTime(f * 0.944, t + dur); }
      let out = g; if (pan) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
      car.connect(lp); lp.connect(g); out.connect(dest); [car, mod, tine].forEach(o => { o.start(t); o.stop(t + rel + 0.05); }); };
    const pad = (t, chord, dur) => { const f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'lowpass'; f.frequency.value = 1600;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.03, t + 0.6); g.gain.setValueAtTime(0.03, t + dur - 0.2); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.4);
      chord.forEach(m => [-1, 1].forEach(side => { const o = ctx.createOscillator(), pn = ctx.createStereoPanner(); o.type = 'triangle'; o.frequency.value = mtof(m + 12); o.detune.value = side * 8;
        pn.pan.value = side * 0.6; o.connect(pn); pn.connect(f); o.start(t); o.stop(t + dur + 0.45); })); f.connect(g); g.connect(bus.pad); };
    const choir = (t, chord, dur) => { const g = ctx.createGain(), sum = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 0.8); g.gain.setValueAtTime(0.05, t + dur - 0.3); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.5);
      [[750, 1, 5], [1150, 0.45, 6], [2800, 0.08, 6]].forEach(([fr, lv, q]) => { const bp = ctx.createBiquadFilter(), fg = ctx.createGain(); bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = q; fg.gain.value = lv;
        sum.connect(bp); bp.connect(fg); fg.connect(g); });
      chord.forEach(m => [-6, 6].forEach(dt => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m + 12); o.detune.value = dt; o.connect(sum); o.start(t); o.stop(t + dur + 0.55); }));
      g.connect(bus.choir); };
    const b808 = (t, midi, dur, from) => { const o = ctx.createOscillator(), g = ctx.createGain();
      if (from !== null) { o.frequency.setValueAtTime(mtof(from), t); o.frequency.exponentialRampToValueAtTime(mtof(midi), t + 0.08); } else o.frequency.setValueAtTime(mtof(midi), t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.7, t + 0.006); g.gain.setValueAtTime(0.7, t + dur - 0.03); g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(in808); o.start(t); o.stop(t + dur + 0.02); };
    const kick = (t, beatDur) => { const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.05); env(g, t, 0.7, 0.002, 0.13); o.connect(g); g.connect(bus.kick); o.start(t); o.stop(t + 0.15);
      if (v2) { const depth = 0.55 * ramp(speed, 0.5, 1); if (depth > 0.02) { pump.gain.setValueAtTime(1 - depth, t); pump.gain.linearRampToValueAtTime(1, t + beatDur * 0.8); } } };
    const snare = (t, dest, peak) => { noise(t, dest, 'bandpass', 1800, 0.7, peak, 0.16);
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(170, t + 0.06);
      env(g, t, v2 ? peak * 0.85 : 0.3, 0.002, 0.08); o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.1); };
    const rim = t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = 1700; env(g, t, 0.12, 0.001, 0.03);
      o.connect(g); g.connect(bus.rim); o.start(t); o.stop(t + 0.04); noise(t, bus.rim, 'bandpass', 3000, 2, 0.08, 0.025); };
    const pluck = (t, midi, dest, peak, pan) => { const o = ctx.createOscillator(), g = ctx.createGain(), p = ctx.createStereoPanner(); o.type = 'triangle'; o.frequency.value = mtof(midi);
      env(g, t, peak, 0.002, 0.12); p.pan.value = pan; o.connect(g); g.connect(p); p.connect(dest); o.start(t); o.stop(t + 0.14); };
    const reverse = (t, midi, dur) => { const f = mtof(midi), car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      car.frequency.value = f; mod.frequency.value = f; mg.gain.setValueAtTime(f * 0.3, t); mg.gain.exponentialRampToValueAtTime(f * 2, t + dur); mod.connect(mg); mg.connect(car.frequency);
      lp.type = 'lowpass'; lp.frequency.value = 3500; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + dur); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.01);
      car.connect(lp); lp.connect(g); g.connect(bus.keys); [car, mod].forEach(o => { o.start(t); o.stop(t + dur + 0.02); }); };
    const swell = (t, chord, dur) => { const f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'lowpass'; f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2500, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.04, t + dur); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.02);
      chord.forEach(m => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m + 12); o.connect(f); o.start(t); o.stop(t + dur + 0.05); }); f.connect(g); g.connect(bus.swell); };
    const bass808 = (s, i, bar8) => {   // 808 : une note par croche, tenue jusqu'à la suivante ; saut d'octave dans la 2e moitié
      if (i % 2) return; const idx = ((Math.floor(s / 16) % 4) * 8 + i / 2) % 32; let note = BASS[idx];
      if (note !== null && bar8 >= 4 && idx % 8 === 7) note += 12;
      if (note !== null) { let len = 1; while (BASS[(idx + len) % 32] === null && len < 8) len++; return [note, len]; } };

    // ---- le pas de double croche : celui de GLISSE ----
    function pasA(s, t, sd) {
      const bar = Math.floor(s / 16) % 4, i = s % 16, bar8 = Math.floor(s / 16) % 8, chord = CHORDS[bar], brk = bar8 === 7 && i >= 8 && speed > 0.2;
      if (i === 0) { pad(t, chord, sd * 16); choir(t, chord, sd * 16); }
      MELODY_A[bar8].forEach(([st, m, len]) => { if (st === i) ep(t, m, sd * len, bus.keys, 0.12, len >= 6); });
      if (i === 0) ep(t, chord[0] + 12, sd * 8, bus.keys, 0.05);
      if (s % 3 === 0) ep(t, POLY[(s / 3) % 3], sd * 2, bus.bell, 0.035);
      if (bar === 3 && i === 8) { reverse(t, bar8 === 7 ? 81 : 74, sd * 8); swell(t, CHORDS[0], sd * 8); }
      if (R() < 0.25) noise(t, bus.vinyl, 'highpass', 2500, 0.5, 0.012, 0.004);
      if (!brk) {
        const bn = bass808(s, i, bar8); if (bn) { b808(t, bn[0], sd * 2 * bn[1], last808); last808 = bn[0]; }

        if (i === 4 || i === 12) snare(t, bus.snare, 0.35);

      const arpNotes = [...chord.map(m => m + 24), ...chord.map(m => m + 36)], up = (s % 16) < 8;

        const bn = bass808(s, i, bar8); if (bn) { b808(t, bn[0], sd * 2 * bn[1], last808); last808 = bn[0]; }

        if (i % 2 === 0 || speed > 0.35) noise(t, bus.hats, 'highpass', 7000, 0.7, (i % 2 ? 0.025 : 0.045) * (0.8 + R() * 0.4), 0.025);
        if (bar % 2 === 1 && i >= 12) for (let k = 1; k < 3; k++) noise(t + k * sd / 3, bus.rolls, 'highpass', 8000, 0.7, 0.025 + (i - 12) * 0.005, 0.02);
        if (i === 3 || i === 11) noise(t, bus.perc, 'bandpass', 3200, 2, 0.12, 0.03);

  }

  function preparer(ctx, sortie, alea) { return { A: moteur(ctx, sortie, alea, false), B: moteur(ctx, sortie, alea, true) }; }

    autre.taire(t0); E.regle(v2 ? VIT_B[p - 5] : VIT_A[p - 1], t0, alea, p === 1);

  }

  return {
    titre: 'GLISSE FUSION', bpm: BPM, mesures: 8, pas: 0.6, moteurs: [4, 4, 4, 4, 4, 4, 4, 2], ton: 'ré mineur', auteur: 'Claude Code, d’après GLISSE et GLISSE v2',

<script>
(function () {
  let ctx = null, kit = null, p = 1, m = 0, tNext = 0, iv = 0;
  let graine = 12345; const alea = () => { graine = (graine * 1664525 + 1013904223) >>> 0; return graine / 4294967296; };
