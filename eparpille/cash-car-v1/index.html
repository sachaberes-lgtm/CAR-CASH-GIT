<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CASH CAR</title>
<meta name="description" content="CASH CAR — runner arcade 3D : fonce, saute, vrille et amasse une fortune. Une seule vie.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>

  #cpBar{width:240px;height:14px;background:#0c0d18;border:2px solid #00eaff;margin-top:8px;overflow:hidden}
  #cpFill{height:100%;width:0%;background:linear-gradient(90deg,#ff3924,#ffb000,#62e062)}
  #nitroWrap{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:320px}
  #styleBar{height:8px;background:#0c0d18;border:2px solid #ff3ec8;margin-bottom:6px;overflow:hidden;box-shadow:0 0 10px rgba(255,62,200,.35)}
  #styleFill{height:100%;width:0%;background:repeating-linear-gradient(90deg,#ff3ec8 0 10px,#b3208c 10px 14px)}
  #styleFill.fever{background:repeating-linear-gradient(90deg,#ffd75e 0 10px,#ffb000 10px 14px)}
  #feverGlow{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(255,62,200,.55);display:none}
  #flash{position:absolute;inset:0;background:#ff2020;opacity:0;transition:opacity .5s}
  #nitroLbl{font-size:9px;color:#9ae6ff;text-align:center;margin-bottom:6px;text-shadow:0 0 8px rgba(0,234,255,.6)}
  #nitroBar{height:18px;background:#0c0d18;border:2px solid #00eaff;overflow:hidden;display:flex;box-shadow:inset 0 0 10px rgba(0,0,0,.8),0 0 12px rgba(0,234,255,.3)}
  #nitroR{height:100%;background:repeating-linear-gradient(90deg,#ff8c1a 0 12px,#c96500 12px 16px);width:50%}
  #nitroX{height:100%;background:repeating-linear-gradient(90deg,#1c35e0 0 12px,#101f8f 12px 16px);width:0%}
  #msg{position:absolute;top:13%;left:50%;transform:translateX(-50%);font-size:22px;line-height:1.5;color:#ffb000;text-shadow:0 0 18px rgba(255,176,0,.7);opacity:0;transition:opacity .3s;text-align:center;white-space:nowrap}
  #trickBox{position:absolute;top:22%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  .trick{font-family:var(--pix);font-size:16px;line-height:1.6;color:#ff9d2e;
    text-shadow:0 0 14px rgba(255,157,46,.7);animation:trickPop .95s ease-out forwards;margin:4px 0}
  .trick.big{font-size:24px;color:#ff3ec8;text-shadow:0 0 20px rgba(255,62,200,.8)}
  .trick.m1{font-size:22px;color:#ffd75e;text-shadow:0 0 18px rgba(255,215,94,.8)}
  .trick.m2{font-size:30px;color:#ff9d2e;text-shadow:0 0 24px rgba(255,157,46,.9);animation-duration:1.2s}
  .trick.m3{font-size:40px;color:#ff3ec8;text-shadow:0 0 16px rgba(255,62,200,.95),0 0 40px rgba(255,62,200,.6);animation-duration:1.5s}
  @keyframes trickPop{0%{transform:scale(.3);opacity:0}18%{transform:scale(1.25);opacity:1}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1) translateY(-28px)}}
  #turnHint{position:absolute;top:33%;left:50%;transform:translateX(-50%);font-size:44px;color:#ff3924;opacity:0;text-shadow:0 0 16px rgba(255,57,36,.8);transition:opacity .15s}
  #airPie{position:absolute;top:40%;right:7%;width:110px;height:110px;display:none;filter:drop-shadow(0 0 8px rgba(0,234,255,.5))}
  #overlay{position:fixed;inset:0;background:rgba(6,4,16,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;z-index:5}
  #overlay h1{font-family:var(--pix);font-size:34px;margin:0;line-height:1.5;text-align:center;
    background:linear-gradient(180deg,#ffe28a,#ffb000 45%,#ff3ec8);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,176,0,.5))}
  #overlay h2{font-family:var(--pix);font-size:11px;margin:14px 0 0;color:#00eaff;text-shadow:0 0 12px rgba(0,234,255,.7)}

  #nameSave:hover{background:rgba(30,90,45,.9)}

  #overlay{background:radial-gradient(1200px 700px at 50% 30%,rgba(30,26,60,.55),rgba(6,7,14,.92));backdrop-filter:blur(10px);gap:6px}
  #overlay h1{font-size:52px;letter-spacing:12px;line-height:1.2;
    background:linear-gradient(180deg,#fff3c0,#ffd75e 40%,#ff8a3d 75%,#ff3ec8);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 26px rgba(255,176,0,.35))}
  #tagline{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;letter-spacing:5px;text-transform:uppercase;color:#9fb4d8;opacity:.85;margin:2px 0 14px}
  #ovSub{font-size:13px;color:#ff5e7a;text-shadow:0 0 16px rgba(255,60,90,.6);margin:6px 0 0;letter-spacing:6px}
  #finalScore{font-size:32px;margin:10px 0 2px;letter-spacing:1px}
  #bestChip{font-family:var(--pix);font-size:9px;letter-spacing:2px;color:#ffd75e;border:1px solid rgba(255,215,94,.4);border-radius:999px;padding:8px 16px;margin:8px 0 4px;background:rgba(255,215,94,.07)}
  #lbBox{width:400px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .lbTitle{font-size:11px;letter-spacing:3px;color:#ffd75e;text-shadow:none;margin-bottom:8px}
  .lbRow{border-bottom:1px solid rgba(255,255,255,.06);color:#c8dcf2;font-size:9px}
  .lbRow.hl{background:rgba(255,176,0,.12);box-shadow:none;border-radius:6px}
  #ctrlRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:18px 0 4px}
  .kc{font-family:var(--pix);font-size:9px;letter-spacing:1px;color:#dfeeff;text-align:center;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:9px 13px 7px;line-height:1.1}
  .kc i{display:block;font-style:normal;font-family:'Segoe UI',Arial,sans-serif;font-size:10px;color:#8fa4c4;letter-spacing:.5px;margin-top:5px;text-transform:lowercase}
  #overlay .go{margin-top:20px;font-size:13px;letter-spacing:4px;color:#0c0d16;background:linear-gradient(180deg,#ffe9a0,#ffc400);
    border:none;border-radius:999px;padding:16px 46px;animation:none;cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,215,94,.5),0 8px 30px rgba(255,176,0,.35);transition:transform .12s,box-shadow .12s;text-shadow:none}
  #overlay .go:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 0 1px rgba(255,215,94,.8),0 12px 40px rgba(255,176,0,.55)}
  #nameEntry span{font-size:9px;letter-spacing:2px}
  #nameInput{border-radius:10px;border:1px solid rgba(0,234,255,.5);box-shadow:none}
  #nameSave{border-radius:999px;border:1px solid #62e062;box-shadow:none}
</style>
</head>
<body>
<div id="hud">
  <div id="vig"></div>
  <div id="scan"></div>
  <div id="speedFx"></div>
  <div id="carInfo" class="panel"><div id="carName">Épave rouillée</div><div id="carLevel">NIVEAU 1 / 14</div></div>
  <div id="money">$00000000</div>
  <div id="record"></div>
  <button id="resetBtn">⟲ RESET</button>
  <div id="speedo" class="panel"><div id="speedVal">0</div><div id="speedUnit">km/h</div></div>
  <div id="cpInfo" class="panel">Prochaine voiture à <span id="cpDist"></span><div id="cpBar"><div id="cpFill"></div></div></div>
  <div id="feverGlow"></div>
  <div id="flash"></div>
  <div id="nitroWrap"><div id="styleBar"><div id="styleFill"></div></div><div id="nitroLbl">NITRO (ESPACE)</div><div id="nitroBar"><div id="nitroR"></div><div id="nitroX"></div></div></div>
  <div id="msg"></div>
  <div id="trickBox"></div>
  <div id="turnHint"></div>
  <canvas id="airPie" width="74" height="74"></canvas>
  <canvas id="minimap" width="176" height="176"></canvas>
</div>
<div id="overlay">
  <h1>CASH CAR</h1>
  <div id="tagline">cours après le cash · ne tombe jamais</div>
  <h2 id="ovSub" style="display:none">GAME OVER</h2>
  <div id="finalScore"></div>

  <div id="nameEntry"><span>★ NOUVEAU RECORD — TON NOM</span><input id="nameInput" maxlength="8" autocomplete="off" spellcheck="false"><button id="nameSave">VALIDER</button></div>
  <div id="lbBox"></div>
  <div id="ctrlRow">
    <span class="kc">Z Q S D<i>conduire</i></span>
    <span class="kc">← ↑ ↓ →<i>conduire</i></span>
    <span class="kc">ESPACE<i>nitro</i></span>
    <span class="kc">R<i>replacer</i></span>
    <span class="kc">ENTRÉE<i>rejouer</i></span>
    <span class="kc">P<i>pause</i></span>
  </div>
  <div class="go" id="goTxt">JOUER</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// ---------- SCENE ----------
const scene=new THREE.Scene();
// CIEL BLEU dégradé (zénith → horizon pâle)
scene.background=(function(){
  const cv=document.createElement('canvas');cv.width=2;cv.height=256;
  const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#3d8de0');g.addColorStop(.5,'#8ec4ee');g.addColorStop(.78,'#d8ecfa');g.addColorStop(1,'#eef6fc');
  c.fillStyle=g;c.fillRect(0,0,2,256);
  return new THREE.CanvasTexture(cv);
})();
scene.fog=new THREE.Fog(0xcfe6f8,420,2600);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,7000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
scene.add(new THREE.HemisphereLight(0xeaf4ff,0x8d99a6,1.05));
const sun=new THREE.DirectionalLight(0xffe8d0,1.0);sun.position.set(300,500,200);scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,.32);fill.position.set(-200,-400,-100);scene.add(fill);
/* décor synthwave (étoiles, planètes, soleil) retiré — look épuré fond blanc */

// ---------- GÉNÉRATEUR (45°, patterns pensés pour l'airtime) ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const ROAD_HALF=14, THICK=2.6;
let pts=[],T=[],Nn=[],B=[],L=0,NP=0;
const trackMeshes=[];let PADS=[];let BUMPS=[];let CONES=[];let FLYCONES=[];let portalMesh=null;
// plots de chantier orange (percutables — ils valdinguent)
const coneGeo=new THREE.CylinderGeometry(.055,.3,.95,10);
const coneBandGeo=new THREE.CylinderGeometry(.185,.24,.2,10);
const coneBaseGeo=new THREE.BoxGeometry(.72,.07,.72);
const coneMat=new THREE.MeshPhongMaterial({color:0xff7a1a,emissive:0x8a2f00,emissiveIntensity:.3,shininess:70,specular:0xffe9d0});
const coneBandMat=new THREE.MeshPhongMaterial({color:0xffffff,emissive:0x666666,emissiveIntensity:.25,shininess:90});
function mkCone(){
  const g=new THREE.Group();
  const base=new THREE.Mesh(coneBaseGeo,coneMat);base.position.y=.035;
  const c=new THREE.Mesh(coneGeo,coneMat);c.position.y=.5;
  const b=new THREE.Mesh(coneBandGeo,coneBandMat);b.position.y=.52;
  g.add(base,c,b);return g;
}
// flaques d'huile (rares, droites & plates uniquement) : disque sombre glacé + reflet irisé
let OILS=[];
const oilGeo=new THREE.CircleGeometry(1,22);
const oilMat=new THREE.MeshPhongMaterial({color:0x121419,shininess:320,specular:0x9fb4ff,envMap:null,transparent:true,opacity:.92});
const oilRimMat=new THREE.MeshBasicMaterial({color:0x4a3a72,transparent:true,opacity:.4,depthWrite:false});
// nuages : billboards duveteux (3 textures peintes, bouffées superposées à plat dessous, bourgeons dessus)
const cloudTexs=(function(){
  const arr=[];
  let sd=13;const r=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
  for(let v=0;v<3;v++){
    const cv=document.createElement('canvas');cv.width=256;cv.height=128;
    const c=cv.getContext('2d');
    const puff=(x,y,rad,a)=>{
      const g=c.createRadialGradient(x,y-rad*.25,rad*.12,x,y,rad);
      g.addColorStop(0,'rgba(255,255,255,'+a+')');
      g.addColorStop(.62,'rgba(247,251,255,'+(a*.5)+')');
      g.addColorStop(1,'rgba(255,255,255,0)');
      c.fillStyle=g;c.beginPath();c.arc(x,y,rad,0,7);c.fill();
    };
    for(let i=0;i<6;i++)puff(46+i*33+(r()-.5)*10,84+(r()-.5)*5,25+r()*10,.92); // base plate
    for(let i=0;i<5;i++)puff(68+i*30+(r()-.5)*16,56+(r()-.5)*10,17+r()*15,.85); // bourgeons
    for(let i=0;i<3;i++)puff(90+i*34+(r()-.5)*20,40+(r()-.5)*6,11+r()*9,.8);   // sommets
    arr.push(new THREE.CanvasTexture(cv));
  }
  return arr;
})();
function genCtrl(rnd,startPos,startPhi){
  const ctrl=[];
  let P=startPos.clone(),phi=startPhi,approx=0,lastLoop=-500;
  const dir=()=>new THREE.Vector3(Math.sin(phi),0,Math.cos(phi));
  const push=()=>ctrl.push(P.clone());
  push();
  const straight=(l,dy=0,n=1)=>{for(let k=0;k<n;k++){P.addScaledVector(dir(),l/n);P.y+=dy/n;push();}approx+=Math.hypot(l,dy);};
  const arc=(aDeg,R,n,dy=0)=>{const a=aDeg*Math.PI/180,st=a/n,ch=2*R*Math.sin(Math.abs(st)/2);
    for(let k=0;k<n;k++){phi+=st/2;P.addScaledVector(dir(),ch);P.y+=dy/n;phi+=st/2;push();}
    approx+=Math.abs(a)*R;};
  const loop=(R,shift)=>{const base=P.clone(),d=dir(),sx=Math.cos(phi),sz=-Math.sin(phi);
    for(let k=1;k<=8;k++){const th=k*Math.PI/4;
      P.set(base.x+d.x*R*Math.sin(th)+sx*shift*th/(2*Math.PI),
            base.y+R*(1-Math.cos(th)),
            base.z+d.z*R*Math.sin(th)+sz*shift*th/(2*Math.PI));
      push();}
    approx+=2*Math.PI*R;};
  straight(170,-105,2); // DÉPART : toujours une grande ligne droite
  while(approx<7200){
    const r=rnd();
    if(r<.20&&approx-lastLoop>220){ // looping (superposition verticale)
      straight(40+rnd()*60,-45);loop(30+rnd()*34,30+rnd()*22);straight(35+rnd()*50,-42);lastLoop=approx;
      if(rnd()<.35){straight(50+rnd()*40,-48);loop(26+rnd()*22,28+rnd()*14);}
    }else if(r<.42){ // hélice : la route s'empile sur elle-même (plus fréquent)
      const sg=rnd()<.5?-1:1,Rh=60+rnd()*95,ah=260+rnd()*340;
      arc(sg*ah,Rh,8+Math.floor(rnd()*5),-(ah*Math.PI/180*Rh*(.5+rnd()*.35)));
    }else if(r<.48){ // épingle OUVERTE (fini l'ultra-serré)
      const sg=rnd()<.5?-1:1;
      straight(25+rnd()*40,-25);
      arc(sg*180,55+rnd()*50,5,-(24+rnd()*26));
      straight(25+rnd()*40,-25);
    }else if(r<.58){ // esses amples
      const nS=1+Math.floor(rnd()*3),a=25+rnd()*45,R=80+rnd()*100;
      for(let q=0;q<nS;q++){
        const dl=a*Math.PI/180*R*(.6+rnd()*.5);
        arc(a,R,2,-dl);arc(-a,R,2,-dl);
      }
    }else if(r<.68){ // vague verticale : bosse + creux (crête à sauter !)
      straight(40+rnd()*40,-(10+rnd()*20));
      straight(50+rnd()*40,20+rnd()*25);  // remontée surprise

function updatePool(pool,dt,grav){
  for(let i=0;i<pool.n;i++){
    if(pool.life[i]>0){
      pool.life[i]-=dt;
      pool.pos[i*3]+=pool.vel[i*3]*dt;
      pool.pos[i*3+1]+=(pool.vel[i*3+1]+grav)*dt;
      pool.pos[i*3+2]+=pool.vel[i*3+2]*dt;
      if(pool.life[i]<=0)pool.pos[i*3+1]=-99999;
    }
  }

}

const mmFwd=new THREE.Vector3();
function computeMinimap(){
  if(!pts||!pts.length)return;
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(let i=0;i<NP;i++){const p=pts[i];if(p.x<minX)minX=p.x;if(p.x>maxX)maxX=p.x;if(p.z<minZ)minZ=p.z;if(p.z>maxZ)maxZ=p.z;}
  mmMinX=minX;mmMaxX=maxX;mmMinZ=minZ;mmMaxZ=maxZ;
}
function drawMinimap(){
  const cv=mmCanvas,c=mmCtx,W=cv.width,H=cv.height,m=12;
  c.clearRect(0,0,W,H);
  const bw=(mmMaxX-mmMinX)||1,bh=(mmMaxZ-mmMinZ)||1;
  const sc=Math.min((W-2*m)/bw,(H-2*m)/bh);
  const ox=(W-bw*sc)/2-mmMinX*sc, oy=(H-bh*sc)/2-mmMinZ*sc;
  const X=x=>ox+x*sc, Y=z=>oy+z*sc;
  // tracé de la piste
  c.strokeStyle='rgba(160,160,170,.9)';c.lineWidth=2;c.lineJoin='round';c.beginPath();
  const step=Math.max(1,Math.floor(NP/240));
  for(let i=0;i<NP;i+=step){const p=pts[i];const cx=X(p.x),cy=Y(p.z);if(i===0)c.moveTo(cx,cy);else c.lineTo(cx,cy);}
  c.stroke();
  // portail (fin de zone)
  const pe=pts[NP-1];c.fillStyle='#ff4fd8';c.beginPath();c.arc(X(pe.x),Y(pe.z),3.6,0,7);c.fill();
  // voiture (triangle orienté)
  const cp=carGroup.position;
  mmFwd.set(0,0,1).applyQuaternion(carGroup.quaternion);
  const a=Math.atan2(mmFwd.z,mmFwd.x);
  c.save();c.translate(X(cp.x),Y(cp.z));c.rotate(a);
  c.fillStyle='#ffd75e';c.strokeStyle='#3a2e00';c.lineWidth=1;
  c.beginPath();c.moveTo(8,0);c.lineTo(-5,5);c.lineTo(-5,-5);c.closePath();c.fill();c.stroke();
  c.restore();
}

const dTmp=new THREE.Vector3();
function tryLand(){
  let bestI=-1,bd=1e9;
  for(let i=0;i<NP;i+=2){
    const dx=fallPos.x-pts[i].x,dy=fallPos.y-pts[i].y,dz=fallPos.z-pts[i].z;
    const dd=dx*dx+dy*dy+dz*dz;
    if(dd<bd){bd=dd;bestI=i;}
  }
  if(bestI<0||bd>1600)return false;
  dTmp.subVectors(fallPos,pts[bestI]);
  const hOff=dTmp.dot(Nn[bestI]),latOff=dTmp.dot(B[bestI]);
  const vN=fallVel.dot(Nn[bestI]);
  // FLANC de la dalle : on ne passe plus à travers — la caisse COGNE le mur,
  // perd des morceaux, rebondit et repart dans le vide (pas d'explosion)
  const vB=fallVel.dot(B[bestI]);
  if(sideCd<=0&&Math.abs(latOff)>=ROAD_HALF&&Math.abs(latOff)<ROAD_HALF+2.2&&
     hOff>-THICK-.6&&hOff<.6&&vB*Math.sign(latOff)<-3){
    const sg=Math.sign(latOff),impB=Math.abs(vB);
    fallVel.addScaledVector(B[bestI],-vB*1.65); // réflexion amortie sur la paroi
    fallVel.multiplyScalar(.72);
    fallPos.copy(pts[bestI]).addScaledVector(B[bestI],sg*(ROAD_HALF+1.8)).addScaledVector(Nn[bestI],hOff);
    sideCd=.35;
    thud(impB);noiseBurst(.14,.09,1100); // choc + froissement de tôle
    shake=Math.min(1.3,.3+impB*.03);
    dropChip(2+Math.floor(Math.min(4,impB*.12))); // ça casse ENCORE PLUS de bouts
    sparkBurst(sparkGold,carGroup.position,12,10);
    squashT=Math.max(squashT,.22);
    return false; // toujours en vol
  }
  let sideL=0;
  if(hOff>-1.2&&hOff<3&&vN<4.5)sideL=1;                       // face du dessus (fenêtre élargie)
  else if(hOff>-THICK-3&&hOff<-THICK+1.2&&vN>-4.5)sideL=-1;   // face du dessous
  if(!sideL||Math.abs(latOff)>=ROAD_HALF)return false;
  s=THREE.MathUtils.clamp(bestI/(NP-1)*L+THREE.MathUtils.clamp(dTmp.dot(T[bestI]),-2,2),0,L-1);
  side=sideL;lat=latOff*sideL;psi=0;
  vA=fallVel.dot(T[bestI]);vL=fallVel.dot(B[bestI])*.4*sideL;
  // ATTERRISSAGE : l'impact ralentit la caisse — d'autant plus que le saut etait gros
  const impact=Math.abs(vN);
  const bigness=Math.max(0,fallT-.8);
  const landLoss=Math.min(.52,bigness*.15+impact*.008); // un peu plus doux qu'avant
  vA*=(1-landLoss);vL*=(1-landLoss);
  if(landLoss>.2)dropChip(2);
  if(landLoss>.28&&fallT>1.6)slowT=Math.max(slowT,.25);
  prevTvalid=false;mode='drive';
  sparkBurst(sparkGold,carGroup.position,10,9);
  thud(Math.abs(vN));shake=Math.min(1.4,.35+Math.abs(vN)*.05+landLoss*.6);squashT=Math.max(.28,landLoss>.28?.4:.28);
  // ---- FIGURES : le vol paye — un seul verdict : MONSTRE ----
  if(fallT>.7){
    const spins=Math.abs(yawAcc)/(Math.PI*2);
    let mult=1;
    if(Math.abs(vN)<6)mult+=.5;                                       // réception parfaite
    if(spins>=.55)mult+=Math.max(1,Math.round(spins))*.8;             // vrilles
    if(fallT>2.2)mult+=.6;                                            // big air
    if(sideL<0)mult*=2;                                               // face cachée
    streak++;
    if(streak>=2)mult*=1+Math.min(1,streak*.1);                       // enchaînement
    const gain=Math.round(denom()*6*fallT*mult*(fever>0?2:1));
    money+=gain;levelCash+=gain;checkUpgrade();
    if(mult>=3.2)trickMsg('TRIPLE MONSTRE  +'+fmt(gain),3);
    else if(mult>=2)trickMsg('DOUBLE MONSTRE  +'+fmt(gain),2);
    else trickMsg('MONSTRE  +'+fmt(gain),1);
    boost=Math.max(boost,1.2);
    addStyle(18+spins*12);
    if(fallT>2)slowT=.35; // slow-mo savoureux sur les gros airs
  }
  return true;
}

const fwdW=new THREE.Vector3(),tmp=new THREE.Vector3(),tmp2=new THREE.Vector3(),tmp3=new THREE.Vector3(),mat4=new THREE.Matrix4();
const camUp=new THREE.Vector3(0,1,0),qTmp=new THREE.Quaternion(),qTmp2=new THREE.Quaternion();
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min((now-last)/1000,.05);last=now;
  if(slowT>0){slowT-=dt;dt*=.45;} // slow-mo d'atterrissage
  const t=now/1000;
  let speedKmh=0;
  try{ if(running&&!paused&&!gameOver){
    const spec=CARS[level],maxSp=spec.maxKmh/3.6;

    const lf=keys.KeyA||keys.KeyQ||keys.ArrowLeft,rt=keys.KeyD||keys.ArrowRight;

    nitroOn=wantN&&(nitroOn?(nitroR+nitroX)>.005:(nitroR+nitroX)>.3); // hystérésis anti-clignotement
    if(nitroOn){
      let take=dt;

          if(billT<=0){
            billT=.28+Math.random()*.4;
            const sd9=Math.random()<.5?-1:1;
            tmp2.copy(carGroup.position).addScaledVector(tmp,sd9*spec.w*.55).addScaledVector(F.n,spec.h+.4);
            spawnBill(tmp2,new THREE.Vector3(tmp.x*sd9*2.5-fwdW.x*5+(Math.random()-.5)*3,1.5+Math.random()*2,tmp.z*sd9*2.5-fwdW.z*5+(Math.random()-.5)*3),1.4);
          }
        }
        // caméra (plus proche de la voiture)
        const camBack=6.6+speedKmh*.011,camH=2.6+speedKmh*.0045;
        tmp2.copy(carGroup.position).addScaledVector(fwdW,-camBack).addScaledVector(F.n,camH);
        camera.position.lerp(tmp2,Math.min(1,dt*5));
        camUp.lerp(F.n,Math.min(1,dt*4)).normalize();
        qTmp2.setFromAxisAngle(fwdW,-steer*.035); // inclinaison caméra très légère dans les virages
        camUp.applyQuaternion(qTmp2);
        camera.up.copy(camUp);
        tmp2.copy(carGroup.position).addScaledVector(fwdW,10).addScaledVector(F.n,1.2);
        camera.lookAt(tmp2);
        const fovT=72+Math.min(32,speedKmh*.05)+(boost>0?6:0)+(nitroOn?(nitroBlue?15:9):0);
        camera.fov+=(fovT-camera.fov)*Math.min(1,dt*6);
        camera.updateProjectionMatrix();
        if(shake>0){
          camera.position.addScaledVector(F.n,(Math.random()-.5)*shake);
          camera.position.addScaledVector(tmp,(Math.random()-.5)*shake);
          shake=Math.max(0,shake-3.5*dt);
        }
        // tremblement continu lié à la vitesse
        const spdSh=Math.max(0,(speedKmh-120)/380)*CAM_SHAKE_V*(nitroOn?1.4:1);
        if(spdSh>0){
          camera.position.addScaledVector(F.n,(Math.random()-.5)*spdSh);
          camera.position.addScaledVector(tmp,(Math.random()-.5)*spdSh);
        }
        // indicateur de virage
        frameAt(s+Math.max(70,vA*1.4),FH);
        tmp2.crossVectors(F.t,FH.t);
        const ahead=Math.atan2(tmp2.dot(F.n),F.t.dot(FH.t));
        aheadV+=(ahead-aheadV)*Math.min(1,dt*4);
        if(Math.abs(ahead)>.12){
          const nA=Math.min(3,Math.ceil(Math.abs(ahead)*2.2));
          elTurn.textContent=ahead>0?'◀'.repeat(nA):'▶'.repeat(nA);
          elTurn.style.opacity=Math.min(1,Math.abs(ahead)*1.5);
        }else elTurn.style.opacity=0;
        airPie.style.display='none';
      }
    }else if(mode==='fall'){ // ---- VOL : maniabilité aérienne propre ----
      fallT+=dt;
      fallVel.y-=FALL_G*dt;
      // chute pilotée : un peu de lacet, c'est tout — la voiture est LOURDE
      // (le lacet gagne un peu d'autorité à grande vitesse → vol simplifié)
      const yawIn=steer*(1.15+Math.min(.6,fallVel.length()*.004))*dt;
      fallVel.applyAxisAngle(AXIS_Y,yawIn);
      yawAcc+=yawIn;
      if(nitroOn){ // RÉACTEUR : poussée depuis l'arrière façon Rocket League (modérée)
        tmp.copy(fallVel);
        if(tmp.lengthSq()>1)tmp.normalize();else tmp.set(0,0,1);
        fallVel.addScaledVector(tmp,(nitroBlue?44:30)*dt);
        if(keys.KeyW||keys.KeyZ||keys.ArrowUp)fallVel.y+=(nitroBlue?9:6)*dt;
        if(dn){ // ↓ + nitro : on REDRESSE la caisse (le nez remonte, portance bonus)
          tmp2.copy(fallVel).normalize().cross(AXIS_Y);
          if(tmp2.lengthSq()>.01){
            tmp2.normalize();
            fallVel.applyAxisAngle(tmp2,1.35*dt);
          }
          fallVel.y+=(nitroBlue?14:10)*dt;
        }
        // jet visible au point de poussée arrière : panache conique, jamais deux fois pareil
        flames.mesh.material.color.set(nitroBlue?0x3a5bff:0xff8020);
        flameCore.mesh.material.color.set(nitroBlue?0xbfd6ff:0xffd9a0);
        embers.mesh.material.color.set(nitroBlue?0x8ab8ff:0xffb24a);
        tmp3.set(0,0,1).applyQuaternion(carGroup.quaternion);
        if(Math.random()<.7)spawnP(embers,
          carGroup.position.x-tmp3.x*2.4,carGroup.position.y-tmp3.y*2.4,carGroup.position.z-tmp3.z*2.4,
          -tmp3.x*(8+Math.random()*10)+(Math.random()-.5)*5,-tmp3.y*8+2+Math.random()*3,-tmp3.z*(8+Math.random()*10)+(Math.random()-.5)*5,
          .4+Math.random()*.45);
        for(let j9=0;j9<5;j9++){
          tmp2.copy(carGroup.position).addScaledVector(tmp3,-2.3);
          tmp2.x+=(Math.random()-.5)*.5;tmp2.y+=(Math.random()-.5)*.5;tmp2.z+=(Math.random()-.5)*.5;
          const pw=13+Math.random()*9,spr=3.5;
          spawnP(flames,tmp2.x,tmp2.y,tmp2.z,
            -tmp3.x*pw+(Math.random()-.5)*spr,-tmp3.y*pw+(Math.random()-.5)*spr,-tmp3.z*pw+(Math.random()-.5)*spr,
            .09+Math.random()*.14);
          if(j9<3)spawnP(flameCore,tmp2.x,tmp2.y,tmp2.z,
            -tmp3.x*(pw+5)+(Math.random()-.5)*1.6,-tmp3.y*(pw+5)+(Math.random()-.5)*1.6,-tmp3.z*(pw+5)+(Math.random()-.5)*1.6,
            .06+Math.random()*.08);
        }
        if(Math.random()<.5)spawnP(sparkBlue,
          carGroup.position.x-tmp3.x*2.5,carGroup.position.y-tmp3.y*2.5,carGroup.position.z-tmp3.z*2.5,
          -tmp3.x*20+(Math.random()-.5)*6,-tmp3.y*20+(Math.random()-.5)*6,-tmp3.z*20+(Math.random()-.5)*6,.3);
      }
      fallPos.addScaledVector(fallVel,dt*SPD);
      carGroup.position.copy(fallPos);
      speedKmh=fallVel.length()*3.6*SPD;
      // orientation stable : le nez suit la trajectoire, PAS de vrille surprise
      carGroup.scale.set(1,1,1);
      tmp.copy(fallVel).normalize();
      tmp2.set(0,1,0);
      tmp3.crossVectors(tmp2,tmp).normalize();
      tmp2.crossVectors(tmp,tmp3);
      mat4.makeBasis(tmp3,tmp2,tmp);
      qTmp.setFromRotationMatrix(mat4);
      airRoll+=(3.0+steer*2.2+Math.min(2,fallT*.5))*dt; // VRILLE : la caisse tourne sur elle-même
      qTmp2.setFromAxisAngle(tmp,airRoll);
      qTmp.premultiply(qTmp2);
      carGroup.quaternion.slerp(qTmp,Math.min(1,dt*8));
      shadow.position.y=-99999;
      // caméra (plus proche aussi en vol)
      tmp2.copy(fallPos).addScaledVector(tmp,-10.5);tmp2.y+=4;
      camera.position.lerp(tmp2,Math.min(1,dt*3));
      camUp.lerp(tmp3.set(0,1,0),Math.min(1,dt*2)).normalize();
      camera.up.copy(camUp);
      camera.lookAt(fallPos);
      const fsh=Math.max(0,(speedKmh-150)/420)*CAM_SHAKE_V;
      if(fsh>0){
        camera.position.x+=(Math.random()-.5)*fsh;
        camera.position.y+=(Math.random()-.5)*fsh;
        camera.position.z+=(Math.random()-.5)*fsh;
      }
      elTurn.style.opacity=0;
      // viseur : où vais-je atterrir ?
      landMark.visible=false;
      tmp2.copy(fallPos);tmp3.copy(fallVel);
      for(let st2=0;st2<14;st2++){
        tmp3.y-=FALL_G*.12;
        tmp2.addScaledVector(tmp3,.12);
        let bi=-1,bdd=400;
        for(let i2=0;i2<NP;i2+=8){
          const dx=tmp2.x-pts[i2].x,dy=tmp2.y-pts[i2].y,dz=tmp2.z-pts[i2].z,dd2=dx*dx+dy*dy+dz*dz;
          if(dd2<bdd){bdd=dd2;bi=i2;}
        }
        if(bi>=0){
          dTmp.subVectors(tmp2,pts[bi]);
          const h2=dTmp.dot(Nn[bi]),l2=dTmp.dot(B[bi]);
          if(Math.abs(l2)<ROAD_HALF&&h2>-THICK-1&&h2<3){
            landMark.position.copy(pts[bi]).addScaledVector(B[bi],l2).addScaledVector(Nn[bi],h2>-1.3?.3:-THICK-.3);
            landMark.quaternion.setFromRotationMatrix(mat4.makeBasis(T[bi],B[bi],Nn[bi]));
            landMark.visible=true;
            // assistance d'atterrissage : recentre doucement (d'autant plus qu'on va vite)
            const asF=AIR_ASSIST*THREE.MathUtils.clamp(fallVel.length()/60,.2,1.4);
            fallVel.addScaledVector(B[bi],-l2*asF*dt*.5);
            break;
          }
        }
      }
      // camembert de temps de vol
      airPie.style.display='block';
      const fr=Math.max(0,1-fallT/AIR_MAX);
      pieCtx.clearRect(0,0,74,74);
      pieCtx.beginPath();pieCtx.arc(37,37,33,0,7);pieCtx.fillStyle='rgba(0,0,0,.35)';pieCtx.fill();
      pieCtx.beginPath();pieCtx.moveTo(37,37);
      pieCtx.arc(37,37,29,-Math.PI/2,-Math.PI/2+fr*Math.PI*2);
      pieCtx.closePath();
      pieCtx.fillStyle=fr>.4?'#7dff9b':(fr>.2?'#ffd75e':'#ff5e5e');
      pieCtx.fill();
      pieCtx.fillStyle='#fff';pieCtx.font='bold 15px monospace';pieCtx.textAlign='center';
      pieCtx.fillText(Math.max(0,AIR_MAX-fallT).toFixed(1),37,42);
      if(fallT>.35&&tryLand()){airPie.style.display='none';}
      else if(fallT>AIR_MAX||fallPos.y<pts[NP-1].y-200){airPie.style.display='none';explode();}
    }else if(mode==='boom'){ // ---- EXPLOSION ----
      boomT+=dt;
      for(const d of debris){
        d.v.y-=22*dt;
        d.m.position.addScaledVector(d.v,dt);
        d.m.rotation.x+=d.rx*dt;d.m.rotation.y+=d.ry*dt;
        if(!d.part&&d.m.material)d.m.material.emissiveIntensity=Math.max(0,.6-boomT*.45);
      }
      if(boomRing){boomRing.scale.setScalar(1+boomT*42);boomRing.material.opacity=Math.max(0,.95-boomT*1.3);boomRing.lookAt(camera.position);}
      if(boomRing2){boomRing2.scale.setScalar(1+boomT*26);boomRing2.material.opacity=Math.max(0,.8-boomT*1.1);boomRing2.lookAt(camera.position);}
      if(boomLight)boomLight.intensity=Math.max(0,4.5-boomT*3);
      camera.lookAt(boomPos);
      if(shake>0){
        camera.position.x+=(Math.random()-.5)*shake;
        camera.position.y+=(Math.random()-.5)*shake;
        camera.position.z+=(Math.random()-.5)*shake;
        shake=Math.max(0,shake-1.5*dt);
      }
      elTurn.style.opacity=0;
      if(boomT>1.8&&!gameOver)endGame();
    }
    // traînée nitro façon Asphalt 8
    tmp3.set(0,0,1).applyQuaternion(carGroup.quaternion);
    tmp.set(1,0,0).applyQuaternion(carGroup.quaternion);
    tmp2.set(0,1,0).applyQuaternion(carGroup.quaternion);
    let trc;
    if(nitroOn)trc=nitroBlue?[.35,.55,1]:[1,.6,.15];
    else{const ti=Math.max(0,Math.min(.3,(speedKmh-190)/500));trc=[ti*.8,ti*.9,ti];}
    trailPush(
      carGroup.position.x-tmp3.x*2.2-tmp.x*.95+tmp2.x*.45,
      carGroup.position.y-tmp3.y*2.2-tmp.y*.95+tmp2.y*.45,
      carGroup.position.z-tmp3.z*2.2-tmp.z*.95+tmp2.z*.45,
      carGroup.position.x-tmp3.x*2.2+tmp.x*.95+tmp2.x*.45,
      carGroup.position.y-tmp3.y*2.2+tmp.y*.95+tmp2.y*.45,
      carGroup.position.z-tmp3.z*2.2+tmp.z*.95+tmp2.z*.45,
      trc[0],trc[1],trc[2]);
    // particules
    updatePool(dust,dt,2);
    updateStreaks(dt);
    updatePool(flames,dt,1);
    updatePool(flameCore,dt,1);
    updatePool(embers,dt,4.5);
    updatePool(boomPool,dt,3);
    updatePool(boomRed,dt,2.5);
    updatePool(boomYel,dt,3.5);
    updatePool(smokePool,dt,2.5);
    updatePool(sparkGold,dt,-8);
    updatePool(sparkBlue,dt,-5);
    updatePool(boomTom,dt,-10);
    for(let i9=chips.length-1;i9>=0;i9--){
      const d=chips[i9];
      d.life-=dt;d.v.y-=20*dt;
      d.m.position.addScaledVector(d.v,dt);
      d.m.rotation.x+=d.rx*dt;d.m.rotation.y+=d.ry*dt;
      if(d.life<=0){scene.remove(d.m);d.m.material.dispose();chips.splice(i9,1);}
    }
    for(let i9=bills.length-1;i9>=0;i9--){
      const b9=bills[i9];
      b9.life-=dt;b9.v.y-=4.5*dt;b9.v.multiplyScalar(Math.max(0,1-.6*dt));
      b9.m.position.addScaledVector(b9.v,dt);
      b9.m.rotation.x+=b9.rx*dt;b9.m.rotation.y+=b9.ry*dt;
      if(b9.life<=0){scene.remove(b9.m);bills.splice(i9,1);}
    }
    for(const pk of pickups)if(!pk.taken){pk.mesh.rotateOnWorldAxis(pk.ax,dt*2.5);if(pk.nitro)pk.mesh.scale.setScalar(1+.12*Math.sin(t*6+pk.s));}
    for(let i9=FLYCONES.length-1;i9>=0;i9--){
      const c9=FLYCONES[i9];
      c9.life-=dt;c9.v.y-=24*dt;
      c9.m.position.addScaledVector(c9.v,dt);
      c9.m.rotation.x+=c9.rx*dt;c9.m.rotation.z+=c9.rz*dt;
      if(c9.life<=0){scene.remove(c9.m);FLYCONES.splice(i9,1);}
    }
    updateMoneyRain(dt,t);
    carLight.position.copy(carGroup.position);carLight.position.y+=3;
    if(fever>0){carLight.color.setHex(0xffd75e);carLight.intensity=.9+Math.sin(t*12)*.45;}
    else{carLight.color.setHex(0xfff0ff);carLight.intensity=.8;}
    const sunM=scene.userData.sunM;
    if(sunM){sunM.position.set(camera.position.x+650,camera.position.y+180,camera.position.z-2000);sunM.lookAt(camera.position);}
    // sons continus
    if(AC){
      const spd3=speedKmh;
      if(osc&&gainN&&mode==='drive'){
        const eng=ENGINES[level];
        const rpm=(spd3%110)/110;
        const rough=level<2?(Math.random()-.5)*(2-level)*7:0; // les épaves toussent
        const f0=(70+rpm*170+(up?25:0)+spd3*.35+(nitroOn?60:0))*eng.fm+rough;
        osc.frequency.setTargetAtTime(f0,AC.currentTime,.04);
        osc.detune.setTargetAtTime(eng.det,AC.currentTime,.1);
        osc2.frequency.setTargetAtTime(f0*eng.o2,AC.currentTime,.04);
        filt.frequency.setTargetAtTime(320+eng.fq+spd3*3+(nitroOn?900:0)+(boost>0?500:0),AC.currentTime,.08);
        gainN.gain.setTargetAtTime((.018+Math.min(.05,spd3*.0003)+(up?.012:0))*eng.vol,AC.currentTime,.1);
      }else if(gainN)gainN.gain.setTargetAtTime(.006,AC.currentTime,.1);
      if(windG){
        windG.gain.setTargetAtTime(Math.min(.05,spd3*.0002+(mode==='fall'?.018:0)),AC.currentTime,.15);
        windF.frequency.setTargetAtTime(280+spd3*2.5,AC.currentTime,.15);
      }
      if(skidG)skidG.gain.setTargetAtTime((mode==='drive'&&Math.abs(psi)>.5&&Math.abs(vA)>15)?Math.min(.1,Math.abs(vA)*.001):0,AC.currentTime,.06);
      if(jetG){ // réacteur : souffle + grave + turbine, allumage et crépitement
        const air9=mode==='fall';
        const jv=nitroOn?(air9?(nitroBlue?.17:.12):(nitroBlue?.07:.05)):0;
        jetG.gain.setTargetAtTime(jv,AC.currentTime,.06);
        jetLowG.gain.setTargetAtTime(jv*1.1,AC.currentTime,.08);
        jetOscG.gain.setTargetAtTime(nitroOn&&air9?.012:0,AC.currentTime,.09);
        if(nitroOn){
          jetF.frequency.setTargetAtTime(650+spd3*2+Math.random()*400+(nitroBlue?400:0),AC.currentTime,.05);
          jetOsc.frequency.setTargetAtTime(900+spd3*3.5+(nitroBlue?500:0),AC.currentTime,.08);
          if(air9&&Math.random()<dt*7)noiseBurst(.05,.035,1500); // crépitement d'afterburner
        }
        if(nitroOn&&air9&&!loop._jetWas){ // ALLUMAGE : pop sourd + montée en régime
          noiseBurst(.22,.16,420);
          try{
            const o9=AC.createOscillator(),g9=AC.createGain();o9.type='sawtooth';
            o9.frequency.setValueAtTime(160,AC.currentTime);
            o9.frequency.exponentialRampToValueAtTime(950,AC.currentTime+.3);
            g9.gain.setValueAtTime(.07,AC.currentTime);
            g9.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.35);
            o9.connect(g9);g9.connect(AC.destination);o9.start();o9.stop(AC.currentTime+.4);
          }catch(e){}
        }
        loop._jetWas=nitroOn&&air9;
      }
    }
    // portail qui pulse + pads RGB qui défilent
    if(portalMesh)portalMesh.scale.setScalar(1+.06*Math.sin(t*5));
    updatePadTex(t);
    // HUD
    drawMinimap();
    elSpeed.textContent=Math.round(speedKmh);
    speedFx.style.opacity=Math.max(0,Math.min(.9,(speedKmh-150)/320));
    elName.textContent=CARS[level].name;
    elLvl.textContent='NIVEAU '+(level+1)+' / '+CARS.length+' — pièces de '+fmt(denom()*5);
    elMoney.innerHTML=fmtGta(money);
    if(!gameOver&&money>=nextRainAt){nextRainAt*=10;startMoneyRain();}
    if(money>best){best=money;try{localStorage.rrBest5=best;}catch(e){}}
    elRecord.textContent='record : '+fmt(best);
    elNR.style.width=(nitroR/4*100)+'%';
    elNX.style.width=(nitroX/4*100)+'%';
    const prevT=level>0?THRESH[level-1]:0,nextT=THRESH[Math.min(level,12)];
    elCp.textContent=level>=13?'MAX':fmt(nextT);
    elFill.style.width=(level>=13?100:100*Math.min(1,(levelCash-prevT)/(nextT-prevT)))+'%';
    if(fever>0)fever-=dt;else styleM=Math.max(0,styleM-4*dt);
    if(fever>0){elStyleF.className='fever';elStyleF.style.width=(fever/10*100)+'%';feverGlow.style.display='block';}
    else{elStyleF.className='';elStyleF.style.width=styleM+'%';feverGlow.style.display='none';}
    if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
    if(msgT>0){msgT-=dt;if(msgT<=0)elMsg.style.opacity=0;}
  } }catch(err){if(!loop._warned){console.error('loop error',err);loop._warned=true;}}
  renderer.render(scene,camera);
}
// ---------- INIT ----------
newTrack();
respawn();
frameAt(0,F);
camera.position.copy(F.p).addScaledVector(F.t,-9).addScaledVector(F.n,4);
elRecord.textContent='record : '+fmt(best);
setBestChip();
renderLeaders(-1);
requestAnimationFrame(loop);
})();
</script>
</body>
