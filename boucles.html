<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boucles CASH CAR</title>
<!-- LES BOUCLES DE 8 SECONDES (2026-10-01, Léo : « abandonne le générateur, ramène le premier générateur de sons avec des accords de
     8 s, rajoute quelques petits sons, interface plus Apple, plus simple »). Trois onglets : LOBBY, NIVEAUX, PETITS SONS.
     Un toucher = la boucle joue (sans couture, WebAudio) ; un autre toucher = elle s'arrête. Rien d'autre.
     Sons : atelier-son/boucles8.py (lobby, niveaux) et atelier-son/petits.py (petits sons). -->
<style>
:root{--fond:#f5f5f7;--carte:#fff;--tx:#1d1d1f;--tx2:#6e6e73;--fil:#d2d2d7;--bleu:#0071e3;--ombre:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--fond:#000;--carte:#1c1c1e;--tx:#f5f5f7;--tx2:#98989d;--fil:#38383a;--bleu:#0a84ff;--ombre:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
.in{max-width:760px;margin:0 auto;padding:48px 20px 80px}
h1{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:0}
.sous{color:var(--tx2);font-size:17px;margin:6px 0 28px}
.seg{display:inline-flex;background:var(--fil);border-radius:10px;padding:2px;margin-bottom:28px}
.seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--tx);padding:7px 18px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--carte);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.liste{display:grid;gap:12px}
.c{display:flex;align-items:center;gap:16px;background:var(--carte);border-radius:18px;padding:16px 18px;box-shadow:var(--ombre);cursor:pointer;
  transition:transform .15s ease;position:relative;overflow:hidden}
.c:active{transform:scale(.985)}
.btn{flex:none;width:44px;height:44px;border-radius:50%;background:var(--fond);display:grid;place-items:center;color:var(--bleu)}
.c.joue .btn{background:var(--bleu);color:#fff}
.btn svg{width:16px;height:16px;fill:currentColor}
.txt{flex:1;min-width:0}
.t{font-size:17px;font-weight:600;letter-spacing:-.01em}
.m{font-size:13px;color:var(--tx2);margin-top:2px}
.idee{font-size:14px;color:var(--tx2);margin-top:8px;line-height:1.4;display:none}
.c.joue .idee{display:block}
.tag{font-size:12px;color:var(--tx2);white-space:nowrap}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--bleu);width:0;opacity:0}
.c.joue .prog{opacity:1}
.vol{display:flex;align-items:center;gap:10px;color:var(--tx2);font-size:13px;margin-top:28px}
.vol input{flex:1;max-width:240px;accent-color:var(--bleu)}
</style>
</head>
<body>
<div class="in">
  <h1>Boucles</h1>
  <p class="sous">Touche une boucle pour l'écouter. Touche-la encore pour l'arrêter.</p>
  <div class="seg" id="seg">
    <button data-g="lobby" class="on">Lobby</button><button data-g="niv">Niveaux</button><button data-g="petits">Petits sons</button>
  </div>
  <div class="liste" id="liste"></div>
  <div class="vol">Volume <input type="range" id="vol" min="0" max="1" step=".01" value=".8"></div>
</div>
<script src="assets/audio/music/boucles/boucles-donnees.js"></script>
<script src="assets/audio/music/boucles/petits-donnees.js?v=1"></script>
<script>
'use strict';
const GROUPE={lobby:'LOBBY · 8 SECONDES',niv:'NIVEAUX · 8 SECONDES'};
function liste(g){
  if(g==='petits')return (window.PETITS||[]).map(p=>({id:p.id,titre:p.titre,style:p.style,bpm:p.bpm,cle:p.cle,dur:p.dur,f:p.f,idee:p.idee}));
  return (window.BOUCLES||[]).filter(b=>b.groupe===GROUPE[g]&&b.f).map(b=>({id:b.id,titre:b.titre,style:(b.pour||'').split('·').pop().trim(),bpm:b.bpm,cle:b.cle,dur:b.dur,f:b.f,idee:b.idee}));
}
const titre=t=>t.charAt(0)+t.slice(1).toLowerCase();     // « NÉON NOIR » → « Néon noir »
const PLAY='<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>',STOP='<svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>';
let ac=null,sortie=null,cur=null;const BUF={};
function audio(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();sortie=ac.createGain();sortie.gain.value=+document.getElementById('vol').value;sortie.connect(ac.destination);}return ac;}
function tampon(b){return BUF[b.f]||(BUF[b.f]=fetch(b.f).then(r=>r.arrayBuffer()).then(ab=>new Promise((ok,ko)=>audio().decodeAudioData(ab,ok,ko))));}
function stop(){if(!cur)return;const c=cur;cur=null;try{c.g.gain.setTargetAtTime(0,ac.currentTime,.03);c.s.stop(ac.currentTime+.15);}catch(e){}c.el.classList.remove('joue');c.el.querySelector('.btn').innerHTML=PLAY;}
async function joue(b,el){
  const meme=cur&&cur.id===b.id;stop();if(meme)return;
  audio();await ac.resume();const buf=await tampon(b);
  // la boucle sans couture : l'amorce AAC sautée, bouclée sur sa durée exacte
  const ex=b.dur?buf.duration-b.dur:0,a=ex>.03?Math.min(ex,2112/buf.sampleRate):0,fin=b.dur?a+b.dur:buf.duration;
  const s=ac.createBufferSource(),g=ac.createGain();s.buffer=buf;s.loop=true;s.loopStart=a;s.loopEnd=fin;g.gain.value=0;
  s.connect(g);g.connect(sortie);const t=ac.currentTime+.03;s.start(t,a);g.gain.setTargetAtTime(1,t,.01);
  cur={id:b.id,s:s,g:g,el:el,t0:t,lg:fin-a};el.classList.add('joue');el.querySelector('.btn').innerHTML=STOP;
}
function rend(g){
  stop();const box=document.getElementById('liste');box.innerHTML='';
  liste(g).forEach(function(b){
    const el=document.createElement('div');el.className='c';
    el.innerHTML='<div class="btn">'+PLAY+'</div><div class="txt"><div class="t">'+titre(b.titre)+'</div><div class="m">'+b.style+'</div><div class="idee">'+(b.idee||'')+'</div></div>'+
      '<div class="tag">'+Math.round(b.bpm)+' BPM · '+b.cle+'</div><i class="prog"></i>';
    el.onclick=function(){joue(b,el);};box.appendChild(el);});
}
document.getElementById('seg').onclick=function(e){const b=e.target.closest('button');if(!b)return;
  this.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));rend(b.dataset.g);};
document.getElementById('vol').oninput=function(e){if(sortie)sortie.gain.setTargetAtTime(+e.target.value,ac.currentTime,.05);};
(function f(){requestAnimationFrame(f);if(!cur)return;const p=((ac.currentTime-cur.t0)%cur.lg)/cur.lg;cur.el.querySelector('.prog').style.width=(p*100)+'%';})();
rend('lobby');
</script>
</body>
</html>
