<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boucles CASH CAR</title>
<!-- LES BOUCLES DE 8 SECONDES (2026-10-01, Léo : « abandonne le générateur, ramène le premier générateur de sons avec des accords de
     8 s, rajoute quelques petits sons, interface plus Apple, plus simple »). Trois onglets : LOBBY, NIVEAUX, PETITS SONS.
     Un toucher = la boucle joue (sans couture, WebAudio) ; un autre toucher = elle s'arrête. Rien d'autre.
     Sons : atelier-son/boucles8.py (lobby, niveaux) et atelier-son/petits.py (petits sons). -->
<style>
:root{--fond:#f5f5f7;--carte:#fff;--tx:#1d1d1f;--tx2:#6e6e73;--fil:#d2d2d7;--bleu:#0071e3;--ombre:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--fond:#000;--carte:#1c1c1e;--tx:#f5f5f7;--tx2:#98989d;--fil:#38383a;--bleu:#0a84ff;--ombre:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
.in{max-width:760px;margin:0 auto;padding:48px 20px 120px}
h1{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:0}
.sous{color:var(--tx2);font-size:17px;margin:6px 0 28px}
.barreO{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.seg{display:inline-flex;background:var(--fil);border-radius:10px;padding:2px}
.poub{position:relative;border:0;background:none;color:var(--tx2);width:40px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;transition:all .15s}
.poub svg{width:20px;height:20px;fill:currentColor}.poub b{position:absolute;top:2px;right:2px;font-size:10px;font-weight:600;color:var(--tx2)}
/* le GLISSER : les onglets et la corbeille deviennent des cibles */
body.glisse .seg button{outline:2px dashed var(--bleu);outline-offset:-4px}
.seg button.cible{background:var(--bleu)!important;color:#fff}
body.glisse .poub{background:#ff3b3020;color:#ff3b30}.poub.cible{background:#ff3b30!important;color:#fff!important;transform:scale(1.12)}
.c.parti{opacity:.35}
.niv{border-radius:20px;padding:14px;background:color-mix(in srgb,var(--nc) 7%,transparent);border:1.5px solid color-mix(in srgb,var(--nc) 25%,transparent);display:grid;gap:10px;transition:all .15s}
.niv h2{margin:0 4px;font-size:15px;font-weight:600;color:var(--nc);display:flex;align-items:center;gap:8px}
.niv h2 span{font-size:12px;color:var(--tx2);font-weight:500}
.niv.cible{background:color-mix(in srgb,var(--nc) 18%,transparent);border-color:var(--nc);transform:scale(1.01)}
body.glisse .niv{border-style:dashed}
.videN{font-size:13px;color:var(--tx2);text-align:center;padding:14px;border:1.5px dashed var(--fil);border-radius:14px}
#liste .niv+.niv{margin-top:6px}
.seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--tx);padding:7px 18px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--carte);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.liste{display:grid;gap:12px}
.c{display:flex;align-items:center;gap:16px;background:var(--carte);border-radius:18px;padding:16px 18px;box-shadow:var(--ombre);cursor:pointer;
  transition:transform .15s ease;position:relative;overflow:hidden}
.c:active{transform:scale(.985)}
.btn{flex:none;width:44px;height:44px;border-radius:50%;background:var(--fond);display:grid;place-items:center;color:var(--bleu)}
.c.joue .btn{background:var(--bleu);color:#fff}
.btn svg{width:16px;height:16px;fill:currentColor}
.txt{flex:1;min-width:0}
.t{font-size:17px;font-weight:600;letter-spacing:-.01em}
.m{font-size:13px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idee{font-size:14px;color:var(--tx2);margin-top:8px;line-height:1.4;display:none}
.c.joue .idee{display:block}
.tag{font-size:12px;color:var(--tx2);white-space:nowrap}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--bleu);width:0;opacity:0}
.c.joue .prog{opacity:1}
.vol{display:flex;align-items:center;gap:10px;color:var(--tx2);font-size:13px;margin-top:28px}
.vol input{flex:1;max-width:240px;accent-color:var(--bleu)}
/* ---- le RANGEMENT : « ••• » discret sur chaque son (déplacer d'onglet, supprimer), la corbeille en bas */
.plus{flex:none;border:0;background:none;color:var(--tx2);font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer;opacity:.45;letter-spacing:1px}
.c:hover .plus,.plus:focus{opacity:1}.plus:hover{background:var(--fond)}
.menu{position:absolute;z-index:20;background:var(--carte);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;min-width:210px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:15px;color:var(--tx);padding:9px 12px;border-radius:9px;cursor:pointer}
.menu button:hover{background:var(--fond)}.menu button.rouge{color:#ff3b30}.menu hr{border:0;border-top:1px solid var(--fil);margin:4px 8px}
.corb{margin-top:18px;font-size:13px;color:var(--tx2)}.corb a{color:var(--tx2);cursor:pointer;text-decoration:underline}
.corbL{margin-top:8px;display:none}.corbL.on{display:block}
.corbL div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--fil)}
.corbL button{border:0;background:none;color:var(--bleu);font:inherit;font-size:13px;cursor:pointer}
/* ---- LA BOÎTE À CLAUDE : une petite fenêtre pour envoyer un message ou des MP3 (atelier-son/boite.py) */
.bOuvre{position:fixed;right:20px;bottom:20px;border:0;background:var(--bleu);color:#fff;font:inherit;font-size:15px;font-weight:600;
  padding:12px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer;z-index:10}
.boite{position:fixed;right:20px;bottom:20px;width:min(380px,calc(100vw - 40px));background:var(--carte);border-radius:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.25);padding:18px;z-index:11;display:none}
.boite.on{display:block}
.boite h3{margin:0 0 4px;font-size:17px}.boite .x{float:right;border:0;background:var(--fond);color:var(--tx2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px}
.boite p{margin:0 0 12px;color:var(--tx2);font-size:13px}
.boite textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--fil);border-radius:12px;padding:10px;font:inherit;font-size:15px;
  background:var(--fond);color:var(--tx)}
.depot{margin-top:10px;border:1.5px dashed var(--fil);border-radius:12px;padding:12px;text-align:center;color:var(--tx2);font-size:13px;cursor:pointer}
.depot.sur{border-color:var(--bleu);color:var(--bleu)}
.pj{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pj span{font-size:12px;background:var(--fond);border-radius:8px;padding:4px 8px}
.envoi{margin-top:12px;width:100%;border:0;background:var(--bleu);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:11px;border-radius:12px;cursor:pointer}
.envoi:disabled{opacity:.5}
.etatB{margin-top:10px;font-size:13px;color:var(--tx2);min-height:18px}.etatB.ok{color:#34c759}.etatB.ko{color:#ff3b30}
.hist{margin-top:10px;font-size:12px;color:var(--tx2);max-height:110px;overflow:auto;line-height:1.5}
</style>
</head>
<body>
<div class="in">
  <h1>Boucles</h1>
  <p class="sous">Touche une boucle pour l'écouter. Glisse-la sur un onglet pour la ranger, ou sur la corbeille.</p>
  <div class="barreO">
    <div class="seg" id="seg">
      <button data-g="lobby" class="on">Lobby</button><button data-g="niv">Niveaux</button><button data-g="petits">Petits sons</button>
    </div>
    <button class="poub" id="poub" title="Glisse un son ici pour le supprimer — touche pour voir les sons supprimés"><svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12H7L6 9z"/></svg><b id="poubN"></b></button>
  </div>
  <div class="liste" id="liste"></div>
  <div class="corb" id="corb"></div>
  <div class="vol">Volume <input type="range" id="vol" min="0" max="1" step=".01" value=".8"></div>
</div>
<button class="bOuvre" id="bOuvre">Envoyer à Claude</button>
<div class="boite" id="boite">
  <button class="x" id="bFerme" aria-label="Fermer">✕</button>
  <h3>Envoyer à Claude</h3>
  <p>Un message, des MP3 : ça arrive dans la boîte. Ensuite dis-moi « regarde la boîte » dans le chat.</p>
  <textarea id="bTexte" placeholder="Ce que tu veux : une ambiance, un niveau, ce qui te plaît dans ce MP3…"></textarea>
  <div class="depot" id="bDepot">Glisse des MP3 ici, ou touche pour en choisir</div>
  <div class="pj" id="bPj"></div>
  <button class="envoi" id="bEnvoi">Envoyer</button>
  <div class="etatB" id="bEtat"></div>
  <div class="hist" id="bHist"></div>
  <input type="file" id="bFichier" accept="audio/*,.mp3,.m4a,.wav" multiple hidden>
</div>
<script src="assets/audio/music/boucles/boucles-donnees.js"></script>
<script src="assets/audio/music/boucles/petits-donnees.js?v=1"></script>
<script>
'use strict';
// les CIBLES du glisser : chaque onglet, et la corbeille
function cible(el,action){
  el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';el.classList.add('cible');});
  el.addEventListener('dragleave',()=>el.classList.remove('cible'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('cible');document.body.classList.remove('glisse');let id=enGlisse;try{id=id||e.dataTransfer.getData('text/plain');}catch(_){}enGlisse=null;if(id)action(id);});}
let enGlisse=null; // le son qu'on tient (le dataTransfer ne se lit pas partout au lâcher)
const GROUPE={lobby:'LOBBY · 8 SECONDES',niv:'NIVEAUX · 8 SECONDES'};
const ONGLETS={lobby:'Lobby',niv:'Niveaux',petits:'Petits sons'};
// LES NIVEAUX DU JEU : dans l'onglet Niveaux, chaque son est rangé dans l'un d'eux (glisser-déposer)
const NIVS=[['nuages','Nuages','#5ac8fa'],['ville','Ville','#ff2d92'],['orbite','Orbite','#af52de'],['frenesie','Frénésie','#ff3b30'],['aplacer','À placer','#8e8e93']];
function nivDe(pour){pour=(pour||'').toUpperCase();return /NUAGE/.test(pour)?'nuages':/VILLE/.test(pour)?'ville':/ORBITE/.test(pour)?'orbite':/FR[EÉ]N/.test(pour)?'frenesie':'aplacer';}
const TOUS=(window.PETITS||[]).map(p=>({g:'petits',id:p.id,titre:p.titre,style:p.style,bpm:p.bpm,cle:p.cle,dur:p.dur,f:p.f,idee:p.idee})).concat(
  (window.BOUCLES||[]).filter(b=>b.f&&(b.groupe===GROUPE.lobby||b.groupe===GROUPE.niv)).map(b=>({g:b.groupe===GROUPE.lobby?'lobby':'niv',id:b.id,titre:b.titre,
    style:(b.pour||'').split('·').pop().trim(),bpm:b.bpm,cle:b.cle,dur:b.dur,f:b.f,idee:b.idee,niv0:nivDe(b.pour)})));
// LE RANGEMENT de Léo : {groupes:{id:onglet}, corbeille:[id]} — gardé par la boîte (atelier-son/boite/rangement.json), sinon par le navigateur
let RANGE={groupes:{},corbeille:[],niveaux:{}},ong='lobby';
const ongDe=b=>RANGE.groupes[b.id]||b.g,jete=b=>RANGE.corbeille.indexOf(b.id)>=0,nivD=b=>(RANGE.niveaux||{})[b.id]||b.niv0||'aplacer';
function liste(g){return TOUS.filter(b=>ongDe(b)===g&&!jete(b));}
async function rangeCharge(){
  try{RANGE=Object.assign(RANGE,JSON.parse(localStorage.getItem('ccRange')||'{}'));}catch(e){}
  try{const r=await fetch('http://localhost:8768/boite/rangement');const j=await r.json();if(j.rangement&&j.rangement.corbeille)RANGE=j.rangement;}catch(e){}
}
function rangeSauve(){try{localStorage.setItem('ccRange',JSON.stringify(RANGE));}catch(e){}
  fetch('http://localhost:8768/boite/rangement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(RANGE)}).catch(()=>{});}
function deplace(id,g){const b=TOUS.find(x=>x.id===id);if(!b||ongDe(b)===g)return;
  if(g===b.g)delete RANGE.groupes[id];else RANGE.groupes[id]=g;if(cur&&cur.id===id)stop();rangeSauve();rend(ong);}
function place(id,n){const b=TOUS.find(x=>x.id===id);if(!b)return;RANGE.niveaux=RANGE.niveaux||{};RANGE.niveaux[id]=n;
  if(ongDe(b)!=='niv'){if(b.g==='niv')delete RANGE.groupes[id];else RANGE.groupes[id]='niv';}if(cur&&cur.id===id)stop();rangeSauve();rend(ong);}
function supprime(id){if(RANGE.corbeille.indexOf(id)<0)RANGE.corbeille.push(id);if(cur&&cur.id===id)stop();rangeSauve();rend(ong);}
function menu(b,bouton){
  fermeMenu();const m=document.createElement('div');m.className='menu';m.id='menu';
  m.innerHTML=NIVS.filter(n=>n[0]!=='aplacer'&&!(ongDe(b)==='niv'&&nivD(b)===n[0])).map(n=>'<button data-n="'+n[0]+'">Mettre dans '+n[1]+'</button>').join('')+'<hr>'+
    Object.keys(ONGLETS).filter(k=>k!==ongDe(b)&&k!=='niv').map(k=>'<button data-v="'+k+'">Déplacer vers '+ONGLETS[k]+'</button>').join('')+'<button class="rouge" data-x="1">Supprimer</button>';
  const r=bouton.getBoundingClientRect();m.style.top=(r.bottom+scrollY+4)+'px';m.style.left=Math.max(10,r.right+scrollX-210)+'px';
  m.onclick=function(e){const t=e.target.closest('button');if(!t)return;
    fermeMenu();if(t.dataset.n)place(b.id,t.dataset.n);if(t.dataset.v)deplace(b.id,t.dataset.v);if(t.dataset.x)supprime(b.id);};
  document.body.appendChild(m);setTimeout(()=>document.addEventListener('click',fermeMenu,{once:true}),0);}
function fermeMenu(){const m=document.getElementById('menu');if(m)m.remove();}
function corbeille(){
  const jetes=TOUS.filter(jete),c=document.getElementById('corb');document.getElementById('poubN').textContent=jetes.length||'';
  if(!jetes.length){c.innerHTML='';return;}
  const ouvert=c.querySelector('.corbL.on');
  c.innerHTML='<a id="corbA">Sons supprimés ('+jetes.length+')</a><div class="corbL'+(ouvert?' on':'')+'">'+
    jetes.map(b=>'<div><span>'+titre(b.titre)+'</span><button data-r="'+b.id+'">Remettre</button></div>').join('')+'</div>';
  c.querySelector('#corbA').onclick=()=>c.querySelector('.corbL').classList.toggle('on');
  c.querySelector('.corbL').onclick=e=>{const id=e.target.dataset.r;if(!id)return;RANGE.corbeille=RANGE.corbeille.filter(x=>x!==id);rangeSauve();rend(ong);};
}
const titre=t=>t.charAt(0)+t.slice(1).toLowerCase();     // « NÉON NOIR » → « Néon noir »
const PLAY='<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>',STOP='<svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>';
let ac=null,sortie=null,cur=null;const BUF={};
const FICHIER=location.protocol==='file:'; // ouverte en double-clic : le navigateur refuse fetch() → lecteur <audio> (petit blanc possible au raccord)
function audio(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();sortie=ac.createGain();sortie.gain.value=+document.getElementById('vol').value;sortie.connect(ac.destination);}return ac;}
function tampon(b){return BUF[b.f]||(BUF[b.f]=fetch(b.f).then(r=>r.arrayBuffer()).then(ab=>new Promise((ok,ko)=>audio().decodeAudioData(ab,ok,ko))));}
function stop(){if(!cur)return;const c=cur;cur=null;try{if(c.el9){c.el9.pause();c.el9.src='';}else{c.g.gain.setTargetAtTime(0,ac.currentTime,.03);c.s.stop(ac.currentTime+.15);}}catch(e){}c.el.classList.remove('joue');c.el.querySelector('.btn').innerHTML=PLAY;}
async function joue(b,el){
  const meme=cur&&cur.id===b.id;stop();if(meme)return;
  if(FICHIER){const a9=new Audio(b.f);a9.loop=true;a9.volume=+document.getElementById('vol').value;a9.play();
    cur={id:b.id,el9:a9,el:el,lg:b.dur||8};el.classList.add('joue');el.querySelector('.btn').innerHTML=STOP;return;}
  audio();await ac.resume();const buf=await tampon(b);
  // la boucle sans couture : l'amorce AAC sautée, bouclée sur sa durée exacte
  const ex=b.dur?buf.duration-b.dur:0,a=ex>.03?Math.min(ex,2112/buf.sampleRate):0,fin=b.dur?a+b.dur:buf.duration;
  const s=ac.createBufferSource(),g=ac.createGain();s.buffer=buf;s.loop=true;s.loopStart=a;s.loopEnd=fin;g.gain.value=0;
  s.connect(g);g.connect(sortie);const t=ac.currentTime+.03;s.start(t,a);g.gain.setTargetAtTime(1,t,.01);
  cur={id:b.id,s:s,g:g,el:el,t0:t,lg:fin-a};el.classList.add('joue');el.querySelector('.btn').innerHTML=STOP;
}
function carte(b){
  const el=document.createElement('div');el.className='c';
  el.innerHTML='<div class="btn">'+PLAY+'</div><div class="txt"><div class="t">'+titre(b.titre)+'</div><div class="m">'+titre(b.style)+' · '+Math.round(b.bpm)+' BPM · '+b.cle+'</div><div class="idee">'+(b.idee||'')+'</div></div>'+
    '<button class="plus" aria-label="Options">•••</button><i class="prog"></i>';
  el.draggable=true;
  el.ondragstart=function(e){enGlisse=b.id;try{e.dataTransfer.setData('text/plain',b.id);}catch(_){}e.dataTransfer.effectAllowed='move';fermeMenu();
    setTimeout(()=>{document.body.classList.add('glisse');el.classList.add('parti');},0);};
  el.ondragend=function(){setTimeout(()=>{enGlisse=null;},0);document.body.classList.remove('glisse');el.classList.remove('parti');document.querySelectorAll('.cible').forEach(x=>x.classList.remove('cible'));};
  el.onclick=function(e){if(e.target.closest('.plus')){e.stopPropagation();return menu(b,e.target.closest('.plus'));}joue(b,el);};
  return el;}
function rend(g){
  ong=g;stop();const box=document.getElementById('liste');box.innerHTML='';corbeille();
  if(g==='niv'){  // une CASE par niveau du jeu : on y glisse les sons
    NIVS.forEach(function(n){const sons=liste('niv').filter(b=>nivD(b)===n[0]);if(n[0]==='aplacer'&&!sons.length)return;
      const sec=document.createElement('section');sec.className='niv';sec.style.setProperty('--nc',n[2]);
      sec.innerHTML='<h2>'+n[1]+'<span>'+sons.length+'</span></h2>';
      sons.forEach(b=>sec.appendChild(carte(b)));
      if(!sons.length){const v=document.createElement('div');v.className='videN';v.textContent='Glisse un son ici';sec.appendChild(v);}
      cible(sec,id=>place(id,n[0]));box.appendChild(sec);});
    return;}
  liste(g).forEach(b=>box.appendChild(carte(b)));
  if(!box.children.length)box.innerHTML='<p class="sous" style="margin:0">Aucun son ici.</p>';
}
document.getElementById('seg').onclick=function(e){const b=e.target.closest('button');if(!b)return;
  this.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));rend(b.dataset.g);};
document.getElementById('vol').oninput=function(e){if(cur&&cur.el9)cur.el9.volume=+e.target.value;if(sortie)sortie.gain.setTargetAtTime(+e.target.value,ac.currentTime,.05);};
(function f(){requestAnimationFrame(f);if(!cur)return;const p=cur.el9?(cur.el9.currentTime%cur.lg)/cur.lg:((ac.currentTime-cur.t0)%cur.lg)/cur.lg;cur.el.querySelector('.prog').style.width=(p*100)+'%';})();
rangeCharge().then(()=>rend('lobby'));
document.querySelectorAll('#seg button').forEach(b=>cible(b,id=>deplace(id,b.dataset.g)));
cible(document.getElementById('poub'),supprime);
document.getElementById('poub').onclick=function(){const l=document.querySelector('.corbL');if(l){l.classList.add('on');l.scrollIntoView({behavior:'smooth',block:'center'});}};
// ---- LA BOÎTE À CLAUDE (le serveur : python3 atelier-son/boite.py, sur :8768)
(function(){
  const B='http://localhost:8768',$=id=>document.getElementById(id);let pj=[];
  const etat=(t,k)=>{const e=$('bEtat');e.textContent=t;e.className='etatB'+(k?' '+k:'');};
  async function hist(){try{const r=await fetch(B+'/boite/liste');const j=await r.json();
    $('bHist').innerHTML=j.items.length?'<b>Déjà envoyé</b><br>'+j.items.map(t=>t.replace(/</g,'&lt;')).join('<br>'):'';etat('');}
    catch(e){etat('La boîte est fermée. Lance : python3 atelier-son/boite.py','ko');}}
  function ajoute(fs){for(const f of fs)if(/^audio\//.test(f.type)||/\.(mp3|m4a|wav|aac|flac|ogg)$/i.test(f.name))pj.push(f);
    $('bPj').innerHTML=pj.map(f=>'<span>♪ '+f.name.replace(/</g,'&lt;')+'</span>').join('');}
  $('bOuvre').onclick=()=>{$('boite').classList.add('on');$('bOuvre').style.display='none';hist();$('bTexte').focus();};
  $('bFerme').onclick=()=>{$('boite').classList.remove('on');$('bOuvre').style.display='';};
  const d=$('bDepot');d.onclick=()=>$('bFichier').click();$('bFichier').onchange=e=>{ajoute(e.target.files);e.target.value='';};
  d.ondragover=e=>{e.preventDefault();d.classList.add('sur');};d.ondragleave=()=>d.classList.remove('sur');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('sur');ajoute(e.dataTransfer.files);};
  $('bEnvoi').onclick=async function(){
    const texte=$('bTexte').value.trim();if(!texte&&!pj.length)return etat('Écris un message ou ajoute un MP3.','ko');
    this.disabled=true;etat('Envoi…');
    try{const noms=[];
      for(const f of pj){etat('Envoi de '+f.name+'…');const r=await fetch(B+'/boite/mp3?nom='+encodeURIComponent(f.name),{method:'POST',body:f});noms.push((await r.json()).nom);}
      const r=await fetch(B+'/boite/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texte:texte,fichiers:noms})});
      if(!(await r.json()).ok)throw 0;
      $('bTexte').value='';pj=[];$('bPj').innerHTML='';await hist();etat('Envoyé ✓ Dis-moi « regarde la boîte » dans le chat.','ok');}
    catch(e){etat('La boîte est fermée. Lance : python3 atelier-son/boite.py','ko');}
    this.disabled=false;};
})();
</script>
</body>
