<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirage — 30 paliers</title>
<style>
:root{--fond:#fff;--tx:#17141c;--tx2:#8a8494;--fil:#e4e1ea;--acc:#0e8a5f}
@media (prefers-color-scheme:dark){:root{--fond:#0b090d;--tx:#f2f0f7;--tx2:#9a94a8;--fil:#2a2633;--acc:#21c48a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:16px}
.boite{width:100%;max-width:560px;border:1px solid var(--fil);border-radius:20px;padding:24px;display:grid;gap:18px}
h1{margin:0;font-size:22px}.sous{color:var(--tx2);font-size:13px;margin-top:4px}
.rang{display:flex;gap:16px;align-items:center}
#play{width:72px;height:72px;border-radius:50%;border:0;background:var(--tx);color:var(--fond);font-weight:700;cursor:pointer;flex:none}
.pals{display:grid;gap:6px;flex:1}#speed{width:100%}#mot{font-weight:700;font-size:18px}
#ce{color:var(--tx2);font-size:13px;min-height:36px}
</style></head><body>
<div class="boite">
  <div><h1>MIRAGE · 30 PALIERS</h1><div class="sous">écrit à la main, sans le générateur · 100 BPM · ré hijaz · downtempo de désert : le luth pincé et la darbouka font le rythme, la trompette bouchée chante — en 30 moteurs</div></div>
  <div class="rang"><button id="play">PLAY</button><div class="pals"><div id="mot">Moteur 1 / 30</div><input type="range" id="speed" min="0" max="100" step="any" value="0" aria-label="Moteur"></div></div>
  <div id="ce"></div>
</div>

<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     (2026-11-02, pôle SON ; Léo : « refonte totale de MIRAGE » ; et, de l'ancienne : « la musique est magnifique, la trompette arrive trop vite : au moins au niveau 6 ; ça peut évoluer de 6 à 15 ; de 20 à 30 un truc encore plus intense »).
     LE MIRAGE : un downtempo de désert (ré hijaz, 100 BPM). Le LUTH pincé (l'oud) et la DARBOUKA (maqsum) font le moteur de rythme ; la nappe scintille (des étoiles dès le moteur 1) ;
     la TROMPETTE BOUCHÉE, voix signature, n'entre qu'au moteur 6 (la moitié du thème), chante tout le thème dès 8, s'étoffe jusqu'à 15 (le ney qui répond au 9, les échos au 10, la seconde trompette au 12)
     et retire sa sourdine au 24 ; la grosse caisse bascule au 15 ; de 20 à 30 : l'air chaud, un violon solo (22), le chœur « ou » (23), la pluie d'étoiles (24), les cuivres (26), le climax (27), le final (28).
     (3/11, Léo : « renforce toute l'idée de Mirage » ; « la fin part un peu trop en couille » ; « la rythmique est la même que Cavale ») RENFORT : le vent (2), le taqsim du luth (9), les appogiatures (10), les zills (12), le reflet en cloche (14) ;
     la rythmique n'est plus celle de Cavale : swing de désert dès 4, SAÏDI de darbouka + daff à partir de 15 (aucune grosse caisse, aucun clap au 2 et au 4), roulade tek-ka au lieu des toms ;
     20-30 = la grandeur lente : gong (20), nappe et cordes qui s'élargissent, violon (22), chœur (23), trompette ouverte (24), bourdon de ré (26), cordes à l'octave (28), luth en noires (29) ; plus de stabs, cuivres, charleys 16, ride ni roulements.
     La basse est COURTE (un sous qui claque, une scie filtrée qui mord ; un creux dans la boue 280 Hz) : jamais de 808 qui traîne.
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 100, SD = 60 / BPM / 4, MES = 16 * SD;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // LA GRILLE (ré hijaz : ré, mi♭, fa♯, sol, la, si♭, do), une phrase de 8 mesures, deux mesures par accord : D7 · E♭maj7 · Gm9 · A7(♭9) — la seconde augmentée mi♭→fa♯ est la couleur du désert
  const ROOTS = [38, 38, 39, 39, 43, 43, 45, 45];
  const CHORDS = [[50, 54, 57, 60, 64], [50, 54, 57, 60, 64], [51, 55, 58, 62, 65], [51, 55, 58, 62, 65], [55, 58, 62, 65, 69], [55, 58, 62, 65, 69], [57, 61, 64, 67, 70], [57, 61, 64, 67, 70]];
  // LE LUTH (l'oud pincé), moteur de rythme : 16 doubles croches, des rangs dans l'accord (0-4)
  const SEQ = [0, 2, 3, 2, 1, 3, 4, 3, 0, 2, 3, 4, 3, 2, 1, 2], SEQB = [4, 3, 2, 1, 4, 3, 2, 3, 4, 3, 2, 1, 0, 1, 2, 3];
  // LA TROMPETTE BOUCHÉE (la voix signature), dès 6 : [pas sur 128, note, durée] — le saut mi♭ → fa♯ (seconde augmentée) en est la marque ; elle monte à la quarte puis redescend sur le la
  const THEME = [[0, 74, 4], [4, 75, 2], [6, 78, 6], [12, 79, 2], [14, 78, 2], [16, 75, 4], [20, 74, 4], [24, 72, 4], [28, 69, 4],
    [32, 75, 6], [38, 79, 2], [40, 82, 4], [44, 79, 2], [46, 75, 2], [48, 74, 4], [52, 75, 4], [56, 79, 6], [62, 75, 2],
    [64, 79, 6], [70, 77, 2], [72, 74, 4], [76, 77, 2], [78, 79, 2], [80, 82, 6], [86, 81, 2], [88, 79, 6], [94, 77, 2],
    [96, 69, 4], [100, 70, 2], [102, 73, 6], [108, 76, 4], [112, 79, 4], [116, 76, 4], [120, 73, 4], [124, 70, 4]];
  // LE NEY (flûte de roseau), dès 9 : des notes longues au-dessus, qui répondent à la trompette
  const NEY = [[0, 81, 12], [12, 79, 4], [16, 78, 8], [24, 75, 8], [32, 82, 12], [44, 79, 4], [48, 79, 8], [56, 75, 8], [64, 82, 12], [76, 81, 4], [80, 79, 8], [88, 77, 8], [96, 85, 8], [104, 82, 8], [112, 81, 6], [118, 79, 2], [120, 76, 8]];
  // LE VIOLON SOLO (le lead de 20 à 30), dès 22 : une octave au-dessus de la trompette, des notes longues dans l'accord, des glissandos
  const VIOLON = [[0, 86, 6], [6, 84, 2], [8, 81, 8], [16, 84, 8], [24, 81, 8], [32, 87, 8], [40, 86, 4], [44, 82, 4], [48, 79, 8], [56, 82, 8], [64, 86, 8], [72, 82, 4], [76, 79, 4], [80, 81, 8], [88, 86, 8],
    [96, 85, 8], [104, 88, 4], [108, 85, 4], [112, 82, 6], [118, 85, 2], [120, 81, 8]];
  // LA DARBOUKA : D = dum, T = tek, t = ka (fantôme) ; quatre variantes de maqsum, une par phrase
  const DARB = ['D...T.T.D.T.T...', 'D.t.T.T.D...T.t.', 'D..tT.T.D.T.T.tT', 'D.T.T...D.T.Tt..'];
  /* LE SAÏDI (dès 15, Léo : « la rythmique de Mirage est la même que celle de Cavale ») : un cycle de darbouka à la place de la grosse caisse — la peau grave au 1, au 4+ et au 3, des teks sur les contretemps, un seul tsaff (C) en fin de mesure ; jamais de kick à chaque temps, jamais de clap au 2 et au 4 */
  const SAIDI = ['D.T.t.D.D.T...C.', 'D.T..tD.D.T.t.tC', 'D.T.t.D.D.t.T.C.', 'D.t.T..DD.T.t.tC'];
  const PERC = ['..H...L...H..L..', '...H..L..H...L.H', '..H.L...H..H..L.', '.H..L..H..L.H...'];

  const QUAND = { oud: 1, pad: 1, dum: 1, etoiles: 1, riq: 2, tek: 4, shaker: 5, trompette: 6, sub: 6, maqsum: 7, pleine: 8, ney: 9, clap: 10, large: 11, trompette2: 12, mord: 13, toms: 14, drive: 15, kick: 15,
    riser: 99, cordes: 17, oud2: 18, stab: 99, crash: 99, air: 20, ride: 99, hats16: 99, violon: 22, voix: 23, echos: 23, ouverte: 24, violon2: 25, roule: 99, cor: 99, climax: 27, final: 28, darb2: 99, octave: 30,
    gong: 20, bourdon: 26, noires: 29,   /* (3/11, Léo : « la fin part un peu trop en couille ») 20-30 = la grandeur lente : plus de stabs, de cuivres, de charleys, de roulements ni de ride ; un gong, un bourdon, des couches larges */
    vent: 2, taq: 9, orne: 10, zill: 12, reflet: 14, vide: 18 };   /* (2026-11-03, Léo : « renforce toute l'idée de Mirage ») le désert se renforce : le vent, le taqsim, l'ornement, les zills, le reflet, le vide */
  const ENTRE = { 1: 'Le mirage : la nappe qui scintille, le luth pincé qui compte, un cœur de tambour sur cadre, des étoiles dans la chaleur. Rien de grave : une basse courte viendra.', 2: '+ les grelots du riq, un souffle de vent qui traverse le désert', 3: '+ le luth en croches',
    4: '+ la darbouka : le tek', 5: '+ le shaker', 6: 'LA TROMPETTE BOUCHÉE : la moitié du thème, doucement, + la sous-basse courte', 7: '+ la darbouka en maqsum complet', 8: '+ le luth en doubles croches ; la trompette chante tout le thème',
    9: '+ le ney, qui lui répond ; le TAQSIM : le luth s’échappe en une course libre en fin de phrase', 10: '+ le tsaff (claquement de mains) en fin de mesure, la trompette s’ouvre aux échos et s’orne de petites appogiatures', 11: 'La nappe s’élargit', 12: '+ la seconde trompette (la tierce au-dessus), les zills de la caravane (3-3-3-3-4)', 13: '+ la basse mordante, courte',
    14: '+ la roulade de darbouka en fin de phrase, le reflet : la dernière note de la trompette rebondit en cloche dans la chaleur', 15: 'LA BASCULE : le saïdi — la darbouka change de cycle, la peau grave au 1, au 3 et au contretemps ; plus de grosse caisse, le désert se lève sans taper les temps', 17: '+ les cordes qui respirent',
    18: '+ un second luth une octave au-dessus ; LE VIDE : toutes les quatre phrases, tout s’arrête une fraction de seconde avant la reprise (jusqu’au 26)', 19: 'Le rythme est posé : il ne bougera plus, c’est le reste qui grandit',
    20: 'LA GRANDEUR : un gong de bronze au début de chaque phrase, un souffle d’air chaud', 21: 'La nappe et les cordes s’élargissent, lentement ; le luth se calme en croches, les ornements se retirent', 22: 'LE LEAD : un violon solo chante par-dessus (notes longues, glissandos) ; le ney et la seconde trompette lui laissent la place',
    23: '+ le chœur « ou » aérien, les échos', 24: 'LA TROMPETTE RETIRE SA SOURDINE : plus claire, plus large ; + les étoiles en pluie lente', 25: '+ le violon à deux voix', 26: '+ le bourdon : une quinte de ré qui ne bouge plus, hypnotique',
    27: 'LE CLIMAX : un second gong au milieu de la phrase, les étoiles se resserrent', 28: 'Le final : les cordes se doublent à l’octave', 29: 'Le luth ne marque plus que les temps : le désert respire', 30: 'Le violon monte d’une octave, la trompette reste au centre.' };
  const PALIERS30 = Array.from({ length: 30 }, (_, k) => ENTRE[k + 1] || 'Le désert s’ouvre d’un cran.');
  const BASE = { oud: .62, pad: .5, dum: .5, riq: .22, tek: .4, shaker: .24, sub: .3, mord: .28, trompette: .62, trompette2: .34, ney: .4, violon: .6, violon2: .3, clap: .46, toms: .5, riser: .34, stab: .4, crash: .4, ride: .2, hats: .24, caisse: .45, cor: .38, voix: .45, air: .24, etoiles: .22, gong: .9, bourdon: .4, vent: .3, zill: .5, reflet: .55, kick: .8, oud2: .3, cordes: .34 };
  const niv = (id, p) => { const e = id === 'caisse' ? QUAND.roule : id === 'hats' ? QUAND.hats16 : id === 'oud2' ? QUAND.oud2 : (QUAND[id] || 1); if (p < e) return 0; const r = Math.min(1, (p - e) / 6), g = .72 + .28 * (p - 1) / 29;
    return (BASE[id] || .3) * (.82 + .18 * r) * g * (id === 'etoiles' && p < 24 ? .32 : 1); };
  const FILTRE_OUD = p => Math.min(5200, 1000 * Math.pow(1.07, p - 1));
  const FILTRE_PAD = p => Math.min(4200, 700 * Math.pow(1.08, p - 1));
  const POMPE = p => p < QUAND.drive ? .85 : Math.max(.45, .76 - .02 * (p - QUAND.drive));

  function preparer(ctx, sortie, alea) {
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
    const courbe = k => { const c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; };
    const impulsion = (len, dec, lp) => { const n = Math.floor(ctx.sampleRate * len), b = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let y = 0; const a = Math.exp(-2 * Math.PI * lp / ctx.sampleRate);
        for (let i = 0; i < n; i++) { y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.pow(1 - i / n, dec); } } return b; };
    const master = G(.5), chaud = ctx.createWaveShaper(); chaud.curve = courbe(1.1); chaud.oversample = '2x';
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 2; comp.attack.value = .015; comp.release.value = .2;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -3; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1; lim.knee.value = 0;
    // le grave est tenu : passe-haut à 36 Hz et un creux dans la boue 280 Hz
    const boue = F('peaking', 280, .9); boue.gain.value = -2.5;
    chaine(master, F('highpass', 36, .7), boue, chaud, comp, lim, sortie);
    const salle = ctx.createConvolver(); salle.buffer = impulsion(3.0, 2.3, 3000); const envoiSalle = G(1); chaine(envoiSalle, salle, F('highpass', 280, .7), G(.3), master);
    const dG = ctx.createDelay(2), dD = ctx.createDelay(2); dG.delayTime.value = SD * 3; dD.delayTime.value = SD * 3;
    const fb = G(.36), echoIn = G(1), echoSort = G(0), pG = ctx.createStereoPanner(), pD = ctx.createStereoPanner(); pG.pan.value = -.7; pD.pan.value = .7;
    chaine(echoIn, F('lowpass', 4200, .7), F('highpass', 320, .7), dG); dG.connect(dD); dD.connect(fb); fb.connect(dG); dG.connect(pG); dD.connect(pD); pG.connect(echoSort); pD.connect(echoSort); echoSort.connect(master); echoSort.connect(envoiSalle);
    const pompe = G(1); pompe.connect(master);
    const ids = ['oud', 'oud2', 'pad', 'cordes', 'dum', 'tek', 'riq', 'shaker', 'hats', 'kick', 'clap', 'sub', 'mord', 'trompette', 'trompette2', 'ney', 'violon', 'violon2', 'voix', 'air', 'etoiles', 'toms', 'riser', 'stab', 'crash', 'ride', 'caisse', 'cor', 'vent', 'zill', 'reflet', 'gong', 'bourdon'], bus = {};
    ids.forEach(id => bus[id] = G(0));
    ['pad', 'cordes', 'stab', 'cor', 'voix'].forEach(id => bus[id].connect(pompe));
    ids.filter(id => ['pad', 'cordes', 'stab', 'cor', 'voix'].indexOf(id) < 0).forEach(id => bus[id].connect(master));
    const envoi = (id, v) => { const g = G(v); bus[id].connect(g); g.connect(envoiSalle); };
    envoi('pad', .45); envoi('cordes', .4); envoi('oud', .15); envoi('oud2', .2); envoi('trompette', .4); envoi('trompette2', .4); envoi('ney', .5); envoi('violon', .45); envoi('violon2', .45); envoi('voix', .6); envoi('air', .3);
    envoi('etoiles', .9); envoi('vent', .5); envoi('gong', .8); envoi('bourdon', .3); envoi('zill', .35); envoi('reflet', 1.1); envoi('tek', .22); envoi('riq', .2); envoi('clap', .5); envoi('caisse', .4); envoi('toms', .3); envoi('stab', .3); envoi('cor', .3); envoi('dum', .12);
    { const g = G(.4); bus.oud.connect(g); g.connect(echoIn); const g2 = G(.45); bus.trompette.connect(g2); g2.connect(echoIn); const g3 = G(.4); bus.ney.connect(g3); g3.connect(echoIn); const g4 = G(.3); bus.violon.connect(g4); g4.connect(echoIn); }
    const filtrePad = F('lowpass', 700, .7); filtrePad.connect(bus.pad);
    const kickSat = ctx.createWaveShaper(); kickSat.curve = courbe(1.4); kickSat.connect(bus.kick);
    const bruit = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); { const d = bruit.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = alea() * 2 - 1; }
    return { bus, pompe, filtrePad, kickSat, echoSort, bruit, master };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    p = Math.max(1, Math.min(30, p | 0));
    const b = kit.bus, A = id => p >= QUAND[id];
    for (const id in b) b[id].gain.setValueAtTime(niv(id, p), t0);
    kit.master.gain.setTargetAtTime(.56 + .5 * Math.pow((p - 1) / 29, 1.2), t0, .5);
    kit.filtrePad.frequency.setTargetAtTime(FILTRE_PAD(p), t0, .4); kit.echoSort.gain.setValueAtTime(A('echos') ? .5 : 0, t0);
    const osc = (type, f, dt) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; if (dt) o.detune.value = dt; return o; };
    const filt = (type, f, q) => { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };
    const gain = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const env = (g, t, pic, a, dur) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, pic), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); };
    /* (2026-11-03, audit du palier 30) UN filtre par (sortie, type, fréquence, Q), partagé par tous les coups de bruit : le coup passe dans son gain PUIS dans le filtre (même son, des centaines de filtres de moins par phrase) */
    const filtreBruit = (dest, type, f, q) => { const W = kit.fb || (kit.fb = new WeakMap()); let M = W.get(dest); if (!M) W.set(dest, M = {}); const k = type + f + '/' + q; if (!M[k]) { M[k] = filt(type, f, q); M[k].connect(dest); } return M[k]; };
    const bruit = (t, dest, type, f, q, pic, dur) => { const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = kit.bruit; env(g, t, pic, .002, dur);
      s.connect(g); g.connect(filtreBruit(dest, type, f, q)); s.start(t, alea() * 1.2); s.stop(t + dur + .02); };

    // ---- les instruments ----
    // le luth pincé (l'oud) : deux scies + un triangle à l'octave, dans un filtre qui claque ouvert puis retombe ; le « tic » du médiator en bruit — c'est le moteur de rythme
    const oud = (t, midi, v, dest, oct) => { const f = mtof(midi + (oct || 0)), x = filt('lowpass', 1000, 2.6), g = ctx.createGain(), top = Math.min(7000, FILTRE_OUD(p) * 1.8);
      x.frequency.setValueAtTime(top, t); x.frequency.exponentialRampToValueAtTime(Math.max(360, top * .2), t + .15); env(g, t, v, .003, .34);
      [['sawtooth', -5, 1], ['sawtooth', 5, 1], ['triangle', 0, .5]].forEach(([ty, dt, gv]) => { const o = osc(ty, ty === 'triangle' ? f * 2 : f, dt), gg = ctx.createGain(); gg.gain.value = gv; o.connect(gg); gg.connect(x); o.start(t); o.stop(t + .38); });
      x.connect(g); g.connect(dest); bruit(t, dest, 'bandpass', 3000, 1.2, v * .08, .012); };
    const nappe = (t, accord, dur, dest) => { const g = ctx.createGain(), v = (A('large') ? .062 : .05) + (p >= 17 ? .06 * (p - 16) / 14 : 0); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .9); g.gain.setValueAtTime(v, t + dur - .2); g.gain.linearRampToValueAtTime(.0001, t + dur + .7);
      const voixs = A('large') ? accord.concat(accord[0] + 12) : accord;
      voixs.forEach((m, k) => [-10, 0, 10].forEach((dt, j) => { const o = osc('sawtooth', mtof(m), dt), pn = ctx.createStereoPanner(); pn.pan.value = (j - 1) * (A('large') ? .8 : .5); o.connect(pn); pn.connect(g); o.start(t); o.stop(t + dur + .8); }));
      g.connect(dest); };
    // la trompette bouchée : deux scies + un carré dans deux formants (« wa » de la sourdine à ~1 000 Hz) ; ouverte (dès 24) le filtre s'ouvre et la sourdine tombe ; vibrato qui n'arrive qu'après 0,3 s
    const trompette = (t, midi, len, v, dest, ouverte) => { const dur = SD * len, f = mtof(midi), g = gain(0), lp = filt('lowpass', ouverte ? 4600 : 2700, .8), f1 = filt('bandpass', ouverte ? 1500 : 1000, ouverte ? 1.4 : 3), f2 = filt('bandpass', ouverte ? 2600 : 2100, 2.5), a1 = gain(ouverte ? 1.4 : 2), a2 = gain(1), lfo = osc('sine', 5.4), lg = gain(0);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .05); g.gain.setValueAtTime(v, t + Math.max(.06, dur - .09)); g.gain.linearRampToValueAtTime(.0001, t + dur + .1);

<script>
(function () {
  let ctx = null, kit = null, p = 1, m = 0, tNext = 0, iv = 0;
  let graine = 9664; const alea = () => { graine = (graine * 1664525 + 1013904223) >>> 0; return graine / 4294967296; };
  const mes = 240 / MORCEAU.bpm;
  const ce = document.getElementById('ce'), play = document.getElementById('play'), jg = document.getElementById('speed'), mot = document.getElementById('mot');
  const maj = () => { mot.textContent = 'Moteur ' + p + ' / 30'; ce.textContent = 'Moteur ' + p + ' · ' + MORCEAU.paliers[p - 1]; };
  jg.addEventListener('input', () => { p = Math.max(1, Math.min(30, 1 + Math.round(+jg.value / 100 * 29))); maj(); });
  play.onclick = () => {
    if (iv) { clearInterval(iv); iv = 0; ctx.close(); ctx = null; play.textContent = 'PLAY'; maj(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)(); kit = MORCEAU.preparer(ctx, ctx.destination, alea);
    m = 0; tNext = ctx.currentTime + 0.1; play.textContent = 'STOP';
    iv = setInterval(() => { while (tNext < ctx.currentTime + 0.4) { MORCEAU.jouer(ctx, kit, p, tNext, m++, 1, alea); tNext += mes; } maj(); }, 60);
  };
  maj();
})();
</script>
