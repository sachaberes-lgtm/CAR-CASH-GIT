<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rubis de néon — 30 paliers</title>
<style>
:root{--fond:#fff;--tx:#17141c;--tx2:#8a8494;--fil:#e4e1ea;--acc:#b0122e}
@media (prefers-color-scheme:dark){:root{--fond:#0b090d;--tx:#f2f0f7;--tx2:#9a94a8;--fil:#2a2633;--acc:#e0314f}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:16px}
.boite{width:100%;max-width:560px;border:1px solid var(--fil);border-radius:20px;padding:24px;display:grid;gap:18px}
h1{margin:0;font-size:22px}.sous{color:var(--tx2);font-size:13px;margin-top:4px}
.rang{display:flex;gap:16px;align-items:center}
#play{width:72px;height:72px;border-radius:50%;border:0;background:var(--tx);color:var(--fond);font-weight:700;cursor:pointer;flex:none}
.pals{display:grid;gap:6px;flex:1}#speed{width:100%}#mot{font-weight:700;font-size:18px}
#ce{color:var(--tx2);font-size:13px;min-height:36px}
</style></head><body>
<div class="boite">
  <div><h1>RUBIS DE NÉON · 30 PALIERS</h1><div class="sous">écrit à la main, sans le générateur · 118 BPM · fa mineur · sans basse : piano feutré, verre fumé, chœur, cordes, harmonie qui évolue ; premium (3/11) : congas et cristaux, voix de rubis, climax net — en 30 moteurs</div></div>
  <div class="rang"><button id="play">PLAY</button><div class="pals"><div id="mot">Moteur 1 / 30</div><input type="range" id="speed" min="0" max="100" step="any" value="0" aria-label="Moteur"></div></div>
  <div id="ce"></div>
</div>

<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     (2026-10-16, pôle SON ; Léo : « réécris complètement RUBIS DE NÉON, juste le nom garde-le » · « oublie le générateur, juste le système de
     musique évolutive jusqu'à 30 » · « surprends-moi, de nouveaux sons » · et tout ce qu'il a dit avant : un début qui tient (« pas trop léger,
     pas un instrument inaudible seul »), plus rêveur et poli qui suit l'intensité, pas d'ennui dès 10, dynamique dès 15, le climax sur les
     derniers, au 30 le registre qui monte ; rien d'enfantin ni de cirque, pas de flûte.)
     Tous les instruments sont écrits ici (aucun son du générateur) : LE PIANO FEUTRÉ, LA NAPPE DE VERRE FUMÉ, LE CHŒUR (la voyelle « ou »
     qui s'ouvre vers « a »), LES CORDES EN TENUE, L'HARMONIE DE NAPPE, LES ACCORDS HACHÉS, L'ARPÈGE QUI PULSE, la batterie, le souffle.
     PAS DE BASSE (16/10, Léo : « enlève la basse et profites-en pour charger encore plus, harmonieux ») : rien d'harmonique ne descend sous le
     do grave (do 3, 131 Hz).
     ===== LA VERSION PREMIUM (2026-11-03, Léo : « une version premium des musiques du jeu, la nouvelle DA, mais les anciens sons ne perdent
     pas leur identité » · « aucun son qui se ressemble à un autre ») : l'identité reste (fa mineur, 118 BPM, la grille, le thème du violoncelle,
     le piano feutré, le verre fumé, le chœur, pas de basse) ; ce qui est neuf : une rythmique à elle (grosse caisse fantôme, CONGAS en clave 3-2,
     TICS DE VERRE en 2-3-3-2-3, ARPÈGE DE CRISTAL, claps qui se doublent, impact de phrase) — jamais la rythmique partagée, qui ne s'y accroche
     plus ; LA VOIX DE RUBIS (un lead de verre chantant, FM, qui joue le thème, glisse d'une note à l'autre et se referme doucement) ; un climax
     net (28-30) au lieu d'un empilement ; des paliers marqués (un élément nouveau tous les 1-3 moteurs) ; des reprises qui changent (la
     4ᵉ phrase respire, la 3ᵉ ornemente). Les frappes sont des tampons calculés une fois (pas de filtre en direct par coup de charley) : le
     moteur 30 reste léger pour un téléphone.
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 118, SD = 60 / BPM / 4, MES = 16 * SD, PHR = 8 * MES, SW = 0.05;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // LA GRILLE (fa mineur), une phrase de 8 mesures : Fm9 · D♭maj9 · A♭maj9 · E♭(add9) · Fm9 · D♭maj9 · B♭m9 · C7(♭9) — voicings dans le médium
  const ROOTS = [41, 37, 44, 39, 41, 37, 46, 36];
  const CHORDS = [[56, 60, 63, 67], [56, 60, 63, 65], [55, 58, 60, 63], [55, 58, 63, 65], [56, 60, 63, 67], [56, 60, 63, 65], [56, 60, 61, 65], [55, 58, 61, 64]];
  // LE THÈME du violoncelle : [pas sur la phrase (0-127), note, durée en pas] — il descend, se pose, remonte, et s'appuie sur la sensible (mi) du do7
  const THEME = [[2, 72, 2], [4, 70, 2], [6, 68, 6], [12, 67, 2], [14, 68, 2], [16, 65, 10], [32, 63, 2], [34, 65, 2], [36, 67, 4], [40, 68, 2], [42, 70, 2], [44, 72, 4],
    [48, 70, 12], [64, 72, 2], [66, 75, 2], [68, 73, 6], [74, 72, 2], [76, 70, 4], [80, 68, 10], [96, 68, 2], [98, 70, 2], [100, 72, 4], [104, 70, 2], [106, 68, 2], [108, 67, 4],
    [112, 67, 4], [116, 64, 8]];
  const GAMME = [5, 7, 8, 10, 0, 1, 3];   // fa mineur (classes) : la seconde voix chante une tierce DIATONIQUE en dessous
  const degre = (n, d) => { const pc = ((n % 12) + 12) % 12; let k = GAMME.indexOf(pc); if (k < 0) return n + d; k = (k + d + 7 * 4) % 7; let m = n + (d > 0 ? 1 : -1); while ((((m % 12) + 12) % 12) !== GAMME[k]) m += d > 0 ? 1 : -1; return m; };   // d = +1 (degré au-dessus), -2 (tierce dessous)…
  const ARP = [0, 1, 2, 3, 2, 1, 3, 2];                       // le piano feutré : les notes de l'accord, en croches
  // LES CORDES : l'accord OUVERT de chaque mesure, du do 3 au ré♭ 5, écrit voix par voix pour qu'elles se suivent pas à pas
  const CORDES = [[53, 60, 63, 68, 72], [49, 56, 60, 65, 72], [51, 56, 60, 67, 70], [51, 58, 63, 67, 70], [53, 60, 63, 68, 72], [49, 56, 60, 65, 72], [53, 58, 61, 68, 72], [48, 55, 58, 64, 73]];
  const HACHE = [2, 6, 10, 14], PULSE = [0, 2, 1, 3, 2, 1, 3, 2, 0, 2, 1, 3, 2, 3, 1, 2];
  // LES CONGAS en clave 3-2 (pas de la mesure) : [grave], [aigu] ; la mesure impaire déplace le dernier coup
  const TUMBA = [3, 10], QUINTO = [6, 9, 14];
  const TICS = [2, 5, 8, 10, 13];                              // les tics de verre : 2-3-3-2-3
  const ARPEGE = [0, 3, 6, 8, 11, 14], ARPEGE2 = [1, 4, 7, 10, 12, 15];

  // QUAND chaque élément entre (le moteur, 1 à 30) — un DÉBUT COMPLET mais calme, puis du nouveau tous les 1-3 moteurs
  const QUAND = { piano: 1, nappe: 1, coeur: 1, shaker: 2, choeur: 3, kick4: 4, clap: 5, pianoPlein: 6, congas: 6, hats: 7, ouvre: 8, tics: 8, cello: 9, echos: 10,
    hache: 11, rim: 12, cordes: 13, seconde: 14, pulse: 15, ouverts: 15, pompe: 15, fantome: 16, toms: 17, themeB: 18, arpege: 19, crash: 20, voix: 21, cinq: 22,
    flam: 23, roule: 24, souffle: 25, ornements: 26, climax: 27, impact: 28, final: 29, octave: 30 };
  const ENTRE = { 1: 'Le piano feutré qui arpège, la nappe de verre fumé sur deux octaves, le cœur qui bat. Pas de basse.', 2: '+ le shaker', 3: '+ le chœur « ou » qui tient l’accord',
    4: '+ la grosse caisse à chaque temps', 5: '+ le clap dans la salle', 6: '+ le piano sur toute la phrase, les congas en clave 3-2', 7: '+ les charleys', 8: 'La nappe s’ouvre ; + les tics de verre (2-3-3-2-3)',
    9: 'L’HARMONIE DE NAPPE : un accord lié à trois voix qui gonfle et s’ouvre, sa voix du haut chante le thème, lentement', 10: '+ les échos qui rêvent', 11: '+ les accords hachés', 12: '+ les rimshots', 13: '+ les cordes en tenue, l’accord ouvert',
    14: '+ une quatrième voix dans l’harmonie', 15: 'ÇA DÉCOLLE : l’arpège qui pulse, les charleys ouverts, la pompe (les cordes respirent avec)', 16: '+ la grosse caisse fantôme, entre les temps', 17: '+ les toms en fin de phrase',
    18: '+ le thème qui monte d’un cran', 19: 'L’ARPÈGE DE CRISTAL : les tics s’enchaînent en cloches sur l’accord', 20: '+ la cymbale à chaque phrase', 21: 'LA VOIX DE RUBIS : un lead de verre qui chante le thème',
    22: '+ l’harmonie à cinq voix', 23: '+ le clap qui se double, le claquement inversé', 24: '+ les roulements de caisse', 25: '+ le souffle qui aspire chaque fin de phrase',
    26: '+ la voix s’orne, l’arpège de cristal se double', 27: 'LE CLIMAX : tout ouvert, le chœur double à l’octave, la cymbale toutes les 4 mesures', 28: '+ l’impact au début de chaque phrase, la grosse caisse qui s’emballe',
    29: 'Le final : les accords sur chaque double croche', 30: 'L’harmonie monte d’une octave, la voix de rubis chante à deux.' };
  const PALIERS30 = Array.from({ length: 30 }, (_, k) => ENTRE[k + 1] || 'Tout pousse d’un cran : plus fort, plus serré.');
  // LES NIVEAUX : chaque élément entre à SON moteur, monte doucement pendant 6 moteurs ; chaque bus gagne ~3 dB du 1 au 30 et la sortie ~7 dB
  const BASE = { piano: .9, nappe: .55, coeur: .95, shaker: .35, choeur: 1, cordes: .8, clap: .55, hats: .3, cello: .7, hache: .4, rim: .3, seconde: .45, pulse: .38,
    ouverts: .28, toms: .55, crash: .5, souffle: .4, congas: .55, tics: .42, arpege: .4, voix: .5, impact: .6 };
  const niv = (id, p) => { const e = QUAND[id] || 1; if (p < e) return 0; const r = Math.min(1, (p - e) / 6), g = .7 + .3 * (p - 1) / 29; return BASE[id] * (.82 + .18 * r) * g; };
  const FILTRE_NAPPE = p => p < 8 ? 900 + 60 * p : Math.min(6000, 1400 * Math.pow(1.07, p - 8));
  const POMPE = p => p < QUAND.pompe ? 1 : Math.max(.45, .78 - .02 * (p - QUAND.pompe));

  function preparer(ctx, sortie, alea) {
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
    const courbe = k => { const c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; };
    const impulsion = (len, dec, lp) => { const n = Math.floor(ctx.sampleRate * len), b = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let y = 0; const a = Math.exp(-2 * Math.PI * lp / ctx.sampleRate);
        for (let i = 0; i < n; i++) { y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.pow(1 - i / n, dec); } } return b; };
    // LA SORTIE : un coupe-très-bas, un peu de chaleur, un creux à 3,2 kHz et un toit à 8 kHz (les timbres polis), un compresseur doux, un limiteur
    const master = G(.55), chaud = ctx.createWaveShaper(); chaud.curve = courbe(1.1); chaud.oversample = '2x';
    const eqA = F('peaking', 3200, .9); eqA.gain.value = -1.5; const eqB = F('highshelf', 8000); eqB.gain.value = -2;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 2; comp.attack.value = .02; comp.release.value = .25;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -3; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1; lim.knee.value = 0;
    chaine(master, F('highpass', 28, .7), chaud, eqA, eqB, comp, lim, sortie);
    // LA SALLE (une plaque sombre de 2,8 s) et L'ÉCHO pointé (gauche / droite) : le rêve
    const salle = ctx.createConvolver(); salle.buffer = impulsion(2.8, 2.2, 3200); const envoiSalle = G(1); chaine(envoiSalle, salle, F('highpass', 220, .7), G(.34), master);
    const dG = ctx.createDelay(2), dD = ctx.createDelay(2); dG.delayTime.value = SD * 3; dD.delayTime.value = SD * 6;
    const fb = G(.32), echoIn = G(1), echoSort = G(0), pG = ctx.createStereoPanner(), pD = ctx.createStereoPanner(); pG.pan.value = -.6; pD.pan.value = .6;
    chaine(echoIn, F('lowpass', 3200, .7), dG); dG.connect(dD); dD.connect(fb); fb.connect(dG); dG.connect(pG); dD.connect(pD); pG.connect(echoSort); pD.connect(echoSort); echoSort.connect(master); echoSort.connect(envoiSalle);
    // LA POMPE : la nappe, les accords hachés, l'arpège et les cordes s'écrasent sur la grosse caisse (dès 15)
    const pompe = G(1); pompe.connect(master);
    const ids = ['piano', 'nappe', 'coeur', 'shaker', 'choeur', 'cordes', 'clap', 'hats', 'cello', 'hache', 'rim', 'seconde', 'pulse', 'ouverts', 'toms', 'crash', 'souffle', 'congas', 'tics', 'arpege', 'voix', 'impact'];
    const bus = {}; ids.forEach(id => bus[id] = G(0));
    ['nappe', 'hache', 'pulse', 'cordes'].forEach(id => bus[id].connect(pompe));
    ids.filter(id => ['nappe', 'hache', 'pulse', 'cordes'].indexOf(id) < 0).forEach(id => bus[id].connect(master));
    const envoi = (id, v) => { const g = G(v); bus[id].connect(g); g.connect(envoiSalle); };
    envoi('piano', .5); envoi('choeur', .6); envoi('cordes', .45); envoi('cello', .45); envoi('seconde', .5); envoi('clap', .6); envoi('nappe', .35); envoi('pulse', .25); envoi('rim', .4); envoi('toms', .3);
    envoi('congas', .4); envoi('tics', .7); envoi('arpege', .6); envoi('voix', .55); envoi('impact', .4);
    { const g = G(.22); bus.cello.connect(g); g.connect(echoIn); const g2 = G(.35); bus.pulse.connect(g2); g2.connect(echoIn); const g3 = G(.3); bus.piano.connect(g3); g3.connect(echoIn);
      const g4 = G(.3); bus.voix.connect(g4); g4.connect(echoIn); const g5 = G(.35); bus.arpege.connect(g5); g5.connect(echoIn); const g6 = G(.25); bus.tics.connect(g6); g6.connect(echoIn); }
    const filtreNappe = F('lowpass', 900, .8); filtreNappe.connect(bus.nappe);
    const bruit = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); { const d = bruit.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = alea() * 2 - 1; }

    // LES FRAPPES : calculées UNE fois ici (bruit filtré à la main), jouées ensuite par une simple lecture de tampon — pas de filtre en direct par coup
    const sr = ctx.sampleRate, dt = 1 / sr, pi2 = 2 * Math.PI;
    const mk = (dur, fn) => { const n = Math.floor(sr * dur), bf = ctx.createBuffer(1, n, sr), d = bf.getChannelData(0); fn(d, n); let pk = 1e-6; for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(d[i])); for (let i = 0; i < n; i++) d[i] = d[i] / pk * .9; return bf; };
    const bruitN = n => { const a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = alea() * 2 - 1; return a; };
    const passeHaut = (x, fc) => { const rc = 1 / (pi2 * fc), a = rc / (rc + dt), y = new Float32Array(x.length); let yp = 0, xp = 0; for (let i = 0; i < x.length; i++) { yp = a * (yp + x[i] - xp); xp = x[i]; y[i] = yp; } return y; };
    const passeBas = (x, fc) => { const rc = 1 / (pi2 * fc), a = dt / (rc + dt), y = new Float32Array(x.length); let yp = 0; for (let i = 0; i < x.length; i++) { yp += a * (x[i] - yp); y[i] = yp; } return y; };
    const passeBande = (x, fc, q) => { const f = 2 * Math.sin(Math.PI * fc / sr), qq = 1 / q, y = new Float32Array(x.length); let lo = 0, bd = 0; for (let i = 0; i < x.length; i++) { const hi = x[i] - lo - qq * bd; bd += f * hi; lo += f * bd; y[i] = bd; } return y; };
    const enveloppe = (y, tau, att) => { for (let i = 0; i < y.length; i++) { const t = i * dt; y[i] *= Math.exp(-t / tau) * Math.min(1, t / (att || .0008)); } return y; };
    const h = {};
    h.hat = mk(.07, (d, n) => { const y = enveloppe(passeHaut(passeHaut(bruitN(n), 9000), 7000), .007); d.set(y); });
    h.ouvert = mk(.4, (d, n) => { const y = enveloppe(passeHaut(passeHaut(bruitN(n), 7000), 6000), .07); d.set(y); });
    h.shaker = mk(.09, (d, n) => { const y = enveloppe(passeBas(passeHaut(bruitN(n), 5000), 9500), .016, .005); d.set(y); });
    h.clap = mk(.34, (d, n) => { const x = bruitN(n), a = passeBande(x, 1250, .9), c = passeBande(x, 1050, .8);
      for (let i = 0; i < n; i++) { const t = i * dt; let v = 0; for (let k = 0; k < 3; k++) { const u = t - k * .009; if (u >= 0) v += a[i] * Math.exp(-u / .012) * 1.1; }
        const u = t - .027; if (u >= 0) v += c[i] * Math.exp(-u / .06) * .9; d[i] = v; } });
    h.rim = mk(.06, (d, n) => { d.set(enveloppe(passeBande(bruitN(n), 1900, 3), .006)); });
    h.slap = mk(.06, (d, n) => { d.set(enveloppe(passeBande(bruitN(n), 1800, 2), .008)); });
    h.crash = mk(1.9, (d, n) => { d.set(enveloppe(passeHaut(bruitN(n), 6000), .5)); });
    h.roule = mk(.07, (d, n) => { d.set(enveloppe(passeBande(bruitN(n), 1600, .8), .015)); });
    return { bus, pompe, filtreNappe, echoSort, echoIn, bruit, master, h, prec: null };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    p = Math.max(1, Math.min(30, p | 0));
    const b = kit.bus, A = id => p >= QUAND[id];
    for (const id in b) b[id].gain.setValueAtTime(niv(id, p), t0);
    kit.master.gain.setTargetAtTime(.5 + .55 * Math.pow((p - 1) / 29, 1.2), t0, .5);   // la sortie qui monte avec le moteur
    kit.filtreNappe.frequency.setValueAtTime(FILTRE_NAPPE(p), t0); kit.echoSort.gain.setValueAtTime(A('echos') ? .55 : 0, t0);
    const osc = (type, f, dt) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; if (dt) o.detune.value = dt; return o; };
    const filt = (type, f, q) => { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };
    const env = (g, t, pic, a, dur) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(pic, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); };
    const frappe = (buf, t, dest, v, taux) => { const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = buf; if (taux) s.playbackRate.value = taux; g.gain.value = v; s.connect(g); g.connect(dest); s.start(t); };
    const bruitF = (t, dest, type, f, q, pic, dur) => { const s = ctx.createBufferSource(), x = filt(type, f, q), g = ctx.createGain(); s.buffer = kit.bruit; env(g, t, pic, .002, dur);
      s.connect(x); x.connect(g); g.connect(dest); s.start(t, alea() * 1.2); s.stop(t + dur + .02); };

    // ---- les instruments ----
    const coeur = (t, v, fantome) => { const o = osc('sine', 120), g = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(44, t + .09);
      env(g, t, .9 * v, .002, .42); o.connect(g); g.connect(b.coeur); o.start(t); o.stop(t + .45); frappe(kit.h.slap, t, b.coeur, .05 * v, 1.6);
      if (!fantome && A('pompe')) { kit.pompe.gain.setValueAtTime(POMPE(p), t); kit.pompe.gain.linearRampToValueAtTime(1, t + SD * 3.6); } };
    const piano = (t, midi, v) => { const f = mtof(midi), g = ctx.createGain(), x = filt('lowpass', Math.min(4500, f * 5), .5);   // le feutre : peu d'harmoniques, qui s'éteignent vite
      [[1, 1, 2.6], [2, .32, 1.2], [3.01, .1, .5]].forEach(([hh, a, d]) => { const o = osc('sine', f * hh), gh = ctx.createGain(); env(gh, t, a, .004, d); o.connect(gh); gh.connect(x); o.start(t); o.stop(t + d + .05); });
      env(g, t, .32 * v, .003, 2.6); x.connect(g); g.connect(b.piano); frappe(kit.h.slap, t, b.piano, .03 * v, Math.min(2, f / 400 + .6)); };
    const nappe = (t, accord, dur) => { const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.1, t + .9); g.gain.setValueAtTime(.1, t + dur - .2); g.gain.linearRampToValueAtTime(.0001, t + dur + .6);
      accord.forEach((m, k) => (k < 2 ? [-8, 8] : [k % 2 ? 6 : -6]).forEach(dt => { const o = osc('triangle', mtof(m), dt), pn = ctx.createStereoPanner(); pn.pan.value = k < 2 ? (dt > 0 ? .7 : -.7) : (k % 2 ? .35 : -.35);
        o.connect(pn); pn.connect(g); o.start(t); o.stop(t + dur + .7); }));

    const souffle = (t, dur, pic) => { const s = ctx.createBufferSource(), x = filt('bandpass', 800, .8), g = ctx.createGain(); s.buffer = kit.bruit;
      x.frequency.setValueAtTime(600, t); x.frequency.exponentialRampToValueAtTime(5000, t + dur); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(pic || .35, t + dur); g.gain.setValueAtTime(.0001, t + dur + .01);
      s.connect(x); x.connect(g); g.connect(b.souffle); s.start(t, alea()); s.stop(t + dur + .02); };
    // LES CONGAS : un sinus qui retombe (la peau) + une claque ; grave = tumba, aigu = quinto
    const conga = (t, f0, v) => { const o = osc('sine', f0 * 1.45), g = ctx.createGain(); o.frequency.setValueAtTime(f0 * 1.45, t); o.frequency.exponentialRampToValueAtTime(f0, t + .04);
      env(g, t, .8 * v, .002, .26); o.connect(g); g.connect(b.congas); o.start(t); o.stop(t + .28); frappe(kit.h.slap, t, b.congas, .45 * v, f0 > 250 ? 1.2 : .85); };

<script>
(function () {
  let ctx = null, kit = null, p = 1, m = 0, tNext = 0, iv = 0;

  play.onclick = () => {

  };
