<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rubis de néon — 30 paliers</title>
<style>
:root{--fond:#fff;--tx:#17141c;--tx2:#8a8494;--fil:#e4e1ea;--acc:#b0122e}
@media (prefers-color-scheme:dark){:root{--fond:#0b090d;--tx:#f2f0f7;--tx2:#9a94a8;--fil:#2a2633;--acc:#e0314f}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:16px}
.boite{width:100%;max-width:560px;border:1px solid var(--fil);border-radius:20px;padding:24px;display:grid;gap:18px}
h1{margin:0;font-size:22px}.sous{color:var(--tx2);font-size:13px;margin-top:4px}
.rang{display:flex;gap:16px;align-items:center}
#play{width:72px;height:72px;border-radius:50%;border:0;background:var(--tx);color:var(--fond);font-weight:700;cursor:pointer;flex:none}
.pals{display:grid;gap:6px;flex:1}#speed{width:100%}#mot{font-weight:700;font-size:18px}
#ce{color:var(--tx2);font-size:13px;min-height:36px}
</style></head><body>
<div class="boite">
  <div><h1>RUBIS DE NÉON · 30 PALIERS</h1><div class="sous">écrit à la main, sans le générateur · 118 BPM · fa mineur · sans basse : un piano feutré, une nappe de verre fumé, un chœur, des cordes en tenue, une harmonie qui évolue — en 30 moteurs</div></div>
  <div class="rang"><button id="play">PLAY</button><div class="pals"><div id="mot">Moteur 1 / 30</div><input type="range" id="speed" min="0" max="100" step="any" value="0" aria-label="Moteur"></div></div>
  <div id="ce"></div>
</div>

<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     (2026-10-16, pôle SON ; Léo : « réécris complètement RUBIS DE NÉON, juste le nom garde-le » · « oublie le générateur, juste le système de
     musique évolutive jusqu'à 30 » · « surprends-moi, de nouveaux sons » · et tout ce qu'il a dit avant : un début qui tient (« pas trop léger,
     pas un instrument inaudible seul »), plus rêveur et poli qui suit l'intensité, pas d'ennui dès 10, dynamique dès 15, le climax sur les
     derniers, au 30 le registre qui monte ; rien d'enfantin ni de cirque, pas de flûte.)
     Tous les instruments sont écrits ici (aucun son du générateur) : LE PIANO FEUTRÉ (des cordes frappées à travers du feutre : quelques
     harmoniques qui s'éteignent vite, le marteau étouffé), LA NAPPE DE VERRE FUMÉ, LE CHŒUR (la voyelle « ou »
     qui s'ouvre vers « a »), LES CORDES EN TENUE (l'accord ouvert sur deux octaves), L'HARMONIE DE NAPPE, LES ACCORDS HACHÉS, L'ARPÈGE QUI PULSE,
     la batterie (cœur, clap dans la salle, shaker, charleys, toms), le souffle inversé qui aspire chaque fin de phrase.
     PAS DE BASSE (16/10, Léo : « enlève la basse et profites-en pour charger encore plus, harmonieux ») : la basse de velours et la sous-basse
     sont parties ; le bas du spectre n'a plus que le cœur, et rien d'harmonique ne descend sous le do grave (do 3, 131 Hz).
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 118, SD = 60 / BPM / 4, MES = 16 * SD, PHR = 8 * MES, SWING = 0.04;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // LA GRILLE (fa mineur), une phrase de 8 mesures : Fm9 · D♭maj9 · A♭maj9 · E♭(add9) · Fm9 · D♭maj9 · B♭m9 · C7(♭9) — voicings dans le médium
  const ROOTS = [41, 37, 44, 39, 41, 37, 46, 36];
  const CHORDS = [[56, 60, 63, 67], [56, 60, 63, 65], [55, 58, 60, 63], [55, 58, 63, 65], [56, 60, 63, 67], [56, 60, 63, 65], [56, 60, 61, 65], [55, 58, 61, 64]];
  // LE THÈME du violoncelle : [pas sur la phrase (0-127), note, durée en pas] — il descend, se pose, remonte, et s'appuie sur la sensible (mi) du do7
  const THEME = [[2, 72, 2], [4, 70, 2], [6, 68, 6], [12, 67, 2], [14, 68, 2], [16, 65, 10], [32, 63, 2], [34, 65, 2], [36, 67, 4], [40, 68, 2], [42, 70, 2], [44, 72, 4],
    [48, 70, 12], [64, 72, 2], [66, 75, 2], [68, 73, 6], [74, 72, 2], [76, 70, 4], [80, 68, 10], [96, 68, 2], [98, 70, 2], [100, 72, 4], [104, 70, 2], [106, 68, 2], [108, 67, 4],
    [112, 67, 4], [116, 64, 8]];
  const GAMME = [5, 7, 8, 10, 0, 1, 3];   // fa mineur (classes) : la seconde voix chante une tierce DIATONIQUE en dessous
  const tierceDessous = n => { const pc = ((n % 12) + 12) % 12; let k = GAMME.indexOf(pc); if (k < 0) return n - 3; k = (k + 5) % 7; let m = n - 1; while ((((m % 12) + 12) % 12) !== GAMME[k]) m--; return m; };
  const ARP = [0, 1, 2, 3, 2, 1, 3, 2];                       // le piano feutré : les notes de l'accord, en croches
  // LES CORDES : l'accord OUVERT de chaque mesure, du do 3 au ré♭ 5, écrit voix par voix pour qu'elles se suivent pas à pas
  const CORDES = [[53, 60, 63, 68, 72], [49, 56, 60, 65, 72], [51, 56, 60, 67, 70], [51, 58, 63, 67, 70], [53, 60, 63, 68, 72], [49, 56, 60, 65, 72], [53, 58, 61, 68, 72], [48, 55, 58, 64, 73]];
  const HACHE = [2, 6, 10, 14], PULSE = [0, 2, 1, 3, 2, 1, 3, 2, 0, 2, 1, 3, 2, 3, 1, 2];

  // QUAND chaque élément entre (le moteur, 1 à 30) — un DÉBUT COMPLET mais calme, puis un élément de plus ou un cran à chaque moteur
  const QUAND = { piano: 1, nappe: 1, coeur: 1, shaker: 2, choeur: 3, kick4: 4, clap: 5, pianoPlein: 6, hats: 7, ouvre: 8, cello: 9, echos: 10,
    hache: 11, rim: 12, cordes: 13, seconde: 14, pulse: 15, ouverts: 15, pompe: 15, toms: 17, themeB: 18, crash: 20, roule: 24, souffle: 25, climax: 27, final: 29, octave: 30 };
  const ENTRE = { 1: 'Le piano feutré qui arpège, la nappe de verre fumé sur deux octaves, le cœur qui bat. Pas de basse.', 2: '+ le shaker', 3: '+ le chœur « ou » qui tient l’accord',
    4: '+ la grosse caisse à chaque temps', 5: '+ le clap dans la salle', 6: '+ le piano sur toute la phrase', 7: '+ les charleys', 8: 'La nappe s’ouvre',
    9: 'L’HARMONIE DE NAPPE : un accord lié à trois voix qui gonfle et s’ouvre, sa voix du haut chante le thème, lentement', 10: '+ les échos qui rêvent', 11: '+ les accords hachés', 12: '+ les rimshots', 13: '+ les cordes en tenue, l’accord ouvert',
    14: '+ une quatrième voix dans l’harmonie', 15: 'ÇA DÉCOLLE : l’arpège qui pulse, les charleys ouverts, la pompe (les cordes respirent avec)', 17: '+ les toms en fin de phrase',
    18: '+ le thème qui monte d’un cran', 20: '+ la cymbale à chaque phrase', 24: '+ les roulements de caisse', 25: '+ le souffle qui aspire chaque fin de phrase',
    22: '+ l’harmonie à cinq voix', 27: 'LE CLIMAX : tout ouvert, le chœur double à l’octave, la cymbale toutes les 4 mesures', 29: 'Le final : les accords sur chaque double croche', 30: 'L’harmonie monte d’une octave.' };
  const PALIERS30 = Array.from({ length: 30 }, (_, k) => ENTRE[k + 1] || (k < 14 ? 'Tout s’ouvre d’un cran.' : 'Tout pousse d’un cran : plus fort, plus serré.'));
  // LES NIVEAUX : chaque élément entre à SON moteur, monte doucement pendant 6 moteurs ; chaque bus gagne ~3 dB du 1 au 30 et la sortie ~7 dB
  // (mesuré : sans ça, la montée s'arrêtait au 12e — −16,8 dB au 12, −15,6 au 30 — quand TONNERRE DELUXE monte de −22,6 à −8,9)
  const BASE = { piano: .9, nappe: .55, coeur: .95, shaker: .35, choeur: 1, cordes: .8, clap: .55, hats: .3, cello: .7, hache: .4, rim: .3, seconde: .45, pulse: .38,
    ouverts: .28, toms: .55, crash: .5, souffle: .4 };
  const niv = (id, p) => { const e = QUAND[id === 'coeur' ? 'coeur' : id] || 1; if (p < e) return 0; const r = Math.min(1, (p - e) / 6), g = .7 + .3 * (p - 1) / 29; return BASE[id] * (.82 + .18 * r) * g; };
  const FILTRE_NAPPE = p => p < 8 ? 900 + 60 * p : Math.min(6000, 1400 * Math.pow(1.07, p - 8));
  const POMPE = p => p < QUAND.pompe ? 1 : Math.max(.45, .78 - .02 * (p - QUAND.pompe));

  function preparer(ctx, sortie, alea) {
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
    const courbe = k => { const c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; };
    const impulsion = (len, dec, lp) => { const n = Math.floor(ctx.sampleRate * len), b = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let y = 0; const a = Math.exp(-2 * Math.PI * lp / ctx.sampleRate);
        for (let i = 0; i < n; i++) { y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.pow(1 - i / n, dec); } } return b; };
    // LA SORTIE : un coupe-très-bas, un peu de chaleur, un compresseur doux, un limiteur
    const master = G(.55), chaud = ctx.createWaveShaper(); chaud.curve = courbe(1.1); chaud.oversample = '2x';
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 2; comp.attack.value = .02; comp.release.value = .25;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -3; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1; lim.knee.value = 0;
    chaine(master, F('highpass', 28, .7), chaud, comp, lim, sortie);
    // LA SALLE (une plaque sombre de 2,8 s) et L'ÉCHO pointé (gauche / droite) : le rêve
    const salle = ctx.createConvolver(); salle.buffer = impulsion(2.8, 2.2, 3200); const envoiSalle = G(1); chaine(envoiSalle, salle, F('highpass', 220, .7), G(.34), master);
    const dG = ctx.createDelay(2), dD = ctx.createDelay(2); dG.delayTime.value = SD * 3; dD.delayTime.value = SD * 6;
    const fb = G(.32), echoIn = G(1), echoSort = G(0), pG = ctx.createStereoPanner(), pD = ctx.createStereoPanner(); pG.pan.value = -.6; pD.pan.value = .6;
    chaine(echoIn, F('lowpass', 3200, .7), dG); dG.connect(dD); dD.connect(fb); fb.connect(dG); dG.connect(pG); dD.connect(pD); pG.connect(echoSort); pD.connect(echoSort); echoSort.connect(master); echoSort.connect(envoiSalle);
    // LA POMPE : la nappe, les accords hachés et l'arpège s'écrasent sur la grosse caisse (dès 15)
    const pompe = G(1); pompe.connect(master);
    const bus = {}; ['piano', 'nappe', 'coeur', 'shaker', 'choeur', 'cordes', 'clap', 'hats', 'cello', 'hache', 'rim', 'seconde', 'pulse', 'ouverts', 'toms', 'crash', 'souffle'].forEach(id => bus[id] = G(0));
    ['nappe', 'hache', 'pulse', 'cordes'].forEach(id => bus[id].connect(pompe));
    ['piano', 'coeur', 'shaker', 'choeur', 'clap', 'hats', 'cello', 'rim', 'seconde', 'ouverts', 'toms', 'crash', 'souffle'].forEach(id => bus[id].connect(master));
    const envoi = (id, v) => { const g = G(v); bus[id].connect(g); g.connect(envoiSalle); };
    envoi('piano', .5); envoi('choeur', .6); envoi('cordes', .45); envoi('cello', .45); envoi('seconde', .5); envoi('clap', .6); envoi('nappe', .35); envoi('pulse', .25); envoi('rim', .4); envoi('toms', .3);
    { const g = G(.22); bus.cello.connect(g); g.connect(echoIn); const g2 = G(.35); bus.pulse.connect(g2); g2.connect(echoIn); const g3 = G(.3); bus.piano.connect(g3); g3.connect(echoIn); }
    const filtreNappe = F('lowpass', 900, .8); filtreNappe.connect(bus.nappe);
    const bruit = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); { const d = bruit.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = alea() * 2 - 1; }
    return { bus, pompe, filtreNappe, echoSort, bruit, master, prec: null };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    p = Math.max(1, Math.min(30, p | 0));
    const b = kit.bus, A = id => p >= QUAND[id];
    for (const id in b) b[id].gain.setValueAtTime(niv(id, p), t0);
    kit.master.gain.setTargetAtTime(.5 + .55 * Math.pow((p - 1) / 29, 1.2), t0, .5);   // la sortie qui monte avec le moteur
    kit.filtreNappe.frequency.setValueAtTime(FILTRE_NAPPE(p), t0); kit.echoSort.gain.setValueAtTime(A('echos') ? .55 : 0, t0);
    const osc = (type, f, dt) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; if (dt) o.detune.value = dt; return o; };
    const filt = (type, f, q) => { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };
    const env = (g, t, pic, a, dur) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(pic, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); };
    const bruit = (t, dest, type, f, q, pic, dur) => { const s = ctx.createBufferSource(), x = filt(type, f, q), g = ctx.createGain(); s.buffer = kit.bruit; env(g, t, pic, .002, dur);
      s.connect(x); x.connect(g); g.connect(dest); s.start(t, alea() * 1.2); s.stop(t + dur + .02); };

    // ---- les instruments ----
    const coeur = (t, v) => { const o = osc('sine', 120), g = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(44, t + .09);
      env(g, t, .9 * v, .002, .42); o.connect(g); g.connect(b.coeur); o.start(t); o.stop(t + .45); bruit(t, b.coeur, 'bandpass', 2800, 1.2, .05 * v, .012);
      if (A('pompe')) { kit.pompe.gain.setValueAtTime(POMPE(p), t); kit.pompe.gain.linearRampToValueAtTime(1, t + SD * 3.6); } };
    const piano = (t, midi, v) => { const f = mtof(midi), g = ctx.createGain(), x = filt('lowpass', Math.min(4500, f * 5), .5);   // le feutre : peu d'harmoniques, qui s'éteignent vite
      [[1, 1, 2.6], [2, .32, 1.2], [3, .12, .6], [4.02, .05, .35]].forEach(([h, a, d]) => { const o = osc('sine', f * h), gh = ctx.createGain(); env(gh, t, a, .004, d); o.connect(gh); gh.connect(x); o.start(t); o.stop(t + d + .05); });
      env(g, t, .32 * v, .003, 2.6); x.connect(g); g.connect(b.piano); bruit(t, b.piano, 'bandpass', Math.min(3000, f * 3), 1, .02 * v, .03); };
    const nappe = (t, accord, dur) => { const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.1, t + .9); g.gain.setValueAtTime(.1, t + dur - .2); g.gain.linearRampToValueAtTime(.0001, t + dur + .6);
      accord.forEach((m, k) => [-8, 8].forEach(dt => { const o = osc('triangle', mtof(m), dt + (k % 2 ? 3 : -3)), pn = ctx.createStereoPanner(); pn.pan.value = dt > 0 ? .7 : -.7;
        o.connect(pn); pn.connect(g); o.start(t); o.stop(t + dur + .7); }));
      g.connect(kit.filtreNappe); bruit(t, kit.filtreNappe, 'bandpass', 3000, .6, .006, dur); };
    const hache = (t, accord, v) => { const g = ctx.createGain(), x = filt('lowpass', 2200 + 90 * p, .9); env(g, t, .09 * v, .004, SD * 1.4);
      accord.forEach(m => [-6, 6].forEach(dt => { const o = osc('sawtooth', mtof(m), dt); o.connect(x); o.start(t); o.stop(t + SD * 1.5); })); x.connect(g); g.connect(b.hache); };
    const pulse = (t, midi) => { const f = mtof(midi), o = osc('square', f), s = osc('sine', f * 2), x = filt('lowpass', 600, 4 + .1 * p), g = ctx.createGain();
      x.frequency.setValueAtTime(Math.min(7000, 1200 + 160 * p), t); x.frequency.exponentialRampToValueAtTime(500, t + SD * 1.6);
      env(g, t, .2, .003, SD * 1.7); const sg = ctx.createGain(); sg.gain.value = .3; s.connect(sg); sg.connect(x); o.connect(x); x.connect(g); g.connect(b.pulse);
      o.start(t); s.start(t); o.stop(t + SD * 1.8); s.stop(t + SD * 1.8); };
    // LE CHŒUR (16/10, Léo : « enlève la basse et profites-en pour charger encore plus, harmonieux ») : l'accord tenu par des voix — chaque voix,
    // deux scies désaccordées sous un vibrato lent ; toutes passent par trois formants : la voyelle « ou », qui s'ouvre peu à peu vers « a » avec le moteur
    const choeur = (t, notes, dur) => { const ouv = Math.min(1, Math.max(0, (p - QUAND.choeur) / 22)), ent = ctx.createGain(), g = ctx.createGain(), vib = osc('sine', 4.6), va = ctx.createGain();
      va.gain.value = 7; vib.connect(va);
      [[380 + 340 * ouv, 5, 1], [820 + 400 * ouv, 7, .6], [2500 + 200 * ouv, 9, .25]].forEach(([f, q, v]) => { const x = filt('bandpass', f, q), xg = ctx.createGain(); xg.gain.value = v; ent.connect(x); x.connect(xg); xg.connect(g); });
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(1, t + .7); g.gain.setValueAtTime(1, t + dur - .1); g.gain.linearRampToValueAtTime(.0001, t + dur + 1);
      notes.forEach((m, k) => { const pn = ctx.createStereoPanner(); pn.pan.value = -.5 + k / Math.max(1, notes.length - 1); pn.connect(ent);
        [-9, 9].forEach(dt => { const o = osc('sawtooth', mtof(m), dt + (k % 2 ? 2 : -2)), og = ctx.createGain(); og.gain.value = .25; va.connect(o.detune); o.connect(og); og.connect(pn); o.start(t); o.stop(t + dur + 1.05); }); });
      vib.start(t); vib.stop(t + dur + 1.05); g.connect(b.choeur); };
    // LES CORDES EN TENUE (16/10) : l'accord OUVERT de la mesure (CORDES), tenu et lié à la suivante — chaque note, un pupitre de deux scies
    // désaccordées (trois pesaient trop lourd pour un téléphone), un vibrato lent ; un coupe-haut qui s'ouvre avec le moteur, rien sous 120 Hz ; dès 15, elles respirent avec la pompe
    const cordes = (t, notes, dur) => { const x = filt('lowpass', Math.min(4200, 1000 + 75 * p), .5), hp = filt('highpass', 120, .6), g = ctx.createGain(), vib = osc('sine', 5.3), va = ctx.createGain();
      va.gain.value = 6; vib.connect(va);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(1, t + .8); g.gain.setValueAtTime(1, t + dur - .1); g.gain.linearRampToValueAtTime(.0001, t + dur + 1.1);
      notes.forEach((m, k) => { const pn = ctx.createStereoPanner(); pn.pan.value = -.7 + 1.4 * k / (notes.length - 1); pn.connect(x);
        [-10, 10].forEach(dt => { const o = osc('sawtooth', mtof(m), dt + 2 * (k - 2)), og = ctx.createGain(); og.gain.value = .15; va.connect(o.detune); o.connect(og); og.connect(pn); o.start(t); o.stop(t + dur + 1.15); }); });
      vib.start(t); vib.stop(t + dur + 1.15); x.connect(hp); hp.connect(g); g.connect(b.cordes); };
    // L'HARMONIE DE NAPPE (16/10, Léo : « le lead qui arrive au moteur 9, transforme-le en autre chose, genre une harmonie de pad qui évolue ») :
    // un accord LIÉ toutes les demi-mesures — sa voix du haut prend la note du thème qui sonne à ce moment, les voix du dessous les notes de
    // l'accord, espacées ; chaque voix = deux scies désaccordées + un triangle à l'octave grave, étalées dans la stéréo ; l'accord GONFLE (0,45 s),
    // son filtre s'ouvre puis se referme un peu, et il se fond dans le suivant (0,9 s). Plus de voix et plus ouvert à mesure que le moteur monte.
    const sousAccord = (top, bar, nv) => { const pcs = CHORDS[bar].map(x => x % 12), r = []; let der = top;
      for (let m = top - 1; m > top - 22 && r.length < nv; m--) if (pcs.indexOf(((m % 12) + 12) % 12) >= 0 && der - m >= 3) { r.push(m); der = m; } return r; };
    const harmonie = (t, notes, dur, pic) => { const x = filt('lowpass', 500, .8), g = ctx.createGain(), sommet = Math.min(5200, 900 + 85 * p);
      x.frequency.setValueAtTime(500, t); x.frequency.linearRampToValueAtTime(sommet, t + Math.min(dur * .5, 1.3)); x.frequency.linearRampToValueAtTime(sommet * .7, t + dur + .5);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(pic, t + .45); g.gain.setValueAtTime(pic, t + Math.max(.5, dur - .05)); g.gain.linearRampToValueAtTime(.0001, t + dur + .9);
      notes.forEach((m, k) => { const pn = ctx.createStereoPanner(); pn.pan.value = notes.length > 1 ? -.55 + 1.1 * k / (notes.length - 1) : 0; pn.connect(x);
        [['sawtooth', -7, .5, 1], ['sawtooth', 7, .5, 1], ['triangle', 0, .3, .5]].forEach(([ty, dt, v, oc]) => { const o = osc(ty, mtof(m) * oc, dt), mg = ctx.createGain();
          mg.gain.value = v * (k === 0 ? 1 : .7); o.connect(mg); mg.connect(pn); o.start(t); o.stop(t + dur + 1); }); });
