<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{background:var(--fond);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:16px}

</style></head><body>
<div class="boite">
  <div><h1>NÉON NOIR · 30 PALIERS</h1><div class="sous">écrit à la main, sans le générateur · 120 BPM · do mineur · darksynth devenue techno noire : la basse qui grogne (courte), la nappe menaçante, la voix noire — en 30 moteurs</div></div>
  <div class="rang"><button id="play">PLAY</button><div class="pals"><div id="mot">Moteur 1 / 30</div><input type="range" id="speed" min="0" max="100" step="any" value="0" aria-label="Moteur"></div></div>
  <div id="ce"></div>
</div>


<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     (2026-11-03, pôle SON ; Léo : « une version premium de toutes les musiques du jeu, la nouvelle DA, mais sans que les anciens sons perdent leur identité ; vingt bangers différents »).
     NÉON NOIR (ancien : « darksynth, basse saturée qui grogne, nappe menaçante », 120 BPM, do mineur, 8 paliers figés). Ce qui reste : la nappe menaçante (des scies désaccordées derrière un filtre qui s'ouvre),
     la basse qui grogne (mais COURTE et nette : une basse Reese de 0,2 s, saturée), le clap sec, la nuit. Ce qui est neuf : la rythmique devient de la TECHNO NOIRE / EBM (grosse caisse quatre-sur-le-temps
     qui roule, charley ouvert à contretemps, basse « rumble » qui roule entre les coups, percussions métalliques en 3-3-2), une ligne ACID (303) qui s'ouvre, une « lame » (le lead : deux scies, un carré, un filtre
     qui plonge, une fin de note qui se referme en douceur), la VOIX NOIRE (un chœur de scies passé dans deux formants qui passent du « o » au « a »), un arpège d'obsidienne, un trance-gate sur la nappe, des lasers.
     Harmonie : do mineur (comme l'originale, 120 BPM) → Cm · Cm · Fm · Fm · Cm · Db (le ♭II qui menace) · Bb · G (la dominante majeure, tendue). ENTRE-DEUX (2026-11-03, Léo : « je préférais l'atmosphère de la première version ; la complexité du nouveau est bien ») : l'atmosphère de l'originale (mesurée : presque tout sous 150 Hz, la moitié sous 60 Hz, les médiums < 15 %, presque mono, rien au-dessus de 2 kHz) revient par le sous-sol (drone grave), l'égalisation générale, la basse qui s'ouvre avec les moteurs, des aigus fermés et une salle sombre ; la rythmique et la montée restent celles de la techno noire.
     COÛT : tout ce qui est monophonique (acid, grogne, rumble) est UN seul oscillateur (ou deux) par mesure, piloté par automation ; toutes les frappes sont des tampons pré-calculés ; ~110 oscillateurs au plus au moteur 30.
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->
<script id="morceau">
const MORCEAU = (function () {
  const BPM = 120, SD = 60 / BPM / 4, MES = 16 * SD;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const hh = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };   /* un tirage répétable (pas de Math.random) */

  // LA GRILLE (do mineur, comme l'originale : la basse sur do 65 Hz et sur fa 44 Hz), une phrase de 8 mesures : Cm · Cm · Fm · Fm · Cm · Db (le ♭II qui menace) · Bb · G (la dominante majeure, tendue)
  const ROOTS = [36, 36, 29, 29, 36, 37, 34, 31];
  const MAJ = [0, 0, 0, 0, 0, 1, 1, 1];   /* l'accord est majeur (la tierce de la ligne acid monte d'un demi-ton) */
  const CHORDS = [[48, 55, 60, 63, 67], [48, 55, 60, 63, 67], [41, 56, 60, 65, 68], [41, 56, 60, 65, 68], [48, 55, 60, 63, 67], [49, 56, 61, 65, 68], [46, 53, 58, 62, 65], [43, 50, 55, 59, 62]];
  const TR = 1;   /* les thèmes de la lame, écrits en si mineur, montent d'un demi-ton : tout tombe en do mineur */

  // LA LIGNE ACID (303) : a=0 b=3 c=5 d=7 e=10 f=12 g=15 h=1 (le ♭2 phrygien), MAJUSCULE = accent, « . » = silence ; HUIT motifs tirés mesure par mesure
  const AC = { a: 0, b: 3, c: 5, d: 7, e: 10, f: 12, g: 15, h: 1 };
  const ACID = ['a.a.Ba.d..a.eA.', 'a..aB.a.D..fE.a.', 'aa.d.a.Ge.a.d.b.', 'A.ab.a.d.h.aE.f.', 'a.d.A..e.a.f.dB.', '.a.aD.e.a..Gb.a.', 'a.a.f.aE.d.a.h.a', 'Ab.a.c.dE..a.hA.']
    .map(s => (s + '................').slice(0, 16));
  // LA GROGNE : les pas où la basse Reese grogne (courte), selon le moteur
  const GP_BAS = [[0], [0, 10], [0, 6, 10], [0, 7, 10]];
  const GP_ROUL = [[0, 2, 6, 10, 14], [0, 2, 3, 6, 10, 14], [0, 6, 10, 11, 14], [0, 2, 6, 8, 10, 14], [0, 3, 6, 10, 13], [0, 2, 6, 10, 12, 14], [0, 4, 6, 10, 14, 15], [0, 2, 5, 6, 10, 13, 14]];
  // LES PERCUSSIONS MÉTALLIQUES : des pas en 3-3-2, six dessins qui se relaient
  const PERC = [[3, 6, 11, 14], [2, 5, 10, 13], [1, 4, 9, 12, 15], [3, 7, 11], [5, 8, 13], [2, 3, 10, 11]];
  // L'ARPÈGE D'OBSIDIENNE : rang dans l'accord (1-4, « . » = silence), huit dessins
  const ARP = ['1234321112343212', '4.3.2.1.4.3.2.1.', '1.2.3.4.3.2.1.4.', '1321.4234.1432..', '2.4.1.3.2.4.3.1.', '..1.2.3.4.3.2.1.4', '1.1.3.4.4.3.1.2.', '4321.234.1234.32']
    .map(s => (s + '................').slice(0, 16));
  // LE TRANCE-GATE de la nappe (huit portes de 16 pas)
  const GATES = ['1011101110111011', '1110111011101110', '1101101011011010', '1010101010101011', '1111011101110111', '1001100110011001', '1011011010110110', '1110010111100101'];

  // LE THÈME DE LA LAME : [pas sur 128, note, durée en doubles croches] — QUATRE versions : A (la montée), B (la réponse), C (décalée, plus basse), AB (le début de A, la fin de B)
  const THEME_A = [[0, 66, 6], [6, 71, 2], [8, 74, 8], [16, 73, 4], [20, 71, 4], [24, 66, 8],
    [32, 67, 4], [36, 71, 4], [40, 74, 4], [44, 79, 4], [48, 78, 6], [54, 74, 2], [56, 71, 8],
    [64, 66, 6], [70, 71, 2], [72, 76, 8], [80, 76, 4], [84, 72, 4], [88, 67, 8],
    [96, 69, 4], [100, 73, 4], [104, 76, 4], [108, 81, 4], [112, 78, 4], [116, 76, 2], [118, 73, 2], [120, 70, 8]];
  const THEME_B = [[0, 66, 6], [6, 71, 2], [8, 74, 8], [16, 73, 4], [20, 71, 4], [24, 66, 8],
    [32, 79, 4], [36, 78, 2], [38, 74, 2], [40, 71, 8], [48, 67, 4], [52, 71, 4], [56, 74, 4], [60, 78, 4],
    [64, 74, 4], [68, 78, 4], [72, 83, 8], [80, 79, 4], [84, 76, 4], [88, 72, 8],
    [96, 76, 4], [100, 73, 4], [104, 69, 8], [112, 66, 4], [116, 70, 4], [120, 73, 4], [124, 78, 4]];
  const THEME_C = [[2, 62, 4], [6, 66, 2], [8, 71, 6], [14, 69, 2], [16, 66, 4], [20, 69, 4], [24, 73, 8],
    [34, 71, 4], [38, 67, 2], [40, 62, 6], [46, 67, 2], [48, 71, 4], [52, 74, 4], [56, 79, 8],
    [66, 74, 4], [70, 71, 2], [72, 66, 6], [78, 71, 2], [80, 72, 4], [84, 76, 4], [88, 79, 4], [92, 76, 4],
    [98, 69, 4], [102, 73, 2], [104, 76, 6], [110, 73, 2], [112, 70, 4], [116, 73, 4], [120, 78, 8]];
  const THEME_AB = THEME_A.filter(n => n[0] < 64).concat(THEME_B.filter(n => n[0] >= 64));
  const MELOS = [THEME_A, THEME_B, THEME_C, THEME_AB];
  // LES VOYELLES de la voix noire (deux formants) : o a u i
  const VOY = [[400, 800], [700, 1150], [330, 850], [300, 2300]];

  const QUAND = { pad: 1, sub: 1, kick: 1, clang: 1, grogne: 1, hats: 2, quatre: 3, ohat: 4, clap: 5, rumble: 6, acid: 7, hats16: 8, lead: 9, voix: 10, perc: 11, large: 12, rim: 13, arp: 14, drop: 15, riser: 16,
    lead2: 17, acid2: 18, stab: 19, crash: 20, ride: 21, caisse: 22, voix2: 23, gate: 24, octave: 25, impact: 26, tom: 26, climax: 27, final: 28, laser: 29, tutti: 30 };
  const ENTRE = { 1: 'La nuit : le sous-sol qui gronde, la nappe menaçante derrière son filtre, un cœur de grosse caisse sur deux temps, la basse qui grogne à voix basse.', 2: '+ le charley fermé, à contretemps',
    3: '+ la grosse caisse quatre-sur-le-temps', 4: '+ le charley ouvert à contretemps', 5: '+ le clap, au 2 et au 4', 6: '+ la basse rumble, qui roule entre les coups', 7: 'LA LIGNE ACID entre, le filtre bouge',
    8: '+ les charleys en doubles croches', 9: 'LA LAME : le thème entre, la fin de note se referme', 10: 'LA VOIX NOIRE : un chœur qui passe du « o » au « a »', 11: '+ les percussions métalliques en 3-3-2',
    12: 'La nappe s’ouvre et s’élargit', 13: '+ les claquements de rim', 14: '+ l’arpège d’obsidienne, en doubles croches', 15: 'LE DROP : la grosse caisse tombe, le rumble roule à tous les pas, la grogne se multiplie',
    16: '+ la montée de fin de phrase', 17: '+ la seconde voix de la lame', 18: 'L’acid s’ouvre grand, accents en avant', 19: '+ les accords industriels frappés', 20: '+ la cymbale à chaque phrase, un souffle qui monte',
    21: '+ le ride métallique', 22: '+ les roulements de caisse claire', 23: '+ la voix noire à deux étages, plus haute', 24: 'LE TRANCE-GATE : la nappe se hache en doubles croches', 25: '+ la lame double à l’octave',
    26: '+ l’impact industriel, les toms qui tombent', 27: 'LE CLIMAX : tout frappé, la cymbale toutes les 4 mesures', 28: 'Le final : la grosse caisse s’emballe en fin de phrase', 29: '+ les lasers, en haut', 30: 'Le tutti : tout est dehors, la lame doublée, la voix grande ouverte.' };
  const PALIERS30 = Array.from({ length: 30 }, (_, k) => ENTRE[k + 1] || 'Tout pousse d’un cran : plus fort, plus serré.');
  const BASE = { pad: .6, sub: .5, kick: .66, clang: .32, grogne: .5, hats: .3, ohat: .32, clap: .6, rumble: .3, acid: .26, lead: .4, voix: .42, perc: .28, arp: .19, riser: .34, lead2: .26, stab: .26, crash: .34, ride: .15, caisse: .32, impact: .85, tom: .5, laser: .12 };
  const niv = (id, p) => { const e = QUAND[id] || 1; if (p < e) return 0; const r = Math.min(1, (p - e) / 6), g = .72 + .28 * (p - 1) / 29; return (BASE[id] || .3) * (.82 + .18 * r) * g; };
  const FILTRE_PAD = p => Math.min(2400, 380 * Math.pow(1.075, p - 1));
  const FILTRE_ACID = p => Math.min(1500, 300 * Math.pow(1.075, p - 7 > 0 ? p - 7 : 0) * (p >= QUAND.acid2 ? 1.5 : 1));
  const POMPE = p => p < QUAND.drop ? .78 : Math.max(.4, .7 - .02 * (p - QUAND.drop));

  function preparer(ctx, sortie, alea) {
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q) => { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; if (q != null) x.Q.value = q; return x; };
    const chaine = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
    const courbe = k => { const c = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); } return c; };
    const impulsion = (len, dec, lp) => { const n = Math.floor(ctx.sampleRate * len), b = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let y = 0; const a = Math.exp(-2 * Math.PI * lp / ctx.sampleRate);
        for (let i = 0; i < n; i++) { y = (1 - a) * (alea() * 2 - 1) + a * y; d[i] = y * Math.pow(1 - i / n, dec); } } return b; };
    const master = G(.36), chaud = ctx.createWaveShaper(); chaud.curve = courbe(1.25); chaud.oversample = '2x';
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -15; comp.ratio.value = 2.2; comp.attack.value = .012; comp.release.value = .18;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -3; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1; lim.knee.value = 0;
    // le grave est tenu : passe-haut à 42 Hz, un creux dans la boue 250 Hz
    const boue = F('peaking', 320, .8), sousEq = F('lowshelf', 110, .7), ciel = F('highshelf', 1600, .7), toit = F('lowpass', 7500, .6); boue.gain.value = -5; sousEq.gain.value = 6; ciel.gain.value = -3.5;   /* l'ATMOSPHÈRE de l'originale : presque tout sous 150 Hz, un ciel fermé */
    chaine(master, F('highpass', 30, .7), sousEq, boue, ciel, toit, chaud, comp, lim, sortie);
    // la salle : sombre et longue (3,2 s, voilée à 2,2 kHz)
    const salle = ctx.createConvolver(); salle.buffer = impulsion(3.4, 2.2, 1300); const envoiSalle = G(1); chaine(envoiSalle, salle, F('highpass', 260, .7), G(.3), master);
    // l'écho : un ping-pong à la noire pointée, sombre
    const dG = ctx.createDelay(2), dD = ctx.createDelay(2); dG.delayTime.value = SD * 6; dD.delayTime.value = SD * 6;
    const fb = G(.4), echoIn = G(1), echoSort = G(0), pG = ctx.createStereoPanner(), pD = ctx.createStereoPanner(); pG.pan.value = -.35; pD.pan.value = .35;
    chaine(echoIn, F('lowpass', 1800, .7), F('highpass', 300, .7), dG); dG.connect(dD); dD.connect(fb); fb.connect(dG); dG.connect(pG); dD.connect(pD); pG.connect(echoSort); pD.connect(echoSort); echoSort.connect(master); echoSort.connect(envoiSalle);
    const pompe = G(1); pompe.connect(master);
    const ids = ['pad', 'sub', 'kick', 'clang', 'grogne', 'hats', 'ohat', 'clap', 'rumble', 'acid', 'lead', 'voix', 'perc', 'arp', 'riser', 'lead2', 'stab', 'crash', 'ride', 'caisse', 'impact', 'tom', 'laser'], bus = {};
    const POMPES = ['pad', 'sub', 'voix', 'stab', 'arp', 'rumble', 'grogne', 'lead2'];
    ids.forEach(id => bus[id] = G(0));
    POMPES.forEach(id => bus[id].connect(pompe));
    ids.filter(id => POMPES.indexOf(id) < 0).forEach(id => bus[id].connect(master));
    const envoi = (id, v) => { const g = G(v); bus[id].connect(g); g.connect(envoiSalle); };
    envoi('pad', .45); envoi('clang', .6); envoi('lead', .42); envoi('lead2', .42); envoi('voix', .65); envoi('clap', .35); envoi('caisse', .4); envoi('tom', .3); envoi('stab', .3); envoi('arp', .3); envoi('impact', .4); envoi('perc', .35); envoi('laser', .6); envoi('acid', .12);
    { const dub = (id, v) => { const g = G(v); bus[id].connect(g); g.connect(echoIn); }; dub('clang', .8); dub('lead', .5); dub('arp', .55); dub('perc', .35); dub('laser', .5); dub('voix', .2); dub('acid', .12); }
    // la nappe : porte (trance-gate) → filtre qui s'ouvre (et respire lentement) → bus
    const gate = G(1), filtrePad = F('lowpass', 420, .8); chaine(gate, filtrePad, bus.pad);
    { const lfo = ctx.createOscillator(), lg = G(90); lfo.frequency.value = .11; lfo.connect(lg); lg.connect(filtrePad.frequency); lfo.start(); }
    const kickSat = ctx.createWaveShaper(); kickSat.curve = courbe(1.8); kickSat.connect(bus.kick);
    const grogneSat = courbe(3.2);
    // LES FRAPPES SONT DES TAMPONS pré-calculés une fois (aucun filtre à chaque coup : c'était la charge du moteur 30 de Cavale)
    const SR = ctx.sampleRate, norm = d => { let mx = 0; for (let i = 0; i < d.length; i++) mx = Math.max(mx, Math.abs(d[i])); if (mx > 0) for (let i = 0; i < d.length; i++) d[i] /= mx; return d; };
    const tampon = (len, fn) => { const n = Math.floor(SR * len), b = ctx.createBuffer(1, n, SR), d = b.getChannelData(0); fn(d, n); norm(d); const f = Math.min(n, Math.floor(SR * .004)); for (let i = 0; i < f; i++) d[n - 1 - i] *= i / f; return b; };
    const diff = (d, k) => { for (let j = 0; j < k; j++) { let pr = 0; for (let i = 0; i < d.length; i++) { const x = d[i]; d[i] = x - pr; pr = x; } } };
    const passeBande = (d, a1, a2) => { let y1 = 0, y2 = 0; for (let i = 0; i < d.length; i++) { y1 += a1 * (d[i] - y1); y2 += a2 * (d[i] - y2); d[i] = y1 - y2; } };
    const B = {};
    B.hat = tampon(.06, (d, n) => { for (let i = 0; i < n; i++) d[i] = (alea() * 2 - 1) * Math.exp(-i / SR / .009); diff(d, 2); });
    B.hatO = tampon(.3, (d, n) => { for (let i = 0; i < n; i++) d[i] = (alea() * 2 - 1) * Math.exp(-i / SR / .07) * Math.min(1, i / SR / .003); diff(d, 2); });
    B.snare = tampon(.28, (d, n) => { for (let i = 0; i < n; i++) d[i] = (alea() * 2 - 1); passeBande(d, .55, .08); for (let i = 0; i < n; i++) { const t = i / SR; d[i] = d[i] * 2.2 * Math.exp(-t / .07) + .7 * Math.sin(2 * Math.PI * (165 + 60 * Math.exp(-t / .02)) * t) * Math.exp(-t / .055); } });
    B.clap = tampon(.34, (d, n) => { for (let i = 0; i < n; i++) d[i] = (alea() * 2 - 1); passeBande(d, .42, .055); for (let i = 0; i < n; i++) { const t = i / SR; const rafale = t < .03 ? (Math.floor(t / .01) % 2 === 0 ? 1 : .55) : 0; d[i] *= rafale * 1.2 + Math.exp(-t / .09) * 1.0; } });
    B.crash = tampon(2.6, (d, n) => { for (let i = 0; i < n; i++) d[i] = (alea() * 2 - 1) * Math.exp(-i / SR / .6) * Math.min(1, i / SR / .004); diff(d, 2); });
    B.riser = tampon(1.4, (d, n) => { for (let i = 0; i < n; i++) d[i] = (alea() * 2 - 1) * Math.pow(i / n, 2.2); diff(d, 1); });
    B.rim = tampon(.06, (d, n) => { for (let i = 0; i < n; i++) { const t = i / SR; d[i] = Math.sin(2 * Math.PI * (1500 - 500 * Math.min(1, t / .04)) * t) * Math.exp(-t / .012) + .5 * (alea() * 2 - 1) * Math.exp(-t / .003); } });
    B.click = tampon(.012, (d, n) => { for (let i = 0; i < n; i++) d[i] = (alea() * 2 - 1) * Math.exp(-i / SR / .0015); });
    // les clangs : des cloches de métal, des rapports de fréquence qui ne sonnent pas juste (trois couleurs)
    B.clang = [[520, [1, 1.47, 2.09, 2.57, 3.16]], [780, [1, 1.59, 2.14, 2.92, 3.51]], [1180, [1, 1.38, 1.96, 2.71, 3.38]]].map(([f0, R]) => tampon(.7, (d, n) => {
      for (let i = 0; i < n; i++) { const t = i / SR; let s = 0; for (let k = 0; k < R.length; k++) s += Math.sin(2 * Math.PI * f0 * R[k] * t) * Math.exp(-t / (.32 / (1 + .5 * k))) / (1 + .4 * k); d[i] = s * Math.min(1, t / .002); } }));
    B.impact = tampon(1.9, (d, n) => { let y = 0; for (let i = 0; i < n; i++) { const t = i / SR; y += .08 * ((alea() * 2 - 1) - y); d[i] = y * 2.2 * Math.exp(-t / .5) + Math.sin(2 * Math.PI * (28 + 70 * Math.exp(-t / .09)) * t) * Math.exp(-t / .55); } });
    return { bus, pompe, filtrePad, gate, kickSat, grogneSat, echoSort, B, master };
  }

  function jouer(ctx, kit, p, t0, m0, n, alea) {
    p = Math.max(1, Math.min(30, p | 0));
    const b = kit.bus, B = kit.B, A = id => p >= QUAND[id];
    for (const id in b) b[id].gain.setValueAtTime(niv(id, p), t0);
    { const x = (p - 1) / 29; kit.master.gain.setTargetAtTime(.72 * (.66 + .38 * Math.pow(x, 1.2)) * Math.pow(10, -2.4 * Math.pow(Math.sin(Math.PI * x), .8) / 20), t0, .5); }   /* la montée du volume reste régulière : le milieu est creusé (2 dB), le limiteur ne mange plus la fin */

    // la LAME : deux scies + un carré dessous, un filtre résonant qui plonge pendant la note, un glissando depuis la note d'avant ; la fin de note se REFERME (constante de temps 0,11 s), jamais de coupure

    const dessous = (m, accord) => { const pcs = accord.map(x => x % 12); for (const d of [4, 3, 5, 7]) if (pcs.indexOf(((m - d) % 12 + 12) % 12) >= 0) return m - d; return m - 5; };
    // l'accord industriel : trois scies dans un filtre qui claque

    // l'arpège d'obsidienne : une pincée de scie dans un filtre qui se ferme vite

      x.frequency.setValueAtTime(1200, t); x.frequency.exponentialRampToValueAtTime(260, t + .13); env(g, t, v, .003, .15); o.connect(x); x.connect(g); g.connect(pn); pn.connect(b.arp); o.start(t); o.stop(t + .16); };
    // le laser : une scie qui tombe de deux octaves en 40 ms
    const laser = (t, midi, v, pan) => { const f = mtof(midi), o = osc('sawtooth', f * 3), x = filt('bandpass', 2000, 1.6), g = gain(0), pn = ctx.createStereoPanner(); pn.pan.value = pan * .5;
      o.frequency.setValueAtTime(f * 3, t); o.frequency.exponentialRampToValueAtTime(f, t + .04); env(g, t, v, .002, .18); o.connect(x); x.connect(g); g.connect(pn); pn.connect(b.laser); o.start(t); o.stop(t + .2); };
    const kick = (t, v) => { const o = osc('sine', 130), g = gain(0); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(48, t + .06);
      env(g, t, v, .002, .24); o.connect(g); g.connect(kit.kickSat); o.start(t); o.stop(t + .32); if (p >= 8) frappe(B.click, t, b.kick, .5 * v, 1, 0);
      kit.pompe.gain.setValueAtTime(POMPE(p), t); kit.pompe.gain.linearRampToValueAtTime(1, t + SD * 3.3); };
    const tom = (t, f0) => { const o = osc('sine', f0), g = gain(0); o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * .55, t + .22); env(g, t, .7, .003, .28); o.connect(g); g.connect(b.tom); o.start(t); o.stop(t + .3); };

    // ---- les lignes monophoniques : UN oscillateur (ou deux) par mesure, piloté par automation ----
    const acidBar = (tm, m, root, major, pat) => { const notes = [];
      for (let i = 0; i < 16; i++) { const ch = pat[i]; if (ch === '.') continue; const k = ch.toLowerCase(), off = AC[k], acc = ch !== k, up = major && (off === 3 || off === 15) ? 1 : 0;

      const tm = t0 + (m - m0) * MES, bar = m % 8, cy = Math.floor(m / 8), accord = CHORDS[bar], root = ROOTS[bar], d2 = m >> 1;

<!-- ======================= L'ÉCOUTE (libre : ce que voit celui qui ouvre le fichier) ======================= -->
<script>
(function () {
  let ctx = null, kit = null, p = 1, m = 0, tNext = 0, iv = 0;
  let graine = 12000; const alea = () => { graine = (graine * 1664525 + 1013904223) >>> 0; return graine / 4294967296; };
  const mes = 240 / MORCEAU.bpm;
  const ce = document.getElementById('ce'), play = document.getElementById('play'), jg = document.getElementById('speed'), mot = document.getElementById('mot');
  const maj = () => { mot.textContent = 'Moteur ' + p + ' / 30'; ce.textContent = 'Moteur ' + p + ' · ' + MORCEAU.paliers[p - 1]; };
  jg.addEventListener('input', () => { p = Math.max(1, Math.min(30, 1 + Math.round(+jg.value / 100 * 29))); maj(); });
  play.onclick = () => {
    if (iv) { clearInterval(iv); iv = 0; ctx.close(); ctx = null; play.textContent = 'PLAY'; maj(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)(); kit = MORCEAU.preparer(ctx, ctx.destination, alea);
    m = 0; tNext = ctx.currentTime + 0.1; play.textContent = 'STOP';
    iv = setInterval(() => { while (tNext < ctx.currentTime + 0.4) { MORCEAU.jouer(ctx, kit, p, tNext, m++, 1, alea); tNext += mes; } maj(); }, 60);
  };

</script>
