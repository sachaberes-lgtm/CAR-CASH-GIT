<!-- ======================= LE MORCEAU (format CASH CAR « morceau à paliers ») =======================
     (2026-11-02, pôle SON ; Léo : « refonte de la musique de course de CAVALE ULTRA : celle du lobby est bien ; la course, il faut changer, c'est un peu relou avec les basses ;
     quelque chose de totalement nouveau, mais de bien ; commencer calme pour bien s'intensifier ; du haut de gamme »).
     (2026-11-03, Léo : « à partir du palier 30 la musique bugge ; Cavale est encore trop proche de Mirage : les premières notes, les instruments, la rythmique ; élimine toute répétition de mélodie
     ou d'instrument ; l'instrument du lead s'arrête trop net ») — REFONTE : une seule idée gardée (138 BPM, ré dorien, Dm9 · Bbmaj7 · Gm9 · A7b9, la basse courte).
     LA FUITE EN VILLE, DE NUIT : au lieu des cordes pincées en saw et du violon, un MARIMBA (deux sinus, l'octave-et-demie qui claque) qui compte en 3-3-3-3-2-2 avec des silences, une nappe de
     triangles, un THÉRÉMINE (sinus + vibrato lent, portamento, la note se REFERME en douceur : jamais de coupure), un harmonica de verre au-dessus (22), des chœurs de sinus qui scintillent (23),
     un orgue (26) ; la rythmique est de la 2-step / du breakbeat : grosse caisse irrégulière qui change toutes les deux mesures, caisse claire syncopée, charleys swingués avec des triolets (puis des 32e),
     des clics de glitch qui tombent n'importe où, jamais de darbouka. Le thème a QUATRE versions qui se relaient, l'ostinato a HUIT motifs choisis mesure par mesure : deux phrases ne reviennent jamais à l'identique.
     COÛT (le bug du 30) : l'ancienne page jouait ~270 oscillateurs par mesure au moteur 30 (trois scies par pincée, trois par violon, des bruits filtrés à chaque doubles croches) et saturait le processeur ;
     ici les frappes sont des tampons pré-calculés (aucun filtre en direct), le marimba n'a que deux sinus, la nappe change toutes les deux mesures : ~130 oscillateurs par mesure au plus.
     (2026-11-03 soir, Léo : « la mélodie un peu basique, et surtout l'instrument peut avoir plus d'effet, sinon ça fait génératif ; poétique, moins électronique ») — LE THÈME ET LES VOIX :
     la fuite en ville est maintenant jouée par des CORDES VIVANTES : un VIOLONCELLE à l'archet (onde à partiels naturels dans un filtre qui s'ouvre avec la pression, souffle d'archet, vibrato
     qui ne s'installe qu'après l'attaque, portamento, une dérive de quelques cents, un corps de bois), un alto qui lui répond (contre-chant écrit), un VIOLON solo très haut (22), un chœur voyelle
     (formants) et un accordéon à anches (26) ; l'ostinato n'est plus un marimba mais une CITHARE (cordes pincées à modèle physique, deux chœurs de cordes désaccordés, calculées à la demande, une
     version douce et une dure selon la vélocité) — le son d'un film noir, la ville la nuit. LE THÈME est écrit : un motif (la quarte qui monte, la seconde, le soupir tenu), sa séquence sur chaque
     accord, un SOMMET (la sixte majeure sur Bb, puis le b9 sur A7), une cadence ; QUATRE versions DIRIGÉES : A (la question, finit ouverte sur la sensible), B (la réponse, monte puis se résout sur
     le ré), A' (la question ornée, plus haut) et C (le développement : les quatre premières mesures une octave plus bas, puis la grande montée vers le do aigu). Rien n'est tiré au hasard dans la mélodie.
     LE JEU EST HUMAIN : décalages de ±5 à 10 ms sur l'ostinato (les temps forts restent serrés), vélocités qui respirent d'une phrase à l'autre, notes fantômes, rubato léger en fin de phrase (≤ 25 ms) ;
     le tempo et la rythmique ne bougent pas.
     Ce bloc ne touche JAMAIS à la page : pas de document, window, setInterval, Math.random, ni ctx.currentTime. -->

    const dG = ctx.createDelay(2), dD = ctx.createDelay(2); dG.delayTime.value = SD * 3; dD.delayTime.value = SD * 3;
