<text x="16" y="24" class="ti">La justesse du radar : où il prévoit la pose, où elle arrive</text>
<text x="16" y="42" class="t2">Chaque point : une prévision du radar (yeux v2) qui annonçait une pose, contre la pose du vrai jeu. Δs = s prévu − s réel, le long de la piste ;</text>
