<text x="636" y="80" class="tb">|Δs| : médiane · 90e centile</text>
<line x1="636" y1="88" x2="940" y2="88" stroke="#e9e6df" stroke-width="1"/>
<circle cx="640" cy="102" r="3.6" fill="#2f6db5"/>
<text x="650" y="106" class="tb">main de machine</text>
<text x="940" y="106" class="p e">57 vols, 6 maps</text>
<text x="650" y="123" class="pt">● en vol</text>
<text x="806" y="123" class="pt e">0,2 m · 0,5 m</text>
<text x="940" y="123" class="p e">57 prévisions</text>
<text x="650" y="138" class="pt">△ depuis le sol</text>
<text x="806" y="138" class="pt e">25,8 m · 33,3 m</text>
<text x="940" y="138" class="p e">16 prévisions</text>
<circle cx="640" cy="158" r="3.6" fill="#9a6a00"/>
<text x="650" y="162" class="tb">main au clavier (profil)</text>
<text x="940" y="162" class="p e">55 vols, 6 maps</text>
<text x="650" y="179" class="pt">● en vol</text>
<text x="806" y="179" class="pt e">0,4 m · 44,8 m</text>
<text x="940" y="179" class="p e">52 prévisions</text>
<text x="650" y="194" class="pt">△ depuis le sol</text>
<text x="806" y="194" class="pt e">31,4 m · 38,8 m</text>
<text x="940" y="194" class="p e">13 prévisions</text>
<text x="636" y="218" class="p">● en vol : à la 1re vue du vol, à la 1re vue où la</text>
<text x="636" y="232" class="p">main tient sa façon de voler, et à la dernière vue</text>
<text x="636" y="246" class="p">située 1 s ou plus avant la pose. △ depuis le sol :</text>
<text x="636" y="260" class="p">la sortie que le voltigeur demande, prévue avant le</text>
<text x="636" y="274" class="p">décollage (son temps compte la route jusqu’au bord).</text>
<text x="636" y="288" class="p">La main de machine tient ses touches : le radar la</text>
<text x="636" y="302" class="p">rejoue au décimètre. La main au clavier donne des</text>
<text x="636" y="316" class="p">coups de volant tirés au hasard, que les yeux ne</text>
