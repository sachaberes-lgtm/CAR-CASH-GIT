<rect width="960" height="500" fill="#ffffff"/>
<text x="16" y="24" class="ti">Deux essais lents en deux mois, puis cinq virages en six jours : quatre méthodes et un nouveau but</text>
<text x="16" y="43" class="t2">Chaque marque est un virage du chantier des bots ; sous son nom, ce qui l’a arrêté. L’échelle du temps change : du 20 octobre au 22 novembre, 33 jours</text>
<text x="16" y="58" class="t2">sans travail sur les bots, l’axe est coupé (//) et 27 jours en sont retirés ; à droite, un jour est 21 fois plus large qu’à gauche.</text>
