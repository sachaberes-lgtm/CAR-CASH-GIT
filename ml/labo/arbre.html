NS[m.facon](v);","n":221},{"t":"~","l":"…"},{"t":" ","l":"  profil:PROFIL,","n":228},{"t":" ","l":"  REGLAGES:REGLAGES,","n":229},{"t":"-","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}"},{"t":"+","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'&&vue.vol?enVol(vue,m):{};}","n":230},{"t":" ","l":"};","n":231},{"t":"-","l":""}],"source":null,"rejeux":[{"course":"c0023-g910037","graine":910037,"pourquoi":["le plus gros raccourci : 1810 m"],"fin":"roche","t":333.85,"video":null}]},{"id":"c0024","nom":"pilote","date":"2026-11-25T17:32:00.311Z","etape":"K-fable","generation":0,"parents":[],"modele":"main","raison":"Le pilote de depart de l'etape K-fable, tel qu'il a ete donne a la boucle (--depuis).","code":"cerveaux/c0024-pilote.js","octets":15924,"jumeau":"c0003","jeu":"cashcar-v1627","commit":"4729c99ae","tmax":900,"note":{"survie_mediane_s":215.3,"argent_min":10368.1,"pieces_min":309.1,"figures_min":1.94,"air_pct":15.9,"vols_min":4.76,"vol_moyen_s":2,"raccourcis_min":0.31,"distance_m_min":7224,"nitro_pct":27.9},"parties":20,"fins":{"paroi":5,"tour":3,"roche":3,"vide":4,"pic":2,"air":3},"cout":null,"courses":[[910000,230.1,"paroi",23713,8,9.4,1,"espace > nuages > jade > canyon"],[910037,324.3,"tour",125616,15,22.5,2,"grotte > jade > espace > nuages > ville"],[910074,235.4,"tour",12884,10,17.5,0,"nuages > jade > espace > ville"],[910111,44,"paroi",2920,1,4.2,0,"canyon"],[910148,327.7,"roche",33494,15,22.3,6,"grotte > jade > espace > nuages > grotte"],[910185,172.6,"vide",13795,5,9.4,1,"grotte > nuages > jade"],[910222,161.9,"paroi",9507,1,2.7,0,"nuages > canyon"],[910259,244.6,"vide",24328,6,9.5,0,"espace > grotte > nuages > ville"],[910296,243.8,"roche",30162,10,19.9,0,"nuages > jade > espace > grotte"],[910333,166.4,"roche",11420,4,13.1,0,"jade > grotte"],[910370,235.8,"paroi",37137,6,13,0,"ville > nuages > jade > canyon"],[910407,340.3,"vide",237419,14,24.2,2,"jade > ville > grotte > nuages > jade"],[910444,197.4,"paroi",16474,6,11.6,1,"espace > ville > canyon"],[910481,200.6,"pic",15112,3,8.8,0,"ville > grotte > jade"],[910518,256.6,"tour",55342,6,11.2,1,"grotte > nuages > jade > ville"],[910555,372.1,"vide",63475,19,27.1,3,"espace > ville > grotte > nuages > espace"],[910592,144,"air",4767,4,15,1,"grotte > nuages"],[910629,159.6,"air",7272,3,20.8,3,"espace > nuages > ville"],[910666,37.2,"pic",1902,0,2.6,0,"jade"],[910703,149.3,"air",6583,1,5.9,1,"grotte > nuages > jade"]],"validation":null,"champion":true,"ecart":null,"source":["/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») =====","   SA STRATEGIE, EN CLAIR.","   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main","   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le","   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur.","   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR.","   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,","      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas.","   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se","      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne","      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence.","   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et","      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :","      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir.","   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la","      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :","      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon","      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard.","      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose.","   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein.","   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :","   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en","   travers) ; freiner ; voler expres comme un joueur ; poser des figures.","   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */","const PROFIL={","  modele:'clavier',graine:1,                 /* la main mesuree sur les joueurs au clavier (doigts.js, MAIN_CLAVIER), sans rien y ecrire par-dessus */","  chance:{prend:1,palierMin:12}              /* la seconde chance : dans les longues parties seulement (les joueurs : aux paliers 14 et 28) */","};","const REGLAGES={","  marge:10,          /* m gardes entre la ligne visee et le bord (la reference : 9, avec une main de machine) */","  bandeDecor:99,     /* m : sur une map a decor, la ligne visee ne s'ecarte pas plus de l'axe (99 = pas de limite) */","  nitroDecor:.62,    /* sur une map a decor, les seuils de virage de la nitro sont multiplies par ca (0 = jamais de nitro) */","  margeCouloir:15,   /* m gardes dans un couloir : le bord y est un mur */","  avance:.3,         /* s : on ne vise rien de plus proche (la reaction du volant : 0,2 s) */","  glisse:.12,        /* rad : la ligne visee ne se deplace pas plus vite que ce cap-la (a 115 m/s : 14 m de cote par seconde) */","  glisseUrgence:.3,  /* le meme quand la route lache : la, on ne menage plus rien */","  ligneLoin:320,     /* m : un objet de la ligne parfaite se vise jusque-la */","  piecesLoin:180,    /* m : une tranche de pieces se vise jusque-la */","  capLigne:.3,       /* rad : le cap le plus fort demande pour rejoindre la ligne */","  avanceCap:.25,     /* s : le cap prend cette avance sur le changement de lacet de la route (celui de dans 0,4 s moins celui d'ici) */","  capAvance:.25,     /* rad : l'avance ne depasse pas ca */","  braqueDoux:.15,    /* part de volant que demande un virage : en dessous, toute la largeur est permise */","  braqueFort:.5,     /* au-dessus, on se tient au moins a mi-largeur du cote INTERIEUR */","  braqueNitro:.4,    /* au-dessus, pas de nitro (.3 pour l'allumer) ; sur les maps a decor (une sortie y tue) : .25 et .18 */","  margeAllumer:.3,   /* part de ma vitesse : vSure doit la depasser d'autant pour ALLUMER la nitro… */","  margeTenir:.1,     /* …et d'autant pour la GARDER */","  jaugeAllume:.45,   /* jauge + reserve au-dessus de laquelle la nitro s'allume… */","  jaugeCoupe:.25,    /* …et en dessous de laquelle elle se coupe (le fond garde pour planer en vol) */","  capMax:.22,        /* rad : au-dela, la caisse est de travers, pas de nitro */","  bascule:10,        /* points qu'un rayon doit avoir de plus que la facon tenue pour qu'on en change */","  tenirFacon:.35,    /* s au moins sur une facon avant d'en changer (sauf si elle mene a la mort) */","  derive:.3          /* s : apres la pose, la caisse glisse dans son axe ce temps-la avant que le volant morde */","};","const cl=(v,a,b)=>v\u003ca?a:v>b?b:v;","const cote=o=>o.latC!=null?o.latC:o.lat;     /* sous la dalle, le lat des pieces, fruits et orbes est en miroir : latC */","","/* ---------- AU SOL ---------- */","/* ce qu'on vise : l'objet de la ligne parfaite s'il est proche et a portee, sinon la premiere tranche de pieces a portee, sinon un pouvoir */","function aRamasser(v,max){","  const R=REGLAGES,dmin=Math.max(15,v.vitesse*R.avance);","  const prend=(d,lat)=>d>=dmin&&Math.abs(lat)\u003c=max&&Math.abs(lat-v.lat)\u003cMath.max(3,(d-v.vitesse*.25)*R.glisse*.85);","  const L=v.ligne&&Array.isArray(v.ligne.objets)?v.ligne.objets:[];","  const obj=L.find(o=>o.d\u003cR.ligneLoin&&prend(o.d,o.lat));","  const P=Array.isArray(v.piecesDevant)?v.piecesDevant:[];","  const file=P.find(p=>p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));","  const O=Array.isArray(v.orbes)?v.orbes:[];","  const orbe=O.find(o=>o.d\u003c220&&prend(o.d,cote(o)));","  /* l'objet de la ligne d'abord quand il est le plus proche ou qu'il arrive dans 1,2 s ; les pieces sinon (elles font le palier) */","  if(obj&&(!file||obj.d\u003c=file.d+10||obj.d\u003cv.vitesse*1.2))return obj.lat;","  if(orbe&&(!file||orbe.d\u003c=file.d+10))return cote(orbe);","  if(file)return cote(file);","  if(obj)return obj.lat;","  return null;","}","/* DE COMBIEN LA ROUTE AURA TOURNE a d metres devant (rad, + a gauche) : vue.route le donne a 30, 60, 100, 150, 220… m ; entre deux, en ligne droite */","function tourne(v,d){","  const rt=Array.isArray(v.route)?v.route:[];","  let d0=0,a0=0;","  for(const p of rt){if(!p)continue;if(d\u003c=p.d)return a0+(p.virage-a0)*(d-d0)/Math.max(1,p.d-d0);d0=p.d;a0=p.virage;}","  return a0;","}","/* LE LACET DE LA ROUTE DANS t SECONDES (rad/s) : ce que la main devra suivre a ce moment-la. La loi `ligne` de la main ne connait que le lacet","   sous les roues, percu 0,15 s plus tard : dans un S, elle braque encore a droite quand la route est deja repartie a gauche (MESURE, tour 3,","   canyon : cap −0,6 rad en 0,4 s au changement de sens, la paroi 0,5 s apres). C'est au pilote de voir le virage d'apres. */","function lacetDans(v,t,vit){return (tourne(v,vit*(t+.15))-tourne(v,vit*Math.max(0,t-.15)))/(t\u003c.15?t+.15:.3);}","const DECOR={canyon:1,grotte:1,jade:1,ville:1};   /* les maps ou une sortie par le bord finit contre le decor */","function auSol(v,m){","  const R=REGLAGES,vg=v.virage,tn=v.tenue,vit=Math.max(6,v.vitesse),lmax=Math.max(.05,v.lacetMax||1);","  const couloir=(v.mur&&v.mur.ici)||(Array.isArray(v.couloirs)&&v.couloirs.some(c=>c.d0\u003cvit*2&&c.d1>0));","  const decor=!!DECOR[v.carte],max=Math.min(decor?R.bandeDecor:99,v.demi-(couloir?R.margeCouloir:R.marge));","  /* ce qui se ramasse a portee, sinon le milieu */","  let cible=0;","  const but=aRamasser(v,max);","  if(but!=null)cible=but;","  /* LA PLACE DANS LE VIRAGE : plus il demande de volant, plus la ligne reste du cote interieur — du virage QUI VIENT (dans 1 s, puis dans","     0,4 s) avant celui qu'on quitte : dans un S, l'interieur du premier est l'exterieur du second */","  const lIci=v.lacetRoute||0,lTot=lacetDans(v,.4,vit),lTard=lacetDans(v,1,vit);","  let lFort=lTard;","  if(Math.abs(lTot)>Math.abs(lFort))lFort=lTot;","  if(Math.abs(lIci)*.6>Math.abs(lFort))lFort=lIci;","  const force=Math.abs(lFort)/lmax,sens=lFort>0?1:-1,u=cl((force-R.braqueDoux)/(R.braqueFort-R.braqueDoux),0,1);","  if(u>0){const plancher=max*(-1+1.5*u);if(cible*sens\u003cplancher)cible=sens*plancher;}","  /* une flaque sur la ligne : passer a cote, du cote ou il y a le plus de place */","  const F=Array.isArray(v.flaques)?v.flaques:[];","  for(const f of F){if(f.d\u003c5||f.d>160)continue;if(Math.abs(f.lat-cible)\u003cf.rayon+4)cible=f.lat+(f.lat>0?-1:1)*(f.rayon+6);}","  /* LA ROUTE NE SE TIENT PLUS (le bord dans moins de 3 s) : vers le cote oppose au bord annonce */","  const lache=!!(tn&&tn.tient===false);","  if(lache)cible=-tn.cote*max*.5;","  cible=cl(cible,-max,max);","  /* LA LIGNE GLISSE VERS SA CIBLE, elle n'y saute pas. Apres un vol, elle repart d'ou la caisse est. */","  if(m.ligne==null||m.tSol==null||v.t-m.tSol>.25)m.ligne=cl(v.lat,-max,max);","  m.tSol=v.t;","  const pas=(lache?R.glisseUrgence:R.glisse)*vit*.1;","  m.ligne=cl(m.ligne+cl(cible-m.ligne,-pas,pas),-max,max);","  /* LE CAP D'AVANCE : la main vise le cap (ligne − lat) / (0,9 × vitesse). On lui donne ce cap PLUS l'avance sur le virage qui arrive :","     la caisse tourne deja vers lui quand il commence, au lieu de le decouvrir 0,15 s apres. */","  let capVoulu=cl((m.ligne-v.lat)/(.9*vit),-R.capLigne,R.capLigne)+cl((lTot-lIci)*R.avanceCap,-R.capAvance,R.capAvance);","  if(v.lat>max)capVoulu=Math.min(capVoulu,-.05);else if(v.lat\u003c-max)capVoulu=Math.max(capVoulu,.05);   /* jamais vers le bord quand on y est */","  const ligne=v.lat+.9*vit*cl(capVoulu,-.4,.4);","  /* LA NITRO : partout ou elle ne met pas la caisse dehors. Jamais de travers, en glisse, en rebond, quand la route lache, ni dans un virage","     qui demande du volant ; sur les maps a decor, encore moins. */","  const pose=Math.abs(v.lat)\u003cv.demi-6&&Math.abs(v.cap)\u003cR.capMax&&!v.glisse&&!v.rebond;","  const jauge=(v.nitro||0)+(v.reserve||0);","  if(jauge>R.jaugeAllume)m.plein=true;else if(jauge\u003cR.jaugeCoupe)m.plein=false;","  const proche=!!(vg&&vg.d\u003cvit*3),margeV=proche?vg.marge/vit:9;","  const k=decor?R.nitroDecor:1,seuil=(m.nitro?R.braqueNitro:R.braqueNitro-.1)*k;","  const sur=margeV>(m.nitro?R.margeTenir:R.margeAllumer)&&Math.max(force,Math.abs(lIci)/lmax)\u003cseuil;","  m.nitro=!lache&&pose&&sur&&(v.nitroLibre||!!m.plein);","  m.facon=null;","  return {ligne:ligne,nitro:m.nitro};","}","","/* ---------- EN VOL ---------- */","/* LA LOI « VERS LA ROUTE » (README § 2 bis), recopiee : c'est elle que jouent les rayons versRoute et versRoutePlane du radar */","function versRoute(v,nitro){","  const f=v.vol,p=f.proche,o={volant:0,manche:0,nitro:nitro};","  if(!p)return o;","  if(Math.abs(p.axe)\u003c1.6)o.volant=cl((cl(-p.lat/40,-.6,.6)-p.axe)*1.6,-1,1)*(p.envers?-1:1);","  if(p.haut>10&&Math.abs(p.lat)\u003cv.demi*2){","    const air=f.air&&f.air.reste!=null?f.air.reste:f.reste,delai=p.haut/Math.max(1,p.versRoute);","    if(delai>2||delai>air-1)o.manche=p.envers?1:-1;}","  return o;","}","const FACONS={","  rien:()=>({volant:0,manche:0,nitro:false}),","  gauche:()=>({volant:1,manche:0,nitro:false}),","  droite:()=>({volant:-1,manche:0,nitro:false}),","  cabre:()=>({volant:0,manche:1,nitro:false}),","  pique:()=>({volant:0,manche:-1,nitro:false}),","  plane:()=>({volant:0,manche:0,nitro:true}),","  planeCabre:()=>({volant:0,manche:1,nitro:true}),","  versRoute:v=>versRoute(v,false),","  versRoutePlane:v=>versRoute(v,true)","};","const LONGS={rien:1,plane:1,versRoute:1,versRoutePlane:1};   /* les rayons joues jusqu'au bout de l'air : « libre » y veut dire jauge vide */","/* ce que vaut l'issue d'un rayon : 100 = une pose droite tout de suite ; sous 35 = on y reste.","   Une pose vaut par son AXE et par l'endroit ou la caisse sera 0,3 s apres (elle glisse dans son axe avant que le volant morde). MESURE (tour 2,","   29 decollages d'une course) : la moitie etaient des sorties EN CHAINE — revenue en travers (axe 0,5 a 1 rad : « propre » pour le jeu, qui","   tolere 55°), la caisse se posait et ressortait par l'autre bord dans la seconde. */","function vaut(r,long,v){","  if(!r)return -1;","  const t=+r.t||0;","  if(r.issue==='pose'){","    const axe=+r.axe||0,glisse=(+r.lat||0)+v.vitesse*Math.sin(cl(axe,-1.5,1.5))*REGLAGES.derive;","    return 100-20*Math.abs(axe)-3*t-Math.min(20,Math.max(0,Math.abs(glisse)-(v.demi-4)))-(r.propre===false?20:0);}","  if(r.issue==='portail')return 94;","  if(r.issue==='levre')return 80-3*t;","  if(r.issue==='libre'||r.issue==='coupe'){","    if(long)return 12+2*t;                                    /* rien avant la fin de l'air : la jauge vide suit */","    return 34-Math.min(20,(Math.abs(+r.haut||0)+Math.abs(+r.lat||0))/10);}   /* un rayon court : on ne sait pas ; mieux vaut finir pres de la route */","  return Math.min(30,5*t);                                    /* choc, air, fond : le plus tard possible */","}","const sauve=r=>!!r&&(r.issue==='pose'||r.issue==='levre'||r.issue==='portail');","/* LE VOL. Une facon de piloter est TENUE : la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad par seconde — changer de facon a chaque","   vue, c'est zigzaguer d'un cote a l'autre de la route jusqu'a la jauge vide (MESURE, tour 3 : deux morts « air » sur quatre courses, la caisse","   passee quatre fois au-dessus de la dalle sans s'y poser). Donc :","   · au decollage, la loi « vers la route » (la seule mesuree : 9 retours sur 10 apres une sortie par le bord) ;","   · tant que le radar dit que la facon tenue mene a une pose (ou a la levre, au portail), on n'en change pas ;","   · sinon, et pas plus souvent que toutes les 0,35 s (sauf mort annoncee dans la seconde), on prend la facon du rayon qui vaut le plus. */","function enVol(v,m){","  const R=REGLAGES,f=v.vol,Y=f.radar&&Array.isArray(f.radar.rayons)?f.radar.rayons:null;","  if(!m.facon){m.facon='versRoute';m.tFacon=v.t;}","  if(Y){","    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=m.facon.indexOf('versRoute')===0;","    /* ce que dit le radar de la facon tenue : son propre rayon, et une fois les doigts dessus depuis une reaction, le rayon `tenu` (MESURE : juste","       49 fois sur 50) — sauf pour les lois « vers la route », dont l'ordre change a chaque vue : `tenu` n'y dit que la vue du moment */","    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon),sMien=vaut(mien,true,v);","    if(!sauve(mien)&&(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))){","      let mieux=null,sMieux=-9;","      for(const nom in FACONS){","        if(nom===m.facon)continue;","        /* a issue egale : la loi vers la route d'abord, et sans nitro (un vol sans reacteur rend de la jauge) */","        const s=vaut(Y.find(x=>x&&x.m===nom),!!LONGS[nom],v)+(nom==='versRoute'?3:nom==='versRoutePlane'?2:nom==='rien'?1:0);","        if(s>sMieux){sMieux=s;mieux=nom;}}","      if(mieux&&sMieux>sMien+R.bascule){m.facon=mieux;m.tFacon=v.t;}}","  }","  const o=FACONS[m.facon](v);","  o.ensuite={ligne:0};   /* a la pose, la main lache la fleche du vol et reprend la route sans attendre la decision suivante */","  return o;","}","","module.exports={","  nom:'pilote',","  profil:PROFIL,","  REGLAGES:REGLAGES,","  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","};",""],"rejeux":[{"course":"c0024-g910407","graine":910407,"pourquoi":["champion : sa meilleure course"],"fin":"vide","t":340.25,"video":null},{"course":"c0024-g910518","graine":910518,"pourquoi":["le plus gros raccourci : 1678 m"],"fin":"tour","t":256.58,"video":null},{"course":"c0024-g910629","graine":910629,"pourquoi":["le plus long vol pose : 9.68 s"],"fin":"air","t":159.7,"video":null},{"course":"c0024-g910666","graine":910666,"pourquoi":["champion : sa course la plus courte","la pire course de la generation (la plus courte)"],"fin":"pic","t":37.2,"video":null}]}],"generations":[{"etape":"1","generation":0,"champion":"c0001","critere":"argent_min","candidats":1},{"etape":"K-haiku","generation":0,"champion":"c0003","critere":"palier_median","candidats":1},{"etape":"K-haiku","generation":1,"champion":"c0004","critere":"palier_median","candidats":6},{"etape":"K-sonnet","generation":0,"champion":"c0010","critere":"palier_median","candidats":1},{"etape":"K-sonnet","generation":1,"champion":"c0011","critere":"palier_median","candidats":6},{"etape":"K-opus","generation":0,"champion":"c0017","critere":"palier_median","candidats":1},{"etape":"K-opus","generation":1,"champion":"c0022","critere":"palier_median","candidats":6},{"etape":"K-fable","generation":0,"champion":"c0024","critere":"palier_median","candidats":1}],"depenses":{"etapes":[{"etape":"outil","appels":1,"entree":5676,"sortie":5,"euros":0,"aChiffrer":0},{"etape":"C","appels":1,"entree":10301260,"sortie":104013,"euros":11.63,"aChiffrer":0},{"etape":"B","appels":1,"entree":22245810,"sortie":96622,"euros":8.71,"aChiffrer":0},{"etape":"K-haiku","appels":6,"entree":377849,"sortie":72732,"euros":0.06,"aChiffrer":0},{"etape":"K-sonnet","appels":6,"entree":377855,"sortie":59627,"euros":0.77,"aChiffrer":0},{"etape":"K-opus","appels":6,"entree":377843,"sortie":74911,"euros":1.89,"aChiffrer":0},{"etape":"K-fable","appels":1,"entree":62988,"sortie":32000,"euros":1.91,"aChiffrer":0}],"total":24.97,"aChiffrer":0},"etalon":{"parties":14,"note":{"survie_mediane_s":154.9,"argent_min":25316.3,"pieces_min":436.4,"figures_min":5.02,"air_pct":29.1,"vols_min":8.01,"vol_moyen_s":2.18,"raccourcis_min":2.79,"distance_m_min":11167,"nitro_pct":60.7}}};
const NOMS={survie_mediane_s:'survie médiane (s)',argent_min:'argent par minute',pieces_min:'pièces par minute',figures_min:'figures posées par minute',air_pct:'temps en l\'air (%)',
  vols_min:'vols par minute',vol_moyen_s:'vol moyen (s)',raccourcis_min:'raccourcis par minute',distance_m_min:'distance (m par minute)',nitro_pct:'nitro tenue (%)'};
const TEINTES=['#2563eb','#c2410c','#15803d','#7c3aed','#b45309','#0e7490','#be185d','#4d7c0f','#475569'];
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const f=x=>x==null?'—':(Math.abs(x)>=1000?Math.round(x).toLocaleString('fr-FR'):String(Math.round(x*100)/100).replace('.',','));
const N=D.noeuds,par={};N.forEach(n=>par[n.id]=n);
const etapes=[...new Set(N.map(n=>n.etape))],teinte=e=>TEINTES[etapes.indexOf(e)%TEINTES.length];
let mesure=localStorage.getItem('arbreMesure')||'argent_min',choisi=null;
$('mesure').innerHTML=Object.keys(NOMS).map(k=>'<option value="'+k+'">'+NOMS[k]+'</option>').join('');$('mesure').value=mesure;
$('mesure').onchange=e=>{mesure=e.target.value;try{localStorage.setItem('arbreMesure',mesure);}catch(x){}dessine();};
const dep=D.depenses;
$('compte').innerHTML='<b>'+N.length+'</b> cerveau'+(N.length>1?'x':'')+' · <b>'+D.generations.length+'</b> génération'+(D.generations.length>1?'s':'')+' close'+(D.generations.length>1?'s':'')+' · <b>'+f(dep.total)+' €</b> d\'API'+(dep.aChiffrer?' (+ '+dep.aChiffrer+' appel(s) sans prix)':'');
$('sous').textContent='jeu '+D.jeu.version+' · page faite le '+new Date(D.fait).toLocaleString('fr-FR');

/* LA MISE EN PLACE : une colonne par generation (dans l'ordre ou elles sont nees), un noeud sous l'autre, les enfants pres de leur parent */
function place(){
  const cles=[];N.forEach(n=>{const k=n.etape+'|'+n.generation;if(!cles.includes(k))cles.push(k);});
  const pos={},cols=cles.map((k,c)=>{const A=N.filter(n=>n.etape+'|'+n.generation===k);
    A.sort((a,b)=>{const ya=a.parents[0]&&pos[a.parents[0]]?pos[a.parents[0]].y:0,yb=b.parents[0]&&pos[b.parents[0]]?pos[b.parents[0]].y:0;return ya-yb||(b.note[mesure]||0)-(a.note[mesure]||0);});
    A.forEach((n,i)=>pos[n.id]={x:110+c*170,y:78+i*44});return {k:k,n:A.length};});
  return {pos:pos,cols:cols};
}
function dessine(){
  const P=place(),max=Math.max(1e-9,...N.map(n=>n.note[mesure]||0)),ray=n=>6+15*Math.sqrt(Math.max(0,n.note[mesure]||0)/max);
  const W=Math.max(520,110+P.cols.length*170+90),H=Math.max(260,78+Math.max(1,...P.cols.map(c=>c.n))*44+20);
  let s='';
  P.cols.forEach((c,i)=>{const q=c.k.split('|');s+='<text class="col" x="'+(110+i*170)+'" y="30" text-anchor="middle">étape '+esc(q[0])+' · génération '+esc(q[1])+'</text><text class="col" x="'+(110+i*170)+'" y="46" text-anchor="middle">'+c.n+' candidat'+(c.n>1?'s':'')+'</text>';});
  N.forEach(n=>n.parents.forEach(p=>{const a=P.pos[p],b=P.pos[n.id];if(!a||!b)return;const vif=choisi&&(choisi===n.id||choisi===p);
    s+='<path class="lien'+(vif?' vif':'')+'" d="M'+a.x+','+a.y+(a.x===b.x?' C'+(a.x-60)+','+a.y+' '+(b.x-60)+','+b.y:' C'+(a.x+85)+','+a.y+' '+(b.x-85)+','+b.y)+' '+b.x+','+b.y+'"/>';}));
  N.forEach(n=>{const p=P.pos[n.id],r=ray(n);
    s+='<g class="noeud" data-id="'+n.id+'"><circle cx="'+p.x+'" cy="'+p.y+'" r="'+r.toFixed(1)+'" fill="'+teinte(n.etape)+'" fill-opacity="'+(choisi===n.id?1:.78)+'" stroke="'+(n.champion?'var(--encre)':'none')+'" stroke-width="'+(n.champion?2.5:0)+'"/>'
      +'<text x="'+(p.x+r+5)+'" y="'+(p.y+4)+'">'+esc(n.id)+' '+esc(n.nom)+'</text><title>'+esc(n.id+' '+n.nom+' — '+NOMS[mesure]+' : '+f(n.note[mesure]))+'</title></g>';});
  const svg=$('arbre');svg.setAttribute('width',W);svg.setAttribute('height',H);svg.innerHTML=s;
  svg.querySelectorAll('.noeud').forEach(g=>g.onclick=()=>{choisi=g.dataset.id;dessine();fiche();});
  courbes();
}
/* LA FICHE : la raison, la note (contre le parent et contre les joueurs), ce qui a change dans le code, chaque course, les rejeux gardes */
function fiche(){
  const n=par[choisi];if(!n){$('fiche').innerHTML='<div class="vide">Clique un nœud : sa raison, sa note, ce qui a changé dans son code, ses courses.</div>';return;}
  const p=n.parents[0]&&par[n.parents[0]];
  let h='<h2>'+esc(n.nom)+' <span style="color:var(--doux);font-weight:400">'+esc(n.id)+'</span>'+(n.champion?' · champion de sa génération':'')+'</h2>';
  h+='<div class="sous">étape '+esc(n.etape)+' · génération '+n.generation+' · écrit par <b>'+esc(n.modele==='main'?'la main (pas l\'API)':n.modele)+'</b> · '+new Date(n.date).toLocaleDateString('fr-FR')
    +' · '+(n.parents.length?'descend de '+n.parents.map(esc).join(', '):'une racine')+(n.jumeau?' · même code que '+esc(n.jumeau):'')+'</div>';
  h+='<div class="raison">'+esc(n.raison)+'</div>';
  h+='<h3>La note · '+n.parties+' courses, '+n.tmax+' s au plus, jeu '+esc(n.jeu)+'</h3><div class="large"><table><tr><th>mesure</th><th>lui</th>'+(p?'<th>parent '+esc(p.id)+'</th><th>écart</th>':'')+(n.validation?'<th>graines neuves</th>':'')+(D.etalon?'<th>les joueurs</th>':'')+'</tr>';
  for(const k in NOMS){const v=n.note[k];h+='<tr><td>'+NOMS[k]+'</td><td><b>'+f(v)+'</b></td>';
    if(p){const q=p.note[k],d=v-q;h+='<td>'+f(q)+'</td><td class="'+(d>0?'mieux':d<0?'pire':'')+'">'+(d>0?'+':'')+f(d)+'</td>';}
    if(n.validation)h+='<td>'+f(n.validation.note[k])+'</td>';if(D.etalon)h+='<td>'+f(D.etalon.note[k])+'</td>';h+='</tr>';}
  h+='</table></div>';
  if(n.fins)h+='<div class="sous">fins : '+Object.entries(n.fins).sort((a,b)=>b[1]-a[1]).map(e=>esc(e[0])+' '+e[1]).join(' · ')+(D.etalon?' · les joueurs : '+D.etalon.parties+' parties (provisoire tant qu\'il n\'y en a pas 20)':'')+'</div>';
  if(n.cout)h+='<h3>Le coût</h3><div>'+f(n.cout.entree)+' jetons lus, '+f(n.cout.sortie)+' écrits · '+(n.cout.euros==null?'prix à chiffrer':f(n.cout.euros)+' €')+'</div>';
  const lignes=n.ecart||null;
  if(lignes){h+='<h3>Ce qui a changé dans le code (contre '+esc(p.id)+')</h3>'+(lignes.length?'<pre>'+lignes.map(d=>'<div class="'+(d.t==='+'?'p':d.t==='-'?'m':d.t==='~'?'t':'')+'">'+(d.t==='~'?'':d.t+' ')+esc(d.l)+'</div>').join('')+'</pre>':'<div class="sous">rien : le même code que son parent</div>');}
  else if(n.source)h+='<h3>Le code (une racine : en entier)</h3><pre>'+n.source.map(l=>'<div>'+esc(l)+'</div>').join('')+'</pre>';
  h+='<div class="sous" style="margin-top:6px">le fichier : <a href="'+esc(n.code)+'">'+esc(n.code)+'</a> ('+f(n.octets)+' octets)</div>';
  if(n.rejeux.length){h+='<h3>Les courses gardées</h3>';for(const r of n.rejeux)h+='<div style="margin:0 0 8px"><b>'+esc(r.course)+'</b> — '+r.pourquoi.map(esc).join(' ; ')+' · '+f(r.t)+' s, fin : '+esc(r.fin)
    +(r.video?'<br><video controls preload="none" src="'+esc(r.video)+'" style="max-width:100%;margin-top:4px"></video>':'<br><code>node rejouer.js '+esc(r.course)+'</code> · pas encore filmée')+'</div>';}
  h+='<h3>Ses courses</h3><table><tr><th>graine</th><th>durée</th><th>fin</th><th>argent</th><th>figures</th><th>air %</th><th>racc.</th></tr>'
    +n.courses.map(c=>'<tr title="'+esc(c[7])+'"><td>'+c[0]+'</td><td>'+f(c[1])+' s</td><td>'+esc(c[2])+'</td><td>'+f(c[3])+'</td><td>'+c[4]+'</td><td>'+f(c[5])+'</td><td>'+c[6]+'</td></tr>').join('')+'</table>';
  $('fiche').innerHTML=h;
}
/* LES COURBES : le champion de chaque generation close pour la mesure choisie (et la barre des joueurs), puis les euros par etape */
function courbes(){
  const C=D.generations.map(g=>({g:g,n:par[g.champion]})).filter(x=>x.n);let h='';
  if(C.length){const w=Math.max(360,70+C.length*70),H=170,vals=C.map(x=>x.n.note[mesure]||0),e=D.etalon?D.etalon.note[mesure]:null,max=Math.max(1e-9,...vals,e||0)*1.1,
      X=i=>55+i*((w-80)/Math.max(1,C.length-1||1)),Y=v=>H-28-(H-50)*v/max;
    h+='<h3>Le champion de chaque génération — '+NOMS[mesure]+'</h3><svg width="'+w+'" height="'+H+'">';
    if(e!=null)h+='<line x1="40" x2="'+(w-10)+'" y1="'+Y(e)+'" y2="'+Y(e)+'" stroke="var(--accent)" stroke-dasharray="5 4"/><text x="'+(w-12)+'" y="'+(Y(e)-5)+'" text-anchor="end" font-size="11" fill="var(--accent)">les joueurs : '+f(e)+'</text>';
    h+='<polyline fill="none" stroke="var(--encre)" stroke-width="2" points="'+C.map((x,i)=>X(i)+','+Y(vals[i])).join(' ')+'"/>';
    C.forEach((x,i)=>{h+='<circle cx="'+X(i)+'" cy="'+Y(vals[i])+'" r="4.5" fill="'+teinte(x.g.etape)+'"/><text x="'+X(i)+'" y="'+(Y(vals[i])-9)+'" text-anchor="middle" font-size="11" fill="var(--encre)">'+f(vals[i])+'</text>'
      +'<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--doux)">e'+esc(x.g.etape)+' g'+x.g.generation+'</text>';});
    h+='</svg>';}
  else h+='<h3>Le champion de chaque génération</h3><div class="sous">aucune génération close pour l\'instant</div>';
  h+='<h3>Les euros d\'API par étape</h3>'+(dep.etapes.length?'<table style="max-width:520px"><tr><th>étape</th><th>appels</th><th>jetons lus</th><th>jetons écrits</th><th>euros</th></tr>'
    +dep.etapes.map(p=>'<tr><td>étape '+esc(p.etape)+'</td><td>'+p.appels+'</td><td>'+f(p.entree)+'</td><td>'+f(p.sortie)+'</td><td>'+f(p.euros)+' €'+(p.aChiffrer?' (+'+p.aChiffrer+' sans prix)':'')+'</td></tr>').join('')
    +'<tr><td><b>total</b></td><td></td><td></td><td></td><td><b>'+f(dep.total)+' €</b></td></tr></table>':'<div class="sous">0 € : aucun appel à l\'API inscrit</div>');
  $('courbes').innerHTML=h;
}
if(!N.length){$('gauche').innerHTML='<div class="vide">Le journal est vide : aucun cerveau inscrit (node inscrire.js …).</div>';}
else{choisi=(D.generations.length?D.generations[D.generations.length-1].champion:null)||N[N.length-1].id;dessine();}
fiche();
