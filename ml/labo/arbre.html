 loi « vers la route » (la seule mesuree : 9 retours sur 10 apres une sortie par le bord) ;"},{"t":"-","l":"   · tant que le radar dit que la facon tenue mene a une pose (ou a la levre, au portail), on n'en change pas ;"},{"t":"-","l":"   · sinon, et pas plus souvent que toutes les 0,35 s (sauf mort annoncee dans la seconde), on prend la facon du rayon qui vaut le plus. */"},{"t":" ","l":"function enVol(v,m){","n":157},{"t":" ","l":"  const R=REGLAGES,f=v.vol,Y=f.radar&&Array.isArray(f.radar.rayons)?f.radar.rayons:null;","n":158},{"t":"~","l":"…"},{"t":" ","l":"  if(Y){","n":160},{"t":" ","l":"    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=m.facon.indexOf('versRoute')===0;","n":161},{"t":"-","l":"    /* ce que dit le radar de la facon tenue : son propre rayon, et une fois les doigts dessus depuis une reaction, le rayon `tenu` (MESURE : juste"},{"t":"-","l":"       49 fois sur 50) — sauf pour les lois « vers la route », dont l'ordre change a chaque vue : `tenu` n'y dit que la vue du moment */"},{"t":" ","l":"    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon),sMien=vaut(mien,true,v);","n":162},{"t":"-","l":"    if(!sauve(mien)&&(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))){"},{"t":"+","l":"    /* (CHANGE) une pose tenue mais mediocre (de travers, au bord) et pas imminente compte comme « a ameliorer » */","n":163},{"t":"+","l":"    const mediocre=!!mien&&mien.issue==='pose'&&sMien\u003cR.poseMediocre&&(+mien.t||0)>R.poseImminente;","n":164},{"t":"+","l":"    if((!sauve(mien)||mediocre)&&(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1&&!mediocre))){","n":165},{"t":" ","l":"      let mieux=null,sMieux=-9;","n":166},{"t":" ","l":"      for(const nom in FACONS){","n":167},{"t":" ","l":"        if(nom===m.facon)continue;","n":168},{"t":"-","l":"        /* a issue egale : la loi vers la route d'abord, et sans nitro (un vol sans reacteur rend de la jauge) */"},{"t":" ","l":"        const s=vaut(Y.find(x=>x&&x.m===nom),!!LONGS[nom],v)+(nom==='versRoute'?3:nom==='versRoutePlane'?2:nom==='rien'?1:0);","n":169},{"t":" ","l":"        if(s>sMieux){sMieux=s;mieux=nom;}}","n":170},{"t":"~","l":"…"},{"t":" ","l":"  }","n":172},{"t":" ","l":"  const o=FACONS[m.facon](v);","n":173},{"t":"-","l":"  o.ensuite={ligne:0};   /* a la pose, la main lache la fleche du vol et reprend la route sans attendre la decision suivante */"},{"t":"+","l":"  o.ensuite={ligne:0};","n":174},{"t":" ","l":"  return o;","n":175},{"t":" ","l":"}","n":176},{"t":"~","l":"…"},{"t":" ","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","n":182},{"t":" ","l":"};","n":183},{"t":"-","l":""}],"source":null,"rejeux":[]},{"id":"c0017","nom":"pilote","date":"2026-11-25T16:49:10.874Z","etape":"K-opus","generation":0,"parents":[],"modele":"main","raison":"Le pilote de depart de l'etape K-opus, tel qu'il a ete donne a la boucle (--depuis).","code":"cerveaux/c0017-pilote.js","octets":15924,"jumeau":"c0003","jeu":"cashcar-v1627","commit":"45854790d","tmax":900,"note":{"survie_mediane_s":215.3,"argent_min":10368.1,"pieces_min":309.1,"figures_min":1.94,"air_pct":15.9,"vols_min":4.76,"vol_moyen_s":2,"raccourcis_min":0.31,"distance_m_min":7224,"nitro_pct":27.9},"parties":20,"fins":{"paroi":5,"tour":3,"roche":3,"vide":4,"pic":2,"air":3},"cout":null,"courses":[[910000,230.1,"paroi",23713,8,9.4,1,"espace > nuages > jade > canyon"],[910037,324.3,"tour",125616,15,22.5,2,"grotte > jade > espace > nuages > ville"],[910074,235.4,"tour",12884,10,17.5,0,"nuages > jade > espace > ville"],[910111,44,"paroi",2920,1,4.2,0,"canyon"],[910148,327.7,"roche",33494,15,22.3,6,"grotte > jade > espace > nuages > grotte"],[910185,172.6,"vide",13795,5,9.4,1,"grotte > nuages > jade"],[910222,161.9,"paroi",9507,1,2.7,0,"nuages > canyon"],[910259,244.6,"vide",24328,6,9.5,0,"espace > grotte > nuages > ville"],[910296,243.8,"roche",30162,10,19.9,0,"nuages > jade > espace > grotte"],[910333,166.4,"roche",11420,4,13.1,0,"jade > grotte"],[910370,235.8,"paroi",37137,6,13,0,"ville > nuages > jade > canyon"],[910407,340.3,"vide",237419,14,24.2,2,"jade > ville > grotte > nuages > jade"],[910444,197.4,"paroi",16474,6,11.6,1,"espace > ville > canyon"],[910481,200.6,"pic",15112,3,8.8,0,"ville > grotte > jade"],[910518,256.6,"tour",55342,6,11.2,1,"grotte > nuages > jade > ville"],[910555,372.1,"vide",63475,19,27.1,3,"espace > ville > grotte > nuages > espace"],[910592,144,"air",4767,4,15,1,"grotte > nuages"],[910629,159.6,"air",7272,3,20.8,3,"espace > nuages > ville"],[910666,37.2,"pic",1902,0,2.6,0,"jade"],[910703,149.3,"air",6583,1,5.9,1,"grotte > nuages > jade"]],"validation":null,"champion":true,"ecart":null,"source":["/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») =====","   SA STRATEGIE, EN CLAIR.","   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main","   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le","   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur.","   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR.","   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,","      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas.","   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se","      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne","      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence.","   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et","      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :","      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir.","   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la","      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :","      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon","      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard.","      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose.","   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein.","   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :","   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en","   travers) ; freiner ; voler expres comme un joueur ; poser des figures.","   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */","const PROFIL={","  modele:'clavier',graine:1,                 /* la main mesuree sur les joueurs au clavier (doigts.js, MAIN_CLAVIER), sans rien y ecrire par-dessus */","  chance:{prend:1,palierMin:12}              /* la seconde chance : dans les longues parties seulement (les joueurs : aux paliers 14 et 28) */","};","const REGLAGES={","  marge:10,          /* m gardes entre la ligne visee et le bord (la reference : 9, avec une main de machine) */","  bandeDecor:99,     /* m : sur une map a decor, la ligne visee ne s'ecarte pas plus de l'axe (99 = pas de limite) */","  nitroDecor:.62,    /* sur une map a decor, les seuils de virage de la nitro sont multiplies par ca (0 = jamais de nitro) */","  margeCouloir:15,   /* m gardes dans un couloir : le bord y est un mur */","  avance:.3,         /* s : on ne vise rien de plus proche (la reaction du volant : 0,2 s) */","  glisse:.12,        /* rad : la ligne visee ne se deplace pas plus vite que ce cap-la (a 115 m/s : 14 m de cote par seconde) */","  glisseUrgence:.3,  /* le meme quand la route lache : la, on ne menage plus rien */","  ligneLoin:320,     /* m : un objet de la ligne parfaite se vise jusque-la */","  piecesLoin:180,    /* m : une tranche de pieces se vise jusque-la */","  capLigne:.3,       /* rad : le cap le plus fort demande pour rejoindre la ligne */","  avanceCap:.25,     /* s : le cap prend cette avance sur le changement de lacet de la route (celui de dans 0,4 s moins celui d'ici) */","  capAvance:.25,     /* rad : l'avance ne depasse pas ca */","  braqueDoux:.15,    /* part de volant que demande un virage : en dessous, toute la largeur est permise */","  braqueFort:.5,     /* au-dessus, on se tient au moins a mi-largeur du cote INTERIEUR */","  braqueNitro:.4,    /* au-dessus, pas de nitro (.3 pour l'allumer) ; sur les maps a decor (une sortie y tue) : .25 et .18 */","  margeAllumer:.3,   /* part de ma vitesse : vSure doit la depasser d'autant pour ALLUMER la nitro… */","  margeTenir:.1,     /* …et d'autant pour la GARDER */","  jaugeAllume:.45,   /* jauge + reserve au-dessus de laquelle la nitro s'allume… */","  jaugeCoupe:.25,    /* …et en dessous de laquelle elle se coupe (le fond garde pour planer en vol) */","  capMax:.22,        /* rad : au-dela, la caisse est de travers, pas de nitro */","  bascule:10,        /* points qu'un rayon doit avoir de plus que la facon tenue pour qu'on en change */","  tenirFacon:.35,    /* s au moins sur une facon avant d'en changer (sauf si elle mene a la mort) */","  derive:.3          /* s : apres la pose, la caisse glisse dans son axe ce temps-la avant que le volant morde */","};","const cl=(v,a,b)=>v\u003ca?a:v>b?b:v;","const cote=o=>o.latC!=null?o.latC:o.lat;     /* sous la dalle, le lat des pieces, fruits et orbes est en miroir : latC */","","/* ---------- AU SOL ---------- */","/* ce qu'on vise : l'objet de la ligne parfaite s'il est proche et a portee, sinon la premiere tranche de pieces a portee, sinon un pouvoir */","function aRamasser(v,max){","  const R=REGLAGES,dmin=Math.max(15,v.vitesse*R.avance);","  const prend=(d,lat)=>d>=dmin&&Math.abs(lat)\u003c=max&&Math.abs(lat-v.lat)\u003cMath.max(3,(d-v.vitesse*.25)*R.glisse*.85);","  const L=v.ligne&&Array.isArray(v.ligne.objets)?v.ligne.objets:[];","  const obj=L.find(o=>o.d\u003cR.ligneLoin&&prend(o.d,o.lat));","  const P=Array.isArray(v.piecesDevant)?v.piecesDevant:[];","  const file=P.find(p=>p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));","  const O=Array.isArray(v.orbes)?v.orbes:[];","  const orbe=O.find(o=>o.d\u003c220&&prend(o.d,cote(o)));","  /* l'objet de la ligne d'abord quand il est le plus proche ou qu'il arrive dans 1,2 s ; les pieces sinon (elles font le palier) */","  if(obj&&(!file||obj.d\u003c=file.d+10||obj.d\u003cv.vitesse*1.2))return obj.lat;","  if(orbe&&(!file||orbe.d\u003c=file.d+10))return cote(orbe);","  if(file)return cote(file);","  if(obj)return obj.lat;","  return null;","}","/* DE COMBIEN LA ROUTE AURA TOURNE a d metres devant (rad, + a gauche) : vue.route le donne a 30, 60, 100, 150, 220… m ; entre deux, en ligne droite */","function tourne(v,d){","  const rt=Array.isArray(v.route)?v.route:[];","  let d0=0,a0=0;","  for(const p of rt){if(!p)continue;if(d\u003c=p.d)return a0+(p.virage-a0)*(d-d0)/Math.max(1,p.d-d0);d0=p.d;a0=p.virage;}","  return a0;","}","/* LE LACET DE LA ROUTE DANS t SECONDES (rad/s) : ce que la main devra suivre a ce moment-la. La loi `ligne` de la main ne connait que le lacet","   sous les roues, percu 0,15 s plus tard : dans un S, elle braque encore a droite quand la route est deja repartie a gauche (MESURE, tour 3,","   canyon : cap −0,6 rad en 0,4 s au changement de sens, la paroi 0,5 s apres). C'est au pilote de voir le virage d'apres. */","function lacetDans(v,t,vit){return (tourne(v,vit*(t+.15))-tourne(v,vit*Math.max(0,t-.15)))/(t\u003c.15?t+.15:.3);}","const DECOR={canyon:1,grotte:1,jade:1,ville:1};   /* les maps ou une sortie par le bord finit contre le decor */","function auSol(v,m){","  const R=REGLAGES,vg=v.virage,tn=v.tenue,vit=Math.max(6,v.vitesse),lmax=Math.max(.05,v.lacetMax||1);","  const couloir=(v.mur&&v.mur.ici)||(Array.isArray(v.couloirs)&&v.couloirs.some(c=>c.d0\u003cvit*2&&c.d1>0));","  const decor=!!DECOR[v.carte],max=Math.min(decor?R.bandeDecor:99,v.demi-(couloir?R.margeCouloir:R.marge));","  /* ce qui se ramasse a portee, sinon le milieu */","  let cible=0;","  const but=aRamasser(v,max);","  if(but!=null)cible=but;","  /* LA PLACE DANS LE VIRAGE : plus il demande de volant, plus la ligne reste du cote interieur — du virage QUI VIENT (dans 1 s, puis dans","     0,4 s) avant celui qu'on quitte : dans un S, l'interieur du premier est l'exterieur du second */","  const lIci=v.lacetRoute||0,lTot=lacetDans(v,.4,vit),lTard=lacetDans(v,1,vit);","  let lFort=lTard;","  if(Math.abs(lTot)>Math.abs(lFort))lFort=lTot;","  if(Math.abs(lIci)*.6>Math.abs(lFort))lFort=lIci;","  const force=Math.abs(lFort)/lmax,sens=lFort>0?1:-1,u=cl((force-R.braqueDoux)/(R.braqueFort-R.braqueDoux),0,1);","  if(u>0){const plancher=max*(-1+1.5*u);if(cible*sens\u003cplancher)cible=sens*plancher;}","  /* une flaque sur la ligne : passer a cote, du cote ou il y a le plus de place */","  const F=Array.isArray(v.flaques)?v.flaques:[];","  for(const f of F){if(f.d\u003c5||f.d>160)continue;if(Math.abs(f.lat-cible)\u003cf.rayon+4)cible=f.lat+(f.lat>0?-1:1)*(f.rayon+6);}","  /* LA ROUTE NE SE TIENT PLUS (le bord dans moins de 3 s) : vers le cote oppose au bord annonce */","  const lache=!!(tn&&tn.tient===false);","  if(lache)cible=-tn.cote*max*.5;","  cible=cl(cible,-max,max);","  /* LA LIGNE GLISSE VERS SA CIBLE, elle n'y saute pas. Apres un vol, elle repart d'ou la caisse est. */","  if(m.ligne==null||m.tSol==null||v.t-m.tSol>.25)m.ligne=cl(v.lat,-max,max);","  m.tSol=v.t;","  const pas=(lache?R.glisseUrgence:R.glisse)*vit*.1;","  m.ligne=cl(m.ligne+cl(cible-m.ligne,-pas,pas),-max,max);","  /* LE CAP D'AVANCE : la main vise le cap (ligne − lat) / (0,9 × vitesse). On lui donne ce cap PLUS l'avance sur le virage qui arrive :","     la caisse tourne deja vers lui quand il commence, au lieu de le decouvrir 0,15 s apres. */","  let capVoulu=cl((m.ligne-v.lat)/(.9*vit),-R.capLigne,R.capLigne)+cl((lTot-lIci)*R.avanceCap,-R.capAvance,R.capAvance);","  if(v.lat>max)capVoulu=Math.min(capVoulu,-.05);else if(v.lat\u003c-max)capVoulu=Math.max(capVoulu,.05);   /* jamais vers le bord quand on y est */","  const ligne=v.lat+.9*vit*cl(capVoulu,-.4,.4);","  /* LA NITRO : partout ou elle ne met pas la caisse dehors. Jamais de travers, en glisse, en rebond, quand la route lache, ni dans un virage","     qui demande du volant ; sur les maps a decor, encore moins. */","  const pose=Math.abs(v.lat)\u003cv.demi-6&&Math.abs(v.cap)\u003cR.capMax&&!v.glisse&&!v.rebond;","  const jauge=(v.nitro||0)+(v.reserve||0);","  if(jauge>R.jaugeAllume)m.plein=true;else if(jauge\u003cR.jaugeCoupe)m.plein=false;","  const proche=!!(vg&&vg.d\u003cvit*3),margeV=proche?vg.marge/vit:9;","  const k=decor?R.nitroDecor:1,seuil=(m.nitro?R.braqueNitro:R.braqueNitro-.1)*k;","  const sur=margeV>(m.nitro?R.margeTenir:R.margeAllumer)&&Math.max(force,Math.abs(lIci)/lmax)\u003cseuil;","  m.nitro=!lache&&pose&&sur&&(v.nitroLibre||!!m.plein);","  m.facon=null;","  return {ligne:ligne,nitro:m.nitro};","}","","/* ---------- EN VOL ---------- */","/* LA LOI « VERS LA ROUTE » (README § 2 bis), recopiee : c'est elle que jouent les rayons versRoute et versRoutePlane du radar */","function versRoute(v,nitro){","  const f=v.vol,p=f.proche,o={volant:0,manche:0,nitro:nitro};","  if(!p)return o;","  if(Math.abs(p.axe)\u003c1.6)o.volant=cl((cl(-p.lat/40,-.6,.6)-p.axe)*1.6,-1,1)*(p.envers?-1:1);","  if(p.haut>10&&Math.abs(p.lat)\u003cv.demi*2){","    const air=f.air&&f.air.reste!=null?f.air.reste:f.reste,delai=p.haut/Math.max(1,p.versRoute);","    if(delai>2||delai>air-1)o.manche=p.envers?1:-1;}","  return o;","}","const FACONS={","  rien:()=>({volant:0,manche:0,nitro:false}),","  gauche:()=>({volant:1,manche:0,nitro:false}),","  droite:()=>({volant:-1,manche:0,nitro:false}),","  cabre:()=>({volant:0,manche:1,nitro:false}),","  pique:()=>({volant:0,manche:-1,nitro:false}),","  plane:()=>({volant:0,manche:0,nitro:true}),","  planeCabre:()=>({volant:0,manche:1,nitro:true}),","  versRoute:v=>versRoute(v,false),","  versRoutePlane:v=>versRoute(v,true)","};","const LONGS={rien:1,plane:1,versRoute:1,versRoutePlane:1};   /* les rayons joues jusqu'au bout de l'air : « libre » y veut dire jauge vide */","/* ce que vaut l'issue d'un rayon : 100 = une pose droite tout de suite ; sous 35 = on y reste.","   Une pose vaut par son AXE et par l'endroit ou la caisse sera 0,3 s apres (elle glisse dans son axe avant que le volant morde). MESURE (tour 2,","   29 decollages d'une course) : la moitie etaient des sorties EN CHAINE — revenue en travers (axe 0,5 a 1 rad : « propre » pour le jeu, qui","   tolere 55°), la caisse se posait et ressortait par l'autre bord dans la seconde. */","function vaut(r,long,v){","  if(!r)return -1;","  const t=+r.t||0;","  if(r.issue==='pose'){","    const axe=+r.axe||0,glisse=(+r.lat||0)+v.vitesse*Math.sin(cl(axe,-1.5,1.5))*REGLAGES.derive;","    return 100-20*Math.abs(axe)-3*t-Math.min(20,Math.max(0,Math.abs(glisse)-(v.demi-4)))-(r.propre===false?20:0);}","  if(r.issue==='portail')return 94;","  if(r.issue==='levre')return 80-3*t;","  if(r.issue==='libre'||r.issue==='coupe'){","    if(long)return 12+2*t;                                    /* rien avant la fin de l'air : la jauge vide suit */","    return 34-Math.min(20,(Math.abs(+r.haut||0)+Math.abs(+r.lat||0))/10);}   /* un rayon court : on ne sait pas ; mieux vaut finir pres de la route */","  return Math.min(30,5*t);                                    /* choc, air, fond : le plus tard possible */","}","const sauve=r=>!!r&&(r.issue==='pose'||r.issue==='levre'||r.issue==='portail');","/* LE VOL. Une facon de piloter est TENUE : la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad par seconde — changer de facon a chaque","   vue, c'est zigzaguer d'un cote a l'autre de la route jusqu'a la jauge vide (MESURE, tour 3 : deux morts « air » sur quatre courses, la caisse","   passee quatre fois au-dessus de la dalle sans s'y poser). Donc :","   · au decollage, la loi « vers la route » (la seule mesuree : 9 retours sur 10 apres une sortie par le bord) ;","   · tant que le radar dit que la facon tenue mene a une pose (ou a la levre, au portail), on n'en change pas ;","   · sinon, et pas plus souvent que toutes les 0,35 s (sauf mort annoncee dans la seconde), on prend la facon du rayon qui vaut le plus. */","function enVol(v,m){","  const R=REGLAGES,f=v.vol,Y=f.radar&&Array.isArray(f.radar.rayons)?f.radar.rayons:null;","  if(!m.facon){m.facon='versRoute';m.tFacon=v.t;}","  if(Y){","    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=m.facon.indexOf('versRoute')===0;","    /* ce que dit le radar de la facon tenue : son propre rayon, et une fois les doigts dessus depuis une reaction, le rayon `tenu` (MESURE : juste","       49 fois sur 50) — sauf pour les lois « vers la route », dont l'ordre change a chaque vue : `tenu` n'y dit que la vue du moment */","    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon),sMien=vaut(mien,true,v);","    if(!sauve(mien)&&(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))){","      let mieux=null,sMieux=-9;","      for(const nom in FACONS){","        if(nom===m.facon)continue;","        /* a issue egale : la loi vers la route d'abord, et sans nitro (un vol sans reacteur rend de la jauge) */","        const s=vaut(Y.find(x=>x&&x.m===nom),!!LONGS[nom],v)+(nom==='versRoute'?3:nom==='versRoutePlane'?2:nom==='rien'?1:0);","        if(s>sMieux){sMieux=s;mieux=nom;}}","      if(mieux&&sMieux>sMien+R.bascule){m.facon=mieux;m.tFacon=v.t;}}","  }","  const o=FACONS[m.facon](v);","  o.ensuite={ligne:0};   /* a la pose, la main lache la fleche du vol et reprend la route sans attendre la decision suivante */","  return o;","}","","module.exports={","  nom:'pilote',","  profil:PROFIL,","  REGLAGES:REGLAGES,","  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","};",""],"rejeux":[{"course":"c0017-g910407","graine":910407,"pourquoi":["champion : sa meilleure course"],"fin":"vide","t":340.25,"video":null},{"course":"c0017-g910518","graine":910518,"pourquoi":["le plus gros raccourci : 1678 m"],"fin":"tour","t":256.58,"video":null},{"course":"c0017-g910629","graine":910629,"pourquoi":["le plus long vol pose : 9.68 s"],"fin":"air","t":159.7,"video":null},{"course":"c0017-g910666","graine":910666,"pourquoi":["champion : sa course la plus courte","la pire course de la generation (la plus courte)"],"fin":"pic","t":37.2,"video":null}]},{"id":"c0018","nom":"pilote","date":"2026-11-25T17:20:50.884Z","etape":"K-opus","generation":1,"parents":["c0017"],"modele":"claude-opus-5-5","raison":"En vol, le parent garde la façon de piloter tant que le radar annonce « une pose ». Il la garde même quand cette pose est mauvaise : posée en travers, elle fait ressortir la caisse par l'autre bord (canyon, graine 910111). Il la garde aussi quand elle n'arrive qu'à la toute fin de l'air, alors que la loi « vers la route » dosée par la main clavier glisse toujours un peu plus tard que prévu (mort « air » de 910592, où le rayon « pique », un ordre franc, promettait une pose avec 1,2 s d'air de marge). Cette variante ne garde une façon que si sa pose est **bonne** : droite, sur la dalle, avec assez d'air de marge, et sans recul de la pose annoncée d'une vue à l'autre. Sinon elle prend le rayon qui finit par la pose la plus sûre. Elle préfère les ordres francs, que le radar prévoit au plus juste avec cette main, aux lois redécidées. Elle choisit dès la première vue du vol, et reconnaît un nouveau vol après un rebond.","code":"cerveaux/c0018-pilote.js","octets":19542,"jumeau":null,"jeu":"cashcar-v1627","commit":"45854790d","tmax":600,"note":{"survie_mediane_s":150.8,"argent_min":8670.6,"pieces_min":312.3,"figures_min":1.36,"air_pct":13.1,"vols_min":3.47,"vol_moyen_s":2.26,"raccourcis_min":0.12,"distance_m_min":7285,"nitro_pct":31.1},"parties":6,"fins":{"paroi":2,"air":1,"tour":1,"roche":2},"cout":{"entree":62988,"sortie":19255,"euros":0.7},"courses":[[910000,198.3,"paroi",13371,3,17,2,"espace > nuages > jade > canyon"],[910037,155.5,"air",12137,1,6.5,0,"grotte > jade"],[910074,146.1,"tour",13157,2,4.3,0,"nuages > jade > ville"],[910111,44,"paroi",2920,1,4.2,0,"canyon"],[910148,102.4,"roche",4192,2,6.2,0,"grotte"],[910185,321.5,"roche",94080,13,21,0,"grotte > nuages > ville > jade > grotte"]],"validation":null,"champion":false,"ecart":[{"t":"~","l":"…"},{"t":" ","l":"      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :","n":14},{"t":" ","l":"      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir.","n":15},{"t":"-","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la "    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=m.facon.indexOf('versRoute')===0;"},{"t":"+","l":"    const air=f.air&&f.air.reste!=null?+f.air.reste:(f.reste!=null?+f.reste:6);","n":223},{"t":"+","l":"    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=estLoi(m.facon);","n":224},{"t":" ","l":"    /* ce que dit le radar de la facon tenue : son propre rayon, et une fois les doigts dessus depuis une reaction, le rayon `tenu` (MESURE : juste","n":225},{"t":"-","l":"       49 fois sur 50) — sauf pour les lois « vers la route », dont l'ordre change a chaque vue : `tenu` n'y dit que la vue du moment */"},{"t":"-","l":"    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon),sMien=vaut(mien,true,v);"},{"t":"-","l":"    if(!sauve(mien)&&(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))){"},{"t":"+","l":"       55 fois sur 55 avec la main clavier) — sauf pour les lois « vers la route », dont l'ordre change a chaque vue */","n":226},{"t":"+","l":"    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon);","n":227},{"t":"+","l":"    /* LA POSE QUI FUIT : son heure annoncee recule d'une vue a l'autre (la main ne fait pas ce que le rayon suppose) */","n":228},{"t":"+","l":"    let fuit=false;","n":229},{"t":"+","l":"    if(mien&&mien.issue==='pose'){","n":230},{"t":"+","l":"      const abs=v.t+(+mien.t||0);","n":231},{"t":"+","l":"      if(m.poseAbs==null)m.poseAbs=abs;else fuit=abs-m.poseAbs>R.fuite;","n":232},{"t":"+","l":"    }else m.poseAbs=null;","n":233},{"t":"+","l":"    const sMien=vaut(mien,true,v,m.facon,air)-(fuit?R.peineFuite:0);","n":234},{"t":"+","l":"    const tient=bonne(mien,v,m.facon,air)&&!fuit;","n":235},{"t":"+","l":"    if(!tient&&(debut||depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))){","n":236},{"t":" ","l":"      let mieux=null,sMieux=-9;","n":237},{"t":" ","l":"      for(const nom in FACONS){","n":238},{"t":" ","l":"        if(nom===m.facon)continue;","n":239},{"t":" ","l":"        /* a issue egale : la loi vers la route d'abord, et sans nitro (un vol sans reacteur rend de la jauge) */","n":240},{"t":"-","l":"        const s=vaut(Y.find(x=>x&&x.m===nom),!!LONGS[nom],v)+(nom==='versRoute'?3:nom==='versRoutePlane'?2:nom==='rien'?1:0);"},{"t":"+","l":"        const s=vaut(Y.find(x=>x&&x.m===nom),!!LONGS[nom],v,nom,air)+(nom==='versRoute'?3:nom==='versRoutePlane'?2:nom==='rien'?1:0);","n":241},{"t":" ","l":"        if(s>sMieux){sMieux=s;mieux=nom;}}","n":242},{"t":"-","l":"      if(mieux&&sMieux>sMien+R.bascule){m.facon=mieux;m.tFacon=v.t;}}"},{"t":"+","l":"      if(mieux&&sMieux>sMien+(debut?R.basculeDebut:R.bascule)){m.facon=mieux;m.tFacon=v.t;m.poseAbs=null;}}","n":243},{"t":" ","l":"  }","n":244},{"t":" ","l":"  const o=FACONS[m.facon](v);","n":245},{"t":"~","l":"…"},{"t":" ","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","n":254},{"t":" ","l":"};","n":255},{"t":"-","l":""}],"source":null,"rejeux":[]},{"id":"c0019","nom":"pilote","date":"2026-11-25T17:20:51.266Z","etape":"K-opus","generation":1,"parents":["c0017"],"modele":"claude-opus-5-5","raison":"Le parent ne décide la nitro que sur le virage sous ses roues ou à moins de 3 s, et à sa vitesse du moment. Or l'allumage fait bondir la vitesse d'environ 12 % (116 → 131 m/s en 0,1 s sur la jade, juste avant la sortie), et la main réagit avec 0,2 s de retard. Cette variante juge donc la route à la vitesse qu'elle AURA avec la nitro (×1,12) : elle cherche le virage le plus serré des 2,5 prochaines secondes (`vue.route`), compare la vitesse sûre du prochain virage (`vSure`) à cette vitesse prévue, et lâche la nitro avant le virage plutôt que dedans. Elle ne la rallume pas non plus tant que la caisse change de ligne, car un changement de ligne est aussi un virage.","code":"cerveaux/c0019-pilote.js","octets":12663,"jumeau":null,"jeu":"cashcar-v1627","commit":"45854790d","tmax":600,"note":{"survie_mediane_s":195.7,"argent_min":10576.1,"pieces_min":307,"figures_min":1.81,"air_pct":17.2,"vols_min":4.82,"vol_moyen_s":2.14,"raccourcis_min":0.2,"distance_m_min":6836,"nitro_pct":13.2},"parties":6,"fins":{"air":3,"pic":1,"roche":1,"vide":1},"cout":{"entree":62984,"sortie":10476,"euros":0.22},"courses":[[910000,362.3,"air",136459,19,28.5,1,"espace > nuages > ville > jade > espace"],[910037,25.3,"air",641,0,25.1,0,"grotte"],[910074,137.5,"pic",7717,1,3.3,0,"nuages > jade"],[910111,278.4,"roche",42181,7,11.4,1,"canyon > espace > grotte"],[910148,164.1,"vide",7602,3,9.9,0,"grotte > jade"],[910185,227.3,"air",16022,6,17.9,2,"grotte > nuages > ville"]],"validation":null,"champion":false,"ecart":[{"t":" ","l":"/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») =====","n":1},{"t":"-","l":"   SA STRATEGIE, EN CLAIR."},{"t":"+","l":"   VARIANTE « LA VITESSE AVANT LES VIRAGES » : une seule idee changee par rapport au parent c0017, la decision de la NITRO au sol.","n":2},{"t":"+","l":"   Le parent jugeait la nitro sur le virage sous les roues (et le prochain s'il etait a moins de 3 s), a la vitesse du moment. Deux defauts :","n":3},{"t":"+","l":"   · ALLUMER la nitro fait bondir la vitesse (MESURE, graine 910666, jade : 116 → 131 m/s en 0,1 s a l'allumage, puis la caisse sort a 36 s) ;","n":4},{"t":"+","l":"     un virage « sur » a 116 m/s ne l'est plus a 131, et la main met 0,2 s a corriger ;","n":5},{"t":"+","l":"   · le virage qui compte est celui ou la caisse SERA quand la vitesse aura pris effet, pas celui sous ses roues.","n":6},{"t":"+","l":"   Donc : la route est jugee a la vitesse PREVUE (vitesse × boost), sur tout l'horizon de 2,5 s (vue.route), et la marge de vSure aussi.","n":7},{"t":"+","l":"   La nitro est lachee AVANT le virage, plus dedans. Et on ne l'allume pas au milieu d'un changement de ligne (c'est un virage aussi).","n":8},{"t":"+","l":"   SA STRATEGIE, EN CLAIR (inchangee pour le reste).","n":9},{"t":" ","l":"   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","n":10},{"t":" ","l":"   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main","n":11},{"t":"-","l":"   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le"},{"t":"-","l":"   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur."},{"t":"-","l":"   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR."},{"t":"-","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,"},{"t":"-","l":"      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas."},{"t":"-","l":"   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se"},{"t":"-","l":"      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne"},{"t":"-","l":"      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence."},{"t":"-","l":"   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et"},{"t":"-","l":"      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :"},{"t":"-","l":"      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir."},{"t":"-","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la"},{"t":"-","l":"      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :"},{"t":"-","l":"      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon"},{"t":"-","l":"      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard."},{"t":"-","l":"      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose."},{"t":"+","l":"   voit la route avec 0,15 s de retard.","n":12},{"t":"+","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite, puis les pieces, puis les pouvoirs) ; sa ligne GLISSE vers sa cible.","n":13},{"t":"+","l":"   2. LE VIRAGE D'APRES. Il se place du cote INTERIEUR du virage qui vient, et donne a la main un cap d'AVANCE sur le changement de sens.","n":14},{"t":"+","l":"   3. LA NITRO LA OU ELLE SERT — jugee a la vitesse qu'elle donnera, sur les 2,5 s qui viennent (cette variante).","n":15},{"t":"+","l":"   4. EN VOL, LE RADAR (inchange).","n":16},{"t":" ","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein.","n":17},{"t":"-","l":"   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :"},{"t":"-","l":"   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en"},{"t":"-","l":"   travers) ; freiner ; voler expres comme un joueur ; poser des figures."},{"t":" ","l":"   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */","n":18},{"t":" ","l":"const PROFIL={","n":19},{"t":"~","l":"…"},{"t":" ","l":"  margeCouloir:15,   /* m gardes dans un couloir : le bord y est un mur */","n":27},{"t":" ","l":"  avance:.3,         /* s : on ne vise rien de plus proche (la reaction du volant : 0,2 s) */","n":28},{"t":"-","l":"  glisse:.12,        /* rad : la ligne visee ne se deplace pas plus vite que ce cap-la (a 115 m/s : 14 m de cote par seconde) */"},{"t":"-","l":"  glisseUrgence:.3,  /* le meme quand la route lache : la, on ne menage plus rien */"},{"t":"+","l":"  glisse:.12,        /* rad : la ligne visee ne se deplace pas plus vite que ce cap-la */","n":29},{"t":"+","l":"  glisseUrgence:.3,  /* le meme quand la route lache */","n":30},{"t":" ","l":"  ligneLoin:320,     /* m : un objet de la ligne parfaite se vise jusque-la */","n":31},{"t":" ","l":"  piecesLoin:180,    /* m : une tranche de pieces se vise jusque-la */","n":32},{"t":" ","l":"  capLigne:.3,       /* rad : le cap le plus fort demande pour rejoindre la ligne */","n":33},{"t":"-","l":"  avanceCap:.25,     /* s : le cap prend cette avance sur le changement de lacet de la route (celui de dans 0,4 s moins celui d'ici) */"},{"t":"+","l":"  avanceCap:.25,     /* s : le cap prend cette avance sur le changement de lacet de la route */","n":34},{"t":" ","l":"  capAvance:.25,     /* rad : l'avance ne depasse pas ca */","n":35},{"t":" ","l":"  braqueDoux:.15,    /* part de volant que demande un virage : en dessous, toute la largeur est permise */","n":36},{"t":" ","l":"  braqueFort:.5,     /* au-dessus, on se tient au moins a mi-largeur du cote INTERIEUR */","n":37},{"t":"-","l":"  braqueNitro:.4,    /* au-dessus, pas de nitro (.3 pour l'allumer) ; sur les maps a decor (une sortie y tue) : .25 et .18 */"},{"t":"-","l":"  margeAllumer:.3,   /* part de ma vitesse : vSure doit la depasser d'autant pour ALLUMER la nitro… */"},{"t":"-","l":"  margeTenir:.1,     /* …et d'autant pour la GARDER */"},{"t":"+","l":"  braqueNitro:.4,    /* au-dessus, pas de nitro (.3 pour l'allumer) ; sur les maps a dec "id":"c0020","nom":"pilote","date":"2026-11-25T17:20:51.648Z","etape":"K-opus","generation":1,"parents":["c0017"],"modele":"claude-opus-5-5","raison":"Le pilote garde souvent sa jauge pleine (nitro 1.00 dans les autopsies) sans l'allumer : chaque fruit ou plaque de la ligne parfaite pris à ce moment-là est perdu. Cette variante ne change qu'une chose : quand le prochain objet de la ligne est à moins d'une seconde et demie et que la jauge déborderait, elle tient la nitro avec des seuils de virage un peu plus larges (×1,3, et une marge d'allumage de 0,2 au lieu de 0,3). Le carburant est alors gratuit, rendu aussitôt par l'objet. Toutes les gardes de route restent en place (route qui lâche, caisse de travers, flaque, couloir, maps à décor), pour monter vers les 60 % de nitro d'un joueur sans risquer davantage la route.","code":"cerveaux/c0020-pilote.js","octets":14524,"jumeau":null,"jeu":"cashcar-v1627","commit":"45854790d","tmax":600,"note":{"survie_mediane_s":177,"argent_min":6120.7,"pieces_min":286.9,"figures_min":2.43,"air_pct":18.1,"vols_min":5.14,"vol_moyen_s":2.11,"raccourcis_min":0.39,"distance_m_min":7273,"nitro_pct":28.6},"parties":6,"fins":{"air":2,"roche":3,"paroi":1},"cout":{"entree":62976,"sortie":9585,"euros":0.21},"courses":[[910000,43.1,"air",1035,1,16.8,0,"espace"],[910037,337,"roche",48852,16,27.3,3,"grotte > jade > nuages > espace > grotte"],[910074,216.6,"air",19841,3,11.4,0,"nuages > jade > ville > grotte"],[910111,137.4,"paroi",5755,6,9.4,0,"canyon"],[910148,276.4,"roche",32387,18,19.7,4,"grotte > jade > ville > nuages > grotte"],[910185,75.6,"roche",2924,0,9.4,0,"grotte"]],"validation":null,"champion":false,"ecart":[{"t":" ","l":"/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») =====","n":1},{"t":"-","l":"   SA STRATEGIE, EN CLAIR."},{"t":"+","l":"   VARIANTE « LA LIGNE PAIE LA NITRO » (une seule idee de plus que le parent c0017).","n":2},{"t":"+","l":"   CE QUI CHANGE : la nitro n'est plus seulement une question de virage, c'est aussi une question de JAUGE QUI DEBORDE. Le parent roule souvent","n":3},{"t":"+","l":"   jauge pleine sans l'allumer (autopsies : « nitro 1.00 » sans NITRO, a 115 m/s sur la jade) ; chaque fruit ou plaque de la ligne parfaite","n":4},{"t":"+","l":"   pris a ce moment-la est perdu (le don, 1,15 unite de jauge, ne rentre pas). Quand le prochain objet de la ligne arrive dans 1,5 s et que son","n":5},{"t":"+","l":"   don ne rentrerait pas dans la jauge, la nitro est gratuite : elle est donc tenue avec des seuils de virage un peu plus larges (x1,3) et une","n":6},{"t":"+","l":"   marge d'allumage plus courte (0,2 au lieu de 0,3). Rien d'autre : toutes les gardes (route qui lache, caisse de travers, glisse, rebond,","n":7},{"t":"+","l":"   maps a decor) restent celles du parent. Les joueurs tiennent la nitro 76 % du sol, le parent 28 % du temps.","n":8},{"t":"+","l":"   SA STRATEGIE, EN CLAIR (inchangee).","n":9},{"t":" ","l":"   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","n":10},{"t":" ","l":"   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main","n":11},{"t":"-","l":"   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le"},{"t":"-","l":"   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur."},{"t":"-","l":"   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR."},{"t":"-","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,"},{"t":"-","l":"      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas."},{"t":"-","l":"   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se"},{"t":"-","l":"      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne"},{"t":"-","l":"      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence."},{"t":"-","l":"   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et"},{"t":"-","l":"      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :"},{"t":"-","l":"      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir."},{"t":"-","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la"},{"t":"-","l":"      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :"},{"t":"-","l":"      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon"},{"t":"-","l":"      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard."},{"t":"-","l":"      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose."},{"t":"+","l":"   voit la route avec 0,15 s de retard. Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR.","n":12},{"t":"+","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite d'abord, puis les pieces, puis les pouvoirs) ; sa ligne GLISSE vers sa cible.","n":13},{"t":"+","l":"   2. LE VIRAGE D'APRES : il se place du cote INTERIEUR du virage qui vient, et donne a la main un cap d'AVANCE.","n":14},{"t":"+","l":"   3. LA NITRO LA OU ELLE SERT, et la ou la ligne la rembourse (ci-dessus).","n":15},{"t":"+","l":"   4. EN VOL, LE RADAR : la loi « vers la route », puis le rayon qui vaut le plus si la facon tenue mene a la mort.","n":16},{"t":" ","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein.","n":17},{"t":"-","l":"   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :"},{"t":"-","l":"   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en"},{"t":"-","l":"   travers) ; freiner ; voler expres comme un joueur ; poser des figures."},{"t":" ","l":"   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */","n":18},{"t":" ","l":"const PROFIL={","n":19},{"t":"~","l":"…"},{"t":" ","l":"  jaugeCoupe:.25,    /* …et en dessous de laquelle elle se coupe (le fond garde pour planer en vol) */","n":42},{"t":" ","l":"  capMax:.22,        /* rad : au-dela, la caisse est de travers, pas de nitro */","n":43},{"t":"+","l":"  /* LA LIGNE PAIE LA NITRO (l'idee de cette variante) */","n":44},{"t":"+","l":"  dons:1.5,          /* s : un objet de la ligne qui arrive dans ce temps-la compte comme deja pris */","n":45},{"t":"+","l":"  deborde:1.0,       /* part de jauge : si jauge + don depasse ca, le don serait perdu — la nitro est gratuite */","n":46},{"t":"+","l":"  braqueDon:1.3,     /* les seuils de virage de la nitro sont multiplies par ca quand elle est gratuite */","n":47},{"t":"+","l":"  margeDon:.2,       /* et la marge d'allumage sur vSure descend a ca (celle pour la garder ne bouge pas) */","n":48},{"t":" ","l":"  bascule:10,        /* points qu'un rayon doit avoir de plus que la facon tenue pour qu'on en change */","n":49},{"t":" ","l":"  tenirFacon:.35,    /* s au moins sur une facon avant d'en changer (sauf si elle mene a la mort) */","n":50},{"t":"~","l":"…"},{"t":" ","l":"  const prend=(d,lat)=>d>=dmin&&Math.abs(lat)\u003c=max&&Math.abs(lat-v.lat)\u003cMath.max(3,(d-v.vitesse*.25)*R.glisse*.85);","n":60},{"t":" ","l":"  const L=v.ligne&&Array.isArray(v.ligne.objets)?v.ligne.objets:[];","n":61},{"t":"-","l":"  const obj=L.find(o=>o.d\u003cR.ligneLoin&&prend(o.d,o.lat));"},{"t":"+","l":"  const obj=L.find(o=>o&&o.d\u003cR.ligneLoin&&prend(o.d,o.lat));","n":62},{"t":" ","l":"  const P=Array.isArray(v.piecesDevant)?v.piecesDevant:[];","n":63},{"t":"-","l":"  const file=P.find(p=>p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));"},{"t":"+","l":"  const file=P.find(p=>p&&p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));","n":64},{"t":" ","l":"  const O=Array.isArray(v.orbes)?v.orbes:[];","n":65},{"t":"-","l":"  const orbe=O.find(o=>o.d\u003c220&&prend(o.d,cote(o)));"},{"t":"+","l":"  const orbe=O.find(o=>o&&o.d\u003c220&&prend(o.d,cote(o)));","n":66},{"t":" ","l":"  /* l'objet de la ligne d'abord quand il est le plus proche ou qu'il arrive dans 1,2 s ; les pieces sinon (elles font le palier) */","n":67},{"t":" ","l":"  if(obj&&(!file||obj.d\u003c=file.d+10||obj.d\u003cv.vitesse*1.2))return obj.lat;","n":68},{"t":"~","l":"…"},{"t":" ","l":"  return null;","n":72},{"t":" ","l":"}","n":73},{"t":"+","l":"/* LA LIGNE PAIE-T-ELLE LA NITRO ? Vrai si le prochain objet de la ligne parfaite arrive dans R.dons secondes, se prendra depuis la ligne visee","n":74},{"t":"+","l":"   (fruit 4,5 m de cote, plaque 5,6 m : vue.ligne.prises) et que son don ne rentrerait pas dans la jauge. POURQUOI : jauge pleine, le don est","n":75},{"t":"+","l":"   perdu ; bruler de la nitro juste avant, c'est la payer avec ce qui serait perdu. Le don est en unites de jauge du jeu : divise par palier.jauge. */","n":76},{"t":"+","l":"function ligneRembourse(v,m,vit){","n":77},{"t":"+","l":"  const R=REGLAGES,lg=v.ligne;","n":78},{"t":"+","l":"  if(!lg||!Array.isArray(lg.objets))return false;","n":79},{"t":"+","l":"  const J=v.palier&&v.palier.jauge>0?v.palier.jauge:2;","n":80},{"t":"+","l":"  const pr=lg.prises||{};","n":81},{"t":"+","l":"  const o=lg.objets.find(x=>x&&x.d>2&&x.d\u003cvit*R.dons);","n":82},{"t":"+","l":"  if(!o)return false;","n":83},{"t":"+","l":"  const prise=(o.type==='plaque'?(+pr.plaque||5.6):(+pr.fruit||4.5));","n":84},{"t":"+","l":"  const vise=m.ligne!=null?m.ligne:v.lat;","n":85},{"t":"+","l":"  if(Math.abs(o.lat-vise)>prise+1)return false;","n":86},{"t":"+","l":"  const don=(+o.don||+lg.don||1.15)/J;","n":87},{"t":"+","l":"  return (v.nitro||0)+don>R.deborde;","n":88},{"t":"+","l":"}","n":89},{"t":" ","l":"/* DE COMBIEN LA ROUTE AURA TOURNE a d metres devant (rad, + a gauche) : vue.route le donne a 30, 60, 100, 150, 220… m ; entre deux, en ligne droite */","n":90},{"t":" ","l":"function tourne(v,d){","n":91},{"t":"~","l":"…"},{"t":" ","l":"  return a0;","n":95},{"t":" ","l":"}","n":96},{"t":"-","l":"/* LE LACET DE LA ROUTE DANS t SECONDES (rad/s) : ce que la main devra suivre a ce moment-la. La loi `ligne` de la main ne connait que le lacet"},{"t":"-","l":"   sous les roues, percu 0,15 s plus tard : dans un S, elle braque encore a droite quand la route est deja repartie a gauche (MESURE, tour 3,"},{"t":"-","l":"   canyon : cap −0,6 rad en 0,4 s au changement de sens, la paroi 0,5 s apres). C'est au pilote de voir le virage d'apres. */"},{"t":"+","l":"/* LE LACET DE LA ROUTE DANS t SECONDES (rad/s) : ce que la main devra suivre a ce moment-la. */","n":97},{"t":" ","l":"function lacetDans(v,t,vit){return (tourne(v,vit*(t+.15))-tourne(v,vit*Math.max(0,t-.15)))/(t\u003c.15?t+.15:.3);}","n":98},{"t":" ","l":"const DECOR={canyon:1,grotte:1,jade:1,ville:1};   /* les maps ou une sortie par le bord finit contre le decor */","n":99},{"t":" ","l":"function auSol(v,m){","n":100},{"t":" ","l":"  const R=REGLAGES,vg=v.virage,tn=v.tenue,vit=Math.max(6,v.vitesse),lmax=Math.max(.05,v.lacetMax||1);","n":101},{"t":"-","l":"  const couloir=(v.mur&&v.mur.ici)||(Array.isArray(v.couloirs)&&v.couloirs.some(c=>c.d0\u003cvit*2&&c.d1>0));"},{"t":"+","l":"  const couloir=(v.mur&&v.mur.ici)||(Array.isArray(v.couloirs)&&v.couloirs.some(c=>c&&c.d0\u003cvit*2&&c.d1>0));","n":102},{"t":" ","l":"  const decor=!!DECOR[v.carte],max=Math.min(decor?R.bandeDecor:99,v.demi-(couloir?R.margeCouloir:R.marge));","n":103},{"t":" ","l":"  /* ce qui se ramasse a portee, sinon le milieu */","n":104},{"t":"~","l":"…"},{"t":" ","l":"  const but=aRamasser(v,max);","n":106},{"t":" ","l":"  if(but!=null)cible=but;","n":107},{"t":"-","l":"  /* LA PLACE DANS LE VIRAGE : plus il demande de volant, plus la ligne reste du cote interieur — du virage QUI VIENT (dans 1 s, puis dans"},{"t":"-","l":"     0,4 s) avant celui qu'on quitte : dans un S, l'interieur du premier est l'exterieur du second */"},{"t":"+","l":"  /* LA PLACE DANS LE VIRAGE : du cote interieur du virage QUI VIENT */","n":108},{"t":" ","l":"  const lIci=v.lacetRoute||0,lTot=lacetDans(v,.4,vit),lTard=lacetDans(v,1,vit);","n":109},{"t":" ","l":"  let lFort=lTard;","n":110},{"t":"~","l":"…"},{"t":" ","l":"  /* une flaque sur la ligne : passer a cote, du cote ou il y a le plus de place */","n":115},{"t":" ","l":"  const F=Array.isArray(v.flaques)?v.flaques:[];","n":116},{"t":"-","l":"  for(const f of F){if(f.d\u003c5||f.d>160)continue;if(Math.abs(f.lat-cible)\u003cf.rayon+4)cible=f.lat+(f.lat>0?-1:1)*(f.rayon+6);}"},{"t":"+","l":"  for(const f of F){if(!f||f.d\u003c5||f.d>160)continue;if(Math.abs(f.lat-cible)\u003cf.rayon+4)cible=f.lat+(f.lat>0?-1:1)*(f.rayon+6);}","n":117},{"t":" ","l":"  /* LA ROUTE NE SE TIENT PLUS (le bord dans moins de 3 s) : vers le cote oppose au bord annonce */","n":118},{"t":" ","l":"  const lache=!!(tn&&tn.tient===false);","n":119},{"t":"~","l":"…"},{"t":" ","l":"  const pas=(lache?R.glisseUrgence:R.glisse)*vit*.1;","n":125},{"t":" ","l":"  m.ligne=cl(m.ligne+cl(cible-m.ligne,-pas,pas),-max,max);","n":126},{"t":"-","l":"  /* LE CAP D'AVANCE : la main vise le cap (ligne − lat) / (0,9 × vitesse). On lui donne ce cap PLUS l'avance sur le virage qui arrive :"},{"t":"-","l":"     la caisse tourne deja vers lui quand il commence, au lieu de le decouvrir 0,15 s apres. */"},{"t":"+","l":"  /* LE CAP D'AVANCE sur le virage qui arrive */","n":127},{"t":" ","l":"  let capVoulu=cl((m.ligne-v.lat)/(.9*vit),-R.capLigne,R.capLigne)+cl((lTot-lIci)*R.avanceCap,-R.capAvance,R.capAvance);","n":128},{"t":" ","l":"  if(v.lat>max)capVoulu=Math.min(capVoulu,-.05);else if(v.lat\u003c-max)capVoulu=Math.max(capVoulu,.05);   /* jamais vers le bord quand on y est */","n":129},{"t":" ","l":"  const ligne=v.lat+.9*vit*cl(capVoulu,-.4,.4);","n":130},{"t":"-","l":"  /* LA NITRO : partout ou elle ne met pas la caisse dehors. Jamais de travers, en glisse, en rebond, quand la route lache, ni dans un virage"},{"t":"-","l":"     qui demande du volant ; sur les maps a decor, encore moins. */"},{"t":"+","l":"  /* LA NITRO : partout ou elle ne met pas la caisse dehors — et un peu plus loin quand la ligne parfaite la rembourse.","n":131},{"t":"+","l":"     Jamais de travers, en glisse, en rebond, quand la route lache ; les maps a decor gardent leur prudence (k). */","n":132},{"t":" ","l":"  const pose=Math.abs(v.lat)\u003cv.demi-6&&Math.abs(v.cap)\u003cR.capMax&&!v.glisse&&!v.rebond;","n":133},{"t":" ","l":"  const jauge=(v.nitro||0)+(v.reserve||0);","n":134},{"t":" ","l":"  if(jauge>R.jaugeAllume)m.plein=true;else if(jauge\u003cR.jaugeCoupe)m.plein=false;","n":135},{"t":"+","l":"  const paye=ligneRembourse(v,m,vit);","n":136},{"t":" ","l":"  const proche=!!(vg&&vg.d\u003cvit*3),margeV=proche?vg.marge/vit:9;","n":137},{"t":"-","l":"  const k=decor?R.nitroDecor:1,seuil=(m.nitro?R.braqueNitro:R.braqueNitro-.1)*k;"},{"t":"-","l":"  const sur=margeV>(m.nitro?R.margeTenir:R.margeAllumer)&&Math.max(force,Math.abs(lIci)/lmax)\u003cseuil;"},{"t":"+","l":"  const k=(decor?R.nitroDecor:1)*(paye?R.braqueDon:1);","n":138},{"t":"+","l":"  const seuil=(m.nitro?R.braqueNitro:R.braqueNitro-.1)*k;","n":139},{"t":"+","l":"  const margeMin=m.nitro?R.margeTenir:(paye?R.margeDon:R.margeAllumer);","n":140},{"t":"+","l":"  const sur=margeV>margeMin&&Math.max(force,Math.abs(lIci)/lmax)\u003cseuil;","n":141},{"t":" ","l":"  m.nitro=!lache&&pose&&sur&&(v.nitroLibre||!!m.plein);","n":142},{"t":" ","l":"  m.facon=null;","n":143},{"t":"~","l":"…"},{"t":" ","l":"};","n":168},{"t":" ","l":"const LONGS={rien:1,plane:1,versRoute:1,versRoutePlane:1};   /* les rayons joues jusqu'au bout de l'air : « libre » y veut dire jauge vide */","n":169},{"t":"-","l":"/* ce que vaut l'issue d'un rayon : 100 = une pose droite tout de suite ; sous 35 = on y reste."},{"t":"-","l":"   Une pose vaut par son AXE et par l'endroit ou la caisse sera 0,3 s apres (elle glisse dans son axe avant que le volant morde). MESURE (tour 2,"},{"t":"-","l":"   29 decollages d'une course) : la moitie etaient des sorties EN CHAINE — revenue en travers (axe 0,5 a 1 rad : « propre » pour le jeu, qui"},{"t":"-","l":"   tolere 55°), la caisse se posait et ressortait par l'autre bord dans la seconde. */"},{"t":"+","l":"/* ce que vaut l'issue d'un rayon : 100 = une pose droite tout de suite ; sous 35 = on y reste. */","n":170},{"t":" ","l":"function vaut(r,long,v){","n":171},{"t":" ","l":"  if(!r)return -1;","n":172},{"t":"~","l":"…"},{"t":" ","l":"}","n":183},{"t":" ","l":"const sauve=r=>!!r&&(r.issue==='pose'||r.issue==='levre'||r.issue==='portail');","n":184},{"t":"-","l":"/* LE VOL. Une facon de piloter est TENUE : la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad par seconde — changer de facon a chaque"},{"t":"-","l":"   vue, c'est zigzaguer d'un cote a l'autre de la route jusqu'a la jauge vide (MESURE, tour 3 : deux morts « air » sur quatre courses, la caisse"},{"t":"-","l":"   passee quatre fois au-dessus de la dalle sans s'y on vise : l'objet de la ligne parfaite s'il est proche et a portee, sinon la premiere tranche de pieces a portee, sinon un pouvoir */"},{"t":"+","l":"/* CE QU'ON VISE : LE FIL DES PIECES d'abord, il fait le palier. Un fruit ou une plaque ne donne aucune piece : on ne les prend qu'en passant","n":62},{"t":"+","l":"   (a portee de prise de la ligne des pieces), ou quand la jauge est basse. Un pouvoir : seulement l'aimant (il elargit ce qu'on ramasse). */","n":63},{"t":" ","l":"function aRamasser(v,max){","n":64},{"t":" ","l":"  const R=REGLAGES,dmin=Math.max(15,v.vitesse*R.avance);","n":65},{"t":" ","l":"  const prend=(d,lat)=>d>=dmin&&Math.abs(lat)\u003c=max&&Math.abs(lat-v.lat)\u003cMath.max(3,(d-v.vitesse*.25)*R.glisse*.85);","n":66},{"t":" ","l":"  const L=v.ligne&&Array.isArray(v.ligne.objets)?v.ligne.objets:[];","n":67},{"t":"-","l":"  const obj=L.find(o=>o.d\u003cR.ligneLoin&&prend(o.d,o.lat));"},{"t":"+","l":"  const obj=L.find(o=>o&&o.d\u003cR.ligneLoin&&prend(o.d,o.lat));","n":68},{"t":" ","l":"  const P=Array.isArray(v.piecesDevant)?v.piecesDevant:[];","n":69},{"t":"-","l":"  const file=P.find(p=>p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));"},{"t":"+","l":"  const file=P.find(p=>p&&p.n>0&&p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));","n":70},{"t":" ","l":"  const O=Array.isArray(v.orbes)?v.orbes:[];","n":71},{"t":"-","l":"  const orbe=O.find(o=>o.d\u003c220&&prend(o.d,cote(o)));"},{"t":"-","l":"  /* l'objet de la ligne d'abord quand il est le plus proche ou qu'il arrive dans 1,2 s ; les pieces sinon (elles font le palier) */"},{"t":"-","l":"  if(obj&&(!file||obj.d\u003c=file.d+10||obj.d\u003cv.vitesse*1.2))return obj.lat;"},{"t":"-","l":"  if(orbe&&(!file||orbe.d\u003c=file.d+10))return cote(orbe);"},{"t":"-","l":"  if(file)return cote(file);"},{"t":"+","l":"  const pw=v.pouvoirs||{};","n":72},{"t":"+","l":"  const aimantAcquis=!!(v.aimant&&v.aimant.moteur)||(+pw.aimant||0)>1;","n":73},{"t":"+","l":"  const orbe=O.find(o=>o&&o.d\u003c220&&prend(o.d,cote(o)));","n":74},{"t":"+","l":"  const orbeAimant=aimantAcquis?null:O.find(o=>o&&o.pouvoir==='aimant'&&o.d\u003c220&&prend(o.d,cote(o)));","n":75},{"t":"+","l":"  const jauge=(v.nitro||0)+(v.reserve||0);","n":76},{"t":"+","l":"  /* la jauge basse : comme avant, la ligne parfaite d'abord quand elle est proche (le fond de nitro fait planer la caisse au retour) */","n":77},{"t":"+","l":"  if(jauge\u003cR.jaugeFruit&&!v.nitroLibre){","n":78},{"t":"+","l":"    if(obj&&(!file||obj.d\u003c=file.d+10||obj.d\u003cv.vitesse*1.2))return obj.lat;","n":79},{"t":"+","l":"  }","n":80},{"t":"+","l":"  if(file){","n":81},{"t":"+","l":"    const lc=cote(file);","n":82},{"t":"+","l":"    /* l'aimant vaut un detour : il ramasse ensuite plus large */","n":83},{"t":"+","l":"    if(orbeAimant&&orbeAimant.d\u003c=file.d+10)return cote(orbeAimant);","n":84},{"t":"+","l":"    /* un objet de la ligne sur le chemin du fil : il se prend en passant, sans quitter les pieces */","n":85},{"t":"+","l":"    const prises=v.ligne&&v.ligne.prises;","n":86},{"t":"+","l":"    if(obj&&obj.d\u003c=file.d+25){","n":87},{"t":"+","l":"      const pr=prises?(obj.type==='plaque'?+prises.plaque||5.6:+prises.fruit||4.5):(obj.type==='plaque'?5.6:4.5);","n":88},{"t":"+","l":"      if(Math.abs(obj.lat-lc)\u003cpr*.8)return (obj.lat+lc)/2;}","n":89},{"t":"+","l":"    return lc;","n":90},{"t":"+","l":"  }","n":91},{"t":" ","l":"  if(obj)return obj.lat;","n":92},{"t":"+","l":"  if(orbe)return cote(orbe);","n":93},{"t":" ","l":"  return null;","n":94},{"t":" ","l":"}","n":95},{"t":"~","l":"…"},{"t":" ","l":"  /* une flaque sur la ligne : passer a cote, du cote ou il y a le plus de place */","n":124},{"t":" ","l":"  const F=Array.isArray(v.flaques)?v.flaques:[];","n":125},{"t":"-","l":"  for(const f of F){if(f.d\u003c5||f.d>160)continue;if(Math.abs(f.lat-cible)\u003cf.rayon+4)cible=f.lat+(f.lat>0?-1:1)*(f.rayon+6);}"},{"t":"+","l":"  for(const f of F){if(!f||f.d\u003c5||f.d>160)continue;if(Math.abs(f.lat-cible)\u003cf.rayon+4)ci 68.2,"vide",6636,1,6,0,"grotte > jade"],[910185,296.5,"roche",52186,12,17.2,1,"grotte > nuages > jade > espace > grotte"]],"validation":null,"champion":false,"ecart":[{"t":"-","l":"/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») ====="},{"t":"+","l":"/* ===== LE PILOTE DE L'ECURIE, variante « la pose droite » (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») =====","n":1},{"t":" ","l":"   SA STRATEGIE, EN CLAIR.","n":2},{"t":" ","l":"   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","n":3},{"t":"~","l":"…"},{"t":" ","l":"   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur.","n":6},{"t":" ","l":"   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR.","n":7},{"t":"-","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,"},{"t":"-","l":"      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas."},{"t":"-","l":"   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se"},{"t":"-","l":"      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne"},{"t":"-","l":"      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence."},{"t":"-","l":"   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et"},{"t":"-","l":"      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :"},{"t":"-","l":"      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir."},{"t":"-","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la"},{"t":"-","l":"      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :"},{"t":"-","l":"      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon"},{"t":"-","l":"      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard."},{"t":"+","l":"   1. AU SOL, LA LIGNE. (inchange) La ligne parfaite, puis les pieces, puis les pouvoirs ; la ligne glisse vers sa cible.","n":8},{"t":"+","l":"   2. LE VIRAGE D'APRES. (inchange) Le cote interieur du virage qui vient, et un cap d'avance sur le changement de sens.","n":9},{"t":"+","l":"   3. LA NITRO LA OU ELLE SERT. (inchange)","n":10},{"t":"+","l":"   4. EN VOL, LE RADAR — CE QUI CHANGE DANS CETTE VARIANTE : SE POSER DROIT, SUR UNE PROMESSE SURE.","n":11},{"t":"+","l":"      MESURE (autopsies du parent) : 910111 (canyon) se pose avec un axe de 0,74 rad, ressort par l'autre bord, paroi. 910592 (nuages, tete en","n":12},{"t":"+","l":"      bas) suit la loi « vers la route » qui promet une pose a 1,4 s, puis 1,3… pendant 1,1 s de vol l'echeance recule de 0,5 s, la pose n'arrive","n":13},{"t":"+","l":"      jamais ; pendant ce temps `pique` annoncait une pose a 0,7 s. README § 2 ter : avec une main a profil, seuls les ordres PLEINS tenus plus","n":14},{"t":"+","l":"      longtemps qu'une reaction sont prevus au plus juste ; la loi, redecidee a chaque vue, est une estimation.","n":15},{"t":"+","l":"      Donc :","n":16},{"t":"+","l":"      · une pose se juge d'abord sur son AXE (poids 45 par radian, au lieu de 20) et sur l'endroit ou la caisse glisse avant que le volant","n":17},{"t":"+","l":"        morde ; une pose au centre gagne un peu ;","n":18},{"t":"+","l":"      · les promesses des lois « vers la route » sont rabattues (et beaucoup plus tete en bas) : a pose egale, une facon constante d'abord ;","n":19},{"t":"+","l":"      · une promesse qui RECULE (l'heure de pose annoncee repousse de plus de 0,15 s) ne compte plus comme sauve : on en change ;","n":20},{"t":"+","l":"      · une facon qui sauve peut etre quittee pour une pose nettement plus droite (20 points de mieux).","n":21},{"t":" ","l":"      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose.","n":22},{"t":" ","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein.","n":23},{"t":"-","l":"   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :"},{"t":"-","l":"   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en"},{"t":"-","l":"   travers) ; freiner ; voler expres comme un joueur ; poser des figures."},{"t":" ","l":"   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */","n":24},{"t":" ","l":"const PROFIL={","n":25},{"t":"~","l":"…"},{"t":" ","l":"  jaugeCoupe:.25,    /* …et en dessous de laquelle elle se coupe (le fond garde pour planer en vol) */","n":48},{"t":" ","l":"  capMax:.22,        /* rad : au-dela, la caisse est de travers, pas de nitro */","n":49},{"t":"-","l":"  bascule:10,        /* points qu'un rayon doit avoir de plus que la facon tenue pour qu'on en change */"},{"t":"+","l":"  bascule:10,        /* points qu'un rayon doit avoir de plus que la
