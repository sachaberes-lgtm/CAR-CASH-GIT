s, puis dans"},{"t":"-","l":"     0,4 s) avant celui qu'on quitte : dans un S, l'interieur du premier est l'exterieur du second */"},{"t":"+","l":"  /* LA PLACE DANS LE VIRAGE : du virage qui vient (dans 1 s, puis dans 0,4 s) avant celui qu'on quitte */","n":110},{"t":" ","l":"  const lIci=v.lacetRoute||0,lTot=lacetDans(v,.4,vit),lTard=lacetDans(v,1,vit);","n":111},{"t":" ","l":"  let lFort=lTard;","n":112},{"t":"~","l":"…"},{"t":" ","l":"  const F=Array.isArray(v.flaques)?v.flaques:[];","n":118},{"t":" ","l":"  for(const f of F){if(f.d\u003c5||f.d>160)continue;if(Math.abs(f.lat-cible)\u003cf.rayon+4)cible=f.lat+(f.lat>0?-1:1)*(f.rayon+6);}","n":119},{"t":"-","l":"  /* LA ROUTE NE SE TIENT PLUS (le bord dans moins de 3 s) : vers le cote oppose au bord annonce */"},{"t":"+","l":"  /* LA ROUTE NE SE TIENT PLUS (le bord dans moins de 3 s). Variante : si le radar promet une pose propre et centree par ce bord,","n":120},{"t":"+","l":"     on se laisse partir de ce cote (sortie choisie) ; sinon, vers le cote oppose au bord annonce, comme avant. */","n":121},{"t":" ","l":"  const lache=!!(tn&&tn.tient===false);","n":122},{"t":"-","l":"  if(lache)cible=-tn.cote*max*.5;"},{"t":"+","l":"  const sortie=lache&&!decor&&!couloir?sortieSure(v):null;","n":123},{"t":"+","l":"  if(lache)cible=sortie!=null?sortie*max:-tn.cote*max*.5;","n":124},{"t":" ","l":"  cible=cl(cible,-max,max);","n":125},{"t":" ","l":"  /* LA LIGNE GLISSE VERS SA CIBLE, elle n'y saute pas. Apres un vol, elle repart d'ou la caisse est. */","n":126},{"t":"~","l":"…"},{"t":" ","l":"  const pas=(lache?R.glisseUrgence:R.glisse)*vit*.1;","n":129},{"t":" ","l":"  m.ligne=cl(m.ligne+cl(cible-m.ligne,-pas,pas),-max,max);","n":130},{"t":"-","l":"  /* LE CAP D'AVANCE : la main vise le cap (ligne − lat) / (0,9 × vitesse). On lui donne ce cap PLUS l'avance sur le virage qui arrive :"},{"t":"-","l":"     la caisse tourne deja vers lui quand il commence, au lieu de le decouvrir 0,15 s apres. */"},{"t":"+","l":"  /* LE CAP D'AVANCE : la main vise le cap (ligne − lat) / (0,9 × vitesse), plus l'avance sur le virage qui arrive */","n":131},{"t":" ","l":"  let capVoulu=cl((m.ligne-v.lat)/(.9*vit),-R.capLigne,R.capLigne)+cl((lTot-lIci)*R.avanceCap,-R.capAvance,R.capAvance);","n":132},{"t":"-","l":"  if(v.lat>max)capVoulu=Math.min(capVoulu,-.05);else if(v.lat\u003c-max)capVoulu=Math.max(capVoulu,.05);   /* jamais vers le bord quand on y est */"},{"t":"+","l":"  /* jamais vers le bord quand on y est — sauf quand on a choisi de partir par ce bord */","n":133},{"t":"+","l":"  if(sortie==null){","n":134},{"t":"+","l":"    if(v.lat>max)capVoulu=Math.min(capVoulu,-.05);else if(v.lat\u003c-max)capVoulu=Math.max(capVoulu,.05);","n":135},{"t":"+","l":"  }","n":136},{"t":" ","l":"  const ligne=v.lat+.9*vit*cl(capVoulu,-.4,.4);","n":137},{"t":"-","l":"  /* LA NITRO : partout ou elle ne met pas la caisse dehors. Jamais de travers, en glisse, en rebond, quand la route lache, ni dans un virage"},{"t":"-","l":"     qui demande du volant ; sur les maps a decor, encore moins. */"},{"t":"+","l":"  /* LA NITRO : partout ou elle ne met pas la caisse dehors. */","n":138},{"t":" ","l":"  const pose=Math.abs(v.lat)\u003cv.demi-6&&Math.abs(v.cap)\u003cR.capMax&&!v.glisse&&!v.rebond;","n":139},{"t":" ","l":"  const jauge=(v.nitro||0)+(v.reserve||0);","n":140},{"t":"~","l":"…"},{"t":" ","l":"const LONGS={rien:1,plane:1,versRoute:1,versRoutePlane:1};   /* les rayons joues jusqu'au bout de l'air : « libre » y veut dire jauge vide */","n":172},{"t":" ","l":"/* ce que vaut l'issue d'un rayon : 100 = une pose droite tout de suite ; sous 35 = on y reste.","n":173},{"t":"-","l":"   Une pose vaut par son AXE et par l'endroit ou la caisse sera 0,3 s apres (elle glisse dans son axe avant que le volant morde). MESURE (tour 2,"},{"t":"-","l":"   29 decollages d'une course) : la moitie etaient des sorties EN CHAINE — revenue en travers (axe 0,5 a 1 rad : « propre » pour le jeu, qui"},{"t":"-","l":"   tolere 55°), la caisse se posait et ressortait par l'autre bord dans la seconde. */"},{"t":"+","l":"   Une pose vaut par son AXE et par l'endroit ou la caisse sera 0,3 s apres. Variante : une pose qui tombe au CENTRE (flag `centre` du radar)","n":174},{"t":"+","l":"   gagne des points : a axe egal, mieux vaut se poser au milieu de la dalle qu'au bord. */","n":175},{"t":" ","l":"function vaut(r,long,v){","n":176},{"t":" ","l":"  if(!r)return -1;","n":177},{"t":"~","l":"…"},{"t":" ","l":"  if(r.issue==='pose'){","n":179},{"t":" ","l":"    const axe=+r.axe||0,glisse=(+r.lat||0)+v.vitesse*Math.sin(cl(axe,-1.5,1.5))*REGLAGES.derive;","n":180},{"t":"-","l":"    return 100-20*Math.abs(axe)-3*t-Math.min(20,Math.max(0,Math.abs(glisse)-(v.demi-4)))-(r.propre===false?20:0);}"},{"t":"+","l":"    return 100-20*Math.abs(axe)-3*t-Math.min(20,Math.max(0,Math.abs(glisse)-(v.demi-4)))-(r.propre===false?20:0)+(r.centre?REGLAGES.centreBonus:0);}","n":181},{"t":" ","l":"  if(r.issue==='portail')return 94;","n":182},{"t":" ","l":"  if(r.issue==='levre')return 80-3*t;","n":183},{"t":"~","l":"…"},{"t":" ","l":"}","n":188},{"t":" ","l":"const sauve=r=>!!r&&(r.issue==='pose'||r.issue==='levre'||r.issue==='portail');","n":189},{"t":"-","l":"/* LE VOL. Une facon de piloter est TENUE : la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad par seconde — changer de facon a chaque"},{"t":"-","l":"   vue, c'est zigzaguer d'un cote a l'autre de la route jusqu'a la jauge vide (MESURE, tour 3 : deux morts « air » sur quatre courses, la caisse"},{"t":"-","l":"   passee quatre fois au-dessus de la dalle sans s'y poser). Donc :"},{"t":"-","l":"   · au decollage, la loi « vers la route » (la seule mesuree : 9 retours sur 10 apres une sortie par le bord) ;"},{"t":"+","l":"/* LE VOL. Une facon de piloter est TENUE (changer a chaque vue : zigzag jusqu'a la jauge vide).","n":190},{"t":"+","l":"   · au decollage, la loi « vers la route » ;","n":191},{"t":" ","l":"   · tant que le radar dit que la facon tenue mene a une pose (ou a la levre, au portail), on n'en change pas ;","n":192},{"t":" ","l":"   · sinon, et pas plus souvent que toutes les 0,35 s (sauf mort annoncee dans la seconde), on prend la facon du rayon qui vaut le plus. */","n":193},{"t":"~","l":"…"},{"t":" ","l":"  if(Y){","n":197},{"t":" ","l":"    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=m.facon.indexOf('versRoute')===0;","n":198},{"t":"-","l":"    /* ce que dit le radar de la facon tenue : son propre rayon, et une fois les doigts dessus depuis une reaction, le rayon `tenu` (MESURE : juste"},{"t":"-","l":"       49 fois sur 50) — sauf pour les lois « vers la route », dont l'ordre change a chaque vue : `tenu` n'y dit que la vue du moment */"},{"t":"+","l":"    /* ce que dit le radar de la facon tenue : son propre rayon, et une fois les doigts dessus depuis une reaction, le rayon `tenu` —","n":199},{"t":"+","l":"       sauf pour les lois « vers la route », dont l'ordre change a chaque vue */","n":200},{"t":" ","l":"    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon),sMien=vaut(mien,true,v);","n":201},{"t":" ","l":"    if(!sauve(mien)&&(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))){","n":202},{"t":"~","l":"…"},{"t":" ","l":"","n":215},{"t":" ","l":"module.exports={","n":216},{"t":"-","l":"  nom:'pilote',"},{"t":"+","l":"  nom:'pilote-sortie',","n":217},{"t":" ","l":"  profil:PROFIL,","n":218},{"t":" ","l":"  REGLAGES:REGLAGES,","n":219},{"t":" ","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","n":220},{"t":" ","l":"};","n":221},{"t":"-","l":""}],"source":null,"rejeux":[]},{"id":"c0010","nom":"pilote","date":"2026-11-25T15:35:59.810Z","etape":"K-sonnet","generation":0,"parents":[],"modele":"main","raison":"Le pilote de depart de l'etape K-sonnet, tel qu'il a ete donne a la boucle (--depuis).","code":"cerveaux/c0010-pilote.js","octets":15924,"jumeau":"c0003","jeu":"cashcar-v1627","commit":"e4942eb0a","tmax":900,"note":{"survie_mediane_s":215.3,"argent_min":10368.1,"pieces_min":309.1,"figures_min":1.94,"air_pct":15.9,"vols_min":4.76,"vol_moyen_s":2,"raccourcis_min":0.31,"distance_m_min":7224,"nitro_pct":27.9},"parties":20,"fins":{"paroi":5,"tour":3,"roche":3,"vide":4,"pic":2,"air":3},"cout":null,"courses":[[910000,230.1,"paroi",23713,8,9.4,1,"espace > nuages > jade > canyon"],[910037,324.3,"tour",125616,15,22.5,2,"grotte > jade > espace > nuages > ville"],[910074,235.4,"tour",12884,10,17.5,0,"nuages > jade > espace > ville"],[910111,44,"paroi",2920,1,4.2,0,"canyon"],[910148,327.7,"roche",33494,15,22.3,6,"grotte > jade > espace > nuages > grotte"],[910185,172.6,"vide",13795,5,9.4,1,"grotte > nuages > jade"],[910222,161.9,"paroi",9507,1,2.7,0,"nuages > canyon"],[910259,244.6,"vide",24328,6,9.5,0,"espace > grotte > nuages > ville"],[910296,243.8,"roche",30162,10,19.9,0,"nuages > jade > espace > grotte"],[910333,166.4,"roche",11420,4,13.1,0,"jade > grotte"],[910370,235.8,"paroi",37137,6,13,0,"ville > nuages > jade > canyon"],[910407,340.3,"vide",237419,14,24.2,2,"jade > ville > grotte > nuages > jade"],[910444,197.4,"paroi",16474,6,11.6,1,"espace > ville > canyon"],[910481,200.6,"pic",15112,3,8.8,0,"ville > grotte > jade"],[910518,256.6,"tour",55342,6,11.2,1,"grotte > nuages > jade > ville"],[910555,372.1,"vide",63475,19,27.1,3,"espace > ville > grotte > nuages > espace"],[910592,144,"air",4767,4,15,1,"grotte > nuages"],[910629,159.6,"air",7272,3,20.8,3,"espace > nuages > ville"],[910666,37.2,"pic",1902,0,2.6,0,"jade"],[910703,149.3,"air",6583,1,5.9,1,"grotte > nuages > jade"]],"validation":{"note":{"survie_mediane_s":214.1,"argent_min":7867.7,"pieces_min":305.6,"figures_min":1.89,"air_pct":16.1,"vols_min":4.88,"vol_moyen_s":1.98,"raccourcis_min":0.26,"distance_m_min":7151,"nitro_pct":29},"depart":950000,"parties":20},"champion":true,"ecart":null,"source":["/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») =====","   SA STRATEGIE, EN CLAIR.","   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main","   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le","   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur.","   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR.","   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,","      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas.","   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se","      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne","      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence.","   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et","      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :","      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir.","   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la","      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :","      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon","      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard.","      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose.","   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein.","   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :","   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en","   travers) ; freiner ; voler expres comme un joueur ; poser des figures.","   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */","const PROFIL={","  modele:'clavier',graine:1,                 /* la main mesuree sur les joueurs au clavier (doigts.js, MAIN_CLAVIER), sans rien y ecrire par-dessus */","  chance:{prend:1,palierMin:12}              /* la seconde chance : dans les longues parties seulement (les joueurs : aux paliers 14 et 28) */","};","const REGLAGES={","  marge:10,          /* m gardes entre la ligne visee et le bord (la reference : 9, avec une main de machine) */","  bandeDecor:99,     /* m : sur une map a decor, la ligne visee ne s'ecarte pas plus de l'axe (99 = pas de limite) */","  nitroDecor:.62,    /* sur une map a decor, les seuils de virage de la nitro sont multiplies par ca (0 = jamais de nitro) */","  margeCouloir:15,   /* m gardes dans un couloir : le bord y est un mur */","  avance:.3,         /* s : on ne vise rien de plus proche (la reaction du volant : 0,2 s) */","  glisse:.12,        /* rad : la ligne visee ne se deplace pas plus vite que ce cap-la (a 115 m/s : 14 m de cote par seconde) */","  glisseUrgence:.3,  /* le meme quand la route lache : la, on ne menage plus rien */","  ligneLoin:320,     /* m : un objet de la ligne parfaite se vise jusque-la */","  piecesLoin:180,    /* m : une tranche de pieces se vise jusque-la */","  capLigne:.3,       /* rad : le cap le plus fort demande pour rejoindre la ligne */","  avanceCap:.25,     /* s : le cap prend cette avance sur le changement de lacet de la route (celui de dans 0,4 s moins celui d'ici) */","  capAvance:.25,     /* rad : l'avance ne depasse pas ca */","  braqueDoux:.15,    /* part de volant que demande un virage : en dessous, toute la largeur est permise */","  braqueFort:.5,     /* au-dessus, on se tient au moins a mi-largeur du cote INTERIEUR */","  braqueNitro:.4,    /* au-dessus, pas de nitro (.3 pour l'allumer) ; sur les maps a decor (une sortie y tue) : .25 et .18 */","  margeAllumer:.3,   /* part de ma vitesse : vSure doit la depasser d'autant pour ALLUMER la nitro… */","  margeTenir:.1,     /* …et d'autant pour la GARDER */","  jaugeAllume:.45,   /* jauge + reserve au-dessus de laquelle la nitro s'allume… */","  jaugeCoupe:.25,    /* …et en dessous de laquelle elle se coupe (le fond garde pour planer en vol) */","  capMax:.22,        /* rad : au-dela, la caisse est de travers, pas de nitro */","  bascule:10,        /* points qu'un rayon doit avoir de plus que la facon tenue pour qu'on en change */","  tenirFacon:.35,    /* s au moins sur une facon avant d'en changer (sauf si elle mene a la mort) */","  derive:.3          /* s : apres la pose, la caisse glisse dans son axe ce temps-la avant que le volant morde */","};","const cl=(v,a,b)=>v\u003ca?a:v>b?b:v;","const cote=o=>o.latC!=null?o.latC:o.lat;     /* sous la dalle, le lat des pieces, fruits et orbes est en miroir : latC */","","/* ---------- AU SOL ---------- */","/* ce qu'on vise : l'objet de la ligne parfaite s'il est proche et a portee, sinon la premiere tranche de pieces a portee, sinon un pouvoir */","function aRamasser(v,max){","  const R=REGLAGES,dmin=Math.max(15,v.vitesse*R.avance);","  const prend=(d,lat)=>d>=dmin&&Math.abs(lat)\u003c=max&&Math.abs(lat-v.lat)\u003cMath.max(3,(d-v.vitesse*.25)*R.glisse*.85);","  const L=v.ligne&&Array.isArray(v.ligne.objets)?v.ligne.objets:[];","  const obj=L.find(o=>o.d\u003cR.ligneLoin&&prend(o.d,o.lat));","  const P=Array.isArray(v.piecesDevant)?v.piecesDevant:[];","  const file=P.find(p=>p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));","  const O=Array.isArray(v.orbes)?v.orbes:[];","  const orbe=O.find(o=>o.d\u003c220&&prend(o.d,cote(o)));","  /* l'objet de la ligne d'abord quand il est le plus proche ou qu'il arrive dans 1,2 s ; les pieces sinon (elles font le palier) */","  if(obj&&(!file||obj.d\u003c=file.d+10||obj.d\u003cv.vitesse*1.2))return obj.lat;","  if(orbe&&(!file||orbe.d\u003c=file.d+10))return cote(orbe);","  if(file)return cote(file);","  if(obj)return obj.lat;","  return null;","}","/* DE COMBIEN LA ROUTE AURA TOURNE a d metres devant (rad, + a gauche) : vue.route le donne a 30, 60, 100, 150, 220… m ; entre deux, en ligne droite */","function tourne(v,d){","  const rt=Array.isArray(v.route)?v.route:[];","  let d0=0,a0=0;","  for(const p of rt){if(!p)continue;if(d\u003c=p.d)return a0+(p.virage-a0)*(d-d0)/Math.max(1,p.d-d0);d0=p.d;a0=p.virage;}","  return a0;","}","/* LE LACET DE LA ROUTE DANS t SECONDES (rad/s) : ce que la main devra suivre a ce moment-la. La loi `ligne` de la main ne connait que le lacet","   sous les roues, percu 0,15 s plus tard : dans un S, elle braque encore a droite quand la route est deja repartie a gauche (MESURE, tour 3,","   canyon : cap −0,6 rad en 0,4 s au changement de sens, la paroi 0,5 s apres). C'est au pilote de voir le virage d'apres. */","function lacetDans(v,t,vit){return (tourne(v,vit*(t+.15))-tourne(v,vit*Math.max(0,t-.15)))/(t\u003c.15?t+.15:.3);}","const DECOR={canyon:1,grotte:1,jade:1,ville:1};   /* les maps ou une sortie par le bord finit contre le decor */","function auSol(v,m){","  const R=REGLAGES,vg=v.virage,tn=v.tenue,vit=Math.max(6,v.vitesse),lmax=Math.max(.05,v.lacetMax||1);","  const couloir=(v.mur&&v.mur.ici)||(Array.isArray(v.couloirs)&&v.couloirs.some(c=>c.d0\u003cvit*2&&c.d1>0));","  const decor=!!DECOR[v.carte],max=Math.min(decor?R.bandeDecor:99,v.demi-(couloir?R.margeCouloir:R.marge));","  /* ce qui se ramasse a portee, sinon le milieu */","  let cible=0;","  const but=aRamasser(v,max);","  if(but!=null)cible=but;","  /* LA PLACE DANS LE VIRAGE : plus il demande de volant, plus la ligne reste du cote interieur — du virage QUI VIENT (dans 1 s, puis dans","     0,4 s) avant celui qu'on quitte : dans un S, l'interieur du premier est l'exterieur du second */","  const lIci=v.lacetRoute||0,lTot=lacetDans(v,.4,vit),lTard=lacetDans(v,1,vit);","  let lFort=lTard;","  if(Math.abs(lTot)>Math.abs(lFort))lFort=lTot;","  if(Math.abs(lIci)*.6>Math.abs(lFort))lFort=lIci;","  const force=Math.abs(lFort)/lmax,sens=lFort>0?1:-1,u=cl((force-R.braqueDoux)/(R.braqueFort-R.braqueDoux),0,1);","  if(u>0){const plancher=max*(-1+1.5*u);if(cible*sens\u003cplancher)cible=sens*plancher;}","  /* une flaque sur la ligne : passer a cote, du cote ou il y a le plus de place */","  const F=Array.isArray(v.flaques)?v.flaques:[];","  for(const f of F){if(f.d\u003c5||f.d>160)continue;if(Math.abs(f.lat-cible)\u003cf.rayon+4)cible=f.lat+(f.lat>0?-1:1)*(f.rayon+6);}","  /* LA ROUTE NE SE TIENT PLUS (le bord dans moins de 3 s) : vers le cote oppose au bord annonce */","  const lache=!!(tn&&tn.tient===false);","  if(lache)cible=-tn.cote*max*.5;","  cible=cl(cible,-max,max);","  /* LA LIGNE GLISSE VERS SA CIBLE, elle n'y saute pas. Apres un vol, elle repart d'ou la caisse est. */","  if(m.ligne==null||m.tSol==null||v.t-m.tSol>.25)m.ligne=cl(v.lat,-max,max);","  m.tSol=v.t;","  const pas=(lache?R.glisseUrgence:R.glisse)*vit*.1;","  m.ligne=cl(m.ligne+cl(cible-m.ligne,-pas,pas),-max,max);","  /* LE CAP D'AVANCE : la main vise le cap (ligne − lat) / (0,9 × vitesse). On lui donne ce cap PLUS l'avance sur le virage qui arrive :","     la caisse tourne deja vers lui quand il commence, au lieu de le decouvrir 0,15 s apres. */","  let capVoulu=cl((m.ligne-v.lat)/(.9*vit),-R.capLigne,R.capLigne)+cl((lTot-lIci)*R.avanceCap,-R.capAvance,R.capAvance);","  if(v.lat>max)capVoulu=Math.min(capVoulu,-.05);else if(v.lat\u003c-max)capVoulu=Math.max(capVoulu,.05);   /* jamais vers le bord quand on y est */","  const ligne=v.lat+.9*vit*cl(capVoulu,-.4,.4);","  /* LA NITRO : partout ou elle ne met pas la caisse dehors. Jamais de travers, en glisse, en rebond, quand la route lache, ni dans un virage","     qui demande du volant ; sur les maps a decor, encore moins. */","  const pose=Math.abs(v.lat)\u003cv.demi-6&&Math.abs(v.cap)\u003cR.capMax&&!v.glisse&&!v.rebond;","  const jauge=(v.nitro||0)+(v.reserve||0);","  if(jauge>R.jaugeAllume)m.plein=true;else if(jauge\u003cR.jaugeCoupe)m.plein=false;","  const proche=!!(vg&&vg.d\u003cvit*3),margeV=proche?vg.marge/vit:9;","  const k=decor?R.nitroDecor:1,seuil=(m.nitro?R.braqueNitro:R.braqueNitro-.1)*k;","  const sur=margeV>(m.nitro?R.margeTenir:R.margeAllumer)&&Math.max(force,Math.abs(lIci)/lmax)\u003cseuil;","  m.nitro=!lache&&pose&&sur&&(v.nitroLibre||!!m.plein);","  m.facon=null;","  return {ligne:ligne,nitro:m.nitro};","}","","/* ---------- EN VOL ---------- */","/* LA LOI « VERS LA ROUTE » (README § 2 bis), recopiee : c'est elle que jouent les rayons versRoute et versRoutePlane du radar */","function versRoute(v,nitro){","  const f=v.vol,p=f.proche,o={volant:0,manche:0,nitro:nitro};","  if(!p)return o;","  if(Math.abs(p.axe)\u003c1.6)o.volant=cl((cl(-p.lat/40,-.6,.6)-p.axe)*1.6,-1,1)*(p.envers?-1:1);","  if(p.haut>10&&Math.abs(p.lat)\u003cv.demi*2){","    const air=f.air&&f.air.reste!=null?f.air.reste:f.reste,delai=p.haut/Math.max(1,p.versRoute);","    if(delai>2||delai>air-1)o.manche=p.envers?1:-1;}","  return o;","}","const FACONS={","  rien:()=>({volant:0,manche:0,nitro:false}),","  gauche:()=>({volant:1,manche:0,nitro:false}),","  droite:()=>({volant:-1,manche:0,nitro:false}),","  cabre:()=>({volant:0,manche:1,nitro:false}),","  pique:()=>({volant:0,manche:-1,nitro:false}),","  plane:()=>({volant:0,manche:0,nitro:true}),","  planeCabre:()=>({volant:0,manche:1,nitro:true}),","  versRoute:v=>versRoute(v,false),","  versRoutePlane:v=>versRoute(v,true)","};","const LONGS={rien:1,plane:1,versRoute:1,versRoutePlane:1};   /* les rayons joues jusqu'au bout de l'air : « libre » y veut dire jauge vide */","/* ce que vaut l'issue d'un rayon : 100 = une pose droite tout de suite ; sous 35 = on y reste.","   Une pose vaut par son AXE et par l'endroit ou la caisse sera 0,3 s apres (elle glisse dans son axe avant que le volant morde). MESURE (tour 2,","   29 decollages d'une course) : la moitie etaient des sorties EN CHAINE — revenue en travers (axe 0,5 a 1 rad : « propre » pour le jeu, qui","   tolere 55°), la caisse se posait et ressortait par l'autre bord dans la seconde. */","function vaut(r,long,v){","  if(!r)return -1;","  const t=+r.t||0;","  if(r.issue==='pose'){","    const axe=+r.axe||0,glisse=(+r.lat||0)+v.vitesse*Math.sin(cl(axe,-1.5,1.5))*REGLAGES.derive;","    return 100-20*Math.abs(axe)-3*t-Math.min(20,Math.max(0,Math.abs(glisse)-(v.demi-4)))-(r.propre===false?20:0);}","  if(r.issue==='portail')return 94;","  if(r.issue==='levre')return 80-3*t;","  if(r.issue==='libre'||r.issue==='coupe'){","    if(long)return 12+2*t;                                    /* rien avant la fin de l'air : la jauge vide suit */","    return 34-Math.min(20,(Math.abs(+r.haut||0)+Math.abs(+r.lat||0))/10);}   /* un rayon court : on ne sait pas ; mieux vaut finir pres de la route */","  return Math.min(30,5*t);                                    /* choc, air, fond : le plus tard possible */","}","const sauve=r=>!!r&&(r.issue==='pose'||r.issue==='levre'||r.issue==='portail');","/* LE VOL. Une facon de piloter est TENUE : la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad par seconde — changer de facon a chaque","   vue, c'est zigzaguer d'un cote a l'autre de la route jusqu'a la jauge vide (MESURE, tour 3 : deux morts « air » sur quatre courses, la caisse","   passee quatre fois au-dessus de la dalle sans s'y poser). Donc :","   · au decollage, la loi « vers la route » (la seule mesuree : 9 retours sur 10 apres une sortie par le bord) ;","   · tant que le radar dit que la facon tenue mene a une pose (ou a la levre, au portail), on n'en change pas ;","   · sinon, et pas plus souvent que toutes les 0,35 s (sauf mort annoncee dans la seconde), on prend la facon du rayon qui vaut le plus. */","function enVol(v,m){","  const R=REGLAGES,f=v.vol,Y=f.radar&&Array.isArray(f.radar.rayons)?f.radar.rayons:null;","  if(!m.facon){m.facon='versRoute';m.tFacon=v.t;}","  if(Y){","    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=m.facon.indexOf('versRoute')===0;","    /* ce que dit le radar de la facon tenue : son propre rayon, et une fois les doigts dessus depuis une reaction, le rayon `tenu` (MESURE : juste","       49 fois sur 50) — sauf pour les lois « vers la route », dont l'ordre change a chaque vue : `tenu` n'y dit que la vue du moment */","    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon),sMien=vaut(mien,true,v);","    if(!sauve(mien)&&(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))){","      let mieux=null,sMieux=-9;","      for(const nom in FACONS){","        if(nom===m.facon)continue;","        /* a issue egale : la loi vers la route d'abord, et sans nitro (un vol sans reacteur rend de la jauge) */","        const s=vaut(Y.find(x=>x&&x.m===nom),!!LONGS[nom],v)+(nom==='versRoute'?3:nom==='versRoutePlane'?2:nom==='rien'?1:0);","        if(s>sMieux){sMieux=s;mieux=nom;}}","      if(mieux&&sMieux>sMien+R.bascule){m.facon=mieux;m.tFacon=v.t;}}","  }","  const o=FACONS[m.facon](v);","  o.ensuite={ligne:0};   /* a la pose, la main lache la fleche du vol et reprend la route sans attendre la decision suivante */","  return o;","}","","module.exports={","  nom:'pilote',","  profil:PROFIL,","  REGLAGES:REGLAGES,","  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","};",""],"rejeux":[{"course":"c0010-g910407","graine":910407,"pourquoi":["champion : sa meilleure course"],"fin":"vide","t":340.25,"video":null},{"course":"c0010-g910518","graine":910518,"pourquoi":["le plus gros raccourci : 1678 m"],"fin":"tour","t":256.58,"video":null},{"course":"c0010-g910629","graine":910629,"pourquoi":["le plus long vol pose : 9.68 s"],"fin":"air","t":159.7,"video":null},{"course":"c0010-g910666","graine":910666,"pourquoi":["champion : sa course la plus courte","la pire course de la generation (la plus courte)"],"fin":"pic","t":37.2,"video":null}]},{"id":"c0011","nom":"pilote","date":"2026-11-25T16:14:48.744Z","etape":"K-sonnet","generation":1,"parents":["c0010"],"modele":"claude-sonnet-5-5","raison":"En vol, le pilote reste sur la loi « vers la route » tant que son rayon annonce une pose. Or la README dit qu'avec la main clavier ce rayon n'est juste qu'une fois la façon tenue : l'ordre dosé change à chaque vue et la main le suit en retard. Sur la graine 910592, `versRoute` annonçait « pose » pendant 1,5 s alors que la caisse mourait d'air. Les ordres pleins (gauche, droite, pique, cabre, plane, rien), une fois tenus, sont prévus au plus juste (141 vols sur 141 pour une main de machine, 107 sur 108 au clavier). La variante ne fait donc plus confiance aveuglément à la loi : son rayon perd 8 points, et on la quitte pour un ordre plein dès que celui-ci annonce une meilleure pose (6 points d'écart suffisent, contre 10 sinon), pas avant 0,35 s de façon tenue ni quand la pose est imminente. Tout le reste est identique au parent, profil compris.","code":"cerveaux/c0011-pilote.js","octets":17412,"jumeau":null,"jeu":"cashcar-v1627","commit":"e4942eb0a","tmax":900,"note":{"survie_mediane_s":229.5,"argent_min":11396.2,"pieces_min":337.5,"figures_min":1.65,"air_pct":12.3,"vols_min":4.86,"vol_moyen_s":1.51,"raccourcis_min":0.22,"distance_m_min":7735,"nitro_pct":28.2},"parties":20,"fins":{"roche":4,"tour":3,"eau":1,"paroi":6,"pic":3,"air":1,"lave":1,"vide":1},"cout":{"entree":62990,"sortie":13620,"euros":0.29},"courses":[[910000,193.8,"roche",19325,2,6.6,1,"espace > nuages > jade > grotte"],[910037,305.9,"tour",122221,11,22.7,2,"grotte > jade > espace > nuages > ville"],[910074,235,"eau",34386,8,12.3,1,"nuages > jade > espace > grotte"],[910111,122.6,"paroi",6590,1,7.4,0,"canyon"],[910148,288.1,"paroi",118215,6,16.8,2,"grotte > jade > espace > canyon"],[910185,241.7,"tour",23963,10,11.8,0,"grotte > nuages > jade > ville"],[910222,170.9,"paroi",9525,2,4,0,"nuages > canyon"],[910259,224,"pic",16924,2,5.2,0,"espace > grotte > nuages > jade"],[910296,330.3,"air",62668,14,18.7,1,"nuages > jade > grotte > espace > nuages"],[910333,244.8,"paroi",49212,6,7.3,1,"jade > grotte > ville > canyon"],[910370,182.4,"pic",15762,4,6.7,0,"ville > nuages > jade"],[910407,193.1,"lave",16379,5,6.9,2,"jade > ville > grotte"],[910444,330.2,"pic",155757,14,20.3,3,"espace > ville > grotte > nuages > jade"],[910481,308.5,"paroi",77279,8,8.7,0,"ville > grotte > jade > espace > canyon"],[910518,139.4,"tour",10913,3,6.2,1,"grotte > nuages > ville"],[910555,215.7,"roche",17273,3,5.8,0,"espace > ville > jade > grotte"],[910592,287.6,"paroi",34912,11,18.8,1,"grotte > nuages > jade > ville > canyon"],[910629,206.8,"roche",17865,3,7.3,1,"espace > nuages > ville > grotte"],[910666,217.5,"roche",50387,6,9,0,"jade > nuages > ville > grotte"],[910703,251.1,"vide",31136,10,18.6,1,"grotte > nuages > espace > jade"]],"validation":{"note":{"survie_mediane_s":204.7,"argent_min":8251.1,"pieces_min":314,"figures_min":1.64,"air_pct":11.8,"vols_min":4.3,"vol_moyen_s":1.64,"raccourcis_min":0.16,"distance_m_min":7434,"nitro_pct":29.7},"depart":950000,"parties":20},"champion":true,"ecart":[{"t":" ","l":"/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») =====","n":1},{"t":"+","l":"   VARIANTE « survie en vol » : UNE SEULE IDEE changee par rapport au parent — en vol, la loi « vers la route » (ordre dose, redecide a chaque vue)","n":2},{"t":"+","l":"   n'est plus crue sur parole. README § 2 bis : avec une main a profil, seuls les ordres PLEINS (0, ±1) tenus plus longtemps que la reaction sont","n":3},{"t":"+","l":"   prevus au plus juste ; le rayon versRoute, lui, est une estimation (graine 910592 : « pose dans 1 s » annonce pendant 1,5 s, mort par la jauge).","n":4},{"t":"+","l":"   Donc : le rayon de la loi perd REGLAGES.penaliteLoi points, et meme quand il annonce une pose on la quitte pour un ordre plein qui annonce","n":5},{"t":"+","l":"   une meilleure pose (REGLAGES.basculeLoi points d'ecart), pourvu que la pose ne soit pas imminente. Le reste est inchange.","n":6},{"t":"+","l":"","n":7},{"t":" ","l":"   SA STRATEGIE, EN CLAIR.","n":8},{"t":" ","l":"   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","n":9},{"t":"~","l":"…"},{"t":" ","l":"      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :","n":20},{"t":" ","l":"      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir.","n":21},{"t":"-","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la"},{"t":"-","l":"      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :"},{"t":"-","l":"      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon"},{"t":"-","l":"      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard."},{"t":"+","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route ». Tant que le radar annonce que la facon tenue mene a une pose, a la levre ou au","n":22},{"t":"+","l":"      portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s : changer a chaque vue, c'est zigzaguer","n":23},{"t":"+","l":"      jusqu'a la jauge vide) — SAUF la loi, dont la prevision est moins sure : un ordre plein qui promet mieux la remplace.","n":24},{"t":"+","l":"      Si la facon mene au decor, a la jauge vide ou au fond, il prend la facon du rayon dont l'issue vaut le plus.","n":25},{"t":" ","l":"      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose.","n":26},{"t":" ","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein.","n":27},{"t":"~","l":"…"},{"t":" ","l":"  bascule:10,        /* points qu'un rayon doit avoir de plus que la facon tenue pour qu'on en change */","n":57},{"t":" ","l":"  tenirFacon:.35,    /* s au moins sur une facon avant d'en changer (sauf si elle mene a la mort) */","n":58},{"t":"-","l":"  derive:.3          /* s : apres la pose, la caisse glisse dans son axe ce temps-la avant que le volant morde */"},{"t":"+","l":"  derive:.3,         /* s : apres la pose, la caisse glisse dans son axe ce temps-la avant que le volant morde */","n":59},{"t":"+","l":"  penaliteLoi:8,     /* points retires aux rayons versRoute / versRoutePlane : leur prevision est une estimation avec une main a profil */","n":60},{"t":"+","l":"  basculeLoi:6,      /* points qu'un ordre plein doit avoir de plus que la loi (deja penalisee) pour la remplacer */","n":61},{"t":"+","l":"  loiImminente:.5    /* s : une loi qui annonce sa pose dans moins que ca n'est plus quittee */","n":62},{"t":" ","l":"};","n":63},{"t":" ","l":"const cl=(v,a,b)=>v\u003ca?a:v>b?b:v;","n":64},{"t":"~","l":"…"},{"t":" ","l":"};","n":164},{"t":" ","l":"const LONGS={rien:1,plane:1,versRoute:1,versRoutePlane:1};   /* les rayons joues jusqu'au bout de l'air : « libre » y veut dire jauge vide */","n":165},{"t":"+","l":"const estLoi=nom=>nom==='versRoute'||nom==='versRoutePlane';","n":166},{"t":" ","l":"/* ce que vaut l'issue d'un rayon : 100 = une pose droite tout de suite ; sous 35 = on y reste.","n":167},{"t":" ","l":"   Une pose vaut par son AXE et par l'endroit ou la caisse sera 0,3 s apres (elle glisse dans son axe avant que le volant morde). MESURE (tour 2,","n":168},{"t":"~","l":"…"},{"t":" ","l":"   passee quatre fois au-dessus de la dalle sans s'y poser). Donc :","n":187},{"t":" ","l":"   · au decollage, la loi « vers la route » (la seule mesuree : 9 retours sur 10 apres une sortie par le bord) ;","n":188},{"t":"-","l":"   · tant que le radar dit que la facon tenue mene a une pose (ou a la levre, au portail), on n'en change pas ;"},{"t":"+","l":"   · tant que le radar dit que la facon tenue mene a une pose (ou a la levre, au portail), on n'en change pas — sauf si c'est la loi : son rayon","n":189},{"t":"+","l":"     est une estimation (ordre dose, main en retard), un ordre plein qui promet nettement mieux (basculeLoi points, apres penalite) la remplace,","n":190},{"t":"+","l":"     pourvu que la pose ne soit pas imminente ;","n":191},{"t":" ","l":"   · sinon, et pas plus souvent que toutes les 0,35 s (sauf mort annoncee dans la seconde), on prend la facon du rayon qui vaut le plus. */","n":192},{"t":" ","l":"function enVol(v,m){","n":193},{"t":"~","l":"…"},{"t":" ","l":"  if(!m.facon){m.facon='versRoute';m.tFacon=v.t;}","n":195},{"t":" ","l":"  if(Y){","n":196},{"t":"-","l":"    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=m.facon.indexOf('versRoute')===0;"},{"t":"+","l":"    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=estLoi(m.facon);","n":197},{"t":" ","l":"    /* ce que dit le radar de la facon tenue : son propre rayon, et une fois les doigts dessus depuis une reaction, le rayon `tenu` (MESURE : juste","n":198},{"t":" ","l":"       49 fois sur 50) — sauf pour les lois « vers la route », dont l'ordre change a chaque vue : `tenu` n'y dit que la vue du moment */","n":199},{"t":"-","l":"    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon),sMien=vaut(mien,true,v);"},{"t":"-","l":"    if(!sauve(mien)&&(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))){"},{"t":"+","l":"    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon);","n":200},{"t":"+","l":"    const sMien=vaut(mien,true,v)-(loi?R.penaliteLoi:0);","n":201},{"t":"+","l":"    const declenche=!sauve(mien)","n":202},{"t":"+","l":"      ?(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))","n":203},{"t":"+","l":"      :(loi&&depuis>R.tenirFacon&&(+mien.t||0)>R.loiImminente);","n":204},{"t":"+","l":"    if(declenche){","n":205},{"t":" ","l":"      let mieux=null,sMieux=-9;","n":206},{"t":" ","l":"      for(const nom in FACONS){","n":207},{"t":" ","l":"        if(nom===m.facon)continue;","n":208},{"t":"-","l":"        /* a issue egale : la loi vers la route d'abord, et sans nitro (un vol sans reacteur rend de la jauge) */"},{"t":"-","l":"        const s=vaut(Y.find(x=>x&&x.m===nom),!!LONGS[nom],v)+(nom==='versRoute'?3:nom==='versRoutePlane'?2:nom==='rien'?1:0);"},{"t":"+","l":"        /* a issue egale : un ordre plein sans nitro d'abord (un vol sans reacteur rend de la jauge) ; les lois, moins sures, sont penalisees */","n":209},{"t":"+","l":"        const s=vaut(Y.find(x=>x&&x.m===nom),!!LONGS[nom],v)+(estLoi(nom)?-R.penaliteLoi:nom==='rien'?1:0);","n":210},{"t":" ","l":"        if(s>sMieux){sMieux=s;mieux=nom;}}","n":211},{"t":"-","l":"      if(mieux&&sMieux>sMien+R.bascule){m.facon=mieux;m.tFacon=v.t;}}"},{"t":"+","l":"      const seuil=loi?R.basculeLoi:R.bascule;","n":212},{"t":"+","l":"      if(mieux&&sMieux>sMien+seuil){m.facon=mieux;m.tFacon=v.t;}}","n":213},{"t":" ","l":"  }","n":214},{"t":" ","l":"  const o=FACONS[m.facon](v);","n":215},{"t":"~","l":"…"},{"t":" ","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","n":224},{"t":" ","l":"};","n":225},{"t":"-","l":""}],"source":null,"rejeux":[{"course":"c0011-g910111","graine":910111,"pourquoi":["champion : sa course la plus courte"],"fin":"paroi","t":122.7,"video":null},{"course":"c0011-g910148","graine":910148,"pourquoi":["le plus long vol pose : 10.52 s"],"fin":"paroi","t":288.05,"video":null},{"course":"c0011-g910444","graine":910444,"pourquoi":["champion : sa meilleure course","le plus gros raccourci : 2265 m"],"fin":"pic","t":330.16,"video":null}]},{"id":"c0012","nom":"pilote","date":"2026-11-25T16:14:49.582Z","etape":"K-sonnet","generation":1,"parents":["c0010"],"modele":"claude-sonnet-5-5","raison":"Un seul changement, dans la décision de nitro au sol : le pilote anticipe le virage. Il compare la vitesse sûre du virage (`vSure`) à la vitesse qu'aura la caisse à son arrivée si la nitro reste allumée, et non plus à la vitesse du moment. Il regarde aussi 4 s devant au lieu de 3. La nitro se coupe donc plus tôt, et ne s'allume pas quand elle ferait arriver la caisse trop vite. Le but est de sortir moins de la route sans l'avoir voulu, sans toucher à la main ni à la conduite du reste.","code":"cerveaux/c0012-pilote.js","octets":17385,"jumeau":null,"jeu":"cashcar-v1627","commit":"e4942eb0a","tmax":600,"note":{"survie_mediane_s":232.8,"argent_min":9553.5,"pieces_min":304,"figures_min":2.43,"air_pct":17,"vols_min":5.35,"vol_moyen_s":1.9,"raccourcis_min":0.45,"distance_m_min":7435,"nitro_pct":30.2},"parties":6,"fins":{"paroi":2,"tour":2,"roche":1,"vide":1},"cout":{"entree":62986,"sortie":10774,"euros":0.11},"courses":[[910000,230.1,"paroi",23713,8,9.4,1,"espace > nuages > jade > canyon"],[910037,324.3,"tour",125616,15,22.5,2,"grotte > jade > espace > nuages > ville"],[910074,235.4,"tour",12884,10,17.5,0,"nuages > jade > esp vitesse PROJETEE a l'arrivee. Moins","n":18},{"t":"+","l":"      volontiers sur les maps a decor (canyon, grotte, jade, ville : une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui","n":19},{"t":"+","l":"      qui fait planer la caisse quand il faut revenir.","n":20},{"t":" ","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la","n":21},{"t":" ","l":"      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :","n":22},{"t":"~","l":"…"},{"t":" ","l":"  braqueFort:.5,     /* au-dessus, on se tient au moins a mi-largeur du cote INTERIEUR */","n":49},{"t":" ","l":"  braqueNitro:.4,    /* au-dessus, pas de nitro (.3 pour l'allumer) ; sur les maps a decor (une sortie y tue) : .25 et .18 */","n":50},{"t":"-","l":"  margeAllumer:.3,   /* part de ma vitesse : vSure doit la depasser d'autant pour ALLUMER la nitro… */"},{"t":"-","l":"  margeTenir:.1,     /* …et d'autant pour la GARDER */"},{"t":"+","l":"  margeAllumer:.2,   /* part de ma vitesse : vSure doit depasser la vitesse PROJETEE d'autant pour ALLUMER la nitro… (avant .3 sur la vitesse du moment) */","n":51},{"t":"+","l":"  margeTenir:.08,    /* …et d'autant pour la GARDER (avant .1 sur la vitesse du moment) */","n":52},{"t":"+","l":"  fenetre:4,         /* s : on regarde le virage jusqu'a cette distance en temps (avant 3) */","n":53},{"t":"+","l":"  gainNitro:.06,     /* part de la vitesse gagnee par seconde de nitro tenue (estimation prudente) : sert a projeter la vitesse a l'arrivee */","n":54},{"t":"+","l":"  gainMax:3,         /* s : le temps de projection ne depasse pas ca (au-dela la vitesse plafonne) */","n":55},{"t":" ","l":"  jaugeAllume:.45,   /* jauge + reserve au-dessus de laquelle la nitro s'allume… */","n":56},{"t":" ","l":"  jaugeCoupe:.25,    /* …et en dessous de laquelle elle se coupe (le fond garde pour planer en vol) */","n":57},{"t":"~","l":"…"},{"t":" ","l":"  const jauge=(v.nitro||0)+(v.reserve||0);","n":132},{"t":" ","l":"  if(jauge>R.jaugeAllume)m.plein=true;else if(jauge\u003cR.jaugeCoupe)m.plein=false;","n":133},{"t":"-","l":"  const proche=!!(vg&&vg.d\u003cvit*3),margeV=proche?vg.marge/vit:9;"},{"t":"+","l":"  /* LA MARGE SUR LA VITESSE D'ARRIVEE : la caisse ne freine pas, et la nitro la fait encore accelerer jusqu'au virage. On compare vSure a la","n":134},{"t":"+","l":"     vitesse qu'elle aura en arrivant si on garde la nitro, pas a celle d'ici : on lache plus tot, des que le virage devient trop vite pour elle. */","n":135},{"t":"+","l":"  const proche=!!(vg&&vg.vSure!=null&&vg.d\u003cvit*R.fenetre);","n":136},{"t":"+","l":"  const tv=proche?Math.max(0,vg.d)/vit:9;","n":137},{"t":"+","l":"  const vProj=vit*(1+R.gainNitro*Math.min(tv,R.gainMax));","n":138},{"t":"+","l":"  const margeV=proche?(vg.vSure-vProj)/vit:9;","n":139},{"t":" ","l":"  const k=decor?R.nitroDecor:1,seuil=(m.nitro?R.braqueNitro:R.braqueNitro-.1)*k;","n":140},{"t":" ","l":"  const sur=margeV>(m.nitro?R.margeTenir:R.margeAllumer)&&Math.max(force,Math.abs(lIci)/lmax)\u003cseuil;","n":141},{"t":"~","l":"…"},{"t":" ","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","n":220},{"t":" ","l":"};","n":221},{"t":"-","l":""}],"source":null,"rejeux":[]},{"id":"c0013","nom":"pilote","date":"2026-11-25T16:14:49.990Z","etape":"K-sonnet","generation":1,"parents":["c0010"],"modele":"claude-sonnet-5-5","raison":"Le pilote prend maintenant presque toujours l'objet de la ligne parfaite (fruit ou plaque) plutôt que la tranche de pièces voisine, et surtout quand la jauge est basse, car c'est ce qui recharge la nitro. Les seuils d'allumage et de coupure de la nitro sont abaissés, avec une coupure encore plus basse quand un objet de la ligne arrive dans moins de 1,5 s, pour la tenir plus longtemps. Les seuils de virage restent prudents : même sur les maps à décor, la nitro n'est coupée que dans les vrais virages.","code":"cerveaux/c0013-pilote.js","octets":11817,"jumeau":null,"jeu":"cashcar-v1627","commit":"e4942eb0a","tmax":600,"note":{"survie_mediane_s":105.7,"argent_min":7084,"pieces_min":286.8,"figures_min":2.22,"air_pct":14.8,"vols_min":5.17,"vol_moyen_s":1.71,"raccourcis_min":0.2,"distance_m_min":7131,"nitro_pct":33.8},"parties":6,"fins":{"roche":5,"paroi":1},"cout":{"entree":62978,"sortie":7534,"euros":0.08},"courses":[[910000,150.7,"roche",15680,1,1.5,0,"espace > nuages > grotte"],[910037,47.9,"roche",1014,1,5.9,0,"grotte"],[910074,224.3,"roche",14964,7,9.4,0,"nuages > jade > espace > grotte"],[910111,46.5,"paroi",2849,0,1.4,0,"canyon"],[910148,387.1,"roche",70611,24,27.7,3,"grotte > jade > nuages > espace > grotte"],[910185,60.7,"roche",3174,1,4,0,"grotte"]],"validation":null,"champion":false,"ecart":[{"t":"-","l":"/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») ====="},{"t":"+","l":"/* ===== VARIANTE « LIGNE PARFAITE ET NITRO » du pilote de l'ecurie (etape C) =====","n":1},{"t":" ","l":"   SA STRATEGIE, EN CLAIR.","n":2},{"t":" ","l":"   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","n":3},{"t":" ","l":"   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main","n":4},{"t":"-","l":"   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le"},{"t":"-","l":"   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur."},{"t":"-","l":"   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR."},{"t":"+","l":"   voit la route avec 0,15 s de retard.","n":5},{"t":" ","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,","n":6},{"t":"-","l":"      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas."},{"t":"-","l":"   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se"},{"t":"-","l":"      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne"},{"t":"-","l":"      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence."},{"t":"-","l":"   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et"},{"t":"-","l":"      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :"},{"t":"-","l":"      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir."},{"t":"-","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la"},{"t":"-","l":"      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :"},{"t":"-","l":"      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon"},{"t":"-","l":"      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard."},{"t":"-","l":"      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose."},{"t":"-","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein."},{"t":"-","l":"   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :"},{"t":"-","l":"   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en"},{"t":"-","l":"   travers) ; freiner ; voler expres comme un joueur ; poser des figures."},{"t":"-","l":"   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */"},{"t":"+","l":"      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible.","n":7},{"t":"+","l":"   2. LE VIRAGE D'APRES : placement du cote interieur du virage qui vient, cap d'avance sur le changement de sens.","n":8},{"t":"+","l":"   3. LA NITRO LA OU ELLE SERT.","n":9},{"t":"+","l":"   4. EN VOL, LE RADAR : loi « vers la route », facon tenue tant qu'elle mene a une pose.","n":10},{"t":"+","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci, ni drift, ni frein.","n":11},{"t":"+","l":"   CE QUI CHANGE DANS CETTE VARIANTE (une seule idee : la ligne parfaite nourrit la nitro) :","n":12},{"t":"+","l":"   · les objets de la ligne parfaite passent avant les pieces, meme un peu plus loin, et toujours quand la jauge est basse : chacun rend","n":13},{"t":"+","l":"     1,15 unite de nitro contre 0,8 perdue par seconde de nitro tenue. MESURE parent : nitro tenue 27,9 % du temps, les joueurs 76 % au sol.","n":14},{"t":"+","l":"   · seuils de jauge plus bas (la ligne la rechargera), et plus bas encore quand un objet de la ligne arrive dans 1,5 s ;","n":15},{"t":"+","l":"   · seuils de virage de la nitro un peu plus larges, y compris sur les maps a decor.","n":16},{"t":"+","l":"   La seconde chance est prise comme dans les deux meilleures parties des joueurs. */","n":17},{"t pour rejoindre la ligne */","n":33},{"t":"-","l":"  avanceCap:.25,     /* s : le cap prend cette avance sur le changement de lacet de la route (celui de dans 0,4 s moins celui d'ici) */"},{"t":"+","l":"  avanceCap:.25,     /* s : le cap prend cette avance sur le changement de lacet de la route */","n":34},{"t":" ","l":"  capAvance:.25,     /* rad : l'avance ne depasse pas ca */","n":35},{"t":" ","l":"  braqueDoux:.15,    /* part de volant que demande un virage : en dessous, toute la largeur est permise */","n":36},{"t":" ","l":"  braqueFort:.5,     /* au-dessus, on se tient au moins a mi-largeur du cote INTERIEUR */","n":37},{"t":"-","l":"  braqueNitro:.4,    /* au-dessus, pas de nitro (.3 pour l'allumer) ; sur les maps a decor (une sortie y tue) : .25 et .18 */"},{"t":"-","l":"  margeAllumer:.3,   /* part de ma vitesse : vSure doit la depasser d'autant pour ALLUMER la nitro… */"},{"t":"-","l":"  margeTenir:.1,     /* …et d'autant pour la GARDER */"},{"t":"-","l":"  jaugeAllume:.45,   /* jauge + reserve au-dessus de laquelle la nitro s'allume… */"},{"t":"-","l":"  jaugeCoupe:.25,    /* …et en dessous de laquelle elle se coupe (le fond garde pour planer en vol) */"},{"t":"+","l":"  braqueNitro:.45,   /* au-dessus, pas de nitro (−.1 pour l'allumer) (parent : .4) */","n":38},{"t":"+","l":"  margeAllumer:.25,  /* part de ma vitesse : vSure doit la depasser d'autant pour ALLUMER la nitro (parent : .3) */","n":39},{"t":"+","l":"  margeTenir:.08,    /* …et d'autant pour la GARDER (parent : .1) */","n":40},{"t":"+","l":"  jaugeAllume:.35,   /* jauge + reserve au-dessus de laquelle la nitro s'allume (parent : .45) */","n":41},{"t":"+","l":"  jaugeCoupe:.18,    /* …et en dessous de laquelle elle se coupe (parent : .25) */","n":42},{"t":"+","l":"  jaugeCoupeLigne:.08,/* la meme quand un objet de la ligne arrive dans moins de 1,5 s : il rendra de la nitro */","n":43},{"t":" ","l":"  capMax:.22,        /* rad : au-dela, la caisse est de travers, pas de nitro */","n":44},{"t":" " E a d metres devant (rad, + a gauche) */","n":70},{"t":" ","l":"function tourne(v,d){","n":71},{"t":" ","l":"  const rt=Array.isArray(v.route)?v.route:[];","n":72},{"t":"~","l":"…"},{"t":" ","l":"  return a0;","n":75},{"t":" ","l":"}","n":76},{"t":"-","l":"/* LE LACET DE LA ROUTE DANS t SECONDES (rad/s) : ce que la main devra suivre a ce moment-la. La loi `ligne` de la main ne connait que le lacet"},{"t":"-","l":"   sous les roues, percu 0,15 s plus tard : dans un S, elle braque encore a droite quand la route est deja repartie a gauche (MESURE, tour 3,"},{"t":"-","l":"   canyon : cap −0,6 rad en 0,4 s au changement de sens, la paroi 0,5 s apres). C'est au pilote de voir le virage d'apres. */"},{"t":"+","l":"/* LE LACET DE LA ROUTE DANS t SECONDES (rad/s) */","n":77},{"t":" ","l":"function lacetDans(v,t,vit){return (tourne(v,vit*(t+.15))-tourne(v,vit*Math.max(0,t-.15)))/(t\u003c.15?t+.15:.3);}","n":78},{"t":" ","l":"const DECOR={canyon:1,grotte:1,jade:1,ville:1};   /* les maps ou une sortie par le bord finit contre le decor */","n":79},{"t":"~","l":"…"},{"t":" ","l":"  const couloir=(v.mur&&v.mur.ici)||(Array.isArray(v.couloirs)&&v.couloirs.some(c=>c.d0\u003cvit*2&&c.d1>0));","n":82},{"t":" ","l":"  const decor=!!DECOR[v.carte],max=Math.min(decor?R.bandeDecor:99,v.demi-(couloir?R.margeCouloir:R.marge));","n":83},{"t":"+","l":"  const jauge=(v.nitro||0)+(v.reserve||0);","n":84},{"t":"+","l":"  /* un objet de la ligne arrive dans moins de 1,5 s : il rendra de la nitro, on peut vider un peu plus la jauge */","n":85},{"t":"+","l":"  const LO=v.ligne&&Array.isArray(v.ligne.objets)?v.ligne.objets:[];","n":86},{"t":"+","l":"  const bientot=LO.some(o=>o&&o.d>0&&o.d\u003cvit*1.5);","n":87},{"t":"+","l":"  const coupe=bientot?R.jaugeCoupeLigne:R.jaugeCoupe;","n":88},{"t":"+","l":"  if(jauge>R.jaugeAllume)m.plein=true;else if(jauge\u003ccoupe)m.plein=false;","n":89},{"t":" ","l":"  /* ce qui se ramasse a portee, sinon le milieu */","n":90},{"t":" ","l":"  let cible=0;","n":91}, 2 s de route, entre 180 et 320 m), pour que la ligne glisse plus tôt vers le fil quand la caisse va vite. Le reste (vol, nitro, virages, `profil`) est celui du parent, sans changement.","code":"cerveaux/c0014-pilote.js","octets":16857,"jumeau":null,"jeu":"cashcar-v1627","commit":"e4942eb0a","tmax":600,"note":{"survie_mediane_s":215.4,"argent_min":7430.6,"pieces_min":326,"figures_min":1.83,"air_pct":14.7,"vols_min":4.69,"vol_moyen_s":1.88,"raccourcis_min":0.11,"distance_m_min":7166,"nitro_pct":29.9},"parties":6,"fins":{"air":3,"roche":1,"canyon":1,"pic":1},"cout":{"entree":62977,"sortie":9719,"euros":0.1},"courses":[[910000,203.5,"air",13664,7,15.6,0,"espace > nuages > jade"],[910037,290.4,"air",35826,11,12.9,0,"grotte > jade > ville > nuages"],[910074,227.3,"roche",49881,9,16.2,0,"nuages > jade > espace > grotte"],[910111,29.6,"canyon",1243,0,1.4,0,"canyon"],[910148,119.6,"pic",7149,0,0.2,0,"grotte > jade"],[910185,243,"air",30124,7,21.4,2,"grotte > nuages > jade > ville"]],"validation":null,"champion":false,"ecart":[{"t":" ","l":"/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») =====","n":1},{"t":"+","l":"   VARIANTE « LE FIL DES PIECES » : seule la cible visee au sol change (aRamasser). Les pieces font le palier : on ne quitte plus le fil de pieces","n":2},{"t":"+","l":"   pour un fruit, une plaque ou un orbe qui n'en donne pas, sauf s'il est tout pres du fil (moins de 5 m de cote) ou si c'est l'AIMANT (il elargit","n":3},{"t":"+","l":"   tout ce qu'on ramasse ensuite). Et le fil est vise de plus loin quand la caisse va vite (2,2 s de route, 180 a 320 m).","n":4},{"t":" ","l":"   SA STRATEGIE, EN CLAIR.","n":5},{"t":" ","l":"   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","n":6},{"t":"~","l":"…"},{"t":" ","l":"   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur.","n":9},{"t":" ","l":"   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR.","n":10},{"t":"-","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,"},{"t":"-","l":"      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas."},{"t":"+","l":"   1. AU SOL, LA LIGNE. Il vise les pieces de LOIN (le fil), puis la ligne parfaite si elle est sur le fil, puis les pouvoirs ; sa ligne GLISSE","n":11},{"t":"+","l":"      vers sa cible, elle n'y saute pas.","n":12},{"t":" ","l":"   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se","n":13},{"t":" ","l":"      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne","n":14},{"t":"~","l":"…"},{"t":" ","l":"  glisseUrgence:.3,  /* le meme quand la route lache : la, on ne menage plus rien */","n":40},{"t":" ","l":"  ligneLoin:320,     /* m : un objet de la ligne parfaite se vise jusque-la */","n":41},{"t":"-","l":"  piecesLoin:180,    /* m : une tranche de pieces se vise jusque-la */"},{"t":"+","l":"  piecesLoin:180,    /* m : une tranche de pieces se vise au moins jusque-la */","n":42},{"t":"+","l":"  piecesTemps:2.2,   /* s de route : la portee de visee des pieces grandit avec la vitesse… */","n":43},{"t":"+","l":"  piecesMax:320,     /* …jusqu'a cette distance (m) */","n":44},{"t":"+","l":"  filProche:5,       /* m : un objet sans piece n'est vise que s'il est a moins de ca du fil de pieces */","n":45},{"t":" ","l":"  capLigne:.3,       /* rad : le cap le plus fort demande pour rejoindre la ligne */","n":46},{"t":"-","l":"  avanceCap:.25,     /* s : le cap prend cette avance sur le changement nitro?R.braqueNitro:R.braqueNitro-.1)*k;"},{"t":"+","l":"  const k=canyon?R.nitroCanyon:decor?R.nitroDecor:1,seuil=(m.nitro?R.braqueNitro:R.braqueNitro-.1)*k;","n":133},{"t":" ","l":"  const sur=margeV>(m.nitro?R.margeTenir:R.margeAllumer)&&Math.max(force,Math.abs(lIci)/lmax)\u003cseuil;","n":134},{"t":" ","l":"  m.nitro=!lache&&pose&&sur&&(v.nitroLibre||!!m.plein);","n":135},{"t":"~","l":"…"},{"t":" ","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","n":213},{"t":" ","l":"};","n":214},{"t":"-","l":""}],"source":null,"rejeux":[]},{"id":"c0016","nom":"pilote","date":"2026-11-25T16:23:52.911Z","etape":"K-sonnet","generation":1,"parents":["c0010"],"modele":"claude-sonnet-5-5","raison":"je ne touche qu'au choix de la façon de voler. Le pilote juge maintenant une pose sur son axe (poids ×1,25) et sur son écart à l'axe (0,6 point par mètre, plus un bonus « pile au centre »). Il quitte aussi une façon dont le radar annonce une pose de travers ou excentrée (score sous 58, pose à plus de 0,5 s) pour une façon mieux notée. Cela vise les sorties en chaîne, où la caisse se pose en travers et ressort par l'autre bord ; je n'ai pas mesuré l'effet.","code":"cerveaux/c0016-pilote.js","octets":11598,"jumeau":null,"jeu":"cashcar-v1627","commit":"e4942eb0a","tmax":600,"note":{"survie_mediane_s":161.7,"argent_min":6057.5,"pieces_min":297.5,"figures_min":1.46,"air_pct":11.1,"vols_min":3.5,"vol_moyen_s":1.91,"raccourcis_min":0.13,"distance_m_min":7177,"nitro_pct":29.6},"parties":6,"fins":{"air":3,"paroi":1,"tour":1,"vide":1},"cout":{"entree":62969,"sortie":8198,"euros":0.09},"courses":[[910000,97.6,"air",6832,0,6.6,0,"espace > nuages"],[910037,150.8,"air",10372,1,8,0,"grotte > jade"],[910074,202.5,"air",12046,4,13,0,"nuages > jade > espace"],[910111,44,"paroi",2920,1,4.2,0,"canyon"],[910148,275.6,"tour",49249,12,14.9,1,"grotte > jade > nuages > ville"],[910185,172.6,"vide",13795,5,9.4,1,"grotte > nuages > jade"]],"validation":null,"champion":false,"ecart":[{"t":"-","l":"/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») ====="},{"t":"-","l":"   SA STRATEGIE, EN CLAIR."},{"t":"+","l":"/* ===== LE PILOTE, VARIANTE « poser droit et au centre » (etape C) =====","n":1},{"t":"+","l":"   SA STRATEGIE, EN CLAIR (celle du parent, une seule idee changee).","n":2},{"t":" ","l":"   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","n":3},{"t":" ","l":"   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main","n":4},{"t":"-","l":"   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le"},{"t":"-","l":"   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur."},{"t":"-","l":"   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR."},{"t":"-","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,"},{"t":"-","l":"      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas."},{"t":"-","l":"   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se"},{"t":"-","l":"      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne"},{"t":"-","l":"      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence."},{"t":"-","l":"   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et"},{"t":"-","l":"      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :"},{"t":"-","l":"      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir."},{"t":"-","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la"},{"t":"-","l":"      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :"},{"t":"-","l":"      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon"},{"t":"-","l":"      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard."},{"t":"-","l":"      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose."},{"t":"-","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein."},{"t":"-","l":"   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :"},{"t":"-","l":"   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en"},{"t":"-","l":"   travers) ; freiner ; voler expres comme un joueur ; poser des figures."},{"t":"-","l":"   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */"},{"t":"+","l":"   voit la route avec 0,15 s de retard. A 400 km/h un coup long tourne la caisse d'un demi-radian : elle SORT par le bord plusieurs fois par","n":5},{"t":"+","l":"   minute, quoi que le pilote decide. Comme un joueur. Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR.","n":6},{"t":"+","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (ligne parfaite, pieces, pouvoirs) ; sa ligne GLISSE vers sa cible.","n":7},{"t":"+","l":"   2. LE VIRAGE D'APRES : il se place du cote interieur du virage qui vient et donne a la main un cap d'avance.","n":8},{"t":"+","l":"   3. LA NITRO LA OU ELLE SERT : partout ou la route se tient, coupee avant les virages, un fond de jauge garde pour planer.","n":9},{"t":"+","l":"   4. EN VOL, LE RADAR : au decollage la loi « vers la route » ; la facon tenue n'est changee que si elle mene au decor / a la jauge vide.","n":10},{"t":"+","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci, ni drift, ni frein.","n":11},{"t":"+","l":"","n":12},{"t":"+","l":"   CE QUI CHANGE DANS CETTE VARIANTE (une seule idee : POSER DROIT ET AU CENTRE).","n":13},{"t":"+","l":"   Une pose compte pour le radar « sauvee » meme quand la caisse arrive en travers (axe 0,5 a 1 rad, tolere par le jeu jusqu'a 55 degres) ou","n":14},{"t":"+","l":"   tout au bord : elle ressort alors par l'autre cote dans la seconde (sortie en chaine), ou rate la dalle d'un rien. Donc :","n":15},{"t":"+","l":"   · la note d'une pose pese davantage l'axe (25 par rad au lieu de 20) et l'ecart a l'axe de la pose (0,6 point par metre, +5 si le radar","n":16},{"t":"+","l":"     dit « centre ») : une pose droite et au milieu vaut nettement mieux qu'une pose de travers sur le bord ;","n":17},{"t":"+","l":"   · une facon tenue dont la pose annoncee est mauvaise (note sous 58, pose a plus de 0,5 s) peut etre quittee pour une facon mieux notee,","n":18},{"t":"+","l":"     avec la meme hysteresis qu'avant (tenirFacon, bascule) : on ne zigzague pas. */","n":19},{"t":" ","l":"const PROFIL={","n":20},{"t":" ","l":"  modele:'clavier',graine:1,                 /* la main mesuree sur les joueurs au clavier (doigts.js, MAIN_CLAVIER), sans rien y ecrire pa
