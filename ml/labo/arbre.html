14,6.6,0,"espace > nuages > ville"],[910666,64,"vide",1877,4,9.5,0,"jade"],[910703,217.4,"air",186984,22,10.5,0,"grotte > nuages > crypto > espace"]],"validation":null,"champion":true,"ecart":null,"source":["/* ===== LE BOT DE REFERENCE (2026-11-23, etape 1 BOTS-ML : « un bot ecrit a la main sert de reference ») =====","   Un programme LISIBLE, ecrit a la main, sans rien d'appris : c'est le point de depart que les cerveaux ecrits par Claude devront battre,","   et l'exemple du contrat (decide(vue, memoire) → un ordre ; voir README.md).","   Ce qu'il sait faire : tenir la route, suivre les pieces et les plaques, eviter les flaques, pousser la NITRO dans les droites,","   lancer une figure sur la route quand la jauge le permet, se reposer sur la route apres une sortie, tourner une figure en vol quand","   il a le temps. Ce qu'il ne fait PAS : chercher un raccourci (il ne quitte jamais la route expres), le drift, les combos. */","const REGLAGES={","  marge:9,          /* m gardes entre la caisse et le bord de la route */","  virageDoux:.22,   /* rad : en dessous, a 150 m, la route est « droite » */","  nitroMin:.45,     /* part de jauge au-dessus de laquelle on pousse la NITRO dans une droite */","  figureMin:.6,     /* part de jauge pour lancer une figure sur la route (elle coute 35 %, sa pose en rend 40 %) */","  figureTous:4,     /* s au moins entre deux figures sur la route */","  sautVirage:.12,   /* rad : la route doit tourner moins que ca a 300 m pour qu'on ose sauter */","  sautDevers:.2,    /* rad : …et se pencher moins que ca jusqu'a 550 m */","  sautPente:.07,    /* rad : …et ne pas descendre plus que ca (7 %) */","  piqueDelai:2,     /* s : en vol, au-dela de ce delai avant de retrouver la route, on pique */","  volFigure:1.1     /* s de vol qu'il doit rester pour lancer une figure en l'air */","};","const cl=(v,a,b)=>v\u003ca?a:v>b?b:v;","","function auSol(vue,m){","  const R=REGLAGES,max=vue.demi-R.marge;","  const v100=vue.route[2].virage,v150=vue.route[3].virage,v300=vue.route[5].virage;","  /* LA LIGNE : l'interieur du virage qui vient (on y arrive avant lui), sinon le milieu */","  let ligne=cl(v150*60,-max*.7,max*.7);","  /* ce qui se ramasse, du plus proche au plus loin : la file de pieces, puis les plaques, les fruits et les orbes a portee de volant */","  const portee=d=>Math.max(4,d*.22);","  const prend=(o)=>Math.abs(o.lat-vue.lat)\u003cportee(o.d)&&Math.abs(o.lat)\u003cmax;","  const file=vue.piecesDevant.find(p=>p.d>20&&p.d\u003c160&&prend(p));","  if(file)ligne=file.lat;","  for(const liste of [vue.fruits,vue.orbes,vue.plaques]){const o=liste.find(x=>x.d>25&&x.d\u003c220&&prend(x));if(o){ligne=o.lat;break;}}","  /* une flaque sur la ligne : on passe a cote, du cote ou il y a le plus de place */","  for(const f of vue.flaques){if(f.d\u003c5||f.d>140)continue;if(Math.abs(f.lat-ligne)\u003cf.rayon+3)ligne=f.lat+(f.lat>0?-1:1)*(f.rayon+5);}","  ligne=cl(ligne,-max,max);","  const droit=Math.abs(v100)\u003cR.virageDoux*.7&&Math.abs(v150)\u003cR.virageDoux&&Math.abs(v300)\u003cR.virageDoux*2.2;","  const pose=Math.abs(vue.lat)\u003cmax&&Math.abs(vue.cap)\u003c.18&&!vue.glisse&&!vue.rebond&&!vue.dessous;","  const ordre={ligne:ligne,nitro:droit&&pose&&(vue.nitroLibre||vue.nitro+vue.reserve>R.nitroMin)};","  /* UNE FIGURE SUR LA ROUTE : dans une droite, bien pose, la jauge assez pleine, pas trop souvent, pas juste avant le portail.","     UN SAUT a la place, une fois sur deux, si la route reste droite et ne remonte pas sur 400 m (de quoi se reposer dessus). */","  if(droit&&pose&&!vue.figureRoute&&vue.fin>600&&vue.vitesse>45&&vue.nitro>R.figureMin&&vue.t-(m.tFigure||-99)>R.figureTous){","    /* …et ne se penche pas : devant une route qui se vrille ou passe a l'envers, un saut ne retombe sur rien (MESURE : canyon, mort « vide ») */","    const v400=vue.route[6].virage,aPlat=Math.abs(vue.devers)\u003cR.sautDevers&&vue.route.every(r=>!r.envers&&Math.abs(r.devers)\u003cR.sautDevers);","    /* …et ne plonge pas : sur une forte descente, un petit saut pris vite ne retombe plus (MESURE : jade et canyon, morts « air ») */","    const pentu=vue.pente\u003c-R.sautPente||vue.route[6].monte\u003c-400*R.sautPente;","    const libre=aPlat&&!pentu&&Math.abs(v300)\u003cR.sautVirage&&Math.abs(v400)\u003cR.sautVirage*1.6&&vue.route[6].monte\u003c2&&!vue.route.some(r=>r.trou);","    m.tFigure=vue.t;m.n=(m.n|0)+1;","    if(libre&&Math.abs(vue.lat)\u003cvue.demi*.5&&m.n%2===0){ordre.geste='saut';ordre.direction='avant';}","    else{ordre.geste='figure';ordre.direction=m.n%4\u003c2?'gauche':'droite';}","    ordre.nitro=false;}","  return ordre;","}","","function enVol(vue,m){","  const R=REGLAGES,f=vue.vol,ordre={volant:0,manche:0,nitro:false};","  /* REVENIR SE POSER : l'anneau de pose quand le jeu le montre, sinon la route la plus proche (se remettre dans son axe, au-dessus d'elle) */","  if(f.anneau)ordre.volant=cl(f.anneau.gisement*2.2,-1,1);","  else if(f.proche&&Math.abs(f.proche.axe)\u003c1.6){","    const versAxe=cl(-f.proche.lat/40,-.6,.6);            /* le cap qui ramene au-dessus de la route */","    ordre.volant=cl((versAxe-f.proche.axe)*1.6,-1,1);","    /* sous le niveau de la route et a cote d'elle : planer pour ne pas passer dessous */","    if(Math.abs(f.proche.lat)>vue.demi&&f.proche.haut\u003c4&&f.proche.haut>-12&&vue.nitro>.1)ordre.nitro=true;","  }","  /* TROP HAUT : la route descend sous la caisse plus vite qu'elle ne tombe (MESURE : jade, 198 m au-dessus de la route apres 5 s, mort « air »).","     Si on n'y sera pas dans les 2 s, ou pas avant la fin du temps d'air : piquer (↑), le nez vers la route. */","  if(f.proche&&f.proche.haut>10&&Math.abs(f.proche.lat)\u003cvue.demi*2){","    const delaiRoute=f.proche.haut/Math.max(1,f.proche.versRoute);","    if(delaiRoute>R.piqueDelai||delaiRoute>f.reste-1)ordre.manche=-1;}","  /* UNE FIGURE EN VOL : si le jeu annonce assez de temps avant la pose, et que rien ne tourne deja */","  const delai=f.anneau?f.anneau.delai:0;","  if(!f.figure&&delai>R.volFigure&&f.reste>delai+.5&&vue.nitro>.4&&vue.t-(m.tVol||-99)>1.2){","    m.tVol=vue.t;m.nv=(m.nv|0)+1;","    ordre.geste='figure';ordre.direction=['avant','gauche','arriere','droite'][m.nv%4];}","  return ordre;","}","","module.exports={","  nom:'reference',","  REGLAGES:REGLAGES,","  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","};",""],"rejeux":[{"course":"c0001-g910074","graine":910074,"pourquoi":["le plus de figures en un vol : 2"],"fin":"roche","t":187.8,"video":null},{"course":"c0001-g910407","graine":910407,"pourquoi":["champion : sa course la plus courte","la pire course de la generation (la plus courte)"],"fin":"pic","t":39.9,"video":null},{"course":"c0001-g910444","graine":910444,"pourquoi":["le plus long vol pose : 10.3 s","le plus gros raccourci : 1722 m"],"fin":"vide","t":226.8,"video":null},{"course":"c0001-g910592","graine":910592,"pourquoi":["champion : sa meilleure course"],"fin":"vide","t":216.1,"video":null}]},{"id":"c0002","nom":"reference","date":"2026-11-25T04:18:42.967Z","etape":"1","generation":1,"parents":["c0001"],"modele":"main","raison":"Le meme code que c0001, renote le 25/11/2026 dans le simulateur fidele : le canyon de ml/reel a desormais son relief (parois, riviere, tunnel, murs de couloir ; ml/reel/jeu-reel.js, cyw=0). Les notes de c0001 (canyon sans relief) ne se comparent plus a celles d'apres.","code":"cerveaux/c0002-reference.js","octets":6021,"jumeau":null,"jeu":"cashcar-v1627","commit":"b57b79197","tmax":300,"note":{"survie_mediane_s":142.6,"argent_min":16931.3,"pieces_min":392.4,"figures_min":5.88,"air_pct":8.4,"vols_min":3.64,"vol_moyen_s":1.39,"raccourcis_min":0.02,"distance_m_min":8033,"nitro_pct":17.7},"parties":20,"fins":{"roche":5,"air":2,"riviere":1,"paroi":2,"vide":8,"canyon":1,"pic":1},"cout":null,"courses":[[910000,199.9,"roche",22074,20,3.9,0,"espace > nuages > grotte"],[910037,189.6,"air",20156,17,5.6,0,"grotte > jade > espace"],[910074,187.7,"ro 5,"tour":3,"roche":3,"vide":4,"pic":2,"air":3},"cout":null,"courses":[[910000,230.1,"paroi",23713,8,9.4,1,"espace > nuages > jade > canyon"],[910037,324.3,"tour",125616,15,22.5,2,"grotte > jade > espace > nuages > ville"],[910074,235.4,"tour",12884,10,17.5,0,"nuages > jade > espace > ville"],[910111,44,"paroi",2920,1,4.2,0,"canyon"],[910148,327.7,"roche",33494,15,22.3,6,"grotte > jade > espace > nuages > grotte"],[910185,172.6,"vide",13795,5,9.4,1,"grotte > nuages > jade"],[910222,161.9,"paroi",9507,1,2.7,0,"nuages > canyon"],[910259,244.6,"vide",24328,6,9.5,0,"espace > grotte > nuages > ville"],[910296,243.8,"roche",30162,10,19.9,0,"nuages > jade > espace > grotte"],[910333,166.4,"roche",11420,4,13.1,0,"jade > grotte"],[910370,235.8,"paroi",37137,6,13,0,"ville > nuages > jade > canyon"],[910407,340.3,"vide",237419,14,24.2,2,"jade > ville > grotte > nuages > jade"],[910444,197.4,"paroi",16474,6,11.6,1,"espace > ville > canyon"],[910481,200.6,"pic",15112,3,8.8,0,"ville > grotte > jade"],[910518,256.6,"tour",55342,6,11.2,1,"grotte > nuages > jade > ville"],[910555,372.1,"vide",63475,19,27.1,3,"espace > ville > grotte > nuages > espace"],[910592,144,"air",4767,4,15,1,"grotte > nuages"],[910629,159.6,"air",7272,3,20.8,3,"espace > nuages > ville"],[910666,37.2,"pic",1902,0,2.6,0,"jade"],[910703,149.3,"air",6583,1,5.9,1,"grotte > nuages > jade"]],"validation":null,"champion":true,"ecart":null,"source":["/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») =====","   SA STRATEGIE, EN CLAIR.","   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser.","   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main","   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le","   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur.","   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR.","   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,","      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas.","   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se","      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne","      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence.","   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et","      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :","      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir.","   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la","      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :","      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon","      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard.","      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose.","   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein.","   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :","   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en","   travers) ; freiner ; voler expres comme un joueur ; poser des figures.","   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */","const PROFIL={","  modele:'clavier',graine:1,                 /* la main mesuree sur les joueurs au clavier (doigts.js, MAIN_CLAVIER), sans rien y ecrire par-dessus */","  chance:{prend:1,palierMin:12}              /* la seconde chance : dans les longues parties seulement (les joueurs : aux paliers 14 et 28) */","};","const REGLAGES={","  marge:10,          /* m gardes entre la ligne visee et le bord (la reference : 9, avec une main de machine) */","  bandeDecor:99,     /* m : sur une map a decor, la ligne visee ne s'ecarte pas plus de l'axe (99 = pas de limite) */","  nitroDecor:.62,    /* sur une map a decor, les seuils de virage de la nitro sont multiplies par ca (0 = jamais de nitro) */","  margeCouloir:15,   /* m gardes dans un couloir : le bord y est un mur */","  avance:.3,         /* s : on ne vise rien de plus proche (la reaction du volant : 0,2 s) */","  glisse:.12,        /* rad : la ligne visee ne se deplace pas plus vite que ce cap-la (a 115 m/s : 14 m de cote par seconde) */","  glisseUrgence:.3,  /* le meme quand la route lache : la, on ne menage plus rien */","  ligneLoin:320,     /* m : un objet de la ligne parfaite se vise jusque-la */","  piecesLoin:180,    /* m : une tranche de pieces se vise jusque-la */","  capLigne:.3,       /* rad : le cap le plus fort demande pour rejoindre la ligne */","  avanceCap:.25,     /* s : le cap prend cette avance sur le changement de lacet de la route (celui de dans 0,4 s moins celui d'ici) */","  capAvance:.25,     /* rad : l'avance ne depasse pas ca */","  braqueDoux:.15,    /* part de volant que demande un virage : en dessous, toute la largeur est permise */","  braqueFort:.5,     /* au-dessus, on se tient au moins a mi-largeur du cote INTERIEUR */","  braqueNitro:.4,    /* au-dessus, pas de nitro (.3 pour l'allumer) ; sur les maps a decor (une sortie y tue) : .25 et .18 */","  margeAllumer:.3,   /* part de ma vitesse : vSure doit la depasser d'autant pour ALLUMER la nitro… */","  margeTenir:.1,     /* …et d'autant pour la GARDER */","  jaugeAllume:.45,   /* jauge + reserve au-dessus de laquelle la nitro s'allume… */","  jaugeCoupe:.25,    /* …et en dessous de laquelle elle se coupe (le fond garde pour planer en vol) */","  capMax:.22,        /* rad : au-dela, la caisse est de travers, pas de nitro */","  bascule:10,        /* points qu'un rayon doit avoir de plus que la facon tenue pour qu'on en change */","  tenirFacon:.35,    /* s au moins sur une facon avant d'en changer (sauf si elle mene a la mort) */","  derive:.3          /* s : apres la pose, la caisse glisse dans son axe ce temps-la avant que le volant morde */","};","const cl=(v,a,b)=>v\u003ca?a:v>b?b:v;","const cote=o=>o.latC!=null?o.latC:o.lat;     /* sous la dalle, le lat des pieces, fruits et orbes est en miroir : latC */","","/* ---------- AU SOL ---------- */","/* ce qu'on vise : l'objet de la ligne parfaite s'il est proche et a portee, sinon la premiere tranche de pieces a portee, sinon un pouvoir */","function aRamasser(v,max){","  const R=REGLAGES,dmin=Math.max(15,v.vitesse*R.avance);","  const prend=(d,lat)=>d>=dmin&&Math.abs(lat)\u003c=max&&Math.abs(lat-v.lat)\u003cMath.max(3,(d-v.vitesse*.25)*R.glisse*.85);","  const L=v.ligne&&Array.isArray(v.ligne.objets)?v.ligne.objets:[];","  const obj=L.find(o=>o.d\u003cR.ligneLoin&&prend(o.d,o.lat));","  const P=Array.isArray(v.piecesDevant)?v.piecesDevant:[];","  const file=P.find(p=>p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));","  const O=Array.isArray(v.orbes)?v.orbes:[];","  const orbe=O.find(o=>o.d\u003c220&&prend(o.d,cote(o)));","  /* l'objet de la ligne d'abord quand il est le plus proche ou qu'il arrive dans 1,2 s ; les pieces sinon (elles font le palier) */","  if(obj&&(!file||obj.d\u003c=file.d+10||obj.d\u003cv.vitesse*1.2))return obj.lat;","  if(orbe&&(!file||orbe.d\u003c=file.d+10))return cote(orbe);","  if(file)return cote(file);","  if(obj)return obj.lat;","  return null;","}","/* DE COMBIEN LA ROUTE AURA TOURNE a d metres devant (rad, + a gauche) : vue.route le donne a 30, 60, 100, 150, 220… m ; entre deux, en ligne droite */","function tourne(v,d){","  const rt=Array.isArray(v.route)?v.route:[];","  let d0=0,a0=0;","  for(const p of rt){if(!p)continue;if(d\u003c=p.d)return a0+(p.virage-a0)*(d-d0)/Math.max(1,p.d-d0);d0=p.d;a0=p.virage;}","  return a0;","}","/* LE LACET DE LA ROUTE DANS t SECONDES (rad/s) : ce que la main devra suivre a ce moment-la. La loi `ligne` de la main ne connait que le lacet","   sous les roues, percu 0,15 s plus tard : dans un S, elle braque encore a droite quand la route est deja repartie a gauche (MESURE, tour 3,","   canyon : cap −0,6 rad en 0,4 s au changement de sens, la paroi 0,5 s apres). C'est au pilote de voir le virage d'apres. */","function lacetDans(v,t,vit){return (tourne(v,vit*(t+.15))-tourne(v,vit*Math.max(0,t-.15)))/(t\u003c.15?t+.15:.3);}","const DECOR={canyon:1,grotte:1,jade:1,ville:1};   /* les maps ou une sortie par le bord finit contre le decor */","function auSol(v,m){","  const R=REGLAGES,vg=v.virage,tn=v.tenue,vit=Math.max(6,v.vitesse),lmax=Math.max(.05,v.lacetMax||1);","  const couloir=(v.mur&&v.mur.ici)||(Array.isArray(v.couloirs)&&v.couloirs.some(c=>c.d0\u003cvit*2&&c.d1>0));","  const decor=!!DECOR[v.carte],max=Math.min(decor?R.bandeDecor:99,v.demi-(couloir?R.margeCouloir:R.marge));","  /* ce qui se ramasse a portee, sinon le milieu */","  let cible=0;","  const but=aRamasser(v,max);","  if(but!=null)cible=but;","  /* LA PLACE DANS LE VIRAGE : plus il demande de volant, plus la ligne reste du cote interieur — du virage QUI VIENT (dans 1 s, puis dans","     0,4 s) avant celui qu'on quitte : dans un S, l'interieur du premier est l'exterieur du second */","  const lIci=v.lacetRoute||0,lTot=lacetDans(v,.4,vit),lTard=lacetDans(v,1,vit);","  let lFort=lTard;","  if(Math.abs(lTot)>Math.abs(lFort))lFort=lTot;","  if(Math.abs(lIci)*.6>Math.abs(lFort))lFort=lIci;","  const force=Math.abs(lFort)/lmax,sens=lFort>0?1:-1,u=cl((force-R.braqueDoux)/(R.braqueFort-R.braqueDoux),0,1);","  if(u>0){const plancher=max*(-1+1.5*u);if(cible*sens\u003cplancher)cible=sens*plancher;}","  /* une flaque sur la ligne : passer a cote, du cote ou il y a le plus de place */","  const F=Array.isArray(v.flaques)?v.flaques:[];","  for(const f of F){if(f.d\u003c5||f.d>160)continue;if(Math.abs(f.lat-cible)\u003cf.rayon+4)cible=f.lat+(f.lat>0?-1:1)*(f.rayon+6);}","  /* LA ROUTE NE SE TIENT PLUS (le bord dans moins de 3 s) : vers le cote oppose au bord annonce */","  const lache=!!(tn&&tn.tient===false);","  if(lache)cible=-tn.cote*max*.5;","  cible=cl(cible,-max,max);","  /* LA LIGNE GLISSE VERS SA CIBLE, elle n'y saute pas. Apres un vol, elle repart d'ou la caisse est. */","  if(m.ligne==null||m.tSol==null||v.t-m.tSol>.25)m.ligne=cl(v.lat,-max,max);","  m.tSol=v.t;","  const pas=(lache?R.glisseUrgence:R.glisse)*vit*.1;","  m.ligne=cl(m.ligne+cl(cible-m.ligne,-pas,pas),-max,max);","  /* LE CAP D'AVANCE : la main vise le cap (ligne − lat) / (0,9 × vitesse). On lui donne ce cap PLUS l'avance sur le virage qui arrive :","     la caisse tourne deja vers lui quand il commence, au lieu de le decouvrir 0,15 s apres. */","  let capVoulu=cl((m.ligne-v.lat)/(.9*vit),-R.capLigne,R.capLigne)+cl((lTot-lIci)*R.avanceCap,-R.capAvance,R.capAvance);","  if(v.lat>max)capVoulu=Math.min(capVoulu,-.05);else if(v.lat\u003c-max)capVoulu=Math.max(capVoulu,.05);   /* jamais vers le bord quand on y est */","  const ligne=v.lat+.9*vit*cl(capVoulu,-.4,.4);","  /* LA NITRO : partout ou elle ne met pas la caisse dehors. Jamais de travers, en glisse, en rebond, quand la route lache, ni dans un virage","     qui demande du volant ; sur les maps a decor, encore moins. */","  const pose=Math.abs(v.lat)\u003cv.demi-6&&Math.abs(v.cap)\u003cR.capMax&&!v.glisse&&!v.rebond;","  const jauge=(v.nitro||0)+(v.reserve||0);","  if(jauge>R.jaugeAllume)m.plein=true;else if(jauge\u003cR.jaugeCoupe)m.plein=false;","  const proche=!!(vg&&vg.d\u003cvit*3),margeV=proche?vg.marge/vit:9;","  const k=decor?R.nitroDecor:1,seuil=(m.nitro?R.braqueNitro:R.braqueNitro-.1)*k;","  const sur=margeV>(m.nitro?R.margeTenir:R.margeAllumer)&&Math.max(force,Math.abs(lIci)/lmax)\u003cseuil;","  m.nitro=!lache&&pose&&sur&&(v.nitroLibre||!!m.plein);","  m.facon=null;","  return {ligne:ligne,nitro:m.nitro};","}","","/* ---------- EN VOL ---------- */","/* LA LOI « VERS LA ROUTE » (README § 2 bis), recopiee : c'est elle que jouent les rayons versRoute et versRoutePlane du radar */","function versRoute(v,nitro){","  const f=v.vol,p=f.proche,o={volant:0,manche:0,nitro:nitro};","  if(!p)return o;","  if(Math.abs(p.axe)\u003c1.6)o.volant=cl((cl(-p.lat/40,-.6,.6)-p.axe)*1.6,-1,1)*(p.envers?-1:1);","  if(p.haut>10&&Math.abs(p.lat)\u003cv.demi*2){","    const air=f.air&&f.air.reste!=null?f.air.reste:f.reste,delai=p.haut/Math.max(1,p.versRoute);","    if(delai>2||delai>air-1)o.manche=p.envers?1:-1;}","  return o;","}","const FACONS={","  rien:()=>({volant:0,manche:0,nitro:false}),","  gauche:()=>({volant:1,manche:0,nitro:false}),","  droite:()=>({volant:-1,manche:0,nitro:false}),","  cabre:()=>({volant:0,manche:1,nitro:false}),","  pique:()=>({volant:0,manche:-1,nitro:false}),","  plane:()=>({volant:0,manche:0,nitro:true}),","  planeCabre:()=>({volant:0,manche:1,nitro:true}),","  versRoute:v=>versRoute(v,false),","  versRoutePlane:v=>versRoute(v,true)","};","const LONGS={rien:1,plane:1,versRoute:1,versRoutePlane:1};   /* les rayons joues jusqu'au bout de l'air : « libre » y veut dire jauge vide */","/* ce que vaut l'issue d'un rayon : 100 = une pose droite tout de suite ; sous 35 = on y reste.","   Une pose vaut par son AXE et par l'endroit ou la caisse sera 0,3 s apres (elle glisse dans son axe avant que le volant morde). MESURE (tour 2,","   29 decollages d'une course) : la moitie etaient des sorties EN CHAINE — revenue en travers (axe 0,5 a 1 rad : « propre » pour le jeu, qui","   tolere 55°), la caisse se posait et ressortait par l'autre bord dans la seconde. */","function vaut(r,long,v){","  if(!r)return -1;","  const t=+r.t||0;","  if(r.issue==='pose'){","    const axe=+r.axe||0,glisse=(+r.lat||0)+v.vitesse*Math.sin(cl(axe,-1.5,1.5))*REGLAGES.derive;","    return 100-20*Math.abs(axe)-3*t-Math.min(20,Math.max(0,Math.abs(glisse)-(v.demi-4)))-(r.propre===false?20:0);}","  if(r.issue==='portail')return 94;","  if(r.issue==='levre')return 80-3*t;","  if(r.issue==='libre'||r.issue==='coupe'){","    if(long)return 12+2*t;                                    /* rien avant la fin de l'air : la jauge vide suit */","    return 34-Math.min(20,(Math.abs(+r.haut||0)+Math.abs(+r.lat||0))/10);}   /* un rayon court : on ne sait pas ; mieux vaut finir pres de la route */","  return Math.min(30,5*t);                                    /* choc, air, fond : le plus tard possible */","}","const sauve=r=>!!r&&(r.issue==='pose'||r.issue==='levre'||r.issue==='portail');","/* LE VOL. Une facon de piloter est TENUE : la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad par seconde — changer de facon a chaque","   vue, c'est zigzaguer d'un cote a l'autre de la route jusqu'a la jauge vide (MESURE, tour 3 : deux morts « air » sur quatre courses, la caisse","   passee quatre fois au-dessus de la dalle sans s'y poser). Donc :","   · au decollage, la loi « vers la route » (la seule mesuree : 9 retours sur 10 apres une sortie par le bord) ;","   · tant que le radar dit que la facon tenue mene a une pose (ou a la levre, au portail), on n'en change pas ;","   · sinon, et pas plus souvent que toutes les 0,35 s (sauf mort annoncee dans la seconde), on prend la facon du rayon qui vaut le plus. */","function enVol(v,m){","  const R=REGLAGES,f=v.vol,Y=f.radar&&Array.isArray(f.radar.rayons)?f.radar.rayons:null;","  if(!m.facon){m.facon='versRoute';m.tFacon=v.t;}","  if(Y){","    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=m.facon.indexOf('versRoute')===0;","    /* ce que dit le radar de la facon tenue : son propre rayon, et une fois les doigts dessus depuis une reaction, le rayon `tenu` (MESURE : juste","       49 fois sur 50) — sauf pour les lois « vers la route », dont l'ordre change a chaque vue : `tenu` n'y dit que la vue du moment */","    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon),sMien=vaut(mien,true,v);","    if(!sauve(mien)&&(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))){","      let mieux=null,sMieux=-9;","      for(const nom in FACONS){","        if(nom===m.facon)continue;","        /* a issue egale : la loi vers la route d'abord, et sans nitro (un vol sans reacteur rend de la jauge) */","        const s=vaut(Y.find(x=>x&&x.m===nom),!!LONGS[nom],v)+(nom==='versRoute'?3:nom==='versRoutePlane'?2:nom==='rien'?1:0);","        if(s>sMieux){sMieux=s;mieux=nom;}}","      if(mieux&&sMieux>sMien+R.bascule){m.facon=mieux;m.tFacon=v.t;}}","  }","  const o=FACONS[m.facon](v);","  o.ensuite={ligne:0};   /* a la pose, la main lache la fleche du vol et reprend la route sans attendre la decision suivante */","  return o;","}","","module.exports={","  nom:'pilote',","  profil:PROFIL,","  REGLAGES:REGLAGES,","  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","};",""],"rejeux":[{"course":"c0003-g910407","graine":910407,"pourquoi":["champion : sa meilleure course"],"fin":"vide","t":340.25,"video":null},{"course":"c0003-g910518","graine":910518,"pourquoi":["le plus gros raccourci : 1678 m"],"fin":"tour","t":256.58,"video":null},{"course":"c0003-g910629","graine":910629,"pourquoi":["le plus long vol pose : 9.68 s"],"fin":"air","t":159.7,"video":null},{"course":"c0003-g910666","graine":910666,"pourquoi":["champion : sa course la plus courte","la pire course de la generation (la plus courte)"],"fin":"pic","t":37.2,"video":null}]},{"id":"c0004","nom":"pilote","date":"2026-11-25T15:07:33.252Z","etape":"K-haiku","generation":1,"parents":["c0003"],"modele":"claude-haiku-5-5","raison":"En vol, le pilote garde sa façon de piloter tant que le radar la donne pour une pose, mais quand elle est annoncée mortelle il attend 0,2 s au lieu de 0,35 s avant d'en changer, et il bascule dès qu'une autre façon fait mieux de 4 points au lieu de 10. Le but est de réagir plus vite quand la façon tenue mène à la mort. Le risque : des changements plus fréquents peuvent recréer le zigzag que le parent cherche à éviter.","code":"cerveaux/c0004-pilote.js","octets":16328,"jumeau":null,"jeu":"cashcar-v1627","commit":"1cb305b3d","tmax":600,"note":{"survie_mediane_s":222.5,"argent_min":9930.9,"pieces_min":312.8,"figures_min":2.11,"air_pct":18.8,"vols_min":4.81,"vol_moyen_s":2.35,"raccourcis_min":0.37,"distance_m_min":7240,"nitro_pct":29.2},"parties":6,"fins":{"air":3,"paroi":1,"roche":1,"vide":1},"cout":{"entree":62989,"sortie":15456,"euros":0.02},"courses":[[910000,240,"air",38065,9,25,3,"espace > nuages > jade > ville"],[910037,251.6,"air",24663,7,16.2,1,"grotte > jade > espace"],[910074,205,"air",12046,4,14,0,"nuages > jade > espace"],[910111,44,"paroi",2920,1,4.2,0,"canyon"],[910148,395.4,"roche",125104,20,24.5,3,"grotte > jade > espace > nuages > ville > grotte"],[910185,172.6,"vide",13795,5,9.4,1,"grotte > nuages > jade"]],"validation":null,"champion":true,"ecart":[{"t":"~","l":"…"},{"t":" ","l":"  capMax:.22,        /* rad : au-dela, la caisse est de travers, pas de nitro */","n":50},{"t":" ","l":"  bascule:10,        /* p "  /* FREIN AVANT LE VIRAGE : au-dessus de sa vitesse sure et le virage a moins d'une seconde, on freine (↑, pas ↓ : pas de drift) sans toucher","n":137},{"t":"+","l":"     au volant, pour entrer dans le virage a une vitesse qu'il tient. */","n":138},{"t":"+","l":"  const freine=!lache&&proche&&margeV\u003c-R.margeFreine&&tV\u003cR.freineTemps;","n":139},{"t":" ","l":"  m.facon=null;","n":140},{"t":"-","l":"  return {ligne:ligne,nitro:m.nitro};"},{"t":"+","l":"  const o={ligne:ligne,nitro:m.nitro};","n":141},{"t":"+","l":"  if(freine)o.manche=1;","n":142},{"t":"+","l":"  return o;","n":143},{"t":" ","l":"}","n":144},{"t":" ","l":"","n":145},{"t":"~","l":"…"},{"t":" ","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","n":219},{"t":" ","l":"};","n":220},{"t":"-","l":""}],"source":null,"rejeux":[{"course":"c0005-g910666","graine":910666,"pourquoi":["la pire course de la generation (la plus courte)"],"fin":"pic","t":37.2,"video":null}]},{"id":"c0006","nom":"pilote-ligne-nitro","date":"2026-11-25T15:17:02.771Z","etape":"K-haiku","generation":1,"parents":["c0003"],"modele":"claude-haiku-5-5","raison":"La variante donne la priorité aux fruits et plaques de la ligne parfaite sur les pièces dès qu'ils sont à peine plus loin (40 m au lieu de 10). Pendant qu'une ligne tourne, elle garde la nitro allumée plus longtemps, avec un seuil de virage plus large et une jauge d'allumage plus basse, en dehors des maps à décor. Le reste du pilote est inchangé, et le profil est celui du parent.","code":"cerveaux/c0006-pilote-ligne-nitro.js","octets":9270,"jumeau":null,"jeu":"cashcar-v1627","commit":"1cb305b3d","tmax":600,"note":{"survie_mediane_s":172,"argent_min":5070.1,"pieces_min":276.1,"figures_min":1.53,"air_pct":13.6,"vols_min":3.83,"vol_moyen_s":2.13,"raccourcis_min":0.36,"distance_m_min":7362,"nitro_pct":31.5},"parties":6,"fins":{"roche":1,"vide":2,"paroi":2,"tour":1},"cout":{"entree":62977,"sortie":8092,"euros":0},"courses":[[910000,194.6,"roche",13768,6,10.7,1,"espace > nuages > ville > grotte"],[910037,314.7,"vide",34781,9,14.4,1,"grotte > jade > espace > nuages > ville"],[910074,149.4,"paroi",14643,3,5.4,0,"nuages > jade > canyon"],[910111,119,"paroi",5840,1,7.6,1,"canyon"],[910148,288.7,"tour",24129,10,20.6,3,"grotte > jade > espace > ville"],[910185,108.2,"vide",6095,1,16.6,1,"grotte > nuages"]],"validation":null,"champion":false,"ecart":[{"t":"-","l":"/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») ====="},{"t":"-","l":"   SA STRATEGIE, EN CLAIR."},{"t":"-","l":"   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser."},{"t":"-","l":"   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main"},{"t":"-","l":"   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le"},{"t":"-","l":"   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur."},{"t":"-","l":"   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR."},{"t":"-","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,"},{"t":"-","l":"      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas."},{"t":"-","l":"   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se"},{"t":"-","l":"      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne"},{"t":"-","l":"      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence."},{"t":"-","l":"   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et"},{"t":"-","l":"      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :"},{"t":"-","l":"      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir."},{"t":"-","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la"},{"t":"-","l":"      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :"},{"t":"-","l":"      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon"},{"t":"-","l":"      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard."},{"t":"-","l":"      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose."},{"t":"-","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein."},{"t":"-","l":"   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :"},{"t":"-","l":"   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en"},{"t":"-","l":"   travers) ; freiner ; voler expres comme un joueur ; poser des figures."},{"t":"-","l":"   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */"},{"t":"+","l":"/* ===== PILOTE, variante c0004 : LA LIGNE PARFAITE ET LA NITRO =====","n":1},{"t":"+","l":"   Le parent vise la ligne parfaite (fruit, plaque, fruit…) quand elle est a peine plus proche que la premiere tranche de pieces, et il","n":2},{"t":"+","l":"   coupe la nitro des qu'un virage demande un peu de volant. Un joueur, lui, tient la nitro en prenant la ligne : chaque fruit et chaque","n":3},{"t":"+","l":"   plaque la recharge (1,15 de nitro rendue par objet, contre 0,8 perdu par seconde nitro tenue). Cette variante fait deux choses, et","n":4},{"t":"+","l":"   une seule idee : tenir la ligne, et tenir la nitro avec elle.","n":5},{"t":"+","l":"   1. LA LIGNE D'ABORD : un objet de la ligne se prend tant qu'il n'est pas plus de 40 m plus loin que la premiere piece (10 m avant).","n":6},{"t":"+","l":"   2. LA NITRO PENDANT LA LIGNE : quand un objet de la ligne est a moins de 90 m, sur une map sans decor, la nitro se rallume des que la","n":7},{"t":"+","l":"      jauge passe 0,30 (au lieu de 0,45) et tient dans des virages un peu plus marques (seuil x1,5). Les maps a decor gardent le reglage du parent.","n":8},{"t":"+","l":"   Le reste (la route, le virage d'apres, le radar en vol, la seconde chance) est celui du parent. La main reste celle du parent. */","n":9},{"t":" ","l":"const PROFIL={","n":10},{"t":"-","l":"  modele:'clavier',graine:1,                 /* la main mesuree sur les joueurs au clavier (doigts.js, MAIN_CLAVIER), sans rien y ecrire par-dessus */"},{"t":"-","l":"  chance:{prend:1,palierMin:12}              /* la seconde chance : dans les longues parties seulement (les joueurs : aux paliers 14 et 28) */"},{"t":"+","l":"  modele:'clavier',graine:1,","n":11},{"t":"+","l":"  chance:{prend:1,palierMin:12}","n":12},{"t":" ","l":"};","n":13},{"t":" ","l":"const REGLAGES={","n":14},{"t":"-","l":"  marge:10,          /* m gardes entre la ligne visee et le bord (la reference : 9, avec une main de machine) */"},{"t":"-","l":"  bandeDecor:99,     /* m : sur une map a decor, la ligne visee ne s'ecarte pas plus de l'axe (99 = pas de limite) */"},{"t":"-","l":"  nitroDecor:.62,    /* sur une map a decor, les seuils de virage de la nitro sont multiplies par ca (0 = jamais de nitro) */"},{"t":"-","l":"  margeCouloir:15,   /* m gardes dans un couloir : le bord y est un mur */"},{"t":"-","l":"  avance:.3,         /* s : on ne vise rien de plus proche (la reaction du volant : 0,2 s) */"},{"t":"-","l":"  glisse:.12,        /* rad : la ligne visee ne se deplace pas plus vite que ce cap-la (a 115 m/s : 14 m de cote par seconde) */"},{"t":"-","l":"  glisseUrgence:.3,  /* le meme quand la route lache : la, on ne menage plus rien */"},{"t":"-","l":"  ligneLoin:320,     /* m : un objet de la ligne parfaite se vise jusque-la */"},{"t":"-","l":"  piecesLoin:180,    /* m : une tranche de pieces se vise jusque-la */"},{"t":"-","l":"  capLigne:.3,       /* rad : le cap le plus fort demande pour rejoindre la ligne */"},{"t":"-","l":"  avanceCap:.25,     /* s : le cap prend cette avance sur le changement de lacet de la route (celui de dans 0,4 s moins celui d'ici) */"},{"t":"-","l":"  capAvance:.25,     /* rad : l'avance ne depasse pas ca */"},{"t":"-","l":"  braqueDoux:.15,    /* part de volant que demande un virage : en dessous, toute la largeur est permise */"},{"t":"-","l":"  braqueFort:.5,     /* au-dessus, on se tient au moins a mi-largeur du cote INTERIEUR */"},{"t":"-","l":"  braqueNitro:.4,    /* au-dessus, pas de nitro (.3 pour l'allumer) ; sur les maps a decor (une sortie y tue) : .25 et .18 */"},{"t":"-","l":"  margeAllumer:.3,   /* part de ma vitesse : vSure doit la depasser d'autant pour ALLUMER la nitro… */"},{"t":"-","l":"  margeTenir:.1,     /* …et d'autant pour la GARDER */"},{"t":"-","l":"  jaugeAllume:.45,   /* jauge + reserve au-dessus de laquelle la nitro s'allume… */"},{"t":"-","l":"  jaugeCoupe:.25,    /* …et en dessous de laquelle elle se coupe (le fond garde pour planer en vol) */"},{"t":"-","l":"  capMax:.22,        /* rad : au-dela, la caisse est de travers, pas de nitro */"},{"t":"-","l":"  bascule:10,        /* points qu'un rayon doit avoir de plus que la facon tenue pour qu'on en change */"},{"t":"-","l":"  tenirFacon:.35,    /* s au moins sur une facon avant d'en changer (sauf si elle mene a la mort) */"},{"t":"-","l":"  derive:.3          /* s : apres la pose, la caisse glisse dans son axe ce temps-la avant que le volant morde */"},{"t":"+","l":"  marge:10,","n":15},{"t":"+","l":"  bandeDecor:99,","n":16},{"t":"+","l":"  nitroDecor:.62,","n":17},{"t":"+","l":"  margeCouloir:15,","n":18},{"t":"+","l":"  avance:.3,","n":19},{"t":"+","l":"  glisse:.12,","n":20},{"t":"+","l":"  glisseUrgence:.3,","n":21},{"t":"+","l":"  ligneLoin:320,","n":22},{"t":"+","l":"  piecesLoin:180,","n":23},{"t":"+","l":"  ligneAvance:40,    /* m : un objet de la ligne se prend meme si une piece est jusqu'a 40 m plus pres */","n":24},{"t":"+","l":"  ligneNitroLoin:90, /* m : un objet de la ligne a moins de ca ouvre la nitro plus tot */","n":25},{"t":"+","l":"  ligneSeuil:1.5,    /* multiplie le seuil de virage de la nitro pendant une ligne (hors decor) */","n":26},{"t":"+","l":"  jaugeLigne:.3,     /* jauge + reserve pour rallumer la nitro pendant une ligne (hors decor) */","n":27},{"t":"+","l":"  capLigne:.3,","n":28},{"t":"+","l":"  avanceCap:.25,","n":29},{"t":"+","l":"  capAvance:.25,","n":30},{"t":"+","l":"  braqueDoux:.15,","n":31},{"t":"+","l":"  braqueFort:.5,","n":32},{"t":"+","l":"  braqueNitro:.4,","n":33},{"t":"+","l":"  margeAllumer:.3,","n":34},{"t":"+","l":"  margeTenir:.1,","n":35},{"t":"+","l":"  jaugeAllume:.45,","n":36},{"t":"+","l":"  jaugeCoupe:.25,","n":37},{"t":"+","l":"  capMax:.22,","n":38},{"t":"+","l":"  bascule:10,","n":39},{"t":"+","l":"  tenirFacon:.35,","n":40},{"t":"+","l":"  derive:.3","n":41},{"t":" ","l":"};","n":42},{"t":" ","l":"const cl=(v,a,b)=>v\u003ca?a:v>b?b:v;","n":43},{"t":"-","l":"const cote=o=>o.latC!=null?o.latC:o.lat;     /* sous la dalle, le lat des pieces, fruits et orbes est en miroir : latC */"},{"t":"+","l":"const cote=o=>o.latC!=null?o.latC:o.lat;","n":44},{"t":" ","l":"","n":45},{"t":" ","l":"/* ---------- AU SOL ---------- */","n":46},{"t":"~","l":"…"},{"t":" ","l":"  const prend=(d,lat)=>d>=dmin&&Math.abs(lat)\u003c=max&&Math.abs(lat-v.lat)\u003cMath.max(3,(d-v.vitesse*.25)*R.glisse*.85);","n":50},{"t":" ","l":"  const L=v.ligne&&Array.isArray(v.ligne.objets)?v.ligne.objets:[];","n":51},{"t":"-","l":"  const obj=L.find(o=>o.d\u003cR.ligneLoin&&prend(o.d,o.lat));"},{"t":"+","l":"  const obj=L.find(o=>o&&o.d\u003cR.ligneLoin&&prend(o.d,o.lat));","n":52},{"t":" ","l":"  const P=Array.isArray(v.piecesDevant)?v.piecesDevant:[];","n":53},{"t":"-","l":"  const file=P.find(p=>p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));"},{"t":"+","l":"  const file=P.find(p=>p&&p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));","n":54},{"t":" ","l":"  const O=Array.isArray(v.orbes)?v.orbes:[];","n":55},{"t":"-","l":"  const orbe=O.find(o=>o.d\u003c220&&prend(o.d,cote(o)));"},{"t":"-","l":"  /* l'objet de la ligne d'abord quand il est le plus proche ou qu'il arrive dans 1,2 s ; les pieces sinon (elles font le palier) */"},{"t":"-","l":"  if(obj&&(!file||obj.d\u003c=file.d+10||obj.d\u003cv.vitesse*1.2))return obj.lat;"},{"t":"+","l":"  const orbe=O.find(o=>o&&o.d\u003c220&&prend(o.d,cote(o)));","n":56},{"t":"+","l":"  /* la ligne d'abord : un objet de la ligne se prend tant qu'il n'est pas trop loin derriere la premiere piece */","n":57},{"t":"+","l":"  if(obj&&(!file||obj.d\u003c=file.d+R.ligneAvance||obj.d\u003cv.vitesse*1.2))return obj.lat;","n":58},{"t":" ","l":"  if(orbe&&(!file||orbe.d\u003c=file.d+10))return cote(orbe);","n":59},{"t":" ","l":"  if(file)return cote(file);","n":60},{"t":"~","l":"…"},{"t":" ","l":"  return null;","n":62},{"t":" ","l":"}","n":63},{"t":"-","l":"/* DE COMBIEN LA ROUTE AURA TOURNE a d metres devant (rad, + a gauche) : vue.route le donne a 30, 60, 100, 150, 220… m ; entre deux, en ligne droite */"},{"t":"+","l":"/* une ligne parfaite tourne dans les 90 m : la nitro peut revenir plus tot (l'objet suivant la rechargera) */","n":64},{"t":"+","l":"function ligneProche(v){","n":65},{"t":"+","l":"  const L=v.ligne&&Array.isArray(v.ligne.objets)?v.ligne.objets:[];","n":66},{"t":"+","l":"  return L.some(o=>o&&o.d\u003cREGLAGES.ligneNitroLoin&&Math.abs(o.lat)\u003cv.demi);","n":67},{"t":"+","l":"}","n":68},{"t":"+","l":"/* DE COMBIEN LA ROUTE AURA TOURNE a d metres devant (rad, + a gauche) */","n":69},{"t":" ","l":"function tourne(v,d){","n":70},{"t":" ","l":"  const rt=Array.isArray(v.route)?v.route:[];","n":71},{"t":"~","l":"…"},{"t":" ","l":"  return a0;","n":74},{"t":" ","l":"}","n":75},{"t":"-","l":"/* LE LACET DE LA ROUTE DANS t SECONDES (rad/s) : ce que la main devra suivre a ce moment-la. La loi `ligne` de la main ne connait que le lacet"},{"t":"-","l":"   sous les roues, percu 0,15 s plus tard : dans un S, elle braque encore a droite quand la route est deja repartie a gauche (MESURE, tour 3,"},{"t":"-","l":"   canyon : cap −0,6 rad en 0,4 s au changement de sens, la paroi 0,5 s apres). C'est au pilote de voir le virage d'apres. */"},{"t":"+","l":"/* LE LACET DE LA ROUTE DANS t SECONDES (rad/s) */","n":76},{"t":" ","l":"function lacetDans(v,t,vit){return (tourne(v,vit*(t+.15))-tourne(v,vit*Math.max(0,t-.15)))/(t\u003c.15?t+.15:.3);}","n":77},{"t":"-","l":"const DECOR={canyon:1,grotte:1,jade:1,ville:1};   /* les maps ou une sortie par le bord finit contre le decor */"},{"t":"+","l":"const DECOR={canyon:1,grotte:1,jade:1,ville:1};","n":78},{"t":" ","l":"function auSol(v,m){","n":79},{"t":" ","l":"  const R=REGLAGES,vg=v.virage,tn=v.tenue,vit=Math.max(6,v.vitesse),lmax=Math.max(.05,v.lacetMax||1);","n":80},{"t":"~","l":"…"},{"t":" ","l":"  const but=aRamasser(v,max);","n":85},{"t":" ","l":"  if(but!=null)cible=but;","n":86},{"t":"-","l":"  /* LA PLACE DANS LE VIRAGE : plus il demande de volant, plus la ligne reste du cote interieur — du virage QUI VIENT (dans 1 s, puis dans"},{"t":"-","l":"     0,4 s) avant celui qu'on quitte : dans un S, l'interieur du premier est l'exterieur du second */"},{"t":"+","l":"  /* la place dans le virage : celui qui vient, pas celui qu'on quitte */","n":87},{"t":" ","l":"  const lIci=v.lacetRoute||0,lTot=lacetDans(v,.4,vit),lTard=lacetDans(v,1,vit);","n":88},{"t":" ","l":"  let lFort=lTard;","n":89},{"t":"~","l":"…"},{"t":" ","l":"  const force=Math.abs(lFort)/lmax,sens=lFort>0?1:-1,u=cl((force-R.braqueDoux)/(R.braqueFort-R.braqueDoux),0,1);","n":92},{"t":" ","l":"  if(u>0){const plancher=max*(-1+1.5*u);if(cible*sens\u003cplancher)cible=sens*plancher;}","n":93},{"t":"-","l":"  /* une flaque sur la ligne : passer a cote, du cote ou il y a le plus de place */"},{"t":"+","l":"  /* une flaque sur la ligne : passer a cote */","n":94},{"t":" ","l":"  const F=Array.isArray(v.flaques)?v.flaques:[];","n":95},{"t":" ","l":"  for(const f of F){if(f.d\u003c5||f.d>160)continue;if(Math.abs(f.lat-cible)\u003cf.rayon+4)cible=f.lat+(f.lat>0?-1:1)*(f.rayon+6);}","n":96},{"t":"-","l":"  /* LA ROUTE NE SE TIENT PLUS (le bord dans moins de 3 s) : vers le cote oppose au bord annonce */"},{"t":"+","l":"  /* la route ne se tient plus : vers le cote oppose au bord */","n":97},{"t":" ","l":"  const lache=!!(tn&&tn.tient===false);","n":98},{"t":" ","l":"  if(lache)cible=-tn.cote*max*.5;","n":99},{"t":" ","l":"  cible=cl(cible,-max,max);","n":100},{"t":"-","l":"  /* LA LIGNE GLISSE VERS SA CIBLE, elle n'y saute pas. Apres un vol, elle repart d'ou la caisse est. */"},{"t":"+","l":"  /* la ligne glisse vers sa cible */","n":101},{"t":" ","l":"  if(m.ligne==null||m.tSol==null||v.t-m.tSol>.25)m.ligne=cl(v.lat,-max,max);","n":102},{"t":" ","l":"  m.tSol=v.t;","n":103},{"t":" ","l":"  const pas=(lache?R.glisseUrgence:R.glisse)*vit*.1;","n":104},{"t":" ","l":"  m.ligne=cl(m.ligne+cl(cible-m.ligne,-pas,pas),-max,max);","n":105},{"t":"-","l":"  /* LE CAP D'AVANCE : la main vise le cap (ligne − lat) / (0,9 × vitesse). On lui donne ce cap PLUS l'avance sur le virage qui arrive :"},{"t":"-","l":"     la caisse tourne deja vers lui quand il commence, au lieu de le decouvrir 0,15 s apres. */"},{"t":"+","l":"  /* le cap d'avance sur le virage qui arrive */","n":106},{"t":" ","l":"  let capVoulu=cl((m.ligne-v.lat)/(.9*vit),-R.capLigne,R.capLigne)+cl((lTot-lIci)*R.avanceCap,-R.capAvance,R.capAvance);","n":107},{"t":"-","l":"  if(v.lat>max)capVoulu=Math.min(capVoulu,-.05);else if(v.lat\u003c-max)capVoulu=Math.max(capVoulu,.05);   /* jamais vers le bord quand on y est */"},{"t":"+","l":"  if(v.lat>max)capVoulu=Math.min(capVoulu,-.05);else if(v.lat\u003c-max)capVoulu=Math.max(capVoulu,.05);","n":108},{"t":" ","l":"  const ligne=v.lat+.9*vit*cl(capVoulu,-.4,.4);","n":109},{"t":"-","l":"  /* LA NITRO : partout ou elle ne met pas la caisse dehors. Jamais de travers, en glisse, en rebond, quand la route lache, ni dans un virage"},{"t":"-","l":"     qui demande du volant ; sur les maps a decor, encore moins. */"},{"t":"+","l":"  /* LA NITRO : la ou elle ne met pas la caisse dehors */","n":110},{"t":" ","l":"  const pose=Math.abs(v.lat)\u003cv.demi-6&&Math.abs(v.cap)\u003cR.capMax&&!v.glisse&&!v.rebond;","n":111},{"t":" ","l":"  const jauge=(v.nitro||0)+(v.reserve||0);","n":112},{"t":"-","l":"  if(jauge>R.jaugeAllume)m.plein=true;else if(jauge\u003cR.jaugeCoupe)m.plein=false;"},{"t":"+","l":"  /* pendant une ligne parfaite (hors decor) : la nitro se rallume plus tot, et tient dans des virages plus marques ;","n":113},{"t":"+","l":"     chaque objet pris la recharge, donc la jauge remonte sur la ligne */","n":114},{"t":"+","l":"  const enLigne=!decor&&ligneProche(v);","n":115},{"t":"+","l":"  const jaugeOn=enLigne?R.jaugeLigne:R.jaugeAllume;","n":116},{"t":"+","l":"  if(jauge>jaugeOn)m.plein=true;else if(jauge\u003cR.jaugeCoupe)m.plein=false;","n":117},{"t":" ","l":"  const proche=!!(vg&&vg.d\u003cvit*3),margeV=proche?vg.marge/vit:9;","n":118},{"t":"-","l":"  const k=decor?R.nitroDecor:1,seuil=(m.nitro?R.braqueNitro:R.braqueNitro-.1)*k;"},{"t":"+","l":"  const k=decor?R.nitroDecor:(enLigne?R.ligneSeuil:1),seuil=(m.nitro?R.braqueNitro:R.braqueNitro-.1)*k;","n":119},{"t":" ","l":"  const sur=margeV>(m.nitro?R.margeTenir:R.margeAllumer)&&Math.max(force,Math.abs(lIci)/lmax)\u003cseuil;","n":120},{"t":" ","l":"  m.nitro=!lache&&pose&&sur&&(v.nitroLibre||!!m.plein);","n":121},{"t":"~","l":"…"},{"t":" ","l":"","n":125},{"t":" ","l":"/* ---------- EN VOL ---------- */","n":126},{"t":"-","l":"/* LA LOI « VERS LA ROUTE » (README § 2 bis), recopiee : c'est elle que jouent les rayons versRoute et versRoutePlane du radar */"},{"t":" ","l":"function versRoute(v,nitro){","n":127},{"t":" ","l":"  const f=v.vol,p=f.proche,o={volant:0,manche:0,nitro:nitro};","n":128},{"t":"~","l":"…"},{"t":" ","l":"  versRoutePlane:v=>versRoute(v,true)","n":145},{"t":" ","l":"};","n":146},{"t":"-","l":"const LONGS={rien:1,plane:1,versRoute:1,versRoutePlane:1};   /* les rayons joues jusqu'au bout de l'air : « libre » y veut dire jauge vide */"},{"t":"-","l":"/* ce que vaut l'issue d'un rayon : 100 = une pose droite tout de suite ; sous 35 = on y reste."},{"t":"-","l":"   Une pose vaut par son AXE et par l'endroit ou la caisse sera 0,3 s apres (elle glisse dans son axe avant que le volant morde). MESURE (tour 2,"},{"t":"-","l":"   29 decollages d'une course) : la moitie etaient des sorties EN CHAINE — revenue en travers (axe 0,5 a 1 rad : « propre » pour le jeu, qui"},{"t":"-","l":"   tolere 55°), la caisse se posait et ressortait par l'autre bord dans la seconde. */"},{"t":"+","l":"const LONGS={rien:1,plane:1,versRoute:1,versRoutePlane:1};","n":147},{"t":" ","l":"function vaut(r,long,v){","n":148},{"t":" ","l":"  if(!r)return -1;","n":149},{"t":"~","l":"…"},{"t":" ","l":"  if(r.issue==='levre')return 80-3*t;","n":155},{"t":" ","l":"  if(r.issue==='libre'||r.issue==='coupe'){","n":156},{"t":"-","l":"    if(long)return 12+2*t;                                    /* rien avant la fin de l'air : la jauge vide suit */"},{"t":"-","l":"    return 34-Math.min(20,(Math.abs(+r.haut||0)+Math.abs(+r.lat||0))/10);}   /* un rayon court : on ne sait pas ; mieux vaut finir pres de la route */"},{"t":"-","l":"  return Math.min(30,5*t);                                    /* choc, air, fond : le plus tard possible */"},{"t":"+","l":"    if(long)return 12+2*t;","n":157},{"t":"+","l":"    return 34-Math.min(20,(Math.abs(+r.haut||0)+Math.abs(+r.lat||0))/10);}","n":158},{"t":"+","l":"  return Math.min(30,5*t);","n":159},{"t":" ","l":"}","n":160},{"t":" ","l":"const sauve=r=>!!r&&(r.issue==='pose'||r.issue==='levre'||r.issue==='portail');","n":161},{"t":"-","l":"/* LE VOL. Une facon de piloter est TENUE : la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad par seconde — changer de facon a chaque"},{"t":"-","l":"   vue, c'est zigzaguer d'un cote a l'autre de la route jusqu'a la jauge vide (MESURE, tour 3 : deux morts « air » sur quatre courses, la caisse"},{"t":"-","l":"   passee quatre fois au-dessus de la dalle sans s'y poser). Donc :"},{"t":"-","l":"   · au decollage, la loi « vers la route » (la seule mesuree : 9 retours sur 10 apres une sortie par le bord) ;"},{"t":"-","l":"   · tant que le radar dit que la facon tenue mene a une pose (ou a la levre, au portail), on n'en change pas ;"},{"t":"-","l":"   · sinon, et pas plus souvent que toutes les 0,35 s (sauf mort annoncee dans la seconde), on prend la facon du rayon qui vaut le plus. */"},{"t":" ","l":"function enVol(v,m){","n":162},{"t":" ","l":"  const R=REGLAGES,f=v.vol,Y=f.radar&&Array.isArray(f.radar.rayons)?f.radar.rayons:null;","n":163},{"t":"~","l":"…"},{"t":" ","l":"  if(Y){","n":165},{"t":" ","l":"    const tenu=Y.find(x=>x&&x.m==='tenu'),depuis=v.t-m.tFacon,loi=m.facon.indexOf('versRoute')===0;","n":166},{"t":"-","l":"    /* ce que dit le radar de la facon tenue : son propre rayon, et une fois les doigts dessus depuis une reaction, le rayon `tenu` (MESURE : juste"},{"t":"-","l":"       49 fois sur 50) — sauf pour les lois « vers la route », dont l'ordre change a chaque vue : `tenu` n'y dit que la vue du moment */"},{"t":" ","l":"    const mien=!loi&&tenu&&depuis>.45?tenu:Y.find(x=>x&&x.m===m.facon),sMien=vaut(mien,true,v);","n":167},{"t":" ","l":"    if(!sauve(mien)&&(depuis>R.tenirFacon||(mien&&(+mien.t||0)\u003c1))){","n":168},{"t":"~","l":"…"},{"t":" ","l":"      for(const nom in FACONS){","n":170},{"t":" ","l":"        if(nom===m.facon)continue;","n":171},{"t":"-","l":"        /* a issue egale : la loi vers la route d'abord, et sans nitro (un vol sans reacteur rend de la jauge) */"},{"t":" ","l":"        const s=vaut(Y.find(x=>x&&x.m===nom),!!LONGS[nom],v)+(nom==='versRoute'?3:nom==='versRoutePlane'?2:nom==='rien'?1:0);","n":172},{"t":" ","l":"        if(s>sMieux){sMieux=s;mieux=nom;}}","n":173},{"t":"~","l":"…"},{"t":" ","l":"  }","n":175},{"t":" ","l":"  const o=FACONS[m.facon](v);","n":176},{"t":"-","l":"  o.ensuite={ligne:0};   /* a la pose, la main lache la fleche du vol et reprend la route sans attendre la decision suivante */"},{"t":"+","l":"  o.ensuite={ligne:0};","n":177},{"t":" ","l":"  return o;","n":178},{"t":" ","l":"}","n":179},{"t":" ","l":"","n":180},{"t":" ","l":"module.exports={","n":181},{"t":"-","l":"  nom:'pilote',"},{"t":"+","l":"  nom:'pilote-ligne-nitro',","n":182},{"t":" ","l":"  profil:PROFIL,","n":183},{"t":" ","l":"  REGLAGES:REGLAGES,","n":184},{"t":" ","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","n":185},{"t":" ","l":"};","n":186},{"t":"-","l":""}],"source":null,"rejeux":[]},{"id":"c0007","nom":"pilote-fil","date":"2026-11-25T15:17:03.202Z","etape":"K-haiku","generation":1,"parents":["c0003"],"modele":"claude-haiku-5-5","raison":"Cette variante ne touche qu'au choix de la cible au sol : les pièces passent avant les fruits et les plaques, qui ne rapportent aucune pièce, et la ligne parfaite ne fait dévier que si son objet est sur le chemin du fil. Le fil des pièces est aussi visé plus loin à grande vitesse. La main, le profil et le reste du pilote sont inchangés.","code":"cerveaux/c0007-pilote-fil.js","octets":14088,"jumeau":null,"jeu":"cashcar-v1627","commit":"1cb305b3d","tmax":600,"note":{"survie_mediane_s":149,"argent_min":6049.4,"pieces_min":288,"figures_min":1.35,"air_pct":11.4,"vols_min":3.5,"vol_moyen_s":1.95,"raccourcis_min":0.18,"distance_m_min":6976,"nitro_pct":29.3},"parties":6,"fins":{"tour":1,"pic":1,"roche":1,"paroi":1,"vide":1,"air":1},"cout":{"entree":62976,"sortie":9816,"euros":0.01},"courses":[[910000,133.3,"tour",7187,2,6.3,1,"espace > nuages > ville"],[910037,111.5,"pic",4485,2,8.7,1,"grotte > jade"],[910074,250.7,"roche",25278,12,18.2,1,"nuages > jade > espace > grotte"],[910111,69.4,"paroi",3502,0,3.2,0,"canyon"],[910148,164.7,"vide",8777,1,7.6,0,"grotte > jade"],[910185,246.9,"air",49225,5,11.5,0,"grotte > nuages > ville > canyon"]],"validation":null,"champion":false,"ecart":[{"t":"-","l":"/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») ====="},{"t":"-","l":"   SA STRATEGIE, EN CLAIR."},{"t":"-","l":"   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser."},{"t":"-","l":"   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main"},{"t":"-","l":"   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le"},{"t":"-","l":"   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur."},{"t":"-","l":"   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR."},{"t":"-","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,"},{"t":"-","l":"      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas."},{"t":"-","l":"   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se"},{"t":"-","l":"      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne"},{"t":"-","l":"      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence."},{"t":"-","l":"   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et"},{"t":"-","l":"      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :"},{"t":"-","l":"      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir."},{"t":"-","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la"},{"t":"-","l":"      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :"},{"t":"-","l":"      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon"},{"t":"-","l":"      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard."},{"t":"-","l":"      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose."},{"t":"-","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein."},{"t":"-","l":"   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :"},{"t":"-","l":"   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en"},{"t":"-","l":"   travers) ; freiner ; voler expres comme un joueur ; poser des figures."},{"t":"-","l":"   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */"},{"t":"+","l":"/* ===== VARIANTE « LE FIL DES PIECES » (boucle, c0004 — parent c0003) =====","n":1},{"t":"+","l":"   UNE SEULE IDEE : le palier se compte en pieces, et seules les pieces et les figures en donnent. Le parent","n":2},{"t":"+","l":"   prenait un fruit ou une plaque de la ligne parfaite des qu'il etait proche, meme loin du fil des pieces :","n":3},{"t":"+","l":"   la nitro se gagne, mais aucune piece ; et il ne visait les pieces qu'a 180 m, quand la caisse file a 120 m/s.","n":4},{"t":"+","l":"   Ici :","n":5},{"t":"+","l":"   1. LE FIL D'ABORD : une piece a portee se vise avant un fruit ou une plaque. Un objet de la ligne parfaite","n":6},{"t":"+","l":"      n'est pris que s'il est sur le chemin du fil (meme cote, a moins de 4 m de la piece visee, et pas plus loin).","n":7},{"t":"+","l":"   2. VISER PLUS LOIN A GRANDE VITESSE : la portee des pieces passe de 180 m a 1,8 s de route (1,8 x vitesse),","n":8},{"t":"+","l":"      pour que la ligne du fil soit prise avant le virage qui suit, et non pendant.","n":9},{"t":"+","l":"   Le profil (la main) et tout le reste de la conduite sont ceux du parent. */","n":10},{"t":" ","l":"const PROFIL={","n":11},{"t":" ","l":"  modele:'clavier',graine:1,                 /* la main mesuree sur les joueurs au clavier (doigts.js, MAIN_CLAVIER), sans rien y ecrire par-dessus */","n":12},{"t":"~","l":"…"},{"t":" ","l":"  glisseUrgence:.3,  /* le meme quand la route lache : la, on ne menage plus rien */","n":22},{"t":" ","l":"  ligneLoin:320,     /* m : un objet de la ligne parfaite se vise jusque-la */","n":23},{"t":"-","l":"  piecesLoin:180,    /* m : une tranche de pieces se vise jusque-la */"},{"t":"+","l":"  piecesLoin:180,    /* m : une tranche de pieces se vise jusque-la (au moins) */","n":24},{"t":"+","l":"  piecesVitesse:1.8, /* s : et au-dela, jusqu'a 1,8 s de route a la vitesse du moment (variante : viser le fil plus tot) */","n":25},{"t":"+","l":"  surLeFil:4,        /* m : un fruit ou une plaque n'est pris que s'il est a moins de ca du fil des pieces (variante) */","n":26},{"t":" ","l":"  capLigne:.3,       /* rad : le cap le plus fort demande pour rejoindre la ligne */","n":27},{"t":" ","l":"  avanceCap:.25,     /* s : le cap prend cette avance sur le changement de lacet de la route (celui de dans 0,4 s moins celui d'ici) */","n":28},{"t":"~","l":"…"},{"t":" ","l":"","n":44},{"t":" ","l":"/* ---------- AU SOL ---------- */","n":45},{"t":"-","l":"/* ce qu'on vise : l'objet de la ligne parfaite s'il est proche et a portee, sinon la premiere tranche de pieces a portee, sinon un pouvoir */"},{"t":"+","l":"/* ce qu'on vise : d'abord le fil des pieces (a portee, plus loin a grande vitesse) ; un fruit ou une plaque seulement","n":46},{"t":"+","l":"   s'il est sur ce fil ; sinon un pouvoir ; sinon, a defaut, la ligne parfaite seule */","n":47},{"t":" ","l":"function aRamasser(v,max){","n":48},{"t":" ","l":"  const R=REGLAGES,dmin=Math.max(15,v.vitesse*R.avance);","n":49},{"t":"~","l":"…"},{"t":" ","l":"  const obj=L.find(o=>o.d\u003cR.ligneLoin&&prend(o.d,o.lat));","n":52},{"t":" ","l":"  const P=Array.isArray(v.piecesDevant)?v.piecesDevant:[];","n":53},{"t":"-","l":"  const file=P.find(p=>p.d\u003cR.piecesLoin&&prend(p.d,cote(p)));"},{"t":"+","l":"  const portee=Math.max(R.piecesLoin,v.vitesse*R.piecesVitesse);   /* le fil se voit plus loin quand on file vite */","n":54},{"t":"+","l":"  const file=P.find(p=>p.d\u003cportee&&prend(p.d,cote(p)));","n":55},{"t":" ","l":"  const O=Array.isArray(v.orbes)?v.orbes:[];","n":56},{"t":" ","l":"  const orbe=O.find(o=>o.d\u003c220&&prend(o.d,cote(o)));","n":57},{"t":"-","l":"  /* l'objet de la ligne d'abord quand il est le plus proche ou qu'il arrive dans 1,2 s ; les pieces sinon (elles font le palier) */"},{"t":"-","l":"  if(obj&&(!file||obj.d\u003c=file.d+10||obj.d\u003cv.vitesse*1.2))return obj.lat;"},{"t":"+","l":"  /* un fruit ou une plaque sur le chemin du fil : on le prend en passant (il ne fait pas quitter le fil) */","n":58},{"t":"+","l":"  if(file&&obj&&obj.d\u003c=file.d+10&&Math.abs(obj.lat-cote(file))\u003cR.surLeFil)return obj.lat;","n":59},{"t":" ","l":"  if(orbe&&(!file||orbe.d\u003c=file.d+10))return cote(orbe);","n":60},{"t":" ","l":"  if(file)return cote(file);","n":61},{"t":"~","l":"…"},{"t":" ","l":"","n":191},{"t":" ","l":"module.exports={","n":192},{"t":"-","l":"  nom:'pilote',"},{"t":"+","l":"  nom:'pilote-fil',","n":193},{"t":" ","l":"  profil:PROFIL,","n":194},{"t":" ","l":"  REGLAGES:REGLAGES,","n":195},{"t":" ","l":"  decide:function(vue,m){return vue.mode==='sol'?auSol(vue,m):vue.mode==='vol'?enVol(vue,m):{};}","n":196},{"t":" ","l":"};","n":197},{"t":"-","l":""}],"source":null,"rejeux":[]},{"id":"c0008","nom":"pilote-canyon","date":"2026-11-25T15:17:03.529Z","etape":"K-haiku","generation":1,"parents":["c0003"],"modele":"claude-haiku-5-5","raison":"Le canyon est la map où le pilote meurt à chaque passage (5 courses sur 5, toujours contre la paroi, à 10 m du bord). Au canyon seulement, la ligne visée reste dans une bande de 6 m autour de l'axe, au lieu de 18 m, pour garder de la marge avant le bord. Le reste du pilote ne change pas.","code":"cerveaux/c0008-pilote-canyon.js","octets":13492,"jumeau":null,"jeu":"cashcar-v1627","commit":"1cb305b3d","tmax":600,"note":{"survie_mediane_s":226.3,"argent_min":9153.7,"pieces_min":299.3,"figures_min":2.26,"air_pct":16.3,"vols_min":4.93,"vol_moyen_s":1.98,"raccourcis_min":0.42,"distance_m_min":7401,"nitro_pct":29.4},"parties":6,"fins":{"paroi":1,"tour":2,"air":1,"roche":1,"vide":1},"cout":{"entree":62954,"sortie":10282,"euros":0.01},"courses":[[910000,217.2,"paroi",22859,7,9.3,1,"espace > nuages > jade > canyon"],[910037,324.3,"tour",125616,15,22.5,2,"grotte > jade > espace > nuages > ville"],[910074,235.4,"tour",12884,10,17.5,0,"nuages > jade > espace > ville"],[910111,158.5,"air",10386,2,7.1,0,"canyon > espace"],[910148,327.7,"roche",33494,15,22.3,6,"grotte > jade > espace > nuages > grotte"],[910185,172.6,"vide",13795,5,9.4,1,"grotte > nuages > jade"]],"validation":null,"champion":false,"ecart":[{"t":"-","l":"/* ===== LE PREMIER PILOTE DE L'ECURIE (2026-11-25, etape C — Sacha : « des bots du palier 1 au palier 30 qu'on ne distingue pas de vrais joueurs ») ====="},{"t":"-","l":"   SA STRATEGIE, EN CLAIR."},{"t":"-","l":"   Le palier, c'est des pieces, et les pieces, c'est du temps de course : ce pilote cherche d'abord a NE PAS MOURIR, ensuite a ramasser."},{"t":"-","l":"   Sa main est un clavier (modele `clavier`) : un ordre met 0,2 s a partir, le volant part par coups a fond de duree tiree au hasard, la main"},{"t":"-","l":"   voit la route avec 0,15 s de retard. A 400 km/h un coup long (0,3 a 0,45 s, un sur dix) tourne la caisse d'un demi-radian : elle SORT par le"},{"t":"-","l":"   bord plusieurs fois par minute, quoi que le pilote decide (MESURE sur cinq tours : 1,5 a 3,5 sorties par minute de route). Comme un joueur."},{"t":"-","l":"   Il est donc ecrit pour deux choses : sortir moins, et surtout REVENIR."},{"t":"-","l":"   1. AU SOL, LA LIGNE. Il vise ce qui se ramasse de LOIN (la ligne parfaite — fruit, plaque, fruit… — qui recharge la nitro, puis les pieces,"},{"t":"-","l":"      puis les pouvoirs), jamais un objet qui demande un coup de volant a la derniere image ; sa ligne GLISSE vers sa cible, elle n'y saute pas."},{"t":"-","l":"   2. LE VIRAGE D'APRES. La loi `ligne` de la main ne connait que le virage sous les roues. Le pilote lit la route devant (`vue.route`) : il se"},{"t":"-","l":"      place du cote INTERIEUR du virage qui vient dans une seconde (dans un S, l'interieur du premier est l'exterieur du second), et il donne"},{"t":"-","l":"      a la main un cap d'AVANCE sur le changement de sens, pour que la caisse tourne deja quand le virage commence."},{"t":"-","l":"   3. LA NITRO LA OU ELLE SERT. Demandee partout ou la route se tient (`vue.tenue`), ou le prochain virage garde de la marge (`vue.virage`) et"},{"t":"-","l":"      demande peu de volant ; coupee AVANT le virage, de travers, en glisse. Moins volontiers sur les maps a decor (canyon, grotte, jade, ville :"},{"t":"-","l":"      une sortie y finit contre un mur). Un fond de jauge est garde : c'est lui qui fait planer la caisse quand il faut revenir."},{"t":"-","l":"   4. EN VOL, LE RADAR. Au decollage : la loi « vers la route » (la seule mesuree apres une sortie par le bord). Tant que le radar annonce que la"},{"t":"-","l":"      facon tenue mene a une pose, a la levre ou au portail, il n'en change pas (la main met 0,2 a 0,3 s a obeir et le vol tourne de 3 rad/s :"},{"t":"-","l":"      changer a chaque vue, c'est zigzaguer jusqu'a la jauge vide). Si elle mene au decor, a la jauge vide ou au fond, il prend la facon du rayon"},{"t":"-","l":"      dont l'issue vaut le plus : une pose droite et qui reste sur la dalle d'abord, la levre, sinon ce qui meurt le plus tard."},{"t":"-","l":"      Il donne toujours `ensuite` : la fleche du vol est lachee des la pose."},{"t":"-","l":"   5. PAS DE RISQUE GRATUIT : ni saut, ni figure, ni raccourci cherche, ni drift, ni frein."},{"t":"-","l":"   CE QU'IL NE SAIT PAS FAIRE (pour les tours suivants) : rester sur la route au CANYON (1,5 sortie par minute, et la paroi est a 10 m du bord :"},{"t":"-","l":"   presque toutes ses courses qui y passent y meurent) ; se poser DROIT (une sortie sur trois au moins est une sortie en chaine, la caisse reposee en"},{"t":"-","l":"   travers) ; freiner ; voler expres comme un joueur ; poser des figures."},{"t":"-","l":"   La seconde chance est prise comme dans les deux meilleures parties des joueurs : une fois, dans une longue partie (palier 12 et plus). */"},{"t":"+","l":"/* ===== LE PILOTE, VARIANTE « CANYON » (etape C, variante de c0003) =====","n":1},{"t":"+","l":"   Le parent meurt au canyon a chaque passage (5 courses sur 5, toutes contre la paroi, a 10 m du bord).","n":2},{"t":"+","l":"   Idee unique : au canyon seulement, la ligne visee reste dans une bande etroite autour de l'axe (6 m au lieu de 18),","n":3},{"t":"+","l":"   pour que la caisse garde de la marge avant le bord quand elle derive. Ailleurs, rien ne change. */","n":4},{"t":" ","l":"const PROFIL={","n":5},{"t":" ","l":"  modele:'clavier',graine:1,                 /* la main mesuree sur les joueurs au clavier (doigts.js, MAIN_CLAVIER), sans rien y ecrire par-dessus */","n":6},{"t":"~","l":"…"},{"t":" ","l":"  marge:10,          /* m gardes entre la ligne visee et le bord (la reference : 9, avec une main de machine) */","n":10},{"t":" ","l":"  bandeDecor:99,     /* m : sur une map a decor, la ligne visee ne s'ecarte pas plus de l'axe (99 = pas de limite) */","n":11},{"t":"+","l":"  bandeCanyon:6,     /* m : au canyon seulement, la ligne visee reste pres de l'axe (la paroi est a 10 m du bord, le parent y meurt 5 fois sur 5) */","n":12},{"t":" ","l":"  nitroDecor:.62,    /* sur une map a decor, les seuils de virage de la nitro sont multiplies par ca (0 = jamais de nitro) */","n":13},{"t":" ","l":"  margeCouloir:15,   /* m gardes dans un couloir : le bord y est un mur */","n":14},{"t":"~","l":"…"},{"t":" ","l":"  const R=REGLAGES,vg=v.virage,tn=v.tenue,vit=Math.max(6,v.vitesse),lmax=Math.max(.05,v.lacetMax||1);","n":69},{"t":" ","l":"  const couloir=(v.mur&&v.mur.ici)||(Array.isArray(v.couloirs)&&v.couloirs.some(c=>c.d0\u003cvit*2&&c.d1>0));","n":70},{"t":"-","l":"  const decor=!!DECOR[v.carte],max=Math.min(decor?R.bandeDecor:99,v.demi-(couloir?R.margeCouloir:R.marge));"},{"t":"+","l":"  const decor=!!DECOR[v.carte];","n":71},{
