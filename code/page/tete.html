    var(--tresse),var(--laqueP);
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));
  box-shadow:inset 0 0 0 1px var(--fil),var(--levre),inset 3px 0 0 var(--fc)}

/* les TITRES D'ÉCRAN : une enseigne — penchée, blanche, auréolée de magenta, la LIVRÉE qui file dessous */
.mHead{display:flex;flex-direction:column;align-items:flex-start;gap:14px;width:100%;margin:6px 0 24px}
.mHead h3,.tpH:first-child{transform-origin:0 100%;display:flex;align-items:center;gap:14px;margin:0;font-family:var(--pix);font-weight:400;font-size:var(--f9);letter-spacing:2px;color:#fff;
  transform:skewX(var(--sk));text-shadow:0 3px 0 #2c0a33,0 0 26px rgba(255,62,200,.5)}
.mHead::after{content:'';display:block;width:96px;height:4px;margin-left:4px;transform:skewX(var(--sk));background:var(--livree);
  filter:drop-shadow(0 0 6px rgba(255,62,200,.55))}
.mHead h3::before{content:none}
/* les TITRES DE SECTION : petites capitales espacées, un filet qui file vers la droite */
.mSec,.tpH{display:flex;align-items:center;gap:12px;width:100%;margin:24px 0 10px;font-family:var(--pix);font-size:var(--f0);letter-spacing:2px;color:var(--tx3);text-align:left}
.mSec::after,.tpH::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--fil),transparent)}
/* la PAUSE a le même titre : la livrée sous le mot, pas de filet à droite */
.tpH:first-child{flex-direction:column;align-items:flex-start;gap:14px}
.tpH:first-child::after{content:'';flex:none;display:block;width:96px;height:4px;margin-left:4px;background:var(--livree);filter:drop-shadow(0 0 6px rgba(255,62,200,.55))}
.tpH:first-child::before{content:none}

/* les LIGNES de réglage (réglages + pause) : un PUITS pour l'icône (la case sombre des réglages d'un iPhone), le libellé,
   la valeur ou l'interrupteur à droite ; un filet entre deux lignes */
.mLigne,.tp.ligne{position:relative;display:flex;align-items:center;gap:16px;box-sizing:border-box;min-height:58px;padding:0 16px 0 20px;margin:0;cursor:pointer;
  font-family:var(--pix);font-size:var(--f2);letter-spacing:1px;color:var(--tx);text-align:left;border-top:1px solid rgba(255,255,255,.055);
  -webkit-tap-highlight-color:transparent;transition:background var(--t-fast) var(--ease)}
.mPanel>.mLigne:first-child,.tpPanel>.tp.ligne:first-child{border-top:0}
.mLigne:active,.tp.ligne:active,.mLigne.appui,.tp.ligne.appui{background:rgba(255,255,255,.05)}
.mLigne::before,.tp.ligne::before{content:'';position:absolute;left:16px;top:50%;width:34px;height:34px;margin-top:-17px;
  background:linear-gradient(180deg,#221c40,#151129);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  box-shadow:inset 0 0 0 1px var(--fil),inset 0 1px 0 rgba(255,255,255,.1)}
.mLigne>.pxi,.tp.ligne>.pxi{position:relative;--pxs:2;margin:0 4px 0 4px;color:var(--neoC)}
.mLigne .tpL,.tp.ligne .tpL{flex:1;min-width:0}
.mLigne.lien::after{content:'';width:9px;height:9px;flex:none;-webkit-mask:var(--pxi-droite) center/contain no-repeat;mask:var(--pxi-droite) center/contain no-repeat}
/* l'INTERRUPTEUR : une glissière penchée, le patin glisse — vert allumé, gris éteint (le mot ON/OFF est DANS la glissière) */
b.bascule{position:relative;flex:none;display:flex;align-items:center;justify-content:flex-start;box-sizing:border-box;width:72px;height:30px;padding:0 10px;
  font-family:var(--pix);font-weight:400;font-size:var(--f0);letter-spacing:1px;color:var(--neoV);transform:skewX(var(--sk));
  background:linear-gradient(180deg,#05200f,#0a3019);box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 0 0 1px #1f8a4b,0 0 16px rgba(94,227,122,.28);
  text-shadow:0 0 8px rgba(94,227,122,.6)}
b.bascule::before{content:'';position:absolute;top:3px;right:3px;width:26px;height:24px;background:linear-gradient(180deg,#e6ffec 0%,#7cf29c 45%,#3bc96a 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,70,25,.35),0 2px 0 rgba(0,0,0,.45);transition:transform var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.mLigne.off b.bascule,b.bascule.ko{justify-content:flex-end;color:var(--tx3);background:linear-gradient(180deg,#07050f,#0e0b1d);box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 0 0 1px var(--kl);text-shadow:none}
.mLigne.off b.bascule::before,b.bascule.ko::before{transform:translateX(-40px);background:linear-gradient(180deg,#3d3563 0%,#2b2549 60%,#211c3a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px var(--kl),0 2px 0 rgba(0,0,0,.45)}
/* la VALEUR : cyan, avec son chevron */
b.valeur{display:flex;align-items:center;gap:9px;flex:none;font-family:var(--pix);font-weight:400;font-size:var(--f2);color:var(--neoC);text-shadow:0 0 10px rgba(0,234,255,.4)}
b.valeur::after{content:'';width:9px;height:9px;background:currentColor;-webkit-mask:var(--pxi-droite) center/contain no-repeat;mask:var(--pxi-droite) center/contain no-repeat}
/* le CURSEUR de volume : rail penché qui se remplit de cyan jusqu'au patin */
.volRow{display:block;box-sizing:border-box;padding:0 16px 12px 70px;transition:opacity var(--t-fast) var(--ease)}
.volRow.mute,.mLigne.off+.volRow{opacity:.4;filter:grayscale(1)}
.mLigne.off+.volRow{pointer-events:none}
.volHd{display:flex;justify-content:space-between;align-items:center;font-family:var(--pix);font-size:var(--f0);letter-spacing:2px;color:var(--tx2)}
.volHd b{font-weight:400;color:var(--tx)}
.volS{-webkit-appearance:none;appearance:none;display:block;width:100%;margin:0;background:transparent;cursor:pointer;transform:skewX(var(--sk));touch-action:pan-y}
.volS::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,#0a8fa8 0,var(--neoC) var(--v,50%),var(--k0) var(--v,50%));box-shadow:0 0 0 1px var(--kl),0 0 12px rgba(0,234,255,.18)}
.volS::-moz-range-track{height:6px;background:linear-gradient(90deg,#0a8fa8 0,var(--neoC) var(--v,50%),var(--k0) var(--v,50%));box-shadow:0 0 0 1px var(--kl)}
.volS::-webkit-slider-thumb{-webkit-appearance:none;border-radius:0}
.volS::-moz-range-thumb{width:16px;height:26px;border:0;border-radius:0;box-shadow:0 0 0 1px var(--anneau)}

/* ============================================ LA COQUE (téléphone) =================================================== */
body.touch #overlay{-webkit-backdrop-filter:none;backdrop-filter:none;justify-content:flex-start;align-items:stretch;gap:0;padding:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:transparent;animation:k4Voile var(--t-slow) var(--ease) both}
#mob{display:none}                                           /* hors téléphone (menu desktop, ?pc=1) : la coque n'existe pas */
body.touch #overlay>*{display:none!important}                /* le menu desktop n'existe pas ici */
body.touch #overlay>#mob{display:flex!important;flex-direction:column;flex:1 0 auto;position:relative;width:100%;max-width:460px;margin:0 auto}
/* LES FONDS, par écran (data-ecran) : l'accueil laisse voir le monde ; la mort l'assombrit ; les sous-écrans le couvrent */
body.touch #overlay::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:1;transition:opacity var(--t-slow) var(--ease);
  background:var(--fondEcran)}
body.touch #overlay::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity var(--t-slow) var(--ease);
  background:linear-gradient(180deg,rgba(7,5,15,.48) 0%,rgba(7,5,15,.12) 22%,rgba(7,5,15,0) 38%,rgba(7,5,15,0) 54%,rgba(7,5,15,.4) 70%,rgba(7,5,15,.94) 88%)} /* (2026-09-28) le haut allégé (.84 → .48) : le ciel de JOUR de l'accueil doit se voir derrière le logo */
body.touch #overlay[data-ecran="home"]::before{opacity:0}
body.touch.titreCiel #overlay[data-ecran="home"]::after{background:linear-gradient(180deg,rgba(var(--tvC,4,24,62),var(--tvA,.30)) 0%,rgba(var(--tvC,4,24,62),0) 24%,rgba(var(--tvC,4,24,62),0) 70%,rgba(var(--tvC,4,24,62),var(--tvA2,.50)) 100%)} /* (2026-10-05) les HEURES DU TITRE posent --tvC/--tvA/--tvA2 (voir TITRE_H) */ /* (titre v3) AU CIEL : un azur profond et léger au lieu du voile noir (il mangeait le tiers bas de l'image couchée) */
body.touch #overlay[data-ecran="home"]::after{opacity:1}
body.touch #overlay[data-ecran="dead"]::before{opacity:.9}
@keyframes k4Voile{0%{opacity:0}100%{opacity:1}}

.mscr{display:none;flex-direction:column;align-items:stretch;box-sizing:border-box;width:100%;flex:1 0 auto;
  padding:calc(var(--sT) + 16px) calc(var(--sR) + var(--gut)) calc(var(--sB) + 18px) calc(var(--sL) + var(--gut))}
.mscr.on{display:flex}
.mRow{display:flex;gap:16px;width:100%}
.mRow>.pbtn{flex:1;min-width:0}
/* LA SORTIE DE SECOURS DES SOUS-ÉCRANS : en BAS, sous le pouce (charte règle 4), toujours atteignable (collée au bas) */
.mDock{position:sticky;bottom:0;z-index:3;display:flex;justify-content:flex-start;margin:auto calc(-1 * var(--gut)) calc(-18px - var(--sB));
  padding:26px var(--gut) calc(var(--sB) + 18px)}
/* LE CONTENU TOMBE SOUS LE POUCE (charte règle 4) : le titre reste en haut, ce qu'on touche descend vers la sortie — le vide
   passe sous le titre, plus entre les cartes et le RETOUR */
#mModes>.mHead+.mMode{margin-top:auto}
#mModes>.mDock{margin-top:10px}
.mDock .mBack{min-width:148px;min-height:56px;gap:12px;font-size:var(--f2)}
.mDock .mBack .pxi{--pxs:2}

/* ---------------------------------------------- L'ACCUEIL ---------------------------------------------------------- */
#mHome{min-height:100%}
/* (2026-09-28) la rangée des OUTILS (missions · réglages) : sous la bande de la caisse, au-dessus des tuiles, alignée sur leurs bords */
#mHome .mOutils{display:flex;align-items:stretch;gap:14px;width:100%;margin:0 0 18px;padding:0 6px;box-sizing:border-box}
#mHome .mGear{width:50px;min-width:50px;min-height:50px}
#mHome .mGear .pxi{--pxs:3}
/* LE LOGO : l'or du titre, penché de la même vitesse que tout le reste, et sa LIVRÉE qui file dessous */
#mHome .mTitle{position:relative;display:flex;justify-content:center;gap:.2em;margin:34px 0 0;font-family:var(--pix);
  font-size:clamp(38px,11.2vw,56px);line-height:1;transform:skewX(var(--sk));filter:drop-shadow(0 8px 0 rgba(0,0,0,.35)) drop-shadow(0 0 22px rgba(255,190,60,.30))}
#mHome .mTitle .lg{line-height:1}
#mHome .mTitle::after{content:'';position:absolute}
#mHome .mVide{flex:1;min-height:60px}
#mHome .mIcons{padding:0 6px;box-sizing:border-box}
#mHome [data-m="shop"]{--nc:var(--neoM)}
#mHome .mPlay{margin:0 6px 4px;width:auto}
/* JOUER : la flèche qui file — trois chevrons qui s'allument l'un après l'autre */
.mChev{display:inline-flex;margin-left:4px}
.mChev .pxi{--pxs:2;color:var(--auE);opacity:.45;filter:none;animation:k4Chev 1.1s steps(1) infinite}
.mChev .pxi:nth-child(2){animation-delay:.18s}.mChev .pxi:nth-child(3){animation-delay:.36s}
@keyframes k4Chev{0%{opacity:1;color:var(--auT)}35%,100%{opacity:.45}}

/* ---------------------------------------------- L'ÉCRAN DE MORT ----------------------------------------------------
   Trois temps, lus de haut en bas : le VERDICT (une ligne d'enseigne, sa cause dessous) · les deux HÉROS (l'aura gagnée,
   le moteur atteint — la livrée de leur couleur en tête) · le TICKET (ce qui a été viré au compte, puis les trois
   chiffres de la partie, dans UNE plaque au lieu de quatre blocs flottants) — puis ce qu'on touche, en bas. */
#mDead{gap:0}
#mDead .mOver{margin:4px 0 0;font-family:var(--pix);font-size:var(--f6);line-height:1.25;letter-spacing:2px;text-align:center;color:var(--neoR);
  transform:skewX(var(--sk));text-shadow:0 3px 0 #1a0510,0 0 24px currentColor}
#mDead .mCause{margin:12px 0 0;font-family:var(--pix);font-size:var(--f0);letter-spacing:2px;line-height:1.8;text-align:center;color:#ff9fb0}
#mDead .mHero{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin:22px 0 0}
.hCard{--hc:var(--aura);--fc:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:176px;padding:18px 10px 14px;
  text-align:center;font-family:var(--pix);
  box-shadow:inset 0 0 0 1px var(--fil),var(--levre),inset 0 3px 0 var(--hc),inset 0 56px 44px -40px color-mix(in srgb,var(--hc) 34%,transparent)}
.hCard small{font-size:var(--f0);letter-spacing:3px;color:var(--tx2)}
.hCard b{font-weight:400}
.hAura>b{font-size:var(--f7);color:var(--aura);text-shadow:0 3px 0 #3a0f4a,0 0 18px rgba(255,122,213,.6)}
.hAura>span{display:flex;align-items:center;gap:7px;font-size:var(--f0);line-height:1.6;color:var(--tx);letter-spacing:1px}
.hAura>span .pxi{--pxs:1;color:var(--au1);filter:none}
.hCard em{font-style:normal;font-size:var(--f0);letter-spacing:1px;padding:6px 9px 5px;color:var(--auT);
  background:linear-gradient(180deg,var(--au1),var(--au3));box-shadow:0 0 0 1px var(--auO),0 0 14px var(--auG)}
.hNx{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-size:var(--f0);line-height:1.8;letter-spacing:1px;color:var(--tx3)}
.hNx .pxi{--pxs:1;color:var(--tx3)}
.hNx.hPres{color:var(--au1)}
.hMot{--hc:var(--ec,var(--au2))}
.hMot3 .hMotCv{display:block;width:128%;max-width:none;height:auto;aspect-ratio:480/321;margin:-12% -14% -8%;
  filter:drop-shadow(0 10px 8px rgba(0,0,0,.45)) drop-shadow(0 0 12px var(--ec));animation:k4Flotte 1.8s var(--ease) infinite alternate}
@keyframes k4Flotte{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}
.hMotN{display:flex;align-items:baseline;gap:8px;font-size:var(--f7);color:var(--tx);text-shadow:0 3px 0 var(--txO),0 0 14px var(--ec)}
.hMotN i{font-style:normal;font-size:var(--f0);letter-spacing:2px;color:var(--tx2);text-shadow:none}
/* LE TICKET : la ligne du compte en tête de plaque, les trois chiffres dessous — une seule plaque, un filet entre les colonnes */
#mDead .mCashL{--c:12px;display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:10px;margin:14px 0 0;padding:14px 12px 10px;
  font-family:var(--pix);font-size:var(--f0);letter-spacing:2px;color:var(--tx3);
  background:linear-gradient(to bottom right,transparent 50%,var(--fil) 50% calc(50% + 1.3px),transparent calc(50% + 1.3px)) 0 0/var(--c) var(--c) no-repeat,var(--laqueP);
  clip-path:polygon(var(--c) 0,100% 0,100% 100%,0 100%,0 var(--c));
  box-shadow:inset 1px 0 0 var(--fil),inset -1px 0 0 var(--fil),inset 0 1px 0 var(--fil),inset 0 2px 0 rgba(255,255,255,.06)}
#mDead .mCashL b{display:inline-block;font-weight:400;font-size:var(--f6);color:var(--cash);text-shadow:0 2px 0 var(--cashO),0 0 14px rgba(125,255,155,.45);transform:skewX(var(--sk))}
#mDead .mCashL b.clac{animation:k4Clac var(--t-slow) var(--ease)}
#mDead .mCashL em.mCashRec{--hc:var(--cash);font-style:normal;font-size:var(--f0);letter-spacing:1px;padding:6px 9px 5px;color:var(--hc);align-self:center;
  background:color-mix(in srgb,var(--hc) 14%,#0c0919);box-shadow:inset 0 0 0 1px var(--hc),0 0 14px color-mix(in srgb,var(--hc) 30%,transparent)} /* (R7-3) le badge des cartes AURA / MOTEUR, à la couleur de l'argent */
@keyframes k4Clac{0%{scale:1.22;filter:brightness(1.9)}100%{scale:1;filter:brightness(1)}}
#mDead .mNew{margin:10px 0 0;font-family:var(--pix);font-size:var(--f0);letter-spacing:2px;line-height:1.7;text-align:center;color:var(--au1)}
.mStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:16px 0 0}
.mStat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:62px;padding:8px 4px;font-family:var(--pix);
  background:var(--laqueP);box-shadow:inset 0 0 0 1px var(--fil),var(--levre);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.mStat b{display:inline-block;font-weight:400;font-size:var(--f5);color:var(--tx);text-shadow:0 2px 0 var(--txO);transform:skewX(var(--sk))}
.mStat span{font-size:var(--f0);letter-spacing:1px;color:var(--tx3)}
#mDead .mStats{--c:12px;gap:0;margin:0;padding:0 0 4px;
  background:linear-gradient(to top left,transparent 50%,var(--fil) 50% calc(50% + 1.3px),transparent calc(50% + 1.3px)) 100% 100%/var(--c) var(--c) no-repeat,var(--laqueP);
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%);
  box-shadow:inset 1px 0 0 var(--fil),inset -1px 0 0 var(--fil),inset 0 -1px 0 var(--fil)}
#mDead .mStat{background:none;clip-path:none;box-shadow:none;min-height:58px;position:relative}
#mDead .mStat+.mStat::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:1px;background:var(--fil)}
/* L'OBJECTIF : un TICKET — la barre se remplit de la partie, « à portée » il devient cyan et se touche */
.mObj{display:flex;flex-direction:column;gap:10px;width:100%;margin:14px 0 0;padding:14px 16px 14px 18px;font-family:var(--pix);text-align:left}
.mObj:empty{display:none}
.mObj.pret,.mObj.rec{cursor:pointer;--fc:var(--neoC);
  box-shadow:inset 0 0 0 1px rgba(0,234,255,.55),inset 0 0 34px rgba(0,234,255,.10),inset 3px 0 0 var(--neoC);animation:k4Ticket 2.2s var(--ease) infinite}
.mObj.pret:active,.mObj.rec:active,.mObj.pret.appui,.mObj.rec.appui{filter:brightness(1.25)}
@keyframes k4Ticket{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.obHd{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:var(--f0);letter-spacing:2px;color:var(--tx2)}
.obHd span{display:flex;align-items:center;gap:8px}
.obHd .pxi{--pxs:1;color:currentColor}
.obHd b{font-weight:400;font-size:var(--f1);color:var(--tx);letter-spacing:1px}
.mObj.pret .obHd,.mObj.rec .obHd{color:var(--neoC)}
.obFt{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:var(--f0);letter-spacing:1px;color:var(--tx3)}
.obFt span{display:flex;align-items:center;gap:6px}
.obFt .pxi{--pxs:1}
.mObj.pret .obFt,.mObj.rec .obFt{color:var(--neoC)}
.mObj.pret .obFt span:first-child,.mObj.rec .obFt span:first-child{color:var(--au1)}
.obBar{position:relative;height:6px;background:var(--k0);transform:skewX(var(--sk));box-shadow:0 0 0 1px var(--kl)}
.obBar i,.obBar s{position:absolute;left:0;top:0;bottom:0;display:block}
.obBar i{background:linear-gradient(90deg,var(--au3),var(--au1));box-shadow:0 0 10px var(--auG);transition:width 1.1s var(--ease);z-index:1}
.obBar s{background:#7a5a18;opacity:.6;z-index:2}
#mDead [data-m="replay"]{margin:0}
#mDead .mEsp{flex:1 0 20px;max-height:64px}                  /* le ressort : REJOUER descend sous le pouce, sans creuser un trou au milieu */
#mDead{justify-content:center}
#mDead>.mRow{margin:24px 0 0}
#mDead>.mRow .pbtn{min-height:76px}
#mDead [data-m="shop"]{--nc:var(--neoM)}
/* LA SAISIE DU RECORD : un nom de 8 lettres sur une plaque de laque, curseur or */
#nameEntry{display:none;flex-flow:row wrap;align-items:stretch;gap:12px 16px;width:100%;margin:18px 0 0}
#nameEntry>span{flex:0 0 100%}
#nameEntry>span{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--pix);font-size:var(--f1);letter-spacing:2px;line-height:1.7;color:var(--neoM);text-align:center;text-shadow:0 0 12px rgba(255,62,200,.6)}
#nameEntry .pxi{--pxs:1;color:var(--au1)}
#nameInput{box-sizing:border-box;flex:1;min-width:0;width:auto;height:54px;padding:0 16px;border:0;border-radius:0;outline:0;font-family:var(--pix);font-size:var(--f5);letter-spacing:6px;
  text-align:center;text-transform:uppercase;color:var(--au1);caret-color:var(--au1);background:var(--k0);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1px var(--kl2);transform:skewX(var(--sk))}
#nameInput:focus{box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1px var(--au2),0 0 18px var(--auG)}
#nameSave{--nc:#062a12;flex:none;width:118px;min-height:54px;color:#062a12;font-size:var(--f2);
  background:linear-gradient(180deg,#dcffe5 0%,#72f294 30%,#23b853 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(0,90,30,.3),0 0 0 1px #03170a,0 5px 0 0 #0c7331,0 5px 0 1px #03170a,var(--ombreSol);
  text-shadow:0 1px 0 rgba(220,255,230,.7);position:relative;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;cursor:pointer;font-family:var(--pix);transform:skewX(var(--sk))}
#nameSave:active,#nameSave.appui{transform:skewX(var(--sk)) translateY(5px)}

/* ---------------------------------------------- MODES --------------------------------------------------------------- */
.mMode{--mc:var(--kl2);--fc:var(--mc);display:flex;flex-direction:column;gap:10px;width:100%;margin:0 0 14px;padding:16px 16px 16px 20px;cursor:pointer;text-align:left;
  transition:box-shadow var(--t-fast) var(--ease)}
.mMode.on{--mc:var(--neoV);box-shadow:inset 0 0 0 1px rgba(94,227,122,.5),var(--levre),inset 3px 0 0 var(--mc),inset 40px 0 44px -36px rgba(94,227,122,.5)}
.mMode:active,.mMode.appui{filter:brightness(1.2)}
.mmT{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--pix);font-size:var(--f3);letter-spacing:1px;color:var(--tx)}
.mmT>span:first-child{display:flex;align-items:center;gap:12px;transform:skewX(var(--sk))}
.mmT .pxi{--pxs:3;color:var(--mc)}
.mMode.off .mmT .pxi{color:var(--tx2);filter:none}
.mmS{flex:none;display:flex;align-items:center;justify-content:center;min-width:54px;height:28px;padding:0 10px;box-sizing:border-box;font-size:var(--f0);letter-spacing:1px;
  transform:skewX(var(--sk));color:var(--neoV);background:#062414;box-shadow:0 0 0 1px #1f8a4b,0 0 12px rgba(94,227,122,.3)}
.mMode.off .mmS{color:var(--tx3);background:var(--k0);box-shadow:0 0 0 1px var(--kl)}
.mmD{font-family:var(--pix);font-size:var(--f1);line-height:1.7;font-weight:400;color:var(--tx2)}

/* ---------------------------------------------- RÉGLAGES ------------------------------------------------------------ */
.mSet{display:flex;flex-direction:column;width:100%}
.mSet>.mSec:first-child{margin-top:0}

/* ---------------------------------------------- LA BOUTIQUE -------------------------------------------------------- */
/* L'OFFRE À LA UNE : une vitrine de légende — cadre magenta qui scintille, la caisse qui flotte sur son socle de lumière */
.shUne{position:relative;display:block;width:100%;box-sizing:border-box;margin:0 0 6px;padding:2px;cursor:pointer;
  clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);
  background:linear-gradient(115deg,#5a0f4a,#ff3ec8 20%,#ffd0f2 26%,#ff6fd6 32%,#5a0f4a 48%,#ff3ec8 70%,#ffe0f6 76%,#8a1668 90%);background-size:220% 100%;
  animation:k4Or 5s linear infinite}
@keyframes k4Or{0%{background-position:0 0}100%{background-position:-220% 0}}
.shUne:empty{display:none}
.shUneCadre{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px 18px 18px;overflow:hidden;
  clip-path:polygon(19px 0,100% 0,100% calc(100% - 19px),calc(100% - 19px) 100%,0 100%,0 19px);
  background:radial-gradient(90% 60% at 50% 42%,rgba(255,62,200,.30),transparent 70%),var(--matrice),linear-gradient(180deg,#221044,#0d0820)}
.shPhoto{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:36/20}
.shPhoto::before{content:'';position:absolute;left:4%;right:4%;top:18%;bottom:4%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,62,200,.24),transparent)} /* (2026-09-30) plus de barre rose sous la caisse : une lueur large, derrière (l'ombre et le reflet sont dans la photo) */
.shPhoto.big::after{content:'';position:absolute;left:50%;top:55%;width:130%;aspect-ratio:1;translate:-50% -50%;z-index:-1;
  background:repeating-conic-gradient(from 0deg,rgba(255,62,200,.16) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(closest-side,#000 25%,transparent 72%);mask:radial-gradient(closest-side,#000 25%,transparent 72%);
  animation:k4Rayons 40s linear infinite}
.shPhoto.big{isolation:isolate}
@keyframes k4Rayons{0%{rotate:0deg}100%{rotate:360deg}}
.shPhoto img{position:relative;width:112%;max-width:none;height:auto;animation:k4Flotte 2.4s var(--ease) infinite alternate}
.shPhoto .pxi{--pxs:6;color:var(--tx3)}
.shUneTx{display:flex;flex-direction:column;gap:8px;text-align:left}
.shUneTx b{font-family:var(--pix);font-weight:400;font-size:var(--f5);letter-spacing:1px;line-height:1.3;color:#fff;transform:skewX(var(--sk));text-shadow:0 3px 0 var(--txO),0 0 14px rgba(255,199,42,.35)}
.shUneTx span{font-family:var(--pix);font-size:var(--f1);line-height:1.7;font-weight:400;color:var(--tx2)}
.shUneBas{display:flex;align-items:center;gap:12px;font-family:var(--pix)}
.shUneBas s{font-size:var(--f2);color:var(--tx2);text-decoration-color:var(--neoM);text-decoration-thickness:2px}
.shUneBas s{text-decoration:none;position:relative}.shUneBas s::after{content:'';position:absolute;left:-3px;right:-3px;top:calc(50% - 1px);height:2px;background:var(--neoM)} /* (2026-09-30, revue) le trait passe AU MILIEU des chiffres : le line-through de la police pixel tombait dessous, on lisait un souligné */
.shUneBas em{font-style:normal;font-size:var(--f6);color:var(--au1);transform:skewX(var(--sk));text-shadow:0 3px 0 var(--auO),0 0 14px var(--auG)}
.shBtn{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:var(--f0);letter-spacing:1px;color:var(--tx3)}
.shBtn .pxi{--pxs:1;color:var(--tx3)}
.shBtn.aToi{color:var(--neoV)}
.shGrille{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.shCase{--c:12px;position:relative;display:flex;flex-direction:column;gap:8px;padding:12px 12px 12px;cursor:pointer;overflow:hidden;box-sizing:border-box;
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));
  background:linear-gradient(to bottom right,transparent 50%,var(--fil) 50% calc(50% + 1.3px),transparent calc(50% + 1.3px)) 0 0/var(--c) var(--c) no-repeat,
    linear-gradient(to top left,transparent 50%,var(--fil) 50% calc(50% + 1.3px),transparent calc(50% + 1.3px)) 100% 100%/var(--c) var(--c) no-repeat,
    radial-gradient(80% 55% at 50% 38%,rgba(255,62,200,.18),transparent 70%),var(--laqueP);
  box-shadow:inset 0 0 0 1px var(--fil),inset 0 3px 0 var(--neoM),var(--levre);transition:filter var(--t-fast) var(--ease)}
.shCase:active,.shUne:active,.shCase.appui,.shUne.appui{filter:brightness(1.2)}
.shCase .shPhoto img{width:118%;animation:none}
.shNom{font-family:var(--pix);font-weight:400;font-size:var(--f1);line-height:1.5;color:#fff;letter-spacing:1px}
.shPrix{align-self:flex-start;margin-top:auto;padding:6px 9px 5px;font-family:var(--pix);font-size:var(--f2);color:var(--au1);
  background:var(--k0);box-shadow:inset 0 -2px 0 var(--au2),0 0 0 1px rgba(255,199,42,.22);text-shadow:0 0 10px var(--auG)}
.shPrix.aToi{color:var(--neoV);box-shadow:inset 0 -2px 0 var(--neoV);text-shadow:none}
.shRare{display:none}
.shRestaurer{align-self:center;margin:26px 0 6px;padding:14px 10px;font-family:var(--pix);font-size:var(--f0);letter-spacing:2px;color:var(--tx3);cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--kl2);text-underline-offset:6px}
#mShop .mSec{margin-top:26px}

/* ============================================ LA PAUSE (#tPanel) ==================================================== */
/* la PAUSE laisse voir la course figée derrière un voile plein (sans flou) : on sent qu'on est en pleine partie */
#tPanel{position:fixed;inset:0;z-index:9;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#tPanel.open{display:block;animation:k4Voile var(--t-slow) var(--ease) both}
#tPanel.sortant{animation:k4VoileOut var(--t-fast) var(--ease) forwards;pointer-events:none}
#tpIn{display:flex;flex-direction:column;align-items:stretch;gap:12px;box-sizing:border-box;width:100%;max-width:460px;min-height:100%;margin:0 auto;
  padding:calc(var(--sT) + 22px) calc(var(--sR) + var(--gut)) calc(var(--sB) + 18px) calc(var(--sL) + var(--gut))}
#tPanel .tpH:first-child{margin:0 0 8px}
#tPanel .tp:not(.ligne){display:flex;align-items:center;justify-content:center;gap:12px;box-sizing:border-box;min-height:56px;padding:0 20px;cursor:pointer;user-select:none;-webkit-user-select:none;
  font-family:var(--pix);font-size:var(--f2);letter-spacing:1px;color:var(--tx);transform:skewX(var(--sk));--nc:var(--neoC);
  background:var(--laque);
  box-shadow:inset 3px 0 0 var(--nc),inset 34px 0 30px -28px color-mix(in srgb,var(--nc) 75%,transparent),var(--levre),inset 0 0 0 1px rgba(255,255,255,.06),
    0 0 0 1px var(--anneau),0 5px 0 0 var(--tranche),0 5px 0 1px var(--anneau),var(--ombreSol);
  text-shadow:0 2px 0 var(--txO);transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
#tPanel .tp:not(.ligne) .pxi{--pxs:2;color:var(--nc)}
#tPanel .tp:not(.ligne):active,#tPanel .tp:not(.ligne).appui{transform:skewX(var(--sk)) translateY(5px);box-shadow:inset 3px 0 0 var(--nc),inset 60px 0 44px -34px color-mix(in srgb,var(--nc) 80%,transparent),var(--levre),0 0 0 1px var(--anneau),0 4px 10px rgba(0,0,0,.5)}
#tPanel .tp.rouge{--nc:var(--neoR);color:var(--neoR)}
body.hTp:not(#ccH) #tGear,body.hTp:not(#ccH) #touchCtl{visibility:hidden}
#tPanel .tp.go{--nc:var(--auT);color:var(--auT);position:sticky;bottom:calc(var(--sB) + 12px);z-index:2;margin:auto 0 6px;min-height:72px;font-size:var(--f5);letter-spacing:4px;
  background:linear-gradient(105deg,transparent 0 38%,rgba(255,255,255,.78) 46%,rgba(255,255,255,0) 54%) no-repeat,
    linear-gradient(180deg,#fffadf 0%,#ffe78e 15%,#ffd044 40%,#f7ae16 68%,#ea930a 86%,#ffc84e 100%);
  background-size:250% 100%,auto;background-position:180% 0,0 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 0 rgba(255,238,170,.55),inset 0 0 0 1px rgba(150,72,0,.35),
    0 0 0 1px #331600,0 6px 0 0 var(--auE),0 6px 0 1px #331600,0 18px 28px -10px rgba(70,24,0,.75),0 0 34px -6px var(--auG);
  outline:1px solid rgba(140,68,0,.32);outline-offset:-7px;text-shadow:0 1px 0 rgba(255,247,210,.9);animation:k4Lingot 4.2s var(--ease) 1.2s infinite}
#tPanel .tp.go .pxi{--pxs:3;color:var(--auT)}
#tPanel .tp.go:active,#tPanel .tp.go.appui{transform:skewX(var(--sk)) translateY(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 1px #331600,0 5px 10px rgba(40,10,0,.5),0 0 44px rgba(255,190,40,.62)}
/* LA PARTIE : RECOMMENCER et QUITTER côte à côte (aucun des deux n'est l'action primaire : c'est REPRENDRE, en bas) */
#tPanel .tp[data-a="reset"],#tPanel .tp[data-a="quit"]{margin:0}
#tpIn .tpPanel{display:block}
/* les RÉGLAGES de la pause descendent vers REPRENDRE (ce qu'on touche, sous le pouce) ; LA PARTIE reste en haut, loin du lingot */
#tpIn>.tpResume,#tpIn>.tpHR{margin-top:auto}
#tPanel #tpIn>.tp.go{margin-top:18px} /* (2026-09-30, revue des écrans) debout, l'or partageait le vide avec les réglages : deux trous au milieu de la pause ; il colle maintenant aux réglages (un seul vide, sous LA PARTIE) */
.tpRow{display:flex;gap:16px}
.tpRow .tp{flex:1;min-width:0;font-size:var(--f1)!important;padding:0 10px!important}
/* le ⏸ DE COURSE : la même touche que l'engrenage de l'accueil (il ouvre cette pause — il en parle la langue) */
body #tGear{width:48px!important;height:48px!important;border:0!important;border-radius:0!important;display:flex;align-items:center;justify-content:center;color:var(--tx);
  background:var(--laque)!important;transform:skewX(var(--sk))!important;
  box-shadow:inset 3px 0 0 var(--neoC),inset 34px 0 30px -28px rgba(0,234,255,.7),var(--levre),inset 0 0 0 1px rgba(255,255,255,.06),0 0 0 1px var(--anneau),0 5px 0 0 var(--tranche),0 5px 0 1px var(--anneau),0 10px 18px -6px rgba(0,0,0,.6)!important}
body #tGear::before,body #tGear::after{display:none!important}
body #tGear .pxi{--pxs:2;color:var(--neoC);filter:none!important}
body #tGear:active,body #tGear.appui{transform:skewX(var(--sk)) translateY(5px)!important;
  box-shadow:inset 3px 0 0 var(--neoC),inset 60px 0 44px -34px rgba(0,234,255,.7),var(--levre),0 0 0 1px var(--anneau),0 4px 10px rgba(0,0,0,.5)!important}
/* sous la pause, le HUD de course se tait (il se lisait à travers le voile) */
body.hTp:not(#ccH) :is(#flowHud,#auraV2,#pwrChip,#pwrFx,#airPie,#nitroWrap,#lvlBan,#slam9){visibility:hidden}
body.hTp:not(#ccH) #coach,body.hTp:not(#ccH) #misBan,body.hTp:not(#ccH) #engBig{display:none}

/* ============================================ LE BOUTON NITRO (course) ===============================================
   Rond : c'est une JAUGE (le compteur de boost de Rocket League). La lecture --nr (orange = la nitro) / --nx (réserve
   bleue) est posée par la boucle ; son dessin pixel vit en section 11 (fin de ce bloc). Aucun câblage touché. */
body.touch #tNitro{border:9px solid transparent!important;color:var(--tx)!important;text-shadow:0 2px 0 var(--k0)!important}
/* le HALO de la jauge pleine : un calque à part dont seule l'OPACITÉ bouge (composité, gratuit) — pas un filtre animé */
body.touch #tNitro::before{content:'';position:absolute;inset:-12px;border-radius:50%;pointer-events:none;background:none;
  box-shadow:0 0 22px 6px rgba(255,140,40,.6);opacity:0;transition:opacity var(--t-fast) var(--ease)}
body.touch #tNitro .pxi{--pxs:4;color:#ff8a24;filter:none!important}
body.touch #tNitro span{font-family:var(--pix);font-size:var(--f0)!important;letter-spacing:2px!important;color:var(--tx)}
body.touch #tNitro:active .pxi,body.touch #tNitro.on .pxi{color:#fff}
body.touch #tNitro:active span,body.touch #tNitro.on span{color:#fff}
body.touch #tNitro.plein:not(.on){animation:none!important}
body.touch #tNitro.plein:not(.on)::before{animation:k4NitroPret 1.1s var(--ease) infinite}
@keyframes k4NitroPret{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){body.touch #tNitro.plein:not(.on)::before{animation:none;opacity:.6}}
body.touch #tNitroZone{background:none!important;border:0!important;box-shadow:none!important}

/* ============================================ LA FENÊTRE ET LE TOAST =============================================== */
#modale{position:fixed;inset:0;z-index:95;display:none;align-items:flex-end;justify-content:center;box-sizing:border-box;
  padding:calc(var(--sT) + 24px) calc(var(--sR) + 12px) calc(var(--sB) + 12px) calc(var(--sL) + 12px)}
#modale.on{display:flex;animation:k4Voile var(--t-slow) var(--ease) both}
#modale.sortant{animation:k4VoileOut var(--t-fast) var(--ease) forwards;pointer-events:none}
.modIn{--c:18px;display:flex;flex-direction:column;gap:14px;width:100%;max-width:440px;padding:26px 22px 22px;
  box-shadow:inset 0 0 0 1px var(--fil),var(--levre),inset 0 3px 0 var(--neoM),inset 0 70px 60px -60px rgba(255,62,200,.35)}
#modT{margin:0;font-family:var(--pix);font-weight:400;font-size:var(--f4);line-height:1.5;letter-spacing:1px;color:#fff;transform:skewX(var(--sk));text-shadow:0 2px 0 var(--txO),0 0 14px rgba(255,62,200,.5)}
#modX{font-family:var(--pix);font-size:var(--f1);line-height:1.7;font-weight:400;color:var(--tx2)}
#modX:empty{display:none}
#modC{box-sizing:border-box;width:100%;min-height:74px;padding:12px;border:0;border-radius:0;resize:none;outline:0;font:var(--f1)/1.6 var(--pix);
  color:var(--au1);background:var(--k0);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1px var(--kl2);-webkit-user-select:text;user-select:text}
.modB{display:flex;flex-direction:column;gap:18px;margin-top:10px}
.modB .pbtn{width:100%;min-height:56px;padding:0 12px;font-size:var(--f2)}
.modB .pbtn.arme{filter:grayscale(.8) brightness(.8)}            /* le destructeur s'arme après --t-slow : un double appui n'efface rien */
.modB .pbtn .pxi{--pxs:2}
#toast{position:fixed;left:50%;top:calc(var(--sT) + 72px);z-index:96;display:flex;align-items:center;gap:12px;box-sizing:border-box;width:max-content;max-width:min(88vw,400px);padding:14px 18px 13px 16px;
  font-family:var(--pix);font-size:var(--f1);line-height:1.7;letter-spacing:1px;color:var(--tx);text-align:left;pointer-events:none;opacity:0;
  background:var(--tresse),var(--laqueP);box-shadow:inset 0 0 0 1px var(--fil),var(--levre),inset 3px 0 0 var(--au2);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);filter:drop-shadow(0 10px 16px rgba(0,0,0,.6));transition:opacity var(--t-fast) var(--ease),transform var(--t-slow) var(--ease)}
#toast.on{opacity:1}
#toast .pxi{--pxs:2;color:var(--au1)}
#toast .pxi-coche{color:var(--neoV)}
#toast:has(.pxi-coche){box-shadow:inset 0 0 0 1px var(--fil),var(--levre),inset 3px 0 0 var(--neoV)}
#toast .pxi-croix{color:var(--neoR)}
#toast:has(.pxi-croix){box-shadow:inset 0 0 0 1px var(--fil),var(--levre),inset 3px 0 0 var(--neoR)}
/* au garage, le haut est à la FICHE : le toast se pose au-dessus des onglets, sur l'atelier */
body.inGarage #toast{top:auto;bottom:calc(var(--sB) + 356px)}
@media (max-height:720px){body.inGarage #toast{bottom:calc(var(--sB) + 316px)}}
#nameInput::placeholder{letter-spacing:6px}
