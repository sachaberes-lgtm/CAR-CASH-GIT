<!-- ================= L'ÉDITION, ET LA COLONNE DE L'ORDI (2026-09-28) =================
     Sacha : « quand on ouvre cette version, la disposition des affichages de la version PC et de la version mobile verticale doit
     être EXACTEMENT la même ». Jusqu'ici l'ordi jouait le chemin téléphone dans TOUTE la fenêtre, en paysage : jauges étirées sur
     1 600 px, HUD minuscule, caisse lointaine, accueil réarrangé (captures 1600×900 du 28/09). Une disposition identique ne
     s'obtient qu'en donnant au jeu LE MÊME ÉCRAN : sur l'ordi, cette page n'est plus qu'un CADRE, et le jeu tourne dans une
     colonne de 390 × 844 (l'écran logique d'un iPhone) agrandie à la hauteur de la fenêtre par `zoom`. Chrome propage ce zoom
     au document du cadre comme une densité de pixels : dedans, innerWidth = 390, les @media et les vw sont ceux d'un téléphone,
     devicePixelRatio = le facteur d'agrandissement → texte et jauges NETS (mesuré : 1 600 × 1 100 → colonne 499 × 1 080, dpr 1,28).
     Même en file:// (double-clic) : le cadre se charge et partage la sauvegarde (même localStorage, vérifié).
     ⚠ LE MOT DE LA FIN, même soir, après trois allers-retours (vertical → « horizontale sur PC » → « comme mon téléphone en
     vertical ») : « non, justement : je veux voir la version HORIZONTALE DU MOBILE sur mon PC ». Le cadre donne donc au jeu l'écran
     d'un téléphone COUCHÉ : 844 × 390 (l'iPhone de référence tenu en paysage), agrandi à la largeur de la fenêtre — dedans,
     innerWidth 844 / innerHeight 390 : exactement la mise en page qu'un téléphone affiche en paysage (le jeu joue portrait ET
     paysage depuis le 27/09), pas celle d'un moniteur de 1 600 px. `?colonne=portrait` = le téléphone tenu DEBOUT (390 × 844) ;
     `?colonne=0` = l'ancien plein écran de moniteur ; `?pc=1` = le menu desktop.
     Qui y passe : l'édition 'mobile', ouverte en page principale (pas déjà dans un cadre), sur un écran qui n'est PAS un téléphone
     (même test que TEL_NATIF). Dans la page-cadre, le grand script s'arrête à sa 1re ligne (`CC_COLONNE`) : aucun second jeu.
     ⚠ `const EDITION` VIT ICI : c'est LA ligne que `synchro-versions.js` bascule (une seule occurrence, sinon il refuse). -->
<script>
/* ⚠ LES DEUX ÉDITIONS (2026-09-25, user : « sépare-les en deux dossiers : VERSION PRINCIPALE = la version mobile fusionnée, AUTRE
   VERSION = la version PC »). C'est UN SEUL jeu : les deux dossiers portent le MÊME index.html, et cette ligne est la SEULE qui
   diffère. 'mobile' → sur l'ordi aussi on joue la version TÉLÉPHONE (l'écran d'un téléphone en paysage, voir plus haut) ; 'pc' → l'ordi garde le menu
   desktop. Un vrai téléphone reçoit la version téléphone dans les deux cas. On ne modifie JAMAIS « AUTRE VERSION » à la main :
   `node synchro-versions.js` (racine du dépôt) la régénère depuis la principale. Forçages ponctuels : `?tel=1` / `?pc=1`.
   (Déclarée au niveau global — un `const` de script classique est visible du grand script, qui la lit.) */
const EDITION='mobile';
if(/[?&]portes=haut\b/.test(location.search))document.documentElement.classList.add('portesHaut'); /* (2026-10-20, Léo : « le mission, le shop, tu remets ça en dessous ») les portes du garage sous le nom (Sacha, 19/10) : seulement avec ?portes=haut */
if(/[?&]garage=(leo|avant)\b/.test(location.search))document.documentElement.classList.add('garLeo'); /* (2026-10-19, Sacha) LE GARAGE QUI PREND TOUT L'ÉCRAN (la feuille garageHaut) est le défaut ; ?garage=leo (ou =avant) rend le garage d'avant */
if(/[?&]garjouer=0\b/.test(location.search))document.documentElement.classList.add('sansGarJouer'); /* (2026-10-18) le JOUER de l'inventaire et de la boutique, coupé : voir <style id="jouerGarage"> */
/* (2026-10-11, Léo : « enlève les intros, tout ça : lance juste la voiture dans la map ») LA BALADE SANS INTRO — la classe est posée
   dès le <head> : ni le logo du chargement, ni le menu ne se montrent (voir baladeDepart). */
if(/[?&]intro=ancien\b/.test(location.search))document.documentElement.classList.add('introAncien');
if(/[?&](map=jade|balade=1)\b/.test(location.search)){document.documentElement.classList.add('balade');document.write('<style id="baladeIntro">html.balade #splash,html.balade #overlay,html.balade #garage,html.balade #wipe{visibility:hidden!important}html.balade body{background:#07050f}html.balade:not(.parti) body>canvas{visibility:hidden!important}</style>');}
/* LES MISSIONS v2 (2026-10-16, Sacha : « on remplace tout le système actuel de défis en carnets / groupes de 3 par des MISSIONS libres ») :
   l'ancien système (CARNETS, la file de trois, les pastilles, la constellation de l'atelier) est RETIRÉ (18/10, allègement) ; la sauvegarde
   SAVE.d.mis reste lue (carStat('carnet'), la migration m2MigreV2, le cadeau des carnets POP). Voir « LES MISSIONS v2 » au journal. */
document.documentElement.classList.add('misV2');
/* (2026-10-15, Léo : « enlève les dauphins et les singes ; avec les figures ça n'a plus sa place, ça prend trop de place dans le jeu — enlève
tout ce qui est volumineux et inutile : dragon, animaux ») → ARRACHÉS : les dauphins (créatures, figure LE DAUPHIN, étiquette #dolHud, aura de la
nage au ras), le serpent néon, le dragon de feu de NITROOO (DRG / DFEU), les singes de la course (3 sauts en 5 s). Le modèle du dauphin, la recette
VITRAIL et le singe vivent dans `creatures/*.js`, CHARGÉS par le jeu (<script> plus bas, et le Worker creatures/atelier.js) pour ce qui est revenu par map — les singes et les dauphins du SOLEIL DE JADE (JSG, JDM) — et lus par
   les boîtes de Léo.
(2026-10-18, allègement) coupés le 15/10, arrachés à leur tour : le SNAKE LOOP, NITROOO / PURE SPEED / AIR NITROOO, le MÉTÉORE et son cratère,
la pluie de débris de l'orbite — plus de `?snake=1`, `?nitrooo=1`, `?meteore=1`, `?debris=1`. Tout le reste : l'historique git (85470fb4 et avant). */
/* LA MÊME VERSION POUR TOUT LE MONDE (2026-10-01, Léo : « trouve un moyen pour qu'on joue au même jeu, juste ») : `vercel-build.sh`
   remplace ce jeton par le commit publié et pose `version.json` à côté du jeu. Le jeu compare les deux et se recharge tout seul
   s'il est en retard (voir « LA MISE À JOUR TOUTE SEULE », près du service worker). En copie locale le jeton reste tel quel : rien ne se vérifie. */
const CC_BUILD='__CC_BUILD__';
/* (2026-10-22, piste « démarrage », profil au CPU ×4 : les photos des caisses se refaisaient à CHAQUE publication — 3 à 4 s de fil principal) L'EMPREINTE DES PHOTOS : `vercel-build.sh` grave ici le hachage des seuls fichiers qui changent l'IMAGE d'une photo de caisse
   (voitures/, rendu/, le studio, les constantes de cadrage). Les photos gardées (IndexedDB `ccPhotos`) survivent donc aux publications qui n'y touchent pas. Copie locale : jeton intact, rien n'est gardé (voir phdbSig). */
const CC_PHOTOS='__CC_PHOTOS__';
const CC_VER=(/^__/.test(CC_BUILD)?'LOCALE':CC_BUILD.slice(0,7))+(/[?&]chute=0\b/.test(location.search)?' · SANS CIEL':'');
(function(){
  var q=location.search,M=window.matchMedia;
  /* ===== LES ANIMATIONS DU HUD SANS RECALCUL (2026-10-24, passe perf PC, Sacha : « sur la version mobile l'HUD prend trop de capacité, règle ça ») =====
     Mesuré sur l'iPhone 13 Pro de Sacha (app, palier RÉCENT, 35 s de course) : 63 images > 25 ms ; animations CSS figées : 9. Les animations infinies du HUD
     sur des propriétés non composées (box-shadow, filter, background-position) sont refaites en transform / opacité, sous `html.han`.
     `?hudanim=0` = les anciennes animations (A/B). */
  if(!/[?&]hudanim=0\b/.test(q))document.documentElement.classList.add('han');
  /* L'ÉCRAN NU PAR DÉFAUT (2026-10-01, copie de test de Léo : « je préfère le point de vue de la 1re image » = sans la forme de
     l'iPhone) : sur l'ordi, l'écran du téléphone est un rectangle simple, sans boîtier, sans encoche ni coins arrondis, et le jeu ne
     garde pas les marges de l'encoche. `ENCOCHE_DEFAUT=true` rend le boîtier du 13 Pro par défaut ; dans l'adresse, `?encoche=1` /
     `?encoche=0` forcent l'un ou l'autre. Un vrai téléphone n'est jamais concerné (pas de cadre). */
  /* (2026-10-06, Sacha : « remets l'encoche et le format de l'iPhone quand on lance la version main ») : le BOÎTIER du 13 Pro revient par
     défaut — lunette, coins arrondis, encoche. L'écran nu de Léo reste à portée : `?encoche=0` dans l'adresse. */
  var ENCOCHE_DEFAUT=true,ENC=(/[?&]encoche=1\b/.test(q)||(ENCOCHE_DEFAUT&&!/[?&]encoche=0\b/.test(q)));
  if(window.top!==window){ // DANS la colonne : les touches frappées pendant que la page-cadre avait le focus arrivent par message
    if(/[?&]colonne=1\b/.test(q)&&!/[?&]encoche=0\b/.test(q))document.documentElement.classList.add('telCadre'); // les MARGES de l'iPhone restent, même sans en dessiner la forme : les boutons à la même place que sur le téléphone de Sacha (`?encoche=0` : sans marges) // les marges de l'iPhone de référence (voir « L'ENCOCHE »)
    addEventListener('message',function(e){var d=e.data;if(e.source!==window.parent||!d||d.cc!=='touche')return;
      try{document.dispatchEvent(new KeyboardEvent(d.t,{key:d.key,code:d.code,repeat:!!d.rep,bubbles:true,cancelable:true}));}catch(_){}});
    return;}
  if(EDITION!=='mobile'||window.Capacitor||/[?&](pc|desktop)=1|[?&]colonne=0/.test(q)&&!/[?&](tel|mobile)=1/.test(q))return; // ?pc=1 : menu desktop · ?colonne=0 : l'ancien plein écran
  var tactile=(M&&M('(pointer:coarse)').matches)||('ontouchstart' in window)||navigator.maxTouchPoints>0;
  if(tactile&&((M&&M('(hover:none)').matches)||Math.min(screen.width,screen.height)<600))return; // un vrai téléphone : il EST l'écran
  /* (2026-10-01, Léo : « sur tous les ordis ») la taille de l'ÉCRAN, plus celle de la fenêtre : un portable à écran tactile
     (1 536 × 864 → fenêtre < 820 px de haut) passait pour un téléphone et jouait sans cadre, étiré sur tout le moniteur */
  window.CC_COLONNE=true;window.__gameReady=true; // (le chien de garde du démarrage n'a rien à garder ici : le jeu démarre dans le cadre)
  var debout=/[?&]colonne=portrait/.test(q);
  document.documentElement.classList.add('colonne',debout?'debout':'couche');
  var L=debout?390:844,H=debout?844:390; // l'écran logique de référence (iPhone 12 à 15) — couché par défaut (le verdict de Sacha)
  document.addEventListener('DOMContentLoaded',function(){
    var f=document.createElement('iframe'),u=location.href.split('#')[0];
    f.id='colonne';f.setAttribute('aria-label','CASH CAR'); // (2026-10-08, Léo : « c'est un peu goofy ici ») le NOM du cadre sans `title` : un title affichait l'infobulle grise « CASH CAR » dès que la souris s'arrêtait sur le jeu
    f.setAttribute('allow','autoplay; fullscreen; gamepad');f.setAttribute('allowfullscreen','');
    f.src=u+(u.indexOf('?')<0?'?':'&')+'colonne=1';
    f.style.width=L+'px';f.style.height=H+'px';
    /* LE CORPS DU TÉLÉPHONE (2026-10-01, Léo : « le truc iPhone c'est mal mis ») : l'écran collait aux bords de la fenêtre (une
       fenêtre d'ordi est moins allongée que 844 × 390 : le cadre prenait TOUTE la largeur), ses coins arrondis et l'encoche étaient
       coupés par le bord. Désormais un vrai boîtier : une lunette noire de `TEL_B` pt autour de l'écran, de l'air autour du
       boîtier, et l'encoche posée DANS la lunette (même noir : elle en sort, comme sur le vrai). Le boîtier se place en px (#tel,
       sans zoom), l'écran (l'iframe zoomée) vit dedans sans aucun décalage à lui — un left/top sur un élément zoomé serait zoomé aussi. */
    var tel=document.createElement('div');tel.id='tel';tel.appendChild(f);
    document.body.appendChild(tel);
    /* L'ENCOCHE (2026-10-01, Léo : « son emplacement des touches est différent — que sur tous les ordis ça ressemble à ce que
       Sacha a ») : le téléphone de référence est l'iPhone 13 Pro de Sacha, 844 × 390 — le cadre en avait la taille, pas les
       MARGES. iOS rentre l'interface de 47 px de chaque côté couché (21 en bas ; debout 47 en haut, 34 en bas) : dans la
       colonne, `html.telCadre` pose ces marges (--ccT/B/L/R, lues à la place de env(safe-area-inset-*) partout), et la page-
       cadre dessine l'écran arrondi + l'encoche, par-dessus l'image comme sur le vrai. `?encoche=0` = sans. */
    var en=null;if(ENC){en=document.createElement('div');en.id='encoche';tel.appendChild(en);
      document.documentElement.classList.add('encoche');}
    var MODE=/[?&]cadre=scale\b/.test(q)?'scale':'zoom'; // voir « LE ZOOM NE PASSE PAS PARTOUT » plus bas
    var TEL_B=en?11:0; // la lunette du 13 Pro ≈ 11 pt de chaque côté de l'écran (sans encoche : l'écran nu, comme avant)
    var cadre=function(){
      // de l'air autour du boîtier ; en bas la place du bouton TOURNER et du numéro de version
      var PW=0,LW=innerWidth-PW;
      var mx=Math.max(16,LW*.025),mh=Math.max(14,innerHeight*.03),mb=Math.max(mh,40),
        z=Math.max(.5,Math.min((innerHeight-mh-mb)/(H+2*TEL_B),(LW-2*mx)/(L+2*TEL_B))),b=TEL_B*z,
        w=(L+2*TEL_B)*z,h=(H+2*TEL_B)*z,ts=tel.style;
      if(MODE==='zoom'){f.style.transform='';f.style.zoom=z.toFixed(4);}else{f.style.zoom='';f.style.transformOrigin='0 0';f.style.transform='scale('+z.toFixed(4)+')';}
      document.documentElement.style.setProperty('--labPW',PW+'px');
      ts.width=w+'px';ts.height=h+'px';ts.padding=b+'px';ts.left=((LW-w)/2)+'px';ts.top=(mh+(innerHeight-mh-mb-h)/2)+'px';
      ts.borderRadius=en?((47+TEL_B)*z)+'px':'0'; // (?encoche=0 : l'écran nu, à angles droits, comme avant)
      if(!en)return;var lo=154*z,ep=31*z,ro=(9*z)+'px',s=en.style; // l'encoche du 13 Pro ≈ 154 × 31 pt, coins de 9 pt, et ses deux « oreilles » (::before/::after)
      s.setProperty('--or',(6*z)+'px');
      if(debout){s.width=lo+'px';s.height=ep+'px';s.left=(b+(L*z-lo)/2)+'px';s.top=b+'px';s.borderRadius='0 0 '+ro+' '+ro;}
      else{s.width=ep+'px';s.height=lo+'px';s.left=b+'px';s.top=(b+(H*z-lo)/2)+'px';s.borderRadius='0 '+ro+' '+ro+' 0';}};
    cadre();addEventListener('resize',cadre);
    /* (2026-10-03, Léo : « pourquoi le menu du début est mal placé », sur ses deux liens) LE ZOOM NE PASSE PAS PARTOUT : Chrome applique le
       `zoom` de l'iframe à son contenu (le jeu s'y croit dans un écran de 844 × 390, en haute définition) ; un navigateur qui ne le fait
       pas (Safari ? Firefox ? — pas de banc pour eux ici) donne au jeu un écran de 1 400 px de large : le menu passe en disposition
       « grand écran », boutons petits en bas, caisse à droite. On VÉRIFIE au chargement ce que voit le jeu ; si ce n'est pas 844 × 390,
       on bascule sur une mise à l'échelle (transform) qui marche partout (image un peu moins fine). `?cadre=scale` la force (banc). */
    f.addEventListener('load',function(){try{var iw=f.contentWindow.innerWidth,ih=f.contentWindow.innerHeight;
      if(MODE==='zoom'&&(Math.abs(iw-L)>3||Math.abs(ih-H)>3)){MODE='scale';cadre();}}catch(_){}});
    /* LE BOUTON TOURNER (2026-09-30, Léo : « ajoute une option où je peux regarder en mode portrait » — repris de sa branche
       `version-leolei-2026`, 26/09) : le téléphone passe COUCHÉ ⇄ DEBOUT sans recharger — le jeu, dans la colonne, ne reçoit qu'un
       resize (fovFit, HUD, garage suivent seuls), on peut tourner en pleine course. L'adresse garde le choix (`?colonne=portrait`). */
    var vv=document.createElement('div');vv.id='ccVer';vv.textContent='VERSION '+CC_VER;document.body.appendChild(vv); // à comparer d'un coup d'œil avec les réglages du téléphone
    var tb=document.createElement('button');tb.id='tourne';tb.type='button';document.body.appendChild(tb);
    var tLbl=function(){var lg9='';try{lg9=localStorage.ccLang||'';}catch(e){}var en=lg9?lg9!=='fr':!/^fr/i.test(navigator.language||'fr'); /* (2026-10-07) la langue CHOISIE d'abord, comme l'écran de crash */
      tb.textContent=debout?(en?'\u21bb  LANDSCAPE':'\u21bb  PAYSAGE'):'\u21bb  PORTRAIT';var a9=debout?'Tenir le téléphone couché':'Tenir le téléphone debout';
      tb.dataset.frAria=a9;tb.setAttribute('aria-label',en?(debout?'Hold the phone sideways':'Hold the phone upright'):a9);};
    window.__tourneLbl=tLbl; /* applyLangDOM le rappelle quand on change de langue */
    tLbl();
    tb.addEventListener('click',function(e){e.stopPropagation();debout=!debout;L=debout?390:844;H=debout?844:390;
      document.documentElement.classList.toggle('debout',debout);document.documentElement.classList.toggle('couche',!debout);
      f.style.width=L+'px';f.style.height=H+'px';cadre();tLbl();
      try{var u=new URL(location.href);if(debout)u.searchParams.set('colonne','portrait');else u.searchParams.delete('colonne');history.replaceState(null,'',u.toString());}catch(_){}
      donne();});
    // le CLAVIER va au jeu : focus donné au chargement et à chaque clic hors de la colonne ; une touche frappée entre-temps est relayée
    var donne=function(){try{f.contentWindow.focus();}catch(_){}};
    f.addEventListener('load',donne);addEventListener('pointerdown',donne);
    ['keydown','keyup'].forEach(function(t){addEventListener(t,function(e){
      try{f.contentWindow.postMessage({cc:'touche',t:t,key:e.key,code:e.code,rep:e.repeat},'*');}catch(_){}
      if(/^(Space|Arrow|Shift|Escape|Enter)/.test(e.code))e.preventDefault();donne();});});
  });
})();
</script>
<script>
/* LA RÉGIE ADSENSE (2026-10-15 soir, Sacha : « branche les vraies pubs sur le site web avec Google AdSense (jeux H5) ») — le chargeur de
   l'Ad Placement API de Google (« H5 Games Ads »), côté page ; le côté jeu (adBreak de type reward → la SECONDE CHANCE) est le bloc
   « LA RÉGIE ADSENSE, CÔTÉ JEU », juste au-dessus de LA PUB QUI RESSUSCITE.
   · CC_ADSENSE = l'identifiant d'éditeur AdSense de Sacha (« ca-pub-… », sur adsense.google.com › Compte › Infos du compte). VIDE = AUCUNE
     régie : la pub maison de 5 s. C'est le SEUL endroit où le poser : vercel-build.sh en tire aussi /ads.txt à la racine du site.
   · Seulement sur le SITE (CC_ADSENSE_SITES, en http/https) : jamais dans l'app iPhone (Capacitor, capacitor://), jamais dans une copie
     locale (localhost, JOUER.bat), jamais dans la page-cadre de l'ordi — Google veut le code DANS le document du jeu, donc dans l'iframe de
     la colonne (qui a déjà allow="autoplay").
   · `?pubtest=1` : le MODE TEST de Google (data-adbreak-test="on") partout, même sans identifiant — de fausses pubs, aucune requête de pub
     envoyée, une fois sur deux « pas de pub prête » (la pub maison prend le relais). Pour les bancs et pour voir le parcours. */
var CC_ADSENSE='',CC_ADSENSE_SITES=['car-cash-git.vercel.app'];
(function(){try{
  var test=/[?&]pubtest=1\b/.test(location.search);
  if(window.CC_COLONNE||window.Capacitor||!/^https?:$/.test(location.protocol))return;
  if(!test&&!(/^ca-pub-\d{10,20}$/.test(CC_ADSENSE)&&CC_ADSENSE_SITES.indexOf(location.hostname)>=0))return;
  var s=document.createElement('script');s.async=true;s.crossOrigin='anonymous';
  if(test)s.setAttribute('data-adbreak-test','on');
  s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+(CC_ADSENSE||'ca-pub-0000000000000000');
  window.adsbygoogle=window.adsbygoogle||[];
  window.adBreak=window.adConfig=function(o){window.adsbygoogle.push(o);};
  window.CC_ADS={test:test,client:CC_ADSENSE||'test'};
  document.head.appendChild(s);
}catch(e){}})();
/* LA RÉGIE ADMOB DE L'APP iPHONE (2026-10-19, Sacha : « prépare les emplacements de pub récompensée dans le jeu (sans module AdMob), on
   branchera AdMob en v1.1 ») — la prise est posée, ÉTEINTE. Le côté jeu est le bloc « LA RÉGIE ADMOB, CÔTÉ JEU », juste au-dessus de
   « LA RÉGIE ADSENSE, CÔTÉ JEU ». Elle ne s'allume que si les TROIS sont vrais :
   · on est dans l'app (window.Capacitor : jamais sur le site ni dans une copie locale) ;
   · le module natif @capacitor-community/admob est installé dans le projet Xcode (Capacitor.Plugins.AdMob) — le travail du Mac en v1.1 ;
   · CC_ADMOB.recompense porte l'identifiant du BLOC de pub récompensée iOS (« ca-app-pub-…/… », AdMob › Applis › Blocs d'annonces). VIDE = éteinte.
   `?pubtest=1` dans l'app = le bloc de TEST de Google (ca-app-pub-3940256099942544/1712485313) et isTesting, même sans identifiant.
   ⚠ À LA v1.1, en plus du module : l'App ID AdMob (GADApplicationIdentifier), SKAdNetworkItems et NSUserTrackingUsageDescription dans
   Info.plist, et les réponses « confidentialité » de l'App Store (identifiant publicitaire, données d'usage) à refaire. */
var CC_ADMOB={recompense:''};

     on pousse le trait : tout est en pixel, tout est EXTRUDÉ, et le titre DÉBORDE de l'écran.
     ⚠ POURQUOI L'EXTRUSION EST EN `drop-shadow` ET PAS EN `text-shadow` : ces lettres sont peintes
     par un dégradé découpé (`background-clip:text`, donc `color:transparent`). Un `text-shadow` se
     dessine DERRIÈRE la glyphe — derrière du transparent, il ne se voit pas. `filter:drop-shadow`
     empile des copies de la FORME déjà rendue : c'est ce qui donne la tranche dorée du logo, sur
     n'importe quel texte, sans dupliquer le contenu ni exiger un `data-t` à tenir à jour dans les
     deux langues (c'est la limite de `.lg`, qui recopie son texte via `attr(data-t)`).
     ⚠ `overflow-x:hidden` : le wordmark est VOLONTAIREMENT plus large que l'écran. Sans ça le
     navigateur ajoute une barre de défilement horizontale et le menu se met à glisser sous la
     souris — un titre qui déborde est un parti pris, une page qui se balade est un bug. */
  #overlay{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;padding:24px 0;z-index:5;
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;justify-content:safe center; /* ⚠ `safe` : un centrage flex classique COUPE le
      DÉBUT du contenu quand il dépasse (le titre se retrouvait rogné par le haut de l'écran, et aucune
      barre de défilement ne permettait d'y remonter). `safe center` centre tant que ça tient, puis
      retombe en flex-start — le titre reste entier et la page défile normalement. */
    color:#fff;cursor:default;font-family:var(--pix);-webkit-backdrop-filter:blur(2.5px)}
  /* ⚠ LE MENU EST TRANSPARENT (2026-08-30, demande du user : « pour qu'on voie le décor »).
     Le fond passe de .94 à .56 et le flou de 9 px à 2,5 : le ciel, la piste et la caisse continuent
     de VIVRE derrière l'écran-titre au lieu de disparaître sous un voile. Ce qui rend le texte
     lisible par-dessus un décor qui bouge, ce n'est PAS l'opacité du fond — c'est que chaque lettre
     porte sa propre extrusion et son ombre portée dure (voir `.or3` et `#overlay h1`). Un menu qui
     s'appuie sur son fond pour être lisible ne peut jamais devenir transparent ; un menu dont les
     lettres se défendent toutes seules, si. ⚠ ne pas remonter l'opacité pour « corriger » un
     contraste : c'est le halo derrière le titre qu'il faut épaissir, pas le voile. */
  #overlay>*{position:relative;z-index:1}
  /* ---- LES BRAISES : le menu respirait déjà (titre, reflet, pulse du "go") mais tout ça reste
     COLLÉ au texte — rien ne vit dans le VIDE de l'écran. Huit petits éclats (losanges néon, la
     même famille que les glyphes du logo qu'on casse) montent lentement en dérivant, chacun sur son
     propre timing (durée/délai/x/couleur décalés via nth-child) pour ne jamais rejouer le même
     battement deux fois. Purement décoratif, CSS seul (0 coût JS/frame) — n'existe QUE derrière le
     texte, jamais dessus (premier enfant de `#overlay`, DOM = ordre de peinture). */
  /* L'OR EXTRUDÉ, en une classe : la matière du logo, disponible pour n'importe quelle ligne. */
  .or3{background:linear-gradient(180deg,#fffdf2 0%,#ffe9a0 26%,#ffc400 52%,#c07a06 76%,#ffe9a0 97%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 .055em 0 #7a4600) drop-shadow(0 .10em 0 #4a2a00)
           drop-shadow(0 .15em .16em rgba(0,0,0,.62))}
  /* ---- JOUER : la plaque d'or, la plus grosse chose cliquable de l'écran ---- */
  #playBtn{position:relative;margin:16px 0 8px;padding:20px 62px;border:0;border-radius:0;cursor:pointer;
    font-family:var(--pix);font-size:19px;letter-spacing:6px;color:#2a1500;
    background:linear-gradient(180deg,#ffeeb0,#ffc400 52%,#eb9c00);
    text-shadow:0 1px 0 rgba(255,255,255,.45);
    clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
    filter:drop-shadow(0 8px 0 #7a4400);transition:transform .05s,filter .05s}
  #playBtn::after{content:'';position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 4px 4px 0 rgba(255,255,255,.35),inset -4px -4px 0 rgba(0,0,0,.28)}
  #playBtn:hover{filter:drop-shadow(0 8px 0 #7a4400) brightness(1.06)}
  #playBtn:active{transform:translateY(7px);filter:drop-shadow(0 1px 0 #7a4400) brightness(1.1)}
  #playBtn:focus-visible{outline:2px solid #fff;outline-offset:4px}
  #overlay h1{font-family:var(--pix);text-align:center}
  /* ------- LOGO 3D OR (partagé accueil + intro) ------- */
  .lg{position:relative;display:inline-block;line-height:1.2}
  .lg::before{content:attr(data-t);position:absolute;left:0;top:0;width:100%;z-index:-1;color:#4a2a00;
    transform:translateY(.09em);
    text-shadow:0 .015em 0 #6e3f00,0 .03em 0 #5c3300,0 .05em 0 #472700,0 .07em 0 #331c00,0 .16em .3em rgba(0,0,0,.7)}
  .lg.gold{background:linear-gradient(180deg,#fffdf2 0%,#ffe9a0 28%,#ffc400 52%,#b06c05 74%,#ffe9a0 96%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 .35em rgba(255,200,80,.5))}
  .lg.grad{background:linear-gradient(180deg,#fff3c0,#ffd75e 40%,#ff8a3d 72%,#ff3ec8);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 .35em rgba(255,110,190,.45))}
  .lg::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;
    background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.95) 50%,transparent 68%) 180% 0/240% 100% no-repeat;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:lgShine 3.4s ease-in-out infinite}
  @keyframes lgShine{0%,18%{background-position:180% 0}58%,100%{background-position:-90% 0}}
  /* ------- LE LOGO DU LANCEMENT (2026-09-05, agrandi le même jour — « plus impressionnant ») :
     brille au-dessus de la caisse au départ, puis s'efface — voir `fireLaunchBoost()`. Réutilise TEL
     QUEL le logo 3D or (`.lg`/.gold/.grad) : le sweep `lgShine` tourne déjà en boucle, donc l'afficher
     suffit à lui faire « briller un coup » sans une seule ligne d'animation en plus. ⚠ l'ENTRÉE est un
     IMPACT, pas un fondu : parti de tout petit (scale .18) avec un `cubic-bezier` à REBOND (dépasse
     1 avant de s'y stabiliser, comme un ressort) — un simple ease-out aurait juste grandi sagement,
     jamais donné l'impression de CLAQUER à l'écran. `#launchGlow` (halo radial doré, même minuteur
     que le logo via la classe `.on` partagée) fait le flash qui accompagne le coup. ------- */
  #launchLogo{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%) scale(.18);
    font-family:var(--pix);font-size:clamp(34px,8.6vw,84px);letter-spacing:.04em;display:flex;gap:.16em;
    white-space:nowrap;opacity:0;pointer-events:none;z-index:30;
    transition:opacity .3s ease-out,transform .7s cubic-bezier(.22,1.61,.36,1)}
  #launchLogo.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #launchLogo .lg{line-height:1}
  #launchGlow{position:absolute;left:50%;top:26%;width:70vmin;height:70vmin;
    transform:translate(-50%,-50%) scale(.4);border-radius:50%;pointer-events:none;z-index:29;
    background:radial-gradient(circle,rgba(255,222,140,.85) 0%,rgba(255,180,60,.4) 32%,transparent 68%);
    opacity:0;transition:opacity .5s ease-out,transform .8s cubic-bezier(.22,1.61,.36,1)}
  #launchGlow.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #overlay h2{font-family:var(--pix);font-size:11px;margin:14px 0 0;color:#00eaff;text-shadow:0 0 12px rgba(0,234,255,.7)}
  #overlay p{max-width:640px;text-align:center;line-height:1.9;opacity:.92;font-size:10px;font-family:var(--pix)}
  #overlay .go{font-family:var(--pix)}
  #finalScore{display:none;
    -webkit-background-clip:text}
  kbd{background:#1a1433;border:1px solid #00eaff;border-radius:3px;padding:2px 8px;font-size:8px;font-family:var(--pix)}
  @keyframes pulse{50%{opacity:.4}}
  /* --- classement top 10 --- */
  /* le classement passe en second plan : on ouvre le jeu pour JOUER, pas pour lire un tableau */
  #lbBox{margin:22px 0 0;max-width:86vw;opacity:.78;transition:opacity .2s,filter .2s}
  #lbBox:hover{opacity:1;filter:drop-shadow(0 0 14px rgba(0,234,255,.18))}
  .lbTitle{font-family:var(--pix);text-align:center}
  .lbRow{display:flex;align-items:center;font-family:var(--pix);line-height:2;padding:3px 10px;transition:background .15s}
  .lbRow:hover{background:rgba(0,234,255,.08)}
  .lbRow.hl{color:#ffb000;text-shadow:0 0 8px rgba(255,176,0,.6)}
  .lbRank{width:30px;color:#8f84c8;text-align:right;padding-right:12px}
  .lbName{flex:1;text-align:left;letter-spacing:2px}
  .lbScore{color:#62e062}
  .lbRow.hl .lbScore{color:#ffd75e}
  .lbEmpty{text-align:center;padding:6px}

  /* ------- ÉCRANS MODERNES (accueil / game over) ------- */
  /* le décor du menu : halo magenta, veine cyan rasante et trame de balayage — on est dans une borne,
     pas dans une app. Le jeu reste visible derrière (blur léger), il ne disparaît pas sous un voile plat. */
  #overlay{background:
      radial-gradient(1100px 620px at 50% 26%,rgba(255,62,200,.16),transparent 62%),
      linear-gradient(105deg,transparent 38%,rgba(0,234,255,.10) 49%,transparent 60%),
      repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
      radial-gradient(1200px 700px at 50% 30%,rgba(74,34,58,.5),rgba(8,5,16,.94));
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);gap:6px} /* (24/10, relecture WebKit) Safari < 18 ne lit que la forme préfixée : sans elle, pas de flou derrière l’accueil et l’écran de fin (ordinateur) */
  /* ================= LE TITRE SORT DE L'ÉCRAN (2026-08-30) ================================
     Demande du user, mot pour mot : les lettres « sortent de l'écran ». Ce n'est pas une taille de
     plus, c'est un CADRAGE : le mot est plus large que la fenêtre, on n'en voit pas les bords, et
     c'est ça qui donne l'échelle — un objet dont on voit les limites paraît petit, un objet qu'on
     ne peut pas contenir paraît énorme. `11.5vw` sur huit lettres dépasse la largeur utile à
     toutes les tailles d'écran ; `nowrap` interdit au navigateur de « réparer » en passant à la
     ligne (ce qui casserait l'effet en le transformant en titre sur deux lignes).
     La perspective vient de SA version (rotateX 11°) — on la pousse à 13° et on l'ancre plus bas
     pour que le haut des lettres s'éloigne : c'est ce basculement qui fait le générique d'arcade. */
  /* ⚠ LA TAILLE EST BORNÉE PAR LA HAUTEUR AUTANT QUE PAR LA LARGEUR (`min(vw,vh)`) : indexée sur la
     seule largeur, sur un écran bas (1280×720, un portable) le titre mangeait 208 px et poussait les
     boutons du bas hors de l'écran. Le `min` garde le débordement HORIZONTAL — le seul qui soit
     voulu — sans transformer le menu en page à faire défiler.
     ⚠ RÉDUIT (2026-09-05, demande du user : « trop gros, réduis ») : le débordement volontaire
     (2026-08-30) a fait son effet un temps, mais la taille elle-même est devenue le problème — un
     titre qui mange l'écran laisse trop peu de place pour que le reste du menu respire. Le plafond
     et les facteurs vw/vh baissent tous ensemble (même logique, valeurs plus sages) : le titre garde
     sa perspective et son extrusion, il ne domine plus l'écran. */
  #overlay h1{font-size:clamp(40px,min(8.2vw,14vh),150px);letter-spacing:.04em;display:flex;gap:.16em;
    white-space:nowrap;flex:0 0 auto;line-height:.94; /* ⚠ le pixel n'a NI jambage NI accent qui monte :
      l'interligne de 1,4 hérité réservait ~70 px de vide sous un titre déjà géant, et c'est ce vide —
      pas la taille — qui poussait les boutons du bas hors de l'écran. */
    transform:perspective(700px) rotateX(13deg);transform-origin:50% 66%;
    filter:drop-shadow(0 26px 34px rgba(0,0,0,.55));
    margin:0 0 2px;animation:wmRespire 6s ease-in-out infinite}
  @keyframes wmRespire{
    0%,100%{filter:drop-shadow(0 26px 34px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(255,190,70,.18))}
    50%    {filter:drop-shadow(0 26px 34px rgba(0,0,0,.55)) drop-shadow(0 0 40px rgba(255,190,70,.38))}}
  @media (prefers-reduced-motion:reduce){#overlay h1{animation:none}}
  /* ⚠ `.lg` (partagé avec l'intro) porte `line-height:1.2` : dans le titre c'est LUI qui commandait,
     pas le h1 — l'interligne réglé plus haut n'avait aucun effet tant qu'on ne le reprenait pas ici. */
  #overlay h1 .lg{line-height:.94}
  #overlay h1:hover{transform:perspective(700px) rotateX(13deg) scale(1.03);
    filter:drop-shadow(0 26px 34px rgba(0,0,0,.55)) drop-shadow(0 0 50px rgba(255,205,90,.62)) brightness(1.10)}
  /* la ligne sous le titre repasse en pixel doré : plus une seule typo système sur cet écran */
  #tagline{font-family:var(--pix);font-size:9px;letter-spacing:4px;text-transform:uppercase;
    margin:2px 0 10px;
    background:linear-gradient(180deg,#ffe9c0,#e0a24a 70%,#8a5510);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1px 0 #43260a) drop-shadow(0 2px 3px rgba(0,0,0,.7))}
  #ovSub{font-size:13px;color:#ff5e7a;text-shadow:0 0 16px rgba(255,60,90,.6);margin:6px 0 0;letter-spacing:6px}
  /* LE MAGOT DE FIN DE PARTIE : lui aussi extrudé — c'est le chiffre qu'on vient chercher */
  #finalScore{font-family:var(--pix);font-size:34px;margin:14px 0 6px;letter-spacing:2px;
    background:linear-gradient(180deg,#fffdf2 0%,#ffe9a0 26%,#ffc400 52%,#c07a06 76%,#ffe9a0 97%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 .055em 0 #7a4600) drop-shadow(0 .10em 0 #4a2a00) drop-shadow(0 .15em .16em rgba(0,0,0,.62))}
  #bestChip{font-family:var(--pix);font-size:9px;letter-spacing:2.2px;color:#ffd75e;border-radius:0;
    padding:8px 15px;margin:6px 0 6px}
  #lbBox{width:400px;padding:12px 14px}
  .lbTitle{font-size:11px;letter-spacing:3px;color:#ffd75e;text-shadow:none;margin-bottom:8px}
  .lbRow{border-bottom:1px solid rgba(255,255,255,.06);color:#c8dcf2;font-size:9px}
  .lbRow.hl{background:rgba(255,176,0,.12);box-shadow:none}
  /* le gros bouton doré devient une simple INVITE sous le logo : c'est le titre qu'on clique */
  #overlay .go{margin-top:12px;font-size:11px;letter-spacing:5px;color:#ffcf6a;background:none;
    border:none;padding:4px 10px;animation:pulse 1.8s infinite;cursor:pointer;
    text-shadow:0 0 14px rgba(255,190,80,.5);transition:color .15s,transform .15s}
  #overlay .go:hover{color:#fff0c2;transform:scale(1.04)}
  /* ------- INTRO STUDIO 1.61 : accumulation → FISSION ------- */
  html:not(.introAncien) #splash #spTitle{display:none} /* (2026-10-23, Léo : « enlève le CASH CAR sur écran noir ») le titre du HTML ne se peint plus avant l'intro : noir, puis la boule (`?intro=ancien` le garde) */
  #splash{position:fixed;inset:0;background:#000; /* (2026-10-23, Léo : « le titre noir dès le début, sans lumière ») NOIR dès le premier affichage (avant : le dégradé violet restait tant que le script de l'intro n'avait pas tourné) */z-index:80;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .7s;overflow:hidden}
  #fxCv{position:absolute;inset:0;width:100%;height:100%}
  /* (2026-10-15, Sacha : « améliore l'écran de chargement CAR CASH ») LE CŒUR QUI BAT PENDANT LE CHARGEMENT : tant que le jeu se construit, le
     script est occupé et la poussière d'or (canvas) reste FIGÉE — l'écran avait l'air planté. Ce halo or-rose respire en CSS pur, sur
     transform/opacity : le compositeur l'anime même quand le script est pris. Il suit le voile jusqu'à son effacement (.spVoile). */
  .spVoile::before{content:'';position:absolute;left:50%;top:50%;width:130vmax;height:130vmax;margin:-65vmax 0 0 -65vmax;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,196,90,.17),rgba(255,62,200,.07) 42%,rgba(25,16,36,0) 72%);
    animation:spHalo 3.2s var(--ease,ease-in-out) infinite alternate;will-change:transform,opacity}
  @keyframes spHalo{from{opacity:.5;transform:scale(.86)}to{opacity:1;transform:scale(1.05)}}
  @media (prefers-reduced-motion:reduce){#splash::before,.spVoile::before{animation:none;opacity:.8}}
  #spStage{position:relative;text-align:center;z-index:2}
  /* ---- LA MARQUE φ : LA SUITE DE FIBONACCI QUI DONNE SON NOM AU STUDIO ----------------------
     « 1.61 », c'est le nombre d'or. Le mettre en chiffres sans jamais montrer d'où il vient, c'était
     laisser la référence à l'état de private joke. La marque le DÉMONTRE : les carrés de Fibonacci
     (1,1,2,3,5,8,13…) s'emboîtent, et la spirale les traverse. Tracée en canvas et pas en SVG parce
     qu'elle se DESSINE — l'intro la construit carré par carré, et c'est ça qui la rend vivante. */
  /* ⚠ DERRIÈRE LE NUMÉRO (z-index 0 contre 2), et volontairement DÉBORDANTE : la marque ne doit pas
     concurrencer « 1.61 », elle doit l'entourer. À l'échelle 1 elle passait pile dessus et on ne
     lisait plus le nombre — mesuré à l'écran, pas supposé. */
  /* ⚠ UNE MARQUE, PAS UN SCHÉMA. Première version : le rectangle d'or occupait tout le cadre et se
     battait avec « 1.61 » — on ne lisait plus ni l'un ni l'autre. Elle se pose donc SOUS le nombre,
     petite, comme un sceau : c'est ce qu'on a demandé (« un petit logo de la suite Fibonacci »).
     Elle grandit légèrement en se traçant, puis se fige. */
  /* ---- 1.61 GAMING : LA SIGNATURE DU STUDIO, et elle passe EN DERNIER (ordre inverse, 2026-09-03).
     Elle est ABSOLUE et centree sur l'etage : elle se leve donc EXACTEMENT la ou le titre vient
     d'exploser — c'est ce recouvrement de place qui fait lire une signature et non un deuxieme ecran. */
  #spNum{position:absolute;left:50%;top:50%;z-index:2;white-space:nowrap;
    font-family:var(--pix);font-size:clamp(52px,11.4vw,104px);letter-spacing:8px;
    opacity:0;transform:translate(-50%,-50%) scale(.72);
    transition:opacity .7s ease,transform .8s cubic-bezier(.18,.9,.28,1.35),filter .7s ease;
    background:linear-gradient(180deg,#fffdf0,#ffe9a0 32%,#ffb000 58%,#7c4a00 80%,#ffe9a0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 34px rgba(255,190,60,.8)) drop-shadow(0 5px 0 #4a2a00)}
  #spNum.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  /* ELLE DISPARAIT : elle s'eloigne et se floute, elle n'explose PAS — deux explosions de suite et la
     premiere ne vaut plus rien. Le studio salue, il ne refait pas le numero. */
  #spNum.out{opacity:0;transform:translate(-50%,-50%) scale(1.16);filter:blur(7px) drop-shadow(0 0 50px rgba(255,190,60,.5))}
  /* ⚠ le parent est en color:transparent (degrade decoupe) : sans -webkit-text-fill-color explicite,
     GAMING herite du transparent et ne se peint QUE du bas du degrade, la ou il est brun sombre. */
  #spGam{display:block;font-size:.215em;letter-spacing:.42em;text-indent:.42em;margin-top:.18em;
    color:#ffdf9a;-webkit-text-fill-color:#ffdf9a}
  @keyframes teaseBreath{50%{opacity:.36}}
  /* ---- LE BOUTON A SAUTÉ (2026-09-05) — « on clique juste sur CASH CAR » --------------------
     Il n'y a plus de plaque « JOUER » sous le titre : le titre EST la cible, `sp9` écoute déjà le
     clic sur tout l'écran. Il ne reste qu'UNE ligne, qui dit où cliquer au lieu de le montrer avec
     un deuxième objet — et elle respire doucement (`spBreath`, sur `opacity`, pas sur un `filter`
     coûteux) pour rester une invite et non une notice statique qu'on ignore. */
  #spNote{
    opacity:0;transition:opacity 1s}
  /* ⚠ 2026-09-24 : en une ligne, l'invite mesurait 506 px sur un écran de 375 — coupée des deux côtés.
     Sous 560 px elle a le droit de passer sur deux lignes. */
  @media (max-width:560px){#spNote{white-space:normal;width:86vw;line-height:2.1;letter-spacing:2px}}
  @media (prefers-reduced-motion:reduce){#spNote.on{animation:none}}
  /* ---- CASH CAR : c'est LUI qu'on voit en arrivant, et c'est LUI qui explose. Il est DANS LE FLUX
     (plus en absolu) : l'etage prend sa hauteur, donc la plaque JOUER et la note se calent dessous
     toutes seules, sans une seule valeur en dur a re-regler. */
  #spTitle{display:inline-flex;gap:22px;white-space:nowrap;
    font-family:var(--pix);font-size:clamp(38px,8.4vw,72px);letter-spacing:8px;
    opacity:0;transform:scale(.5);
    transition:transform .55s cubic-bezier(.18,.9,.28,1.35),opacity .5s ease,filter .45s ease}
  #spTitle.tease{opacity:.26;transform:scale(.88);animation:teaseBreath 2.8s ease-in-out infinite}
  #spTitle.on{opacity:1;transform:scale(1);animation:none}
  /* L'EXPLOSION, MOT POUR MOT CELLE DU NOMBRE D'AVANT (meme echelle, meme flou, meme duree) :
     la demande etait « ca explose de la MEME maniere qu'avant » — on deplace l'effet, on ne le refait pas.
     ⚠ FLOU ET OMBRE ALLÉGÉS (2026-09-05, plainte du user : « ça lague ») : `blur`+`drop-shadow`
     animés EN MÊME TEMPS qu'un `scale(3.6)` forcent le navigateur à repeindre (pas juste composer)
     à chaque image — et ce moment précis coïncide avec les 70 particules du canvas ET le flash. Trop
     de travail cher au même instant. Le flou descend à 6px et l'ombre à 42px : la silhouette reste
     lisible pendant qu'elle explose, le coût de calcul baisse d'autant. `will-change` prévient le
     navigateur qu'un calque dédié vaut le coup ICI, pas partout (un `will-change` posé en permanence
     gaspille de la mémoire GPU pour rien). */
  #spTitle.boom{opacity:0;transform:scale(3.6);filter:blur(6px) drop-shadow(0 0 42px #ffd75e);
    will-change:transform,filter,opacity;
    transition:opacity .45s ease-in,transform .45s ease-in,filter .45s ease-in}
  /* ⚠ RADIALE, PAS UN APLAT (2026-09-05) : un `background:#fff` plein écran qui saute à `opacity:1`
     se lit comme un RECTANGLE BLANC qui traverse l'écran, pas comme un flash — un carré à bords nets
     n'a pas de raison d'être là et le regard le lit comme un bug. Un dégradé radial centré sur le
     titre a des bords qui se perdent AVANT le cadre : la même intensité au centre, mais plus rien à
     pointer du doigt sur les côtés. */
  #spFlash{position:absolute;inset:0;
    background:radial-gradient(60vw 60vh at 50% 50%,#fff6e2,rgba(255,246,226,0) 72%);
    opacity:0;transition:opacity .35s;pointer-events:none;z-index:3}
  /* ================= MOBILE / TACTILE — LA VERSION TÉLÉPHONE =================
     Tout est scopé sous body.touch (classe posée par le bloc MOBILE en fin de fichier) :
     le desktop ne bouge pas d'un pixel, et aucune physique n'est réécrite (le tactile pilote le
     MÊME objet `keys` et le MÊME `steer`). PORTRAIT assumé, DEUX POUCES et pas un de plus :
     · pouce GAUCHE = VOLANT ANALOGIQUE (toute la moitié gauche, stick flottant sous le doigt)
     · pouce DROIT  = NITRO (énorme) · double-tap = braquage
     Le gaz est AUTOMATIQUE (AUTO_GAS) : on ne réclame jamais un troisième doigt. */
  html,body{overscroll-behavior:none;-webkit-touch-callout:none}
  body.touch #hud,body.touch>canvas{touch-action:none}       /* zéro scroll/zoom parasite sur la zone de jeu */
  body.touch #chainHud,body.touch #caseHud{-webkit-backdrop-filter:none;backdrop-filter:none} /* le flou d'arrière-plan coûte une passe plein écran : hors de question sur téléphone */
  #touchCtl{position:fixed;inset:0;z-index:4;pointer-events:none;display:none;touch-action:none;
    padding:var(--ccT,env(safe-area-inset-top,0px)) var(--ccR,env(safe-area-inset-right,0px)) var(--ccB,env(safe-area-inset-bottom,0px)) var(--ccL,env(safe-area-inset-left,0px))}
  body.touch.play #touchCtl{display:block}  /* les commandes n'existent que manette en main : le menu reste net */
  .tbtn{position:absolute;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;
    font-family:var(--pix);color:#dfeeff;border-radius:50%;text-align:center;line-height:1.2;
    background:rgba(12,8,34,.42);border:2px solid rgba(0,234,255,.5);
    box-shadow:0 0 14px rgba(0,234,255,.25),inset 0 0 18px rgba(0,234,255,.08);
    transition:transform .06s,background .1s;opacity:.9}
  .tbtn.on,.tbtn:active{transform:scale(.92);background:rgba(0,234,255,.32)}
  /* --- VOLANT ANALOGIQUE : la moitié gauche EST le volant, le stick naît sous le pouce --- */
  #tSteer{position:absolute;left:0;top:0;width:54%;height:100%;pointer-events:auto;touch-action:none}
  body.tpad #tSteer{pointer-events:none}                     /* mode PAD : ce sont les flèches qui pilotent */
  #tStick{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;pointer-events:none;
    border:2px solid rgba(0,234,255,.28);
    background:radial-gradient(circle,rgba(0,234,255,.10) 0%,rgba(6,4,16,.20) 66%,transparent 70%);
    opacity:0;transition:opacity .14s}
  #tSteer.act #tStick{opacity:.92}
  #tKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,rgba(210,250,255,.9),rgba(0,190,230,.55) 58%,rgba(0,110,150,.28));
    border:2px solid rgba(170,244,255,.8);box-shadow:0 0 18px rgba(0,234,255,.55)}
  #tSteerHint{position:absolute;left:calc(var(--ccL,env(safe-area-inset-left,0px)) + 24px);bottom:calc(var(--ccB,env(safe-area-inset-bottom,0px)) + 20px);font-family:var(--pix);font-size:8px;letter-spacing:2px;pointer-events:none;text-shadow:0 0 10px rgba(0,234,255,.5);transition:opacity .3s}
  #tSteer.act #tSteerHint,#tSteer.used #tSteerHint,body.tpad #tSteerHint{opacity:0} /* dit UNE fois : au premier braquage la consigne s'efface pour de bon */
  /* --- flèches : mode PAD, pour qui préfère le tout-ou-rien --- */
  #tLeft,#tRight{display:none;width:min(84px,21vh);height:min(84px,21vh);bottom:20px;font-size:24px}
  body.tpad #tLeft,body.tpad #tRight{display:flex}
  #tLeft{left:16px}
  #tRight{left:calc(min(84px,21vh) + 30px)}
  /* --- pouce DROIT : NITRO énorme. Une VRAIE touche d'arcade : plaque orange, biseau, épaisseur. --- */
  #tNitro{right:calc(var(--ccR,env(safe-area-inset-right,0px)) + 16px);bottom:calc(var(--ccB,env(safe-area-inset-bottom,0px)) + 16px);width:min(122px,30vh);height:min(122px,30vh);font-size:13px;letter-spacing:2px;
    border:0;border-radius:0;color:#2a1000;background:linear-gradient(180deg,#ffc074,#ff8c1a 52%,#d05e00);
    clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
    filter:drop-shadow(0 7px 0 #7a3200);text-shadow:0 1px 0 rgba(255,255,255,.4);
    box-shadow:inset 4px 4px 0 rgba(255,255,255,.28),inset -4px -4px 0 rgba(0,0,0,.30);
    backdrop-filter:none;-webkit-backdrop-filter:none;transition:transform .05s,filter .05s}
  #tNitro.on,#tNitro:active{transform:translateY(6px);filter:drop-shadow(0 1px 0 #7a3200) brightness(1.15);
    background:linear-gradient(180deg,#fff0c0,#ffb24a 52%,#e87400)}
  /* le ⏸ / ⚙ : même plaque, en petit */
  #tGear{position:fixed;z-index:8;top:calc(var(--ccT,env(safe-area-inset-top,0px)) + 10px);right:calc(var(--ccR,env(safe-area-inset-right,0px)) + 10px);
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    border:0;border-radius:0;color:#9fe8ff;background:linear-gradient(180deg,#22305c,#141d3a);opacity:.94;
    clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);
    filter:drop-shadow(0 5px 0 #06122e);
    box-shadow:inset 3px 3px 0 rgba(255,255,255,.16),inset -3px -3px 0 rgba(0,0,0,.40),inset 0 0 0 2px rgba(0,234,255,.42);
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
  #tGear:active{transform:translateY(4px);filter:drop-shadow(0 1px 0 #06122e)}
  /* la jauge de nitro : segments francs, cadre net — plus de coins arrondis */
  body.touch #nitroBar{border:0;box-shadow:inset 0 0 0 2px rgba(0,234,255,.55),0 3px 0 rgba(4,10,26,.9)}
  /* ================= ÉCRAN NU (mobile) : LA ROUTE, LA CAISSE, LA NITRO =================
     Verdict user : tout le HUD dégage. Plus de compteur, plus de minimap, plus de barre de style,
     plus un seul texte qui saute à l'écran. Il reste la jauge de nitro (remontée tout en HAUT : en
     bas elle barrait la caisse en travers), le bouton NITRO, et UN bouton de réglages. Rien n'est
     supprimé du CODE (les éléments existent et sont écrits comme avant, ils sont juste masqués) :
     rallumer une ligne = enlever son sélecteur d'ici. Le camembert d'airtime est un rescapé — sans
     lui on explose en vol sans prévenir. */
  body.touch #money,body.touch #speedo,body.touch #styleBar,
  body.touch #msg,body.touch #trickBox,body.touch #chainHud,body.touch #caseHud,
  body.touch #survHud,body.touch #lastAlert,body.touch #engVig,
  body.touch #nitroLbl,body.touch #record,body.touch .bill,body.touch #scan,body.touch #beatFx,
  body.touch #auraHud{display:none!important} /* ⚠ l'AURA suit la règle de l'écran nu : elle est née APRÈS ce bloc (17/08), elle n'y était donc pas — sans cette ligne la jauge or restait plantée seule au milieu d'un écran qu'on a vidé exprès */
  /* ⚠ LA MINI-CARTE ET LES 4 BOUTONS ÉPARPILLÉS — RETIRÉS PARTOUT, PAS SEULEMENT SUR TOUCH
     (2026-09-05) : retour du user — « enlève la mini app, déplace tous les boutons du gameplay,
     par un petit logo réglages qui inclue tous les boutons qu'on vient de supprimer ». `#minimap`
     était déjà masquée côté mobile (l'écran nu, juste au-dessus) ; DESKTOP suit maintenant la même
     route, ET les 3 boutons (`#resetBtn`/`#sndBtn`/`#musBtn`) rejoignent le même sort — ils
     ne DISPARAISSENT PAS du code (`sndBtnEl.click()` etc restent le point de vérité unique, voir
     `panOpen`/le panneau plus bas), ils deviennent juste invisibles PARTOUT : `#tGear`/`#tPanel`
     (déjà construit pour le mobile) est le SEUL point d'entrée visuel désormais, sur les deux
     plateformes. Un élément `display:none` répond toujours à `.click()` appelé depuis le JS — rien
     à changer côté logique, seulement côté vue. */
  #minimap,#resetBtn,#sndBtn,#musBtn{display:none!important}
  /* ------- LE BOUTON DE RÉGLAGES : un seul, en haut à droite, et son panneau — DESKTOP COMPRIS
     (2026-09-05) : gaté sur `body.play` (déjà synchronisé pour les DEUX plateformes par le tick de
     `setInterval` plus bas) plutôt que sur `body.touch` — ce N'ÉTAIT PAS un bouton tactile, c'était
     juste le SEUL endroit qui avait déjà réglé le problème que le desktop vient de poser à son tour. */
  #tSet{display:none}
  body.play #tSet{display:block}
  /* ⚠ « VOLANT » N'A RIEN À FAIRE SUR DESKTOP (2026-09-05) : ce panneau s'affiche maintenant aux
     DEUX plateformes (voir `body.play #tSet` plus haut), mais `data-a="ctl"` ne fait que basculer le
     PAD TACTILE en joystick — zéro sens sans écran tactile. SON/VOIX/MUSIQUE/IMAGE/SURVIVANT/
     RECOMMENCER restent universels ; seul CE bouton-là est spécifique au doigt. */
  body:not(.touch) [data-a="ctl"]{display:none}
  /* la jauge de nitro monte SOUS le ciel : en bas elle barrait la caisse en travers, en haut elle ne
     masque rien et se lit d'un coup d'œil. C'est le dernier élément de HUD. */
  body.touch:not(.play) #nitroWrap,body.touch:not(.play) #airPie{display:none} /* hors partie, l'écran n'appartient qu'au menu */
  body.touch #nitroWrap{left:calc(var(--ccL,env(safe-area-inset-left,0px)) + 14px);right:calc(var(--ccR,env(safe-area-inset-right,0px)) + 64px);
    width:auto;transform:none;bottom:auto;top:calc(var(--ccT,env(safe-area-inset-top,0px)) + 18px)} /* sous l'encoche / la Dynamic Island, comme le ⏸ */
  body.touch #styleBar{height:6px;margin-bottom:4px}
  body.touch #airPie{top:13%;right:5%;width:76px;height:76px}
  /* ------- LES NIVEAUX (2026-09-24) : la bannière « NIVEAU n — LIEU ». Au-dessus de la route, dans le
     ciel ; un FONDU d'opacité et rien d'autre (aucun mouvement : REDUCED_MOTION n'a rien à couper).
     `max-width` + `white-space:normal` : sur un téléphone de 375 px, « AU-DESSUS DE LA VILLE » passe
     sur deux lignes au lieu de sortir de l'écran. ------- */
  #lvlBan{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:7;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:9px;width:max-content;max-width:88vw;
    font-family:var(--pix);text-align:center;opacity:0;transition:opacity .45s}
  #lvlBan.on{opacity:1}
  #lvlBan b{font-size:clamp(20px,6.4vw,36px);letter-spacing:.16em;color:#ffd75e;
    text-shadow:0 3px 0 #7a4400,0 0 24px rgba(255,200,90,.45)}
  #lvlBan span{font-size:clamp(9px,2.7vw,14px);letter-spacing:.2em;line-height:1.7;color:#9fe8ff;white-space:normal;
    text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 14px rgba(120,220,255,.45)}
  /* ------- PORTRAIT : L'ORIENTATION NORMALE DU JEU (le paysage n'est plus qu'un repli) ------- */
  @media (orientation:portrait){
    body.touch #tSteer{width:52%}
    body.touch #tNitro{width:min(128px,17vh);height:min(128px,17vh);right:calc(var(--ccR,env(safe-area-inset-right,0px)) + 14px);bottom:calc(var(--ccB,env(safe-area-inset-bottom,0px)) + 18px)}
    body.touch #airPie{top:15%;right:5%;width:76px;height:76px}
  }
  /* ------- RESPONSIVE : écrans étroits / mobile — le HUD ne se chevauche plus ------- */
  @media (max-width:820px){
    /* barre du haut : ARGENT à gauche, boutons compacts à droite → plus de collision */
    #money{left:10px;transform:none;top:10px;padding:6px 11px;border-radius:10px}
    #moneyTxt{font-size:18px;letter-spacing:1px}
    .blabel{display:none} /* mobile : boutons en ICÔNES seules (emoji) — compacts, premium, plus de collision */
    .sndBtn,#resetBtn{font-size:15px;padding:7px 9px;border-width:1px;line-height:1}
    #resetBtn{top:12px;right:10px}
    #sndBtn{top:12px;right:54px}
    #musBtn{top:12px;right:142px}
    /* feedbacks : plus petits pour ne pas barrer tout l'écran */
    #msg{font-size:15px}
    .trick{font-size:13px}.trick.big,.trick.m1{font-size:19px}.trick.m2{font-size:23px}.trick.m3{font-size:29px}
    #chainHud{font-size:12px;padding:4px 11px}#caseHud{font-size:12px;padding:3px 10px}
    /* le pouce a besoin de l'écran : la vignette rétrécit et se cale sous l'argent */
    #engVig{top:56px;left:10px;width:118px;height:80px;border-radius:9px}
    #engVigCap{font-size:5px;padding:3px 4px 4px}#engVigTier{font-size:4px}
  }

  /* ======================= LA CHARTE PIXEL UNIFIÉE (2026-09-24) =======================
     Demande du user : « travaille correctement la DA de chaque bouton, de chaque croix, de chaque texte
     pour qu'ils soient tous cohérents entre eux — inspiration le titre CASH CAR ». Audit (voir le commit) :
     trois familles de boîtes cohabitaient (plaques d'arcade octogonales, cartes arrondies à liseré, ronds),
     deux polices (pixel + police système sur la fiche du garage, les descriptions, le classement), et tous
     les symboles (✕ ◀ ▶ ⚙ ⏸ ★ ✓ 🔒 🏎 🏁 🔊…) sortaient de la police du système ou des emojis.
     LA RÈGLE, UNE FOIS POUR TOUTES :
       · UNE police : Press Start 2P, partout — y compris les phrases (en petit, interligne large).
       · UN vocabulaire de boîte : la PLAQUE D'ARCADE (`.pbtn`) pour ce qui se touche, le CADRE (même coupe
         octogonale, même biseau, sans épaisseur) pour ce qui se lit. Zéro coin arrondi, zéro verre dépoli.
       · Les TITRES parlent comme le logo : or dégradé, extrusion pixel brune dessous.
       · Les ICÔNES sont des grilles 9 × 9 (`.pxi`), à l'échelle ENTIÈRE (×1, ×2, ×3 : `--pxs`) pour rester nettes.
       · L'ÉTAT se lit dans une PASTILLE (`.etat` : or = actif / valeur, gris = coupé) — un bouton ne se
         grise plus parce que son réglage vaut « RAPIDE ».
     Ce bloc vient EN DERNIER : il gagne sur les règles historiques sans les réécrire une à une. */
  :root{--or:#ffd75e;--orF:#7a4400;--cyan:#9fe8ff;--cyanL:rgba(0,234,255,.42);--cyanF:#06122e;
    --texte:#d9d2f2;--texteF:#a79ed0;
    --plaque:linear-gradient(180deg,#22305c,#141d3a);--cadre:linear-gradient(180deg,#1a2248,#0e1329);
    --coupe7:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);
    --biseau:inset 0 0 0 2px var(--cyanL),inset 3px 3px 0 rgba(255,255,255,.10),inset -3px -3px 0 rgba(0,0,0,.45);
    --ttrOr:linear-gradient(180deg,#fffbe8,#ffd75e 45%,#ff9d2e 82%,#8a4d00)}
  /* ---- les icônes ---- */
  .pxi{display:inline-block;flex:none;width:calc(9px*var(--pxs,2));height:calc(9px*var(--pxs,2));
    vertical-align:middle;margin-top:-.2em;background:currentColor;font-style:normal;
    -webkit-mask:var(--pxi) center/100% 100% no-repeat;mask:var(--pxi) center/100% 100% no-repeat}
  /* ---- LES PLAQUES CARRÉES : croix de fermeture, flèches, retour — la même touche d'arcade, en carré ---- */
  #settings #setClose{width:46px;height:46px;border:0;border-radius:0;
    background:var(--plaque);color:var(--cyan);font-size:0;clip-path:var(--coupe7)}
  /* ---- LES TITRES D'ÉCRAN : ils parlent comme le logo ---- */
  #setHead>span{font-family:var(--pix);font-weight:400;letter-spacing:4px;
    background:var(--ttrOr);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 #5c3600) drop-shadow(0 2px 0 #2a1500);text-shadow:none}
  #setHead>span{font-size:14px}
  /* ---- LES CLASSEMENTS : cadres, pas des verres dépolis ---- */
  #lbBox{border:0;border-radius:0;background:var(--cadre);clip-path:var(--coupe7);box-shadow:var(--biseau)}
  .lbTitle .pxi{--pxs:1;margin-right:4px}
  .lbEmpty{font-family:var(--pix);font-size:7px;line-height:2;color:var(--texteF)}
  .lbRow.hl{border-radius:0}
  /* ---- LE PANNEAU ⚙ / PAUSE : icône · libellé · pastille, alignés comme une ligne de menu d'arcade ---- */
  #tGear,#tSet #tGear{--pxs:2;font-size:0}
  .tbtn{--pxs:3}
  #epGear .pxi{--pxs:2}
  /* ---- LES RÉGLAGES DE L'ORDINATEUR : même cadre, même police que le téléphone ---- */
  #setCard{border-radius:0;background:var(--cadre);clip-path:var(--coupe7);box-shadow:var(--biseau);
    -webkit-backdrop-filter:none;backdrop-filter:none;font-family:var(--pix);font-size:9px;letter-spacing:1px}
  #setCard .setRow{border-radius:0;font-size:9px}
  .setKeys i .pxi{--pxs:1}
  #settings .setRow b{border-radius:0;font-family:var(--pix);font-size:8px;letter-spacing:1px;padding:6px 8px;
    color:var(--or);background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 2px rgba(255,215,94,.4)}
  #settings .setRow b.off{color:#7b8799;box-shadow:inset 0 0 0 2px rgba(120,132,150,.35)}
  #settings .setSec{font-family:var(--pix);font-size:8px;letter-spacing:3px;color:#b3a8e6}
  #settings .setKeys{font-size:7px;line-height:2;gap:10px 14px;color:var(--texte)}
  #settings .setKeys i{border-radius:0;font-size:8px;padding:5px 7px;color:#fff}
  #bestChip{border:0;background:var(--cadre);box-shadow:var(--biseau);clip-path:var(--coupe7)}
  .saveBtn .pxi{--pxs:1}
  /* les pictos des plaques du menu ordinateur : fini les emojis en ::before, place aux icônes pixel */
  .saveBtn.majeur::before,#setBtn::before{content:'';display:inline-block;width:18px;height:18px;margin-right:10px;
    vertical-align:middle;background:currentColor;filter:none;font-size:0;
    -webkit-mask:var(--pxi-voiture) center/100% 100% no-repeat;mask:var(--pxi-voiture) center/100% 100% no-repeat}
  #setBtn::before{-webkit-mask-image:var(--pxi-reglages);mask-image:var(--pxi-reglages)}
  /* ---- LE LOGO RETROUVE SON OR (2026-09-24) ----
     ⚠ BUG D'EMPILEMENT, présent depuis que les lettres portaient leur lueur : `filter` sur `.lg.gold` crée un
     CONTEXTE D'EMPILEMENT, donc l'extrusion brune (`::before`, z-index −1) se peignait AU-DESSUS du dégradé or
     de la face (qui n'est qu'un fond découpé au texte) — on ne voyait plus que la tranche du haut, le logo
     paraissait brun. La lueur passe sur le CONTENEUR : l'extrusion repasse dessous, l'or de la face revient. */
  .lg.gold,.lg.grad{filter:none}
  #overlay h1:not(:hover),#spTitle:not(.boom),#launchLogo,#gPlayMain{filter:drop-shadow(0 0 .3em rgba(255,200,80,.42))}
  /* ---- les consignes : lisibles (contraste relevé), jamais criardes ---- */
  #tSteerHint{opacity:.72;color:#c8f4ff;white-space:nowrap;line-height:1.8} /* sur deux lignes, « TOURNER » venait chevaucher « GLISSE POUR » */
  #tNitro{flex-direction:column;--pxs:3}#tNitro .pxi{margin:0;filter:drop-shadow(0 2px 0 rgba(255,255,255,.35))}

  /* ======================= LA PASSE UX (2026-09-24) — audit mobile, 17 points =======================
     Tailles : 44 pt partout (Apple). Textes : 8 px minimum. Parcours : menu d'abord, REJOUER direct.
     Transitions : 180 ms, JAMAIS sous « Réduire les animations ». */
  /* le VOLANT se montre au premier départ : un anneau-fantôme là où naît le stick, jusqu'au premier braquage */
  @keyframes volantInvite{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}
  body.touch.play #tSteer:not(.used)::after{content:'';position:absolute;left:calc(50% - 46px);bottom:calc(var(--ccB,env(safe-area-inset-bottom,0px)) + 96px);
    width:92px;height:92px;border-radius:50%;border:3px dashed rgba(159,232,255,.55);pointer-events:none;animation:volantInvite 1.6s ease-in-out infinite}
  body.tpad #tSteer::after{display:none}

<!-- ================= LE MOUCHARD : un écran noir ne doit JAMAIS rester muet =================
     ⚠ IL EST DANS SON PROPRE <script>, ET C'EST TOUT L'INTÉRÊT. Le capteur d'erreur du jeu vit DANS
     le grand script : si celui-ci meurt au PARSING (une accolade de travers, une syntaxe que le
     navigateur du joueur ne connaît pas), pas une ligne ne s'exécute — capteur compris — et le
     joueur reçoit un rectangle noir sans un mot. Ici, on est déjà chargé quand le jeu se présente.
     ⚠ ET IL A UN CHIEN DE GARDE, pas seulement un capteur : la panne la plus fréquente d'un fichier
     autonome n'est pas une exception bruyante, c'est un démarrage qui n'arrive jamais (WebGL refusé,
     mémoire, un navigateur qui bloque une API en file://). Aucune erreur n'est levée dans ce cas —
     il n'y a qu'un silence. Le chien de garde transforme ce silence en diagnostic lisible. -->
<script>
/* UNE SEULE POLICE (2026-10-15, Sacha : « chaque texte du jeu doit avoir la bonne police […] il faut pas que je te le répète ») —
   LE FILET DES CANVAS. Les textes DESSINÉS (billets, carte bancaire, montre et pièces de la boutique, « wow » du DOGE…) échappent au
   CSS. Toute police de canvas qui n'est pas Press Start 2P est réécrite ici en Press Start 2P, à 62 % du corps demandé (la chasse pixel
   est ~1,6 fois plus large qu'une Helvetica : le mot garde sa largeur) et sans gras (la police n'en a pas : un gras se synthétise et bave).
   Les textures écrites pour le pixel passent telles quelles. Une police qu'on écrit demain dans un canvas est donc pixel d'office.
   apresPolice(f) : dessine tout de suite, puis REDESSINE quand la police est chargée — une texture peinte au chargement de la page
   l'était sinon dans la police de secours. garde-charte.sh refuse une version sans ce filet ni le filet CSS (#policeUnique). */
(function UNE_POLICE(){try{const P=CanvasRenderingContext2D.prototype,D=Object.getOwnPropertyDescriptor(P,'font');if(!D||!D.set)return;

/* =====================================================================================================================

   globale mais prends des libertés ». Historique des rejets (ne pas y revenir) : v1 plate · v2 borne d'arcade 1985 ·
   v3 bonbon violet. La v4 (carbone penché, lingot d'or, néon) a posé l'IDENTITÉ ; la v5 la garde et en soigne la MAIN.

     (1) le sergé de carbone sur CHAQUE surface faisait un grain, une moire qui salissait tout ;

     (3) des corps de pixel au hasard (9, 10, 12, 14, 18, 22 px) et une chasse de 3-4 px qui étalait les mots ;
     (4) l'écran de mort empilait sept blocs du même poids ; la pause laissait un trou au milieu ;
     (5) en PAYSAGE, l'accueil s'entassait sous le logo, le garage cachait la caisse et coupait sa barre d'action.

     · LA LAQUE remplace le carbone : une laque noire-violette, lisse, avec un reflet oblique et une LÈVRE de lumière en
       haut — le tableau de bord d'une hypercar, la nuit. La texture ne vit plus que dans le FOND des écrans : une trame
       de points (la MATRICE) qui fait de la police pixel ce qu'elle est, un AFFICHEUR À LED ;
