<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CASH CAR — Menu</title>
<style>
  :root{
    --indigo:#0d0a1e;
    --violet:#2a1b4a;
    --rose:#7a1f5e;
    --corail:#ff6a3c;
    --ambre:#ffb040;
    --pink:#ff3d9e;
    --pink2:#f24aa0;
    --cyan:#5ee7ff;
    --blue:#4f74e8;
    --gold:#ffd17a;
    --ink:#f4eefc;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
    background:var(--indigo);
    color:var(--ink);
    user-select:none;
    -webkit-user-select:none;
  }

  /* ---------- SKY ---------- */
  .sky{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(120% 80% at 50% -20%, #241a4d 0%, rgba(36,26,77,0) 55%),
      linear-gradient(180deg,
        #0d0a1e 0%,
        #161031 30%,
        #2a1b4a 55%,
        #4a1f5c 72%,
        #7a1f5e 84%,
        #c4386e 94%,
        #ff6a3c 100%);
  }
  .sun{
    position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
    width:min(72vmin,460px);height:min(72vmin,460px);
    border-radius:50%;
    background:radial-gradient(circle at 50% 55%,
      #ffb36a 0%,#ff8a4c 22%,#ff6a3c 42%,rgba(255,106,60,.35) 58%,rgba(255,106,60,0) 72%);
    filter:blur(2px);
    animation:sunPulse 7s ease-in-out infinite;
    mix-blend-mode:screen;
  }
  @keyframes sunPulse{0%,100%{opacity:.85}50%{opacity:1}}

  #stars{position:absolute;inset:0;z-index:0}

  /* horizon garland + skyline */
  .garland{
    position:absolute;left:0;right:0;bottom:15%;
    height:2px;
    background:linear-gradient(90deg,transparent,#ff3d9e 20%,#5ee7ff 50%,#ff3d9e 80%,transparent);
    filter:blur(.5px) drop-shadow(0 0 12px rgba(255,61,158,.8));
    opacity:.8;
    animation:garlandShift 8s ease-in-out infinite;
  }
  @keyframes garlandShift{0%,100%{opacity:.65}50%{opacity:.95}}
  .skyline{
    position:absolute;left:0;right:0;bottom:15%;
    height:14vmin;opacity:.28;
    background:
      repeating-linear-gradient(90deg,
        transparent 0,#0a0718 4px,#0a0718 9vmin,transparent 9vmin 13vmin);
    -webkit-mask-image:linear-gradient(180deg,#000,transparent);
    mask-image:linear-gradient(180deg,#000,transparent);
  }

  /* ---------- HAZE ---------- */
  .haze{
    position:fixed;left:0;right:0;bottom:0;height:32vh;z-index:1;
    background:linear-gradient(180deg,transparent,rgba(61,18,54,.35));
    pointer-events:none;
  }

  /* ---------- ROAD ---------- */
  .road-wrap{
    position:fixed;left:0;right:0;bottom:0;height:22vh;z-index:2;
    perspective:900px;pointer-events:none;
  }
  .road{
    position:absolute;left:50%;bottom:-4vh;width:130vmin;height:64vh;
    transform:translateX(-50%) rotateX(62deg);transform-origin:top center;
    background:linear-gradient(180deg,#2b2937 0%,#1c1a28 100%);
    clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);
    box-shadow:inset 0 0 80px rgba(0,0,0,.6);
  }
  .road::after{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(90deg,
        transparent 0, transparent 47%,
        #f24aa0 47%,#f24aa0 53%, transparent 53%, transparent 100%);
    opacity:.85;filter:drop-shadow(0 0 6px rgba(242,74,160,.9));
    animation:roadRun 1.6s linear infinite;
  }
  @keyframes roadRun{from{background-position-y:0}to{background-position-y:44vh}}

  /* ---------- UI ---------- */
  .ui{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;
      padding:max(20px,env(safe-area-inset-top)) clamp(20px,5vw,64px)
              max(18px,env(safe-area-inset-bottom));}

  .topbar{display:flex;align-items:center;justify-content:space-between}
  .wordmark{display:flex;align-items:center;gap:12px}
  .logo{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(140deg,#ff3d9e,#ff6a3c);
    display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;
    box-shadow:0 0 22px rgba(255,61,158,.55);
  }
  .wordmark b{font-size:16px;letter-spacing:.18em;font-weight:800;
    background:linear-gradient(90deg,#ffd17a,#ff3d9e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lang{
    display:flex;gap:4px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .lang button{
    border:0;background:transparent;color:rgba(244,238,252,.6);
    font:inherit;font-weight:700;font-size:13px;letter-spacing:.08em;
    padding:6px 14px;border-radius:999px;cursor:pointer;transition:.25s;
  }
  .lang button.active{background:linear-gradient(90deg,#ff3d9e,#ff6a3c);color:#fff;
    box-shadow:0 4px 16px rgba(255,61,158,.4)}

  .center{flex:1;display:flex;flex-direction:column;justify-content:center;
          align-items:flex-start;max-width:720px}

  .kicker{font-size:12px;font-weight:700;letter-spacing:.42em;text-transform:uppercase;
          color:var(--cyan);margin-bottom:14px;
          text-shadow:0 0 14px rgba(94,231,255,.7)}
  .title{
    font-size:clamp(64px,15vw,148px);font-weight:900;line-height:.88;letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff 0%,#ffd17a 34%,#ff3d9e 72%,#ff6a3c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 30px rgba(255,61,158,.35));
  }
  .title .car{
    display:block;font-style:italic;
    background:linear-gradient(180deg,#ff3d9e 0%,#ff6a3c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tagline{margin-top:22px;font-size:clamp(17px,2.4vw,23px);font-weight:600;color:rgba(244,238,252,.82);
           letter-spacing:.01em}
  .tagline em{font-style:normal;color:var(--gold)}

  .menu{margin-top:44px;display:flex;flex-direction:column;gap:14px;width:min(430px,100%)}
  .btn{
    position:relative;display:flex;align-items:center;justify-content:space-between;
    padding:20px 24px;border-radius:20px;cursor:pointer;border:1px solid transparent;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    transition:transform .18s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .btn .lbl{display:flex;flex-direction:column;gap:3px;text-align:left}
  .btn .lbl b{font-size:19px;font-weight:800;letter-spacing:.02em}
  .btn .lbl span{font-size:12.5px;font-weight:500;color:rgba(244,238,252,.55);letter-spacing:.02em}
  .btn .ico{font-size:22px;opacity:.85;transition:transform .18s ease}

  .btn.primary{
    background:linear-gradient(120deg,rgba(255,61,158,.95),rgba(255,106,60,.95));
    box-shadow:0 14px 40px rgba(255,61,158,.4), inset 0 1px 0 rgba(255,255,255,.35);
    color:#fff;
  }
  .btn.primary .lbl span{color:rgba(255,255,255,.75)}
  .btn.primary::before{
    content:"";position:absolute;inset:0;border-radius:20px;overflow:hidden;
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
    transform:translateX(-120%);animation:sheen 3.6s ease-in-out infinite;
  }
  @keyframes sheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}

  .btn.ghost{
    background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:var(--ink);
  }
  .btn:hover{transform:translateY(-3px)}
  .btn.primary:hover{box-shadow:0 20px 56px rgba(255,61,158,.55), inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.ghost:hover{border-color:rgba(94,231,255,.5);box-shadow:0 10px 30px rgba(94,231,255,.15)}
  .btn:active{transform:translateY(-1px) scale(.985)}
  .btn:hover .ico{transform:translateX(4px)}

  /* HUD teaser */
  .hud{
    position:absolute;bottom:6vh;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:12px;z-index:6;
    background:rgba(13,10,30,.45);border:1px solid rgba(255,255,255,.12);
    border-radius:18px;padding:12px 18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  .chip{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px}
  .chip .k{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,238,252,.5)}
  .chip .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .chip .v.coin{color:var(--gold);text-shadow:0 0 14px rgba(255,209,122,.6)}
  .nitro{display:flex;flex-direction:column;gap:5px;min-width:120px}
  .nitro .k{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,238,252,.5)}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
  .bar i{position:absolute;inset:0;width:72%;border-radius:99px;
         background:linear-gradient(90deg,#5ee7ff,#4f74e8);
         box-shadow:0 0 14px rgba(94,231,255,.7)}

  @media (max-width:640px){
    .hud{display:none}
    .title{font-size:clamp(60px,20vw,120px)}
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <canvas id="stars"></canvas>
  <div class="skyline"></div>
  <div class="garland"></div>
  <div class="sun"></div>
  <div class="haze"></div>
  <div class="road-wrap"><div class="road"></div></div>

  <div class="ui">
    <div class="topbar">
      <div class="wordmark">
        <div class="logo">⚡</div>
        <b>CASH CAR</b>
      </div>
      <div class="lang">
        <button class="active">FR</button>
        <button>EN</button>
      </div>
    </div>

    <div class="center">
      <div class="kicker">Arcade Runner — Dans le ciel</div>
      <h1 class="title">CASH<span class="car">CAR</span></h1>
      <p class="tagline">Conduis. Saute. <em>Encaisse.</em></p>

      <div class="menu">
        <div class="btn primary">
          <div class="lbl"><b>JOUER</b><span>Lance-toi dans la nuit</span></div>
          <div class="ico">→</div>
        </div>
        <div class="btn ghost">
          <div class="lbl"><b>GARAGE</b><span>15 caisses à débloquer</span></div>
          <div class="ico">⌁</div>
        </div>
        <div class="btn ghost">
          <div class="lbl"><b>RÉGLAGES</b><span>Son · Langue · Image</span></div>
          <div class="ico">⚙</div>
        </div>
      </div>
    </div>

    <div class="hud">
      <div class="chip"><span class="k">Vitesse</span><span class="v">218</span></div>
      <div class="chip"><span class="k">Pièces</span><span class="v coin">1 248</span></div>
      <div class="nitro"><span class="k">Nitro</span><div class="bar"><i></i></div></div>
    </div>
  </div>

<script>
  // ---- starfield ----
  const cv=document.getElementById('stars'),cx=cv.getContext('2d');
  let W,H,stars=[];
  function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;}
  resize();addEventListener('resize',resize);
  const N=110;
  for(let i=0;i<N;i++){
    stars.push({x:Math.random(),y:Math.random()*0.7,z:Math.random(),r:.4+Math.random()*1.3,
                ph:Math.random()*Math.PI*2,sp:.6+Math.random()*1.8});
  }
  let t=0;
  (function loop(){
    t+=0.016;cx.clearRect(0,0,W,H);
    for(const s of stars){
      const tw=.45+.55*Math.sin(t*s.sp+s.ph);
      const a=tw*(0.25+s.z*0.75);
      cx.beginPath();
      cx.fillStyle=`rgba(255,255,255,${a})`;
      cx.arc(s.x*W,s.y*H,s.r*devicePixelRatio,0,7);
      cx.fill();
    }
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
