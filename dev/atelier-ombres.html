<!DOCTYPE html>
<!-- ATELIER OMBRES — banc d'essai GOLDEN HOUR RASANTE : mêmes réglages que index.html
     (SUN_DIR, lights, fog contre-jour, ACES split-tone, bloom, shadow map ortho, rim fresnel).
     Vue 3/4 latérale : le soleil racle, les ombres s'étirent, le rim dessine la tôle. -->
<html lang="fr"><head><meta charset="utf-8"><title>Atelier ombres — golden hour</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}
#hud{position:fixed;top:10px;left:10px;color:#ffe;font:12px monospace;background:rgba(0,0,0,.35);padding:8px 10px;border-radius:6px;white-space:pre}</style>
</head><body>
<div id="hud">GOLDEN HOUR — ombres longues + rim doré
[1] vue 3/4 arrière  [2] plein travers  [3] contre-jour</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
const scene=new THREE.Scene();
const SUN_DIR=new THREE.Vector3(.38,.13,-.90).normalize(); // identique au jeu
// --- ciel : dégradé du jeu, version condensée ---
const skyU={uSunDir:{value:SUN_DIR}};
scene.add(new THREE.Mesh(new THREE.SphereGeometry(4300,48,28),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,
  vertexShader:'varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'varying vec3 vDir;uniform vec3 uSunDir;void main(){float y=vDir.y;\
vec3 col=mix(vec3(1.,.89,.72),vec3(1.,.78,.47),smoothstep(.015,.06,y));\
col=mix(col,vec3(1.,.67,.48),smoothstep(.05,.15,y));col=mix(col,vec3(.97,.63,.69),smoothstep(.13,.30,y));\
col=mix(col,vec3(.71,.54,.72),smoothstep(.26,.45,y));col=mix(col,vec3(.50,.79,.83),smoothstep(.42,.75,y));\
col=mix(vec3(1.,.79,.63),col,smoothstep(-.10,.015,y));col=mix(vec3(.35,.33,.44),col,smoothstep(-.85,-.12,y));\
float sd=max(dot(vDir,uSunDir),0.);col+=vec3(1.,.62,.32)*pow(sd,5.)*.45;col+=vec3(1.,.82,.55)*pow(sd,40.)*.80;col+=vec3(1.,.96,.88)*pow(sd,520.)*1.1;\
gl_FragColor=vec4(col,1.);}'})));
scene.fog=new THREE.Fog(0xffc9a0,420,2600);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,9800);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
// --- lumières du jeu ---
scene.add(new THREE.HemisphereLight(0xffd9c0,0x7a6f8e,1.0));
const sun=new THREE.DirectionalLight(0xffb87a,1.0);sun.position.copy(SUN_DIR).multiplyScalar(160);scene.add(sun);
const fill=new THREE.DirectionalLight(0x8a7fa0,.28);fill.position.set(-200,-400,-100);scene.add(fill);
// --- ombres : réglages EXACTS du jeu ---
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const SC=sun.shadow.camera;SC.left=-34;SC.right=34;SC.top=30;SC.bottom=-64;SC.near=40;SC.far=340;SC.updateProjectionMatrix();
sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.08;
scene.add(sun.target);
// --- post : ACES split-tone + bloom du jeu ---
const ACESShader={uniforms:{tDiffuse:{value:null},uExposure:{value:0.92},uSat:{value:1.07}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform sampler2D tDiffuse;uniform float uExposure;uniform float uSat;varying vec2 vUv;\
vec3 aces(vec3 x){const float a=2.51,b=.03,c=2.43,d=.59,e=.14;return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.,1.);}\
void main(){vec4 t=texture2D(tDiffuse,vUv);vec3 c=aces(t.rgb*vec3(1.045,1.,.955)*uExposure);\
float l=dot(c,vec3(.2126,.7152,.0722));c=mix(vec3(l),c,uSat);\
c+=vec3(.018,.012,.028)*(1.-smoothstep(0.,.30,l));gl_FragColor=vec4(c,t.a);}'};
const composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));
composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.58,0.5,0.82));
const acesPass=new THREE.ShaderPass(ACESShader);acesPass.renderToScreen=true;composer.addPass(acesPass);
// --- rim golden hour (snippet du jeu) ---
const RIM_U={uRimC:{value:new THREE.Color(0xffd9a0)},uRimStr:{value:.55},uRimPow:{value:3.0},uSunV:{value:new THREE.Vector3()}};
function rimify(m){m.onBeforeCompile=function(sh){
  sh.uniforms.uRimC=RIM_U.uRimC;sh.uniforms.uRimStr=RIM_U.uRimStr;sh.uniforms.uRimPow=RIM_U.uRimPow;sh.uniforms.uSunV=RIM_U.uSunV;
  sh.fragmentShader=sh.fragmentShader
    .replace('#include <common>','#include <common>\nuniform vec3 uRimC;uniform vec3 uSunV;uniform float uRimStr;uniform float uRimPow;')
    .replace('#include <dithering_fragment>',
      'float rimF=pow(1.-saturate(dot(normalize(normal),normalize(vViewPosition))),uRimPow);\n'+
      'rimF*=smoothstep(-.25,.55,dot(normalize(normal),uSunV));\n'+
      'gl_FragColor.rgb+=uRimC*rimF*uRimStr;\n#include <dithering_fragment>');};}
// --- la dalle : bitume du jeu (spéculaire chaud) ---
const road=new THREE.Mesh(new THREE.BoxGeometry(20,1.4,340),
  new THREE.MeshPhongMaterial({color:0x565656,shininess:48,specular:0x8a6f52}));
road.position.y=-.7;road.receiveShadow=true;scene.add(road);
// bandes blanches
for(const sd of[-1,1]){const b=new THREE.Mesh(new THREE.BoxGeometry(.6,.02,340),new THREE.MeshBasicMaterial({color:0xffffff}));
  b.position.set(sd*9.4,.02,0);scene.add(b);}
// --- une caisse type jeu (hot hatch rouge) ---
function mkCar(cx,cz,col,acc){
  const g=new THREE.Group();
  const bodyM=new THREE.MeshPhongMaterial({color:col,emissive:col,emissiveIntensity:.10,shininess:110,specular:0xc4ccd4});
  const accM=new THREE.MeshPhongMaterial({color:acc,emissive:acc,emissiveIntensity:.08,shininess:88,specular:0xdddddd});
  const darkM=new THREE.MeshPhongMaterial({color:0x14161a,shininess:60,specular:0x333333});
  const glassM=new THREE.MeshPhongMaterial({color:0x0d1620,shininess:300,specular:0xffffff});
  rimify(bodyM);rimify(accM);
  const lower=new THREE.Mesh(new THREE.BoxGeometry(1.85,.47,3.9),bodyM);lower.position.y=.58;g.add(lower);
  const hood=new THREE.Mesh(new THREE.BoxGeometry(1.74,.23,1.33),bodyM);hood.position.set(0,.78,1.17);hood.rotation.x=.07;g.add(hood);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.44,.42,1.56),glassM);cab.position.set(0,.98,-.2);g.add(cab);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(1.33,.07,1.33),accM);roof.position.set(0,1.19,-.2);g.add(roof);
  for(const sxz of[[-1,1],[1,1],[-1,-1],[1,-1]]){
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.32,14),darkM);
    w.rotation.z=Math.PI/2;w.position.set(sxz[0]*.93,.4,sxz[1]*1.25);g.add(w);}
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  g.position.set(cx,0,cz);scene.add(g);return g;
}
const car=mkCar(0,0,0xc23b2e,0x701f18);
mkCar(-6,-26,0xe8e8e8,0x999999).rotation.y=.12; // coupé blanc un peu derrière
// plots + épave
const coneM=new THREE.MeshPhongMaterial({color:0xff7a1a,emissive:0x8a2f00,emissiveIntensity:.3,shininess:70,specular:0xffe9d0});
for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(.055,.3,.95,10),coneM);
  c.position.set(5.5-i*1.1,.5,14+i*7);c.castShadow=true;scene.add(c);}
// --- vues ---
const VIEWS={'1':[[-6,2.4,9],[0,.7,-6]],'2':[[-12,2.6,2],[2,.6,-4]],'3':[[0,2.2,-13],[0,1.2,8]]};
function setView(k){const v=VIEWS[k];camera.position.set(v[0][0],v[0][1],v[0][2]);camera.lookAt(v[1][0],v[1][1],v[1][2]);}
setView('1');
addEventListener('keydown',e=>{if(VIEWS[e.key])setView(e.key);});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
// --- boucle : la fenêtre d'ombre suit la caisse (snap texel, comme le jeu) ---
const SUN_PERP=new THREE.Vector3().crossVectors(SUN_DIR,new THREE.Vector3(0,1,0)).normalize();
const SUN_UP=new THREE.Vector3().crossVectors(SUN_PERP,SUN_DIR).normalize(),shadV=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  const ts=68/2048;
  shadV.copy(car.position);
  shadV.addScaledVector(SUN_PERP,Math.round(shadV.dot(SUN_PERP)/ts)*ts-shadV.dot(SUN_PERP));
  shadV.addScaledVector(SUN_UP,Math.round(shadV.dot(SUN_UP)/ts)*ts-shadV.dot(SUN_UP));
  sun.target.position.copy(shadV);
  sun.position.copy(shadV).addScaledVector(SUN_DIR,160);
  sun.target.updateMatrixWorld();
  RIM_U.uSunV.value.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse);
  composer.render();
}
loop();
</script>
</body></html>
